<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D2340">
<title>EW Saathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/ew-192.png">
<link rel="apple-touch-icon" href="icon-180.png"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EW Saathi"/>
<meta name="description" content="Energy World partner app - points, rates and updates">
<script src="../ew-config.js"></script>
<style>
:root{
  --ink:#0D2340; --ink-2:#1F3A5F; --paper:#F4F6F9; --card:#FFFFFF; --line:#DCE3EA;   /* 11 Oct 2026 - the visiting card */
  --brass:#C9A24A; --brass-dim:#9A7A33; --verdigris:#1F3A5F; --rust:#9E4A32; --muted:#5E6875;
  --display:'Barlow Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --data:'IBM Plex Mono',ui-monospace,monospace;
  --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);font-family:var(--body);color:var(--ink);
     -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#app{max-width:460px;margin:0 auto;min-height:100dvh;background:var(--paper);
     display:flex;flex-direction:column;position:relative}

/* masthead */
header{position:sticky;top:0;z-index:30;background:var(--ink);color:var(--paper);
       padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;
       align-items:center;gap:10px}
header .mark{width:30px;height:30px;border:1.5px solid var(--brass);border-radius:50%;
       display:grid;place-items:center;font-family:var(--display);font-size:15px;
       color:var(--brass);letter-spacing:.5px;flex:none}
header h1{font-family:var(--display);font-size:20px;font-weight:600;margin:0;
       letter-spacing:.6px;text-transform:uppercase;line-height:1}
header .who{font-size:12px;color:#9FB0AA;margin-top:2px;line-height:1}
header .tier{margin-left:auto;font-family:var(--data);font-size:12px;
       border:1px solid var(--brass-dim);color:var(--brass);padding:3px 7px;
       border-radius:99px;text-transform:uppercase;letter-spacing:.8px;flex:none}

main{flex:1;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      padding:14px;margin-bottom:12px}
.eyebrow{font-family:var(--data);font-size:12px;letter-spacing:1.4px;
      text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h2.sec{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.4px;
      text-transform:uppercase;margin:20px 0 10px;color:var(--ink-2)}
h2.sec:first-child{margin-top:4px}
.mono{font-family:var(--data)}
.mut{color:var(--muted)}
.sm{font-size:12px}
.xs{font-size:12px}

/* gauge */
.gauge{text-align:center;padding:6px 0 2px}
.gauge svg{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
.big{font-family:var(--display);font-size:46px;font-weight:700;line-height:.9;
     color:var(--ink);letter-spacing:-.5px}
.big small{font-family:var(--data);font-size:12px;font-weight:500;letter-spacing:1.4px;
     color:var(--muted);display:block;margin-top:6px;text-transform:uppercase}
.rupeeline{font-family:var(--data);font-size:12px;color:var(--muted);margin-top:6px}

/* split stat */
.tbw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.tb{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
.tb th{font-family:var(--data);font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--paper)}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-family:var(--data);font-variant-numeric:tabular-nums}
.tb td:first-child{font-family:inherit}
.tb td.nm{font-family:inherit;white-space:normal;overflow-wrap:anywhere;min-width:110px}
.tb td.nm b{font-size:14px;color:var(--ink)}
.tb td.nm .xs{display:block;margin-top:2px;color:var(--muted)}
.tb tr.gh td{background:var(--ink);color:#fff;font-family:inherit;text-align:left;cursor:pointer;padding:10px 8px}
.tb tr.gh td b{font-size:14px}
.tb tr.tot td{font-weight:700;background:var(--paper)}
.tb tr.pr{cursor:pointer}
.tb tr.pr.on td{background:#EEF3F8}
.tb tr.act td{background:#EEF3F8;text-align:left}
.lv{display:inline-block;min-width:22px;padding:2px 7px;border-radius:999px;font-family:var(--data);font-size:12px;font-weight:700;color:#fff;text-align:center}
.lv-Platinum{background:#4A5866}.lv-Gold{background:#B8860B}.lv-Silver{background:#7D878F}.lv-Base{background:#1F3A5F}
/* 27 Oct 2026 - HIS WORDS: "color coding in saathi app, for partner standard wise". One colour per level, everywhere:
   Platinum slate, Gold gold, Silver silver-grey, Base Energy World blue. The partner's own app takes his colour. */
body[data-lv="Platinum"]{--lvc:#4A5866;--lvg:linear-gradient(135deg,#2F3A45,#7E8C99);--lvt:#EEF1F4}
body[data-lv="Gold"]{--lvc:#B8860B;--lvg:linear-gradient(135deg,#7A5806,#D9A92E);--lvt:#FBF3DC}
body[data-lv="Silver"]{--lvc:#7D878F;--lvg:linear-gradient(135deg,#5F6870,#AEB7BE);--lvt:#F1F3F5}
body[data-lv="Base"]{--lvc:#1F3A5F;--lvg:linear-gradient(135deg,#0D2340,#3B6EA5);--lvt:#EEF3F8}
body[data-lv] header{border-bottom:4px solid var(--lvc)}
header .tier:empty{display:none}
body[data-lv] header .tier{background:var(--lvc);border-color:var(--lvc);color:#fff;font-weight:700}
.lvcard{background:var(--lvg,#1F3A5F);color:#fff;border:0}
.lvcard .xs,.lvcard .sm{color:#fff}
body[data-lv] .lvedge{border-left:5px solid var(--lvc)}
body[data-lv] .tb tr.tot td{background:var(--lvt)}
.tb tr.pr td:first-child{border-left:5px solid transparent}
.tb tr.rl-Platinum td{background:#F3F5F7}.tb tr.rl-Platinum td:first-child{border-left-color:#4A5866}
.tb tr.rl-Gold td{background:#FDF8EA}.tb tr.rl-Gold td:first-child{border-left-color:#B8860B}
.tb tr.rl-Silver td{background:#F7F8F9}.tb tr.rl-Silver td:first-child{border-left-color:#7D878F}
.tb tr.rl-Base td:first-child{border-left-color:#1F3A5F}
.tb tr.gh.gl-Platinum td{background:#4A5866}.tb tr.gh.gl-Gold td{background:#B8860B}.tb tr.gh.gl-Silver td{background:#7D878F}.tb tr.gh.gl-Base td{background:#1F3A5F}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
       border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.split>div{background:var(--card);padding:11px 12px}
.split b{display:block;font-family:var(--data);font-size:19px;font-weight:600;color:var(--ink)}
.split span{font-family:var(--data);font-size:12px;letter-spacing:1.2px;
       text-transform:uppercase;color:var(--muted)}

/* progress */
.bar{height:5px;background:#DDE0D8;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--brass)}

/* rows */
.row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;
     border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .g{flex:1;min-width:0}
.row .t{font-size:13.5px;font-weight:500;line-height:1.3}
.row .s{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--data)}
.row .v{font-family:var(--data);font-size:14px;font-weight:600;text-align:right;
     white-space:nowrap;flex:none}
.pill{display:inline-block;font-family:var(--data);font-size:12px;letter-spacing:.8px;
     text-transform:uppercase;padding:2px 6px;border-radius:99px;border:1px solid;
     vertical-align:1px}
.p-hold{color:var(--rust);border-color:#D8B3A6;background:#F6E9E4}
.p-clear{color:var(--verdigris);border-color:#A9CBC1;background:#E4F0EB}
.p-paid{color:var(--muted);border-color:var(--line);background:#EDEFE9}
.p-back{color:#7A5B00;border-color:#DCC98C;background:#F6EFD9}

/* feed */
.bc{border:1px solid var(--line);border-radius:var(--r);background:var(--card);
    margin-bottom:12px;overflow:hidden}
.bc.new{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.bc .hd{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.bc .kind{font-family:var(--data);font-size:12px;letter-spacing:1.1px;text-transform:uppercase;
    padding:3px 7px;border-radius:99px;background:var(--ink);color:var(--paper)}
.bc .kind.scheme{background:var(--brass-dim)}
.bc .kind.product{background:var(--verdigris)}
.bc .when{margin-left:auto;font-family:var(--data);font-size:12px;color:var(--muted)}
.bc h3{font-family:var(--display);font-size:19px;font-weight:600;margin:8px 12px 0;
    letter-spacing:.3px;line-height:1.15}
.bc p{margin:7px 12px 0;font-size:13px;line-height:1.5;white-space:pre-wrap}
.bc img{width:100%;display:block;margin-top:10px;background:#DDE0D8}
.bc .ft{display:flex;gap:8px;padding:10px 12px 12px;align-items:center;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brass);flex:none}

/* buttons */
button{font-family:var(--body);font-size:13px;font-weight:500;cursor:pointer;
    border-radius:var(--r);border:1px solid var(--line);background:var(--card);
    color:var(--ink);padding:0 13px;min-height:38px;line-height:1}
button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.brass{background:var(--brass);color:#2A1C05;border-color:var(--brass-dim);font-weight:600}
button.ghost{background:transparent}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.45}
.wide{width:100%;justify-content:center}

/* stages */
.stg{border:1px solid var(--line);border-radius:var(--r);background:var(--card);
     margin-bottom:10px;overflow:hidden}
.stg.now{border-color:var(--verdigris);box-shadow:0 0 0 1px var(--verdigris) inset}
.stg .h{display:flex;gap:10px;align-items:baseline;padding:12px;cursor:pointer}
.stg .no{font-family:var(--display);font-size:24px;font-weight:700;color:var(--brass);
     line-height:.9;flex:none;width:30px}
.stg .h b{font-size:14px;font-weight:600;display:block;line-height:1.25}
.stg .h em{font-style:normal;font-family:var(--data);font-size:12px;color:var(--muted);
     display:block;margin-top:3px}
.stg .bd{padding:0 12px 12px 52px;display:none}
.stg.open .bd{display:block}
.say{border-left:2px solid var(--brass);padding:6px 0 6px 10px;margin:2px 0 10px;
     font-size:13px;line-height:1.5;color:var(--ink-2)}
.chip{display:inline-block;font-size:12px;font-family:var(--data);border:1px solid var(--line);
     background:var(--paper);border-radius:99px;padding:4px 9px;margin:0 5px 5px 0}

/* filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;
     scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{white-space:nowrap;min-height:32px;font-size:12px;padding:0 11px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;
    background:var(--ink);display:grid;grid-template-columns:repeat(5,1fr);
    padding-bottom:env(safe-area-inset-bottom);z-index:40;border-top:1px solid #2B4A44}
nav button{background:none;border:0;color:#7F918B;padding:9px 2px 8px;min-height:54px;
    display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:0;
    font-family:var(--data);font-size:12px;letter-spacing:.7px;text-transform:uppercase;
    position:relative}
nav button.on{color:var(--brass)}
nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}
nav .badge{position:absolute;top:6px;right:calc(50% - 17px);min-width:15px;height:15px;
    border-radius:99px;background:var(--rust);color:#fff;font-size:12px;line-height:15px;
    text-align:center;padding:0 3px;font-family:var(--data)}

/* misc */
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:13px;line-height:1.6}
.load{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--data);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:60;
    background:var(--ink);color:var(--paper);font-size:12.5px;padding:10px 16px;
    border-radius:99px;max-width:min(420px,92vw);text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.28)}
.hr{height:1px;background:var(--line);margin:14px 0}
a{color:var(--verdigris)}
.note{font-size:12px;line-height:1.55;color:var(--muted)}

/* ---------------- sign in ---------------- */
#gate{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--paper);
  display:none;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 20px 40px}
#gate.on{display:block}
.gwrap{max-width:340px;margin:0 auto}
.gmark{width:54px;height:54px;border:2px solid var(--brass);border-radius:50%;
  display:grid;place-items:center;font-family:var(--display);font-size:22px;
  color:var(--brass);letter-spacing:1px;margin:6vh auto 18px}
#gate h2{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.7px;
  text-transform:uppercase;margin:0 0 8px;text-align:center}
#gate .lede{font-size:13px;line-height:1.65;color:#9FB0AA;text-align:center;margin:0 0 22px}
#gate label{display:block;font-family:var(--data);font-size:12px;letter-spacing:1.4px;
  text-transform:uppercase;color:#9FB0AA;margin:0 0 6px}
#gate input{width:100%;font-size:16px;font-family:var(--data);letter-spacing:2px;
  min-height:50px;padding:12px 14px;border:1px solid #35514B;border-radius:var(--r);
  background:#162926;color:var(--paper);margin:0 0 16px}
#gate input:focus{outline:none;border-color:var(--brass)}
#gate button.go{width:100%;min-height:50px;font-size:15px;font-family:var(--display);
  letter-spacing:1.2px;text-transform:uppercase;font-weight:600;border:none;
  border-radius:var(--r);background:var(--brass);color:#231705;cursor:pointer}
#gate button.go[disabled]{opacity:.55}
#gate .lnk{display:block;width:100%;background:none;border:none;color:#9FB0AA;
  font-size:12.5px;font-family:var(--body);margin-top:16px;min-height:38px;
  cursor:pointer;text-decoration:underline}
.gerr{background:#3A1F19;border:1px solid var(--rust);color:#F0C7BB;font-size:12.5px;
  line-height:1.6;padding:11px 13px;border-radius:var(--r);margin:0 0 16px}
.gfoot{font-size:12px;color:#6F827C;text-align:center;margin-top:26px;line-height:1.7}

/* ---------------- save as an app ---------------- */
#inst{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--ink-2);
  color:var(--paper);border-top:1px solid var(--brass-dim);display:none;gap:9px;
  align-items:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
#inst.on{display:flex}
#inst .t{flex:1;min-width:0;font-size:12.5px;line-height:1.55}
#inst button{min-height:38px;padding:0 13px;font-size:13px;border-radius:var(--r);
  border:1px solid var(--brass);background:var(--brass);color:#231705;cursor:pointer;flex:none}
#inst button.x{background:none;color:#9FB0AA;border-color:#35514B;padding:0 11px}
#vbar{position:fixed;left:0;right:0;top:0;z-index:70;background:#2F6E5F;color:#F2F6F3;
  display:none;gap:9px;align-items:center;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  box-shadow:0 2px 10px rgba(0,0,0,.28)}
#vbar.on{display:flex}
#vbar .t{flex:1;min-width:0;font-size:12.5px;line-height:1.5}
#vbar button{min-height:38px;padding:0 12px;font-size:13px;border-radius:4px;
  border:1px solid #F2F6F3;background:#F2F6F3;color:#123028;cursor:pointer;flex:none;
  font-family:inherit}
#vbar button.x{background:none;color:#CFE0DA;border-color:#4E8B7C;padding:0 10px}
</style>
</head>
<body>
<script>
  /* ==EW-THEME== 11 Oct 2026 - DARK OR LIGHT, ON EVERY APP.
     HIS WORDS: "dark mode light mode for every app". Three settings, kept on this phone: Auto (follow the
     phone's own setting), Light, Dark. Dark is drawn by turning the finished page over (invert + hue turn) and
     turning pictures, logos and PDFs back, so every screen - including the thousands of colours written inline
     over the years - changes at once and nothing can be left white-on-white. Red stays red, green stays green.
     Changing it touches no data. */
  (function () {
    var K = "ewTheme";
    function ewtGet() { try { var v = localStorage.getItem(K); return v === "light" || v === "dark" ? v : "auto"; } catch (e) { return "auto"; } }
    function ewtOs() { try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); } catch (e) { return false; } }
    function ewtDark() { return false; } /* p746 12 Oct 2026: light only - his call, the inverted dark looked muddy */
    function ewtApply() {
      var r = document.documentElement; if (!r) return;
      r.setAttribute("data-ewdark", ewtDark() ? "1" : "0");
      try { var mt = document.querySelector('meta[name="theme-color"]'); if (mt) { if (!mt.getAttribute("data-light")) mt.setAttribute("data-light", mt.getAttribute("content") || ""); mt.setAttribute("content", ewtDark() ? "#11161D" : mt.getAttribute("data-light")); } } catch (e) { }
    }
    try {
      var st = document.createElement("style");
      st.textContent = 'html{background:#fff}.ewthm{display:none!important}' +
        'html[data-ewdark="1"]{filter:invert(.92) hue-rotate(180deg)}' +
        'html[data-ewdark="1"] .top{filter:invert(1) hue-rotate(180deg)}' +   /* the navy bar stays navy, as on the card */
        'html[data-ewdark="1"] img,html[data-ewdark="1"] video,html[data-ewdark="1"] canvas,html[data-ewdark="1"] iframe,html[data-ewdark="1"] embed,html[data-ewdark="1"] object,html[data-ewdark="1"] [data-noinvert]{filter:invert(1) hue-rotate(180deg)}' +
        '.ewthm{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border:1px solid #DCE3EA;border-radius:10px;background:#fff;color:#1F3A5F;font:inherit;font-size:14px;font-weight:700;cursor:pointer}';
      (document.head || document.documentElement).appendChild(st);
    } catch (e) { }
    ewtApply();
    try { var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)"); if (mq) { if (mq.addEventListener) mq.addEventListener("change", ewtApply); else if (mq.addListener) mq.addListener(ewtApply); } } catch (e) { }
    function ewtLabel() { var m = ewtGet(); return "&#9681; Theme: " + (m === "auto" ? "Auto (as the phone)" : m === "dark" ? "Dark" : "Light"); }
    window.ewTheme = {
      get: ewtGet, isDark: ewtDark, label: ewtLabel,
      set: function (m) { try { localStorage.setItem(K, m); } catch (e) { } ewtApply(); },
      next: function (btn) {
        var m = ewtGet(), n = m === "auto" ? "light" : m === "light" ? "dark" : "auto";
        window.ewTheme.set(n);
        if (btn) btn.innerHTML = ewtLabel();
      },
      button: function () { return '<button type="button" class="ewthm" onclick="ewTheme.next(this)">' + ewtLabel() + '</button>'; }
    };
  })();
</script>

<div id="app">
  <header>
    <div class="mark">EW</div>
    <div style="min-width:0">
      <h1 id="hTitle">EW Saathi</h1>
      <div class="who" id="hWho">...</div>
      <div class="who" id="hVer" style="opacity:.7;font-size:12px;margin-top:3px"></div>
    </div>
    <div class="tier" id="hTier"></div>
    <a id="hHelp" href="../help/saathi.html" target="_blank" rel="noopener" title="How to use this screen" aria-label="How to use this screen" onclick="this.href='../help/saathi.html#t-'+(TAB||'home')"
      style="flex:0 0 auto;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;text-decoration:none;margin-left:auto">?</a>
    <button id="hRef" onclick="ewRefresh()" title="Naya data aur naya version"
      style="margin-left:6px;flex:0 0 auto;background:rgba(255,255,255,.18);color:#fff;border:0;
             border-radius:10px;width:36px;height:36px;font-size:17px;line-height:1;cursor:pointer">&#8635;</button>
  </header>
  <main id="main"><div class="load">Opening...</div></main>
  <nav id="nav"></nav>
</div>

<div id="gate" role="dialog" aria-modal="true" aria-label="Sign in"></div>
<div id="inst" role="region" aria-label="Save as app"></div>
<div id="vbar" role="status" aria-live="polite"></div>

<script>
/* ------------------------------------------------------------------
   EW Saathi - partner app, v3

   Points are the headline. Rupees stay visible as the footnote,
   because settlement happens in rupees and hiding that is a trick.

   Sign in is the mobile number and a PIN, the same shape as the EW
   team app: the number and the PIN ride on every request, so there
   is no session to expire and nothing worth stealing off the phone
   but the PIN he chose himself.

   The number is not stored as his identity anywhere. The server
   reads it live off the Associates sheet every single time. Change
   his number there and the new one works that minute, the old one
   stops, and his PIN, his points and his whole history follow him.

   No secret, token, key or URL lives in this file. ew-config.js
   carries the one address. The PIN is never written down - the
   sheet keeps a salted hash of it and nothing else.
------------------------------------------------------------------ */
var GAS = String((window.EW_GAS || '')).trim();

/* ---- where the server lives -------------------------------------
   Normally ew-config.js next to the app carries the one address.
   If it is not there yet (a freshly downloaded file, a phone opening
   the app before the config was uploaded), the app asks for it once
   and remembers it on this phone. Nothing secret is stored: it is a
   public web-app URL. The PIN still guards everything behind it. */
var GKEY = 'ew_gas_url';
function gasSaved(){ try { return String(localStorage.getItem(GKEY) || '').trim(); } catch(e){ return ''; } }

/* 15 Aug 2026 - REMEMBER THE ADDRESS. ew-config.js is deliberately never cached, so that a
   change to the server address is live at once. But nothing ever kept a copy, so an installed
   app opened with no signal found window.EW_GAS undefined and asked a field executive to paste
   an Apps Script URL - in a basement, with the offline queue sitting right there unreachable.
   Keep the last address that was actually served, and fall back to it only when the config did
   not load at all. */
try {
  if (window.EW_GAS) localStorage.setItem(GKEY, String(window.EW_GAS).trim());
  else if (!GAS) GAS = gasSaved();
} catch (e) {}
function gasForget(){ try { localStorage.removeItem(GKEY); } catch(e){} location.replace(location.pathname); }
function gasSet(){
  var el = document.getElementById('gasUrl');
  var n  = document.getElementById('gasNote');
  var v  = String((el && el.value) || '').trim();
  if (!n) return;
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){
    n.textContent = 'This does not look like an Apps Script link. It should start with https://script.google.com/... and end with /exec.';
    return;
  }
  n.textContent = 'Checking the server...';
  fetch(v, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
             body: JSON.stringify({ action:'ping' }) })
    .then(function(x){ return x.json(); })
    .then(function(r){
      if (!r || !r.ok) throw 0;
      try { localStorage.setItem(GKEY, v); } catch(e){}
      n.textContent = 'Server found. Opening the app...';
      setTimeout(function(){ location.replace(location.pathname); }, 400);
    })
    .catch(function(){
      n.textContent = 'No server answered at that link. Is the Apps Script deployment set to "Anyone"? Copy the link again and paste it.';
    });
}
function gasAsk(){
  var m = document.getElementById('main');
  if (!m) return;
  m.innerHTML =
    '<div style="max-width:460px;margin:22px auto;padding:16px;border:1px solid rgba(128,128,128,.35);' +
    'border-radius:14px;line-height:1.55">' +
    '<div style="font-weight:700;font-size:16px;margin-bottom:6px">Enter the server address</div>' +
    '<div style="font-size:13px;opacity:.85;margin-bottom:12px">' +
    'The app is not connected to the server yet. Paste the <b>/exec</b> link of the Apps Script deployment here once. ' +
    'It is remembered on this phone only. No PIN and no data goes anywhere from here.</div>' +
    '<input id="gasUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" ' +
    'placeholder="https://script.google.com/macros/s/.../exec" ' +
    'style="width:100%;box-sizing:border-box;font-size:16px;padding:11px 12px;border-radius:10px;' +
    'border:1px solid rgba(128,128,128,.5);background:transparent;color:inherit">' +
    '<button onclick="gasSet()" style="margin-top:10px;width:100%;min-height:44px;font-size:15px;' +
    'font-weight:700;border:0;border-radius:10px;background:#2F6E5F;color:#fff">Connect</button>' +
    '<div id="gasNote" style="font-size:12.5px;opacity:.85;margin-top:10px;min-height:18px"></div>' +
    '<div style="font-size:12px;opacity:.7;margin-top:10px">' +
    'Where the link is: Apps Script &rarr; Deploy &rarr; Manage deployments &rarr; Web app URL.</div>' +
    '</div>';
}
if (!GAS) GAS = gasSaved();
var D = { me:null, ledger:[], catalog:[], feed:[], stages:[], cfg:{} };
var TAB = 'home', FILTER = 'all', CATTYPE = '';

/* ---- who is signed in, kept on this phone only ---- */
var STORE = 'ew_saathi_auth_v1';
var A = { mobile:'', pin:'' };
try { var _a = JSON.parse(localStorage.getItem(STORE) || '{}');
      A.mobile = _a.mobile || ''; A.pin = _a.pin || ''; } catch(e){}
function authSave(){ try { localStorage.setItem(STORE, JSON.stringify(A)); } catch(e){} }
function authClear(keepMobile){
  var m = A.mobile; A.pin = ''; if (!keepMobile) A.mobile = ''; else A.mobile = m;
  try { localStorage.removeItem(STORE); } catch(e){}
}

/* ---- transport ----
   text/plain keeps this a "simple" request, so the browser sends it
   straight through with no preflight. That is the same trick the main
   CRM already uses to talk to Apps Script from GitHub Pages. ---- */
/* ---- EVERY CALL HAS A DEADLINE (21 Aug 2026) ----
   The CRM learned this on 17 August and the note there is worth repeating, because this file
   had the same hole: a request that stalls does not FAIL. It never comes back. The promise
   neither resolves nor rejects, so a .catch that was written to say "Network slow hai" is
   never reached, and the partner who tapped Mujhe chahiye on one bar of signal gets no toast,
   no error and no request - nothing at all happens and he has no way to tell.

   A phone in a basement, or on a wifi that has associated but passes no traffic, is the
   ordinary case for the men this app is for. Twenty seconds, then it is a failure the app can
   see and act on. */
var SKEY = 'ew_saathi_staff_v1', SA = { u: '', p: '' };
try { var _s = JSON.parse(localStorage.getItem(SKEY) || '{}'); SA.u = _s.u || ''; SA.p = _s.p || ''; } catch(e){}
function staffSave(){ try { localStorage.setItem(SKEY, JSON.stringify(SA)); } catch(e){} }
function staffClear(){ SA = { u: '', p: '' }; try { localStorage.removeItem(SKEY); } catch(e){} }
function call(action, payload, ms){
  var body = { action: action, mobile: A.mobile, pin: A.pin,
               build: BUILD, app: APPKEY };
  if (SA.u && SA.p){ body.crmUser = SA.u; body.crmPin = SA.p; }
  if (payload) for (var k in payload) if (payload.hasOwnProperty(k)) body[k] = payload[k];
  var live = fetch(GAS, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
  var late = new Promise(function(_, bad){
    setTimeout(function(){ bad(new Error('The server did not answer')); }, ms || 20000);
  });
  return Promise.race([live, late]);
}

/* ---- A REQUEST THAT DID NOT GO IS HELD, NOT LOST (21 Aug 2026) ----
   "Mujhe chahiye" was fire-and-forget. On a bad line the partner tapped it, saw "Network slow
   hai, phir try karein", and that was the end of it: nothing was kept, nothing was retried,
   and the office never heard that a partner wanted material. The one action in this app that
   is worth money to us was the one action with no memory behind it.

   Every other app in the estate keeps a write journal for exactly this. This is the small
   version of it - the request is written to this phone, the partner is told it is HELD rather
   than lost, and it goes up by itself on the next thing that succeeds. */
var AQ = 'ew_saathi_ack_q_v1';
function ackQ(){ try { var l = JSON.parse(localStorage.getItem(AQ) || '[]'); return (l && l.length !== undefined) ? l : []; } catch(e){ return []; } }
function ackQPut(l){ try { localStorage.setItem(AQ, JSON.stringify(l.slice(-40))); } catch(e){} }
function ackHold(id, act){
  var l = ackQ();
  /* the same broadcast asked for twice is one request, not two - the newest wins */
  l = l.filter(function(x){ return !(x.id === id && x.act === act); });
  l.push({ id:id, act:act, at:new Date().toISOString() });
  ackQPut(l);
}
function ackDrain(){
  var l = ackQ();
  if (!l.length) return Promise.resolve(0);
  var left = l.slice(), sent = 0;
  var step = function(){
    if (!left.length){ ackQPut(left); if (sent) toast(sent + ' request has been sent.'); return sent; }
    var e = left[0];
    return call('ack', { id:e.id, act:e.act }).then(function(r){
      if (r && r.ok){ left.shift(); sent++; ackQPut(left); return step(); }
      /* the server ANSWERED and refused - holding it for ever would retry a refusal every
         time the app opens, so it is dropped and the partner is not told a lie about it */
      left.shift(); ackQPut(left); return step();
    }).catch(function(){ ackQPut(left); return sent; });   /* still no line: keep the rest */
  };
  return Promise.resolve(step());
}
function ackHeld(){ return ackQ().length; }

/* ---- small helpers ---- */
/* 16 Aug 2026 - the apostrophe is escaped now. Read the note above the click handler below
   before assuming this was the fix: it makes esc() correct for an ATTRIBUTE VALUE, which is
   what data-* attributes are. It does NOT make anything safe inside a JS string, because the
   browser turns &#39; back into ' before it parses the JS. */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* A LINK IS NOT TEXT. esc() is an HTML escape, not a URL check, so a broadcast whose link the
   server sends as javascript:... was written straight into href and ran on tap. Only http and
   https survive; anything else returns "" and the caller drops the link entirely. */
function safeUrl(u){
  var v = String(u==null?'':u).trim();
  return /^https?:\/\//i.test(v) ? v : '';
}
function nfmt(n){ return Number(n||0).toLocaleString('en-IN'); }
function inr(n){ return '₹' + nfmt(Math.round(Number(n)||0)); }
function pts(n){ return nfmt(Math.round(Number(n)||0)); }
function toast(m){
  var t = document.createElement('div'); t.className='toast'; t.textContent=m;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .4s'; }, 2000);
  setTimeout(function(){ t.remove(); }, 2500);
}

/* ---- the gauge: how close to the next payout ---- */
function gauge(clear, target){
  var t = Math.max(1, Number(target)||1);
  var pct = Math.max(0, Math.min(1, (Number(clear)||0) / t));
  var ang = -90 + pct * 180;
  var arcLen = Math.PI * 96;
  return '' +
  '<svg viewBox="0 0 280 152" role="img" aria-label="Points progress">' +
    '<path d="M44 118 A96 96 0 0 1 236 118" fill="none" stroke="#DDE0D8" stroke-width="9" stroke-linecap="round"/>' +
    '<path d="M44 118 A96 96 0 0 1 236 118" fill="none" stroke="#C08A3E" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + (arcLen*pct) + ' ' + arcLen + '"/>' +
    '<g transform="rotate(' + ang + ' 140 118)">' +
      '<line x1="140" y1="118" x2="140" y2="46" stroke="#0F1E1C" stroke-width="2.2" stroke-linecap="round"/>' +
    '</g>' +
    '<circle cx="140" cy="118" r="5" fill="#0F1E1C"/>' +
    '<text x="44" y="140" font-family="IBM Plex Mono" font-size="9" fill="#5C6B66">0</text>' +
    '<text x="236" y="140" font-family="IBM Plex Mono" font-size="9" fill="#5C6B66" text-anchor="end">' + pts(t) + '</text>' +
  '</svg>';
}

/* ================================ HOME ================================ */
function viewHome(){
  if (D.book) return bookHome();
  var m = D.me || {}, cfg = D.cfg || {};
  var unread = D.feed.filter(function(f){ return !f.seen; });
  var need = Math.max(0, (m.nextThresholdPts||0) - (m.clearPts||0));
  var h = '';

  if (unread.length){
    h += '<div class="card" style="border-color:var(--brass);padding:12px 14px">' +
         '<div style="display:flex;gap:9px;align-items:center">' +
         '<span class="dot"></span>' +
         '<div class="sm" style="flex:1"><b>' + unread.length + ' new from Energy World</b></div>' +
         '<button class="brass" onclick="go(\'feed\')">See them</button></div></div>';
  }

  h += '<div class="card">' +
       '<p class="eyebrow">Ready to be paid now</p>' +
       '<div class="gauge">' + gauge(m.clearPts, m.nextThresholdPts) +
       '<div class="big" style="margin-top:-14px">' + pts(m.clearPts) +
       '<small>Points</small></div>';
  if (cfg.showRupees) h += '<div class="rupeeline">= ' + inr(m.clear) + ' &middot; ' +
       (m.mode==='CREDIT_NOTE' ? 'as a credit note' : 'UPI par') + '</div>';
  h += '</div>';

  h += '<div class="bar"><i style="width:' +
       Math.min(100, ((m.clearPts||0)/Math.max(1,m.nextThresholdPts||1))*100) + '%"></i></div>';
  h += need > 0
     ? '<div class="xs mut">Agla settlement ' + pts(m.nextThresholdPts) +
       ' points par. <b>' + pts(need) + ' points aur</b>.</div>'
     : '<div class="xs" style="color:var(--verdigris)"><b>Ready for settlement.</b> It goes in the next batch.</div>';
  h += '</div>';

  h += '<div class="split">' +
       '<div><b>' + pts(m.holdPts) + '</b><span>On hold</span></div>' +
       '<div><b>' + pts(m.settledPts) + '</b><span>Mil chuka</span></div>' +
       '<div><b>' + pts(m.lifetimePts) + '</b><span>Total so far</span></div>' +
       '<div><b>' + esc(m.tier || 'Standard') + '</b><span>Your level</span></div>' +
       '</div>';

  if ((m.holdPts||0) > 0){
    h += '<div class="note" style="margin-top:10px">Hold means the material has gone, but the ' +
         (m.holdDays||7) + '-day return window is still open. It releases by itself after that.</div>';
  }

  h += '<h2 class="sec">Past work</h2>';
  var recent = D.ledger.slice(0, 6);
  h += recent.length ? '<div class="card">' + recent.map(ledRow).join('') + '</div>'
     : '<div class="empty">Nothing here yet.<br>Your first delivery will show here as soon as it goes out.</div>';
  if (D.ledger.length > 6)
    h += '<button class="wide ghost" onclick="go(\'account\')">See the full account</button>';

  return h;
}

/* 27 Oct 2026 - HIS WORDS: "partner incentive site wise, do not show challan wise, convert amount in points, show points".
   The book is sent by the CRM (saathiSync): his level, and per site the incentive earned and the part released
   because the client has paid. Everything here is points = rupees x ppr. */
function bP(n){ return pts((Number(n) || 0) * (D.ppr || 2)); }
function bookSites(){
  var S = (D.book && D.book.sites) || [];
  if (!S.length) return '<div class="empty">No site yet.<br>Your first site shows here as soon as material goes.</div>';
  var te = 0, tr = 0;
  var h = '<div class="card" style="padding:0;overflow:hidden"><div class="tbw"><table class="tb"><thead><tr><th>Site</th><th>Points</th><th>Client paid</th></tr></thead><tbody>';
  S.forEach(function(x){
    var e = Number(x.e) || 0, r = Math.min(e, Number(x.r) || 0); te += e; tr += r;
    var pc = e > 0 ? Math.round(r / e * 100) : 0;
    h += '<tr><td class="nm"><b>' + esc(x.n) + '</b>' + (x.last ? '<span class="xs">last ' + esc(String(x.last).slice(0, 10)) + '</span>' : '') + '</td>' +
      '<td><b>' + bP(e) + '</b></td><td>' + (pc >= 100 ? '<span class="pill p-clear">Full</span>' : pc > 0 ? pc + '%' : '<span class="pill p-hold">Not yet</span>') + '</td></tr>';
  });
  h += '<tr class="tot"><td>Total</td><td>' + bP(te) + '</td><td>' + (te > 0 ? Math.round(tr / te * 100) + '%' : '') + '</td></tr></tbody></table></div></div>' +
    '<div class="xs mut" style="margin-top:6px">Points become <b>Ready</b> as the client pays for that site.</div>';
  return h;
}
function bookHome(){
  var b = D.book, cfg = D.cfg || {}, t = LEVELS.indexOf(b.tier) >= 0 ? b.tier : 'Base';
  var unread = (D.feed || []).filter(function(f){ return !f.seen; });
  var h = '';
  if (unread.length) h += '<div class="card" style="border-color:var(--brass);padding:12px 14px"><div style="display:flex;gap:9px;align-items:center"><span class="dot"></span><div class="sm" style="flex:1"><b>' + unread.length + ' new from Energy World</b></div><button class="brass" onclick="go(\'feed\')">See them</button></div></div>';
  h += '<div class="card lvcard" style="display:flex;gap:12px;align-items:center"><span style="font-size:22px;font-weight:800;letter-spacing:1px;text-transform:uppercase">' + esc(t) + '</span>' +
    '<div class="sm" style="flex:1">Your level' + (t === 'Base' ? ' - grow your business with us to reach Silver, Gold and Platinum.' : ' - among our top partners this year.') + '</div></div>';
  h += '<div class="card lvedge"><p class="eyebrow">Ready to be paid now</p><div class="big">' + bP(b.pending) + '<small>Points</small></div>' +
    (cfg.showRupees ? '<div class="rupeeline">= ' + inr(b.pending) + '</div>' : '') + '</div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="tb"><tbody>' +
    '<tr><td>Ready now</td><td><b>' + bP(b.pending) + '</b></td></tr>' +
    '<tr><td>Waiting - client has not paid yet</td><td>' + bP(b.wait) + '</td></tr>' +
    '<tr><td>Mil chuka (paid)</td><td>' + bP(b.paid) + '</td></tr>' +
    '<tr class="tot"><td>Total earned</td><td>' + bP(b.earned) + '</td></tr></tbody></table></div>';
  h += '<h2 class="sec">Site-wise points</h2>' + bookSites();
  if (!ST) h += '<button class="wide" style="min-height:48px;margin-top:14px;background:linear-gradient(90deg,#C13584,#1877F2,#25D366);color:#fff;border:0;font-weight:700" onclick="renderFollow(false)">Follow Energy World - Instagram, Facebook, WhatsApp</button>';   /* 27 Oct 2026 - follow links any time, not only after registration */
  return h;
}

function ledRow(l){
  var cls = l.status==='hold' ? 'p-hold' : l.status==='clear' ? 'p-clear'
          : l.status==='back' ? 'p-back' : 'p-paid';
  var lbl = l.status==='hold' ? 'Hold' : l.status==='clear' ? 'Ready'
          : l.status==='back' ? 'Returned' : 'Received';
  return '<div class="row"><div class="g">' +
    '<div class="t">' + esc(l.product) + '</div>' +
    '<div class="s">' + esc(l.date) + ' &middot; ' + esc(l.ch) + ' &middot; ' + l.qty + ' nos' +
    (l.status==='hold' && l.releaseOn ? ' &middot; khulega ' + esc(l.releaseOn) : '') +
    '</div></div><div class="v">' + (l.status==='back'?'-':'') + pts(Math.abs(l.pts)) +
    '<div style="margin-top:4px"><span class="pill ' + cls + '">' + lbl + '</span></div></div></div>';
}

/* ================================ FEED ================================ */
function viewFeed(){
  if (!D.feed.length)
    return '<div class="empty">Nothing new right now.<br>' +
           'A new product or scheme shows here first, the moment it arrives.</div>';

  var kinds = ['all'].concat(D.feed.map(function(f){ return f.kind; })
    .filter(function(v,i,a){ return a.indexOf(v)===i; }));
  var h = '<div class="filters">' + kinds.map(function(k){
    return '<button class="' + (FILTER===k?'on':'') + '" data-act="filter" data-k="' + esc(k) + '">' +
           (k==='all'?'All':esc(k)) + '</button>'; }).join('') + '</div>';

  var list = D.feed.filter(function(f){ return FILTER==='all' || f.kind===FILTER; });
  h += list.map(function(f){
    var kc = /product/i.test(f.kind) ? 'product' : /scheme/i.test(f.kind) ? 'scheme' : '';
    return '<div class="bc' + (f.seen?'':' new') + '" id="bc-' + esc(f.id) + '">' +
      '<div class="hd"><span class="kind ' + kc + '">' + esc(f.kind) + '</span>' +
      (f.brand ? '<span class="xs mut mono">' + esc(f.brand) + '</span>' : '') +
      '<span class="when">' + esc(f.on) + '</span></div>' +
      '<h3>' + esc(f.title) + '</h3>' +
      (f.body ? '<p>' + esc(f.body) + '</p>' : '') +
      (safeUrl(f.img) ? '<img src="' + esc(safeUrl(f.img)) + '" alt="" loading="lazy">' : '') +
      (f.till ? '<p class="xs mut mono">Valid ' + esc(f.till) + ' so far</p>' : '') +
      '<div class="ft">' +
        '<button class="brass" data-act="ack" data-id="' + esc(f.id) + '" data-w="INTERESTED">I want this</button>' +
        '<button data-act="ack" data-id="' + esc(f.id) + '" data-w="CALLBACK">Ask for a call</button>' +
        (safeUrl(f.link) ? '<a class="xs mono" href="' + esc(safeUrl(f.link)) + '" target="_blank" rel="noopener">Detail</a>' : '') +
      '</div></div>';
  }).join('');
  return h;
}

function ack(id, act){
  if (ST){ toast('Viewing only - this is his button, not yours.'); return; }
  var done = function(){
    var f = D.feed.filter(function(x){ return x.id===id; })[0];
    if (f) f.seen = true;
    var el = document.getElementById('bc-'+id); if (el) el.classList.remove('new');
    paintNav();
  };
  call('ack', { id:id, act:act }).then(function(r){
    if (r && r.ok){
      toast(act==='CALLBACK' ? 'Done. We will call you.' : 'Noted. The team will get in touch.');
      done();
      ackDrain();          /* the line is up - anything held from before goes now */
    } else {
      /* the server answered and said no. Holding it would retry a refusal for ever. */
      toast((r && r.err) ? String(r.err) : 'That request could not be sent just now.');
    }
  }).catch(function(){
    /* NO LINE. The request is kept on this phone and the partner is told so - the whole point
       is that he does not have to remember to come back and tap it again. */
    ackHold(id, act);
    done();
    toast(act==='CALLBACK'
      ? 'Noted. It will go by itself as soon as there is signal.'
      : 'Noted. It will go by itself as soon as there is signal \u2014 no need to tap again.');
  });
}

/* Mark everything on screen as seen, quietly, once the tab is opened. */
function markFeedSeen(){
  var unseen = D.feed.filter(function(f){ return !f.seen; });
  if (!unseen.length) return;
  unseen.forEach(function(f){
    f.seen = true;
    /* SEEN is deliberately NOT queued. It is a read receipt, not a request: if it does not
       reach the server the worst that happens is a dot stays on a broadcast, and filling this
       phone's queue with read receipts would push out the one thing that matters - a partner
       asking for material. Mujhe chahiye is held; this is not. */
    call('ack', { id:f.id, act:'SEEN' }).catch(function(){});
  });
  paintNav();
}

/* ============================== CATALOGUE ============================== */
function viewCatalog(){

/* ================= DATA STOPS BEING CODE (16 Aug 2026) =================
   MEASURED, on the real viewFeed(), with a broadcast whose kind was Diwali'25:

     onclick="setFilter('Diwali'25')"

   That is not valid JavaScript. The apostrophe closed the string literal, so the handler
   would not compile - and it is the FILTER ROW, which is on the feed of every partner the
   broadcast went to, not just whoever it was about. One apostrophe typed into the console
   and nobody in the field can use their feed.

   Driven again with a broadcast id of  x'),alert(document.cookie),ack('y  the handler became

     onclick="ack('x'),alert(document.cookie),ack('y','INTERESTED')"

   which DOES compile. So it is not a crash; it runs, on every partner's phone, with whatever
   that phone has in localStorage - including his stored PIN. esc() had stopped the double
   quote, so the attribute could never be broken out of. It never needed to be: the JS string
   inside it was already open.

   WHY ESCAPING THE APOSTROPHE IS NOT THE FIX, and this is the part worth remembering.
   The browser decodes HTML entities in an attribute BEFORE handing the value to the JS
   parser. Write &#39; and the parser still sees '. There is no HTML escape that makes data
   safe inside a JS string literal. The only fix is for the data to stop being code.

   So values go into data-* attributes, where they are inert text, and one delegated listener
   reads them back with getAttribute - which returns a string and never parses anything. This
   is the pattern the CRM, Challan and Collection apps already use (data-act). Saathi is the
   app used by people outside the firm, so it is the one that most needed it.

   The inline handlers that carry no server data - go('feed'), signOut(), verPoll() - are left
   alone deliberately: they are literals written in this file, and changing them would be a
   larger diff for no gain. */
document.addEventListener('click', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  var a = t.getAttribute('data-act');
  if (a === 'filter'){ setFilter(t.getAttribute('data-k') || 'all'); return; }
  if (a === 'ack'){ ack(t.getAttribute('data-id') || '', t.getAttribute('data-w') || ''); return; }
  if (a === 'wa'){ wa(t.getAttribute('data-msg') || ''); return; }
});

/* ================= THE REFRESH BUTTON (17 Aug 2026) =================
   Asked for plainly: "give refresh button to all apps." This app had none — only a small
   text link buried at the bottom that asked the BACKEND for a version, and no way at all to
   pull the data again short of closing the app.

   One button, two jobs:
     1. pull everything again, so the screen is current;
     2. come back on the NEW BUILD if one has been put up.

   WHERE THE VERSION COMES FROM. This app's own file, fetched past the browser cache, with
   BUILD read straight out of it. Not the backend — that costs Apps Script quota on every
   tap, it is often the very thing that is down when a man reaches for this button, and it
   can disagree with what is actually being served. The file cannot disagree with itself.
   The old backend poll is left exactly where it was; this is a second, cheaper opinion that
   works when the first one cannot answer.

   A tap that finds nothing new SAYS so — silence reads as a button that did not work. And a
   new build is never applied under him: verBar() offers it, he decides. */
var REFBUSY = false;
function liveBuild(){
  return fetch('index.html?v=' + (new Date()).getTime(), { cache: 'reload' })
    .then(function(r){ return r.text(); })
    .then(function(t){ return (t.match(/BUILD\s*=\s*'([^']+)'/) || [])[1] || ''; })
    .catch(function(){ return ''; });          /* no signal is not a new version */
}
function refSay(m){ try { if (typeof toast === 'function') toast(m); } catch(e){} }
function ewRefresh(){
  if (REFBUSY) return;
  REFBUSY = true;
  var b = document.getElementById('hRef');
  if (b) { b.disabled = true; b.style.opacity = '.5'; }
  var done = function(){ REFBUSY = false; if (b) { b.disabled = false; b.style.opacity = ''; } };
  var ver = function(){
    return liveBuild().then(function(v){
      if (v && v !== BUILD) verBar(v, 'A new version is here.');
      else refSay('Everything is up to date (' + BUILD + ').');
    });
  };
  call('login').then(function(r){
    if (r && r.ok) { try { landed(r); } catch(e){} }
    else refSay('Please sign in again.');
  }).catch(function(){ refSay('No signal. Try again later.'); }).then(ver).then(done, done);
}

/* ======================= UPDATE WATCH =================================
   The problem this solves: you upload a new version and every phone is
   still running the old one until somebody rings each man and tells him
   to reinstall. Nobody is rung any more.

   The server holds one version string. This phone remembers the last
   version it actually ran. When the two disagree the app throws away its
   own shell cache and comes back new - by itself if it is simply being
   opened, and with a button if you are in the middle of something.

   Nothing you have typed or queued is touched. The sign-in and the
   offline queue live in localStorage and this never goes near them.
--------------------------------------------------------------------- */
var BUILD  = '2026.10.27-12';        /* which build of this file is running */
var APPKEY = 'SAATHI';
var VKEY   = 'ew_saathi_ver_v1';
var VNEW   = '', VBUSY = false;

function verSeen(){ try { return JSON.parse(localStorage.getItem(VKEY) || '{}'); }
                    catch(e){ return {}; } }
function verPut(o){ try { localStorage.setItem(VKEY, JSON.stringify(o)); } catch(e){} }

/* Wipe the shell and come back. The cache holds only the frame - the
   HTML, the manifest, the icons. No business data lives there. */
function verWipe(v){
  if (VBUSY) return;
  VBUSY = true;
  verPut({ have: (verSeen().have || ''), want: String(v || ''), at: (new Date()).getTime() });
  var b = document.getElementById('vbar');
  if (b){ b.innerHTML = '<div class="t">A new version is coming...</div>'; b.classList.add('on'); }

  var done = false;
  var go = function(){
    if (done) return; done = true;
    location.replace(location.pathname + '?u=' + (new Date()).getTime());
  };
  var jobs = [];
  try {
    if (window.caches && caches.keys)
      /* 17 Aug 2026 - this deleted EVERY cache on the origin. All seven Energy World apps
         are served from one github.io origin and share ONE cache store, so this app's update
         was wiping the other six apps' shells - which then opened to a white screen the next
         time a phone had no signal, and got blamed for it. */
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.filter(function(k){ return k.indexOf('ew-saathi-') === 0; })
                            .map(function(k){ return caches.delete(k); }));
      }));
  } catch(e){}
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      /* getRegistrations() returns EVERY worker on the origin, not just ours - so this
         was unregistering the Challan and Collection workers too. Ours is the one whose
         scope this page sits inside. */
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.filter(function(r){
          try { return location.href.indexOf(r.scope) === 0; } catch(e){ return false; }
        }).map(function(r){ return r.unregister(); }));
      }));
  } catch(e){}
  if (jobs.length) Promise.all(jobs).then(go, go); else go();
  setTimeout(go, 2500);                    /* never hang on a stuck cache */
}

function verBar(v, note, force){

  b.innerHTML = '<div class="t"><b>A new version is here.</b> ' +
      esc(note || 'Refresh the app once.') + '</div>' +
      '<button onclick="verWipe(VNEW)">Update</button>' +
      (force ? '' : '<button class="x" onclick="verHide()">Later</button>');

}

/* cold = the app has only just been opened, so a reload costs nobody
   anything and we do it silently. Otherwise we ask. */
function verCheck(r, cold){
  if (!r || !r.ver) return false;
  var v = String(r.ver), st = verSeen();
  if (st.want && st.want === v){                     /* the refresh worked */
    verPut({ have: v });
  if (typeof toast === 'function') toast('The app is updated.');
    return false;
  }
  if (!st.have){ verPut({ have: v }); return false; }   /* first run on this phone */
  if (st.have === v) return false;                       /* already current */
  /* a reload that did not take must never become a loop */
  if (st.at && ((new Date()).getTime() - st.at) < 60000){ verBar(v, r.verNote, r.verForce); return false; }
  if (cold){ verWipe(v); return true; }
  verBar(v, r.verNote, r.verForce);
  return false;
}

  var t = ev.target && ev.target.closest ? ev.target.closest('[data-st]') : null; if (!t || !ST) return;
  var ref = t.getAttribute('data-r');
  if (t.getAttribute('data-st') === 'asg') return;
  if (t.getAttribute('data-st') === 'row'){ ST.row = ST.row === ref ? '' : ref; staffList(); return; }
  if (t.getAttribute('data-st') === 'grp'){ ST.shut[ref] = !ST.shut[ref]; staffList(); return; }
  if (t.getAttribute('data-st') === 'view') staffOpen(ref);
  if (t.getAttribute('data-st') === 'pin'){ ST.pin = ref; render(); setTimeout(function(){ var i = document.getElementById('sp1'); if (i) i.focus(); }, 50); }
});

function doStaffLogin(){
  var u = String(document.getElementById('sgu').value || '').trim(), p = String(document.getElementById('sgp').value || '').trim();
  if (!u || !p){ GERR = 'Type your CRM name and PIN.'; renderStaffGate(); return; }
  var b = document.getElementById('sgbtn'); b.disabled = true; b.textContent = 'Checking...';
  SA = { u: u, p: p };
  call('login', null, 40000).then(function(r){
    if (r && r.ok && (r.kind === 'OWNER' || r.kind === 'EXEC')){ staffSave(); GERR = ''; gate(false); staffStart(r); return; }
    staffClear(); GERR = (r && r.err) || 'Could not sign in.'; renderStaffGate();
  }).catch(function(){ staffClear(); GERR = 'No signal. Please try again.'; renderStaffGate(); });
}

/* ===================== REGISTRATION: NAME, CITY, MOBILE, DOB, SELFIE (27 Oct 2026) =====================
   HIS WORDS: "on registering a saathi ask his DOB, and selfie pic ... its mandatory: Name, City, Mobile, DOB, Selfie" and
   "show them to link app to their instagram and fb ... clicking them open social media app in their mobile and open energy
   world page and option to like and follow it, same to whatsapp and telegram channel". After sign-in, a partner whose
   record has no DOB or no selfie gets this form before anything else; it goes onto his own Associates row (Companion
   profileSave). Then the Follow card: each button opens Energy World's page in the app on his phone. */
var EW_SOCIAL = [
  /* [label, url, colour] - an empty url is not shown */
  ['Instagram', 'https://www.instagram.com/energyworld007/', '#C13584'],
  ['Facebook', 'https://www.facebook.com/energywrld', '#1877F2'],
  ['WhatsApp channel', 'https://whatsapp.com/channel/0029VaA3aMjE50UkbIwfd632', '#25D366'],
  ['Telegram channel', 'https://t.me/+M3Eyvo5251o0NTFl', '#229ED9'],
  ['LinkedIn', 'https://www.linkedin.com/company/1779966/', '#0A66C2'],   /* his link was the admin dashboard; this is the public page */
  ['YouTube', '', '#FF0000']   /* 27 Oct 2026 - no channel yet */
];
var PR = null;
function profCheck(){
  call('profileGet', null, 30000).then(function(r){
    if (!r || !r.ok || r.done) return;
    PR = { city: r.city || '', dob: r.dob || '', ig: r.instagram || '', fb: r.facebook || '', img: '', had: !!r.selfie, name: r.name || (D.me && D.me.name) || '' };
    renderProfile();
  }).catch(function(){});
}
function renderProfile(err){
  var g = document.getElementById('gate'), today = new Date().toISOString().slice(0, 10);
  var inp = 'width:100%;min-height:48px;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:#17221F;color:#F2F6F3;box-sizing:border-box';
  g.innerHTML = '<div class="gwrap" style="padding-bottom:60px"><div class="gmark">EW</div><h2>Apni pehchaan</h2>' +
    '<p class="lede">Ek baar bharein - aapke birthday par Energy World ki taraf se shubhkamnayein.</p>' +
    (err ? '<div class="gerr" role="alert">' + esc(err) + '</div>' : '') +
    '<label>Name</label><input value="' + esc(PR.name) + '" disabled style="' + inp + ';opacity:.7">' +
    '<label>Mobile</label><input value="' + esc(A.mobile) + '" disabled style="' + inp + ';opacity:.7">' +
    '<label for="pf_city">City / shehar *</label><input id="pf_city" value="' + esc(PR.city) + '" placeholder="Panipat" style="' + inp + '">' +
    '<label for="pf_dob">Date of birth *</label><input id="pf_dob" type="date" max="' + today + '" value="' + esc(PR.dob) + '" style="' + inp + '">' +
    '<label>Selfie *</label>' +
    '<div style="display:flex;gap:12px;align-items:center;margin-top:4px">' +
      '<div style="width:96px;height:96px;border-radius:50%;overflow:hidden;background:#17221F;border:2px solid var(--brass);flex:none">' + (PR.img ? '<img src="' + PR.img + '" alt="Your selfie" style="width:100%;height:100%;object-fit:cover">' : '') + '</div>' +
      '<label style="flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--brass);color:#231705;font-weight:700;cursor:pointer;margin:0">' + (PR.img ? 'Take again' : (PR.had ? 'New selfie (optional)' : 'Take a selfie')) +
      '<input id="pf_cam" type="file" accept="image/*" capture="user" style="display:none" onchange="profPhoto(this)"></label></div>' +
    '<label for="pf_ig">Instagram id (optional)</label><input id="pf_ig" value="' + esc(PR.ig) + '" placeholder="@yourname" style="' + inp + '">' +
    '<label for="pf_fb">Facebook name / link (optional)</label><input id="pf_fb" value="' + esc(PR.fb) + '" placeholder="facebook.com/yourname" style="' + inp + '">' +
    '<button class="go" id="pf_go" onclick="profSave()">Save</button></div>';
  gate(true);
}
function profKeep(){ ['city', 'dob', 'ig', 'fb'].forEach(function(k){ var e = document.getElementById('pf_' + k); if (e) PR[k] = e.value; }); }
function profPhoto(input){
  profKeep();
  var f = input.files && input.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    var im = new Image();
    im.onload = function(){
      var W = 640, sc = Math.min(1, W / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      PR.img = c.toDataURL('image/jpeg', 0.75); renderProfile();
    };
    im.onerror = function(){ renderProfile('That photo could not be read - take it again.'); };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function profSave(){
  profKeep();
  if (!String(PR.city).trim()) { renderProfile('Apna shehar likhein.'); return; }
  if (!PR.dob) { renderProfile('Date of birth chunein.'); return; }
  if (!PR.img && !PR.had) { renderProfile('Selfie zaroori hai - Take a selfie dabaiye.'); return; }
  var b = document.getElementById('pf_go'); b.disabled = true; b.textContent = 'Saving...';
  call('profileSave', { city: PR.city, dob: PR.dob, selfie: PR.img || '', instagram: PR.ig, facebook: PR.fb }, 60000).then(function(r){
    if (!r || !r.ok){ renderProfile((r && r.err) || 'Not saved - try again.'); return; }
    PR = null; renderFollow(true);
  }).catch(function(){ renderProfile('No signal - nothing was saved. Try again.'); });
}
function followButtons(){
  return EW_SOCIAL.filter(function(x){ return x[1]; }).map(function(x){
    return '<a href="' + esc(x[1]) + '" target="_blank" rel="noopener" onclick="followTap(\'' + esc(x[0]) + '\')" style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;background:' + x[2] + ';color:#fff;font-weight:700;font-size:16px;text-decoration:none;margin-top:10px">Follow on ' + esc(x[0]) + '</a>';
  }).join('');
}
function followTap(where){ try { call('ack', { id: 'follow-' + where.replace(/\W+/g, '-').toLowerCase(), act: 'FOLLOW' }).catch(function(){}); } catch(e){} }
function renderFollow(first){
  var btns = followButtons();
  if (!btns){ gate(false); if (first) toast('Shukriya! Aapki pehchaan save ho gayi.'); return; }
  var g = document.getElementById('gate');
  g.innerHTML = '<div class="gwrap"><div class="gmark">EW</div><h2>' + (first ? 'Shukriya!' : 'Follow Energy World') + '</h2>' +
    '<p class="lede">Energy World ko follow karein - nayi schemes, products aur events sabse pehle.</p>' + btns +
    '<button class="lnk" onclick="gate(false)" style="margin-top:18px">' + (first ? 'Baad mein - app kholein' : 'Close') + '</button></div>';
  gate(true);
}
(function boot(){
  verLabel(); setTimeout(verAuto, 1500);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) verAuto(); });
  if (!GAS){ gasAsk(); return; }
  if (SA.u && SA.p){
    call('login', null, 40000).then(function(r){
      if (r && r.ok && (r.kind === 'OWNER' || r.kind === 'EXEC')){ staffStart(r); return; }
      staffClear(); GERR = (r && r.err) || ''; renderStaffGate();
    }).catch(function(){ document.getElementById('main').innerHTML = '<div class="empty">No signal.<br><br><button class="pri" onclick="location.reload()">Try again</button></div>'; });
    return;
  }
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  if (!A.mobile || !A.pin){ renderGate(); verPoll(true); return; }
  call('login').then(function(r){
    if (r && r.ok && (r.kind === 'OWNER' || r.kind === 'EXEC')){ staffStart(r); return; }
    if (!r || !r.ok || r.kind !== 'PARTNER'){
      GERR = (r && r.err) || ''; authClear(true); renderGate(); return;
    }
    landed(r);
    /* anything tapped on a dead line last time goes up now, before he does anything else */
    ackDrain();
  }).catch(function(){
    document.getElementById('main').innerHTML =
      '<div class="empty">No signal.<br><br>' +
      '<button class="pri" onclick="location.reload()">Try again</button></div>';
  });
})();
