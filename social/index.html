<style>

  var nb=A.filter(function(a){return a.birthday}).length,na=A.filter(function(a){return a.anniversary}).length;

  var h='<div class="kpis"><div class="k"><b>'+A.length+'</b><span>partners in the CRM</span></div><div class="k ok"><b>'+Object.keys(V.v).length+'</b><span>with business on record</span></div><div class="k wait"><b>'+ev.length+'</b><span>birthdays & anniversaries in 30 days</span></div><div class="k"><b>'+nb+' / '+na+'</b><span>birthdays / anniversaries entered</span></div></div>';
  h+='<div class="card"><b>Coming up</b>'+(ev.length?ev.slice(0,12).map(function(e){return '<div class="q"><b>'+esc(e.a.name)+' <small class="m">'+esc(e.a.role||"")+' · '+esc(e.k)+' · '+(e.d===0?"today":e.d===1?"tomorrow":"in "+e.d+" days")+'</small></b>'+(digits(e.a.mobile)?'<button class="btn g" data-wish="'+esc(e.a.id)+'" data-k="'+esc(e.k)+'">Send wish</button>':'<small class="m">no mobile</small>')+'</div>'}).join(""):'<div class="note">None in the next 30 days. Only '+nb+' birthdays and '+na+' anniversaries are entered - tap Edit on a partner to add them.</div>')+'</div>';
  h+='<div class="bar"><input id="pq" placeholder="Search name, code, area" value="'+esc(S.pq)+'" style="flex:1;min-width:180px">'+
    sel("prole","All roles",roles,S.prole)+sel("ploc","All locations",locs,S.ploc)+sel("parea","All areas",areas,S.parea)+
    '<select id="pvol"><option value="">All business</option>'+[["high","High business"],["mid","Medium"],["low","Low"],["none","No business yet"]].map(function(x){return '<option value="'+x[0]+'"'+(S.pvol===x[0]?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select></div>';
  h+='<div class="bar"><button class="chipb" id="selall">Select all '+list.length+' shown</button><button class="chipb" id="selnone">Clear selection</button><b style="margin-left:auto">'+nsel+' selected</b><button class="btn g" id="compose"'+(nsel?"":" disabled")+'>Message selected on WhatsApp</button></div>';
  h+='<div class="tw"><table class="pt"><thead><tr><th></th><th>Partner</th><th>Role</th><th>Location · area</th><th>Business</th><th>Birthday</th><th>Anniversary</th><th></th></tr></thead><tbody>'+list.slice(0,400).map(function(a){var v=V.v[a.id]||0,b=band(v,V.hi);return '<tr><td class="sel"><input type="checkbox" aria-label="Select '+esc(a.name)+'" data-sel="'+esc(a.id)+'"'+(S.sel[a.id]?" checked":"")+(digits(a.mobile)?"":" disabled")+'></td><td><b>'+esc(a.name)+'</b><small class="m">'+esc(a.code||"")+(digits(a.mobile)?"":" · no valid mobile")+'</small></td><td>'+esc(a.role)+'</td><td>'+esc(a.location||"")+(a.area?' · '+esc(a.area):'')+'</td><td class="vol">'+(v?inr(v)+'<small class="m">'+({high:"High",mid:"Medium",low:"Low"})[b]+'</small>':'<span class="s na">–</span>')+'</td><td>'+esc(fmtD(a.birthday))+'</td><td>'+esc(fmtD(a.anniversary))+'</td><td><button class="chipb" data-edp="'+esc(a.id)+'">Edit</button></td></tr>'}).join("")+'</tbody></table></div>';
  h+='<p class="note">Business is the total of challans for the clients and sites where this partner is named as plumber, architect, builder or PMC (cancelled challans left out). High is the top fifth. Partners are the CRM\'s own list - edits here save to the CRM, and nothing is ever deleted.</p>';
  return h}
function sel(id,all,opts,cur){return '<select id="'+id+'"><option value="">'+all+'</option>'+opts.map(function(o){return '<option'+(o===cur?" selected":"")+'>'+esc(o)+'</option>'}).join("")+'</select>'}
function fmtD(d){var m=String(d||"").match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return "";return Number(m[3])+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][Number(m[2])-1]}
function editPartner(id){var a=(S.data.associates||[]).filter(function(x){return String(x.id)===String(id)})[0];if(!a)return;
  S.sheet='<h2>'+esc(a.name)+'</h2><div class="note" style="margin-top:0">'+esc(a.role||"")+' · '+esc(a.code||"")+'</div><div class="row2"><label class="f">Birthday<input type="date" id="pb" value="'+esc(String(a.birthday||"").slice(0,10))+'"></label><label class="f">Anniversary<input type="date" id="pa" value="'+esc(String(a.anniversary||"").slice(0,10))+'"></label><label class="f">Location<input id="pl" value="'+esc(a.location||"")+'"></label><label class="f">Area<input id="par" value="'+esc(a.area||"")+'"></label></div><div class="bar"><button class="btn" id="psave" data-id="'+esc(a.id)+'">Save to CRM</button><button class="btn l" data-close="1">Cancel</button></div>';render()}
function wa(a,text){var d=digits(a.mobile);return d?"https://wa.me/91"+d+"?text="+encodeURIComponent(text.replace(/\{name\}/g,String(a.name||"").split(" ")[0])):""}
function compose(){S.sheet='<h2>Message to '+Object.keys(S.sel).filter(function(k){return S.sel[k]}).length+' partners</h2><div class="note" style="margin-top:0">{name} becomes each partner\'s first name. WhatsApp only allows sending one chat at a time from here, so the next screen opens each chat ready to send - one tap each.</div><textarea id="mt" placeholder="Namaste {name} ji, …">'+esc(S.msg)+'</textarea><div class="bar"><button class="btn g" id="mgo">Next: send one by one</button><button class="btn l" data-close="1">Cancel</button></div>';render()}
function queueView(){var Q=S.queue,done=Q.list.filter(function(x){return x.sent}).length;
  return '<h2>Sending '+done+' of '+Q.list.length+'</h2><div class="note" style="margin-top:0">Tap Open WhatsApp, press send in WhatsApp, then come back for the next one.</div>'+Q.list.map(function(x,i){return '<div class="q"><b>'+esc(x.a.name)+'<small class="m">'+esc(x.a.role||"")+'</small></b>'+(x.sent?'<span class="s ok">Opened</span>':'<a class="btn g" target="_blank" rel="noopener" data-qi="'+i+'" href="'+esc(wa(x.a,Q.text))+'">Open WhatsApp</a>')+'</div>'}).join("")+'<div class="bar" style="margin-top:12px"><button class="btn l" data-close="1">Done</button></div>'}

/* ---------------- all posts: review, download in HD, share (V1.1, 12 Nov) ----------------
   The pictures are the exact files that went out (2160 x 2700 JPEG) in p/, with 540-wide WebP
   thumbnails in t/ and the captions in posts.json - all published beside this page, so a link to
   a picture works for anyone it is sent to. */
var BRANDN={toto:"TOTO",huliot:"Huliot",ghp:"GHP+",heliroma:"Heliroma",fest:"Festival",geberit:"Geberit",grundfos:"Grundfos",mea:"MEA",oyster:"Oyster",pentair:"Pentair",fima:"FIMA"};
var SITE="https://mukeshenergyworld-ux.github.io/ew-site-crm/social/";
function bname(b){return BRANDN[b]||String(b||"").replace(/^./,function(c){return c.toUpperCase()})}
function thumb(p){return "t/"+p.img.replace(/\.jpe?g$/i,"")+".webp"}
function galList(){var P=((S.gal&&S.gal.posts)||[]).slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:slot(b.time)-slot(a.time)});
  var q=String(S.gq||"").toLowerCase().trim();
  return P.filter(function(p){return(S.gb==="all"||!S.gb||p.brand===S.gb)&&(!q||(p.n+" "+p.title+" "+p.caption+" "+bname(p.brand)).toLowerCase().indexOf(q)>=0)})}
function galleryView(){
  if(!S.gal)return '<div class="card">'+esc(S.galErr||"Loading the posts…")+'</div>';
  var all=S.gal.posts||[],cnt={};all.forEach(function(p){cnt[p.brand]=(cnt[p.brand]||0)+1});
  var L=galList(),T=todayIST();
  var h='<div class="bar"><input id="gq" type="search" placeholder="Search title, caption or number" value="'+esc(S.gq||"")+'" style="flex:1 1 220px"><select id="gb"><option value="all">All brands ('+all.length+')</option>'+Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).map(function(b){return '<option value="'+esc(b)+'"'+(S.gb===b?" selected":"")+'>'+esc(bname(b))+' ('+cnt[b]+')</option>'}).join("")+'</select></div>';
  h+='<p class="note" style="margin-top:0">'+L.length+' posts, newest first. Tap one to see it full size, download it in HD (2160 × 2700) or share it.</p>';
  h+=L.length?'<div class="gal">'+L.map(function(p){return '<button class="gc" data-gv="'+esc(p.n)+'"><img loading="lazy" width="540" height="675" src="'+esc(thumb(p))+'" alt=""><div><b>'+esc(cut(p.title,70))+'</b><small>#'+esc(p.n)+' · '+esc(new Date(p.date+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}))+' · '+esc(bname(p.brand))+(p.date>T?' · upcoming':'')+'</small></div></button>'}).join("")+'</div>':'<div class="card">No post matches. Clear the search or pick All brands.</div>';
  return h}
function curPost(){var L=galList();for(var i=0;i<L.length;i++)if(L[i].n===S.view)return{p:L[i],i:i,L:L};var A=(S.gal&&S.gal.posts)||[];for(var j=0;j<A.length;j++)if(A[j].n===S.view)return{p:A[j],i:-1,L:L};return null}
function viewerHtml(){var c=curPost();if(!c)return "";var p=c.p,u=SITE+"p/"+encodeURIComponent(p.img);
  return '<div class="view" data-vclose="1"><div role="dialog" aria-label="Post '+esc(p.n)+'"><div class="vi"><img src="p/'+esc(p.img)+'" alt="'+esc(p.title)+'"></div><div class="vt">'+
  '<small class="m">#'+esc(p.n)+' · '+esc(new Date(p.date+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"}))+' · '+esc(p.time)+' · '+esc(bname(p.brand))+'</small><h2>'+esc(p.title)+'</h2>'+
  '<div class="acts"><a class="btn" href="p/'+esc(p.img)+'" download="'+esc(p.img)+'">Download HD</a><button class="btn g" id="vshare">Share</button><a class="btn l" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(p.title+"\n"+u)+'">WhatsApp</a><button class="btn l" id="vcap">Copy caption</button><button class="btn l" id="vlink">Copy link</button></div>'+
  '<div class="cap">'+esc(p.caption||"(no caption saved)")+'</div><small class="m">HD file '+esc(p.img)+(p.kb?' · '+(p.kb>=1024?(p.kb/1024).toFixed(1)+' MB':p.kb+' KB'):'')+'</small>'+
  '<div class="vnav"><button class="btn l" id="vprev"'+(c.i<=0?" disabled":"")+'>‹ Newer</button><button class="btn l" id="vnext"'+(c.i<0||c.i>=c.L.length-1?" disabled":"")+'>Older ›</button><button class="btn l" data-vclose="1" style="margin-left:auto">Close</button></div></div></div></div>'}
function copyText(t,okMsg){var done=function(){toast(okMsg)};try{navigator.clipboard.writeText(t).then(done,function(){fallbackCopy(t);done()})}catch(e){fallbackCopy(t);done()}}
function fallbackCopy(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}
function sharePost(){var c=curPost();if(!c)return;var p=c.p,u=SITE+"p/"+encodeURIComponent(p.img);
  /* Share the picture itself where the device can (phones, Mac Chrome); else the link; else copy the link. */
  fetch("p/"+p.img).then(function(r){return r.blob()}).then(function(b){var f=new File([b],p.img,{type:"image/jpeg"});
    if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:p.title,text:p.caption||p.title});
    if(navigator.share)return navigator.share({title:p.title,text:p.title,url:u});
    copyText(u,"Link copied - paste it anywhere")}).catch(function(e){if(e&&e.name==="AbortError")return;copyText(u,"Link copied - paste it anywhere")})}
function stepView(d){var c=curPost();if(!c||c.i<0)return;var k=c.i+d;if(k<0||k>=c.L.length)return;S.view=c.L[k].n;render()}
document.addEventListener("keydown",function(e){if(!S.view)return;if(e.key==="Escape"){S.view=null;render()}else if(e.key==="ArrowRight")stepView(1);else if(e.key==="ArrowLeft")stepView(-1)});

/* ---------------- shell ---------------- */
function render(){
  if(!S.user||!S.tok){renderLogin("");return}
  var tabs=[["dash","Dashboard"],["posts","Posts"],["gallery","All posts"],["listings","Sites & listings"],["blogs","Blogs"],["partners","Partners"]];
  var body=S.tab==="dash"?dashView():S.tab==="posts"?postsView():S.tab==="gallery"?galleryView():S.tab==="listings"?listingsView():S.tab==="blogs"?blogsView():partnersView();
  el("root").innerHTML='<header><div class="hrow"><img src="icon-192.png" alt=""><h1>Social &amp; Partners</h1><span class="who">'+esc(S.user)+'</span><button id="rf">'+(S.busy?"Loading…":"Refresh")+'</button><button id="so">Sign out</button></div><nav>'+tabs.map(function(t){return '<button data-tab="'+t[0]+'" aria-current="'+(S.tab===t[0]?"page":"false")+'">'+t[1]+'</button>'}).join("")+'</nav></header><main>'+body+'</main>'+
    (S.view?viewerHtml():'')+(S.sheet||S.queue?'<div class="sheet" data-close="1"><div>'+(S.queue?queueView():S.sheet)+'</div></div>':'');
  try{localStorage.setItem("ew_social_tab",S.tab)}catch(e){}
}
document.addEventListener("click",function(e){var t=e.target,b;
  if((b=t.closest("[data-tab]"))){S.tab=b.dataset.tab;render();return}
  if((b=t.closest("[data-gv]"))){S.view=b.dataset.gv;render();return}
  if(t.dataset&&t.dataset.vclose){S.view=null;render();return}
  if(t.id==="vshare"){sharePost();return}
  if(t.id==="vcap"){var c1=curPost();if(c1)copyText(c1.p.caption||c1.p.title,"Caption copied");return}
  if(t.id==="vlink"){var c2=curPost();if(c2)copyText(SITE+"p/"+encodeURIComponent(c2.p.img),"Link copied");return}
  if(t.id==="vprev"){stepView(-1);return}
  if(t.id==="vnext"){stepView(1);return}
  if(t.id==="rf"){S._vol=null;loadAll();return}
  if(t.id==="so"){signOut();return}
  if((b=t.closest("[data-pf]"))){S.pf=b.dataset.pf;render();return}
  if((b=t.closest("[data-lf]"))){S.lf=b.dataset.lf;render();return}
  if((b=t.closest("[data-edl]"))){editListing(b.dataset.edl);return}
  if((b=t.closest("[data-edp]"))){editPartner(b.dataset.edp);return}
  if(t.dataset&&t.dataset.close&&(t.classList.contains("sheet")||t.tagName==="BUTTON")){S.sheet=null;S.queue=null;render();return}
  if(t.id==="seed"){t.disabled=true;t.textContent="Saving "+SEED.length+"…";var i=0,fail=0;(function next(){if(i>=SEED.length){toast(fail?fail+" did not save - tap Refresh and try again":"Starting list saved");render();return}var r=Object.assign({},SEED[i++],{updatedAt:new Date().toISOString(),updatedBy:S.user});saveRow("listings",r).catch(function(){fail++}).then(function(){t.textContent="Saving "+i+" of "+SEED.length+"…";next()})})();return}
  if(t.id==="esave"){var id=t.dataset.id,x=(S.data.listings||[]).filter(function(r){return r.id===id})[0];var row=Object.assign({},x,{status:el("es").value,note:el("en").value.trim(),url:el("eu").value.trim(),updatedAt:new Date().toISOString(),updatedBy:S.user});t.disabled=true;t.textContent="Saving…";saveRow("listings",row).then(function(){S.sheet=null;toast("Saved");render()}).catch(function(err){t.disabled=false;t.textContent="Save";toast("Not saved: "+err.message+" - nothing changed")});return}
  if(t.id==="psave"){var a=(S.data.associates||[]).filter(function(x){return String(x.id)===String(t.dataset.id)})[0];var nr=Object.assign({},a,{birthday:el("pb").value,anniversary:el("pa").value,location:el("pl").value.trim(),area:el("par").value.trim()});delete nr.updatedAt;t.disabled=true;t.textContent="Saving…";saveRow("associates",nr).then(function(){S.sheet=null;S._vol=null;toast("Saved to the CRM");render()}).catch(function(err){t.disabled=false;t.textContent="Save to CRM";toast("Not saved: "+err.message+" - nothing changed")});return}
  if(t.id==="selall"){document.querySelectorAll("[data-sel]").forEach(function(c){if(!c.disabled)S.sel[c.dataset.sel]=true});render();return}
  if(t.id==="selnone"){S.sel={};render();return}
  if(t.id==="compose"){compose();return}
  if(t.id==="mgo"){var txt=el("mt").value.trim();if(!txt){toast("Write the message first");return}S.msg=txt;var A=S.data.associates||[];S.queue={text:txt,list:A.filter(function(a){return S.sel[a.id]&&digits(a.mobile)}).map(function(a){return{a:a,sent:false}})};S.sheet=null;render();return}
  if((b=t.closest("[data-qi]"))){var qi=Number(b.dataset.qi);setTimeout(function(){S.queue.list[qi].sent=true;render()},300);return}
  if((b=t.closest("[data-wish]"))){var p=(S.data.associates||[]).filter(function(x){return String(x.id)===String(b.dataset.wish)})[0];var k=b.dataset.k;var msg=k==="Birthday"?"Happy birthday {name} ji! Wishing you good health, happiness and a great year ahead. - Mukesh, Energy World":"Happy anniversary {name} ji! Wishing you both many happy years together. - Mukesh, Energy World";window.open(wa(p,msg),"_blank","noopener");return}
});
document.addEventListener("change",function(e){var t=e.target;
  if(t.dataset&&t.dataset.sel){S.sel[t.dataset.sel]=t.checked;render();return}
  if(t.id==="gb"){S.gb=t.value;render();return}
  if(["prole","ploc","parea","pvol"].indexOf(t.id)>=0){S[t.id]=t.value;render();return}});
document.addEventListener("input",function(e){if(e.target.id==="gq"){S.gq=e.target.value;var gp=e.target.selectionStart;render();var gn=el("gq");if(gn){gn.focus();try{gn.setSelectionRange(gp,gp)}catch(x){}}return}if(e.target.id==="pq"){S.pq=e.target.value;var pos=e.target.selectionStart;render();var n=el("pq");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}});
/* V1.1.1 - the installed app kept showing yesterday's page (12 Nov: he saw no All posts tab while
   the server had served 1.1.0 for hours). On start, fetch this page fresh; if its version differs,
   the fresh copy is now in the cache, so one reload shows it. A session flag stops any loop. */
function selfUpdate(){try{if(sessionStorage.getItem("ew_social_upd"))return}catch(e){}
  fetch("index.html?x="+Date.now(),{cache:"reload"}).then(function(r){return r.ok?r.text():""}).then(function(t){var m=/var APP_VERSION="([^"]+)"/.exec(t);
    if(m&&m[1]!==APP_VERSION){try{sessionStorage.setItem("ew_social_upd","1")}catch(e){}
      fetch("./",{cache:"reload"}).catch(function(){}).then(function(){location.reload()})}}).catch(function(){})}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")selfUpdate()});
(function boot(){selfUpdate();try{var c=JSON.parse(localStorage.getItem(STORE)||"null");if(c&&c.tok){S.user=c.user;S.role=c.role;S.tok=c.tok}}catch(e){}
  
  if(S.tok)loadAll();else renderLogin("")})();
</script>
</body>
