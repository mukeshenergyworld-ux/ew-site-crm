<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1F3A5F"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Energy World Apps</title>
<link rel="icon" href="../team/icon-192.png?v=3"/>
<link rel="apple-touch-icon" href="../team/icon-180.png?v=3"/>
<style>
/* 18 Nov 2026 - HIS WORDS: "also show me a webapp that have link to all our apps". One page with every Energy World app,
   each with the same icon it carries on the phone's home screen (the real file, so the two can never disagree), who it
   is for, and a search. Nothing here signs in or holds data; each tile opens the app itself. */
:root{--ink:#0D2340;--navy:#1F3A5F;--paper:#F4F6F9;--line:#DCE3EA;--muted:#5E6875;--org:#E8762C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
header{background:linear-gradient(160deg,#1F3A5F,#132640);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 22px}
header .in{max-width:880px;margin:0 auto}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px}
header p{margin:4px 0 14px;font-size:13.5px;opacity:.88}
#q{width:100%;min-height:48px;border:0;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:880px;margin:0 auto;padding:4px 16px 40px}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.app{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:inherit;min-height:44px;transition:transform .08s,box-shadow .15s}
.app:hover{box-shadow:0 6px 18px rgba(13,35,64,.10)}.app:active{transform:scale(.98)}
.app img{width:60px;height:60px;border-radius:15px;box-shadow:0 2px 6px rgba(13,35,64,.18)}
.app b{font-size:15.5px;line-height:1.25}
.app span{font-size:13px;color:var(--muted);line-height:1.4}
.app em{font-style:normal;font-size:12px;font-weight:800;color:var(--navy);background:#E8EEF5;border-radius:999px;padding:2px 8px;align-self:flex-start}
.empty{display:none;color:var(--muted);text-align:center;padding:30px 0}
.tip{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.tip b{color:var(--ink)}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:22px}
@media (max-width:380px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="in">
  <h1>Energy World Apps</h1>
  <p>Every app in one place. Tap one to open it.</p>
  <input id="q" type="search" placeholder="Search: challan, payment, tools, partner…" autocomplete="off"/>
</div></header>
<div class="wrap" id="list"></div>
<script>
(function () {
  var GROUPS = [
    ["Office", [
      ["team", "CRM", "The whole book: clients, quotes, sites, hisab, billing, incentives, salary", "Owner · accounts · sales", "crm clients quotes hisab billing salary incentive dashboard"],
      ["challan", "Challan", "Material out and back, the signed receipt, drivers and freight", "Godown · accounts", "challan delivery godown dispatch receipt driver freight stock"],
      ["collect", "Payment", "Who to ring today, and the money as it comes in", "Owner · accounts", "payment collection money due reminder"],
      ["console", "Console", "The back office", "Owner", "console admin points broadcast saathi settings"]
    ]],
    ["In the field", [
      ["visit", "Visit & Quote", "Mark visits, log site visits, make and send quotes", "Sales executives", "visit quote site executive field lead"],
      ["service", "Service", "What is due today, the machine's history, the visit and what was taken", "Service engineers", "service engineer complaint machine amc visit spares"],
      ["tooltrack", "Tool Tracking", "Which tool is with which plumber, at which site, or in the godown", "Every staff member", "tool tools toolbox machine handover damage recovery"]
    ]],
    ["Partners & brands", [
      ["saathi", "Saathi", "Plumbers and architects: points, sites, the tools they hold", "Partners", "saathi partner plumber architect points rewards"],
      ["brand", "Brand Followup", "Brand executives follow up the sites they are put on", "Brand executives", "brand executive followup huliot fima oyster"],
      ["social", "Social & Partners", "Posts, the gallery and the partner listings", "Owner · office", "social posts instagram facebook gallery listing"]
    ]],
    ["For customers", [
      ["complaint", "Register a Complaint", "A customer registers a service complaint. Send this link to customers", "Customers", "complaint customer service register"]
    ]]
  ];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var list = document.getElementById("list");
  list.innerHTML = GROUPS.map(function (g) {
    return '<section><h2>' + esc(g[0]) + '</h2><div class="grid">' + g[1].map(function (a) {
      return '<a class="app" href="../' + a[0] + '/" data-k="' + esc((a[1] + " " + a[2] + " " + a[3] + " " + a[4]).toLowerCase()) + '">' +
        '<img src="../' + a[0] + '/icon-192.png?v=3" alt="" width="60" height="60"/><b>' + esc(a[1]) + '</b><span>' + esc(a[2]) + '</span><em>' + esc(a[3]) + '</em></a>';
    }).join("") + '</div></section>';
  }).join("") + '<div class="empty" id="none">No app matches.</div>' +
    '<div class="tip"><b>Put an app on your phone’s home screen:</b> open it, then Share → Add to Home Screen on iPhone, or the ⋮ menu → Add to Home screen / Install app on Android. ' +
    'Need help with one? <a href="../help/">How to use the apps</a>.</div>' +
    '<footer>Energy World · Panipat</footer>';
  document.getElementById("q").addEventListener("input", function () {
    var q = this.value.trim().toLowerCase(), any = false;
    Array.prototype.forEach.call(document.querySelectorAll(".app"), function (a) { var on = !q || q.split(/\s+/).every(function (w) { return a.getAttribute("data-k").indexOf(w) >= 0; }); a.style.display = on ? "" : "none"; if (on) any = true; });
    Array.prototype.forEach.call(document.querySelectorAll("section"), function (s) { s.style.display = [].some.call(s.querySelectorAll(".app"), function (a) { return a.style.display !== "none"; }) ? "" : "none"; });
    document.getElementById("none").style.display = any ? "none" : "block";
  });
})();
</script>
</body>
</html>
