<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1F3A5F"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Energy World Apps</title>
<link rel="icon" href="../team/icon-192.png?v=3"/>
<link rel="apple-touch-icon" href="../team/icon-180.png?v=3"/>
<style>
/* 18 Nov 2026 - HIS WORDS: "also show me a webapp that have link to all our apps".
   20 Nov 2026 (v2) - HIS WORDS: "design it in such a way in future if any app added to ecosystem then it will auto flash
   in this app, vice versa for deleting any app".
   HOW IT FINDS THE APPS. An Energy World app is a folder of this site with a manifest.webmanifest - the same file a phone
   reads to install it, with its name, its icon and its colour. This page asks GitHub for the site's folders (one call),
   then reads each folder's manifest from the site itself. A folder with a manifest is an app and is shown; a folder whose
   manifest is gone is not. So a new app appears here the day it goes up, and a removed one disappears, with nothing to
   edit on this page. Its tile (title, group, who it is for, a line about it, search words) comes from an "ew" block in
   its own manifest, or for today's eleven from the KNOWN list below; an app with neither still appears, under
   "Other apps", with the name, icon and description its manifest carries.
   The list last found is kept on this phone, so the page opens at once and works when GitHub does not answer. */
:root{--ink:#0D2340;--navy:#1F3A5F;--paper:#F4F6F9;--line:#DCE3EA;--muted:#5E6875;--org:#E8762C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
header{background:linear-gradient(160deg,#1F3A5F,#132640);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 22px}
header .in{max-width:880px;margin:0 auto}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px}
header p{margin:4px 0 14px;font-size:13.5px;opacity:.88}
#q{width:100%;min-height:48px;border:0;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:880px;margin:0 auto;padding:4px 16px 40px}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.app{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:inherit;min-height:44px;transition:transform .08s,box-shadow .15s}
.app:hover{box-shadow:0 6px 18px rgba(13,35,64,.10)}.app:active{transform:scale(.98)}
.ic{position:relative;width:60px;height:60px;border-radius:15px;box-shadow:0 2px 6px rgba(13,35,64,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;overflow:hidden;flex:none}
.ic img{position:absolute;inset:0;width:100%;height:100%;display:block}
.app b{font-size:15.5px;line-height:1.25}
.app span{font-size:13px;color:var(--muted);line-height:1.4}
.app em{font-style:normal;font-size:12px;font-weight:800;color:var(--navy);background:#E8EEF5;border-radius:999px;padding:2px 8px;align-self:flex-start}
.app .new{background:#FDE8D7;color:#9A3412}
.empty{display:none;color:var(--muted);text-align:center;padding:30px 0}
.note{color:var(--muted);font-size:12.5px;text-align:center;margin-top:14px}
.tip{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.tip b{color:var(--ink)}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:22px}
@media (max-width:380px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="in">
  <h1>Energy World Apps</h1>
  <p>Every app in one place. Tap one to open it.</p>
  <input id="q" type="search" placeholder="Search: challan, payment, tools, partner…" autocomplete="off"/>
</div></header>
<div class="wrap" id="list"></div>
<script>
(function () {
  "use strict";
  var REPO = "mukeshenergyworld-ux/ew-site-crm";
  var ROOT = new URL("../", location.href).href;           /* the site's root, wherever this page is served from */
  var STORE = "ew_apps_hub_v2";
  /* used only when GitHub cannot be asked and this phone has never asked it: the folders known on 20 Nov 2026.
     Each is still checked for its manifest, so a removed app drops out even then. */
  var SEED = ["team", "challan", "collect", "console", "visit", "service", "tooltrack", "saathi", "brand", "social", "complaint"];
  var GROUPS = ["Office", "In the field", "Partners & brands", "For customers"];
  var SKIP = { apps: 1, assets: 1, core: 1, icons: 1, tools: 1 };
  /* the wording for the apps there were on 20 Nov 2026. An app's own manifest can carry the same fields in an "ew" block
     ({ title, group, order, about, for, keys }) and that wins - a new app brings its tile with it. */
  var KNOWN = {
    team: ["CRM", "Office", 1, "The whole book: clients, quotes, sites, hisab, billing, incentives, salary", "Owner · accounts · sales", "crm clients quotes hisab billing salary incentive dashboard"],
    challan: ["Challan", "Office", 2, "Material out and back, the signed receipt, drivers and freight", "Godown · accounts", "challan delivery godown dispatch receipt driver freight stock"],
    collect: ["Payment", "Office", 3, "Who to ring today, and the money as it comes in", "Owner · accounts", "payment collection money due reminder"],
    console: ["Console", "Office", 4, "The back office", "Owner", "console admin points broadcast saathi settings"],
    visit: ["Visit & Quote", "In the field", 1, "Mark visits, log site visits, make and send quotes", "Sales executives", "visit quote site executive field lead"],
    service: ["Service", "In the field", 2, "What is due today, the machine's history, the visit and what was taken", "Service engineers", "service engineer complaint machine amc visit spares"],
    tooltrack: ["Tool Tracking", "In the field", 3, "Which tool is with which plumber, at which site, or in the godown", "Every staff member", "tool tools toolbox machine handover damage recovery"],
    saathi: ["Saathi", "Partners & brands", 1, "Plumbers and architects: points, sites, the tools they hold", "Partners", "saathi partner plumber architect points rewards"],
    brand: ["Brand Followup", "Partners & brands", 2, "Brand executives follow up the sites they are put on", "Brand executives", "brand executive followup huliot fima oyster"],
    social: ["Social & Partners", "Partners & brands", 3, "Posts, the gallery and the partner listings", "Owner · office", "social posts instagram facebook gallery listing"],
    complaint: ["Register a Complaint", "For customers", 1, "A customer registers a service complaint. Send this link to customers", "Customers", "complaint customer service register"]
  };   /* folders that are never an app (saves a request each) */

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function lsGet() { try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; } }
  function lsPut(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (e) { } }
  function timeout(p, ms) { return Promise.race([p, new Promise(function (_, no) { setTimeout(function () { no(new Error("slow")); }, ms); })]); }

  /* one folder -> its tile, from its own manifest; null when the folder is not an app */
  function readApp(dir) {
    var url = ROOT + dir + "/manifest.webmanifest";
    return timeout(fetch(url + "?t=" + Date.now(), { cache: "no-store" }), 8000).then(function (r) {
      if (!r.ok) return null;
      return r.json().then(function (m) {
        if (!m || typeof m !== "object") return null;
        var kn = KNOWN[dir] || [], ew = m.ew || {};
        ew = { title: ew.title || kn[0], group: ew.group || kn[1], order: ew.order || kn[2], about: ew.about || kn[3], "for": ew["for"] || kn[4], keys: ew.keys || kn[5] };
        var icons = (m.icons || []).filter(function (i) { return i && i.src && i.purpose !== "maskable"; });
        icons.sort(function (a, b) { return Math.abs(parseInt(a.sizes, 10) - 192) - Math.abs(parseInt(b.sizes, 10) - 192); });
        var name = String(m.short_name || m.name || dir).replace(/^(Energy World|EW)\s*[—–-]?\s*/i, "").replace(/\s*[—–-]\s*(by )?Energy World$/i, "").trim() || dir;
        return {
          dir: dir, title: String(ew.title || name), group: String(ew.group || "Other apps"), order: Number(ew.order) || 99,
          about: String(ew.about || m.description || ""), who: String(ew["for"] || ""), keys: String(ew.keys || ""),
          icon: icons[0] ? new URL(icons[0].src, url).href : "", color: String(m.theme_color || "#1F3A5F")
        };
      });
    }).catch(function () { return null; });
  }
  /* the site's folders, from GitHub - one call; a failure answers null and the caller falls back */
  function listDirs() {
    return timeout(fetch("https://api.github.com/repos/" + REPO + "/contents/", { headers: { Accept: "application/vnd.github+json" } }), 8000)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (a) { return Array.isArray(a) ? a.filter(function (x) { return x.type === "dir" && !/^\./.test(x.name) && !SKIP[x.name]; }).map(function (x) { return x.name; }) : null; })
      .catch(function () { return null; });
  }

  var list = document.getElementById("list"), state = { apps: [], at: 0, from: "" };
  function tile(a, isNew) {
    var k = (a.title + " " + a.about + " " + a.who + " " + a.keys + " " + a.dir).toLowerCase();
    var ic = '<div class="ic" style="background:' + esc(a.color) + '">' + esc(a.title.charAt(0)) +
      (a.icon ? '<img src="' + esc(a.icon) + '" alt="" width="60" height="60" onerror="this.remove()"/>' : '') + '</div>';
    return '<a class="app" href="' + esc(ROOT + a.dir + "/") + '" data-k="' + esc(k) + '">' + ic + '<b>' + esc(a.title) + '</b>' +
      (a.about ? '<span>' + esc(a.about) + '</span>' : '') +
      (isNew ? '<em class="new">New</em>' : (a.who ? '<em>' + esc(a.who) + '</em>' : '')) + '</a>';
  }
  function draw(newDirs) {
    var by = {};
    state.apps.forEach(function (a) { (by[a.group] = by[a.group] || []).push(a); });
    var order = GROUPS.filter(function (g) { return by[g]; }).concat(Object.keys(by).filter(function (g) { return GROUPS.indexOf(g) < 0; }).sort());
    list.innerHTML = (state.apps.length ? order.map(function (g) {
      return '<section><h2>' + esc(g) + '</h2><div class="grid">' + by[g].sort(function (a, b) { return a.order - b.order || a.title.localeCompare(b.title); })
        .map(function (a) { return tile(a, newDirs && newDirs[a.dir]); }).join("") + '</div></section>';
    }).join("") : '<div class="note">Looking for the apps…</div>') +
      '<div class="empty" id="none">No app matches.</div>' +
      (state.at ? '<div class="note">' + state.apps.length + ' apps · found ' + new Date(state.at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + (state.from === "seed" ? ' (GitHub did not answer; the known list was checked)' : '') + '</div>' : '') +
      '<div class="tip"><b>Put an app on your phone’s home screen:</b> open it, then Share → Add to Home Screen on iPhone, or the ⋮ menu → Add to Home screen / Install app on Android. ' +
      'Need help with one? <a href="' + esc(ROOT) + 'help/">How to use the apps</a>.</div>' +
      '<footer>Energy World · Panipat</footer>';
    filter();
  }
  function filter() {
    var q = document.getElementById("q").value.trim().toLowerCase(), any = false;
    Array.prototype.forEach.call(document.querySelectorAll(".app"), function (a) { var on = !q || q.split(/\s+/).every(function (w) { return a.getAttribute("data-k").indexOf(w) >= 0; }); a.style.display = on ? "" : "none"; if (on) any = true; });
    Array.prototype.forEach.call(document.querySelectorAll("section"), function (s) { s.style.display = [].some.call(s.querySelectorAll(".app"), function (a) { return a.style.display !== "none"; }) ? "" : "none"; });
    var n = document.getElementById("none"); if (n) n.style.display = any || !state.apps.length ? "none" : "block";
  }
  document.getElementById("q").addEventListener("input", filter);

  /* 1. what this phone found last time, at once */
  var was = lsGet();
  if (was && Array.isArray(was.apps)) { state = was; }
  draw(null);
  /* 2. ask again: the folders, then each one's manifest */
  listDirs().then(function (dirs) {
    var from = dirs ? "github" : "seed";
    if (!dirs) dirs = (was && was.apps && was.apps.length ? was.apps.map(function (a) { return a.dir; }) : SEED);
    return Promise.all(dirs.map(readApp)).then(function (found) {
      var apps = found.filter(Boolean);
      if (!apps.length && was && was.apps && was.apps.length) return;      /* no signal at all: keep what we had */
      var before = {}; ((was && was.apps) || []).forEach(function (a) { before[a.dir] = 1; });
      var fresh = {}; if (was && was.apps && was.apps.length) apps.forEach(function (a) { if (!before[a.dir]) fresh[a.dir] = 1; });
      state = { apps: apps, at: Date.now(), from: from };
      lsPut(state);
      draw(fresh);
    });
  });
})();
</script>
</body>
</html>
