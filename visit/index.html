<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EW Visit</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e7490">
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .box{max-width:420px;padding:24px 16px;text-align:center}
  .mark{width:72px;height:72px;border-radius:50%;border:3px solid #0e7490;color:#0e7490;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  p{font-size:15px;line-height:1.5}
  a.go{display:inline-block;min-height:44px;line-height:44px;padding:0 22px;border-radius:10px;background:#0e7490;color:#fff;font-weight:700;text-decoration:none;font-size:16px}
</style>
</head>
<body>
<div class="box">
  <div class="mark">EW</div>
  <p><b>Site visits &amp; quotes</b> is now part of the CRM.<br>Sign in with your name and CRM PIN.</p>
  <p><a class="go" id="go" href="../team/#visits">Open it</a></p>
</div>
<script>
/* Visit 2026.10.11-1 - HIS WORDS: "why this in hinglish / why admin not able to login / want to be use it as simple
   site visit log tool ... visit cum quote making & viewing tool". The old app signed in on the incentive-engine server
   (his number was never registered there) and phones kept an old Hindi copy in this folder's cache. The tool now lives
   in the CRM (Clients > Site visits & quotes, same sign-in as the CRM). This page clears this folder's old cache and
   worker, then opens it. */
(function () {
  var go = function () { try { location.replace('../team/#visits'); } catch (e) { location.href = '../team/#visits'; } };
  var jobs = [];
  try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.filter(function (r) { return /\/visit\/$/.test(r.scope); }).map(function (r) { return r.unregister(); })); })); } catch (e) {}
  try { if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return /^ew-visit/.test(k); }).map(function (k) { return caches.delete(k); })); })); } catch (e) {}
  var t = setTimeout(go, 1500);
  Promise.all(jobs).then(function () { clearTimeout(t); go(); }, function () { clearTimeout(t); go(); });
})();
</script>
</body>
</html>
