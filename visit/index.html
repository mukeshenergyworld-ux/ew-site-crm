   companion server, where he was not registered - that is why it failed). Everything written here is
   a row the CRM already reads: sites, clients, quotes, the siteVisit call, audit visit:mark and
   quote:lost. The quote PDF, the price list, the brand discounts and the pitch rows are the CRM's own
   functions, lifted unchanged at build time (tools: visitapp/lift.py) - so a quote made here prints

      if (bad) { rawbReset(); return again ? r : teamGetD(extra, true); }
