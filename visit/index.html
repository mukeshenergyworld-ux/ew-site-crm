<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EW Visit &amp; Quote</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3A5F">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F4F6F9;color:#1A2230;font-size:15px;line-height:1.4;overflow-x:hidden}
#root{max-width:720px;margin:0 auto;padding:0 12px calc(92px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:#1F3A5F;border-bottom:3px solid #C9A24A;color:#fff;margin:0 -12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;min-width:0}
.top b{font-size:17px;display:block}
.top .sub{font-size:12px;opacity:.9}
.top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;min-height:44px;min-width:44px;font-size:13px;font-weight:700;padding:0 12px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;max-width:180px;border:0;background:none;min-height:58px;font-size:13px;font-weight:700;color:#64748b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button .i{font-size:20px;line-height:1}
.nav button.on{color:#1F3A5F}
h2{font-size:19px;margin:14px 0 6px}
h3.sec{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#475569;margin:18px 0 6px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin:8px 0}
.card.tap{cursor:pointer}
.card.mine{border-left:4px solid #1F3A5F}
.card.other{border-left:4px solid #f59e0b}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.meta{font-size:13px;color:#5E6875}
.ttl2{font-weight:700;font-size:15px}
.amt{font-weight:800;font-size:15px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:#1F3A5F;color:#fff;font-weight:700;font-size:15px;min-height:48px;padding:0 16px;cursor:pointer;text-decoration:none}
.btn.gry{background:#e2e8f0;color:#0f172a}
.btn.red{background:#dc2626}
.btn.grn{background:#15803d}
.btn.sm{min-height:44px;font-size:13px;padding:0 12px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.55}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.acts .btn{flex:1 1 140px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.big2 .btn{min-height:64px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.tile{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;text-align:left;min-height:76px;font:inherit;color:inherit;cursor:pointer}
.tile .n{font-size:24px;font-weight:800}
.tile .l{font-size:13px;color:#475569}
.tile.warn .n{color:#b45309}.tile.bad .n{color:#b91c1c}.tile.good .n{color:#0f766e}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;min-height:44px;padding:0 14px;font-size:14px;font-weight:600;color:#0f172a;cursor:pointer}
.chip.on{background:#1F3A5F;color:#fff;border-color:#1F3A5F}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:#e2e8f0;color:#334155}
.pill.grn{background:#dcfce7;color:#166534}.pill.red{background:#fee2e2;color:#b91c1c}.pill.amb{background:#fef3c7;color:#92400e}.pill.blu{background:#dbeafe;color:#1d4ed8}
label{display:block;font-size:13px;font-weight:700;color:#334155;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;min-height:48px;background:#fff;color:#0f172a}
textarea{min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.g4{grid-template-columns:1fr 1fr}}
.g2 label,.g4 label{margin-top:8px}
.hist{border:1px solid #fde68a;background:#fffbeb;border-radius:12px;padding:8px 10px;margin:8px 0;font-size:13px}
.hist b.h{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#92400e;margin-bottom:4px}
.hist .ln{padding:4px 0;border-top:1px solid #fef3c7}
.hist .ln:first-of-type{border-top:0}
.vpics{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.vpic{display:flex;flex-direction:column;align-items:center;gap:4px}.vpic img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid #cbd5e1}
.vpbtns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.vpbtns label{position:relative;overflow:hidden}.vpbtns input[type=file]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.info{border:1px solid #bae6fd;background:#f0f9ff;border-radius:12px;padding:8px 10px;margin:8px 0;font-size:13px}
.info .kv{display:flex;gap:6px;padding:3px 0}
.info .kv span{color:#64748b;min-width:84px}
table.t td img{width:40px;height:40px;object-fit:contain;border-radius:6px;background:#f8fafc}
table.t td.pic{width:48px}
.note{background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.note.warn{background:#fffbeb;border-color:#fde68a}
.note.bad{background:#fef2f2;border-color:#fecaca}
.empty{color:#64748b;text-align:center;padding:24px 8px;font-size:14px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:#f8fafc;width:100%;max-width:720px;max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin-top:4px}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #e2e8f0;border-radius:12px;background:#fff;margin:8px 0}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
table.t th{background:#1F3A5F;text-align:left;font-size:12px;color:#fff;padding:8px 8px;border-bottom:2px solid #C9A24A}
table.t td{border-top:1px solid #f1f5f9;padding:8px;vertical-align:top}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
.prod{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #f1f5f9}
.prod img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#f8fafc;flex:0 0 auto}
.prod .ph{width:48px;height:48px;border-radius:8px;background:#f1f5f9;flex:0 0 auto}
.qty{display:flex;align-items:center;gap:4px}
.qty button{min-width:44px;min-height:44px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font-size:18px;font-weight:700}
.qty input{width:64px;text-align:center;padding:8px 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.steps{display:flex;gap:4px;margin:8px 0}
.steps span{flex:1;height:6px;border-radius:3px;background:#e2e8f0}
.steps span.on{background:#1F3A5F}
.login{max-width:420px;margin:0 auto;padding:40px 4px}
.login .mark{width:72px;height:72px;border-radius:50%;border:3px solid #1F3A5F;color:#1F3A5F;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0}
.bar input{flex:1}
.who{font-size:13px;color:#92400e;font-weight:700}

.btiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:4px 0}
.btile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:6px 4px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit;color:#0f172a;cursor:pointer}
.btile img{max-width:84px;max-height:24px;object-fit:contain}
.btile span{font-size:12px;font-weight:600;line-height:1.15;text-align:center;word-break:break-word}
.btile.on{border:2px solid #1F3A5F;background:#ecfeff}
.btile.on::after{content:"\2713";position:absolute;top:2px;right:5px;font-size:12px;font-weight:800;color:#1F3A5F}
.req{color:#b91c1c}

.qst{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}   
.qst button{flex:0 0 auto;min-width:64px;padding:0 10px;min-height:44px;border:1px solid #DCE3EA;background:#fff;border-radius:10px;font:inherit;font-size:13px;font-weight:700;color:#5E6875;cursor:pointer}
.qst button.pending.on{background:#FEF3C7;border-color:#F59E0B;color:#92400E}
.qst button.won.on{background:#15803d;border-color:#15803d;color:#fff}
.qst button.lost.on{background:#b91c1c;border-color:#b91c1c;color:#fff}

.qrow2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.qrow2 .qst{margin-top:0}
.qbt{display:flex;gap:5px;flex-wrap:wrap}
.qbt button{position:relative;flex:0 0 auto;min-width:58px;height:44px;padding:3px 8px;border:1.5px solid #DCE3EA;background:#fff;border-radius:9px;font:inherit;font-size:12px;font-weight:700;color:#334155;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qbt button img{max-width:62px;max-height:24px;object-fit:contain;display:block}
.qbt button.won{border-color:#16a34a;background:#f0fdf4}
.qbt button.lost{border-color:#dc2626;background:#fef2f2}
.qbt button.lost img,.qbt button.lost span{opacity:.4}
.qbt button b{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;color:#fff;font-size:12px;line-height:18px;text-align:center}
.qbt button.won b{background:#16a34a}
.qbt button.lost b{background:#dc2626}
.qsep{width:1px;height:28px;background:#DCE3EA;margin:0 2px}

.code{display:inline-block;font-size:12px;font-weight:800;color:#1F3A5F;background:#E8EEF5;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.card.mine{border-left-color:#C9A24A}
.steps span.on{background:#C9A24A}
h3.sec{color:#1F3A5F}
.nrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nrow input{flex:1 1 150px;width:auto}
.nrow .chip{padding:0 10px}
.sync{font-size:12px;color:#64748b;text-align:center;margin:14px 0}

.sync .btn.sm{min-height:44px;margin:4px 3px;vertical-align:middle}

.exrow{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0;padding-bottom:4px;scrollbar-width:thin}
.exrow .chip{flex:none;white-space:nowrap}
.attw{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh;border:1px solid #e2e8f0;border-radius:12px;background:#fff;margin:8px 0}
table.att{border-collapse:collapse;font-size:13px;min-width:100%}
table.att th{position:sticky;top:0;background:#1F3A5F;color:#fff;font-size:12px;padding:6px 4px;text-align:center;min-height:44px;height:44px;border-bottom:2px solid #C9A24A}
table.att th:first-child,table.att td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:92px;max-width:120px;font-weight:700;padding-left:8px}
table.att th:first-child{background:#1F3A5F}
table.att td{border-top:1px solid #f1f5f9;text-align:center;height:44px;min-width:38px;padding:0 2px;font-weight:800;font-size:15px}
table.att td.ok{color:#15803d}table.att td.no{color:#b91c1c}
table.att td.ok,table.att td.no{font-size:16px}
.tt{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.tt .meta{white-space:normal}
.drtxt{width:100%;min-height:220px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px;overflow:auto;max-height:50vh;margin:8px 0;word-break:break-word}
</style>
</head>
