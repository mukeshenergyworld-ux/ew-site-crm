<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Energy World</title>
<meta name="robots" content="noindex,nofollow"/>
<!-- The 2025 CRM that used to be served here is gone; this page sends you to the apps.
     What was wrong with it, and what was done about it, is written up in the project docs -
     not on a page anybody can read. -->
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
       font:400 16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       background:#f1f5f9;color:#0f172a;padding:24px;
       padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .card{max-width:420px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:16px;
        padding:32px 26px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,.06)}
  h1{margin:0 0 6px;font-size:21px;letter-spacing:-.2px}
  p{margin:0 0 20px;color:#64748b;font-size:14.5px}
  a.go{display:inline-flex;align-items:center;justify-content:center;gap:8px;
       background:#0f766e;color:#fff;text-decoration:none;font-weight:700;font-size:15px;
       padding:13px 24px;border-radius:11px;min-height:48px}
  a.go:active{background:#115e59}
  .sub{margin:18px 0 0;font-size:12.5px;color:#94a3b8}
</style>
</head>
<body>
  <div class="card">
    <h1>Energy World</h1>
    <p>Taking you to the apps&hellip;</p>
    <a class="go" href="apps/">Open Energy World apps</a>
    <p class="sub">If nothing happens, tap the button above.</p>
  </div>
<script>
  /* A real navigation, not a meta refresh: replace() keeps the bare URL out of the back
     button, so pressing Back from the hub leaves the site instead of bouncing here again. */
  location.replace("apps/");
</script>
</body>
</html>
