  function clientPicker(z, cl, pfx) {
    var p = pfx || "m";
    if (cl && cl.name) {
      return '<div class="card">' +
        '<div class="row"><div class="grow">' +
          '<div class="muted" style="font-weight:700">Client</div>' +
          '<div style="font-size:17px;font-weight:800;margin-top:1px">' + esc(cl.name) + '</div>' +
          /* v1.19.0 - "rest all detial, phone no, executive dealing client, address will be
             auto filled". Every one of these was already on his record; the challan simply
             never showed them, so the man at the counter re-asked for a number the office
             already had. Nothing new is typed - it is the same record, read out. */
          '<div class="muted" style="margin-top:3px">' +
            esc([cl.location, cl.area].filter(Boolean).join(" · ")) +
            (cl.mobile ? ' · ' + esc(cl.mobile) : ' · <b style="color:#b91c1c">no mobile on his record</b>') +
            (execName(cl) ? '<br>Executive: <b>' + esc(execName(cl)) + '</b>'
                          : '<br><b style="color:#b45309">No executive set for him</b>') +
            (cl.plumber ? '<br>PL ' + esc(cl.plumber) : '') +
            (cl.architect ? (cl.plumber ? ' · ' : '<br>') + 'AR ' + esc(cl.architect) : '') +
          '</div>' +
        '</div><button class="btn sm gry" data-act="cp-change" data-p="' + p + '">Change</button></div>' +
        /* full width, BELOW the name row - inside it the box was squeezed against the
           Change button. Caught in a screenshot, not in the markup. */
        addressBlock(cl) +
        moneyBlock(cl) +
        /* v1.12.0 - the card already said what was missing; now it can be answered here */
        (chGaps(cl).length
          ? '<div style="margin-top:8px"><button class="btn sm amb" data-act="dt-ask" data-n="' + esc(cl.name) + '">' +
            'Add his ' + esc(chGaps(cl).map(function (f) { return f.label.toLowerCase(); }).join(", ")) +
            '</button></div>'
          : '') +
        sitePicker(z, cl, p) +
        '</div>';
    }

    var h2 = '<div class="card"><div class="muted" style="font-weight:700;margin-bottom:6px">Who is it for?</div>';

    /* ---------- SEARCH FIRST (v1.20.0) ----------
       "also provide a search box, so one can search from there and select client".

       District then area then name is three decisions to reach a man whose name he already
       knows. It is the right path when he is BROWSING - "who do we have in Karnal" - and the
       wrong one every other time. So the box comes first and searches everyone, in every
       district, by name, short name, area or mobile. Two letters is enough.

       It also walks straight past an empty district list, which is what he is looking at
       today. */
    var gq = String(z.gq || "").trim();
    h2 += '<label>Search any client &mdash; his name, his <b>firm</b>, area or number</label>' +
      '<input id="' + p + '_gq" placeholder="name, firm, area or number" value="' + esc(gq) + '" autocomplete="off"/>';
    if (gq.length >= 2) {
      var qq = lower(gq);
      var hits = clients().filter(function (c) {
        /* v1.22.0 - one haystack, so this box finds the firm on the cheque as well as the
           man on the challan. See clientHay(). */
        return clientHay(c).indexOf(qq) >= 0;
      }).sort(function (a, b) { return alpha(a.name, b.name); });
      if (!hits.length) {
        var _ba = bookAge(S.syncAt);
      h2 += '<div class="empty" style="padding:14px 8px">Nobody by that. Try fewer letters.<br>' +
          'A man who has never taken a delivery has to be registered in the CRM first, so his ' +
          'discount is set before his first one.' +
          /* 18 Aug: the age of the book, at the exact moment he is asking "where is he?".
             A client added in the CRM an hour ago cannot be in a book pulled yesterday, and
             this is the only screen that can say so. */
          (_ba.tone === "ok" ? ''
            : '<br><br><b style="color:#b45309">This phone\u2019s book is ' + esc(_ba.txt) +
              '.</b><br>A client added in the CRM since then will not be in it. ' +
              'Tap the arrow at the top to pull the latest.') +
          '</div>';
      } else {
        h2 += '<div style="margin-top:8px">' + hits.slice(0, 30).map(function (c) {
          return '<button class="tile" data-act="cp-pick" data-p="' + p + '" data-n="' + esc(c.name) + '">' +
            '<div class="grow">' + esc(c.name) +
            '<span class="sub">' + esc([c.location, c.area, c.mobile].filter(Boolean).join(" · ") || "no district on his record") +
            '</span></div><span class="pill">&#8250;</span></button>';
        }).join("") +
        (hits.length > 30 ? '<div class="muted">and ' + (hits.length - 30) + ' more &mdash; type another letter</div>' : '') +
        '</div>';
      }
      /* the three-step browse is not shown while he is searching - it is the other way in,
         not a second thing to read */
      return h2 + '</div>';
    }

    if (clientsAreDerived()) {
      h2 += '<div class="pill amb" style="display:block;padding:9px;text-align:left;margin-top:8px">' +
        'The client list did not come back for your login, so this is built from <b>your own ' +
        'delivery book</b> &mdash; everyone you have already sent a lorry to. Search by name ' +
        'above. The office has been told; nothing you make here is affected.</div>';
    }
    h2 += '<div class="muted" style="font-size:11.5px;margin:10px 0 2px;text-align:center">' +
      '&mdash; or find him by district &mdash;</div>';
    var ds = districts();
    /* v1.19.0 - "Ask to select district from Dropdown / ask to select area from dropdown".
       These were wrap-buttons. Nine districts already took two rows on a laptop and pushed
       the whole form down; on the phone they pushed it further. A select is one line however
       many districts there are, it is the control a man already knows from every other form,
       and it cannot be half-tapped. The counts stay - they are how he knows Panipat is the
       real one. Both lists are alphabetical (districts() and areasIn() already sort). */
    h2 += '<label>1 &middot; District</label>' +
      '<select class="cp-dsel" data-p="' + p + '">' +
      '<option value="">&mdash; choose the district &mdash;</option>' +
      ds.map(function (d) {
        return '<option value="' + esc(d.name) + '"' + (z.dist === d.name ? ' selected' : '') + '>' +
          esc(d.name) + '  (' + d.n + ')</option>';
      }).join("") + '</select>';
    if (!ds.length) {
      h2 += '<div class="pill amb" style="display:block;padding:9px;text-align:left;margin-top:7px">' +
        'Nobody on your book has a district on his record yet, so there is nothing to choose ' +
        'from here. <b>Use the search box above</b> &mdash; it finds him by name.</div>';
    }

    if (!z.dist) return h2 + '<div class="muted" style="margin-top:8px">Pick the district and the areas will follow.</div></div>';

    var as = areasIn(z.dist);
    h2 += '<label>2 &middot; Area in ' + esc(z.dist) + '</label>' +
      '<select class="cp-asel" data-p="' + p + '">' +
      '<option value=""' + (z.area ? '' : ' selected') + '>All of ' + esc(z.dist) + '</option>' +
      as.map(function (a) {
        return '<option value="' + esc(a.name) + '"' + (z.area === a.name ? ' selected' : '') + '>' +
          esc(a.name) + '  (' + a.n + ')</option>';
      }).join("") + '</select>';

    var list = clientsIn(z.dist, z.area, z.cq);
    h2 += '<label>3 &middot; His name &mdash; type the first letters</label>' +
      '<input id="' + p + '_cq" placeholder="e.g. rak, or rk for Rakesh Kumar" value="' + esc(z.cq || "") + '"/>';
    if (!list.length) {
      h2 += '<div class="empty" style="padding:14px 8px">Nobody here by that name.<br>' +
        'A new man has to be registered in the CRM first, so his discount is set before his first delivery.</div>';
    } else {
      h2 += '<div style="margin-top:8px">' + list.slice(0, 40).map(function (c) {
        return '<button class="tile" data-act="cp-pick" data-p="' + p + '" data-n="' + esc(c.name) + '">' +
          '<div class="grow">' + esc(c.name) +
          '<span class="sub">' + esc([c.area, c.mobile].filter(Boolean).join(" · ") || "no area, no mobile") + '</span></div>' +
          '<span class="pill">&#8250;</span></button>';
      }).join("") +
      (list.length > 40 ? '<div class="muted">and ' + (list.length - 40) + ' more &mdash; type another letter</div>' : '') +
      '</div>';
    }
    return h2 + '</div>';
  }

  /* ---------- WHICH SITE ----------
     v1.5 - the owner's rule reaches the site. A site typed by hand is how one project
     quietly becomes three - "Ansal", "ansal plots", "Ansal I Blk" - and from then on his
     hisab, his pitch board and his delivery history are each looking at a different
     place. His own sites are buttons. A genuinely new site is still possible, because a
     man does start a new project, but it takes a deliberate press so it is never the
     lazy path. */
  function sitePicker(z, cl, pfx) {
    var p = pfx || "m";
    var st = sitesFor((cl && cl.name) || "");
    var h = '<label>Site</label>';
    if (z.siteNew) {
      return h +
        '<input id="' + p + '_site" placeholder="The new site or project" value="' + esc(z.site || "") + '"/>' +
        '<div class="row" style="margin-top:7px">' +
          '<button class="btn sm gry" data-act="cp-sitenew" data-p="' + p + '" data-off="1">' +
          (st.length ? '&#8592; Back to his sites' : 'Clear it') + '</button></div>';
    }
    if (!st.length) {
      return h +
        '<div class="pill amb" style="display:block;padding:9px;text-align:left">' +
          'No site on his record yet.</div>' +
        '<div class="row" style="margin-top:7px">' +
          '<button class="btn sm gry" data-act="cp-sitenew" data-p="' + p + '">+ A new site</button></div>';
    }
    h += '<div class="row" style="flex-wrap:wrap;gap:6px">' +
      st.map(function (x) {
        return '<button class="btn sm ' + (z.site === x.name ? '' : 'gry') +
          '" data-act="cp-site" data-p="' + p + '" data-s="' + esc(x.name) + '">' + esc(x.name) + '</button>';
      }).join("") +
      '<button class="btn sm ' + (z.site ? 'gry' : '') + '" data-act="cp-site" data-p="' + p + '" data-s="">None</button>' +
      '<button class="btn sm gry" data-act="cp-sitenew" data-p="' + p + '">+ A new site</button>' +
      '</div>';
    return h;
  }

  /* ---------- WHICH DELIVERY IS IT COMING BACK OFF ----------
     v1.5 - it used to be a box asking for a challan number "if you know it", which meant
     it was usually blank or wrong, and a return that cannot be tied to its delivery cannot
     be checked against what actually went out. His last deliveries are buttons, newest
     first, each showing the paper book number too because that is the one the godown
     reads off the challan in his hand. */
  function againstPicker(z, cl) {
    var mine = challans().filter(function (c) { return lower(c.customerName) === lower(cl && cl.name); });
    var list = newestFirst(mine).slice(0, 12);
    var h = '<label>Against which delivery?</label>';
    if (!list.length) {
      return h + '<div class="pill amb" style="display:block;padding:9px;text-align:left">' +
        'Nothing has gone out to him on this app yet.</div>';
    }
    h += '<div class="row" style="flex-wrap:wrap;gap:6px">' +
      list.map(function (c) {
        var mn = manualNoFor(c);
        return '<button class="btn sm ' + (z.against === c.challanNo ? '' : 'gry') +
          '" data-act="rt-against" data-n="' + esc(c.challanNo) + '">' + esc(c.challanNo) +
          (mn ? ' <b style="opacity:.75">B' + esc(mn) + '</b>' : '') + '</button>';
      }).join("") +
      '<button class="btn sm ' + (z.against ? 'gry' : '') + '" data-act="rt-against" data-n="">Not sure</button>' +
      '</div>' +
      (mine.length > list.length ? '<div class="muted" style="margin-top:5px">His last 12 of ' + mine.length + '.</div>' : '');
    return h;
  }

  /* Why it came back. Five answers cover almost everything, and a picked one can be
     counted later - "damaged" across a month is a number worth having. Anything else is
     still typeable, deliberately, because the sixth reason always exists. */
  var RT_REASONS = ["Extra material", "Wrong size", "Damaged", "Not required", "Wrong item sent"];
  function reasonPicker(z) {
    var known = RT_REASONS.indexOf(z.reason) >= 0;
    var h = '<label>Why is it coming back?</label>' +
      '<div class="row" style="flex-wrap:wrap;gap:6px">' +
      RT_REASONS.map(function (r) {
        return '<button class="btn sm ' + (z.reason === r ? '' : 'gry') +
          '" data-act="rt-reason" data-n="' + esc(r) + '">' + esc(r) + '</button>';
      }).join("") +
      '<button class="btn sm ' + (z.reasonOther ? '' : 'gry') + '" data-act="rt-reason" data-n="" data-other="1">Something else</button>' +
      '</div>';
    if (z.reasonOther) {
      h += '<input id="r_reason" placeholder="In a few words" value="' +
        esc(known ? "" : (z.reason || "")) + '" style="margin-top:7px"/>';
    }
    return h;
  }

  function viewMake() {
    var z = S.ch;
    if (!z) {
      var f = S.chFilter || "all";
      var list = newestFirst(chFiltered(f));
      var hidden = olderCount(challans());
      var h = '<div class="card" style="background:#0f766e;color:#fff;border-color:#0f766e">' +
        '<div style="font-size:17px;font-weight:800">Send material out</div>' +
        '<div style="font-size:12.5px;opacity:.9;margin-top:3px">Pick the client, add the material, write the book number. It saves as a <b>draft</b> — the accounts desk passes it before it counts against his account.</div></div>' +
        '<button class="btn full" data-act="ch-new" style="margin:12px 0">+ New challan</button>' +
        /* v1.18.0 - if the server sent no clients for this sign-in, SAY SO here, where the
           man is about to press New challan and find an empty picker. The rest of the app -
           receipts, the approve queue, every challan already pulled - still works, which is
           exactly why refusing the whole book over this was the wrong answer. */
        (clients().length ? "" :
          '<div class="card" style="border-color:#fbbf24;background:#fffbeb">' +
          '<h3 style="margin:0">No clients came back for your sign-in</h3>' +
          '<div class="meta" style="margin-top:4px">The server answered, but sent an empty ' +
          'client list, so <b>a new challan cannot be started</b>. Everything already on this ' +
          'phone still works \u2014 receipts, approvals and the challans below. ' +
          'Ask the office to check what your name is allowed to see.</div>' +
          '<div class="acts" style="margin-top:10px">' +
          '<button class="btn sm ghost" data-act="refresh">Try pulling again</button></div></div>') +
        searchBox() + statBar() + chChips();
      if (!list.length) {
        return h + '<div class="empty">Nothing here' +
          (f === "all" ? ' in the last 60 days.' : ' under that heading.') + '</div>' +
          showAllBar(hidden, 'than 60 days');
      }
      var val3 = list.reduce(function (a, c) { return a + chValue(c); }, 0);
      h += '<div class="muted" style="font-weight:700;margin:8px 2px 4px">' +
        list.length + ' challan' + (list.length === 1 ? '' : 's') + ' · ' + money(val3) +
        ' · newest first</div>';
      h += execBands(list);
      return h + showAllBar(hidden, 'than 60 days');
    }
    var cl = clientByName(z.client) || {};
    var lines = z.items || [];
    var goods = lines.reduce(function (a, l) {
      var d = l.disc === "" || l.disc == null ? clientDiscount(z.client, l.brand) : num(l.disc);
      return a + num(l.qty) * Math.round(num(l.rate) * (1 - d / 100));
    }, 0);
    var isEdit = !!z.editId;
    var h = '<div class="row" style="margin:6px 0 10px"><button class="btn sm gry" data-act="ch-cancel">&#8592; Back</button>' +
      '<div class="grow" style="font-weight:800;font-size:16px">' +
      (isEdit ? 'Edit challan ' + esc(z.editNo || "") : 'New challan') + '</div></div>';
    /* v1.25.0 - the CRM's warning, word for word. Approval releases material; it was given on
       the earlier contents and cannot carry over to changed ones. */
    if (isEdit && z.editStatus === "Approved") {
      h += '<div class="card" style="border-color:#fed7aa;background:#fff7ed;color:#b45309">' +
        'This challan is <b>Approved</b>. Saving a change sends it back to <b>Draft</b>, so it ' +
        'must be passed again before dispatch &mdash; approval releases material and cannot ' +
        'carry over to changed contents.</div>';
    }

    h += clientPicker(z, cl);

    /* v1.24.0 - "challan app challan making process should be exact like crm".
       The CRM's order is: client, MANUAL CHALLAN NO, products, freight, DISCOUNT, driver,
       vehicle. This app had the book number at the very bottom, under the driver, and no
       discount field at all - so a man moving between the two screens was hunting for the
       same box in two different places, and the bargain he had just struck had nowhere to go.
       The pickers stay as they are: same steps, laid out for a phone. */
    h += '<div class="card"><div class="bookno" style="margin:0">' +
        '<label for="m_manual">Manual Challan No</label>' +
        '<input id="m_manual" class="' + (z.manual ? 'has' : '') + '" inputmode="numeric" placeholder="1247" ' +
          'title="The number in the paper challan book - optional" value="' + esc(z.manual || "") + '"/>' +
        '<span>' + (z.manual ? '&#10003;' : '') + '</span>' +
      '</div></div>';

    h += '<div class="card"><div class="row"><div class="grow" style="font-weight:800">Material</div>' +
      '<button class="btn sm" data-act="pk-open" data-into="ch">+ Add material</button></div>';
    if (!lines.length) {
      h += '<div class="empty" style="padding:16px 8px">Nothing on this challan yet.</div>';
    } else {
      h += lines.map(function (l, i) {
        var d = l.disc === "" || l.disc == null ? clientDiscount(z.client, l.brand) : num(l.disc);
        var net = num(l.qty) * Math.round(num(l.rate) * (1 - d / 100));
        return '<div class="line"><div class="grow">' +
          '<div style="font-weight:700;font-size:13.5px">' + esc(l.desc) + '</div>' +
          /* a job line has no code, no quantity and no rate to show - printing "JOBWORK · 1 job
             × Rs2500" next to "Job work" says the same thing three times and one of them looks
             like a product code the customer can look up */
          /* v1.44.0 - and an off-list line's own code is X-1787504013919, which is a reference
             to nothing. It says what it is and which brand it was billed under instead. */
          '<div class="muted">' + (isJobLine(l)
            ? 'Job work / Labour charges'
            : (isOtherLine(l) ? 'Not in the price list · ' + esc(l.brand || "no brand") : esc(l.code)) +
              ' · ' + num(l.qty) + ' ' + esc(l.unit || "") +
              ' × ' + money(l.rate) + (d ? ' &minus;' + d + '%' : '')) + '</div></div>' +
          '<div style="font-weight:800;white-space:nowrap">' + money(net) + '</div>' +
          '<button class="btn sm gry" data-act="ln-del" data-i="' + i + '">&times;</button></div>';
      }).join("");
      h += '<div class="row" style="margin-top:9px"><div class="grow muted">' + lines.length + ' line' + (lines.length === 1 ? '' : 's') + '</div>' +
        '<div class="big">' + money(goods) + '</div></div>';
    }
    h += '</div>';

    h += '<div class="card"><div class="grid2">' +
      '<div><label>Freight</label><input id="m_freight" inputmode="decimal" value="' + esc(z.freight || "") + '"/></div>' +
      '<div><label>Freight borne by</label><select id="m_fto">' +
        /* v1.6 - his words: "Client will be by defult in rare case its to be borne by
           Energy World". Client is first AND is what an untouched form saves. */
        ['Client','Energy World'].map(function (o) { return '<option' + (String(z.fto || "Client") === o ? ' selected' : '') + '>' + o + '</option>'; }).join("") +
      '</select></div></div>' +
      /* v1.24.0 - THE BARGAIN. The CRM has carried this since v6.9.x and this app never had
         it, so a discount agreed at the counter could not be written down by the man who
         agreed it. Its absence was not neutral: every line quietly remembers what the client
         ACTUALLY paid, and without this the challan records a price he did not pay - so if
         five of twenty come back later he is credited the list price, and the leak is
         invisible because each credit looks fair on its own.

         Admin only, exactly as in the CRM (canSetPricing there; the same role here). Anyone
         else sees it, greyed, so he knows it exists and who to ask - a field that is simply
         absent teaches a man that the app cannot do it. */
      '<div class="grid2" style="margin-top:8px">' +
      '<div><label>Discount given on the whole challan</label>' +
        '<input id="m_disc" inputmode="decimal" placeholder="0" value="' + esc(z.disc != null ? z.disc : "") + '"' +
        (canSetPricing() ? '' : ' readonly title="Only the owner sets a challan discount" style="background:#f1f5f9;color:#94a3b8"') +
        '/></div>' +
      '<div><label>Why (optional)</label>' +
        '<input id="m_discnote" placeholder="bargained on site" value="' + esc(z.discnote || "") + '"' +
        (canSetPricing() ? '' : ' readonly style="background:#f1f5f9;color:#94a3b8"') + '/></div>' +
      '</div>' +
      driverPicker(z) +
      '</div>';

    /* v1.46.0 - beside the Save button, not up beside the fare box: that is where he is
       looking when he taps Create, and it is the tap this is answering. */
    h += chFreightBar();
    h += '<button class="btn full" data-act="ch-save" style="margin:14px 0 6px">' +
      (isEdit ? 'Save changes' : 'Create the challan') + '</button>' +
      '<div class="muted" style="text-align:center;margin-bottom:10px">' +
      (isEdit
        ? 'It keeps its number, <b>' + esc(z.editNo || "") + '</b>.' +
          (z.editStatus === "Approved" ? ' It goes back to <b>draft</b> and must be passed again.' : '')
        : 'It is saved as a <b>draft</b>. ' +
          (canApprove() ? 'You can pass it yourself on the Approve screen.' : 'The accounts desk passes it.')) +
      '</div>';
    return h;
  }

  /* ---------- THE DRIVER, AND HIS LORRY ----------
     v1.4 - the owner's rule: if it is already on the book, it is picked, not typed. A driver
     typed as free text can never be totalled, so freight per driver becomes guesswork, and
     "Ramesh", "ramesh" and "Ramesh ji" become three men. Picking him fills in his vehicle and
     his mobile from his own record. The lorry can still be overridden for the day he is in a
     different one - that is a real thing that happens - but it starts from his own. */
  function driverPicker(z, pfx) {
    var p = pfx || "m";
    var list = ((S.data && S.data.drivers) || []).filter(function (d) { return String(d.name || "").trim(); });
    var picked = list.filter(function (d) { return lower(d.name) === lower(z.driver); })[0];
    var h = '<label>' + (p === "r" ? 'Driver who brought it back' : 'Driver') + '</label>';
    if (!list.length) {
      return h + '<div class="pill amb" style="display:block;padding:9px;text-align:left">' +
        'No drivers on the register yet.</div>' +
        '<div class="row" style="margin-top:7px">' +
        '<button class="btn sm" data-act="dv-new" data-p="' + p + '">+ Add a driver</button></div>';
    }
    /* v1.19.0 - "driver name also drop down, else add new, drive mobile and vehile no auto
       update". Picking him has always filled his number and his lorry; the change is that
       the register is a dropdown rather than a row of buttons that grows every time a new
       man joins. Alphabetical, because a register you scan is a register in order. */
    h += '<select class="dv-sel" data-p="' + p + '">' +
      '<option value="">&mdash; nobody yet &mdash;</option>' +
      list.slice().sort(function (a, b) { return alpha(a.name, b.name); }).map(function (d) {
        return '<option value="' + esc(d.name) + '"' + (lower(d.name) === lower(z.driver) ? ' selected' : '') + '>' +
          esc(d.name) + (d.vehicle ? '  ·  ' + esc(d.vehicle) : '') + '</option>';
      }).join("") + '</select>' +

  /* ================= THE CHALLAN ON PAPER =================
     A delivery document, not a quotation: no prices and no pictures. Prices live in the
     ledger, not in the driver's hand.

     v1.27.0 - IT NOW CARRIES WHAT THE CRM'S CARRIES. He put the two side by side: same
     challan, two completely different sheets. The CRM's had the delivery address, the
     freight line, who prepared it and who approved it, and a three-line receipt block. This
     one had none of those and said "Draft" - so the paper that goes out with the lorry did
     not record where the lorry was going or who bore the freight, and the office's file copy
     and the godown's copy of one delivery disagreed about what happened.

     THE LOGOS ARE DELIBERATELY NOT HERE, and that is his decision. The CRM's copy is 608 KB,
     almost all of it twelve brand logos. This one is base64'd through Apps Script to be
     hosted for WhatsApp, and this codebase already has a scar from a 600 KB PDF breaking a
     send - the quote's font embed. Same content, roughly 20 KB, so the send survives one bar
     of signal in a godown. The CRM's printed copy keeps its logos.

     Portrait, not the CRM's landscape half-sheet: this is the copy that gets read on a phone
     and shared on WhatsApp, and the landscape 2-up was for the office printer. */

  function chalPdf(c) {
    return ensurePdf().then(function () {
      var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
      var W = 210, H = 297, L = 14, R = W - 14;
      var F = function (w) { doc.setFont("helvetica", w === "bold" ? "bold" : "normal"); };
      var g = function (v) { doc.setTextColor(v, v, v); };
      var cl = clientByName(c.customerName) || {};
      var mn = manualNoFor(c);
      var st = chStatus(c);

      /* ---- NO FIRM NAME ON THE CUSTOMER'S CHALLAN  (v1.44.0, 23 August 2026) ----
         HIS WORDS: "earlier in challan energyworld name not mentioned, now its mentioned, i
         strictly not want to mention energy world details on challan for customer".

         He is right about both halves, and I checked before changing anything. The CRM's own
         printed challan has never carried the name - header() opens straight into DELIVERY
         CHALLAN and the number. THIS app was created on 17 August with a branded header, and
         every challan printed from a phone since then has carried the firm's name and the
         three towns. Those two lines are the ONLY place this document identifies us: there is
         no GST line, no address and no telephone number anywhere else on it.

         The teal band stays, because it is what makes the sheet read as a document rather than
         a printout. What it says now is what the paper IS, not who printed it. */
      doc.setFillColor(15, 118, 110); doc.rect(0, 0, W, 26, "F");
      doc.setTextColor(255); F("bold"); doc.setFontSize(15);
      doc.text("DELIVERY CHALLAN", L, 15.5);
      F("bold"); doc.setFontSize(12);
      doc.text(String(c.challanNo || ""), R, 15.5, { align: "right" });

      /* ---- DELIVER TO, and the three facts the CRM puts opposite it ---- */
      var y = 36;
      g(100); F("bold"); doc.setFontSize(7);
      doc.text("DELIVER TO", L, y);
      doc.text("DATE", R, y, { align: "right" });
      doc.text("PREPARED BY", R - 34, y, { align: "right" });
      doc.text("APPROVED BY", R - 74, y, { align: "right" });
      g(15); F("bold"); doc.setFontSize(12);
      doc.text(String(c.customerName || "-"), L, y + 6.5);
      F(); doc.setFontSize(8.5); g(60);
      doc.text(dstr(d10(c.createdAt)), R, y + 6, { align: "right" });
      doc.text(String(c.createdBy || "-"), R - 34, y + 6, { align: "right" });
      doc.text(String(c.approvedBy || "\u2014 not yet passed \u2014"), R - 74, y + 6, { align: "right" });
      y += 11;
      /* THE ADDRESS. The lorry has to get somewhere, and this sheet is the only thing in the
         driver's hand that says where. It was not on this copy at all. */
      var addr = String(cl.address || "").trim();
      if (addr) {
        g(60); F(); doc.setFontSize(9);
        doc.splitTextToSize(addr, R - L - 60).slice(0, 2).forEach(function (t) {
          doc.text(t, L, y); y += 4.4;
        });
      }
      if (c.site) { g(60); F(); doc.setFontSize(9); doc.text("Site: " + String(c.site), L, y); y += 4.4; }
      if (cl.mobile) { g(100); doc.setFontSize(8.5); doc.text(String(cl.mobile), L, y); y += 4.4; }
      if (mn) { g(150); F("bold"); doc.setFontSize(8.5); doc.text("Book no " + String(mn), L, y); y += 4.4; }
      /* a challan that has NOT been passed must say so on the paper. The CRM's copy is only
         ever printed after approval; this one can be printed at the counter before it. */
      if (st === "Draft") {
        doc.setFillColor(254, 226, 226); doc.rect(L, y - 3.2, R - L, 6.4, "F");
        doc.setTextColor(185, 28, 28); F("bold"); doc.setFontSize(8);
        doc.text("NOT PASSED YET \u2014 material must not leave on this challan.", L + 2, y + 1.2);
        y += 9;
      }

      /* ---- the table, with the CRM's columns ---- */
      y += 4;
      doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.3); doc.line(L, y, R, y); y += 6;
      var Xn = L, Xc = L + 8, Xd = L + 34, Xu = R - 30, Xq = R;
      g(100); F("bold"); doc.setFontSize(7.5);
      doc.text("#", Xn, y); doc.text("CODE", Xc, y); doc.text("ITEM DESCRIPTION", Xd, y);
      doc.text("UNIT", Xu, y, { align: "right" }); doc.text("QTY", Xq, y, { align: "right" });
      y += 2.5; doc.line(L, y, R, y); y += 5.5;

      var rows = chLines(c), n = 0;
      function newPage() {
        doc.addPage(); y = 20;
        g(100); F("bold"); doc.setFontSize(7.5);
        doc.text("#", Xn, y); doc.text("CODE", Xc, y); doc.text("ITEM DESCRIPTION", Xd, y);
        doc.text("UNIT", Xu, y, { align: "right" }); doc.text("QTY", Xq, y, { align: "right" });
        y += 2.5; doc.setDrawColor(226, 232, 240); doc.line(L, y, R, y); y += 5.5;
      }
      rows.forEach(function (l) {
        if (y > H - 66) newPage();
        n++;
        g(130); F(); doc.setFontSize(8);
        doc.text(String(n), Xn, y);
        g(60); doc.setFontSize(7.5);
        /* v1.37.0 - a job-work line has no product code, and printing the internal word
           JOBWORK in a column headed CODE gives the customer a reference to ask about that
           does not exist. The column says what the line IS instead. */
        /* v1.44.0 - same reasoning for an off-list item: X-1787504013919 in a column headed
           CODE is a reference the customer cannot look up and we cannot answer. */
        doc.text(isJobLine(l) ? "JOB WORK" : (isOtherLine(l) ? "-" : String(l.code || "")), Xc, y);
        g(15); F(); doc.setFontSize(9.5);
        var nm = doc.splitTextToSize(String(l.desc || l.code || ""), Xu - Xd - 6);
        doc.text(nm, Xd, y);
        g(90); doc.setFontSize(8);
        doc.text(String(l.unit || ""), Xu, y, { align: "right" });
        g(15); F("bold"); doc.setFontSize(10);
        /* String(num()) prints 3 as "3" and 1.5 as "1.5" - the same thing the line list on
           screen shows. qShow() lives in the CRM only; calling it here would have thrown on
           the first challan printed. Caught by generating a real PDF rather than reading the
           code. */
        doc.text(String(num(l.qty)), Xq, y, { align: "right" });
        y += Math.max(7.5, nm.length * 4.4 + 3);
        doc.setDrawColor(241, 245, 249); doc.setLineWidth(0.2); doc.line(L, y - 2.6, R, y - 2.6);
      });
      /* the transport line closes the list, like a final serial - the CRM's own words */
      if (c.driver || c.vehicle || num(c.freight)) {
        if (y > H - 66) newPage();
        n++;
        g(130); F(); doc.setFontSize(8); doc.text(String(n), Xn, y);
        g(90); F("bold"); doc.setFontSize(7.5); doc.text("TRANSPORT", Xc, y);
        g(15); F(); doc.setFontSize(9);

        /* "Rs." not the rupee sign: jsPDF's core Helvetica has no glyph for U+20B9 and drops
           it SILENTLY, so the freight read "Freight 150 (Client)" with no currency at all.
           The CRM's own PDFs carry the same note - it chose Rs. over embedding a 600 KB font.
           Found by generating the PDF and looking at it, not by reading the code. */
        if (num(c.freight)) t += (t ? "   \u00b7   " : "") + "Freight Rs. " +
          Math.round(num(c.freight)).toLocaleString("en-IN") +
          " (" + String(c.freightTo || "Client") + ")";
        doc.text(doc.splitTextToSize(t, Xq - Xd)[0] || "", Xd, y);
        y += 8;
      }

      /* ---- the sign-off, on the last page, exactly the CRM's three lines ---- */
      var pages = doc.getNumberOfPages();
      doc.setPage(pages);
      if (c.approvedBy) {
        g(165); F(); doc.setFontSize(7);
        doc.text("Dispatch approved by " + String(c.approvedBy) + ", verified by PIN.",
                 R, H - 34, { align: "right" });
      }
      doc.setDrawColor(190, 190, 190); doc.setLineWidth(0.2); doc.line(L, H - 30, R, H - 30);
      g(90); F("bold"); doc.setFontSize(8);
      doc.text("RECEIVED THE ABOVE MATERIAL IN GOOD CONDITION", L, H - 24);
      doc.setDrawColor(150, 150, 150); doc.setLineWidth(0.3);
      var S1 = 58, G1 = 68, S2 = 118, G2 = 128, S3 = 168;
      doc.line(L, H - 12, L + S1, H - 12);
      doc.line(L + G1, H - 12, L + S2, H - 12);
      doc.line(L + G2, H - 12, L + S3, H - 12);
      g(95); F(); doc.setFontSize(7.5);
      doc.text("Client name & signature", L, H - 8.5);
      doc.text("Contact number", L + G1, H - 8.5);
      doc.text("Date", L + G2, H - 8.5);
      g(140); doc.setFontSize(7);
      doc.text("Page " + pages + " of " + pages, R, H - 8.5, { align: "right" });
      return doc;
    });
  }

  /* ================= THE SIGNED RECEIPT =================
     Photograph the signed paper, shrink it so it goes up on one bar of signal, wrap it in a
     one-page PDF and file it against the record. The audit row is written in the CRM's own
     shape, keyed by the record's id, so the same receipt appears on the same challan in
     HISAB with no server change at all. */
  function shrink(dataUrl, maxPx, quality) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, m = Math.max(w, h);
        if (m > maxPx) { w = Math.round(w * maxPx / m); h = Math.round(h * maxPx / m); }
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        res({ url: cv.toDataURL("image/jpeg", quality || 0.72), w: w, h: h });
      };
      img.onerror = function () { rej(new Error("bad image")); };
      img.src = dataUrl;
    });
  }

  function attachReceipt(rec, dataUrl) {
    toast("Filing the receipt…");
    return shrink(dataUrl, 1600, 0.72).then(function (big) {
      return shrink(dataUrl, 220, 0.55).then(function (small) {
        return ensurePdf().then(function () {
          var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
          var W = 210, L = 12, no = String(rec.challanNo || rec.returnNo || "");
          doc.setFillColor(15, 118, 110); doc.rect(0, 0, W, 20, "F");
          doc.setTextColor(255); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
          doc.text("SIGNED RECEIPT — " + no, L, 13);
          doc.setTextColor(15, 23, 42); doc.setFont("helvetica", "normal"); doc.setFontSize(9);
          doc.text(String(rec.customerName || "") + (rec.site ? " · " + rec.site : ""), L, 27);
          doc.text("Photographed by " + String(S.user || "") + " on " + dstr(today()), L, 33);
          var maxW = W - L * 2, maxH = 240;
          var sc = Math.min(maxW / big.w, maxH / big.h);
          doc.addImage(big.url, "JPEG", L, 38, big.w * sc, big.h * sc);
          var b64 = doc.output("datauristring").split(",")[1];
          /* v1.41.0 - mirrored to Telegram on the way up, with the client on it. Same fields,
             same reason, as the CRM's queue: the server cannot read a client's name out of
             "PUNIT8708_150826_001_receipt.pdf". */
          return api("pdfHost", { pdfBase64: b64, filename: no.replace(/[^\w.-]+/g, "_") + "_receipt.pdf",
                                  mirror: "receipt", client: String(rec.customerName || ""),
                                  site: String(rec.site || ""), no: no,
                                  at: new Date().toISOString(), by: String(S.user || "") })
            .then(function (h) {
              /* v1.31.0 - carry the server's reason. Since backend v98 hosting needs a PIN,
                 and "host failed" would have hidden "not signed in on this device" behind a
                 word that tells the man at the counter nothing he can act on. */
              if (!h || !h.ok || !h.url) {
                throw new Error((h && h.error) ? String(h.error)
                                               : "the server took the receipt but sent no link back");
              }
              return saveProof(rec, h.url, small.url, h.tgLink).then(function (r) {
                if (!r || !r.ok) throw new Error("audit failed");
                (S.data.audit = S.data.audit || []).push(r.row);
                bust();
                /* v1.8.0 - AND MARK THE DELIVERY RECEIVED. Filing the paper without this left
                   the challan signed for and billed by nobody: HISAB, the client's dues, the
                   Payment app's chase list and the partner's incentive all count a delivery on
                   receiptReceived === "Y" and on nothing else. */
                /* v1.10.0 - three outcomes, and they are not the same thing. Saying one
                   sentence for all three is how "it could not be marked received" came to
                   cover both a passing network fault and a challan nobody had approved. */
                return markReceived(rec).then(function (mv) {
                  render();
                  if (!mv || mv.ok) { toast("Receipt filed against " + no + " \u2014 delivery marked received."); return; }
                  if (mv.blocked) {
                    toast("Receipt filed against " + no + ". It is NOT marked received, because " +
                          "this challan has not been passed yet \u2014 pass it first.");
                    return;
                  }
                  toast("Receipt filed against " + no + ". Marking it received is held on this phone " +
                        "and goes up by itself; until it does it stays on the no-receipt list.");
                }).catch(function () {
                  render();
                  toast("Receipt filed against " + no + ", but marking it received failed \u2014 " +
                        "so it is not billed yet. Refresh and try again.");
                });
              });
            });
        });
      });
    }).catch(function () {
      toast("Could not file the receipt. Nothing was changed — try again when the signal is better.");
    });
  }


  function fromB64u(str) {
    var s2 = String(str).replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(s2), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function bioEnrol() {
    if (!bioAvailable()) { toast("This phone has no Face ID or fingerprint the browser can use."); return; }
    if (!S.user || !S.pin) { toast("Sign in first, then turn it on."); return; }
    navigator.credentials.create({
      publicKey: {
        challenge: randBytes(32), rp: { name: "Energy World Challan" },
        user: { id: randBytes(16), name: S.user, displayName: S.user },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000, attestation: "none"
      }
    }).then(function (cred) {
      localStorage.setItem(BIO_KEY, JSON.stringify({ id: b64u(cred.rawId), user: S.user, pin: S.pin }));
      toast("Face ID / fingerprint enabled on this phone.");
      S.sheet = sheetAccount(); render();
    }).catch(function () { toast("Could not enable it. Your PIN still works."); });
  }
  function bioUnlock() {
    var saved = bioSaved();
    if (!saved) return;
    navigator.credentials.get({
      publicKey: { challenge: randBytes(32), allowCredentials: [{ type: "public-key", id: fromB64u(saved.id) }],
                   userVerification: "required", timeout: 60000 }
    }).then(function () {
      S.user = saved.user; S.pin = saved.pin;
      /* v1.13.0 - this api call used to fall through to the outer catch, so a dropped packet
         told the man his fingerprint did not match. It matched. Give it its own catch. */
      return authOnce(1).catch(function (e) {
        S.pin = ""; renderLogin(loginWhy(e)); return null;
      }).then(function (r) {
        if (r === null) return;
        if (!r || !r.ok) {
          try { localStorage.removeItem(BIO_KEY); } catch (e) {}
          S.pin = ""; renderLogin("That saved sign-in is no longer valid. Use your PIN."); return;
        }
        S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
        if (!roleAny(ALLOWED)) { S.pin = ""; renderLogin(notForYou(S.user, S.role)); S.role = ""; return; }
        try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: saved.pin, role: S.role })); } catch (e) {}
        startFlushTicker();
        pull(false);
      });
    }).catch(function () { toast("That did not match. Use your PIN."); });
  }
  function bioForget() {
    try { localStorage.removeItem(BIO_KEY); } catch (e) {}
    toast("Face ID / fingerprint removed from this phone.");
    S.sheet = sheetAccount(); render();
  }
  /* ============ FORGETTING THE BOOK MEANS FORGETTING WHEN IT CAME ============
     `S.data = null` was clearing the book and leaving the stamps that describe it standing.
     The header then read "updated 13:15" over a screen with no book behind it at all, and
     from v1.28.0 it was worse than cosmetic: the lead check asks S.restAt whether the
     delivery history has been pulled THIS session before it is willing to refuse a man at the
     counter. Sign out as one man and in as another on the same phone without reloading, and
     that answer belonged to somebody else's book.

     Three stamps, one place, so a fourth cannot be added and missed. */
  function forgetBook() {
    S.data = null; S.syncAt = 0; S.fastAt = 0; S.restAt = 0;
  }

  function signOut() {
    try { localStorage.removeItem(STORE); } catch (e) {}
    try { localStorage.removeItem(BIO_KEY); } catch (e) {}
    try { bigDel(SNAP + "_" + S.user); } catch (e) {}
    S.user = ""; S.pin = ""; S.role = ""; forgetBook(); S.sheet = null; S.ch = null; S.rt = null;
    renderLogin("Signed out on this phone.");
  }

  /* ==========================================================================
     THE DRIVER'S FREIGHT HISAB  (v1.36.0, 20 August 2026)

     "add driver freight corner also in challan app, so that godown and accounts can see
      driver freight hisab, like how much pending receipt of a driver, freight to be
      calculated only when receipt attached otherwise it will show pending for settlement
      due to not having all receipts uploaded"

     His rule, and it is a good one: A DRIVER IS PAID FOR A TRIP THAT CAN BE PROVED. The
     signed receipt is the proof, so freight with no receipt against it is not "unpaid", it is
     NOT YET COUNTABLE - and the screen has to say which of those it is, or the driver and the
     office will disagree about a number neither can see.

     THREE STATES, not two. He named two; the third exists whether we name it or not, and
     leaving it out would hide money:

       ready  - it went, and the signed receipt is filed.        Settle this.
       held   - it went, and there is no receipt yet.            Chase the paper, not the money.
       waiting- the challan has not been dispatched at all.      No trip has happened.

     A freight line on an undispatched challan is not a debt to anybody. It is left out of both
     his numbers on purpose and shown small, because a bucket that exists and is not drawn is
     how a total quietly stops adding up.

     JOINED ON driverId WHERE THERE IS ONE. The schema comment on the challans tab says why
     that column was added: "a string like Suresh (HR-06-AB-1234) can never be summed into a
     freight bill per driver". Rows written before it fall back to the name, and a driver whose
     rows are joined that way is marked, because a name is not an identity.

     NOTHING HERE WRITES. This is the hisab. Recording what was actually paid out to a driver
     is a money record and needs a table of its own - asked, not assumed.
     ========================================================================== */
  var FR_DONE = ["Dispatched", "Received", "Billed"];   /* the trip actually happened */

  function frHasReceipt(r) { return String((r && r.receiptReceived) || "").toUpperCase() === "Y"; }
  function frWent(r)       { return FR_DONE.indexOf(chStatus(r)) >= 0; }
  function frAmt(r)        { return num(r && r.freight); }
  function frToClient(r)   { return lower((r && r.freightTo) || "") === "client"; }

  /* every delivery and every return that has a driver and a freight figure on it */
  function frTrips() {
    var out = [];
    challans().forEach(function (c) {
      if (frAmt(c) > 0 && (c.driverId || c.driver)) out.push({ r: c, kind: "challan" });
    });
    returns().forEach(function (t) {

  function frKey(r) {

  /* one row per driver, with his three buckets and the trips behind them */
  function frRows() {
    var by = {}, order = [];
    frTrips().forEach(function (t) {
      var k = frKey(t.r);
      if (!by[k]) {
        var d = t.r.driverId ? null : driverByName(t.r.driver);
        by[k] = { key: k, byName: k.indexOf("nm:") === 0,
                  name: String(t.r.driver || (d && d.name) || "(driver not named)"),
                  vehicle: String(t.r.vehicle || (d && d.vehicle) || ""),
                  mobile: String(t.r.driverMobile || (d && d.mobile) || ""),
                  ready: 0, held: 0, waiting: 0, readyN: 0, heldN: 0, waitingN: 0,
                  readyClient: 0, trips: [] };

      var g = by[k], amt = frAmt(t.r);
      if (!frWent(t.r))            { g.waiting += amt; g.waitingN++; t.state = "waiting"; }
      else if (frHasReceipt(t.r))  { g.ready   += amt; g.readyN++;   t.state = "ready";

          : '') +
        (g.waiting > 0

           this the corner answered "what could be settled" and never "what do I still owe
           him", which is the only question a man settling up actually asks. */
        (function () {

  /* ==========================================================================

     then: "after attaching receipts, add one more stage, ADD TO HISAB, that can be by admin
     only, after checking receipt". Everything below is the CRM's rule carried over so the two
     screens cannot give different answers about the same delivery - which is the whole reason
     this app exists beside that one rather than instead of it.

     WHAT IT IS, AND WHAT IT IS NOT. It is a STAMP, not a gate. The money in hisab is counted
     from receiptReceived = "Y" and nothing here moves a single rupee. What it adds is the
     record that the owner has LOOKED at the signed paper and passed the delivery. Making it a
     gate would mean every rupee already on the books vanished the moment this shipped, and
     money must never move because a feature was deployed.

     THE OLD BOOK IS THE OLD BOOK. Anything created before HISAB_STAMP_FROM counts as already
     added. No migration, no row written, nothing touched.

     rather than later, because ADD TO HISAB has TWO DOORS. If this app went on writing a
     stamp with no line-up on it, a delivery passed from the phone in the godown would be
     read by the CRM as pre-v6.9.324 - "no answer, ask the client record" - and the very
     partner change the feature exists to survive would silently rewrite it. Two doors to one
     decision, one of which does not ask the question, is worse than one door.

     Every function below is byte-identical to the CRM's. The only thing this app supplies
     differently is the LINES, because it prices a challan with chLines and the CRM with
     pricedLines; incPreview takes them as an argument for exactly that reason.
     ========================================================================== */
  var INC_ROLES = ["plumber", "architect", "builder", "pmc"];
  function incRoleLabel(r) {
    return { plumber: "Plumber", architect: "Architect", builder: "Builder",
             pmc: "PMC", exec: "Executive" }[String(r || "")] || String(r || "");
  }
  function incLineup(c) {
    var cl = clientByName(c && c.customerName) || {};

    INC_ROLES.forEach(function (role) {
      var nm = String(cl[role] || "").trim();
      if (nm) out.push({ role: role, name: nm });

    var ex = execForClient((c && c.customerName) || "");
    if (ex) out.push({ role: "exec", name: ex });
    return out;
  }
  function incPreview(c, lines) {
    var cl = (c && c.customerName) || "";
    /* v6.9.325 - the LINES are handed in rather than fetched. The CRM prices a challan with
       pricedLines and the Challan app with its own chLines; if this function called either by
       name the two apps would carry different bodies for the same rule, which is the one thing
       t_apps_agree exists to stop. Handed the lines, the body is identical in both. */
    return incLineup(c).map(function (m) {
      var amt = 0, pcts = {};
      lines.forEach(function (x) {

        if (r > 0) { amt += x.amt * r / 100; pcts[String(r)] = 1; }
      });

    });

  }

    var st = hisabStamp(c);
    return st ? (Number(st.extra) || 0) : 0;
  }
  function incRate(client, brand, role, onYmd) {
    var d = discRow(client, brand, onYmd); if (!d) return 0;
    return Number(incMap(d)[String(role).toLowerCase()]) || 0;

    var d = discRow(client, brand, onYmd); if (!d) return 0;
    return Number(incMap(d).exec) || 0;
  }

      if (!r || String(r.action || "") !== "challan:hisab") return;

      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }

  /* ================= WHEN THE PAINT ITSELF DIES (v1.14.0) =================
     REPORTED 17 Aug, with a screenshot: the app stuck on "Opening..." with no button at all.
     Reproduced here exactly, and the mechanism is worth writing down, because three separate
     things had to conspire and every one of them looked reasonable on its own.

       1. The book had ALREADY arrived. S.data is set on the line before the paint, so by the
          time render() ran the app believed it had everything.
       2. Something inside render() threw. The throw went into nothing - no screen, no store,
          nothing anybody could read out over the phone.
       3. boot's own catch then calls render() AGAIN, which throws again, unhandled.
       4. And openingScreen's "Taking too long - try again" button is suppressed when S.data
          is set. Which, by then, it was. So the one escape hatch the app had was closed by
          the very failure it existed for.

     A man was left staring at one word, with no way forward and nothing to tell anybody. That
     is the same fault as this morning's "Network error. Try again.": the app destroying the
     evidence needed to fix it. So the fix is the same shape - CATCH it, SHOW it, KEEP it.

     Nothing is deleted by any of this. The journal, the snapshot and the session are never
     touched; only the screen is replaced, and only when there was no screen left to lose. */
  var CRASH_KEY = "ew_challan_crash_v1";


  function crashScreen(o) {
    o = o || {};
    var held = 0; try { held = jrnCount(); } catch (e) {}
    try {
      el("root").innerHTML =
        '<div class="login"><h1>Energy World</h1><p>Challan &amp; material return</p>' +
        '<div class="loginmsg">This app could not draw its screen. Nothing has been lost — ' +
        (held ? 'the ' + held + ' record(s) held on this phone are still here, and still go up.'
              : 'nothing was waiting to go up.') +
        '</div>' +
        '<div class="muted" style="font-size:12px;line-height:1.5;margin:0 0 14px;word-break:break-word;' +
             'background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px">' +
          '<b>Read this out and it can be fixed:</b><br>' +
          esc(o.msg || "no message") + '<br>' +
          '<span style="color:#94a3b8">v' + esc(o.ver || APP_VERSION) + ' · ' + esc(o.where || "") +
          (o.user ? ' · ' + esc(o.user) : '') + '</span></div>' +
        '<button class="btn full" data-act="crash-retry">Try again</button>' +
        '<div style="height:8px"></div>' +
        '<button class="btn full ghost" data-act="crash-fresh">Get the latest version</button>' +
        '<div class="muted" style="text-align:center;margin-top:14px">If it keeps happening, ' +
        'show this screen to the office. v' + APP_VERSION + '</div></div>';
    } catch (e) {
      /* even the crash screen can fail if the document is in a bad way - then say the one
         thing that always works, in the plainest markup there is */
      try { document.body.innerHTML = '<div style="font:15px system-ui;padding:24px">' +
        'Energy World could not open. Close the app and open it again.</div>'; } catch (x) {}
    }
  }


  window.addEventListener("error", function (ev) {
    crashHandle("error", (ev && ev.error) || new Error((ev && ev.message) || "unknown"));
  });
  window.addEventListener("unhandledrejection", function (ev) {
    crashHandle("promise", (ev && ev.reason) || new Error("unknown"));
  });

  /* One wrapper, so all 38 call sites are covered without any of them remembering to be. */
  function render() {
    try { renderBody(); }
    catch (e) { crashHandle("render", e); }
  }

    var p = S.data ? pendingApproval().length : 0;
    var m = S.data ? missingReceipts().filter(recent).length : 0;   /* agrees with the list it opens */
    /* the badge counts DELIVERIES HOLDING FREIGHT BACK, not drivers - a driver with four
       missing receipts is four pieces of paper to chase, and that is the size of the job */
    var f = 0; if (S.data) { try { f = frRows().reduce(function (a, g) { return a + g.heldN; }, 0); } catch (e) { f = 0; } }
    if (S.data && !S.dp && !_dpTried) { _dpTried = true; dpPull().then(function (g) { if (g) render(); }); }
    var hb = 0; if (S.data && roleIs("admin")) { try { hb = hisabPending().length; } catch (e) { hb = 0; } }
    el("root").innerHTML = header() +
      '<div class="wrap">' + bodyHtml() + '</div>' +
      '<div class="nav">' +
        navBtn("make",    "&#128230;", "Challan", 0) +
        navBtn("return",  "&#8630;",   "Return", 0) +
        navBtn("approve", "&#10003;",  "Approve", p) +
        navBtn("receipt", "&#128247;", "Receipts", m) +
        navBtn("freight", "&#128667;", "Freight", f) +
        /* admin only, and it is not there at all for anyone else - a tab that turns a man away
           when he taps it teaches him the app is against him */
        /* v1.39.0 - "show Check receipt & Add to Hisab instead of hisab". His whole phrase is
           28 characters and a tab on a 360px phone is 51 wide - it would wrap to four lines and
           make the bar 100px tall on every screen in the app. So the two verbs go here, and the
           whole sentence goes at the top of the screen where there is room for it. This wraps

        (roleIs("admin") ? navBtn("hisab", "&#8377;", "Check &amp; add", hb) : '') +

      (S.sheet ? '<div class="sheet" data-act="close-bg"><div class="inner" data-stop="1">' + S.sheet + '</div></div>' : '');

  /* The builder is a live form: what is typed has to survive the next repaint, because a
     repaint happens every time a line is added. Everything is read back into S on input. */
  /* v1.41.0 - the further discount, shown as it is typed: the percent it works out to, so a

     the statement, so what the client will owe is on screen before the button is pressed.

  function hsbExtraPaint() {
    var box = el("hsb_extra");

        : "&mdash;";

    if (tot) tot.textContent = money(g + f - (v > 0 ? v : 0));

  /* ================= NO FREIGHT ON THIS ONE?  (v1.46.0, 27 Aug 2026) =================
     HIS WORDS: "for every chllan created, if freight not mention ask while saving again".

     MEASURED on his live book before it was written: 44 of 130 challans carry no fare at all,
