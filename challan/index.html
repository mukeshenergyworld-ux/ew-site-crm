    if (rcq) rcq.addEventListener("input", function () { if (S.rt) { S.rt.cq = rcq.value; repaint(); } });
    /* v1.20.0 - the search box, on both builders. repaint() puts the caret back where it
       was, so it types like a search box and not like a form that redraws under him. */
    ["m", "r"].forEach(function (pf) {
      var gq = el(pf + "_gq");
      if (!gq) return;
      gq.addEventListener("input", function () {
        var h = pf === "r" ? S.rt : S.ch;
        if (h) h.gq = gq.value;
        repaint();
      });
    });

    var q = el("q");
    if (q) {
      q.addEventListener("input", function () { S.q = q.value; repaint(); });
      q.addEventListener("keyup", function (e) { if (e.key === "Enter") q.blur(); });
    }
    var pq = el("pk_q");
    if (pq) pq.addEventListener("input", function () { S.pick.q = pq.value; repaintPicker(pq); });
    Array.prototype.forEach.call(document.querySelectorAll(".pk-qty"), function (i) {
      i.addEventListener("change", function () { setQty(i.getAttribute("data-code"), i.value); repaintPicker(null); });
    });
  }

  /* repaint just the body, so the keyboard and the caret stay where they are */
  function repaint() {
    var w = document.querySelector(".wrap");
    if (!w) return render();
    var a = document.activeElement, id = a && a.id, pos = null;
    try { pos = a && a.selectionStart; } catch (e) {}
    w.innerHTML = bodyHtml();
    wireInputs();
    if (id) {
      var back = el(id);
      if (back) { back.focus(); try { back.setSelectionRange(pos, pos); } catch (e) {} }
    }
  }
  function repaintPicker(focusEl) {
    var body = el("pk_body");
    if (!body) return render();
    var v = focusEl ? focusEl.value : null, pos = null;
    try { pos = focusEl && focusEl.selectionStart; } catch (e) {}
    body.innerHTML = pickerHtml();
    wireInputs();
    if (focusEl) {
      var q = el("pk_q");
      if (q) { q.value = v; q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} }
    }
  }

  /* ---------- the hidden camera input, made once ---------- */
  var _rcTarget = null;
  function pickPhoto(rec) {
    _rcTarget = rec;
    var inp = el("rc_file");
    if (!inp) {
      inp = document.createElement("input");
      inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment";
      inp.id = "rc_file"; inp.style.display = "none";
      document.body.appendChild(inp);
      inp.addEventListener("change", function () {
        var f = inp.files && inp.files[0];
        inp.value = "";
        if (!f || !_rcTarget) return;
        var rd = new FileReader();
        rd.onload = function () { attachReceipt(_rcTarget, String(rd.result)); };
        rd.onerror = function () { toast("Could not read that photo."); };
        rd.readAsDataURL(f);
      });
    }
    inp.click();
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "close-bg" && ev.target.closest("[data-stop]")) return;

    if (act === "login")   { doLogin(); return; }
    if (act === "refresh") {
      /* v1.15.0 - Collection has guarded this since v1.9.1 and this app never did. pull()
         calls render(), which rewrites the open sheet from scratch, so the arrow above a
         half-typed challan threw the lot away without a word. */
      if (S.sheet || S.ch || S.rt) {
        toast("Finish or close this first \u2014 refreshing would clear what you have typed."); return;
      }
      refreshNow(true); return;
    }
    if (act === "ver-go")    { updateNow("ew-challan-"); return; }
    if (act === "ver-later") { S.newVer = ""; render(); return; }
    if (act === "reboot")  { location.reload(); return; }
    if (act === "crash-retry") { location.replace(location.pathname + "?u=" + Date.now()); return; }
    if (act === "crash-fresh") {
      /* only THIS app's shell, and only this app's worker. All seven apps share one origin,
         so a blanket wipe here would take the other six down with it. */
      var jobs = [];
      try {
        if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.filter(function (k) { return k.indexOf("ew-challan-") === 0; })
                               .map(function (k) { return caches.delete(k); }));
        }));
      } catch (e) {}
      var go = function () { location.replace(location.pathname + "?u=" + Date.now()); };
      if (jobs.length) Promise.all(jobs).then(go, go); else go();
      setTimeout(go, 2500);                    /* never hang on a stuck cache */
      return;
    }
    if (act === "account") { S.sheet = sheetAccount(); render(); return; }
    if (act === "bio-go")  { bioUnlock(); return; }
    if (act === "bio-on")  { bioEnrol(); return; }
    if (act === "bio-off") { bioForget(); return; }
    if (act === "signout") { signOut(); return; }
    if (act === "crm")     { window.open(CRM_URL, "_blank"); return; }
    if (act === "close" || act === "close-bg") { S.sheet = null; render(); return; }
    /* tapping a tab means "show me that list", so a search left in the box is cleared */
    if (act === "tab")     { S.tab = t.getAttribute("data-t"); S.sheet = null; S.q = ""; S.allTime = false; render(); return; }
    if (act === "qclear")  { S.q = ""; render(); return; }
    if (act === "ch-filter") { S.chFilter = t.getAttribute("data-f"); render(); return; }
    if (act === "band")    { bandToggle(t.getAttribute("data-n")); render(); return; }
    if (act === "alltime") { S.allTime = true; render(); return; }

    /* ---- the challan builder ---- */
    if (act === "ch-new") {
      if (!canMake()) { toast("Making a challan is done by the godown or the office."); return; }
      S.ch = { client:"", site:"", siteNew:false, items:[], freight:"", fto:"Client",
               driver:"", veh:"", manual:"", dist:"", area:"", cq:"" };
      render(); return;
    }
    /* the district -> area -> name walk */
    /* v1.5 - one walk, two forms. data-p says which builder is on screen; without it the
       return form would have driven the delivery form's draft, which is how a return
       silently rewrites a challan that is still being typed. */
    function pickHolder(el) { return el.getAttribute("data-p") === "r" ? S.rt : S.ch; }
    if (act === "cp-dist")   { var hD = pickHolder(t); if (hD) { hD.dist = t.getAttribute("data-d"); hD.area = ""; hD.cq = ""; } repaint(); return; }
    if (act === "cp-area")   { var hA = pickHolder(t); if (hA) { hA.area = t.getAttribute("data-a") || ""; hA.cq = ""; } repaint(); return; }
    if (act === "cp-pick")   { var hP = pickHolder(t); if (hP) { hP.client = t.getAttribute("data-n"); hP.site = ""; hP.siteNew = false; hP.against = ""; } repaint(); return; }
    if (act === "cp-site")   { var hS = pickHolder(t); if (hS) { hS.site = t.getAttribute("data-s"); hS.siteNew = false; } repaint(); return; }
    if (act === "cp-sitenew"){ var hN = pickHolder(t); if (hN) { hN.siteNew = !t.getAttribute("data-off"); hN.site = ""; } repaint(); return; }
    if (act === "cp-change") { var hC = pickHolder(t); if (hC) { hC.client = ""; hC.site = ""; hC.siteNew = false; hC.cq = ""; hC.against = ""; } repaint(); return; }
    if (act === "rt-against"){ if (S.rt) S.rt.against = t.getAttribute("data-n") || ""; repaint(); return; }
    if (act === "rt-reason") {
      if (S.rt) {
        var rn = t.getAttribute("data-n") || "";
        if (t.getAttribute("data-other")) { S.rt.reasonOther = true; S.rt.reason = ""; }
        else { S.rt.reasonOther = false; S.rt.reason = rn; }
      }
      repaint(); return;
    }
    if (act === "dv-new") {
      if (!canMake()) { toast("The register is added to by the godown or the office."); return; }
      S.dnew = { p: t.getAttribute("data-p") || "m", name:"", mobile:"", vehicle:"", vtype:"" };
      S.sheet = sheetDriverNew(S.dnew.p); render(); return;
    }
    if (act === "dn-type") {
      S.dnew = S.dnew || {};
      var _vt = t.getAttribute("data-t") || "";
      S.dnew.vtype = (S.dnew.vtype === _vt ? "" : _vt);
      S.sheet = sheetDriverNew(S.dnew.p || "m"); render(); return;
    }
    if (act === "dn-save") {
      var dn = S.dnew || {};
      /* read the boxes directly too - the last keystroke before a tap can beat the listener */
      var nName = String((el("dn_name") || {}).value || dn.name || "").trim();
      var nMob  = String((el("dn_mob")  || {}).value || dn.mobile || "").replace(/\D/g, "");
      var nVeh  = String((el("dn_veh")  || {}).value || dn.vehicle || "").trim().toUpperCase();
      if (!nName) { toast("His name, at least."); return; }
      if (nMob && nMob.length !== 10) { toast("A mobile is 10 digits, or leave it blank."); return; }
      if (driverByName(nName)) { toast(nName + " is already on the register."); return; }
      var pfx = t.getAttribute("data-p") || dn.p || "m";
      t.disabled = true; t.textContent = "Adding…";
      /* v1.10.0 - a key of his own, for the same reason a challan has one: this row is
         journalled now, and replaying a row with no id appends a second driver. */
      var row = { id: "D-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
                  name: nName, mobile: nMob, vehicle: nVeh,
                  vehicleType: dn.vtype || "", defaultFare: "" };
      saveRow("drivers", row).then(function (r) {
        (S.data.drivers = S.data.drivers || []).push(r.row || row);
        /* the type, filed where no column is needed - see driverTypeMap() */
        if (dn.vtype) {
          saveRow("audit", {
            id: "DT-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
            createdAt: new Date().toISOString(), actor: S.user || "",
            action: "driver:type", target: nName,
            detail: JSON.stringify({ name: nName, vehicleType: dn.vtype, vehicle: nVeh })
          }).then(function () { _dtCache = null; });
          _dtCache = null;
        }
        /* he is added because somebody needs him NOW, so he is picked straight away */
        var holder = pfx === "r" ? S.rt : S.ch;
        if (holder) { holder.driver = nName; holder.veh = ""; }
        S.dnew = null; S.sheet = null; bust(); render();
        toast(nName + " is on the register" + (nVeh ? " with " + nVeh : "") + ", and picked." +
              (r.held ? " Held on this phone until there is signal." : ""));
      }).catch(function () {
        t.disabled = false; t.textContent = "Add him";
        toast("Could not add him. Try again.");
      });
      return;
    }
    if (act === "dv-pick") {
      var holder = t.getAttribute("data-p") === "r" ? S.rt : S.ch;
      if (holder) { holder.driver = t.getAttribute("data-n") || ""; holder.veh = ""; }
      repaint(); return;
    }
    if (act === "cl-addr") {
      var caN = t.getAttribute("data-n");
      var caC = clientByName(caN);
      if (!caC || !caC.id) { toast("Could not find him on the book."); return; }
      if (String(caC.address || "").trim()) { toast("He already has an address. The office changes it in the CRM."); return; }
      var caV = String(val("cl_addr") || "").trim();
      if (!caV) { toast("Type the address first."); return; }
      if (caV.length < 6) { toast("That is too short to find a gate by."); return; }
      /* THE WHOLE ROW, NOT A PATCH - the same rule dt-save records: the backend writes the
         entire sheet row from what it is sent, so a partial save would blank his credit
         limit and his billing profile. */
      var caRow = {}; for (var caK in caC) caRow[caK] = caC[caK];
      caRow.address = caV;
      t.disabled = true; t.textContent = "Saving...";
      saveRow("clients", caRow).then(function () {
        caC.address = caV;                 /* so it is frozen on the very next paint */
        toast("Saved against " + caN + ". Every app reads it now.");
        repaint();
      }).catch(function () {
        caC.address = caV;
        toast("Kept safe on this device \u2014 it will sync on the next refresh.");
        repaint();
      });
      return;
    }
    if (act === "dt-ask") { dtAsk(t.getAttribute("data-n")); return; }
    if (act === "dt-save") {
      var dn = t.getAttribute("data-n");
      var dc = clientByName(dn);
      if (!dc || !dc.id) { toast("Could not find him on the book."); return; }
      var dm = String(val("dt_mobile") || "").replace(/\D/g, "");
      var dp = val("dt_plumber"), da = val("dt_architect");
      if (!dm && !dp && !da) { toast("Nothing entered."); return; }
      if (dm && dm.length !== 10) { toast("A mobile is 10 digits, or leave it blank."); return; }
      /* THE WHOLE ROW, NOT A PATCH. saveRow() sends exactly what it is given and the backend
         writes the whole sheet row from that - any column not sent is written BLANK. A patch
         here would save his mobile and wipe his address, credit limit and billing profiles.
         The CRM carries the same warning next to its own save; it has happened once already. */
      var drow = Object.assign({}, dc);
      if (dm) drow.mobile = dm;
      if (dp) drow.plumber = dp;
      if (da) drow.architect = da;
      saveRow("clients", drow).then(function (r) {
        Object.assign(dc, drow);                        /* on his screen at once */
        /* and the site rows, which carry their own copy - only where theirs is blank, so a
           site that genuinely has a different plumber on it is never overwritten */
        var touched = 0;
        ((S.data && S.data.sites) || []).forEach(function (st) {
          if (String(st.client || "").trim().toLowerCase() !== String(dc.name).trim().toLowerCase()) return;
          var srow = Object.assign({}, st), hit = false;
          if (dm && !String(st.mobile || "").trim()) { srow.mobile = dm; hit = true; }
          if (dp && !String(st.plumber || "").trim()) { srow.plumber = dp; hit = true; }
          if (da && !String(st.architect || "").trim()) { srow.architect = da; hit = true; }
          if (hit) { Object.assign(st, srow); saveRow("sites", srow); touched++; }
        });
        bust(); S.sheet = null; render();
        var said = [];
        if (dm) said.push("mobile");
        if (dp) said.push("plumber");
        if (da) said.push("architect");
        toast(dc.name + " — " + said.join(", ") + " saved" +
              (touched ? " and copied onto " + touched + " site record" + (touched === 1 ? "" : "s") : "") +
              (r.held ? ", held on this phone until there is signal" : "") + ".");
      });
      return;
    }
    if (act === "jrn-retry") { flushNow(); toast("Trying now…"); return; }
    if (act === "ch-edit") {
      if (!canMake()) { toast("Editing a challan is done by the godown or the office."); return; }
      /* ================= v1.28.1 - THE EDIT BUTTON NEVER WORKED =================
         `id` was never declared anywhere in this click handler. The CRM's handler opens with
         `var id = t.getAttribute("data-id");` and this one does not - ch-edit was lifted from
         the CRM's shape on 16 Aug and carried the USE across without the declaration.

         Reading an undeclared variable throws a ReferenceError, in strict mode and out of it.
         So every tap on Edit threw before it could even look for the challan, and nothing on
         screen said so. It shipped as 1.25.0 against his own words - "also make provision to
         edit challan before disptch" - and 28 assertions in t_chedit.js passed the whole time,
         because every one of them READ the source and not one of them RAN it.

         Found by the TypeScript checker on 18 Aug, in under a minute, from a standing start.

         Declared HERE, in the block that needs it, and under its own name. A `var id` at the
         top of a 36 KB handler hoists over the whole of it, and would turn any future bare
         `id` from a loud throw into a silent undefined - which is the more expensive fault. */
      var _ceId = t.getAttribute("data-id") || "";
      var ce = (S.data.challans || []).filter(function (x) { return String(x.id) === String(_ceId); })[0];
      if (!ce) { toast("Could not find that challan on this phone."); return; }
      var cst = chStatus(ce);
      /* the same two words the CRM refuses on, and for the same reason: once it is
         dispatched the material has left the building and the paper is with the driver. */
      if (cst === "Dispatched" || cst === "Received") {
        toast("A dispatched challan cannot be edited. Take the material back in on a return instead.");
        return;
      }
      if (chHeld(ce)) { toast("This one is still waiting to upload. Edit it once it has a number."); return; }
      var eItems = []; try { eItems = JSON.parse(ce.itemsJson || "[]"); } catch (e) { eItems = []; }
      S.ch = {
        editId: ce.id, editNo: ce.challanNo, editStatus: cst,
        client: ce.customerName || "", site: ce.site || "",
        dist: ce.location || "", area: "", cq: "", gq: "",
        freight: (ce.freight != null ? ce.freight : ""), fto: ce.freightTo || "Client",
        disc: (ce.discAmt != null ? ce.discAmt : ""), discnote: ce.discNote || "",
        driver: ce.driver || "", veh: ce.vehicle || "",
        manual: manualNoFor(ce) || "",
        items: eItems.map(function (l) {
          return { code: l.code, desc: l.desc, unit: l.unit, qty: l.qty, rate: l.rate,
                   brand: l.brand, disc: l.disc };
        })
      };
      S.tab = "make"; render(); return;
    }
    if (act === "ch-cancel") { S.ch = null; render(); return; }
    if (act === "ln-del")  { if (S.ch) S.ch.items.splice(Number(t.getAttribute("data-i")), 1); repaint(); return; }
    if (act === "rln-del") { if (S.rt) S.rt.items.splice(Number(t.getAttribute("data-i")), 1); repaint(); return; }

    /* ---- the picker ---- */
    /* ---- the owner's last look (v1.38.0) ---- */
    if (act === "ch-hisabadd") {
      var _hid = t.getAttribute("data-id") || "";
      var _hc = challans().filter(function (x) { return String(x.id) === String(_hid); })[0];
      if (!_hc) { toast("That challan is not on this phone yet — refresh first."); return; }
      /* the CRM learned this the hard way in v6.9.259: a button is not a rule. Every one of
         these is tested again where the writing happens, because the status can change between
         drawing the card and pressing the button - which is exactly how a bad stamp got
         written on PUNIT8708/150826/001. */
      if (!roleIs("admin")) { toast("Only the owner adds a delivery to hisab."); return; }
      if (!proofFor(_hc)) { toast("Attach the signed receipt first — there is nothing to check yet."); return; }
      if (!hisabCounts(_hc)) {
        toast("Mark " + (_hc.challanNo || "this delivery") + " as received first — until then " +
              "hisab does not count it, and a stamp would say otherwise.");
        return;
      }
      S.sheet = sheetAddToHisab(_hid); render(); return;
    }
    if (act === "hsb-confirm") {
      var hid = t.getAttribute("data-id") || "";
      var hc = challans().filter(function (x) { return String(x.id) === String(hid); })[0];
      if (!hc) { toast("That challan is not on this phone yet — refresh first."); return; }
      if (!roleIs("admin")) { toast("Only the owner adds a delivery to hisab."); return; }
      if (!hisabCounts(hc)) {
        toast("Mark " + (hc.challanNo || "this delivery") + " as received first — nothing was stamped.");
        S.sheet = null; render(); return;
      }
      var hmiss = hisabBrandsMissingDisc(hc);
      var hpct = {}, hnon = {};
      Array.prototype.forEach.call(document.querySelectorAll(".hsb-pct"), function (e2) {
        hpct[e2.getAttribute("data-brand")] = String(e2.value || "").trim();
      });
      Array.prototype.forEach.call(document.querySelectorAll(".hsb-non"), function (e2) {
        hnon[e2.getAttribute("data-brand")] = !!e2.checked;
      });
      /* Nothing is stamped while a brand is still an open question. */
      var hopen = hmiss.filter(function (b) { return !hnon[b] && !String(hpct[b] || "").length; });
      if (hopen.length) {
        toast("Still to decide: " + hopen.join(", ") + ". Put a % in, or tick No discount.");
        return;
      }
      /* v1.41.0 - the further discount is a question, and a question has to be answered.
         Blank is not "no": it is "not looked at", and this screen exists to prove somebody
         looked. Same refusal, same wording, as the CRM's handler. */
      var hxEl = el("hsb_extra"), hxNo = el("hsb_noextra");
      var hxRaw = hxEl ? String(hxEl.value || "").replace(/[^0-9.\-]/g, "").trim() : "";
      var hxAmt = Math.round(Number(hxRaw) || 0);
      if (!(hxNo && hxNo.checked) && !hxRaw.length) {
        toast("Further discount: put an amount in, or tick No further discount.");
        return;
      }
      if (hxNo && hxNo.checked) hxAmt = 0;
      if (hxAmt < 0) { toast("A further discount cannot be a negative amount."); return; }
      var hGoods = chPriced(hc).reduce(function (a, x) { return a + x.amt; }, 0);
      if (hxAmt > hGoods) {
        toast("That is more than the goods on this delivery (" + money(hGoods) + "). Check the amount.");
        return;
      }
      var hInc = [];
      Array.prototype.forEach.call(document.querySelectorAll(".hsb-inc"), function (e3) {
        hInc.push({ role: e3.getAttribute("data-role") || "", name: e3.getAttribute("data-name") || "",
                    on: !!e3.checked });
      });
      var hOff = hInc.filter(function (x) { return !x.on; });

      var hset = [], hign = [];
      hmiss.forEach(function (b) {
        var v = hnon[b] ? 0 : (Number(hpct[b]) || 0);
        /* A real row either way — that is what makes "ignore once" stick. */
        /* no id: saveRow() mints one and the server assigns the real one, which is how every
           other row this app writes is created. mintId() is the CRM's helper and does not
           exist here - t_undefined_names.js caught it before it reached a tap. */
        saveRow("discounts", { client: hc.customerName || "", brand: b, pct: v, notes: "" });
        if (v > 0) hset.push(b + " " + v + "%"); else hign.push(b);
      });
      hisabStampSave(hc, hset, hign, {
        inc: hInc, extra: hxAmt,
        extraNote: (el("hsb_extranote") && el("hsb_extranote").value) || ""
      });
      S.sheet = null; _hsbCache = null; bust(); render();
      toast("Challan " + (hc.challanNo || "") + " added to hisab." +
        (hxAmt > 0 ? " " + money(hxAmt) + " further discount taken off." : "") +
        (hOff.length ? " No incentive on it for " + hOff.map(function (x) { return x.name; }).join(", ") + "." : "") +
        (hset.length ? " Discount set for " + hset.join(", ") + "." : "") +
        (hign.length ? " " + hign.join(", ") + " will go without discount to this client." : ""));
      return;
    }

    if (act === "job-open") {
      S.job = { desc: "", amt: "" };
      S.sheet = sheetJobWork(); render(); return;
    }
    if (act === "job-cancel") { S.job = null; S.sheet = sheetPicker(); render(); return; }
    if (act === "job-add") {
      var jd = String((el("jw_desc") && el("jw_desc").value) || "").trim();
      var ja = num((el("jw_amt") && el("jw_amt").value) || 0);
      /* both, and said separately - "it needs a description" and "it needs an amount" are
         different things to have got wrong and a man should be told which */
      if (!jd) { toast("Say what the job work was — it goes on the customer's bill."); return; }
      if (!(ja > 0)) { toast("Put the total amount for the job work."); return; }
      if (!S.ch) { toast("Open a challan first."); return; }
      S.ch.items = S.ch.items || [];
      S.ch.items.push(jobLine(jd, ja));
      S.job = null;
      /* "then continue with balance work" - straight back to the material picker, not out to
         the challan and back in again */
      S.sheet = sheetPicker(); render();
      toast("Job work added — " + money(Math.round(ja)) + ". Carry on with the material.");
      return;
    }

    if (act === "oth-open") {
      S.oth = { desc: "", qty: "", rate: "", brand: "" };
      S.sheet = sheetOther(); render(); return;

    if (act === "oth-add") {
      var od = String((el("ox_desc") && el("ox_desc").value) || "").trim();
      var oq = num((el("ox_qty") && el("ox_qty").value) || 0) || 1;
      var orr = num((el("ox_rate") && el("ox_rate").value) || 0);
      var ob = String((el("ox_brand") && el("ox_brand").value) || "").trim();
      /* three different things to have got wrong, and a man should be told which */
      if (!od) { toast("Say what the item is \u2014 it is printed on his challan."); return; }
      if (!(orr > 0)) { toast("Put the rate for one of them, before discount."); return; }
      if (!ob) { toast("Tap the brand it belongs to \u2014 that is what sets its discount and whose incentive it earns."); return; }
      if (!S.ch) { toast("Open a challan first."); return; }
      S.ch.items = S.ch.items || [];
      S.ch.items.push(otherLine(od, oq, orr, ob));
      S.oth = null;
      S.sheet = sheetPicker(); render();
      toast(od.slice(0, 26) + " added \u2014 " + oq + " \u00d7 " + money(orr) + " (" + ob + ").");
      return;
    }

    if (act === "pk-open") {
      S.pick = { into: t.getAttribute("data-into"), brand:"", cat:"", q:"" };
      S.sheet = sheetPicker(); render(); return;
    }
    if (act === "pk-brand") { S.pick.brand = t.getAttribute("data-b"); S.pick.cat = ""; S.pick.q = ""; repaintPicker(null); return; }
    if (act === "pk-cat")   { S.pick.cat = t.getAttribute("data-c"); S.pick.q = ""; repaintPicker(null); return; }
    if (act === "pk-lvl") {
      var l = t.getAttribute("data-l");

      S.pick.q = ""; repaintPicker(null); return;
    }
    if (act === "pk-plus" || act === "pk-minus") {
      var code = t.getAttribute("data-code");
      var now = qtyOf(code);

      repaintPicker(null); return;
    }

    /* ---- save the challan ----
       Same row shape, same numbering endpoint and the same frozen discount as the CRM, so a
       challan made in the godown is indistinguishable from one made at the desk. */
    if (act === "ch-fr-add") {
      var _fb = el("m_freight");
      if (_fb) { try { _fb.scrollIntoView({ block: "center" }); _fb.focus(); _fb.select(); } catch (e) {} }
      return;
    }
    if (act === "ch-fr-no") {
      /* Straight back into the same Save, on the SAME screen - no repaint between the two

      if (S.ch) S.ch.frAsked = true;
      var _sv = document.querySelector('[data-act="ch-save"]');
      if (_sv) _sv.click(); else toast("Tap Create the challan again — it will save with no freight.");
      return;
    }
    if (act === "ch-save") {
      if (!canMake()) { toast("Making a challan is done by the godown or the office."); return; }
      var z = S.ch || {};
      var cObj = clientByName(z.client);
      if (!cObj) { toast("Pick the client first \u2014 district, then area, then his name."); return; }
      /* v1.11.0 - see isClientC(). Refused here, and the message names the step and the
         people who can take it, rather than leaving a man guessing at the counter. */
      if (!isClientC(cObj.name)) {
        /* ====== v1.28.0 - A REFUSAL THAT MIGHT BE AN IGNORANCE IS NOT A REFUSAL ======
           isClientC() says "no" in two completely different situations: this man is genuinely
           not a client, and the two tabs that would prove he is - challans and pitch - are not
           on this phone yet. Those were the same thing while the book came down in one piece.
           They are not any more. The history half lands second now, so on a phone that has
           never held this book there is a window in which a customer of ten years would be
           told, at the counter, with the material on the trolley, that he "is not a client
           yet". That is the app asserting something it cannot know, which is the one thing
           this estate keeps being bitten by.

           It also fixes a fault that predates the split. If the history on this phone is from
           yesterday and the office marked the brand Won this morning, the old code refused
           flatly and named nobody's copy. Now a refusal that has not been checked against the
           server THIS session goes and checks. */
        if (!S.restAt) {
          toast(cObj.name + " is not marked a client in the copy on this phone" +
                (S.syncAt ? " (" + bookAge(S.syncAt).txt + ")" : "") +
                " \u2014 checking with the office now. Press Create again in a moment.");
          try { pull(true); } catch (e) {}
          return;
        }
        /* v1.29.0 - the Won list came down empty. Say that, rather than reading it as a no. */
        if (cantTellClient()) {
          toast("This phone was not sent the brand-Won list, so it cannot tell whether " +
                cObj.name + " is a client \u2014 that is not the same as him not being one. " +
                "Ring the office and ask them to check his card, or write this challan from " +
                "a phone that has the full book.");
          return;
        }
        toast(cObj.name + " is not a client yet \u2014 no delivery has ever gone to him and no " +
              "brand is marked Won. The office marks a brand Won in the CRM, then this challan " +
              "can be written.");
        return;
      }

      /* v1.37.0 - "product" was right until job work existed. A challan for labour alone is a
         real thing and this message would have turned it away. */
      if (!lines.length) { toast("Add at least one line — material or job work."); return; }
      /* v1.46.0 - the fare, asked for once. See chFreightBar(). It sits ahead of the mintId,
         ahead of the disabled button, and a long way ahead of the challanNo call - so nothing
         has been taken when it stops, and nothing is lost if he walks away from it. The typed
         fields all live on S.ch already (see wireInputs), so the repaint cannot lose any. */
      if (!(S.ch && S.ch.frAsked) && num(z.freight) <= 0) {
        if (S.ch) S.ch.frAsked = true;
        render();
        return;
      }
      lines = lines.map(function (l) {
        if (isJobLine(l)) {
          /* rebuilt rather than copied, so a job line can never carry a brand discount in from
             anywhere - see the note on jobLine() for why that matters */
          return jobLine(l.desc, l.rate);
        }
        var d = (l.disc != null && l.disc !== "") ? num(l.disc) : clientDiscount(cObj.name, l.brand);
        return { code:l.code, desc:l.desc, unit:l.unit, qty:num(l.qty), rate:num(l.rate), brand:l.brand, disc:d };
      });
      /* ============ ONE MEANING PER COLUMN (v1.24.0) ============
         These two columns meant DIFFERENT THINGS depending on which app wrote the row, and
         one screen reads both:

             column     CRM                       this app, until now
             amount     gross, qty x rate         net, line discounts + client freight
             discAmt    the TYPED bargain         the line-discount total

         The CRM prints that column as "... at list" on its own challan list, so the CRM's
         meaning is the documented one and this app was the one that drifted - in v1.9.0,
         which was solving a real problem (discAmt hardcoded to 0) and solved it by changing
         what the column means rather than by filling the right one in.

         CHECKED BEFORE CHANGING: hisabOutstanding() re-prices every challan from its own
         lines and never reads either column, so no rupee has ever been mis-counted by this.
         And all 88 challans in the live book carry amount = list with no discAmt at all, so
         the drift is in the code and has never reached the data. Fixed before it did.

         Line discounts are untouched: they live per line inside itemsJson, which is where
         chValue(), pricedLines() and every credit already read them from. */
      var gross = lines.reduce(function (a, l) { return a + num(l.qty) * num(l.rate); }, 0);
      var amount = Math.round(gross);                      /* AT LIST, exactly as the CRM writes it */
      var discAmt = canSetPricing() ? Math.max(0, num(z.disc)) : 0;
      var discNote = canSetPricing() ? String(z.discnote || "").trim() : "";
      var siteObj = sitesFor(cObj.name).filter(function (s) { return s.name === z.site; })[0] || {};
      var manualV = String(z.manual || "").trim();
      /* the driver comes off his own record, so freight per driver can actually be totalled */
      var dRec = ((S.data && S.data.drivers) || []).filter(function (d) {
        return lower(d.name) === lower(z.driver);
      })[0] || {};
      t.disabled = true; t.textContent = "Creating…";
      var reset = function () { t.disabled = false; t.textContent = "Create the challan"; };

      /* ===== v1.9.0 - ONE ID AND ONE NUMBER PER DELIVERY, NOT PER PRESS =====
         v1.8.0 minted the stable id inside this callback, so every retry made a fresh one and
         the upsert it was written for could never fire. It also called challanNo again and ate
         another number from the series. Both are now decided once, on the first press, and kept
         on S.ch - so ten presses on a bad line are one id, one number, one row. */
      S.ch.mintId = S.ch.mintId || ("L-" + Date.now() + "-" + Math.floor(Math.random() * 1000000));
      var _mintId = S.ch.mintId;
      /* v1.25.0 - the row as it stands on the sheet, or null for a new challan. Read ONCE,
         here, before anything can repaint under us. */
      var _editRow = z.editId
        ? ((S.data.challans || []).filter(function (x) { return x.id === z.editId; })[0] || null)
        : null;
      var _wasApproved = !!(_editRow && chStatus(_editRow) === "Approved");
      var _noFor = cObj.shortName || cObj.name;
      /* ===== v1.10.0 - A CHALLAN CAN NOW BE WRITTEN IN A BASEMENT =====
         The number comes from the server, and v1.9.0 banned minting one here for good
         reason: the old fallback produced RAKESH/15/001 for every challan a client had in
         one day, and approve, PDF and WhatsApp all take the FIRST match by number - so
         passing the second one passed the first. That ban stands.

         What changes is what happens when the server cannot be asked at all. The delivery
         is real, the lorry is loading, and the man is standing in a basement. So the
         challan is KEPT - with its stable id and with no number - and the number is drawn
         once, later, at the moment the journal can reach the server. Until then the app
         says it has no number rather than inventing one. The paper book number he types is
         filed against the id, so the delivery is traceable from the first minute. */
      /* v1.25.0 - AN EDIT NEVER DRAWS A NEW NUMBER. It already has one, it is written in the
         paper book, the driver may already be holding the printout, and the whole estate looks
         a challan up by that number. Minting a second one here would split one delivery into
         two records with the same contents. */
      var numP = _editRow
        ? Promise.resolve({ challanNo: _editRow.challanNo || "" })
        : (S.ch.mintNo
            ? Promise.resolve({ challanNo: S.ch.mintNo })
            : api("challanNo", { client: _noFor }).catch(function () { return { challanNo: "", _held: true }; }));
      numP.then(function (n) {
        /* v1.9.0 - NEVER mint a number on this phone. The old fallback ended in a literal "001"
           with only the day-of-month for a date, so two challans for one client on one day both
           became RAKESH/15/001 - and approve, PDF and WhatsApp all look a challan up by NUMBER
           and take the first match. Passing the second one passed the first. */
        var no = (n && n.challanNo) || "";
        var _held = !!(n && n._held);
        /* The server ANSWERED and gave no number is a refusal, and still stops here. The
           server could not be ASKED is a basement, and is held. They are not the same thing
           and they must not read the same. */
        if (!no && !_held) { reset(); toast("The server did not give a challan number. Nothing was saved \u2014 try again."); return; }
        if (no && !_editRow) S.ch.mintNo = no;
        /* ============ THE WHOLE ROW, NEVER A PATCH (v1.25.0) ============
           saveRow() sends exactly what it is given and the backend writes the WHOLE sheet row
           from it - any column not sent is written BLANK. So an edit starts from the row that
           is already on the sheet and overlays only the fields this form owns. Everything else
           - receiptReceived, commissionSet, the hisab stamp, the approver's name, whatever the
           office added later - travels through untouched.

           This app has been bitten by exactly this once already; the warning next to dt-save
           says so. */
        var ch = _editRow ? Object.assign({}, _editRow) : {};
        Object.assign(ch, {
          id: _editRow ? _editRow.id : _mintId,
          createdBy: S.user, challanNo: no,
          customerId: cObj.id || "", customerName: cObj.name,
          siteId: siteObj.id || "", site: z.site || "",
          brand: (lines[0] && lines[0].brand) || "", location: cObj.location || "",
          items: lines.map(function (l) { return l.desc + " x" + l.qty; }).join(", "),
          itemsJson: JSON.stringify(lines), amount: amount,
          freight: num(z.freight), freightTo: z.fto || "Client",
          discAmt: discAmt, discNote: discNote,
          driver: dRec.name || "", driverId: dRec.id || "", driverMobile: dRec.mobile || "",
          vehicle: z.veh || dRec.vehicle || "",
          /* on a NEW challan these three are the starting state; on an edit the first two are
             already on the row and Object.assign above kept them, so only the status is set -
             and it is set DOWN, deliberately. Approval was given on the earlier contents. */
          associate: _editRow ? (_editRow.associate || "") : "",
          commissionSet: _editRow ? (_editRow.commissionSet || "N") : "N",
          receiptReceived: _editRow ? (_editRow.receiptReceived || "N") : "N",
          status: "Draft"
        });
        return saveRow("challans", ch, { noFor: _editRow ? "" : _noFor }).then(function (r) {
          var saved = r.row || ch;
          var _list = (S.data.challans = S.data.challans || []);
          if (_editRow) {
            /* replace in place. Pushing would put two rows with the same challanNo in the
               book, and every screen here looks one up by number and takes the first match -
               so the edited one might never be the one anybody sees. */
            for (var _i = 0; _i < _list.length; _i++) {
              if (_list[_i] && _list[_i].id === saved.id) { _list[_i] = saved; break; }
            }
          } else _list.push(saved);
          var shown = String(saved.challanNo || no || "");
          /* the paper book's number goes after the delivery, never before it */
          var after = function () {
            bust(); S.ch = null; S.tab = "make"; render();
            toast(r.held
              ? (_editRow ? "Changes to " + shown + " are saved on this phone and go up when there is signal."
                          : "Challan saved on this phone" + (shown ? " (" + shown + ")" : " \u2014 its number comes when it uploads") +
                            ". It goes up by itself when there is signal.") + (manualV ? " Book no " + manualV + "." : "")
              : (_editRow
                  ? "Challan " + shown + " updated" +
                    (_wasApproved ? " \u2014 back to draft, it must be passed again before dispatch." : " \u2014 still waiting to be passed.")
                  : "Challan " + shown + " created \u2014 waiting to be passed.") +
                (manualV ? " Book no " + manualV + "." : ""));
          };
          if (!manualV) { after(); return; }
          /* v1.9.0 - it used to call after() on all three paths, so a book number that never
             saved was still read out in the toast. Three weeks later a storeman rings quoting
             a number that exists nowhere in the system. */
          /* v1.10.0 - the book number is journalled too, so the branch that used to say
             "it did NOT save, open the challan and add it again" no longer exists: there is
             no longer a way for it to be lost, only a way for it to be waiting. It is filed
             against the challan's id, so it holds even before the challan has a number. */
          return saveManualNo(shown, saved.id || "", manualV, cObj.name).then(function (mr) {
            if (mr && mr.row) (S.data.audit = S.data.audit || []).push(mr.row);

        });

        /* v1.8.0 - do not claim to know. This catch covers BOTH the number call and the save,
           and Apps Script routinely writes the row and then takes longer than the deadline to say
           so - the CRM logged exactly that on 15 Aug, a challan that had saved on the first
           attempt while the app insisted for ten minutes that it had not. Pressing Create again
           on a save that actually landed used to reserve a second number and write a second row.
           It cannot any more (the id is stable), but the message should still tell the truth. */
        toast("No answer from the server. It may still have saved \u2014 pull down to refresh and " +
              "check before creating it again. Your challan is still on screen.");
      });
      return;
    }

    /* ---- the return builder ---- */
    if (act === "rt-new") {
      if (!canMake()) { toast("Registering a return is done by the godown or the office."); return; }
      S.rt = { client:"", site:"", siteNew:false, against:"", reason:"", reasonOther:false,
               items:[], driver:"", freight:"", dist:"", area:"", cq:"" };
      render(); return;
    }
    if (act === "rt-cancel") { S.rt = null; render(); return; }
    if (act === "rt-save") {
      if (!canMake()) { toast("Registering a return is done by the godown or the office."); return; }
      var rz = S.rt || {};
      var rc = clientByName(rz.client);
      if (!rc) { toast("Pick a registered client from the list."); return; }
      if (!(rz.items || []).length) { toast("Add at least one product."); return; }
      t.disabled = true; t.textContent = "Registering…";
      var rDrv = ((S.data && S.data.drivers) || []).filter(function (d) {
        return lower(d.name) === lower(rz.driver);
      })[0] || {};
      var rreset = function () { t.disabled = false; t.textContent = "Register the return"; };
      /* ===== v1.10.0 - THE THREE FIXES CHALLANS GOT, FINALLY APPLIED TO RETURNS =====
         1. A STABLE ID. This row went up with id: "" - so a save whose reply was lost and
            was then pressed again appended a SECOND return. That is the billing-leak shape
            v1.8.0 fixed for challans, and it was never carried across. The id is minted
            once, on the first press, and kept on S.rt, so ten presses are one row.
         2. ONE NUMBER, NOT ONE PER PRESS. returnNo was called again on every press, eating
            another number from the series each time.
         3. NO INVENTED NUMBER. The fallback built RAKESH/15/R01 out of the client's name and
            the day of the month, so two returns for one client on one day collided - exactly
            the fault v1.9.0 removed from challans, still sitting here. It is gone. With no
            signal the return is HELD and the server numbers it when it uploads. */
      S.rt.mintId = S.rt.mintId || ("L-" + Date.now() + "-" + Math.floor(Math.random() * 1000000));
      var _rMintId = S.rt.mintId, _rNoFor = rc.shortName || rc.name;
      var rNumP = S.rt.mintNo
        ? Promise.resolve({ returnNo: S.rt.mintNo })
        : api("returnNo", { client: _rNoFor }).catch(function () { return { returnNo: "", _held: true }; });
      rNumP.then(function (n) {
        var rno = (n && n.returnNo) || "";
        var _rHeld = !!(n && n._held);
        if (!rno && !_rHeld) { rreset(); toast("The server did not give a return number. Nothing was saved \u2014 try again."); return; }
        if (rno) S.rt.mintNo = rno;
        var row = {
          id: _rMintId, createdBy: S.user, returnNo: rno,
          customerId: rc.id || "", customerName: rc.name,
          site: rz.site || "", siteId: (sitesFor(rc.name).filter(function (s) { return s.name === rz.site; })[0] || {}).id || "",
          challanNo: rz.against || "",
          itemsJson: JSON.stringify(rz.items.map(function (l) {
            return { code:l.code, desc:l.desc, unit:l.unit, qty:num(l.qty), rate:num(l.rate), brand:l.brand };
          })),
          reason: rz.reason || "", status: "Raised",
          driver: rDrv.name || "", driverMobile: rDrv.mobile || "", vehicle: rDrv.vehicle || "",
          freight: num(rz.freight), freightTo: "Energy World"
        };
        return saveRow("returns", row, { noFor: _rNoFor }).then(function (r) {
          var savedR = r.row || row;
          (S.data.returns = S.data.returns || []).push(savedR);
          bust(); S.rt = null; S.tab = "return"; render();
          toast(r.held
            ? "Return saved on this phone" + (savedR.returnNo ? " (" + savedR.returnNo + ")" : " \u2014 its number comes when it uploads") +
              ". It goes up by itself when there is signal."
            : "Return " + savedR.returnNo + " registered. Attach the goods-in receipt now.");
        });
      }).catch(function (err) {
        rreset();
        toast("Could not register the return: " + ((err && err.message) || "no answer from the server") + ".");
      });
      return;
    }

    /* ---- the material has actually left (v1.35.0) ----
       Approved means the office released it. Dispatched means it is on the vehicle. They are
       different facts and hisab counts the second one, which is why the CRM has kept them
       apart since v6.9.259 - and why this app must be able to say the second one too, rather
       than sending a man to a laptop to move a challan he is holding in his hand.

       IT ASKS FOR THE PIN, AND I HAD IT WRONG. I wrote this handler without one, reasoning
       that recording a departure is an observation rather than a decision. Then I read the
       server: challanMove_ requires approvePin for "Dispatched" exactly as it does for
       "Approved", and the CRM's own prompt says DISPATCH in the same breath as APPROVE. So a
       PIN-less call would have been refused every time and this fix would have shipped broken.
       The server is the authority on what the server wants; the comment I nearly shipped was
       an opinion about it. */
    if (act === "dp-open") {
      /* money leaving the firm - the same list the server enforces */
      if (!roleAny(["admin","accounts"])) { toast("Recording a payout is the owner or accounts."); return; }
      S.sheet = sheetPayout(t.getAttribute("data-k") || ""); render(); return;
    }
    if (act === "dp-save") {
      if (!roleAny(["admin","accounts"])) { toast("Recording a payout is the owner or accounts."); return; }
      var dk = t.getAttribute("data-k") || "";
      var dg = frRows().filter(function (x) { return x.key === dk; })[0];
      if (!dg) { toast("Could not find that driver."); return; }
      var damt = num(el("dp_amt") && el("dp_amt").value);
      if (!(damt > 0)) { toast("Put the amount that was actually paid."); return; }
      var body = {
        driverId: dk.indexOf("id:") === 0 ? dk.slice(3) : "",
        driver: dg.name,
        amount: damt,
        mode: (el("dp_mode") && el("dp_mode").value) || "",
        ref: (el("dp_ref") && el("dp_ref").value) || "",
        note: (el("dp_note") && el("dp_note").value) || "",
        forTrips: dg.readyN + " trips, " + Math.round(dg.ready)
      };
      t.disabled = true; t.textContent = "Recording\u2026";
      api("driverPaySave", body, 20000).then(function (r) {
        if (!r || !r.ok) {
          t.disabled = false; t.textContent = "Record the payment";
          toast((r && r.error) || "The server refused it. Nothing was recorded.");
          return;
        }
        /* keep this phone in step at once - the man is standing there */
        S.dp = S.dp || { rows: [] };
        S.dp.rows.push({ id: r.id, createdAt: new Date().toISOString(), createdBy: S.user,
                         driverId: body.driverId, driver: body.driver, amount: damt,
                         mode: body.mode, ref: body.ref, forTrips: body.forTrips, note: body.note });
        S.sheet = null; render();
        toast(money(damt) + " recorded against " + dg.name + ".");
      }).catch(function () {
        t.disabled = false; t.textContent = "Record the payment";
        toast("No signal \u2014 nothing was recorded. Try again.");
      });
      return;
    }

      render(); return;
    }

      if (!canApprove()) { toast("Marking a challan dispatched is done by the accounts desk."); return; }
      /* this app's click handler declares `act` and nothing else - there is no `id` in scope
         here, unlike the CRM's. Written as a bare `id` this was a ReferenceError on the first
         tap, and t_undefined_names.js is the only thing that would ever have told me. */
      var _cdId = t.getAttribute("data-id") || "";
      var cd = (S.data.challans || []).filter(function (x) { return String(x.id) === String(_cdId); })[0];
      if (!cd) { toast("Could not find that challan on this phone."); return; }
      if (chHeld(cd)) { toast("This one is still held on this phone. It has to go up first."); return; }
      if (chStatus(cd) !== "Approved") { toast("Only a passed challan can be dispatched."); return; }
      var dpin = window.prompt("Enter your PIN to DISPATCH this challan\n\n" +
        String(cd.challanNo || "") + " \u2014 " + String(cd.customerName || "") +

  /* ================= WHY THE LOGIN FAILED (v1.13.0) ======================

     wants a Google sign-in, a spent quota, and a server answering with something that is not

  function notForYou(name, role) {

      "role in the team sheet \u2014 nothing else controls it.";
  }

  function loginWhy(e) {
    var m = (e && e.message) ? String(e.message) : "";
    if (/no signal/i.test(m))
      return "No signal \u2014 this phone could not reach the server. Check the data connection, then try again.";
    if (/no answer in/i.test(m))
      return "The server did not answer within " + (m.replace(/[^0-9]/g, "") || "45") +
             " seconds. It is usually busy, not down \u2014 try once more.";
    if (/sign in to Google/i.test(m))
      return "The server asked this phone to sign in to Google. The app\u2019s address needs " +
             "republishing \u2014 tell the owner, nobody can sign in until then.";
    if (/quota/i.test(m))
      return "Google has stopped the server for today (quota reached). Tell the owner.";
    if (/not JSON/i.test(m))
      return "The server answered with something the app cannot read. Tell the owner and read " +
             "out this line: " + m;
    return m || "Could not sign in. Try again.";

     packet. A timeout is deliberately NOT retried: measured in a real browser 17 Aug, retrying
     a 45s deadline made the man stare at "Signing in..." for 91 seconds before being told
     anything at all. That is worse than the fault. He is told at 45s, the message says trying
     again is worth it, and HE decides whether to wait again - which is the difference between
     waiting and being made to wait. A refusal is never retried: the server answered. */
  function authOnce(left) {
    return api("teamAuth", { ua: navigator.userAgent }).catch(function (e) {
      var m = (e && e.message) ? String(e.message) : "";

  var _pulling = null;

     The owner's instruction was "check every time the app is opened or returned to". Taken
     literally that is one 680 KB pull per return, on a godown phone, on 4G - and this is an
     app a man leaves for every phone call. Taken usefully it means: never refuse to look for
     what he is looking for.

     What he is looking for is a client, a rate, a driver. That half is small and comes down
     EVERY time, with no guard at all. The delivery history behind it is the big half and
     changes when somebody in this building makes it change, so it comes down on the first
     open, on the refresh arrow, and otherwise at most every five minutes.

     So the answer to "did you check?" is always yes, and the phone is not made to drag the
     whole book across a godown roof thirty times a day to do it. */
  /* ============ THE SERVER IGNORES `only` — READ, NOT ASSUMED (18 Aug 2026) ============

     `teamFilter_(u)` builds all 29 tabs on every single call. The `only:` list every app in
     this estate has been sending for weeks has always been thrown away.

     Which means the "fast half" reply is, in fact, the WHOLE BOOK — and asking a second time
     for the rest fetched the whole book AGAIN. The split shipped this afternoon to make a
     godown phone faster was doubling what crossed its 4G.

     So the app stops assuming and looks: take whatever actually came back, and only go out a
     second time for what genuinely did not. That is correct today, when the server sends
     everything; and it stays correct the day the server learns to send only what was asked
     for, with no further change here. */
  function bookHas(r, tabs) {
    if (!r) return false;
    for (var i = 0; i < (tabs || []).length; i++) if (!Array.isArray(r[tabs[i]])) return false;
    return (tabs || []).length > 0;

    return (Date.now() - S.restAt) > REST_EVERY;

  function pull(loud) {

    var snap = snapLoad();
    if (snap && !S.data) { S.data = snap; applyJournal(); render(); }
    S.busy = true;
    if (S.data) render();
    if (loud) toast("Pulling the latest\u2026");

    var landedFast = false;

          : "No signal, and nothing saved on this phone yet.");

     answer was true and useless. His own header reads "3.7s . 383 KB" - the PULL is fast. The

     front of a man with the app OPEN never asked again. The delay was not slowness; it was

     thirty times is cheaper than pulling once. So it asks every 30 seconds while the app

     never while a save is in flight. A heartbeat must never be the thing that takes a man's

     server's write stamp moves, and every other phone notices inside thirty seconds. Then it
     pulled the FAST half of the book and returned - and in the Challan app `challans` is not

     changed, and still not show the new challan for five and a half minutes. No amount of
     waiting shortened it and the refresh arrow was the only way through, because the app had
     decided not to ask. That is the approval delay. It was never slowness - measured, the

     action anybody has ever taken - and re-fetching that on every glance is what a phone on

  function beatGo() { pull(false); }

  function openingScreen(msg) {
    el("root").innerHTML = '<div class="login"><h1>Energy World</h1><p>Challan &amp; material return</p>' +
      '<div class="empty" id="opmsg">' + esc(msg || "Opening…") + '</div><div id="opretry"></div></div>';
    setTimeout(function () {
      var d = el("opretry");
      /* v1.14.0 - this read `if (!d || S.data) return;`. S.data is set one line BEFORE the
         paint, so a paint that died left this button suppressed - the escape hatch closed by
         the very failure it was there for. Ask whether the app actually DREW itself, which
         only a real paint can make true. */
      if (!d || painted()) return;
      d.innerHTML = '<button class="btn full gry" data-act="reboot">Taking too long — try again</button>';
    }, 6000);
  }

  (function boot() {
    var sess = null;
    try { sess = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
    if (!(sess && sess.user && sess.pin)) { renderLogin(); regSW(); return; }

    S.user = sess.user; S.pin = sess.pin; S.role = sess.role || "";
    /* v1.7 - the offline copy lives in the big store now, so it has to be in memory before
       the warm paint or the app would open on a holding screen instead of the book. A local
       read of tens of milliseconds against a boot that already waits on two network calls,
       and it gives up after 2.5s rather than ever blocking. */
    /* v1.10.0 - JRN_KEY IS IN THIS LIST OR THE JOURNAL DOES NOT EXIST.
       bigSet removes the localStorage copy the moment IndexedDB has it, and bigGet only
       reads IndexedDB through the _big mirror. A journal key left out of the preload would
       therefore read back EMPTY on the very boot it was written for - the app would open
       having quietly forgotten the challan it promised to keep. */
    bigPreload([SNAP + "_" + S.user, CAT_KEY, JRN_KEY]).then(function () { boot2(sess); });
  })();

  function boot2(sess) {
    var snap = snapLoad();
    if (snap) { S.data = snap; applyJournal(); S.busy = true; render(); } else openingScreen();

    var authP = api("teamAuth", { ua: navigator.userAgent });
    /* v1.28.0 - the same split as pull(). The first open of the morning is the slowest moment
       in this app's day, because Apps Script wakes cold; asking for the names first means the
       form is usable while the history is still arriving. */
    var dataP = getBook(KEEP_FAST);
    var refused = false;
    loadCatalog();

    authP.then(function (r) {
      if (!r || !r.ok) {
        refused = true; S.pin = ""; forgetBook();
        try { localStorage.removeItem(STORE); } catch (e) {}
        renderLogin("Sign in again."); return;
      }
      S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
      beatStart();                        /* v1.30.0 - from here the phone asks on its own */
      if (!roleAny(ALLOWED)) {
        refused = true; S.pin = ""; forgetBook();
        renderLogin(notForYou(S.user, S.role)); S.role = ""; return;
      }
      try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: sess.pin, role: S.role })); } catch (e) {}
      if (S.data) render();
    }).catch(function () {});

    dataP.then(function (r) {
      if (refused) return;
      if (usableBook(r)) {
        mergeBook(r, KEEP_FAST); S.fastAt = Date.now(); bust();
        applyJournal(); snapSave(); render();
        if (bookHas(r, KEEP_REST)) {             /* the server sent everything - see bookHas */
          mergeBook(r, KEEP_REST); restTook(); bust();
          jrnReconcile(); applyJournal();
          S.syncAt = Date.now(); S.busy = false; snapSave(); render(); flushSoon();
          return;
        }
      }
      else if (!S.data) { S.busy = false;
        openingScreen("Could not read the book. " +
          (BOOKSAY ? BOOKSAY + " \u2014 read this out to the office." : "Try again.")); return; }
      else render();
      /* part two, behind the screen the man is already looking at */
      return getBook(KEEP_REST).then(function (r2) {
        if (refused) return;
        S.busy = false;
        if (!usableBook(r2)) { render(); return; }
        mergeBook(r2, KEEP_REST); restTook(); bust();
        jrnReconcile(); applyJournal();      /* reconcile after the history - see pull() */
        S.syncAt = Date.now(); snapSave(); render(); flushSoon();
      });
    }).catch(function () {
      if (refused) return;
      S.busy = false;
      if (S.data) { render(); if (painted()) toast("No signal — showing what was last pulled onto this phone."); }
      else openingScreen(jrnCount()
        ? jrnCount() + " record(s) are held safe on this phone and go up when there is signal. The book itself has never been pulled onto this phone."
        : "No signal, and nothing saved on this phone yet.");
    });

    /* v1.10.0 - the journal starts working the moment the app opens, whether or not the
       book came down. A challan typed yesterday in a basement goes up on today's first
       open, with nobody pressing anything. */
    startFlushTicker();
    regSW();
  }


})();
</script>
<script>
/* ---------------------------------------------------------------------------
   THE ICON NAG — one time, on the phone that needs it.
   The three apps used to share one Energy World leaf, so a man tapped the wrong
   one. They have their own pictures and names now — but a phone copies the icon
   into the home-screen shortcut on the day it is added and never looks again.
   Apple gives no way to change that from here; it has to be removed and re-added
   once. So the app tells the person holding it, rather than the owner having to
   tell five people. Shown only to someone who OPENED IT FROM THE HOME SCREEN —
   that is exactly the person with the old icon — once, and never again.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";
  var KEY = "ew_icon_nag_v1";
  try { if (localStorage.getItem(KEY)) return; } catch (e) { return; }

  var standalone = false;
  try {
    standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
                 window.navigator.standalone === true;
  } catch (e) {}
  if (!standalone) return;              /* in a browser tab there is no icon to fix */

  function show() {
    if (document.getElementById("ew_nag")) return;
    var d = document.createElement("div");
    d.id = "ew_nag";
    d.setAttribute("style",
      "position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 68px);z-index:9999;" +
      "background:#fff7ed;border:1px solid #fdba74;border-radius:13px;padding:13px 15px;" +
      "box-shadow:0 8px 24px rgba(15,23,42,.18);font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" +
      "color:#7c2d12;max-width:700px;margin:0 auto");
    d.innerHTML =
      '<div style="font-weight:800;margin-bottom:4px">This app has its own icon now</div>' +
      '<div>The picture on your home screen is still the old one — a phone keeps the icon from the day ' +
      'you added it. To fix it once: <b>press and hold the icon &rarr; Remove from Home Screen</b>, then open ' +
      '<b>energyworld apps</b> in the browser and <b>Add to Home Screen</b> again. You stay signed in.</div>' +
      '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">' +
        '<button id="ew_nag_open" style="appearance:none;border:1px solid #b45309;background:#b45309;color:#fff;' +
          'border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer">Open the apps page</button>' +
        '<button id="ew_nag_ok" style="appearance:none;border:1px solid #fdba74;background:#fff;color:#7c2d12;' +
          'border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer">Got it</button>' +
      '</div>';
    document.body.appendChild(d);
    var done = function () {
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      if (d.parentNode) d.parentNode.removeChild(d);
    };
    document.getElementById("ew_nag_ok").addEventListener("click", done);
    document.getElementById("ew_nag_open").addEventListener("click", function () {
      try { window.open("../apps/", "_blank"); } catch (e) {}
      done();
    });
  }
  /* after the app has painted, so it is never the first thing on a cold start */
  setTimeout(show, 2500);
})();
</script>
