<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1F3A5F"/>
<title>Energy World — Challan</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<meta name="apple-mobile-web-app-title" content="EW Challan"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#f1f5f9;color:#0f172a;padding-bottom:env(safe-area-inset-bottom)}
a{color:#0f766e}

.wrap{max-width:760px;margin:0 auto;padding:0 12px calc(var(--ew-nav,56px) + 40px)}
.top{background:#0f766e;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .t1{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.02em;flex:1}
.top .who{font-size:12px;color:#ccfbf1}
.sync{font-size:12px;color:#ccfbf1}
.btn{appearance:none;border:1px solid #0f766e;background:#0f766e;color:#fff;border-radius:10px;
  padding:11px 15px;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  min-height:44px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:#0f766e}

.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px;min-height:44px;min-width:44px}
.btn.gry{background:#fff;border-color:#cbd5e1;color:#334155}
.btn.red{background:#b91c1c;border-color:#b91c1c;color:#fff}
.btn.amb{background:#b45309;border-color:#b45309;color:#fff}
.btn.full{width:100%;padding:14px;font-size:16px}
.btn[disabled]{opacity:.55}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:12px 13px;margin:10px 0;
  box-shadow:0 1px 2px rgba(15,23,42,.05)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1 1 46%;min-width:150px;background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:11px 13px}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:#64748b;margin-top:2px}
.stat.bad .n{color:#b91c1c}
.stat.good .n{color:#0f766e}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;
  font-size:16px;font-family:inherit;background:#fff;color:#0f172a}

input[type="checkbox"],input[type="radio"]{width:auto;padding:0;min-height:0;flex:0 0 auto;
  -webkit-appearance:auto;appearance:auto}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin:11px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;
  background:#f1f5f9;color:#475569;vertical-align:middle;white-space:nowrap}
.pill.red{background:#fee2e2;color:#b91c1c}

.loginmsg{display:block;white-space:normal;word-break:break-word;text-align:left;
  line-height:1.45;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:12px;
  margin:0 0 12px;background:#fee2e2;color:#b91c1c}

.pill.amb{background:#fef3c7;color:#92400e}

.pill.say{display:block;white-space:normal;word-break:break-word;flex:1 1 100%;text-align:left;
  border-radius:10px;padding:6px 10px;line-height:1.4;font-size:12px}

.frnote{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;color:#334155}
.frnote.amb{background:#fffbeb;border-color:#fde68a;color:#92400e}
.frnote.grn{background:#f0fdfa;border-color:#99f6e4;color:#0f766e}
.frbox{background:#fff;border:1px solid #e2e8f0;border-radius:13px;margin:-4px 0 12px;overflow:hidden}
.frline{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-top:1px solid #eef2f7;font-size:13.5px}
.frline:first-child{border-top:0}
.pill.grn{background:#ccfbf1;color:#0f766e}

.stp-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:7px 0 2px;padding:6px 9px;background:#f8fafc;border-left:3px solid #cbd5e1;border-radius:0 8px 8px 0}
.stp{font-size:12.5px;font-weight:700}
.stp.done{color:#0f766e;text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:#5eead4}
.stp.wait{color:#94a3b8;font-weight:600}
.stp-sep{color:#cbd5e1;font-size:12.5px}

.stp-b{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill.blu{background:#dbeafe;color:#1d4ed8}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.muted{color:#64748b;font-size:12.5px}
.big{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:flex-end;cursor:pointer}
.sheet .inner{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);max-width:760px;margin:0 auto;cursor:auto;
  -webkit-overflow-scrolling:touch}
@supports (height:100dvh){.sheet .inner{max-height:88dvh}}
.sheet h2{margin:0 0 3px;font-size:17px}
.empty{text-align:center;color:#64748b;padding:26px 14px;font-size:13.5px}

#ew_sync_banner{position:fixed;left:0;right:0;bottom:var(--ew-nav,56px);z-index:29;
  background:#9a3412;color:#fff;padding:8px 12px calc(8px);font-size:12.5px;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom) + var(--ew-bottom,0px));transition:bottom .16s ease;background:#0f172a;color:#fff;
  padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:100000;max-width:88%;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.login{max-width:340px;margin:9vh auto;background:#fff;border-radius:16px;padding:26px 22px;
  box-shadow:0 10px 30px rgba(15,23,42,.14)}
.login h1{margin:0 0 3px;font-size:19px;text-align:center}
.login p{margin:0 0 16px;text-align:center;color:#64748b;font-size:13px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:30;
  padding-bottom:env(safe-area-inset-bottom)}

.nav button{flex:1 1 0;min-width:0;border:0;background:none;padding:9px 2px 10px;font-size:12px;font-weight:700;color:#94a3b8;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nav button.on{color:#0f766e}
.nav button b{display:block;font-size:17px;line-height:1.25}
.nav button .cnt{display:inline-block;background:#b91c1c;color:#fff;border-radius:999px;padding:0 6px;font-size:12px;margin-left:3px}

.crumb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.crumb .c{background:#ccfbf1;color:#0f766e;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.tile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid #e2e8f0;
  border-radius:12px;padding:11px 12px;margin-bottom:7px;cursor:pointer;font-size:14.5px;font-weight:700;color:#0f172a;min-height:52px}
.tile .sub{font-size:12px;font-weight:600;color:#64748b;display:block;margin-top:2px}
.tile img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#f8fafc;flex:0 0 auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin-bottom:7px}
.gtile{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e2e8f0;border-radius:12px;
  padding:9px 10px;cursor:pointer;font-size:13.5px;font-weight:800;color:#0f172a;min-height:56px;line-height:1.25}
.gtile .sub{font-size:12px;font-weight:600;color:#64748b;display:block;margin-top:3px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:7px}

@media(min-width:620px){.grid,.pgrid{grid-template-columns:repeat(3,1fr)}}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:5px 11px;font-family:inherit;font-size:12px;font-weight:600;color:#64748b;cursor:pointer;white-space:nowrap;line-height:1.35}
.chip b{font-weight:700;color:#94a3b8;margin-left:3px;font-size:12px}
.chip.on{background:#0f766e;border-color:#0f766e;color:#fff}
.chip.on b{color:#99f6e4}
.chip.bchip,.chip.fchip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 13px;font-size:13px}
.bdot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.85)}
.chip.fchip{border-color:#c7d2fe;color:#3730a3;background:#f5f6ff}
.chip.fchip b{color:#818cf8}
.chip.fchip.on{background:#4338ca;border-color:#4338ca;color:#fff}
.chip.fchip.on b{color:#c7d2fe}
.ew-picklabel{font-size:12px;font-weight:700;color:#0f766e;margin:12px 0 7px;text-transform:uppercase;letter-spacing:.4px}
.ew-picklabel .step{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#0f766e;color:#fff;font-size:12px;margin-right:6px}
.plist{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden}
.plist .prow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-bottom:1px solid #eef2f7}
.plist .prow:last-child{border-bottom:0}
.plist .prow.picked{background:#f0fdfa}
.plist .prow img,.plist .prow .noimg{width:54px;height:54px;min-width:54px;max-width:54px;object-fit:contain;border-radius:8px;background:#f8fafc;flex:0 0 54px;border:1px solid #e2e8f0}
.noimg{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:1.15;font-weight:600;color:#cbd5e1}
.plist .prow .pinfo{flex:1 1 auto;min-width:0}
.plist .prow .pname{font-size:13.5px;font-weight:600;line-height:1.25}
.plist .prow .pmeta{font-size:12px;color:#94a3b8}
.plist .prow .pqty{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.plist .prow .pqty .stp{width:44px;height:44px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;font-size:17px;font-weight:700;color:#0f766e;cursor:pointer;line-height:1;padding:0}
.plist .prow .pqty input{width:56px;text-align:center;padding:7px 2px;font-size:14px;font-weight:700;min-height:44px}
.pcard{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:8px 9px}
.pcard .pn{font-weight:800;font-size:13px;line-height:1.25}
.pcard .pm{font-size:12px;color:#64748b;font-weight:600;margin-top:2px}
.pcard img{width:100%;height:62px;object-fit:contain;border-radius:8px;background:#f8fafc;display:block}
.pcard .step button{width:32px;height:34px;font-size:17px;border-radius:8px}
.pcard .step input{width:100%;text-align:center;font-weight:800;padding:6px 2px;min-height:44px}
.pcard .step{gap:5px;margin-top:7px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:42px;height:42px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:20px;font-weight:800;cursor:pointer}
.step input{width:74px;text-align:center;font-weight:800}
.line{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f1f5f9}

.bookno{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:11px 0 2px}
.bookno label{margin:0;font-size:12px;font-weight:800;letter-spacing:.02em;color:#b91c1c;
  background:#fee2e2;border:1px solid #fecaca;border-radius:6px;padding:3px 8px;white-space:nowrap}

.bookno input{width:104px;flex:0 0 auto;text-align:center;font-size:16px;font-weight:800;
  letter-spacing:.03em;padding:8px;min-height:44px;border:1px solid #fca5a5;border-radius:8px}
.bookno input.has{border-color:#86efac;background:#f0fdf4}
.bookno span{width:14px;font-size:12px;color:#15803d}

.exec{margin:14px 0 4px;padding:11px 13px;background:#0f766e;color:#fff;border-radius:11px;font-weight:700;
  font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.exec .sub{font-size:12px;font-weight:600;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;white-space:nowrap}
.exec .car{font-size:13px;opacity:.85}

body{background:#F4F6F9}
.top{background:#1F3A5F;border-bottom:3px solid #C9A24A}
.top .who{color:#E9D9AE}
.btn{background:#1F3A5F;border-color:#1F3A5F}
.btn.ghost{color:#1F3A5F;border-color:#1F3A5F}
.chip.on{background:#1F3A5F;border-color:#1F3A5F}
.chip.on b{color:#E9D9AE}
.nav button.on{color:#1F3A5F}
</style>
</head>
