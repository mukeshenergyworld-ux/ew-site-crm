<div id="root"></div>
<!-- Nothing third-party is loaded here. The PDF builder is fetched the first time a
     challan is actually printed, never at start-up: this app has to open in a godown
     with one bar of signal. -->
<script>
(function () {
  "use strict";
  /* ==========================================================================
     ENERGY WORLD - CHALLAN & MATERIAL RETURN
     A separate app for the godown and the accounts desk, because the CRM does forty
     things and these two men do two. Everything on this screen is either sending
     material out or taking material back in.

     IT IS THE SAME BOOK. Same name and PIN as the Team CRM, same server, same
     Challans and Returns sheets, in exactly the same row shape and with exactly the
     same numbering - a challan made here is indistinguishable from one made in the
     CRM, and the CRM is not changed in any way by this app existing.

     WHO DOES WHAT (the owner's rule).
       GODOWN  makes the challan, registers the return, attaches the signed receipt.
               What he makes is a DRAFT. It is not a delivery yet.
       ACCOUNTS approves it. Only then does it count against the client's account.
       ADMIN   may do either.
     Two pairs of eyes on every delivery. Nothing here can delete anything, ever:
     an approval is a row added, not a row changed.
     ========================================================================== */

  var APP_VERSION = "1.21.0";
  var GAS = "https://script.google.com/macros/s/AKfycbzVkPHWyPq-w8RFD_HdG0vCjmrfQvEUpcq_hhF9eDGa0ZbZ3rIx7N37an2DQRGmsxPK/exec";
  var STORE = "ew_challan_session";

  /* ==EW-CORE:BEGIN== built by tools/build_core.py — do not edit here, edit core/ew-core.js == */
/* ==EWCORE:idb== The IndexedDB door. */
/* ==EWCORE:idb== The IndexedDB door. */
  function idbOpen() {
    if (_idbP) return _idbP;
    _idbP = new Promise(function (res) {
      var done = false, fin = function (v) { if (!done) { done = true; res(v); } };
      try {
        if (!window.indexedDB) return fin(null);
        var rq = indexedDB.open(IDB_NAME, 1);
        rq.onupgradeneeded = function () {
          try { rq.result.createObjectStore(IDB_STORE); } catch (e) {}
        };
        rq.onsuccess = function () { fin(rq.result); };
        rq.onerror = function () { fin(null); };
        rq.onblocked = function () { fin(null); };
        /* Safari in private mode can leave open() hanging forever. The app must never wait
           on storage to start - it falls back to localStorage and carries on. */
        setTimeout(function () { fin(null); }, 2500);
      } catch (e) { fin(null); }
    });
    return _idbP;
  }
  function idbSet(k, v) {
    return idbOpen().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(IDB_STORE, "readwrite");
          t.objectStore(IDB_STORE).put(v, k);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
          t.onabort = function () { res(false); };
        } catch (e) { res(false); }
      });
    }).catch(function () { return false; });
  }
  function idbGet(k) {
    return idbOpen().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          var r = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(k);
          r.onsuccess = function () { res(r.result === undefined ? null : r.result); };
          r.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    }).catch(function () { return null; });
  }
  function idbDel(k) {
    return idbOpen().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(IDB_STORE, "readwrite");
          t.objectStore(IDB_STORE).delete(k);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
        } catch (e) { res(false); }
      });
    }).catch(function () { return false; });
  }
/* ==EWCORE:idb:END== */
/* ==EWCORE:bigbox== The big box: what will not fit in the shared 5 MB of localStorage. */
/* ==EWCORE:bigbox== The big box: what will not fit in the shared 5 MB of localStorage. */
  function bigGet(k) {
    if (Object.prototype.hasOwnProperty.call(_big, k)) return _big[k];
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function bigDel(k) { delete _big[k]; idbDel(k); try { localStorage.removeItem(k); } catch (e) {} }
  /* v1.10.0 - THE SAME WRITE, BUT IT ANSWERS.
     bigSet returned true whatever happened: the IndexedDB write is behind a promise and the
     localStorage fallback swallows its own exception. That was tolerable while the big box
     only ever held a CACHE - a catalogue that fails to store is re-fetched tomorrow and
     nobody is worse off. The write journal below is not a cache. It is the only copy of a
     challan a man typed in a basement, and if it did not store, he has to be told NOW, while
     he is still standing there and can write it in the paper book - not in three days when
     somebody notices the delivery is on no screen. */
  function bigSetX(k, v) {
    _big[k] = v;
    return idbSet(k, v).then(function (ok) {
      if (ok) { try { localStorage.removeItem(k); } catch (e) {} return true; }
      try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
    }).catch(function () {
      try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
    });
  }
/* ==EWCORE:bigbox:END== */
/* ==EWCORE:webauthn== Face ID / fingerprint plumbing. No PIN passes through any of it. */
/* ==EWCORE:webauthn== Face ID / fingerprint plumbing. No PIN passes through any of it. */
  function b64u(buf) {
    var b = new Uint8Array(buf), s2 = "";
    for (var i = 0; i < b.length; i++) s2 += String.fromCharCode(b[i]);
    return btoa(s2).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function randBytes(n) {
    var a = new Uint8Array(n); crypto.getRandomValues(a); return a;
  }
  function bioSaved() {
    try { return JSON.parse(localStorage.getItem(BIO_KEY) || "null"); } catch (e) { return null; }
  }
  function bioAvailable() {
    return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
  }
/* ==EWCORE:webauthn:END== */
/* ==EWCORE:tiny== The three-line helpers every app rewrote. */
  /* ---------- tiny helpers ---------- */
  function el(id) { return document.getElementById(id); }
  function lower(s) { return String(s == null ? "" : s).trim().toLowerCase(); }
  /* Pressing a button is a fresh start - never make a man wait out a backoff he can see. */
  function flushNow() { _flushFails = 0; _flushSkip = 0; flushSoon(); }
/* ==EWCORE:tiny:END== */
/* ==EWCORE:drive== Google Drive picture links, repaired to the one form that renders. */
  /* Normalise any Google-Drive image link to the one lh3 form that actually
     renders inside an <img>: https://lh3.googleusercontent.com/d/{ID}=w200
     The catalogue's "Pic" column mixes two shapes -
       .../d/{ID}=w200            -> works (thumbnail)
       .../d/{ID}/view?usp=w200   -> a Drive *viewer* path, NOT an image -> broken ?
     Grundfos, CPVC, CISTERN, LEO and many Accessory rows were all in the broken
     /view form (verified by load-testing: /view => ERROR, =w200 => loads).
     We repair every Drive link to =w200 here, so on-screen thumbnails, the
     catalogue, the price-list PDF and the quotation PDF all get a loadable URL,
     and any future /view paste self-heals. Non-Drive URLs pass through unchanged. */
  function driveImg(u, size) {
    u = String(u || "").trim();
    if (!u) return "";
    var m = u.match(/\/d\/([A-Za-z0-9_\-]{20,})/) || u.match(/[?&]id=([A-Za-z0-9_\-]{20,})/);
    if (!m) return u;
    return "https://lh3.googleusercontent.com/d/" + m[1] + "=w" + (size || 200);
  }
/* ==EWCORE:drive:END== */
/* ==EWCORE:crash== The app may not die silently. Found the hard way, 17 Aug. */
  /* THE ONE HONEST TEST OF "did the app draw itself". The header exists only after a real
     paint, so it cannot be fooled by data merely arriving. S.data could be, and was. */
  function painted() {
    try { return !!document.querySelector(".top"); } catch (e) { return false; }
  }
  function crashPut(where, e) {
    var o = { at: Date.now(), where: where || "", ver: APP_VERSION, user: S.user || "",
              msg: (e && e.message) ? String(e.message) : String(e),
              stack: String((e && e.stack) || "").split("\n").slice(0, 4).join(" | ") };
    try { localStorage.setItem(CRASH_KEY, JSON.stringify(o)); } catch (x) {}
    return o;
  }
  function crashLast() {
    try { return JSON.parse(localStorage.getItem(CRASH_KEY) || "null"); } catch (e) { return null; }
  }
  /* Anything that reaches the top, from anywhere, at any time. If the app never painted, the
     screen is dead anyway and is replaced. If it DID paint, he may be half way through a
     challan - so it says so in a toast and leaves his typing exactly where it is. */
  function crashHandle(where, e) {
    var o = crashPut(where, e);
    if (painted()) { try { toast("Something on that screen could not be drawn — tap ↻. (" + o.msg + ")"); } catch (x) {} }
    else crashScreen(o);
  }
/* ==EWCORE:crash:END== */
/* ==EWCORE:refresh== One tap: the latest book AND the latest build. */
  /* ============ WHAT THE REFRESH BUTTON IS ACTUALLY FOR (17 Aug 2026) ============
     Two different jobs hide behind one arrow, and this app only ever did the first:

       1. pull the book again  — it did this;
       2. come back on the NEW BUILD if one has been put up — it did not, and no screen in
          this app did. A release went up and every phone kept running the old one until
          somebody was rung and told to reinstall.

     WHERE THE VERSION COMES FROM. This app's own file on GitHub Pages, fetched past the
     browser cache, with APP_VERSION read straight out of it. Not the backend: that costs
     Apps Script quota on every tap, it is often the very thing that is down when a man
     reaches for this button, and it can disagree with what is actually served. The file
     cannot disagree with itself.

     AND IT NEVER RELOADS UNDER A MAN WHO IS TYPING. If a form is open it says so and does
     nothing at all — Collection learned that in v1.9.1, when the arrow above an open "Log
     the call" silently ate three lines of notes. */
  function liveVersion() {
    return fetch("index.html?v=" + Date.now(), { cache: "reload" })
      .then(function (r) { return r.text(); })
      .then(function (t) { return (t.match(/APP_VERSION\s*=\s*"([\d.]+)"/) || [])[1] || ""; })
      .catch(function () { return ""; });      /* no signal is not a new version */
  }
  function refreshNow(loud) {
    pull(true);
    liveVersion().then(function (v) {
      if (!v || v === APP_VERSION) { if (loud) toast("This is the latest version (v" + APP_VERSION + ")."); return; }
      S.newVer = v;
      try { render(); } catch (e) {}
      toast("Version " + v + " is ready — tap Update above.");
    });
  }
  /* Only this app's shell, and only this app's worker. All seven apps share one github.io
     origin, so a blanket wipe here takes the other six down with it. */
  function updateNow(prefix) {
    var jobs = [];
    try {
      if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.filter(function (k) { return k.indexOf(prefix) === 0; })
                             .map(function (k) { return caches.delete(k); }));
      }));
    } catch (e) {}
    var go = function () { location.replace(location.pathname + "?u=" + Date.now()); };
    if (jobs.length) Promise.all(jobs).then(go, go); else go();
    setTimeout(go, 2500);                      /* never hang on a stuck cache */
  }

     the save is attempted - so a save that then fails can never draw a second number and eat
     the series. That is v1.9.0's lesson, applied to the offline path. */
  function jrnSend(e) {
    if (e.kind === "move") return api("challanMove", { id: e.id, to: e.to });
    var pre = Promise.resolve(null);
    var needNo = (e.tab === "challans" && !String(e.row.challanNo || "").trim()) ||
                 (e.tab === "returns"  && !String(e.row.returnNo  || "").trim());
    if (needNo) {
      if (!e.noFor) return Promise.resolve({ ok: false, error: "no client on this record to draw a number for" });
      var act = e.tab === "challans" ? "challanNo" : "returnNo";
      var fld = e.tab === "challans" ? "challanNo" : "returnNo";
      pre = api(act, { client: e.noFor }).then(function (n) {
        var no = (n && n[fld]) || "";
        if (!no) throw new Error("the server did not give a number");
        e.row[fld] = no;
        jrnPatch(e.pk, { row: e.row });
        return no;
      });
    }
    return pre.then(function () {
      var payload = Object.assign({}, e.row);
      delete payload._lid;
      return api("teamSave", { tab: e.tab, row: payload });
    });
  }

  function jrnFlush() {
    if (_flushing) return;
    var l0 = jrnLoad();
    if (!l0.length) return;
    _flushing = true;
    /* Two belts. Every call has its own deadline, and if the loop is somehow still not
       finished long after the longest possible call, the flag is released anyway - a hung
       call once froze a whole session's queue. */
    if (_flushDog) clearTimeout(_flushDog);
    _flushDog = setTimeout(function () { _flushing = false; _flushDog = null; }, 180000);
    var okCount = 0, i = 0;
    var stop = function () {
      _flushing = false;
      if (_flushDog) { clearTimeout(_flushDog); _flushDog = null; }
      try { render(); } catch (e) {}
      if (!jrnCount()) { if (okCount) toast("Everything held on this phone is now saved."); }
      else if (okCount) toast(okCount + " saved. " + jrnCount() + " still held — the bar shows the reason.");
    };
    var step = function () {
      var l = jrnLoad();
      if (i >= l.length) { stop(); return; }
      var e = l[i];
      jrnSend(e).then(function (r) {
        if (r && r.ok) {
          if (e.kind === "row") {
            var arr = (S.data && S.data[e.tab]) || [];
            for (var j = 0; j < arr.length; j++) {
              if (arr[j] && natEq(arr[j], e.row)) { Object.assign(arr[j], r.row || e.row); break; }
            }
          } else if (e.kind === "move" && S.data) {
            var cs = S.data.challans || [];
            for (var k = 0; k < cs.length; k++) {
              if (cs[k] && String(cs[k].id) === String(e.id)) {
                cs[k].status = e.to;
                if (e.to === "Received") cs[k].receiptReceived = "Y";
                break;
              }
            }
          }
          bust(); jrnDrop(e.pk); okCount++;   /* the list shifted left - same index is the next one */
        } else {
          jrnMark(e.pk, (r && r.error) || "the server refused it"); i++;
        }
        step();
      }).catch(function (err) {
        /* The real reason, kept. "network error" for everything is how a healthy connection
           came to be blamed for a timeout in the CRM for eight releases. */
        jrnMark(e.pk, (err && err.message) ? err.message : "no answer from the server");
        i++; step();
      });
    };
    step();
  }

  function flushSoon() {
    if (!jrnCount()) { _flushFails = 0; _flushSkip = 0; return; }
    try { if (navigator && navigator.onLine === false) return; } catch (e) {}
    if (_flushSkip > 0) { _flushSkip--; return; }
    var before = jrnCount();
    try { jrnFlush(); } catch (e) {}
    setTimeout(function () {
      if (jrnCount() < before) { _flushFails = 0; _flushSkip = 0; }
      else { _flushFails = Math.min(_flushFails + 1, 3); _flushSkip = Math.pow(2, _flushFails) - 1; }
    }, 8000);
  }

  function startFlushTicker() {
    if (_flushTick) return;
    _flushTick = setInterval(flushSoon, 45000);
    try {
      document.addEventListener("visibilitychange", function () { if (!document.hidden) flushSoon(); });
      window.addEventListener("online", flushSoon);
    } catch (e) {}
    flushSoon();
  }

  function saveRow(tab, row, opts) {
    /* v1.10.0 - JOURNAL FIRST, THEN THE SERVER. Never the other way round: the whole point
       is that the record survives this tab being discarded one second after the tap.
       This never rejects. It resolves { ok, row, held } - held meaning it is safe on the
       device but the server has not confirmed it, which is a different thing from saved and
       a different thing from lost, and every caller now says which of the three it is. */
    opts = opts || {};
    var r2 = Object.assign({}, row);
    if (!String(r2.id || "").trim() && !r2._lid) r2._lid = "L-" + Date.now() + "-" + (++_jrnSeq) + "-" + Math.floor(Math.random() * 1000000);
    var e = jrnPut({ pk: "P-" + Date.now() + "-" + (++_jrnSeq), kind: "row", tab: tab, row: r2,
                     noFor: opts.noFor || "", by: S.user || "", at: Date.now(), err: "", tries: 0 });
    return jrnSend(e).then(function (r) {
      if (r && r.ok) { jrnDrop(e.pk); return { ok: true, row: r.row || r2, held: false }; }
      jrnMark(e.pk, (r && r.error) || "the server refused it");
      return { ok: true, row: e.row, held: true, err: (r && r.error) || "the server refused it" };
    }).catch(function (err) {
      jrnMark(e.pk, (err && err.message) ? err.message : "no answer from the server");
      return { ok: true, row: e.row, held: true, err: (err && err.message) || "no answer from the server" };
    });
  }

  function parseCatalog(rows) {
    var head = -1, i, r;
    for (i = 0; i < rows.length && i < 10; i++) {
      r = (rows[i] || []).map(function (x) { return String(x || "").toLowerCase().trim(); });
      if (r.indexOf("product code") >= 0) { head = i; break; }
    }
    if (head < 0) return [];
    var out = [];
    for (i = head + 1; i < rows.length; i++) {
      var row = rows[i] || [];
      var code = String(row[1] || "").trim();
      var desc = String(row[3] || row[2] || "").trim();
      if (!code && !desc) continue;
      out.push({
        code: code, family: String(row[2] || "").trim(), desc: desc,
        cat: String(row[4] || "").trim(), unit: String(row[5] || "").trim(),
        price: num(row[6]), brand: String(row[8] || "").trim(),
        pic: driveImg(row[10]), specs: String(row[11] || "").trim(),
        label: (code ? code + " - " : "") + desc
      });
    }
    return out;
  }
  function loadCatalog() {
    try {
      var c = JSON.parse(bigGet(CAT_KEY) || "null");
      if (c && c.v === CAT_V && c.items && c.items.length) PRODUCTS = c.items;
    } catch (e) {}
    var fresh = false;
    try {
      var c2 = JSON.parse(bigGet(CAT_KEY) || "null");
      fresh = !!(c2 && c2.at && (Date.now() - c2.at < 86400000));
    } catch (e) {}
    if (fresh && PRODUCTS.length) return Promise.resolve(PRODUCTS);   /* 222 KB not worth re-reading */
    return fetch(GAS + "?action=catalog", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        var items = parseCatalog(rows);
        if (items.length) {
          PRODUCTS = items;
          bigSet(CAT_KEY, JSON.stringify({ v: CAT_V, at: Date.now(), items: items }));
        }
        return PRODUCTS;
      })
      .catch(function () { return PRODUCTS; });
  }

  /* ---------- WHERE THE CLIENT IS ----------
     District first, then the area inside it, then his name. That is how the godown thinks
     about a delivery - which town, which colony, which man - and it turns a list of 118
     names into three short taps. A client with no area still has a home: "(area not set)",
     so nobody is unreachable because a field was left blank. */
  var NO_AREA = "(area not set)";
  /* v17 Aug - NATURAL order everywhere a list is shown. A plain .sort() puts "Sector 15"
     after "Sector 100" because it compares text, and that looks wrong to a man who knows his
     own districts. numeric:true reads the digits as numbers; sensitivity:"base" files
     differently-capitalised spellings of the same name together. */
  function alpha(a, b) {
    return String(a == null ? "" : a).localeCompare(String(b == null ? "" : b),
      undefined, { numeric: true, sensitivity: "base" });
  }
  function districts() {
    var m = {};
    clients().forEach(function (c) {
      var d = String(c.location || "").trim();
      if (d) m[d] = (m[d] || 0) + 1;
    });
    return Object.keys(m).sort(alpha).map(function (k) { return { name: k, n: m[k] }; });
  }
  function areasIn(dist) {
    var m = {};
    clients().forEach(function (c) {
      if (dist && String(c.location || "").trim() !== dist) return;
      var a = String(c.area || "").trim() || NO_AREA;
      m[a] = (m[a] || 0) + 1;
    });
    return Object.keys(m).sort(function (a, b) {
      if (a === NO_AREA) return 1;
      if (b === NO_AREA) return -1;
      return a.localeCompare(b);
    }).map(function (k) { return { name: k, n: m[k] }; });
  }
  function clientsIn(dist, area, q) {
    var qq = lower(q || "");
    return clients().filter(function (c) {
      if (dist && String(c.location || "").trim() !== dist) return false;
      if (area) {
        var a = String(c.area || "").trim() || NO_AREA;
        if (a !== area) return false;
      }
      if (!qq) return true;
      /* initials as well as the start of the name: "rk" finds "Rakesh - Ansal I Block" */
      var nm = lower(c.name);
      if (nm.indexOf(qq) >= 0) return true;
      var initials = nm.split(/[^a-z0-9]+/).filter(Boolean).map(function (w) { return w[0]; }).join("");
      return initials.indexOf(qq) === 0;
    }).sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
  }
