<style>
/* Teal, not the collection app's maroon, so a man never mistakes one for the other.
   Everything here is sized for a hand in a godown: bigger type, bigger targets. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#f1f5f9;color:#0f172a;padding-bottom:env(safe-area-inset-bottom)}
a{color:#0f766e}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 96px}
.top{background:#0f766e;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .t1{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.02em;flex:1}
.top .who{font-size:11.5px;color:#ccfbf1}
.sync{font-size:11px;color:#ccfbf1}
.btn{appearance:none;border:1px solid #0f766e;background:#0f766e;color:#fff;border-radius:10px;
  padding:11px 15px;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;

.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:#0f766e}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px;min-height:36px}
.btn.gry{background:#fff;border-color:#cbd5e1;color:#334155}
.btn.red{background:#b91c1c;border-color:#b91c1c;color:#fff}
.btn.amb{background:#b45309;border-color:#b45309;color:#fff}
.btn.full{width:100%;padding:14px;font-size:16px}
.btn[disabled]{opacity:.55}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:12px 13px;margin:10px 0;
  box-shadow:0 1px 2px rgba(15,23,42,.05)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1 1 46%;min-width:150px;background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:11px 13px}

input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;

label{display:block;font-size:12px;font-weight:700;color:#475569;margin:11px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.muted{color:#64748b;font-size:12.5px}
.big{font-size:19px;font-weight:800;letter-spacing:-.02em}

.sheet .inner{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);max-width:760px;margin:0 auto;cursor:auto;
  -webkit-overflow-scrolling:touch}

.sheet h2{margin:0 0 3px;font-size:17px}
.empty{text-align:center;color:#64748b;padding:26px 14px;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#0f172a;color:#fff;
  padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:99;max-width:88%;box-shadow:0 6px 18px rgba(0,0,0,.3)}

  box-shadow:0 10px 30px rgba(15,23,42,.14)}

.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:30;
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:9px 4px 10px;font-size:11px;font-weight:700;color:#94a3b8;cursor:pointer}

/* the picker: brand, then category, then product - one level at a time */
.crumb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.crumb .c{background:#ccfbf1;color:#0f766e;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.tile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid #e2e8f0;
  border-radius:12px;padding:11px 12px;margin-bottom:7px;cursor:pointer;font-size:14.5px;font-weight:700;color:#0f172a;min-height:52px}
.tile .sub{font-size:11.5px;font-weight:600;color:#64748b;display:block;margin-top:2px}
.tile img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#f8fafc;flex:0 0 auto}
.step{display:flex;align-items:center;gap:8px}
.step button{width:42px;height:42px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:20px;font-weight:800;cursor:pointer}
.step input{width:74px;text-align:center;font-weight:800}
.line{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.mano{border:2px solid #b91c1c!important;background:#fef2f2!important;font-weight:800}
/* executive bands: a solid teal strip per man, tap to open or shut */
.exec{margin:14px 0 4px;padding:11px 13px;background:#0f766e;color:#fff;border-radius:11px;font-weight:700;
  font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.exec .sub{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;white-space:nowrap}
.exec .car{font-size:13px;opacity:.85}
</style>
</head>
<body>
<div id="root"></div>
<!-- Nothing third-party is loaded here. The PDF builder is fetched the first time a
     challan is actually printed, never at start-up: this app has to open in a godown
     with one bar of signal. -->
<script>
(function () {
  "use strict";
  /* ==========================================================================
     ENERGY WORLD - CHALLAN & MATERIAL RETURN
     A separate app for the godown and the accounts desk, because the CRM does forty
     things and these two men do two. Everything on this screen is either sending
     material out or taking material back in.

     IT IS THE SAME BOOK. Same name and PIN as the Team CRM, same server, same
     Challans and Returns sheets, in exactly the same row shape and with exactly the
     same numbering - a challan made here is indistinguishable from one made in the
     CRM, and the CRM is not changed in any way by this app existing.

     WHO DOES WHAT (the owner's rule).
       GODOWN  makes the challan, registers the return, attaches the signed receipt.
               What he makes is a DRAFT. It is not a delivery yet.
       ACCOUNTS approves it. Only then does it count against the client's account.
       ADMIN   may do either.
     Two pairs of eyes on every delivery. Nothing here can delete anything, ever:
     an approval is a row added, not a row changed.
     ========================================================================== */

  var APP_VERSION = "1.4.1";
  var GAS = "https://script.google.com/macros/s/AKfycbzVkPHWyPq-w8RFD_HdG0vCjmrfQvEUpcq_hhF9eDGa0ZbZ3rIx7N37an2DQRGmsxPK/exec";
  var STORE = "ew_challan_session";
  var SNAP  = "ew_challan_snap";
  var BIO_KEY = "ew_challan_bio";
  var CAT_KEY = "ew_team_catalog";      /* shared with the CRM on purpose - same catalogue */
  var CAT_V = 2;
  var CRM_URL = "../team/";

  var PRODUCTS = [];
  var S = { user:"", pin:"", role:"", data:null, tab:"make", q:"", allTime:false, chFilter:"all", sheet:null, busy:false,
            syncAt:0, ch:null, rt:null, pick:null, open:"" };

  /* ---------- tiny helpers ---------- */
  function el(id) { return document.getElementById(id); }
  function val(id) { var e = el(id); return e ? String(e.value || "").trim() : ""; }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function num(v) {
    if (typeof v === "number") return isFinite(v) ? v : 0;
    var n = Number(String(v == null ? "" : v).replace(/[^0-9.\-]/g, ""));
    return isFinite(n) ? n : 0;
  }
  function money(n) { return "₹" + Math.round(num(n)).toLocaleString("en-IN"); }
  function lower(s) { return String(s == null ? "" : s).trim().toLowerCase(); }
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function d10(v) { return String(v == null ? "" : v).slice(0,10); }
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function dstr(ymd) {
    if (!ymd) return "";
    var p = String(ymd).slice(0,10).split("-");
    if (p.length !== 3) return String(ymd);
    return Number(p[2]) + " " + (MON[Number(p[1])-1] || "") + " " + p[0];
  }
  var _toastT = null;
  function toast(m) {
    var t = el("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
    t.textContent = m; t.style.display = "block";
    clearTimeout(_toastT); _toastT = setTimeout(function () { t.style.display = "none"; }, 3600);
  }

  /* ---------- the server ----------
     Every call has a deadline. A request that stalls on one bar of signal used to be
     indistinguishable from one still working, and a man in a godown would stand there
     watching a disabled button. It fails, and says so, instead. */
  var API_TIMEOUT = 25000;
  function api(action, extra, ms) {
    var body = Object.assign({ action: action, user: S.user, pin: S.pin }, extra || {});
    var ctrl = null, timer = null;
    try { ctrl = new AbortController(); } catch (e) { ctrl = null; }
    var opts = { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) };
    if (ctrl) opts.signal = ctrl.signal;
    var p = fetch(GAS, opts).then(function (r) { return r.json(); });
    if (ctrl) {
      timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, Number(ms) || API_TIMEOUT);
      p = p.then(function (v) { clearTimeout(timer); return v; }, function (e) { clearTimeout(timer); throw e; });
    }
    return p;
  }
  function saveRow(tab, row) { return api("teamSave", { tab: tab, row: row }); }

  /* Only the tabs this app reads. The backend honours "only" as of V93, so the rest of
     the book - quotes, pitch, payments, tools - never comes down the wire at all. */
  var KEEP = ["clients","challans","returns","sites","drivers","discounts","brandmap","brands","associates","audit"];
  function slimBook(r) {
    if (!r || typeof r !== "object") return r;
    var out = { ok: r.ok };
    if (r.user) out.user = r.user;
    KEEP.forEach(function (k) { if (r[k]) out[k] = r[k]; });
    return out;
  }
  function getBook() { return api("teamGet", { only: KEEP }); }
  function usableBook(r) { return !!(r && r.ok && r.clients && r.clients.length); }

  /* ---------- the PDF builder, only when a challan is actually printed ---------- */
  var _pdfP = null;
  function ensurePdf() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(true);
    if (_pdfP) return _pdfP;
    _pdfP = new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s.async = true;
      s.onload = function () {
        if (window.jspdf && window.jspdf.jsPDF) res(true); else { _pdfP = null; rej(new Error("empty")); }
      };
      s.onerror = function () { _pdfP = null; rej(new Error("failed")); };
      document.head.appendChild(s);
    });
    return _pdfP;
  }

  /* ---------- the catalogue ----------
     Exactly the CRM's parser and exactly the CRM's cache key, so the two apps share one
     copy on the device and a product added in either is seen by both. */
  function driveImg(u, size) {
    u = String(u || "").trim();
    if (!u) return "";
    var m = u.match(/\/d\/([A-Za-z0-9_\-]{20,})/) || u.match(/[?&]id=([A-Za-z0-9_\-]{20,})/);
    if (!m) return u;
    return "https://lh3.googleusercontent.com/d/" + m[1] + "=w" + (size || 200);
  }
  function parseCatalog(rows) {
    var head = -1, i, r;
    for (i = 0; i < rows.length && i < 10; i++) {
      r = (rows[i] || []).map(function (x) { return String(x || "").toLowerCase().trim(); });
      if (r.indexOf("product code") >= 0) { head = i; break; }
    }
    if (head < 0) return [];
    var out = [];
    for (i = head + 1; i < rows.length; i++) {
      var row = rows[i] || [];
      var code = String(row[1] || "").trim();
      var desc = String(row[3] || row[2] || "").trim();
      if (!code && !desc) continue;
      out.push({
        code: code, family: String(row[2] || "").trim(), desc: desc,
        cat: String(row[4] || "").trim(), unit: String(row[5] || "").trim(),
        price: num(row[6]), brand: String(row[8] || "").trim(),
        pic: driveImg(row[10]), specs: String(row[11] || "").trim(),
        label: (code ? code + " - " : "") + desc
      });
    }
    return out;
  }
  function loadCatalog() {
    try {
      var c = JSON.parse(localStorage.getItem(CAT_KEY) || "null");
      if (c && c.v === CAT_V && c.items && c.items.length) PRODUCTS = c.items;
    } catch (e) {}
    var fresh = false;
    try {
      var c2 = JSON.parse(localStorage.getItem(CAT_KEY) || "null");
      fresh = !!(c2 && c2.at && (Date.now() - c2.at < 86400000));
    } catch (e) {}
    if (fresh && PRODUCTS.length) return Promise.resolve(PRODUCTS);   /* 222 KB not worth re-reading */
    return fetch(GAS + "?action=catalog", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        var items = parseCatalog(rows);
        if (items.length) {
          PRODUCTS = items;
          try { localStorage.setItem(CAT_KEY, JSON.stringify({ v: CAT_V, at: Date.now(), items: items })); } catch (e) {}
        }
        return PRODUCTS;
      })
      .catch(function () { return PRODUCTS; });
  }

  /* ---------- who may do what ---------- */
  var ALLOWED = ["admin","accounts","godown"];
  function canMake()    { return ["admin","accounts","godown"].indexOf(S.role) >= 0; }
  /* the owner's rule: the man who makes it is not the man who passes it */
  function canApprove() { return ["admin","accounts"].indexOf(S.role) >= 0; }
  /* v1.3 - and the signed paper is filed by the office, not by the man who loaded the
     lorry. A receipt is the proof that settles an argument; it should not be attachable
     by the person it would exonerate. */
  function canProof()   { return ["admin","accounts"].indexOf(S.role) >= 0; }

  /* ---------- WHERE THE CLIENT IS ----------
     District first, then the area inside it, then his name. That is how the godown thinks
     about a delivery - which town, which colony, which man - and it turns a list of 118
     names into three short taps. A client with no area still has a home: "(area not set)",
     so nobody is unreachable because a field was left blank. */
  var NO_AREA = "(area not set)";
  function districts() {
    var m = {};
    clients().forEach(function (c) {
      var d = String(c.location || "").trim();
      if (d) m[d] = (m[d] || 0) + 1;
    });
    return Object.keys(m).sort().map(function (k) { return { name: k, n: m[k] }; });
  }
  function areasIn(dist) {
    var m = {};
    clients().forEach(function (c) {
      if (dist && String(c.location || "").trim() !== dist) return;
      var a = String(c.area || "").trim() || NO_AREA;
      m[a] = (m[a] || 0) + 1;
    });
    return Object.keys(m).sort(function (a, b) {
      if (a === NO_AREA) return 1;
      if (b === NO_AREA) return -1;
      return a.localeCompare(b);
    }).map(function (k) { return { name: k, n: m[k] }; });
  }
  function clientsIn(dist, area, q) {
    var qq = lower(q || "");
    return clients().filter(function (c) {
      if (dist && String(c.location || "").trim() !== dist) return false;
      if (area) {
        var a = String(c.area || "").trim() || NO_AREA;
        if (a !== area) return false;
      }
      if (!qq) return true;
      /* initials as well as the start of the name: "rk" finds "Rakesh - Ansal I Block" */
      var nm = lower(c.name);
      if (nm.indexOf(qq) >= 0) return true;
      var initials = nm.split(/[^a-z0-9]+/).filter(Boolean).map(function (w) { return w[0]; }).join("");
      return initials.indexOf(qq) === 0;
    }).sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
  }

  /* ---------- the book, read ---------- */
  function clients() { return (S.data && S.data.clients) || []; }
  function clientByName(n) {
    var k = lower(n);
    return clients().filter(function (c) { return lower(c.name) === k; })[0] || null;
  }
  function challans() { return (S.data && S.data.challans) || []; }
  function returns()  { return (S.data && S.data.returns) || []; }
  function sitesFor(n) {
    var k = lower(n);
    return ((S.data && S.data.sites) || []).filter(function (s) { return lower(s.client) === k; });
  }
  function chStatus(c) { return String((c && c.status) || "Draft"); }
  function isDraft(c)  { return chStatus(c) === "Draft"; }

  /* ---------- HOW FAR BACK THE SCREENS LOOK ----------
     v1.1 - The working screens show the last 60 days. That is not a limit on the book: every
     challan ever made is still here, reachable by name, by challan number or by book number
     from the search box, and a "show everything" button appears the moment something older
     than 60 days is actually waiting. It exists so that in two years the godown is not
     scrolling past a thousand settled deliveries to find this morning's.
     Today the whole book is 81 challans over 24 days, so the button will not even appear. */
  var WINDOW_DAYS = 60;
  function ageDays(c) {
    var t = Date.parse(d10(c && c.createdAt) + "T00:00:00Z");
    return isFinite(t) ? Math.round((Date.now() - t) / 86400000) : 0;
  }
  function recent(c) { return S.allTime || ageDays(c) <= WINDOW_DAYS; }
  function newestFirst(list) {
    return list.slice().sort(function (a, b) {
      return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
    });
  }
  function pendingApproval(all) {
    return newestFirst(challans().filter(function (c) { return isDraft(c) && (all || recent(c)); }));
  }
  /* how many are being held back by the window, so the button can say so honestly */
  function olderCount(list) {
    if (S.allTime) return 0;
    return list.filter(function (c) { return ageDays(c) > WINDOW_DAYS; }).length;
  }
  function showAllBar(n, what) {
    if (!n) return "";
    return '<div class="row" style="margin:8px 2px">' +
      '<button class="btn sm gry" data-act="alltime">Show everything &mdash; ' + n + ' older ' + what + '</button>' +
      '</div>';
  }

  /* ---------- WHOSE CLIENT IS IT ----------
     v1.3 - challans grouped by the sales executive the CLIENT belongs to, not by whoever
     typed the challan. Every challan on this book was typed by one man, so grouping by the
     typist put all 81 in one heap; grouping by whose client it is is the split that means
     something - it is how the CRM reads the book, and how the owner asks about it.
     The bands remember what was left open, so a man who works one executive's deliveries
     is not re-opening the same band every morning. */
  function execOf(c) {
    var cl = clientByName(c && c.customerName);
    return String((cl && (cl.ownedBy || cl.createdBy)) || "").trim() || "Unassigned";
  }
  var OPEN_KEY = "ew_challan_openbands";
  function bandsOpen() {
    try { return JSON.parse(localStorage.getItem(OPEN_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function bandIsOpen(name) {
    var m = bandsOpen();
    /* first time through, everything is open - nobody should have to discover a tap */
    return m[name] === undefined ? true : !!m[name];
  }
  function bandToggle(name) {
    var m = bandsOpen();
    m[name] = !bandIsOpen(name);
    try { localStorage.setItem(OPEN_KEY, JSON.stringify(m)); } catch (e) {}
  }
  function byExec(list) {
    var g = {}, order = [];
    list.forEach(function (c) {
      var e = execOf(c);
      if (!g[e]) { g[e] = []; order.push(e); }
      g[e].push(c);
    });
    return order.sort(function (a, b) {
      var va = g[b].reduce(function (x, c) { return x + chValue(c); }, 0);
      var vb = g[a].reduce(function (x, c) { return x + chValue(c); }, 0);
      return va - vb;
    }).map(function (e) { return { name: e, list: g[e] }; });
  }

  /* ---------- FINDING AN OLD ONE ----------
     By client, by our challan number, or by the number written in the paper book - which is
     the one the godown actually remembers. Searching always looks at the whole book, however
     far back it goes, and ignores the 60-day window entirely. */
  function searchHits() {
    var q = lower(S.q || "");
    if (!q) return null;
    return newestFirst(challans().filter(function (c) {
      return lower(c.customerName).indexOf(q) >= 0 ||
             lower(c.challanNo).indexOf(q) >= 0 ||
             lower(c.site).indexOf(q) >= 0 ||
             lower(manualNoFor(c)).indexOf(q) >= 0;
    }));
  }

  /* the client's frozen brand discount, read the CRM's way */
  function discRowsFor(client, brand) {
    var ck = lower(client), bk = lower(brand);
    return ((S.data && S.data.discounts) || []).filter(function (d) {
      return lower(d.client) === ck && (!bk || lower(d.brand) === bk || !String(d.brand || "").trim());
    });
  }
  function clientDiscount(client, brand) {
    var rows = discRowsFor(client, brand);
    /* an exact brand row beats a blank-brand catch-all, the same order the CRM picks in */
    var exact = rows.filter(function (d) { return lower(d.brand) === lower(brand); })[0];
    var d = exact || rows[0];
    return d ? num(d.pct) : 0;
  }
  function realBrand(p) {
    var m = ((S.data && S.data.brandmap) || []).filter(function (x) { return String(x.catalogValue) === String(p.brand); })[0];
    return (m && m.brand) ? m.brand : "";
  }

  /* ---------- the paper book's own number ----------
     Append-only audit rows, the same channel the CRM writes to, so a number entered
     here shows on the challan and in HISAB there. Newest row wins; nothing is ever
     overwritten, so a correction keeps the history of what was written before. */
  var _mnCache = null;
  function manualNoMap() {
    if (_mnCache) return _mnCache;
    var m = {};
    ((S.data && S.data.audit) || []).forEach(function (r) {
      if (!r || String(r.action || "") !== "challan:manualno") return;
      var d = {};
      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }
      var k = String(d.challanNo || d.chNo || "").trim();
      var at = String(r.createdAt || "");
      if (!k) return;
      if (!m[k] || at >= m[k].at) m[k] = { at: at, no: String(d.no || d.manualNo || "").trim() };
    });
    _mnCache = m;
    return m;
  }
  function manualNoFor(c) {
    var hit = manualNoMap()[String((c && c.challanNo) || "").trim()];
    return hit ? hit.no : "";
  }
  function saveManualNo(chNo, chId, no, client) {
    _mnCache = null;
    return saveRow("audit", {
      id: "MN-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
      createdAt: new Date().toISOString(), actor: S.user || "",
      action: "challan:manualno", target: String(chNo || ""),
      detail: JSON.stringify({ challanNo: String(chNo || ""), challanId: String(chId || ""),
                               no: String(no || ""), client: String(client || ""), by: S.user || "" })
    });
  }

  /* ---------- the signed receipt ----------
     Same audit channel the CRM's delivery proofs already use, so a photo attached in the
     godown appears on the same challan in the CRM's HISAB with no server change at all. */
  /* THE KEY IS chId, NOT THE CHALLAN NUMBER. This is the CRM's own convention and it must
     be matched exactly, or a receipt attached in the godown would be invisible in HISAB and
     the CRM's proofs would be invisible here. A return is keyed the same way, by its own row
     id, which is why one action covers both. */
  var _proofCache = null;
  function proofMap() {
    if (_proofCache) return _proofCache;
    var m = {};
    ((S.data && S.data.audit) || []).forEach(function (r) {
      if (!r || String(r.action || "") !== "challan:proof") return;
      var d = {};
      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }
      if (!d.chId) return;
      var prev = m[d.chId];
      if (!prev || String(r.createdAt || "") >= String(prev.at || "")) {
        m[d.chId] = { at: r.createdAt || "", by: d.by || "", url: d.url || "",
                      actor: r.actor || "", photo: !!d.photo, thumb: String(d.thumb || "") };
      }
    });
    _proofCache = m;
    return m;
  }
  function proofFor(rec) {
    var id = (rec && rec.id) ? rec.id : rec;
    return proofMap()[String(id || "").trim()] || null;
  }
  function saveProof(rec, url, thumb) {
    _proofCache = null;
    var isRet = !!rec.returnNo;
    var no = String(rec.challanNo || rec.returnNo || "");
    return saveRow("audit", {
      id: "PF-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
      createdAt: new Date().toISOString(), actor: S.user || "",
      action: "challan:proof",
      target: no + " / " + String(rec.customerName || ""),
      detail: JSON.stringify({
        chId: String(rec.id || ""), no: no, client: String(rec.customerName || ""),
        site: String(rec.site || ""), by: S.user || "", geo: "", url: String(url || ""),
        at: new Date().toISOString(), photo: true, sig: false,
        thumb: String(thumb || ""), kind: isRet ? "return" : "challan"
      }), ip: ""
    });
  }
  /* Deliveries with nothing signed against them. This is the list that stops an argument
     three months later, so it is a screen of its own rather than a footnote. */
  function missingReceipts() {
    return challans().filter(function (c) {
      return String(c.receiptReceived || "").toUpperCase() !== "Y" && !proofFor(c);
    }).sort(function (a, b) { return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  }

  function bust() { _mnCache = null; _proofCache = null; }

  function chLines(c) {
    try { var l = JSON.parse((c && c.itemsJson) || "[]"); return Array.isArray(l) ? l : []; } catch (e) { return []; }
  }
  function chValue(c) {
    return chLines(c).reduce(function (a, l) {
      var d = num(l.disc);
      return a + num(l.qty) * Math.round(num(l.rate) * (1 - d / 100));
    }, 0) + (String(c.freightTo) === "Client" ? num(c.freight) : 0);
  }
  /* ================= THE PRODUCT PICKER =================
     One level at a time, exactly as the CRM does it, because that is what the godown
     already knows: BRAND, then that brand's CATEGORY, then the products with their
     picture and a +/- stepper. The picture is there to stop the wrong 110 mm fitting
     going on the lorry; it never reaches the printed challan.
     Tap a crumb to go back up a level. */

  function brandsInStock() {
    var live = {};
    PRODUCTS.forEach(function (p) { var b = realBrand(p) || String(p.brand || "").trim(); if (b) live[b] = (live[b] || 0) + 1; });
    return Object.keys(live).sort().map(function (b) { return { name: b, n: live[b] }; });
  }
  function brandOf(p) { return realBrand(p) || String(p.brand || "").trim(); }
  function catsIn(brand) {
    var m = {};
    PRODUCTS.forEach(function (p) {
      if (brandOf(p) !== brand) return;
      var c = String(p.cat || "").trim() || "Other";
      m[c] = (m[c] || 0) + 1;
    });
    return Object.keys(m).sort().map(function (c) { return { name: c, n: m[c] }; });
  }
  function prodsIn(brand, cat) {
    return PRODUCTS.filter(function (p) {
      return brandOf(p) === brand && (String(p.cat || "").trim() || "Other") === cat;
    }).sort(function (a, b) { return String(a.desc).localeCompare(String(b.desc)); });
  }

  /* the basket the picker is filling - the challan builder or the return builder */
  function basket() { return S.pick && S.pick.into === "rt" ? (S.rt && S.rt.items) : (S.ch && S.ch.items); }
  function qtyOf(code) {
    var b = basket() || [];
    var hit = b.filter(function (l) { return l.code === code; })[0];
    return hit ? num(hit.qty) : 0;
  }

  function pickerHtml() {
    var p = S.pick || {};
    var h = '<div class="crumb">' +
      '<span class="c" data-act="pk-lvl" data-l="brand">Brand' + (p.brand ? ': ' + esc(p.brand) : '') + '</span>' +
      (p.brand ? '<span class="c" data-act="pk-lvl" data-l="cat">Category' + (p.cat ? ': ' + esc(p.cat) : '') + '</span>' : '') +
      '</div>';

    if (!p.brand) {
      var bl = brandsInStock();
      if (!bl.length) return h + '<div class="empty">The catalogue has not loaded yet. Pull the latest and try again.</div>';
      h += bl.map(function (b) {
        return '<button class="tile" data-act="pk-brand" data-b="' + esc(b.name) + '">' +
          '<div class="grow">' + esc(b.name) + '<span class="sub">' + b.n + ' product' + (b.n === 1 ? '' : 's') + '</span></div>' +
          '<span class="pill">&#8250;</span></button>';
      }).join("");
      return h;
    }
    if (!p.cat) {
      h += catsIn(p.brand).map(function (c) {
        return '<button class="tile" data-act="pk-cat" data-c="' + esc(c.name) + '">' +
          '<div class="grow">' + esc(c.name) + '<span class="sub">' + c.n + ' product' + (c.n === 1 ? '' : 's') + '</span></div>' +
          '<span class="pill">&#8250;</span></button>';
      }).join("");
      return h;
    }
    var list = prodsIn(p.brand, p.cat);
    var q = lower(p.q || "");
    if (q) list = list.filter(function (x) { return lower(x.label).indexOf(q) >= 0; });
    h += '<div class="row" style="margin-bottom:8px"><input id="pk_q" class="grow" placeholder="Narrow this list…" value="' + esc(p.q || "") + '"/></div>';
    if (!list.length) return h + '<div class="empty">Nothing here by that name.</div>';
    h += list.map(function (x) {
      var have = qtyOf(x.code);
      return '<div class="card" style="padding:9px 11px;margin:7px 0">' +
        '<div class="row">' +
          (x.pic ? '<img src="' + esc(x.pic) + '" alt="" style="width:46px;height:46px;object-fit:contain;border-radius:8px;background:#f8fafc"/>' : '') +
          '<div class="grow">' +
            '<div style="font-weight:800;font-size:14px">' + esc(x.desc) + '</div>' +
            '<div class="muted">' + esc(x.code) + (x.unit ? ' · ' + esc(x.unit) : '') + ' · ' + money(x.price) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="step" style="margin-top:8px">' +
          '<button data-act="pk-minus" data-code="' + esc(x.code) + '">&minus;</button>' +
          '<input class="pk-qty" data-code="' + esc(x.code) + '" inputmode="decimal" value="' + (have || "") + '" placeholder="0"/>' +
          '<button data-act="pk-plus" data-code="' + esc(x.code) + '">+</button>' +
          (have ? '<span class="pill grn" style="margin-left:6px">in the challan</span>' : '') +
        '</div></div>';
    }).join("");
    return h;
  }

  function sheetPicker() {
    var n = (basket() || []).length;
    return '<h2>Add material</h2>' +
      '<div class="muted" style="margin-bottom:10px">' + n + ' line' + (n === 1 ? '' : 's') + ' so far. Set a quantity and it is in — no separate Add button.</div>' +
      '<div id="pk_body">' + pickerHtml() + '</div>' +
      '<div class="acts" style="margin-top:14px"><button class="btn full" data-act="close">Done</button></div>';
  }

  /* Setting a quantity IS adding the line - there is no second button to forget. A
     quantity of zero takes it out again. */
  function setQty(code, q) {
    var into = S.pick && S.pick.into === "rt" ? "rt" : "ch";
    var holder = into === "rt" ? S.rt : S.ch;
    if (!holder) return;
    holder.items = holder.items || [];
    var prod = PRODUCTS.filter(function (x) { return x.code === code; })[0];
    if (!prod) return;
    var qn = num(q);
    var i, hit = -1;
    for (i = 0; i < holder.items.length; i++) if (holder.items[i].code === code) { hit = i; break; }
    if (qn <= 0) { if (hit >= 0) holder.items.splice(hit, 1); return; }
    var line = { code: prod.code, desc: prod.desc, unit: prod.unit, qty: qn, rate: prod.price,
                 brand: brandOf(prod), disc: "" };
    if (hit >= 0) holder.items[hit] = Object.assign({}, holder.items[hit], { qty: qn }); else holder.items.push(line);
  }
  /* ================= SCREENS ================= */

  function renderLogin(err) {
    el("root").innerHTML =
      '<div class="login"><h1>Energy World</h1><p>Challan &amp; material return</p>' +
      (err ? '<div class="pill red" style="display:block;text-align:center;padding:8px;margin-bottom:10px">' + esc(err) + '</div>' : '') +
      (bioSaved()
        ? '<button class="btn full" data-act="bio-go" style="margin-bottom:6px">&#128274; Unlock with Face ID / fingerprint</button>' +
          '<div class="muted" style="text-align:center;margin-bottom:14px">or sign in with your PIN</div>'
        : '') +
      '<label>Your name</label><input id="ln" autocomplete="username" placeholder="e.g. Gautam" value="' + esc(S.user) + '"/>' +
      '<label>Your PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Your Team CRM PIN"/>' +
      '<div style="height:16px"></div>' +
      '<button class="btn full" data-act="login">Sign in</button>' +
      '<div class="muted" style="text-align:center;margin-top:14px">The same name and PIN as the Team CRM.<br>v' + APP_VERSION + '</div></div>';
    var lp = el("lp");
    if (lp) lp.addEventListener("keyup", function (e) { if (e.key === "Enter") doLogin(); });
  }

  function header() {
    var n = S.busy ? "syncing…" : (S.syncAt ? "updated " + new Date(S.syncAt).toTimeString().slice(0,5) : "");
    return '<div class="top"><div class="t1">' +
      '<h1>Challan</h1>' +
      '<div style="text-align:right"><div class="who">' + esc(S.user) + ' · ' + esc(S.role) +
        (canApprove() ? '' : ' · makes, does not approve') + '</div>' +
      '<div class="sync">' + esc(n) + '</div></div>' +
      '<button class="btn sm ghost" data-act="refresh" title="Pull the latest">&#8635;</button>' +
      '<button class="btn sm ghost" data-act="account" title="This phone">&#9776;</button>' +
      '</div></div>';
  }

  /* The one box that reaches the whole book, on every screen. A godown remembers the number
     written in the paper book, not ours - so it searches that too. */
  function searchBox() {
    return '<div class="row" style="margin:2px 0 10px">' +
      '<input id="q" class="grow" placeholder="Find any challan \u2014 client, challan no, book no\u2026" value="' + esc(S.q || "") + '"/>' +
      (S.q ? '<button class="btn sm gry" data-act="qclear">Clear</button>' : '') + '</div>';
  }
  function viewSearch() {
    var list = searchHits();
    var h = searchBox();
    if (!list.length) {
      return h + '<div class="empty">Nothing by that name or number.<br>' +
        'This searches every challan ever made, not just the last sixty days.</div>';
    }
    h += '<div class="muted" style="margin:0 2px 6px">' + list.length + ' match' + (list.length === 1 ? '' : 'es') +
      ' \u2014 searched the whole book, however far back it goes</div>';
    return h + list.map(chRow).join("");
  }

  /* ---------- 1. THE DELIVERY BOOK ----------
     v1.2 - THIS SCREEN IS THE BOOK, NOT A GLANCE AT IT.
     It used to open with a strip headed "the last few you made": six challans, and only the
     ones the man signed in had created himself. It was meant as a "did my last one save?"
     check. But it is the first thing on the main screen, so of course it reads as THE LIST -
     and on a book of 81 challans, all made by one man, it showed six of them and looked as
     though the rest had gone. That is the whole complaint and it was a fair one.
     It now shows every challan, everyone's, newest first, with chips to narrow it. */
  var CH_FILTERS = [
    ["all",     "All"],
    ["draft",   "Not passed"],
    ["noproof", "No receipt"],
    ["mine",    "Mine"]
  ];
  function chFiltered(kind) {
    var list = challans().filter(recent);
    if (kind === "draft")   return list.filter(isDraft);
    if (kind === "noproof") return list.filter(function (c) {
      return String(c.receiptReceived || "").toUpperCase() !== "Y" && !proofFor(c);
    });
    if (kind === "mine")    return list.filter(function (c) { return lower(c.createdBy) === lower(S.user); });
    return list;
  }
  function chChips() {
    var f = S.chFilter || "all";
    return '<div class="row" style="flex-wrap:wrap;gap:6px;margin:2px 0 8px">' +
      CH_FILTERS.map(function (b) {
        var n = chFiltered(b[0]).length;
        if (!n && b[0] !== "all") return "";
        return '<button class="btn sm ' + (f === b[0] ? '' : 'gry') + '" data-act="ch-filter" data-f="' + b[0] + '">' +
          esc(b[1]) + ' <b style="opacity:.75">' + n + '</b></button>';
      }).join("") + '</div>';
  }

  /* Challans laid out executive by executive, each band openable. One place builds it, so
     the delivery book, the approval queue and the receipts list all read the same way. */
  function execBands(list) {
    var groups = byExec(list);
    if (groups.length < 2) return list.map(chRow).join("");
    return groups.map(function (g) {
      var open = bandIsOpen(g.name);
      var val = g.list.reduce(function (a, c) { return a + chValue(c); }, 0);
      var noRc = g.list.filter(function (c) {
        return String(c.receiptReceived || "").toUpperCase() !== "Y" && !proofFor(c);
      }).length;
      var draft = g.list.filter(isDraft).length;
      return '<div class="exec" data-act="band" data-n="' + esc(g.name) + '">' +
          '<span class="car">' + (open ? '&#9662;' : '&#9656;') + '</span>' +
          '<div class="grow">' + esc(g.name) +
            '<div style="font-size:11.5px;font-weight:600;opacity:.9">' +
              g.list.length + ' challan' + (g.list.length === 1 ? '' : 's') + ' · ' + money(val) +
              (draft ? ' · ' + draft + ' not passed' : '') +
              (noRc ? ' · ' + noRc + ' no receipt' : '') +
            '</div></div>' +
          '<span class="sub">' + (open ? 'hide' : 'show') + '</span>' +
        '</div>' +
        (open ? g.list.map(chRow).join("") : '');
    }).join("");
  }

  /* ---------- WHO IS IT FOR ----------
     v1.3 - district, then area, then the name. A free-text box over 118 clients meant
     spelling a man's name exactly as somebody else once typed it; this asks the two
     questions the godown already knows the answer to and leaves a handful of names. */
  function clientPicker(z, cl) {
    if (cl && cl.name) {
      var st = sitesFor(cl.name);
      return '<div class="card">' +
        '<div class="row"><div class="grow">' +
          '<div class="muted" style="font-weight:700">Client</div>' +
          '<div style="font-size:17px;font-weight:800;margin-top:1px">' + esc(cl.name) + '</div>' +
          '<div class="muted" style="margin-top:3px">' +
            esc([cl.location, cl.area].filter(Boolean).join(" · ")) +
            (cl.mobile ? ' · ' + esc(cl.mobile) : ' · <b style="color:#b91c1c">no mobile on his record</b>') +
            (cl.plumber ? '<br>PL ' + esc(cl.plumber) : '') +
            (cl.architect ? (cl.plumber ? ' · ' : '<br>') + 'AR ' + esc(cl.architect) : '') +
          '</div>' +
        '</div><button class="btn sm gry" data-act="cp-change">Change</button></div>' +
        '<label>Site</label>' +
        '<input id="m_site" list="st_list" placeholder="' +
          (st.length ? 'Pick his site, or type a new one' : 'Which site is it going to?') + '" value="' + esc(z.site || "") + '"/>' +
        '<datalist id="st_list">' + st.map(function (x) { return '<option value="' + esc(x.name) + '"></option>'; }).join("") + '</datalist>' +
        (st.length ? '<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:7px">' +
          st.slice(0, 6).map(function (x) {
            return '<button class="btn sm ' + (z.site === x.name ? '' : 'gry') + '" data-act="cp-site" data-s="' + esc(x.name) + '">' + esc(x.name) + '</button>';
          }).join("") + '</div>' : '') +
        '</div>';
    }

    var h2 = '<div class="card"><div class="muted" style="font-weight:700;margin-bottom:6px">Who is it for?</div>';
    var ds = districts();
    h2 += '<div class="muted" style="font-size:11.5px;margin-bottom:4px">1 · District</div>' +
      '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:10px">' +
      ds.map(function (d) {
        return '<button class="btn sm ' + (z.dist === d.name ? '' : 'gry') + '" data-act="cp-dist" data-d="' + esc(d.name) + '">' +
          esc(d.name) + ' <b style="opacity:.7">' + d.n + '</b></button>';
      }).join("") + '</div>';

    if (!z.dist) return h2 + '<div class="muted">Pick the district and the areas will follow.</div></div>';

    var as = areasIn(z.dist);
    h2 += '<div class="muted" style="font-size:11.5px;margin-bottom:4px">2 · Area in ' + esc(z.dist) + '</div>' +
      '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:10px">' +
      '<button class="btn sm ' + (z.area ? 'gry' : '') + '" data-act="cp-area" data-a="">All of ' + esc(z.dist) + '</button>' +
      as.map(function (a) {
        return '<button class="btn sm ' + (z.area === a.name ? '' : 'gry') + '" data-act="cp-area" data-a="' + esc(a.name) + '">' +
          esc(a.name) + ' <b style="opacity:.7">' + a.n + '</b></button>';
      }).join("") + '</div>';

    var list = clientsIn(z.dist, z.area, z.cq);
    h2 += '<div class="muted" style="font-size:11.5px;margin-bottom:4px">3 · His name &mdash; type the first letters</div>' +
      '<input id="m_cq" placeholder="e.g. rak, or rk for Rakesh Kumar" value="' + esc(z.cq || "") + '"/>';
    if (!list.length) {
      h2 += '<div class="empty" style="padding:14px 8px">Nobody here by that name.<br>' +
        'A new man has to be registered in the CRM first, so his discount is set before his first delivery.</div>';
    } else {
      h2 += '<div style="margin-top:8px">' + list.slice(0, 40).map(function (c) {
        return '<button class="tile" data-act="cp-pick" data-n="' + esc(c.name) + '">' +
          '<div class="grow">' + esc(c.name) +
          '<span class="sub">' + esc([c.area, c.mobile].filter(Boolean).join(" · ") || "no area, no mobile") + '</span></div>' +
          '<span class="pill">&#8250;</span></button>';
      }).join("") +
      (list.length > 40 ? '<div class="muted">and ' + (list.length - 40) + ' more &mdash; type another letter</div>' : '') +
      '</div>';
    }
    return h2 + '</div>';
  }

  function viewMake() {
    var z = S.ch;
    if (!z) {
      var f = S.chFilter || "all";
      var list = newestFirst(chFiltered(f));
      var hidden = olderCount(challans());
      var h = '<div class="card" style="background:#0f766e;color:#fff;border-color:#0f766e">' +
        '<div style="font-size:17px;font-weight:800">Send material out</div>' +
        '<div style="font-size:12.5px;opacity:.9;margin-top:3px">Pick the client, add the material, write the book number. It saves as a <b>draft</b> — the accounts desk passes it before it counts against his account.</div></div>' +
        '<button class="btn full" data-act="ch-new" style="margin:12px 0">+ New challan</button>' +
        searchBox() + statBar() + chChips();
      if (!list.length) {

  /* ---------- THE DRIVER, AND HIS LORRY ----------
     v1.4 - the owner's rule: if it is already on the book, it is picked, not typed. A driver
     typed as free text can never be totalled, so freight per driver becomes guesswork, and
     "Ramesh", "ramesh" and "Ramesh ji" become three men. Picking him fills in his vehicle and
     his mobile from his own record. The lorry can still be overridden for the day he is in a
     different one - that is a real thing that happens - but it starts from his own. */
  function driverPicker(z, pfx) {
    var p = pfx || "m";
    var list = ((S.data && S.data.drivers) || []).filter(function (d) { return String(d.name || "").trim(); });

        'add them in the CRM once and they will be here to pick from.</div>';

    h += '<div class="row" style="flex-wrap:wrap;gap:6px">' +
      list.map(function (d) {
        return '<button class="btn sm ' + (lower(d.name) === lower(z.driver) ? '' : 'gry') +
          '" data-act="dv-pick" data-p="' + p + '" data-n="' + esc(d.name) + '">' + esc(d.name) + '</button>';

  /* ================= THE CHALLAN ON PAPER =================
     A delivery document, not a quotation: no prices and no pictures. Prices live in the
     ledger, not in the driver's hand. This mirrors the CRM's own challan print. */

  function chalPdf(c) {
    return ensurePdf().then(function () {
      var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
      var W = 210, L = 14, R = W - 14;
      var F = function (w) { doc.setFont("helvetica", w === "bold" ? "bold" : "normal"); };

      doc.setFillColor(15, 118, 110); doc.rect(0, 0, W, 26, "F");
      doc.setTextColor(255); F("bold"); doc.setFontSize(15);
      doc.text("ENERGY WORLD", L, 12);
      F(); doc.setFontSize(8.5);
      doc.text("Panipat  |  Sonipat  |  Karnal", L, 18);
      F("bold"); doc.setFontSize(12);
      doc.text("DELIVERY CHALLAN", R, 12, { align: "right" });
      F(); doc.setFontSize(9);
      doc.text(String(c.challanNo || ""), R, 18, { align: "right" });

      doc.setTextColor(15, 23, 42);
      var y = 36;
      var mn = manualNoFor(c);
      var fact = function (k, v, bold) {
        F(); doc.setFontSize(8); doc.setTextColor(100, 116, 139);
        doc.text(String(k).toUpperCase(), L, y);
        doc.setTextColor(15, 23, 42); F(bold ? "bold" : "normal"); doc.setFontSize(10.5);
        doc.text(String(v == null || v === "" ? "-" : v), L + 42, y);
        y += 7;
      };
      fact("Client", c.customerName, 1);
      if (c.site) fact("Site", c.site);
      fact("Date", dstr(d10(c.createdAt)));
      if (mn) fact("Book no", mn, 1);
      if (c.driver) fact("Driver", String(c.driver) + (c.vehicle ? " / " + c.vehicle : ""));
      fact("Status", chStatus(c));

      y += 3;
      doc.setDrawColor(226, 232, 240); doc.line(L, y, R, y); y += 7;
      F("bold"); doc.setFontSize(9); doc.setTextColor(100, 116, 139);
      doc.text("MATERIAL", L, y);
      doc.text("QTY", R - 22, y, { align: "right" });
      doc.text("UNIT", R, y, { align: "right" });
      y += 3; doc.line(L, y, R, y); y += 6;
      doc.setTextColor(15, 23, 42);

      chLines(c).forEach(function (l) {
        if (y > 262) { doc.addPage(); y = 22; }
        F(); doc.setFontSize(10);
        var name = doc.splitTextToSize(String(l.desc || l.code || ""), R - L - 46);
        doc.text(name, L, y);
        F("bold");
        doc.text(String(num(l.qty)), R - 22, y, { align: "right" });
        F(); doc.setFontSize(9);
        doc.text(String(l.unit || ""), R, y, { align: "right" });
        doc.setFontSize(7.5); doc.setTextColor(148, 163, 184);
        doc.text(String(l.code || ""), L, y + 3.6);
        doc.setTextColor(15, 23, 42);
        y += Math.max(9, name.length * 4.6 + 4.6);
      });

      if (y > 232) { doc.addPage(); y = 22; }
      y += 6; doc.setDrawColor(226, 232, 240); doc.line(L, y, R, y); y += 8;
      F(); doc.setFontSize(8.5); doc.setTextColor(100, 116, 139);
      doc.text("Received the above material in good order and condition.", L, y);
      y += 20;
      doc.setDrawColor(148, 163, 184);
      doc.line(L, y, L + 60, y); doc.line(R - 60, y, R, y);
      doc.setFontSize(8);
      doc.text("Receiver's signature", L, y + 4.5);
      doc.text("For Energy World", R - 60, y + 4.5);
      return doc;
    });
  }

  function chalFile(c) { return String(c.challanNo || "challan").replace(/[^\w.-]+/g, "_") + ".pdf"; }

  function downloadChalan(no) {
    var c = challans().filter(function (x) { return String(x.challanNo) === String(no); })[0];
    if (!c) return;
    toast("Building…");
    chalPdf(c).then(function (doc) { doc.save(chalFile(c)); })
      .catch(function () { toast("Could not build it — check your signal and try once more."); });
  }

        'padding:11px 12px;font-size:12.5px;max-height:200px;overflow:auto">' + esc(chalText(c)) + '</div>' +

  function chalText(c) {

  function waSendChalan(no) {

      });

  /* ================= THE SIGNED RECEIPT =================
     Photograph the signed paper, shrink it so it goes up on one bar of signal, wrap it in a
     one-page PDF and file it against the record. The audit row is written in the CRM's own
     shape, keyed by the record's id, so the same receipt appears on the same challan in
     HISAB with no server change at all. */
  function shrink(dataUrl, maxPx, quality) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, m = Math.max(w, h);
        if (m > maxPx) { w = Math.round(w * maxPx / m); h = Math.round(h * maxPx / m); }
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        res({ url: cv.toDataURL("image/jpeg", quality || 0.72), w: w, h: h });
      };
      img.onerror = function () { rej(new Error("bad image")); };
      img.src = dataUrl;
    });
  }

  function attachReceipt(rec, dataUrl) {
    toast("Filing the receipt…");
    return shrink(dataUrl, 1600, 0.72).then(function (big) {
      return shrink(dataUrl, 220, 0.55).then(function (small) {
        return ensurePdf().then(function () {
          var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
          var W = 210, L = 12, no = String(rec.challanNo || rec.returnNo || "");
          doc.setFillColor(15, 118, 110); doc.rect(0, 0, W, 20, "F");
          doc.setTextColor(255); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
          doc.text("SIGNED RECEIPT — " + no, L, 13);
          doc.setTextColor(15, 23, 42); doc.setFont("helvetica", "normal"); doc.setFontSize(9);
          doc.text(String(rec.customerName || "") + (rec.site ? " · " + rec.site : ""), L, 27);
          doc.text("Photographed by " + String(S.user || "") + " on " + dstr(today()), L, 33);
          var maxW = W - L * 2, maxH = 240;
          var sc = Math.min(maxW / big.w, maxH / big.h);
          doc.addImage(big.url, "JPEG", L, 38, big.w * sc, big.h * sc);
          var b64 = doc.output("datauristring").split(",")[1];
          return api("pdfHost", { pdfBase64: b64, filename: no.replace(/[^\w.-]+/g, "_") + "_receipt.pdf" })
            .then(function (h) {
              if (!h || !h.ok || !h.url) throw new Error("host failed");
              return saveProof(rec, h.url, small.url).then(function (r) {
                if (!r || !r.ok) throw new Error("audit failed");
                (S.data.audit = S.data.audit || []).push(r.row);
                bust();
                toast("Receipt filed against " + no + ".");
                render();
              });
            });
        });
      });
    }).catch(function () {
      toast("Could not file the receipt. Nothing was changed — try again when the signal is better.");
    });
  }
  /* ================= FACE ID / FINGERPRINT =================
     The same thing the CRM and the collection app do, and the same honesty about what it
     is: the phone's own biometric unlocks a PIN that is ALREADY stored on that phone. The
     fingerprint never leaves the device. The server still authenticates with the PIN. */
  function bioAvailable() {
    return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
  }
  function bioSaved() {
    try { return JSON.parse(localStorage.getItem(BIO_KEY) || "null"); } catch (e) { return null; }
  }
  function randBytes(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
  function b64u(buf) {
    var b = new Uint8Array(buf), s2 = "";
    for (var i = 0; i < b.length; i++) s2 += String.fromCharCode(b[i]);
    return btoa(s2).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function fromB64u(str) {
    var s2 = String(str).replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(s2), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function bioEnrol() {
    if (!bioAvailable()) { toast("This phone has no Face ID or fingerprint the browser can use."); return; }
    if (!S.user || !S.pin) { toast("Sign in first, then turn it on."); return; }
    navigator.credentials.create({
      publicKey: {
        challenge: randBytes(32), rp: { name: "Energy World Challan" },
        user: { id: randBytes(16), name: S.user, displayName: S.user },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000, attestation: "none"
      }
    }).then(function (cred) {
      localStorage.setItem(BIO_KEY, JSON.stringify({ id: b64u(cred.rawId), user: S.user, pin: S.pin }));
      toast("Face ID / fingerprint enabled on this phone.");
      S.sheet = sheetAccount(); render();
    }).catch(function () { toast("Could not enable it. Your PIN still works."); });
  }
  function bioUnlock() {
    var saved = bioSaved();
    if (!saved) return;
    navigator.credentials.get({
      publicKey: { challenge: randBytes(32), allowCredentials: [{ type: "public-key", id: fromB64u(saved.id) }],
                   userVerification: "required", timeout: 60000 }
    }).then(function () {
      S.user = saved.user; S.pin = saved.pin;
      return api("teamAuth", { ua: navigator.userAgent }).then(function (r) {
        if (!r || !r.ok) {
          try { localStorage.removeItem(BIO_KEY); } catch (e) {}
          S.pin = ""; renderLogin("That saved sign-in is no longer valid. Use your PIN."); return;
        }
        S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
        if (ALLOWED.indexOf(S.role) < 0) { S.pin = ""; renderLogin("This app is for the godown and the accounts desk."); return; }
        try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: saved.pin, role: S.role })); } catch (e) {}
        pull(false);
      });
    }).catch(function () { toast("That did not match. Use your PIN."); });
  }
  function bioForget() {
    try { localStorage.removeItem(BIO_KEY); } catch (e) {}
    toast("Face ID / fingerprint removed from this phone.");
    S.sheet = sheetAccount(); render();
  }
  function signOut() {
    try { localStorage.removeItem(STORE); } catch (e) {}
    try { localStorage.removeItem(BIO_KEY); } catch (e) {}
    try { localStorage.removeItem(SNAP + "_" + S.user); } catch (e) {}
    S.user = ""; S.pin = ""; S.role = ""; S.data = null; S.sheet = null; S.ch = null; S.rt = null;
    renderLogin("Signed out on this phone.");
  }

  /* ================= PAINT AND PRESS ================= */

  function bodyHtml() {
    /* a search reaches past whichever screen you are standing on, and past the 60-day window */
    if (S.q && !S.ch && !S.rt) return viewSearch();
    if (S.tab === "return")  return viewReturn();

  function navBtn(t, icon, label, count) {

      '<b>' + icon + '</b>' + label + (count ? '<span class="cnt">' + count + '</span>' : '') + '</button>';

  function render() {
    var p = S.data ? pendingApproval().length : 0;
    var m = S.data ? missingReceipts().filter(recent).length : 0;   /* agrees with the list it opens */
    el("root").innerHTML = header() +
      '<div class="wrap">' + bodyHtml() + '</div>' +

    wireInputs();

  /* The builder is a live form: what is typed has to survive the next repaint, because a
     repaint happens every time a line is added. Everything is read back into S on input. */
  function wireInputs() {
    var keep = [["m_site","site"],["m_freight","freight"],["m_veh","veh"],
                ["m_manual","manual"],["m_cq","cq"]];
    keep.forEach(function (pair) {
      var e = el(pair[0]);
      if (!e) return;
      e.addEventListener("input", function () {
        if (!S.ch) return;
        S.ch[pair[1]] = e.value;
        /* the name list narrows as he types; nothing else needs a repaint */
        if (pair[1] === "cq") repaint();
      });
    });
    var fto = el("m_fto");
    if (fto) fto.addEventListener("change", function () { if (S.ch) S.ch.fto = fto.value; });

    [["r_client","client"],["r_site","site"],["r_ch","against"],["r_reason","reason"],
     ["r_freight","freight"]].forEach(function (pair) {
      var e = el(pair[0]);
      if (!e) return;
      e.addEventListener("input", function () { if (S.rt) S.rt[pair[1]] = e.value; });
    });

    var q = el("q");
    if (q) {
      q.addEventListener("input", function () { S.q = q.value; repaint(); });
      q.addEventListener("keyup", function (e) { if (e.key === "Enter") q.blur(); });
    }
    var pq = el("pk_q");
    if (pq) pq.addEventListener("input", function () { S.pick.q = pq.value; repaintPicker(pq); });
    Array.prototype.forEach.call(document.querySelectorAll(".pk-qty"), function (i) {
      i.addEventListener("change", function () { setQty(i.getAttribute("data-code"), i.value); repaintPicker(null); });
    });
  }

  /* repaint just the body, so the keyboard and the caret stay where they are */
  function repaint() {
    var w = document.querySelector(".wrap");
    if (!w) return render();
    var a = document.activeElement, id = a && a.id, pos = null;
    try { pos = a && a.selectionStart; } catch (e) {}
    w.innerHTML = bodyHtml();
    wireInputs();
    if (id) {
      var back = el(id);
      if (back) { back.focus(); try { back.setSelectionRange(pos, pos); } catch (e) {} }
    }
  }
  function repaintPicker(focusEl) {
    var body = el("pk_body");
    if (!body) return render();
    var v = focusEl ? focusEl.value : null, pos = null;
    try { pos = focusEl && focusEl.selectionStart; } catch (e) {}
    body.innerHTML = pickerHtml();
    wireInputs();
    if (focusEl) {
      var q = el("pk_q");
      if (q) { q.value = v; q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} }
    }
  }

  /* ---------- the hidden camera input, made once ---------- */
  var _rcTarget = null;
  function pickPhoto(rec) {
    _rcTarget = rec;
    var inp = el("rc_file");
    if (!inp) {
      inp = document.createElement("input");
      inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment";
      inp.id = "rc_file"; inp.style.display = "none";
      document.body.appendChild(inp);
      inp.addEventListener("change", function () {
        var f = inp.files && inp.files[0];
        inp.value = "";
        if (!f || !_rcTarget) return;
        var rd = new FileReader();
        rd.onload = function () { attachReceipt(_rcTarget, String(rd.result)); };
        rd.onerror = function () { toast("Could not read that photo."); };
        rd.readAsDataURL(f);
      });
    }
    inp.click();
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "close-bg" && ev.target.closest("[data-stop]")) return;

    if (act === "login")   { doLogin(); return; }
    if (act === "refresh") { pull(true); return; }
    if (act === "reboot")  { location.reload(); return; }
    if (act === "account") { S.sheet = sheetAccount(); render(); return; }
    if (act === "bio-go")  { bioUnlock(); return; }
    if (act === "bio-on")  { bioEnrol(); return; }
    if (act === "bio-off") { bioForget(); return; }
    if (act === "signout") { signOut(); return; }
    if (act === "crm")     { window.open(CRM_URL, "_blank"); return; }
    if (act === "close" || act === "close-bg") { S.sheet = null; render(); return; }
    /* tapping a tab means "show me that list", so a search left in the box is cleared */
    if (act === "tab")     { S.tab = t.getAttribute("data-t"); S.sheet = null; S.q = ""; S.allTime = false; render(); return; }
    if (act === "qclear")  { S.q = ""; render(); return; }
    if (act === "ch-filter") { S.chFilter = t.getAttribute("data-f"); render(); return; }
    if (act === "band")    { bandToggle(t.getAttribute("data-n")); render(); return; }
    if (act === "alltime") { S.allTime = true; render(); return; }

    /* ---- the challan builder ---- */
    if (act === "ch-new") {
      if (!canMake()) { toast("Making a challan is done by the godown or the office."); return; }
      S.ch = { client:"", site:"", items:[], freight:"", fto:"Energy World", driver:"", veh:"", manual:"",
               dist:"", area:"", cq:"" };
      render(); return;
    }
    /* the district -> area -> name walk */
    if (act === "cp-dist")   { S.ch.dist = t.getAttribute("data-d"); S.ch.area = ""; S.ch.cq = ""; repaint(); return; }
    if (act === "cp-area")   { S.ch.area = t.getAttribute("data-a") || ""; S.ch.cq = ""; repaint(); return; }
    if (act === "cp-pick")   { S.ch.client = t.getAttribute("data-n"); S.ch.site = ""; repaint(); return; }
    if (act === "cp-site")   { S.ch.site = t.getAttribute("data-s"); repaint(); return; }
    if (act === "cp-change") { S.ch.client = ""; S.ch.site = ""; S.ch.cq = ""; repaint(); return; }
    if (act === "dv-pick") {
      var holder = t.getAttribute("data-p") === "r" ? S.rt : S.ch;
      if (holder) { holder.driver = t.getAttribute("data-n") || ""; holder.veh = ""; }
      repaint(); return;
    }
    if (act === "ch-cancel") { S.ch = null; render(); return; }
    if (act === "ln-del")  { if (S.ch) S.ch.items.splice(Number(t.getAttribute("data-i")), 1); repaint(); return; }
    if (act === "rln-del") { if (S.rt) S.rt.items.splice(Number(t.getAttribute("data-i")), 1); repaint(); return; }

    /* ---- the picker ---- */
    if (act === "pk-open") {
      S.pick = { into: t.getAttribute("data-into"), brand:"", cat:"", q:"" };
      S.sheet = sheetPicker(); render(); return;
    }
    if (act === "pk-brand") { S.pick.brand = t.getAttribute("data-b"); S.pick.cat = ""; S.pick.q = ""; repaintPicker(null); return; }
    if (act === "pk-cat")   { S.pick.cat = t.getAttribute("data-c"); S.pick.q = ""; repaintPicker(null); return; }
    if (act === "pk-lvl") {
      var l = t.getAttribute("data-l");
      if (l === "brand") { S.pick.brand = ""; S.pick.cat = ""; } else { S.pick.cat = ""; }
      S.pick.q = ""; repaintPicker(null); return;
    }
    if (act === "pk-plus" || act === "pk-minus") {
      var code = t.getAttribute("data-code");
      var now = qtyOf(code);
      setQty(code, act === "pk-plus" ? now + 1 : Math.max(0, now - 1));
      repaintPicker(null); return;
    }

    /* ---- save the challan ----
       Same row shape, same numbering endpoint and the same frozen discount as the CRM, so a
       challan made in the godown is indistinguishable from one made at the desk. */
    if (act === "ch-save") {
      if (!canMake()) { toast("Making a challan is done by the godown or the office."); return; }
      var z = S.ch || {};
      var cObj = clientByName(z.client);
      if (!cObj) { toast("Pick the client first \u2014 district, then area, then his name."); return; }
      var lines = (z.items || []);
      if (!lines.length) { toast("Add at least one product."); return; }
      lines = lines.map(function (l) {
        var d = (l.disc != null && l.disc !== "") ? num(l.disc) : clientDiscount(cObj.name, l.brand);
        return { code:l.code, desc:l.desc, unit:l.unit, qty:num(l.qty), rate:num(l.rate), brand:l.brand, disc:d };
      });
      var amount = lines.reduce(function (a, l) { return a + l.qty * l.rate; }, 0);
      var siteObj = sitesFor(cObj.name).filter(function (s) { return s.name === z.site; })[0] || {};
      var manualV = String(z.manual || "").trim();
      /* the driver comes off his own record, so freight per driver can actually be totalled */
      var dRec = ((S.data && S.data.drivers) || []).filter(function (d) {
        return lower(d.name) === lower(z.driver);
      })[0] || {};
      t.disabled = true; t.textContent = "Creating…";
      var reset = function () { t.disabled = false; t.textContent = "Create the challan"; };

      api("challanNo", { client: cObj.shortName || cObj.name }).then(function (n) {
        var no = (n && n.challanNo) ||
          (String(cObj.name).toUpperCase().slice(0, 6) + "/" + today().slice(8) + "/001");
        var ch = {
          id: "", createdBy: S.user, challanNo: no,
          customerId: cObj.id || "", customerName: cObj.name,
          siteId: siteObj.id || "", site: z.site || "",
          brand: (lines[0] && lines[0].brand) || "", location: cObj.location || "",
          items: lines.map(function (l) { return l.desc + " x" + l.qty; }).join(", "),
          itemsJson: JSON.stringify(lines), amount: amount,
          freight: num(z.freight), freightTo: z.fto || "Energy World",
          discAmt: 0, discNote: "",
          driver: dRec.name || "", driverId: dRec.id || "", driverMobile: dRec.mobile || "",
          vehicle: z.veh || dRec.vehicle || "",
          associate: "", commissionSet: "N", status: "Draft", receiptReceived: "N"
        };
        return saveRow("challans", ch).then(function (r) {
          if (!r || !r.ok) { reset(); toast((r && r.error) || "The server refused it. Nothing was saved."); return; }
          var saved = r.row || ch;
          (S.data.challans = S.data.challans || []).push(saved);
          /* the paper book's number goes after the delivery, never before it */
          var after = function () {
            bust(); S.ch = null; S.tab = "make"; render();
            toast("Challan " + no + " created — waiting to be passed." + (manualV ? " Book no " + manualV + "." : ""));
          };
          if (!manualV) { after(); return; }
          return saveManualNo(no, saved.id || "", manualV, cObj.name).then(function (mr) {
            if (mr && mr.ok && mr.row) (S.data.audit = S.data.audit || []).push(mr.row);
            after();
          }).catch(after);
        });
      }).catch(function () {
        reset();
        toast("Could not reach the server. Nothing was saved — your challan is still on screen, press Create again.");
      });
      return;
    }

    /* ---- the return builder ---- */
    if (act === "rt-new") {
      if (!canMake()) { toast("Registering a return is done by the godown or the office."); return; }
      S.rt = { client:"", site:"", against:"", reason:"", items:[], driver:"", freight:"" };
      render(); return;
    }
    if (act === "rt-cancel") { S.rt = null; render(); return; }
    if (act === "rt-save") {
      if (!canMake()) { toast("Registering a return is done by the godown or the office."); return; }
      var rz = S.rt || {};
      var rc = clientByName(rz.client);
      if (!rc) { toast("Pick a registered client from the list."); return; }
      if (!(rz.items || []).length) { toast("Add at least one product."); return; }
      t.disabled = true; t.textContent = "Registering…";
      var rDrv = ((S.data && S.data.drivers) || []).filter(function (d) {
        return lower(d.name) === lower(rz.driver);
      })[0] || {};
      var rreset = function () { t.disabled = false; t.textContent = "Register the return"; };
      api("returnNo", { client: rc.shortName || rc.name }).then(function (n) {
        var rno = (n && n.returnNo) ||
          (String(rc.name).toUpperCase().slice(0, 6) + "/" + today().slice(8) + "/R01");
        var row = {
          id: "", createdBy: S.user, returnNo: rno,
          customerId: rc.id || "", customerName: rc.name,
          site: rz.site || "", challanNo: rz.against || "",
          itemsJson: JSON.stringify(rz.items.map(function (l) {
            return { code:l.code, desc:l.desc, unit:l.unit, qty:num(l.qty), rate:num(l.rate), brand:l.brand };
          })),
          reason: rz.reason || "", status: "Raised",
          driver: rDrv.name || "", driverMobile: rDrv.mobile || "", vehicle: rDrv.vehicle || "",
          freight: num(rz.freight), freightTo: "Energy World"
        };
        return saveRow("returns", row).then(function (r) {
          if (!r || !r.ok) { rreset(); toast((r && r.error) || "The server refused it. Nothing was saved."); return; }
          (S.data.returns = S.data.returns || []).push(r.row || row);
          bust(); S.rt = null; S.tab = "return"; render();
          toast("Return " + rno + " registered. Attach the goods-in receipt now.");
        });
      }).catch(function () { rreset(); toast("Could not reach the server. Nothing was saved."); });
      return;
    }

    /* ---- pass a challan ----
       An approval is an added stamp. What the godown wrote is never altered. */
    if (act === "ch-approve") {
      if (!canApprove()) { toast("Passing a challan is done by the accounts desk."); return; }
      var no2 = t.getAttribute("data-no");
      var c2 = challans().filter(function (x) { return String(x.challanNo) === String(no2); })[0];
      if (!c2) return;
      t.disabled = true; t.textContent = "Passing…";
      saveRow("challans", Object.assign({}, c2, {
        status: "Approved", approvedBy: S.user, approvedAt: new Date().toISOString()
      })).then(function (r) {
        if (!r || !r.ok) { t.disabled = false; t.textContent = "Pass it"; toast("The server refused it. Nothing changed."); return; }
        c2.status = "Approved"; c2.approvedBy = S.user; c2.approvedAt = new Date().toISOString();
        render(); toast(no2 + " passed.");
      }).catch(function () {
        t.disabled = false; t.textContent = "Pass it";
        toast("No signal — nothing was changed. Try again.");
      });
      return;
    }

    /* ---- printing and sending ---- */
    if (act === "ch-pdf")   { downloadChalan(t.getAttribute("data-no")); return; }
    if (act === "ch-wa")    { S.sheet = sheetSendChalan(t.getAttribute("data-no")); render(); return; }
    if (act === "ch-wa-go") { var g = t.getAttribute("data-no"); S.sheet = null; render(); waSendChalan(g); return; }

    /* ---- the signed receipt ---- */
    if (act === "rc-attach") {
      if (!canProof()) { toast("The signed receipt is filed by the office, not the godown."); return; }
      var rid = t.getAttribute("data-id");
      var rec = challans().filter(function (x) { return String(x.id) === String(rid); })[0] ||
                returns().filter(function (x) { return String(x.id) === String(rid); })[0];
      if (!rec) { toast("Could not find that record — pull the latest and try again."); return; }
      pickPhoto(rec); return;
    }
  });

  /* ================= COMING AND GOING ================= */

  function doLogin() {
    var name = val("ln"), pin = val("lp");
    if (!name) { renderLogin("Enter your name."); return; }
    if (!pin)  { renderLogin("Enter your PIN."); return; }
    S.user = name; S.pin = pin;
    api("teamAuth", { ua: navigator.userAgent }).then(function (r) {
      if (!r || !r.ok) { S.pin = ""; renderLogin((r && r.error) || "Could not sign in."); return; }
      S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
      if (ALLOWED.indexOf(S.role) < 0) {
        S.pin = ""; S.role = "";
        renderLogin("This app is for the godown and the accounts desk. Ask the owner if you need it.");
        return;
      }
      try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: pin, role: S.role })); } catch (e) {}
      pull(false);
    }).catch(function () { S.pin = ""; renderLogin("Network error. Try again."); });
  }

  function snapSave() {
    try { localStorage.setItem(SNAP + "_" + S.user, JSON.stringify({ at: Date.now(), d: S.data })); } catch (e) {}
  }
  function snapLoad() {
    try {
      var o = JSON.parse(localStorage.getItem(SNAP + "_" + S.user) || "null");
      return o && o.d ? o.d : null;
    } catch (e) { return null; }
  }

  function pull(loud) {
    var snap = snapLoad();
    if (snap && !S.data) { S.data = snap; bust(); render(); }
    S.busy = true;
    if (S.data) render();
    if (loud) toast("Pulling the latest…");
    return Promise.all([getBook(), loadCatalog()]).then(function (arr) {
      var r = arr[0];
      S.busy = false;
      if (usableBook(r)) { S.data = slimBook(r); S.syncAt = Date.now(); bust(); snapSave(); }
      else if (!S.data) { renderLogin("Could not read the book. Sign in again."); return; }
      render();
      if (loud) toast("Up to date.");
    }).catch(function () {
      S.busy = false;
      if (!S.data) { renderLogin("No signal, and nothing saved on this phone yet."); return; }
      render(); toast("No signal — showing what was last pulled onto this phone.");
    });
  }

  /* This is an app you leave constantly - you photograph a receipt, you ring the driver.
     Coming back to it pulls the book, so two men in the same godown never work from two
     different pictures of it. Never while a form is open. */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    if (!S.user || !S.data) return;
    if (S.sheet || S.ch || S.rt) return;
    if (Date.now() - (S.syncAt || 0) < 60000) return;
    pull(false);
  });

  function openingScreen(msg) {
    el("root").innerHTML = '<div class="login"><h1>Energy World</h1><p>Challan &amp; material return</p>' +
      '<div class="empty" id="opmsg">' + esc(msg || "Opening…") + '</div><div id="opretry"></div></div>';
    setTimeout(function () {
      var d = el("opretry");
      if (!d || S.data) return;
      d.innerHTML = '<button class="btn full gry" data-act="reboot">Taking too long — try again</button>';
    }, 6000);
  }

  (function boot() {
    var sess = null;
    try { sess = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
    if (!(sess && sess.user && sess.pin)) { renderLogin(); regSW(); return; }

    S.user = sess.user; S.pin = sess.pin; S.role = sess.role || "";
    var snap = snapLoad();
    if (snap) { S.data = snap; bust(); S.busy = true; render(); } else openingScreen();

    var authP = api("teamAuth", { ua: navigator.userAgent });
    var dataP = getBook();
    var refused = false;
    loadCatalog();

    authP.then(function (r) {
      if (!r || !r.ok) {
        refused = true; S.pin = ""; S.data = null;
        try { localStorage.removeItem(STORE); } catch (e) {}
        renderLogin("Sign in again."); return;
      }
      S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
      if (ALLOWED.indexOf(S.role) < 0) {
        refused = true; S.pin = ""; S.data = null;
        renderLogin("This app is for the godown and the accounts desk."); return;
      }
      try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: sess.pin, role: S.role })); } catch (e) {}
      if (S.data) render();
    }).catch(function () {});

    dataP.then(function (r) {
      if (refused) return;
      S.busy = false;
      if (usableBook(r)) { S.data = slimBook(r); S.syncAt = Date.now(); bust(); snapSave(); render(); }
      else if (!S.data) openingScreen("Could not read the book. Try again.");
      else render();
    }).catch(function () {
      if (refused) return;
      S.busy = false;
      if (S.data) { render(); toast("No signal — showing what was last pulled onto this phone."); }
      else openingScreen("No signal, and nothing saved on this phone yet.");
    });

    regSW();
  })();

  function regSW() {
    if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
  }
})();
</script>
<script>
/* ---------------------------------------------------------------------------
   THE ICON NAG — one time, on the phone that needs it.
   The three apps used to share one Energy World leaf, so a man tapped the wrong
   one. They have their own pictures and names now — but a phone copies the icon
   into the home-screen shortcut on the day it is added and never looks again.
   Apple gives no way to change that from here; it has to be removed and re-added
   once. So the app tells the person holding it, rather than the owner having to
   tell five people. Shown only to someone who OPENED IT FROM THE HOME SCREEN —
   that is exactly the person with the old icon — once, and never again.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";
  var KEY = "ew_icon_nag_v1";
  try { if (localStorage.getItem(KEY)) return; } catch (e) { return; }

  var standalone = false;
  try {
    standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
                 window.navigator.standalone === true;
  } catch (e) {}
  if (!standalone) return;              /* in a browser tab there is no icon to fix */

  function show() {
    if (document.getElementById("ew_nag")) return;
    var d = document.createElement("div");
    d.id = "ew_nag";
    d.setAttribute("style",
      "position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 68px);z-index:9999;" +
      "background:#fff7ed;border:1px solid #fdba74;border-radius:13px;padding:13px 15px;" +
      "box-shadow:0 8px 24px rgba(15,23,42,.18);font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" +
      "color:#7c2d12;max-width:700px;margin:0 auto");
    d.innerHTML =
      '<div style="font-weight:800;margin-bottom:4px">This app has its own icon now</div>' +
      '<div>The picture on your home screen is still the old one — a phone keeps the icon from the day ' +
      'you added it. To fix it once: <b>press and hold the icon &rarr; Remove from Home Screen</b>, then open ' +
      '<b>energyworld apps</b> in the browser and <b>Add to Home Screen</b> again. You stay signed in.</div>' +
      '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">' +
        '<button id="ew_nag_open" style="appearance:none;border:1px solid #b45309;background:#b45309;color:#fff;' +
          'border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer">Open the apps page</button>' +
        '<button id="ew_nag_ok" style="appearance:none;border:1px solid #fdba74;background:#fff;color:#7c2d12;' +
          'border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer">Got it</button>' +
      '</div>';
    document.body.appendChild(d);
    var done = function () {
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      if (d.parentNode) d.parentNode.removeChild(d);
    };
    document.getElementById("ew_nag_ok").addEventListener("click", done);
    document.getElementById("ew_nag_open").addEventListener("click", function () {
      try { window.open("../apps/", "_blank"); } catch (e) {}
      done();
    });
  }
  /* after the app has painted, so it is never the first thing on a cold start */
  setTimeout(show, 2500);
})();
</script>
