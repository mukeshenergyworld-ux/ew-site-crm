    });
  }
  function pendingApproval(all) {
    return newestFirst(challans().filter(function (c) { return isDraft(c) && (all || recent(c)); }));
  }
  /* how many are being held back by the window, so the button can say so honestly */
  function olderCount(list) {
    if (S.allTime) return 0;
    return list.filter(function (c) { return ageDays(c) > WINDOW_DAYS; }).length;
  }
  function showAllBar(n, what) {
    if (!n) return "";
    return '<div class="row" style="margin:8px 2px">' +
      '<button class="btn sm gry" data-act="alltime">Show everything &mdash; ' + n + ' older ' + what + '</button>' +
      '</div>';
  }

  /* ---------- WHOSE CLIENT IS IT ----------
     v1.3 - challans grouped by the sales executive the CLIENT belongs to, not by whoever
     typed the challan. Every challan on this book was typed by one man, so grouping by the
     typist put all 81 in one heap; grouping by whose client it is is the split that means
     something - it is how the CRM reads the book, and how the owner asks about it.
     The bands remember what was left open, so a man who works one executive's deliveries
     is not re-opening the same band every morning. */
  /* v1.20.1 - ONE definition of "whose client is he".

     execOf() has read ownedBy||createdBy since v1.3. The client card added in 1.19.0 read
     cl.owner, which is not a field on the record at all - so Jagdish Bansal, who IS under
     Mukesh Verma and whose challans have been filed under Mukesh Verma on the delivery list
     all along, was shown on the new challan screen as "No executive set for him".

     His screenshot caught it. Two places asking the same question of the same record and
     getting different answers is exactly the fault this app keeps having, so they now share
     one function and cannot disagree again. */
  function execName(cl) {
    return String((cl && (cl.ownedBy || cl.createdBy)) || "").trim();
  }
  function execOf(c) {
    return execName(clientByName(c && c.customerName)) || "Unassigned";
  }
  var OPEN_KEY = "ew_challan_openbands";
  function bandsOpen() {
    try { return JSON.parse(localStorage.getItem(OPEN_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function bandIsOpen(name) {
    var m = bandsOpen();
    /* first time through, everything is open - nobody should have to discover a tap */
    return m[name] === undefined ? true : !!m[name];
  }
  function bandToggle(name) {
    var m = bandsOpen();
    m[name] = !bandIsOpen(name);
    try { localStorage.setItem(OPEN_KEY, JSON.stringify(m)); } catch (e) {}
  }
  function byExec(list) {
    var g = {}, order = [];
    list.forEach(function (c) {
      var e = execOf(c);
      if (!g[e]) { g[e] = []; order.push(e); }
      g[e].push(c);
    });
    return order.sort(function (a, b) {
      var va = g[b].reduce(function (x, c) { return x + chValue(c); }, 0);
      var vb = g[a].reduce(function (x, c) { return x + chValue(c); }, 0);
      return va - vb;
    }).map(function (e) { return { name: e, list: g[e] }; });
  }

  /* ---------- FINDING AN OLD ONE ----------
     By client, by our challan number, or by the number written in the paper book - which is
     the one the godown actually remembers. Searching always looks at the whole book, however
     far back it goes, and ignores the 60-day window entirely. */
  function searchHits() {
    var q = lower(S.q || "");
    if (!q) return null;
    return newestFirst(challans().filter(function (c) {
      return lower(c.customerName).indexOf(q) >= 0 ||
             lower(c.challanNo).indexOf(q) >= 0 ||
             lower(c.site).indexOf(q) >= 0 ||
             lower(manualNoFor(c)).indexOf(q) >= 0;
    }));
  }

  /* the client's frozen brand discount, read the CRM's way */
  function discRowsFor(client, brand) {
    var ck = lower(client), bk = lower(brand);
    return ((S.data && S.data.discounts) || []).filter(function (d) {
      return lower(d.client) === ck && (!bk || lower(d.brand) === bk || !String(d.brand || "").trim());
    });
  }
  function clientDiscount(client, brand) {
    var rows = discRowsFor(client, brand);
    /* an exact brand row beats a blank-brand catch-all, the same order the CRM picks in */
    var exact = rows.filter(function (d) { return lower(d.brand) === lower(brand); })[0];
    var d = exact || rows[0];
    return d ? num(d.pct) : 0;
  }
  function realBrand(p) {
    var m = ((S.data && S.data.brandmap) || []).filter(function (x) { return String(x.catalogValue) === String(p.brand); })[0];
    return (m && m.brand) ? m.brand : "";
  }

  /* ---------- the paper book's own number ----------
     Append-only audit rows, the same channel the CRM writes to, so a number entered
     here shows on the challan and in HISAB there. Newest row wins; nothing is ever
     overwritten, so a correction keeps the history of what was written before. */
  var _mnCache = null;
  function manualNoMap() {
    if (_mnCache) return _mnCache;
    var m = {};
    ((S.data && S.data.audit) || []).forEach(function (r) {
      if (!r || String(r.action || "") !== "challan:manualno") return;
      var d = {};
      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }
      var at = String(r.createdAt || "");
      /* v1.10.0 - KEYED BY THE ID TOO. A challan written with no signal has no challan
         number yet, so a book number filed against it could only ever be keyed by "" and
         would be orphaned - and the book number is the one thing the customer's storeman
         quotes down the phone. The id is minted on this device and never changes, so it is
         the key that always exists. Both are indexed, so every row already on the sheet
         still resolves by number exactly as before. */
      [String(d.chId || d.challanId || "").trim(), String(d.challanNo || d.chNo || "").trim()]
        .forEach(function (k) {
          if (!k) return;
          if (!m[k] || at >= m[k].at) m[k] = { at: at, no: String(d.no || d.manualNo || "").trim() };
        });
    });
    _mnCache = m;
    return m;
  }
  function manualNoFor(c) {
    var m = manualNoMap();
    var hit = m[String((c && c.id) || "").trim()] || m[String((c && c.challanNo) || "").trim()];
    return hit ? hit.no : "";
  }
  function saveManualNo(chNo, chId, no, client) {
    _mnCache = null;
    return saveRow("audit", {
      id: "MN-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
      createdAt: new Date().toISOString(), actor: S.user || "",
      action: "challan:manualno", target: String(chNo || ""),
      /* v1.8.0 - chNo and chId are the names the CRM's manualNoMap actually reads:
             if (d.chId) byId[d.chId] = ...;  if (d.chNo) byNo[d.chNo] = ...
         This app wrote challanNo/challanId, so NEITHER branch ever ran and every book number
         typed in the godown since v1.6.1 was invisible at the desk - which is exactly when it is
         needed, because the customer's storeman rings quoting the book number and nothing else.
         The old names are kept alongside so this app's own reader, and any row already written,
         still resolve. */
      detail: JSON.stringify({ chNo: String(chNo || ""), chId: String(chId || ""),
        challanNo: String(chNo || ""), challanId: String(chId || ""),
                               no: String(no || ""), client: String(client || ""), by: S.user || "" })
    });
  }

  /* ---------- the signed receipt ----------
     Same audit channel the CRM's delivery proofs already use, so a photo attached in the
     godown appears on the same challan in the CRM's HISAB with no server change at all. */
  /* THE KEY IS chId, NOT THE CHALLAN NUMBER. This is the CRM's own convention and it must
     be matched exactly, or a receipt attached in the godown would be invisible in HISAB and
     the CRM's proofs would be invisible here. A return is keyed the same way, by its own row
     id, which is why one action covers both. */
  var _proofCache = null;
  function proofMap() {
    if (_proofCache) return _proofCache;
    var m = {};
    ((S.data && S.data.audit) || []).forEach(function (r) {
      if (!r || String(r.action || "") !== "challan:proof") return;
      var d = {};
      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }
      if (!d.chId) return;
      var prev = m[d.chId];
      if (!prev || String(r.createdAt || "") >= String(prev.at || "")) {
        m[d.chId] = { at: r.createdAt || "", by: d.by || "", url: d.url || "",
                      actor: r.actor || "", photo: !!d.photo, thumb: String(d.thumb || "") };
      }
    });
    _proofCache = m;
    return m;
  }
  function proofFor(rec) {
    var id = (rec && rec.id) ? rec.id : rec;
    return proofMap()[String(id || "").trim()] || null;
  }
  function saveProof(rec, url, thumb) {
    _proofCache = null;
    var isRet = !!rec.returnNo;
    var no = String(rec.challanNo || rec.returnNo || "");
    return saveRow("audit", {
      id: "PF-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
      createdAt: new Date().toISOString(), actor: S.user || "",
      action: "challan:proof",
      target: no + " / " + String(rec.customerName || ""),
      detail: JSON.stringify({
        chId: String(rec.id || ""), no: no, client: String(rec.customerName || ""),
        site: String(rec.site || ""), by: S.user || "", geo: "", url: String(url || ""),
        at: new Date().toISOString(), photo: true, sig: false,
        thumb: String(thumb || ""), kind: isRet ? "return" : "challan"
      }), ip: ""
    });
  }
  /* ================= A RECEIPT MEANS THE DELIVERY WAS RECEIVED (v1.8.0) =========
     Filing the signed paper used to write an audit row and nothing else. `receiptReceived` was
     never set, so the money code - which keys on exactly that field, in the CRM, in HISAB and in
     the Payment app - never counted the delivery. Meanwhile missingReceipts() below cleared on
     the PROOF, so the challan also left the one list that would have caught it. Signed for,
     complete, and on nobody's screen.

     challanMove is the CRM's own endpoint for this transition, so the server owns it and only
     the status moves - no stale full-row write. If it fails the challan stays exactly as it was
     and the receipt is still filed; the delivery simply keeps showing as awaiting its receipt,
     which is the honest state and the one that gets it looked at again. */
  function markReceived(rec) {
    if (!rec || !rec.id || rec.returnNo) return Promise.resolve(null);   /* returns book in separately */
    if (String(rec.receiptReceived || "").toUpperCase() === "Y") return Promise.resolve(null);
    /* ================= A RECEIPT IS NOT AN APPROVAL (v1.10.0) ==================
       v1.8.0 made filing the paper mark the delivery received, which closed a real billing
       leak. It sent the challan to Received WHATEVER its status was - including Draft.

       So a challan nobody had passed could be moved straight to Received by attaching a
       photograph. Approving is the one action this app deliberately makes expensive: it
       re-asks for the PIN and tells the man "This releases material. It is not a formality."
       Attaching a photograph asked for nothing and skipped the whole step, and the challan
       then showed as Received having never been passed - so the approval queue, which is
       the record of who authorised material leaving the godown, simply never saw it.

       Measured against v1.9.1: a Draft challan, one attached receipt, no PIN asked for,
       no approvePin sent, and status Draft -> Received.

       The receipt still files - that paper is the thing that settles an argument and must
       never be refused. It is only the promotion that is refused, and the man is told
       which step is missing. */
    if (isDraft(rec)) {
      return Promise.resolve({ ok: false, blocked: true,
        error: "this challan has not been passed yet" });
    }
    /* v1.10.0 - and the move is journalled, so the window v1.8.0 left open is closed: the
       PDF was hosted and the proof row written, and then this call could still be lost, and
       nothing retried it. No PIN is carried - Received needs none, and an approval is never
       queued for exactly that reason. */
    var e = jrnPut({ pk: "P-" + Date.now() + "-" + (++_jrnSeq), kind: "move", id: rec.id,
                     to: "Received", by: S.user || "", at: Date.now(), err: "", tries: 0 });
    var land = function (r) {
      jrnDrop(e.pk);
      rec.status = "Received"; rec.receiptReceived = "Y";
      var arr = (S.data && S.data.challans) || [];
      for (var i = 0; i < arr.length; i++) {
        if (arr[i] && arr[i].id === rec.id) { arr[i].status = "Received"; arr[i].receiptReceived = "Y"; break; }
      }
      bust();
      return r;
    };
    return jrnSend(e).then(function (r) {
      if (r && r.ok) return land(r);
      jrnMark(e.pk, (r && r.error) || "the server refused it");
      /* NOT marked locally. The flag is what every money screen counts a delivery on, and
         missingReceipts() asks the flag and only the flag - so setting it here would drop
         the delivery off the one list that catches this, for a move that has not happened.
         It stays on the list until the server says otherwise. */
      return { ok: false, held: true, error: (r && r.error) || "the server refused it" };
    }).catch(function (err) {
      jrnMark(e.pk, (err && err.message) ? err.message : "no answer from the server");
      return { ok: false, held: true, error: (err && err.message) || "no answer from the server" };
    });
  }

  /* Deliveries with nothing signed against them. This is the list that stops an argument
     three months later, so it is a screen of its own rather than a footnote.
     v1.8.0 - it asks receiptReceived FIRST and the proof only as a secondary signal, so a
     delivery whose paper is filed but whose flag never moved cannot slip off this list. */
  function missingReceipts() {
    return challans().filter(function (c) {
      /* v1.8.0 - the AND was the whole trouble. A challan whose paper was filed but whose
         receiptReceived never moved satisfied !proofFor(c) === false and so dropped OFF this
         list - the one list that would have caught it - while every money screen still ignored
         it for want of the flag. The flag is now the only question asked. Filing a receipt sets
         it (markReceived), so this changes nothing for anything filed from v1.8.0 on; what it
         does is surface every delivery filed BEFORE it, which is exactly the backlog that needs
         looking at. */
      return String(c.receiptReceived || "").toUpperCase() !== "Y";
    }).sort(function (a, b) { return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  }

  /* v1.20.0: the delivery-book client list dies with the book too - a client the office
     added an hour ago must not be invisible because the first paint cached the old set. */
  function bust() { _mnCache = null; _proofCache = null; _dtCache = null; bustBookClients(); }

  /* v1.9.1 - remembered on the record itself. chRow() calls chLines three times per card and
     byExec()'s sort comparator calls chValue O(n log n) times, each re-running JSON.parse over
     the same string - on every letter typed into the search box. The cache hangs off the row, so
     it dies with the row when a pull replaces the book. */
  function chLines(c) {
    if (!c) return [];
    if (c.__lines) return c.__lines;
    var l;
    try { l = JSON.parse(c.itemsJson || "[]"); } catch (e) { l = []; }
    if (!Array.isArray(l)) l = [];
    try { Object.defineProperty(c, "__lines", { value: l, enumerable: false, configurable: true }); }
    catch (e) { return l; }
    return l;
  }
  function chValue(c) {
    if (!c) return 0;
    if (c.__value !== undefined) return c.__value;
    var v = chLines(c).reduce(function (a, l) {
      var d = num(l.disc);
      return a + num(l.qty) * Math.round(num(l.rate) * (1 - d / 100));
    }, 0) + (String(c.freightTo) === "Client" ? num(c.freight) : 0);
    /* NOT enumerable: these rows are stringified into the offline snapshot and posted back to the
       server, and a cache must never travel with the data it describes. */
    try { Object.defineProperty(c, "__value", { value: v, enumerable: false, configurable: true }); }
    catch (e) {}
    return v;
  }
  /* ================= THE PRODUCT PICKER =================
     One level at a time, exactly as the CRM does it, because that is what the godown
     already knows: BRAND, then that brand's CATEGORY, then the products with their
     picture and a +/- stepper. The picture is there to stop the wrong 110 mm fitting
     going on the lorry; it never reaches the printed challan.
     Tap a crumb to go back up a level. */

  function brandsInStock() {
    var live = {};
    PRODUCTS.forEach(function (p) { var b = realBrand(p) || String(p.brand || "").trim(); if (b) live[b] = (live[b] || 0) + 1; });
    return Object.keys(live).sort().map(function (b) { return { name: b, n: live[b] }; });
  }
  function brandOf(p) { return realBrand(p) || String(p.brand || "").trim(); }
  function catsIn(brand) {
    var m = {};
    PRODUCTS.forEach(function (p) {
      if (brandOf(p) !== brand) return;
      var c = String(p.cat || "").trim() || "Other";
      m[c] = (m[c] || 0) + 1;
    });
    return Object.keys(m).sort(alpha).map(function (c) { return { name: c, n: m[c] }; });
  }
  function prodsIn(brand, cat) {
    return PRODUCTS.filter(function (p) {
      return brandOf(p) === brand && (String(p.cat || "").trim() || "Other") === cat;
    }).sort(function (a, b) { return String(a.desc).localeCompare(String(b.desc)); });
  }

  /* the basket the picker is filling - the challan builder or the return builder */
  function basket() { return S.pick && S.pick.into === "rt" ? (S.rt && S.rt.items) : (S.ch && S.ch.items); }
  function qtyOf(code) {
    var b = basket() || [];
    var hit = b.filter(function (l) { return l.code === code; })[0];
    return hit ? num(hit.qty) : 0;
  }

  function pickerHtml() {
    var p = S.pick || {};
    var h = '<div class="crumb">' +
      '<span class="c" data-act="pk-lvl" data-l="brand">Brand' + (p.brand ? ': ' + esc(p.brand) : '') + '</span>' +
      (p.brand ? '<span class="c" data-act="pk-lvl" data-l="cat">Category' + (p.cat ? ': ' + esc(p.cat) : '') + '</span>' : '') +
      '</div>';

    if (!p.brand) {
      var bl = brandsInStock();
      if (!bl.length) return h + '<div class="empty">The catalogue has not loaded yet. Pull the latest and try again.</div>';
      /* v1.19.0 - "small length box, like 2 to 3 brand again alphabatically in one line".
         brandsInStock() already sorts; this only changes how many fit across. */
      h += '<div class="grid">' + bl.map(function (b) {
        return '<button class="gtile" data-act="pk-brand" data-b="' + esc(b.name) + '">' +
          esc(b.name) + '<span class="sub">' + b.n + ' product' + (b.n === 1 ? '' : 's') + '</span></button>';
      }).join("") + '</div>';
      return h;
    }
    if (!p.cat) {
      h += '<div class="grid">' + catsIn(p.brand).map(function (c) {
        return '<button class="gtile" data-act="pk-cat" data-c="' + esc(c.name) + '">' +
          esc(c.name) + '<span class="sub">' + c.n + ' product' + (c.n === 1 ? '' : 's') + '</span></button>';
      }).join("") + '</div>';
      return h;
    }
    var list = prodsIn(p.brand, p.cat);
    var q = lower(p.q || "");
    if (q) list = list.filter(function (x) { return lower(x.label).indexOf(q) >= 0; });
    h += '<div class="row" style="margin-bottom:8px"><input id="pk_q" class="grow" placeholder="Narrow this list…" value="' + esc(p.q || "") + '"/></div>';
    if (!list.length) return h + '<div class="empty">Nothing here by that name.</div>';
    /* v1.19.0 - "inside also 2 to 3 priducts in single line, all alphabatically".
       prodsIn() already sorts by description. One full-width card per product meant a man
       scrolled six times to see six items he knew the names of; now he sees the shelf.
       A line already in the challan keeps its green ring so it is findable at a glance. */
    h += '<div class="pgrid">' + list.map(function (x) {
      var have = qtyOf(x.code);
      return '<div class="pcard"' + (have ? ' style="border-color:#5eead4;background:#f0fdfa"' : '') + '>' +
        (x.pic ? '<img src="' + esc(x.pic) + '" alt="" loading="lazy"/>' : '') +
        '<div class="pn">' + esc(x.desc) + '</div>' +
        '<div class="pm">' + esc(x.code) + (x.unit ? ' · ' + esc(x.unit) : '') + ' · ' + money(x.price) + '</div>' +
        '<div class="step">' +
          '<button data-act="pk-minus" data-code="' + esc(x.code) + '">&minus;</button>' +
          '<input class="pk-qty" data-code="' + esc(x.code) + '" inputmode="decimal" value="' + (have || "") + '" placeholder="0"/>' +
          '<button data-act="pk-plus" data-code="' + esc(x.code) + '">+</button>' +
        '</div></div>';
    }).join("") + '</div>';
    return h;
  }

  function sheetPicker() {
    var n = (basket() || []).length;
    return '<h2>Add material</h2>' +
      '<div class="muted" style="margin-bottom:10px">' + n + ' line' + (n === 1 ? '' : 's') + ' so far. Set a quantity and it is in — no separate Add button.</div>' +
      '<div id="pk_body">' + pickerHtml() + '</div>' +
      '<div class="acts" style="margin-top:14px"><button class="btn full" data-act="close">Done</button></div>';
  }

  /* Setting a quantity IS adding the line - there is no second button to forget. A
     quantity of zero takes it out again. */
  function setQty(code, q) {
    var into = S.pick && S.pick.into === "rt" ? "rt" : "ch";
    var holder = into === "rt" ? S.rt : S.ch;
    if (!holder) return;
    holder.items = holder.items || [];
    var prod = PRODUCTS.filter(function (x) { return x.code === code; })[0];
    if (!prod) return;
    var qn = num(q);
    var i, hit = -1;
    for (i = 0; i < holder.items.length; i++) if (holder.items[i].code === code) { hit = i; break; }
    if (qn <= 0) { if (hit >= 0) holder.items.splice(hit, 1); return; }
    var line = { code: prod.code, desc: prod.desc, unit: prod.unit, qty: qn, rate: prod.price,
                 brand: brandOf(prod), disc: "" };
    if (hit >= 0) holder.items[hit] = Object.assign({}, holder.items[hit], { qty: qn }); else holder.items.push(line);
  }
  /* ================= SCREENS ================= */

  function renderLogin(err) {
    el("root").innerHTML =
      '<div class="login"><h1>Energy World</h1><p>Challan &amp; material return</p>' +
      (err ? '<div class="loginmsg">' + esc(err) + '</div>' : '') +
      (bioSaved()
        ? '<button class="btn full" data-act="bio-go" style="margin-bottom:6px">&#128274; Unlock with Face ID / fingerprint</button>' +
          '<div class="muted" style="text-align:center;margin-bottom:14px">or sign in with your PIN</div>'
        : '') +
      '<label>Your name</label><input id="ln" autocomplete="username" placeholder="e.g. Gautam" value="' + esc(S.user) + '"/>' +
      '<label>Your PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Your Team CRM PIN"/>' +
      '<div style="height:16px"></div>' +
      '<button class="btn full" data-act="login">Sign in</button>' +
      '<div class="muted" style="text-align:center;margin-top:14px">The same name and PIN as the Team CRM.<br>v' + APP_VERSION + '</div></div>';
    var lp = el("lp");
    if (lp) lp.addEventListener("keyup", function (e) { if (e.key === "Enter") doLogin(); });
  }


  function header() {
    var n = S.busy ? "syncing…" : (S.syncAt ? "updated " + new Date(S.syncAt).toTimeString().slice(0,5) : "");
    return '<div class="top">' + newVerBar() + '<div class="t1">' +
      '<h1>Challan</h1>' +
      '<div style="text-align:right"><div class="who">' + esc(S.user) + ' · ' + esc(S.role) +
        (canApprove() ? '' : ' · makes, does not approve') + '</div>' +
      '<div class="sync">' + esc(n) + '</div></div>' +
      '<button class="btn sm ghost" data-act="refresh" title="Pull the latest, and get the new version if one is up">&#8635;</button>' +
      '<button class="btn sm ghost" data-act="account" title="This phone">&#9776;</button>' +
      '</div></div>';
  }

  /* The one box that reaches the whole book, on every screen. A godown remembers the number
     written in the paper book, not ours - so it searches that too. */
  function searchBox() {
    return '<div class="row" style="margin:2px 0 10px">' +
      '<input id="q" class="grow" placeholder="Find any challan \u2014 client, challan no, book no\u2026" value="' + esc(S.q || "") + '"/>' +
      (S.q ? '<button class="btn sm gry" data-act="qclear">Clear</button>' : '') + '</div>';
  }
  function viewSearch() {
    var list = searchHits();
    var h = searchBox();
    if (!list.length) {
      return h + '<div class="empty">Nothing by that name or number.<br>' +
        'This searches every challan ever made, not just the last sixty days.</div>';
    }
    h += '<div class="muted" style="margin:0 2px 6px">' + list.length + ' match' + (list.length === 1 ? '' : 'es') +
      ' \u2014 searched the whole book, however far back it goes</div>';
    return h + list.map(chRow).join("");
  }

  /* ---------- 1. THE DELIVERY BOOK ----------
     v1.2 - THIS SCREEN IS THE BOOK, NOT A GLANCE AT IT.
     It used to open with a strip headed "the last few you made": six challans, and only the
     ones the man signed in had created himself. It was meant as a "did my last one save?"
     check. But it is the first thing on the main screen, so of course it reads as THE LIST -
     and on a book of 81 challans, all made by one man, it showed six of them and looked as
     though the rest had gone. That is the whole complaint and it was a fair one.
     It now shows every challan, everyone's, newest first, with chips to narrow it. */
  var CH_FILTERS = [
    ["all",     "All"],
    ["draft",   "Not passed"],
    ["noproof", "No receipt"],
    ["mine",    "Mine"]
  ];
  function chFiltered(kind) {
    var list = challans().filter(recent);
    if (kind === "draft")   return list.filter(isDraft);
    if (kind === "noproof") return list.filter(function (c) {
      return String(c.receiptReceived || "").toUpperCase() !== "Y";
    });
    if (kind === "mine")    return list.filter(function (c) { return lower(c.createdBy) === lower(S.user); });
    return list;
  }
  function chChips() {
    var f = S.chFilter || "all";
    return '<div class="row" style="flex-wrap:wrap;gap:6px;margin:2px 0 8px">' +
      CH_FILTERS.map(function (b) {
        var n = chFiltered(b[0]).length;
        if (!n && b[0] !== "all") return "";
        return '<button class="btn sm ' + (f === b[0] ? '' : 'gry') + '" data-act="ch-filter" data-f="' + b[0] + '">' +
          esc(b[1]) + ' <b style="opacity:.75">' + n + '</b></button>';
      }).join("") + '</div>';
  }

  /* Challans laid out executive by executive, each band openable. One place builds it, so
     the delivery book, the approval queue and the receipts list all read the same way. */
  function execBands(list) {
    var groups = byExec(list);
    if (groups.length < 2) return list.map(chRow).join("");
    return groups.map(function (g) {
      var open = bandIsOpen(g.name);
      var val = g.list.reduce(function (a, c) { return a + chValue(c); }, 0);
      var noRc = g.list.filter(function (c) {
        return String(c.receiptReceived || "").toUpperCase() !== "Y";
      }).length;
      var draft = g.list.filter(isDraft).length;
      return '<div class="exec" data-act="band" data-n="' + esc(g.name) + '">' +
          '<span class="car">' + (open ? '&#9662;' : '&#9656;') + '</span>' +
          '<div class="grow">' + esc(g.name) +
            '<div style="font-size:11.5px;font-weight:600;opacity:.9">' +
              g.list.length + ' challan' + (g.list.length === 1 ? '' : 's') + ' · ' + money(val) +
              (draft ? ' · ' + draft + ' not passed' : '') +
              (noRc ? ' · ' + noRc + ' no receipt' : '') +
            '</div></div>' +
          '<span class="sub">' + (open ? 'hide' : 'show') + '</span>' +
        '</div>' +
        (open ? g.list.map(chRow).join("") : '');
    }).join("");
  }

  /* ---------- WHO IS IT FOR ----------
     v1.3 - district, then area, then the name. A free-text box over 118 clients meant
     spelling a man's name exactly as somebody else once typed it; this asks the two
     questions the godown already knows the answer to and leaves a handful of names. */
  /* ================= ASKED WHERE THE CUSTOMER IS STANDING (v1.12.0) =================
     HIS INSTRUCTION: "also ask to enter mobile no and other details in payments and challan
     app, because team mostly use that apps."

     This is the better moment than the CRM. A challan is written with the man in front of you,
     or his driver at the counter - which is when a mobile number costs one question to get.
     The card already SHOWED what was missing ("no mobile on his record", in red) and gave
     nobody anywhere to put it.

     ALL THREE ARE ASKED HERE, unlike the Payment app, because this app pulls the `associates`
     tab and so has a real partner register to pick from. A free-typed plumber that matches no
     partner is worse than a blank one - it looks answered and joins to nothing. */
  var CH_GAPS = [
    { k: "mobile",    label: "Mobile",    role: "" },
    { k: "plumber",   label: "Plumber",   role: "plumber" },
    { k: "architect", label: "Architect", role: "architect" }
  ];
  function chGaps(cl) {
    if (!cl) return [];
    return CH_GAPS.filter(function (f) { return !String(cl[f.k] || "").trim(); });
  }
  function partnersOfRole(role) {
    var out = [];
    ((S.data && S.data.associates) || []).forEach(function (a) {
      if (!a || !a.name) return;
      if (String(a.role || "").trim().toLowerCase() !== role) return;
      if (out.indexOf(a.name) < 0) out.push(a.name);
    });
    return out.sort();
  }
  function sheetDetails(name) {
    var cl = clientByName(name) || {};
    var gaps = chGaps(cl);
    if (!gaps.length) return '<h2>' + esc(name) + '</h2><div class="muted">Nothing missing.</div>' +
      '<div class="acts" style="margin-top:14px"><button class="btn gry grow" data-act="close">Close</button></div>';
    var h = '<h2>What is missing</h2>' +
      '<div class="muted" style="margin-bottom:10px">' + esc(cl.name || name) +
      ' — ask him now, while he is here. Only what is blank is shown.</div>';
    gaps.forEach(function (f) {
      h += '<label>' + esc(f.label) + '</label>';
      if (!f.role) { h += '<input id="dt_mobile" inputmode="numeric" placeholder="10 digits" value=""/>'; return; }
      var list = partnersOfRole(f.role);
      h += '<select id="dt_' + f.k + '"><option value="">— not known —</option>' +
        list.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join("") +
        '</select>' +
        (list.length ? '' : '<div class="muted" style="font-size:11.5px">Nobody on the partner register yet — the office adds them in the CRM.</div>');
    });
    h += '<div class="muted" style="margin:10px 0 0">Saved against him everywhere — the CRM, ' +
      'the payment app and this one all read the same record.</div>' +
      '<div class="acts" style="margin-top:14px">' +
        '<button class="btn gry grow" data-act="close">Cancel</button>' +
        '<button class="btn grow" data-act="dt-save" data-n="' + esc(cl.name || name) + '">Save</button>' +
      '</div>';
    return h;
  }

  /* ---------- THE ADDRESS, ONCE ----------
     v1.19.0 - his words: "if like address not preset and entered by challan maker, that will
     be auto update in all records and freezed".

     So: a client WITH an address has it read out here and cannot be changed from this app.
     A client WITHOUT one gets a box, and what is typed is saved onto HIS OWN RECORD - not
     onto the challan - so the CRM, the payment app and every future challan read the same
     line. After that it is frozen here. The office can still correct it in the CRM, which is
     the one place that should be correcting an address; the counter can fill a blank and
     never overwrite a filled one.

     Why it matters more than it looks: a delivery address typed fresh on each challan is how
     one house becomes four addresses, and how a lorry goes to the wrong gate. */
  /* ---------- WHAT IS ALREADY OUT, BEFORE MORE GOES OUT (v1.21.0) ----------

     The man at the counter could load a lorry for someone carrying two lakh of unbilled
     material and had no way to know. The CRM knows; the Payment app knows; this app - the
     one actually standing at the gate - showed nothing.

     WHAT THIS APP CAN HONESTLY SEE, and what it cannot. It holds every challan but it does
     NOT hold the payments tab, so it cannot say what a man OWES. Claiming to would be worse
     than saying nothing: a wrong number at the counter gets trusted and argued with.

     So it reports exactly what is in its own book:
       - material out and not yet billed (billNo empty), in rupees and in challans
       - the oldest of those, in days
       - and it names the Payment app as the place the true balance lives.

     The credit LIMIT and credit DAYS come off the client record - the office sets them in the
     CRM and they arrive here whole, because slimBook keeps entire tabs rather than picking
     fields. Two lines are loud rather than grey: unbilled material past his limit, and an
     unbilled challan older than his terms. Those are the two a man should stop and ring about. */
  function clientMoney(cl) {
    var nm = lower((cl && cl.name) || "");
    var o = { n: 0, rs: 0, oldest: 0, noReceipt: 0,
              limit: num(cl && cl.creditLimit), days: num(cl && cl.creditDays) };
    if (!nm) return o;
    challans().forEach(function (c) {
      if (lower(c.customerName) !== nm) return;
      if (String(c.status || "") === "Cancelled") return;
      if (String(c.receiptReceived || "").toUpperCase() !== "Y") o.noReceipt++;
      if (String(c.billNo || "").trim()) return;          /* billed - not our business here */
      o.n++;
      o.rs += chValue(c);
      var a = ageDays(c);
      if (a > o.oldest) o.oldest = a;
    });
    return o;
  }
  function moneyBlock(cl) {
    var m = clientMoney(cl);
    if (!m.n && !m.limit) return "";
    var overLimit = m.limit > 0 && m.rs > m.limit;
    var overDays  = m.days > 0 && m.oldest > m.days;
    var loud = overLimit || overDays;
    var h = '<div style="margin-top:7px;border-radius:9px;padding:7px 9px;border:1px solid ' +
      (loud ? '#fecaca;background:#fef2f2' : '#e2e8f0;background:#f8fafc') + '">' +
      '<div class="muted" style="font-weight:700;font-size:11px' + (loud ? ';color:#b91c1c' : '') +
      '">Before you load</div>';
    if (m.n) {
      h += '<div style="font-size:13px;font-weight:700;margin-top:1px">' +
        money(m.rs) + ' not yet billed &middot; ' + m.n + ' challan' + (m.n === 1 ? '' : 's') +
        (m.oldest ? ' &middot; oldest ' + m.oldest + ' day' + (m.oldest === 1 ? '' : 's') : '') + '</div>';
    } else {
      h += '<div style="font-size:13px;font-weight:700;margin-top:1px">Nothing unbilled on his name.</div>';
    }
    if (m.limit || m.days) {
      h += '<div class="muted" style="font-size:11.5px;margin-top:2px">Credit ' +
        (m.limit ? money(m.limit) : 'not set') + (m.days ? ' &middot; ' + m.days + ' days' : '') + '</div>';
    }
    if (overLimit) {
      h += '<div style="font-size:12px;font-weight:800;color:#b91c1c;margin-top:3px">' +
        'Past his credit limit by ' + money(m.rs - m.limit) + '. Ring the office before loading.</div>';
    }
    if (overDays) {
      h += '<div style="font-size:12px;font-weight:800;color:#b91c1c;margin-top:3px">' +
        'A challan has been unbilled ' + m.oldest + ' days on ' + m.days + '-day terms.</div>';
    }
    if (m.noReceipt) {
      h += '<div class="muted" style="font-size:11.5px;margin-top:3px">' +
        m.noReceipt + ' delivery' + (m.noReceipt === 1 ? '' : ' deliveries') + ' still without a signed receipt.</div>';
    }
    h += '<div class="muted" style="font-size:10.5px;margin-top:4px">' +
      'This is what THIS app can see &mdash; material out and not billed. What he actually owes, ' +
      'after payments, is in the Payment app.</div></div>';
    return h;
  }

  function addressBlock(cl) {
    var a = String((cl && cl.address) || "").trim();
    if (a) {
      return '<div style="margin-top:7px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:7px 9px">' +
        '<div class="muted" style="font-weight:700;font-size:11px">Delivery address</div>' +
        '<div style="font-size:13px;font-weight:600;margin-top:1px">' + esc(a) + '</div>' +
        '<div class="muted" style="font-size:10.5px;margin-top:3px">On his record. Wrong? The office changes it in the CRM &mdash; ' +
        'it is one address for every challan, so it is not edited from the counter.</div></div>';
    }
    if (!cl || !cl.id) return "";
    return '<div style="margin-top:7px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:7px 9px">' +
      '<div class="muted" style="font-weight:700;font-size:11px;color:#b45309">No delivery address on his record</div>' +
      '<div class="muted" style="font-size:10.5px;margin:2px 0 5px">Type it once and it is saved against HIM &mdash; ' +
      'the CRM, the payment app and every later challan all read this same line.</div>' +
      '<input id="cl_addr" placeholder="House / plot, street, landmark" value=""/>' +
      '<div class="row" style="margin-top:6px">' +
      '<button class="btn sm" data-act="cl-addr" data-n="' + esc(cl.name) + '">Save his address</button></div></div>';
  }

  function clientPicker(z, cl, pfx) {
    var p = pfx || "m";
    if (cl && cl.name) {
      return '<div class="card">' +
        '<div class="row"><div class="grow">' +
          '<div class="muted" style="font-weight:700">Client</div>' +
          '<div style="font-size:17px;font-weight:800;margin-top:1px">' + esc(cl.name) + '</div>' +
          /* v1.19.0 - "rest all detial, phone no, executive dealing client, address will be
             auto filled". Every one of these was already on his record; the challan simply
             never showed them, so the man at the counter re-asked for a number the office
             already had. Nothing new is typed - it is the same record, read out. */
          '<div class="muted" style="margin-top:3px">' +
            esc([cl.location, cl.area].filter(Boolean).join(" · ")) +
            (cl.mobile ? ' · ' + esc(cl.mobile) : ' · <b style="color:#b91c1c">no mobile on his record</b>') +
            (execName(cl) ? '<br>Executive: <b>' + esc(execName(cl)) + '</b>'
                          : '<br><b style="color:#b45309">No executive set for him</b>') +
            (cl.plumber ? '<br>PL ' + esc(cl.plumber) : '') +
            (cl.architect ? (cl.plumber ? ' · ' : '<br>') + 'AR ' + esc(cl.architect) : '') +
          '</div>' +
        '</div><button class="btn sm gry" data-act="cp-change" data-p="' + p + '">Change</button></div>' +
        /* full width, BELOW the name row - inside it the box was squeezed against the
           Change button. Caught in a screenshot, not in the markup. */
        addressBlock(cl) +
        moneyBlock(cl) +
        /* v1.12.0 - the card already said what was missing; now it can be answered here */
        (chGaps(cl).length
          ? '<div style="margin-top:8px"><button class="btn sm amb" data-act="dt-ask" data-n="' + esc(cl.name) + '">' +
            'Add his ' + esc(chGaps(cl).map(function (f) { return f.label.toLowerCase(); }).join(", ")) +
            '</button></div>'
          : '') +
        sitePicker(z, cl, p) +
        '</div>';
    }

    var h2 = '<div class="card"><div class="muted" style="font-weight:700;margin-bottom:6px">Who is it for?</div>';

    /* ---------- SEARCH FIRST (v1.20.0) ----------
       "also provide a search box, so one can search from there and select client".

       District then area then name is three decisions to reach a man whose name he already
       knows. It is the right path when he is BROWSING - "who do we have in Karnal" - and the
       wrong one every other time. So the box comes first and searches everyone, in every
       district, by name, short name, area or mobile. Two letters is enough.

       It also walks straight past an empty district list, which is what he is looking at
       today. */
    var gq = String(z.gq || "").trim();
    h2 += '<label>Search any client &mdash; name, area or number</label>' +
      '<input id="' + p + '_gq" placeholder="e.g. jagdish, or 98123, or model town" value="' + esc(gq) + '" autocomplete="off"/>';
    if (gq.length >= 2) {
      var qq = lower(gq);
      var hits = clients().filter(function (c) {
        return lower(c.name).indexOf(qq) >= 0 ||
               lower(c.shortName || "").indexOf(qq) >= 0 ||
               lower(c.area || "").indexOf(qq) >= 0 ||
               lower(c.location || "").indexOf(qq) >= 0 ||
               String(c.mobile || "").indexOf(qq) >= 0;
      }).sort(function (a, b) { return alpha(a.name, b.name); });
      if (!hits.length) {
        h2 += '<div class="empty" style="padding:14px 8px">Nobody by that. Try fewer letters.<br>' +
          'A man who has never taken a delivery has to be registered in the CRM first, so his ' +
          'discount is set before his first one.</div>';
      } else {
        h2 += '<div style="margin-top:8px">' + hits.slice(0, 30).map(function (c) {
          return '<button class="tile" data-act="cp-pick" data-p="' + p + '" data-n="' + esc(c.name) + '">' +
            '<div class="grow">' + esc(c.name) +
            '<span class="sub">' + esc([c.location, c.area, c.mobile].filter(Boolean).join(" · ") || "no district on his record") +
            '</span></div><span class="pill">&#8250;</span></button>';
        }).join("") +
        (hits.length > 30 ? '<div class="muted">and ' + (hits.length - 30) + ' more &mdash; type another letter</div>' : '') +
        '</div>';
      }
      /* the three-step browse is not shown while he is searching - it is the other way in,
         not a second thing to read */
      return h2 + '</div>';
    }

    if (clientsAreDerived()) {
      h2 += '<div class="pill amb" style="display:block;padding:9px;text-align:left;margin-top:8px">' +
        'The client list did not come back for your login, so this is built from <b>your own ' +
        'delivery book</b> &mdash; everyone you have already sent a lorry to. Search by name ' +
        'above. The office has been told; nothing you make here is affected.</div>';
    }
    h2 += '<div class="muted" style="font-size:11.5px;margin:10px 0 2px;text-align:center">' +
      '&mdash; or find him by district &mdash;</div>';
    var ds = districts();
    /* v1.19.0 - "Ask to select district from Dropdown / ask to select area from dropdown".
       These were wrap-buttons. Nine districts already took two rows on a laptop and pushed
       the whole form down; on the phone they pushed it further. A select is one line however
       many districts there are, it is the control a man already knows from every other form,
       and it cannot be half-tapped. The counts stay - they are how he knows Panipat is the
       real one. Both lists are alphabetical (districts() and areasIn() already sort). */
    h2 += '<label>1 &middot; District</label>' +
      '<select class="cp-dsel" data-p="' + p + '">' +
      '<option value="">&mdash; choose the district &mdash;</option>' +
      ds.map(function (d) {
        return '<option value="' + esc(d.name) + '"' + (z.dist === d.name ? ' selected' : '') + '>' +
          esc(d.name) + '  (' + d.n + ')</option>';
      }).join("") + '</select>';
    if (!ds.length) {
      h2 += '<div class="pill amb" style="display:block;padding:9px;text-align:left;margin-top:7px">' +
        'Nobody on your book has a district on his record yet, so there is nothing to choose ' +
        'from here. <b>Use the search box above</b> &mdash; it finds him by name.</div>';
    }

    if (!z.dist) return h2 + '<div class="muted" style="margin-top:8px">Pick the district and the areas will follow.</div></div>';

    var as = areasIn(z.dist);
    h2 += '<label>2 &middot; Area in ' + esc(z.dist) + '</label>' +
      '<select class="cp-asel" data-p="' + p + '">' +
      '<option value=""' + (z.area ? '' : ' selected') + '>All of ' + esc(z.dist) + '</option>' +
      as.map(function (a) {
        return '<option value="' + esc(a.name) + '"' + (z.area === a.name ? ' selected' : '') + '>' +
          esc(a.name) + '  (' + a.n + ')</option>';
      }).join("") + '</select>';

    var list = clientsIn(z.dist, z.area, z.cq);
    h2 += '<label>3 &middot; His name &mdash; type the first letters</label>' +
      '<input id="' + p + '_cq" placeholder="e.g. rak, or rk for Rakesh Kumar" value="' + esc(z.cq || "") + '"/>';
    if (!list.length) {
      h2 += '<div class="empty" style="padding:14px 8px">Nobody here by that name.<br>' +
        'A new man has to be registered in the CRM first, so his discount is set before his first delivery.</div>';
    } else {
      h2 += '<div style="margin-top:8px">' + list.slice(0, 40).map(function (c) {
        return '<button class="tile" data-act="cp-pick" data-p="' + p + '" data-n="' + esc(c.name) + '">' +
          '<div class="grow">' + esc(c.name) +
          '<span class="sub">' + esc([c.area, c.mobile].filter(Boolean).join(" · ") || "no area, no mobile") + '</span></div>' +
          '<span class="pill">&#8250;</span></button>';
      }).join("") +
      (list.length > 40 ? '<div class="muted">and ' + (list.length - 40) + ' more &mdash; type another letter</div>' : '') +
      '</div>';
    }
    return h2 + '</div>';
  }

  /* ---------- WHICH SITE ----------
     v1.5 - the owner's rule reaches the site. A site typed by hand is how one project
     quietly becomes three - "Ansal", "ansal plots", "Ansal I Blk" - and from then on his
     hisab, his pitch board and his delivery history are each looking at a different
     place. His own sites are buttons. A genuinely new site is still possible, because a
     man does start a new project, but it takes a deliberate press so it is never the
     lazy path. */
  function sitePicker(z, cl, pfx) {
    var p = pfx || "m";
    var st = sitesFor((cl && cl.name) || "");
    var h = '<label>Site</label>';
    if (z.siteNew) {
      return h +
        '<input id="' + p + '_site" placeholder="The new site or project" value="' + esc(z.site || "") + '"/>' +
        '<div class="row" style="margin-top:7px">' +
          '<button class="btn sm gry" data-act="cp-sitenew" data-p="' + p + '" data-off="1">' +
          (st.length ? '&#8592; Back to his sites' : 'Clear it') + '</button></div>';
    }
    if (!st.length) {
      return h +
        '<div class="pill amb" style="display:block;padding:9px;text-align:left">' +
          'No site on his record yet.</div>' +
        '<div class="row" style="margin-top:7px">' +
          '<button class="btn sm gry" data-act="cp-sitenew" data-p="' + p + '">+ A new site</button></div>';
    }
    h += '<div class="row" style="flex-wrap:wrap;gap:6px">' +
      st.map(function (x) {
        return '<button class="btn sm ' + (z.site === x.name ? '' : 'gry') +
          '" data-act="cp-site" data-p="' + p + '" data-s="' + esc(x.name) + '">' + esc(x.name) + '</button>';
      }).join("") +
      '<button class="btn sm ' + (z.site ? 'gry' : '') + '" data-act="cp-site" data-p="' + p + '" data-s="">None</button>' +
      '<button class="btn sm gry" data-act="cp-sitenew" data-p="' + p + '">+ A new site</button>' +
      '</div>';
    return h;
  }

  /* ---------- WHICH DELIVERY IS IT COMING BACK OFF ----------
     v1.5 - it used to be a box asking for a challan number "if you know it", which meant
     it was usually blank or wrong, and a return that cannot be tied to its delivery cannot
     be checked against what actually went out. His last deliveries are buttons, newest
     first, each showing the paper book number too because that is the one the godown
     reads off the challan in his hand. */
  function againstPicker(z, cl) {
    var mine = challans().filter(function (c) { return lower(c.customerName) === lower(cl && cl.name); });
    var list = newestFirst(mine).slice(0, 12);
    var h = '<label>Against which delivery?</label>';
    if (!list.length) {
      return h + '<div class="pill amb" style="display:block;padding:9px;text-align:left">' +
        'Nothing has gone out to him on this app yet.</div>';
    }
    h += '<div class="row" style="flex-wrap:wrap;gap:6px">' +
      list.map(function (c) {
        var mn = manualNoFor(c);
        return '<button class="btn sm ' + (z.against === c.challanNo ? '' : 'gry') +
          '" data-act="rt-against" data-n="' + esc(c.challanNo) + '">' + esc(c.challanNo) +
          (mn ? ' <b style="opacity:.75">B' + esc(mn) + '</b>' : '') + '</button>';
      }).join("") +
      '<button class="btn sm ' + (z.against ? 'gry' : '') + '" data-act="rt-against" data-n="">Not sure</button>' +
      '</div>' +
      (mine.length > list.length ? '<div class="muted" style="margin-top:5px">His last 12 of ' + mine.length + '.</div>' : '');
    return h;
  }

  /* Why it came back. Five answers cover almost everything, and a picked one can be
     counted later - "damaged" across a month is a number worth having. Anything else is
     still typeable, deliberately, because the sixth reason always exists. */
  var RT_REASONS = ["Extra material", "Wrong size", "Damaged", "Not required", "Wrong item sent"];
  function reasonPicker(z) {
    var known = RT_REASONS.indexOf(z.reason) >= 0;
    var h = '<label>Why is it coming back?</label>' +
      '<div class="row" style="flex-wrap:wrap;gap:6px">' +
      RT_REASONS.map(function (r) {
        return '<button class="btn sm ' + (z.reason === r ? '' : 'gry') +
          '" data-act="rt-reason" data-n="' + esc(r) + '">' + esc(r) + '</button>';
      }).join("") +
      '<button class="btn sm ' + (z.reasonOther ? '' : 'gry') + '" data-act="rt-reason" data-n="" data-other="1">Something else</button>' +
      '</div>';
    if (z.reasonOther) {
      h += '<input id="r_reason" placeholder="In a few words" value="' +
        esc(known ? "" : (z.reason || "")) + '" style="margin-top:7px"/>';
    }
    return h;
  }

  function viewMake() {
    var z = S.ch;
    if (!z) {
      var f = S.chFilter || "all";
      var list = newestFirst(chFiltered(f));
      var hidden = olderCount(challans());
      var h = '<div class="card" style="background:#0f766e;color:#fff;border-color:#0f766e">' +
        '<div style="font-size:17px;font-weight:800">Send material out</div>' +
        '<div style="font-size:12.5px;opacity:.9;margin-top:3px">Pick the client, add the material, write the book number. It saves as a <b>draft</b> — the accounts desk passes it before it counts against his account.</div></div>' +
        '<button class="btn full" data-act="ch-new" style="margin:12px 0">+ New challan</button>' +
        /* v1.18.0 - if the server sent no clients for this sign-in, SAY SO here, where the
           man is about to press New challan and find an empty picker. The rest of the app -
           receipts, the approve queue, every challan already pulled - still works, which is
           exactly why refusing the whole book over this was the wrong answer. */
        (clients().length ? "" :
          '<div class="card" style="border-color:#fbbf24;background:#fffbeb">' +
          '<h3 style="margin:0">No clients came back for your sign-in</h3>' +
          '<div class="meta" style="margin-top:4px">The server answered, but sent an empty ' +
          'client list, so <b>a new challan cannot be started</b>. Everything already on this ' +
          'phone still works \u2014 receipts, approvals and the challans below. ' +
          'Ask the office to check what your name is allowed to see.</div>' +
          '<div class="acts" style="margin-top:10px">' +
          '<button class="btn sm ghost" data-act="refresh">Try pulling again</button></div></div>') +
        searchBox() + statBar() + chChips();
      if (!list.length) {
        return h + '<div class="empty">Nothing here' +
          (f === "all" ? ' in the last 60 days.' : ' under that heading.') + '</div>' +
          showAllBar(hidden, 'than 60 days');
      }
      var val3 = list.reduce(function (a, c) { return a + chValue(c); }, 0);
      h += '<div class="muted" style="font-weight:700;margin:8px 2px 4px">' +
        list.length + ' challan' + (list.length === 1 ? '' : 's') + ' · ' + money(val3) +
        ' · newest first</div>';
      h += execBands(list);
      return h + showAllBar(hidden, 'than 60 days');
    }
    var cl = clientByName(z.client) || {};
    var lines = z.items || [];
    var goods = lines.reduce(function (a, l) {
      var d = l.disc === "" || l.disc == null ? clientDiscount(z.client, l.brand) : num(l.disc);
      return a + num(l.qty) * Math.round(num(l.rate) * (1 - d / 100));
    }, 0);
    var h = '<div class="row" style="margin:6px 0 10px"><button class="btn sm gry" data-act="ch-cancel">&#8592; Back</button>' +
      '<div class="grow" style="font-weight:800;font-size:16px">New challan</div></div>';

    h += clientPicker(z, cl);

    h += '<div class="card"><div class="row"><div class="grow" style="font-weight:800">Material</div>' +
      '<button class="btn sm" data-act="pk-open" data-into="ch">+ Add material</button></div>';
    if (!lines.length) {
      h += '<div class="empty" style="padding:16px 8px">Nothing on this challan yet.</div>';
    } else {
      h += lines.map(function (l, i) {
        var d = l.disc === "" || l.disc == null ? clientDiscount(z.client, l.brand) : num(l.disc);
        var net = num(l.qty) * Math.round(num(l.rate) * (1 - d / 100));
        return '<div class="line"><div class="grow">' +
          '<div style="font-weight:700;font-size:13.5px">' + esc(l.desc) + '</div>' +
          '<div class="muted">' + esc(l.code) + ' · ' + num(l.qty) + ' ' + esc(l.unit || "") +
            ' × ' + money(l.rate) + (d ? ' &minus;' + d + '%' : '') + '</div></div>' +
          '<div style="font-weight:800;white-space:nowrap">' + money(net) + '</div>' +
          '<button class="btn sm gry" data-act="ln-del" data-i="' + i + '">&times;</button></div>';
      }).join("");
      h += '<div class="row" style="margin-top:9px"><div class="grow muted">' + lines.length + ' line' + (lines.length === 1 ? '' : 's') + '</div>' +
        '<div class="big">' + money(goods) + '</div></div>';
    }
    h += '</div>';

    h += '<div class="card"><div class="grid2">' +
      '<div><label>Freight</label><input id="m_freight" inputmode="decimal" value="' + esc(z.freight || "") + '"/></div>' +
      '<div><label>Freight borne by</label><select id="m_fto">' +
        /* v1.6 - his words: "Client will be by defult in rare case its to be borne by
           Energy World". Client is first AND is what an untouched form saves. */
        ['Client','Energy World'].map(function (o) { return '<option' + (String(z.fto || "Client") === o ? ' selected' : '') + '>' + o + '</option>'; }).join("") +
      '</select></div></div>' +
      driverPicker(z) +
      /* v1.6.1 - small, and in the corner. It shouted because every challan used to be
         written in the paper book first; now they are made here, so it keeps its job and
         loses its size. Optional, printed on the challan, shown in hisab - just quiet. */
      '<div class="bookno">' +
        '<label for="m_manual">Manual Challan No</label>' +
        '<input id="m_manual" class="' + (z.manual ? 'has' : '') + '" inputmode="numeric" placeholder="1247" ' +
          'title="The number in the paper challan book - optional" value="' + esc(z.manual || "") + '"/>' +
        '<span>' + (z.manual ? '&#10003;' : '') + '</span>' +
      '</div>' +
      '</div>';

    h += '<button class="btn full" data-act="ch-save" style="margin:14px 0 6px">Create the challan</button>' +
      '<div class="muted" style="text-align:center;margin-bottom:10px">It is saved as a <b>draft</b>. ' +
      (canApprove() ? 'You can pass it yourself on the Approve screen.' : 'The accounts desk passes it.') + '</div>';
    return h;
  }

  /* ---------- THE DRIVER, AND HIS LORRY ----------
     v1.4 - the owner's rule: if it is already on the book, it is picked, not typed. A driver
     typed as free text can never be totalled, so freight per driver becomes guesswork, and
     "Ramesh", "ramesh" and "Ramesh ji" become three men. Picking him fills in his vehicle and
     his mobile from his own record. The lorry can still be overridden for the day he is in a
     different one - that is a real thing that happens - but it starts from his own. */
  function driverPicker(z, pfx) {
    var p = pfx || "m";
    var list = ((S.data && S.data.drivers) || []).filter(function (d) { return String(d.name || "").trim(); });
    var picked = list.filter(function (d) { return lower(d.name) === lower(z.driver); })[0];
    var h = '<label>' + (p === "r" ? 'Driver who brought it back' : 'Driver') + '</label>';
    if (!list.length) {
      return h + '<div class="pill amb" style="display:block;padding:9px;text-align:left">' +
        'No drivers on the register yet.</div>' +
        '<div class="row" style="margin-top:7px">' +
        '<button class="btn sm" data-act="dv-new" data-p="' + p + '">+ Add a driver</button></div>';
    }
    /* v1.19.0 - "driver name also drop down, else add new, drive mobile and vehile no auto
       update". Picking him has always filled his number and his lorry; the change is that
       the register is a dropdown rather than a row of buttons that grows every time a new
       man joins. Alphabetical, because a register you scan is a register in order. */
    h += '<select class="dv-sel" data-p="' + p + '">' +
      '<option value="">&mdash; nobody yet &mdash;</option>' +
      list.slice().sort(function (a, b) { return alpha(a.name, b.name); }).map(function (d) {
        return '<option value="' + esc(d.name) + '"' + (lower(d.name) === lower(z.driver) ? ' selected' : '') + '>' +
          esc(d.name) + (d.vehicle ? '  ·  ' + esc(d.vehicle) : '') + '</option>';
      }).join("") + '</select>' +
      '<div class="row" style="margin-top:6px">' +
      '<button class="btn sm gry" data-act="dv-new" data-p="' + p + '">+ New driver</button></div>';
    if (picked) {
      var _dt = driverType(picked);
      h += '<div class="muted" style="margin-top:6px">' +
        (picked.mobile ? esc(picked.mobile) + ' · ' : '') +
        '<b>' + esc(z.veh || picked.vehicle || "no vehicle on his record") + '</b>' +
        (_dt ? ' · ' + esc(_dt) : ' · <b style="color:#b45309">vehicle type not set</b>') + '</div>';
      if (p === "m") {
        h += '<label>Vehicle today</label>' +
          '<input id="m_veh" placeholder="' + esc(picked.vehicle || "vehicle number") + '" value="' + esc(z.veh || "") + '"/>' +
          '<div class="muted" style="margin-top:3px">Leave it blank and his own lorry is used. Fill it only if he is in a different one today.</div>';
      }
    }
    return h;
  }

  /* The whole register entry, on one sheet, in the order the godown actually knows it:
     his name, his number, the lorry he came in, and what kind of lorry it is. */
  function sheetDriverNew(pfx) {
    var d = S.dnew || {};
    return '<h2>Add a driver</h2>' +
      '<div class="muted" style="margin-bottom:10px">He goes on the register once, and after ' +
      'that he is a button on every challan &mdash; his number and his lorry filling themselves in.</div>' +
      '<label>Name</label>' +
      '<input id="dn_name" placeholder="As everybody calls him" value="' + esc(d.name || "") + '"/>' +
      '<label>Mobile</label>' +
      '<input id="dn_mob" inputmode="numeric" placeholder="10 digits" value="' + esc(d.mobile || "") + '"/>' +
      '<label>Vehicle number</label>' +
      '<input id="dn_veh" placeholder="HR-06-AB-1234" value="' + esc(d.vehicle || "") + '"/>' +
      '<label>Vehicle type</label>' +
      '<div class="row" style="flex-wrap:wrap;gap:6px">' +
      VEHICLE_TYPES.map(function (t) {
        return '<button class="btn sm ' + (d.vtype === t ? '' : 'gry') +
          '" data-act="dn-type" data-t="' + esc(t) + '">' + esc(t) + '</button>';
      }).join("") + '</div>' +
      '<div class="muted" style="margin-top:6px">The type is what lets the freight be worked out ' +
      'per driver later &mdash; a tempo and a full lorry do not cost the same for the same load.</div>' +
      '<div class="row" style="margin-top:16px;gap:8px">' +
        '<button class="btn gry grow" data-act="close">Cancel</button>' +
        '<button class="btn grow" data-act="dn-save" data-p="' + esc(pfx || "m") + '">Add him</button>' +
      '</div>';
  }

  function statBar() {
    var p = pendingApproval().length, m = missingReceipts().length;
    return '<div class="stats">' +
      '<div class="stat ' + (p ? 'bad' : 'good') + '"><div class="n">' + p + '</div><div class="l">Waiting to be passed</div></div>' +
      '<div class="stat ' + (m ? 'bad' : 'good') + '"><div class="n">' + m + '</div><div class="l">No signed receipt yet</div></div>' +
      '</div>';
  }

  function chRow(c) {
    var mn = manualNoFor(c), pf = proofFor(c), st = chStatus(c), held = chHeld(c);
    return '<div class="card" style="padding:11px 12px">' +
      '<div class="row"><div class="grow">' +
        '<div style="font-weight:800;font-size:14.5px">' + esc(c.customerName || "-") + '</div>' +

        '<div style="margin-top:5px">' +
          (held ? '<span class="pill amb">Held on this phone</span> ' : '') +
          (st === "Draft" ? '<span class="pill red">Not passed yet</span>' : '<span class="pill grn">' + esc(st) + '</span>') +
          (pf ? ' <span class="pill grn">Receipt attached</span>'

        '<div style="text-align:right"><div class="big">' + money(chValue(c)) + '</div>' +

      '</div>' +

               : '<span class="pill amb">Receipt is attached by the office</span>')) +

                  : '<button class="btn sm" data-act="ch-approve" data-no="' + esc(c.id || c.challanNo) + '">Pass it</button>')
          : '') +
      '</div></div>';

  /* ---------- 2. MATERIAL RETURN ---------- */
  function viewReturn() {
    var z = S.rt;
    if (!z) {
      var allRt = newestFirst(returns());
      var last = allRt.slice(0, 12);
      return '<div class="card" style="background:#b45309;color:#fff;border-color:#b45309">' +
        '<div style="font-size:17px;font-weight:800">Take material back in</div>' +
        '<div style="font-size:12.5px;opacity:.92;margin-top:3px">Goods coming back off a site. It carries a signed goods-in receipt exactly the way a delivery does — that piece of paper is what settles the argument later.</div></div>' +
        '<button class="btn full amb" data-act="rt-new" style="margin:12px 0">+ Register a return</button>' +
        (last.length ? '<div class="muted" style="font-weight:700;margin:16px 2px 4px">' +
          (allRt.length > last.length ? 'The last 12 of ' + allRt.length + ' returns' : 'Every return on the book') +
          '</div>' + last.map(rtRow).join("") : '<div class="empty">No returns on the book yet.</div>');
    }
    var lines = z.items || [];
    var tot = lines.reduce(function (a, l) { return a + num(l.qty) * num(l.rate); }, 0);
    var h = '<div class="row" style="margin:6px 0 10px"><button class="btn sm gry" data-act="rt-cancel">&#8592; Back</button>' +
      '<div class="grow" style="font-weight:800;font-size:16px">Material return</div></div>';
    /* v1.5 - the very same district -> area -> name walk the delivery form uses. It was
       a free-text box with a datalist behind it, which is a box: 118 names, and a return
       filed against "Vidhur sharma" is a return filed against nobody. */
    var rcl = clientByName(z.client) || {};
    h += clientPicker(z, rcl, "r");
    if (rcl && rcl.name) {
      h += '<div class="card">' + againstPicker(z, rcl) + reasonPicker(z) + '</div>';
    }
    h += '<div class="card"><div class="row"><div class="grow" style="font-weight:800">Material coming back</div>' +
      '<button class="btn sm amb" data-act="pk-open" data-into="rt">+ Add material</button></div>';
    if (!lines.length) h += '<div class="empty" style="padding:16px 8px">Nothing added yet.</div>';
    else {
      h += lines.map(function (l, i) {
        return '<div class="line"><div class="grow">' +
          '<div style="font-weight:700;font-size:13.5px">' + esc(l.desc) + '</div>' +
          '<div class="muted">' + esc(l.code) + ' · ' + num(l.qty) + ' ' + esc(l.unit || "") + ' × ' + money(l.rate) + '</div></div>' +
          '<div style="font-weight:800;white-space:nowrap">' + money(num(l.qty) * num(l.rate)) + '</div>' +
          '<button class="btn sm gry" data-act="rln-del" data-i="' + i + '">&times;</button></div>';
      }).join("");
      h += '<div class="row" style="margin-top:9px"><div class="grow muted">' + lines.length + ' line' + (lines.length === 1 ? '' : 's') + '</div>' +
        '<div class="big">' + money(tot) + '</div></div>';
    }
    h += '</div>';
    h += '<div class="card">' + driverPicker(z, "r") +
      '<label>Freight</label><input id="r_freight" inputmode="decimal" value="' + esc(z.freight || "") + '"/>' +
      '</div>';
    h += '<button class="btn full amb" data-act="rt-save" style="margin:14px 0 6px">Register the return</button>' +
      '<div class="muted" style="text-align:center;margin-bottom:10px">Attach the signed goods-in receipt straight after — the button appears on the return.</div>';
    return h;
  }

  function rtRow(r) {
    var pf = proofFor(r);
    var items = (function () { try { var l = JSON.parse(r.itemsJson || "[]"); return Array.isArray(l) ? l : []; } catch (e) { return []; } })();
    var tot = items.reduce(function (a, l) { return a + num(l.qty) * num(l.rate); }, 0);
    return '<div class="card" style="padding:11px 12px">' +
      '<div class="row"><div class="grow">' +
        '<div style="font-weight:800;font-size:14.5px">' + esc(r.customerName || "-") + '</div>' +
        '<div class="muted" style="margin-top:2px">' + esc(r.returnNo || "") + ' · ' + esc(dstr(d10(r.createdAt))) +
          (r.againstNo || r.challanNo ? ' · against ' + esc(r.againstNo || r.challanNo) : '') + '</div>' +
        '<div style="margin-top:5px"><span class="pill amb">' + esc(r.status || "Raised") + '</span>' +
          (pf ? ' <span class="pill grn">Goods-in receipt attached</span>' : ' <span class="pill red">No goods-in receipt</span>') + '</div>' +
      '</div><div style="text-align:right"><div class="big">' + money(tot) + '</div></div></div>' +
      '<div class="acts">' +
        (pf ? '<a class="btn sm gry" href="' + esc(pf.url) + '" target="_blank" rel="noopener">See receipt</a>'
            : (canProof()
               ? '<button class="btn sm amb" data-act="rc-attach" data-id="' + esc(r.id) + '">Attach goods-in receipt</button>'
               : '<span class="pill amb">Receipt is attached by the office</span>')) +
      '</div></div>';
  }

  /* ---------- 3. THE APPROVAL QUEUE ---------- */
  function viewApprove() {
    var list = pendingApproval();
    var hidden = olderCount(pendingApproval(true));
    var h = searchBox() +
      '<div class="card" style="background:#0f766e;color:#fff;border-color:#0f766e">' +
      '<div style="font-size:17px;font-weight:800">' + list.length + ' waiting to be passed</div>' +
      '<div style="font-size:12.5px;opacity:.92;margin-top:3px">' +
      (canApprove()
        ? 'Read it, then pass it. Only a passed challan counts against the client’s account. Nothing is deleted here — passing adds a stamp, it does not change what the godown wrote.'
        : 'You can see what is waiting, but the accounts desk passes it. That is deliberate: the man who makes a challan is not the man who passes it.') +
      '</div></div>';
    h += showAllBar(hidden, 'than 60 days');
    if (!list.length) return h + '<div class="empty">Nothing waiting' +

    h += '<div class="muted" style="margin:10px 2px 4px">' + money(val2) + ' of material, oldest first</div>';
    return h + execBands(list.slice().reverse());

      '<div class="card" style="background:#b45309;color:#fff;border-color:#b45309">' +

      '<div style="font-size:12.5px;opacity:.92;margin-top:3px">A delivery with no signed paper is a delivery you cannot prove three months later, when he says he never got it. Photograph the signed challan and it is attached to this record for good.</div></div>';

  /* ---------- the account screen ---------- */
  function sheetAccount() {
    var on = !!bioSaved();
    return '<h2>This phone</h2>' +
      '<div class="muted" style="margin-bottom:10px">Signed in as <b>' + esc(S.user) + '</b> · ' + esc(S.role) + '</div>' +
      '<div class="card" style="margin-top:0"><div style="font-weight:700">What you may do</div>' +
        '<div class="muted">' + (canMake() ? 'Make challans and register returns. ' : '') +
        (canApprove() ? 'Pass challans made by the godown.' : 'Passing a challan is done by the accounts desk.') + '</div></div>' +
      '<div class="card" style="border-color:' + (on ? '#99f6e4' : '#e2e8f0') + ';background:' + (on ? '#f0fdfa' : '#fff') + '">' +
        '<div style="font-weight:700">Face ID / fingerprint ' + (on ? '<span class="pill grn">on</span>' : '<span class="pill">off</span>') + '</div>' +

  function chalPdf(c) {
    return ensurePdf().then(function () {
      var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
      var W = 210, L = 14, R = W - 14;
      var F = function (w) { doc.setFont("helvetica", w === "bold" ? "bold" : "normal"); };

      doc.setFillColor(15, 118, 110); doc.rect(0, 0, W, 26, "F");
      doc.setTextColor(255); F("bold"); doc.setFontSize(15);

      doc.text("Panipat  |  Sonipat  |  Karnal", L, 18);
      F("bold"); doc.setFontSize(12);
      doc.text("DELIVERY CHALLAN", R, 12, { align: "right" });
      F(); doc.setFontSize(9);
      doc.text(String(c.challanNo || ""), R, 18, { align: "right" });

      doc.setTextColor(15, 23, 42);
      var y = 36;
      var mn = manualNoFor(c);
      var fact = function (k, v, bold) {
        F(); doc.setFontSize(8); doc.setTextColor(100, 116, 139);
        doc.text(String(k).toUpperCase(), L, y);
        doc.setTextColor(15, 23, 42); F(bold ? "bold" : "normal"); doc.setFontSize(10.5);
        doc.text(String(v == null || v === "" ? "-" : v), L + 42, y);
        y += 7;
      };
      fact("Client", c.customerName, 1);
      if (c.site) fact("Site", c.site);
      fact("Date", dstr(d10(c.createdAt)));
      if (mn) fact("Book no", mn, 1);
      if (c.driver) fact("Driver", String(c.driver) + (c.vehicle ? " / " + c.vehicle : ""));
      fact("Status", chStatus(c));

      y += 3;
      doc.setDrawColor(226, 232, 240); doc.line(L, y, R, y); y += 7;
      F("bold"); doc.setFontSize(9); doc.setTextColor(100, 116, 139);
      doc.text("MATERIAL", L, y);
      doc.text("QTY", R - 22, y, { align: "right" });
      doc.text("UNIT", R, y, { align: "right" });
      y += 3; doc.line(L, y, R, y); y += 6;
      doc.setTextColor(15, 23, 42);

      chLines(c).forEach(function (l) {
        if (y > 262) { doc.addPage(); y = 22; }
        F(); doc.setFontSize(10);
        var name = doc.splitTextToSize(String(l.desc || l.code || ""), R - L - 46);
        doc.text(name, L, y);
        F("bold");
        doc.text(String(num(l.qty)), R - 22, y, { align: "right" });
        F(); doc.setFontSize(9);
        doc.text(String(l.unit || ""), R, y, { align: "right" });
        doc.setFontSize(7.5); doc.setTextColor(148, 163, 184);
        doc.text(String(l.code || ""), L, y + 3.6);
        doc.setTextColor(15, 23, 42);
        y += Math.max(9, name.length * 4.6 + 4.6);
      });

      if (y > 232) { doc.addPage(); y = 22; }
      y += 6; doc.setDrawColor(226, 232, 240); doc.line(L, y, R, y); y += 8;
      F(); doc.setFontSize(8.5); doc.setTextColor(100, 116, 139);
      doc.text("Received the above material in good order and condition.", L, y);
      y += 20;
      doc.setDrawColor(148, 163, 184);
      doc.line(L, y, L + 60, y); doc.line(R - 60, y, R, y);
      doc.setFontSize(8);
      doc.text("Receiver's signature", L, y + 4.5);
      doc.text("For Energy World", R - 60, y + 4.5);
      return doc;
    });
  }
