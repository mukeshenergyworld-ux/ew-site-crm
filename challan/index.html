/* Teal, not the collection app's maroon, so a man never mistakes one for the other.

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}

   syncBottomVar() on every paint and on every resize, so the last card can no longer be

.top .who{font-size:11.5px;color:#ccfbf1}
.sync{font-size:11px;color:#ccfbf1}
.btn{appearance:none;border:1px solid #0f766e;background:#0f766e;color:#fff;border-radius:10px;
  padding:11px 15px;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  min-height:44px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:#0f766e}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px;min-height:36px}
.btn.gry{background:#fff;border-color:#cbd5e1;color:#334155}

.btn.amb{background:#b45309;border-color:#b45309;color:#fff}
.btn.full{width:100%;padding:14px;font-size:16px}

/* ==== A TICK BOX IS NOT A TEXT FIELD (23 Aug 2026) ====
   The rule above is right for every field in this app and wrong for the two that are not
   fields: a bare checkbox inherited width:100% and took the whole line, so the label beside
   it dropped underneath. Found on the CRM's HISAB card, fixed everywhere at once. */
input[type="checkbox"],input[type="radio"]{width:auto;padding:0;min-height:0;flex:0 0 auto;
  -webkit-appearance:auto;appearance:auto}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin:11px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

  background:#f1f5f9;color:#475569;vertical-align:middle;white-space:nowrap}

   screen that ran the message straight off the right edge of the phone - so the release that
   made the app explain itself shipped an explanation nobody could read. Measured in a real
   browser at 390px before this rule existed. Its own class, so status chips keep theirs. */
.loginmsg{display:block;white-space:normal;word-break:break-word;text-align:left;
  line-height:1.45;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:12px;
  margin:0 0 12px;background:#fee2e2;color:#b91c1c}

.pill.amb{background:#fef3c7;color:#92400e}

.frnote.amb{background:#fffbeb;border-color:#fde68a;color:#92400e}
.frnote.grn{background:#f0fdfa;border-color:#99f6e4;color:#0f766e}
.frbox{background:#fff;border:1px solid #e2e8f0;border-radius:13px;margin:-4px 0 12px;overflow:hidden}

.frline:first-child{border-top:0}
.pill.grn{background:#ccfbf1;color:#0f766e}
.pill.blu{background:#dbeafe;color:#1d4ed8}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.muted{color:#64748b;font-size:12.5px}
.big{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:flex-end;cursor:pointer}
.sheet .inner{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;

.sheet h2{margin:0 0 3px;font-size:17px}
.empty{text-align:center;color:#64748b;padding:26px 14px;font-size:13.5px}

.nav button .cnt{display:inline-block;background:#b91c1c;color:#fff;border-radius:999px;padding:0 6px;font-size:10px;margin-left:3px}

.tile img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#f8fafc;flex:0 0 auto}
/* v1.19.0 - "add material brand view will ve small length box, like 2 to 3 brand again
   alphabatically in one line" and the same for the products inside. auto-fit does the
   deciding: a 390px phone gets 2 across, a laptop gets 3 or 4, and nothing is hard-coded

   auto-fill a 1200px laptop fitted SEVEN brands across, which is a wall of text, not a shelf.
   So: the phone works it out for itself (390px gives 2), and anything wider is pinned to 3. */

.pcard img{width:100%;height:62px;object-fit:contain;border-radius:8px;background:#f8fafc;display:block}
.pcard .step button{width:32px;height:34px;font-size:17px;border-radius:8px}
.pcard .step input{width:100%;text-align:center;font-weight:800;padding:6px 2px}
.pcard .step{gap:5px;margin-top:7px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:42px;height:42px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:20px;font-weight:800;cursor:pointer}
.step input{width:74px;text-align:center;font-weight:800}
.line{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f1f5f9}
/* v1.6.1 - the paper book number: one narrow field pushed to the right.
   v1.7.1 - his words: "show book no as Manual Challan No , in red highlighted , box sixze

.bookno label{margin:0;font-size:11px;font-weight:800;letter-spacing:.02em;color:#b91c1c;
  background:#fee2e2;border:1px solid #fecaca;border-radius:6px;padding:3px 8px;white-space:nowrap}
/* 16px, not 14. Below 16px iOS zooms the whole page on focus and never zooms back out,
   and this is the one field the godown types by hand on every single challan. */
.bookno input{width:104px;flex:0 0 auto;text-align:center;font-size:16px;font-weight:800;

.bookno input.has{border-color:#86efac;background:#f0fdf4}
.bookno span{width:14px;font-size:12px;color:#15803d}

  font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.exec .sub{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;white-space:nowrap}
.exec .car{font-size:13px;opacity:.85}
</style>

<body>
<div id="root"></div>
<!-- Nothing third-party is loaded here. The PDF builder is fetched the first time a
     challan is actually printed, never at start-up: this app has to open in a godown
     with one bar of signal. -->
<script>
(function () {
  "use strict";
  /* ==========================================================================
     ENERGY WORLD - CHALLAN & MATERIAL RETURN
     A separate app for the godown and the accounts desk, because the CRM does forty
     things and these two men do two. Everything on this screen is either sending
     material out or taking material back in.

     IT IS THE SAME BOOK. Same name and PIN as the Team CRM, same server, same
     Challans and Returns sheets, in exactly the same row shape and with exactly the
     same numbering - a challan made here is indistinguishable from one made in the
     CRM, and the CRM is not changed in any way by this app existing.

     WHO DOES WHAT (the owner's rule). This list is kept current on purpose - it was
     three lines out of date by 21 August and a header nobody trusts is worse than none.
       GODOWN   makes the challan and registers the return. What he makes is a DRAFT:
                it is not a delivery yet and nothing about it touches anybody's account.
       ACCOUNTS passes it, and marks it dispatched. Both need the approval PIN.
       ANYONE   attaches the signed receipt - but only AFTER it has been dispatched,
                because a receipt is for goods that have actually gone.
       ADMIN    alone checks the receipt and adds the delivery to the client's hisab,
                which is the last look before the money counts. He alone settles a
                driver's freight, and he alone decides who earns an incentive on it.
     Two pairs of eyes on every delivery. Nothing here can delete anything, ever:
     an approval is a row added, not a row changed.
     ========================================================================== */

  var APP_VERSION = "1.46.1";
  var GAS = "https://script.google.com/macros/s/AKfycbzVkPHWyPq-w8RFD_HdG0vCjmrfQvEUpcq_hhF9eDGa0ZbZ3rIx7N37an2DQRGmsxPK/exec";
  var STORE = "ew_challan_session";

  /* ==EW-CORE:BEGIN== built by tools/build_core.py — do not edit here, edit core/ew-core.js == */
/* ==EWCORE:idb== The IndexedDB door. */
/* ==EWCORE:idb== The IndexedDB door. */
  function idbOpen() {
    if (_idbP) return _idbP;
    _idbP = new Promise(function (res) {
      var done = false, fin = function (v) { if (!done) { done = true; res(v); } };
      try {
        if (!window.indexedDB) return fin(null);
        var rq = indexedDB.open(IDB_NAME, 1);
        rq.onupgradeneeded = function () {
          try { rq.result.createObjectStore(IDB_STORE); } catch (e) {}
        };
        rq.onsuccess = function () { fin(rq.result); };
        rq.onerror = function () { fin(null); };
        rq.onblocked = function () { fin(null); };
        /* Safari in private mode can leave open() hanging forever. The app must never wait
           on storage to start - it falls back to localStorage and carries on. */
        setTimeout(function () { fin(null); }, 2500);
      } catch (e) { fin(null); }
    });
    return _idbP;
  }
  function idbSet(k, v) {
    return idbOpen().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(IDB_STORE, "readwrite");
          t.objectStore(IDB_STORE).put(v, k);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
          t.onabort = function () { res(false); };
        } catch (e) { res(false); }
      });
    }).catch(function () { return false; });
  }
  function idbGet(k) {
    return idbOpen().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          var r = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(k);
          r.onsuccess = function () { res(r.result === undefined ? null : r.result); };
          r.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    }).catch(function () { return null; });
  }
  function idbDel(k) {
    return idbOpen().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(IDB_STORE, "readwrite");
          t.objectStore(IDB_STORE).delete(k);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
        } catch (e) { res(false); }
      });
    }).catch(function () { return false; });
  }
/* ==EWCORE:idb:END== */
/* ==EWCORE:bigbox== The big box: what will not fit in the shared 5 MB of localStorage. */
/* ==EWCORE:bigbox== The big box: what will not fit in the shared 5 MB of localStorage. */
  function bigGet(k) {
    if (Object.prototype.hasOwnProperty.call(_big, k)) return _big[k];
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function bigDel(k) { delete _big[k]; idbDel(k); try { localStorage.removeItem(k); } catch (e) {} }
  /* v1.10.0 - THE SAME WRITE, BUT IT ANSWERS.
     bigSet returned true whatever happened: the IndexedDB write is behind a promise and the
     localStorage fallback swallows its own exception. That was tolerable while the big box
     only ever held a CACHE - a catalogue that fails to store is re-fetched tomorrow and
     nobody is worse off. The write journal below is not a cache. It is the only copy of a
     challan a man typed in a basement, and if it did not store, he has to be told NOW, while
     he is still standing there and can write it in the paper book - not in three days when
     somebody notices the delivery is on no screen. */
  function bigSetX(k, v) {
    _big[k] = v;
    return idbSet(k, v).then(function (ok) {
      if (ok) { try { localStorage.removeItem(k); } catch (e) {} return true; }
      try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
    }).catch(function () {
      try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
    });
  }
/* ==EWCORE:bigbox:END== */
/* ==EWCORE:webauthn== Face ID / fingerprint plumbing. No PIN passes through any of it. */
/* ==EWCORE:webauthn== Face ID / fingerprint plumbing. No PIN passes through any of it. */
  function b64u(buf) {
    var b = new Uint8Array(buf), s2 = "";
    for (var i = 0; i < b.length; i++) s2 += String.fromCharCode(b[i]);
    return btoa(s2).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function randBytes(n) {
    var a = new Uint8Array(n); crypto.getRandomValues(a); return a;
  }
  function bioSaved() {
    try { return JSON.parse(localStorage.getItem(BIO_KEY) || "null"); } catch (e) { return null; }
  }
  function bioAvailable() {
    return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
  }
/* ==EWCORE:webauthn:END== */
/* ==EWCORE:tiny== The three-line helpers every app rewrote. */
  /* ---------- tiny helpers ---------- */
  function el(id) { return document.getElementById(id); }
  function lower(s) { return String(s == null ? "" : s).trim().toLowerCase(); }
  /* Pressing a button is a fresh start - never make a man wait out a backoff he can see. */
  function flushNow() { _flushFails = 0; _flushSkip = 0; flushSoon(); }
/* ==EWCORE:tiny:END== */
/* ==EWCORE:drive== Google Drive picture links, repaired to the one form that renders. */
  /* Normalise any Google-Drive image link to the one lh3 form that actually
     renders inside an <img>: https://lh3.googleusercontent.com/d/{ID}=w200
     The catalogue's "Pic" column mixes two shapes -
       .../d/{ID}=w200            -> works (thumbnail)
       .../d/{ID}/view?usp=w200   -> a Drive *viewer* path, NOT an image -> broken ?
     Grundfos, CPVC, CISTERN, LEO and many Accessory rows were all in the broken
     /view form (verified by load-testing: /view => ERROR, =w200 => loads).
     We repair every Drive link to =w200 here, so on-screen thumbnails, the
     catalogue, the price-list PDF and the quotation PDF all get a loadable URL,
     and any future /view paste self-heals. Non-Drive URLs pass through unchanged. */
  function driveImg(u, size) {
    u = String(u || "").trim();
    if (!u) return "";
    var m = u.match(/\/d\/([A-Za-z0-9_\-]{20,})/) || u.match(/[?&]id=([A-Za-z0-9_\-]{20,})/);
    if (!m) return u;
    return "https://lh3.googleusercontent.com/d/" + m[1] + "=w" + (size || 200);
  }
/* ==EWCORE:drive:END== */
/* ==EWCORE:crash== The app may not die silently. Found the hard way, 17 Aug. */
  /* THE ONE HONEST TEST OF "did the app draw itself". The header exists only after a real
     paint, so it cannot be fooled by data merely arriving. S.data could be, and was. */
  function painted() {
    try { return !!document.querySelector(".top"); } catch (e) { return false; }
  }
  function crashPut(where, e) {
    var o = { at: Date.now(), where: where || "", ver: APP_VERSION, user: S.user || "",
              msg: (e && e.message) ? String(e.message) : String(e),
              stack: String((e && e.stack) || "").split("\n").slice(0, 4).join(" | ") };
    try { localStorage.setItem(CRASH_KEY, JSON.stringify(o)); } catch (x) {}
    return o;
  }
  function crashLast() {
    try { return JSON.parse(localStorage.getItem(CRASH_KEY) || "null"); } catch (e) { return null; }
  }
  /* Anything that reaches the top, from anywhere, at any time. If the app never painted, the
     screen is dead anyway and is replaced. If it DID paint, he may be half way through a
     challan - so it says so in a toast and leaves his typing exactly where it is. */
  function crashHandle(where, e) {
    var o = crashPut(where, e);
    if (painted()) { try { toast("Something on that screen could not be drawn — tap ↻. (" + o.msg + ")"); } catch (x) {} }
    else crashScreen(o);
  }
/* ==EWCORE:crash:END== */
/* ==EWCORE:refresh== One tap: the latest book AND the latest build. */
  /* ============ WHAT THE REFRESH BUTTON IS ACTUALLY FOR (17 Aug 2026) ============
     Two different jobs hide behind one arrow, and this app only ever did the first:

       1. pull the book again  — it did this;
       2. come back on the NEW BUILD if one has been put up — it did not, and no screen in
          this app did. A release went up and every phone kept running the old one until
          somebody was rung and told to reinstall.

     WHERE THE VERSION COMES FROM. This app's own file on GitHub Pages, fetched past the
     browser cache, with APP_VERSION read straight out of it. Not the backend: that costs

     Both apps answered "what discount does this client get on this brand?" and they answered
     it DIFFERENTLY:

       this app  took the FIRST row the sheet happened to return

     The discounts sheet has three client|brand pairs carrying two rows each, one blank and

    }
    /* nothing dated has started yet - fall back to whatever was there before dates existed,
       and never to a rate that has not begun */
    return undated.length ? discPick(undated) : null;
  }
  function discRow(client, brand, onYmd) { return discRowOn(client, brand, onYmd); }
  function clientDiscount(client, brand) { var d = discRow(client, brand); return d ? Number(d.pct) || 0 : 0; }
  function realBrand(p) {
    var m = ((S.data && S.data.brandmap) || []).filter(function (x) { return String(x.catalogValue) === String(p.brand); })[0];
    return (m && m.brand) ? m.brand : "";
  }

  /* ---------- the paper book's own number ----------
     Append-only audit rows, the same channel the CRM writes to, so a number entered
     here shows on the challan and in HISAB there. Newest row wins; nothing is ever
     overwritten, so a correction keeps the history of what was written before. */
  var _mnCache = null;
  function manualNoMap() {
    if (_mnCache) return _mnCache;
    var m = {};
    ((S.data && S.data.audit) || []).forEach(function (r) {
      if (!r || String(r.action || "") !== "challan:manualno") return;
      var d = {};
      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }
      var at = String(r.createdAt || "");
      /* v1.10.0 - KEYED BY THE ID TOO. A challan written with no signal has no challan
         number yet, so a book number filed against it could only ever be keyed by "" and
         would be orphaned - and the book number is the one thing the customer's storeman
         quotes down the phone. The id is minted on this device and never changes, so it is
         the key that always exists. Both are indexed, so every row already on the sheet
         still resolves by number exactly as before. */
      [String(d.chId || d.challanId || "").trim(), String(d.challanNo || d.chNo || "").trim()]
        .forEach(function (k) {
          if (!k) return;
          if (!m[k] || at >= m[k].at) m[k] = { at: at, no: String(d.no || d.manualNo || "").trim() };
        });
    });
    _mnCache = m;
    return m;
  }
  function manualNoFor(c) {
    var m = manualNoMap();
    var hit = m[String((c && c.id) || "").trim()] || m[String((c && c.challanNo) || "").trim()];
    return hit ? hit.no : "";
  }
  function saveManualNo(chNo, chId, no, client) {
    _mnCache = null;
    return saveRow("audit", {
      id: "MN-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
      createdAt: new Date().toISOString(), actor: S.user || "",
      action: "challan:manualno", target: String(chNo || ""),
      /* v1.8.0 - chNo and chId are the names the CRM's manualNoMap actually reads:
             if (d.chId) byId[d.chId] = ...;  if (d.chNo) byNo[d.chNo] = ...
         This app wrote challanNo/challanId, so NEITHER branch ever ran and every book number
         typed in the godown since v1.6.1 was invisible at the desk - which is exactly when it is
         needed, because the customer's storeman rings quoting the book number and nothing else.
         The old names are kept alongside so this app's own reader, and any row already written,
         still resolve. */
      detail: JSON.stringify({ chNo: String(chNo || ""), chId: String(chId || ""),
        challanNo: String(chNo || ""), challanId: String(chId || ""),
                               no: String(no || ""), client: String(client || ""), by: S.user || "" })
    });
  }

  /* ---------- the signed receipt ----------
     Same audit channel the CRM's delivery proofs already use, so a photo attached in the
     godown appears on the same challan in the CRM's HISAB with no server change at all. */
  /* THE KEY IS chId, NOT THE CHALLAN NUMBER. This is the CRM's own convention and it must
     be matched exactly, or a receipt attached in the godown would be invisible in HISAB and
     the CRM's proofs would be invisible here. A return is keyed the same way, by its own row
     id, which is why one action covers both. */
  var _proofCache = null;
  function proofMap() {
    if (_proofCache) return _proofCache;
    var m = {};
    ((S.data && S.data.audit) || []).forEach(function (r) {
      if (!r || String(r.action || "") !== "challan:proof") return;
      var d = {};
      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }
      if (!d.chId) return;
      var prev = m[d.chId];
      if (!prev || String(r.createdAt || "") >= String(prev.at || "")) {
        m[d.chId] = { at: r.createdAt || "", by: d.by || "", url: d.url || "",
                      actor: r.actor || "", photo: !!d.photo, thumb: String(d.thumb || "") };
      }
    });
    _proofCache = m;
    return m;
  }
  function proofFor(rec) {
    var id = (rec && rec.id) ? rec.id : rec;
    return proofMap()[String(id || "").trim()] || null;
  }
  function saveProof(rec, url, thumb, tg) {
    _proofCache = null;
    var isRet = !!rec.returnNo;
    var no = String(rec.challanNo || rec.returnNo || "");
    return saveRow("audit", {
      id: "PF-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
      createdAt: new Date().toISOString(), actor: S.user || "",
      action: "challan:proof",
      target: no + " / " + String(rec.customerName || ""),
      detail: JSON.stringify({
        chId: String(rec.id || ""), no: no, client: String(rec.customerName || ""),
        site: String(rec.site || ""), by: S.user || "", geo: "", url: String(url || ""),
        at: new Date().toISOString(), photo: true, sig: false,
        thumb: String(thumb || ""), kind: isRet ? "return" : "challan",
        /* v1.41.0 - the Telegram copy's link, kept beside the Drive one and never instead of
           it. Blank when the mirror failed, which is the honest record of a mirror that
           failed rather than a link that goes nowhere. */
        tg: String(tg || "")
      }), ip: ""
    });
  }
  /* ================= A RECEIPT MEANS THE DELIVERY WAS RECEIVED (v1.8.0) =========
     Filing the signed paper used to write an audit row and nothing else. `receiptReceived` was
     never set, so the money code - which keys on exactly that field, in the CRM, in HISAB and in
     the Payment app - never counted the delivery. Meanwhile missingReceipts() below cleared on
     the PROOF, so the challan also left the one list that would have caught it. Signed for,
     complete, and on nobody's screen.

     challanMove is the CRM's own endpoint for this transition, so the server owns it and only
     the status moves - no stale full-row write. If it fails the challan stays exactly as it was
     and the receipt is still filed; the delivery simply keeps showing as awaiting its receipt,
     which is the honest state and the one that gets it looked at again. */
  function markReceived(rec) {
    if (!rec || !rec.id || rec.returnNo) return Promise.resolve(null);   /* returns book in separately */
    if (String(rec.receiptReceived || "").toUpperCase() === "Y") return Promise.resolve(null);
    /* ================= A RECEIPT IS NOT AN APPROVAL (v1.10.0) ==================
       v1.8.0 made filing the paper mark the delivery received, which closed a real billing
       leak. It sent the challan to Received WHATEVER its status was - including Draft.

       So a challan nobody had passed could be moved straight to Received by attaching a
       photograph. Approving is the one action this app deliberately makes expensive: it
       re-asks for the PIN and tells the man "This releases material. It is not a formality."
       Attaching a photograph asked for nothing and skipped the whole step, and the challan
       then showed as Received having never been passed - so the approval queue, which is
       the record of who authorised material leaving the godown, simply never saw it.

       Measured against v1.9.1: a Draft challan, one attached receipt, no PIN asked for,
       no approvePin sent, and status Draft -> Received.

       The receipt still files - that paper is the thing that settles an argument and must
       never be refused. It is only the promotion that is refused, and the man is told
       which step is missing. */
    if (isDraft(rec)) {
      return Promise.resolve({ ok: false, blocked: true,
        error: "this challan has not been passed yet" });
    }
    /* v1.10.0 - and the move is journalled, so the window v1.8.0 left open is closed: the
       PDF was hosted and the proof row written, and then this call could still be lost, and
       nothing retried it. No PIN is carried - Received needs none, and an approval is never
       queued for exactly that reason. */
    var e = jrnPut({ pk: "P-" + Date.now() + "-" + (++_jrnSeq), kind: "move", id: rec.id,
                     to: "Received", by: S.user || "", at: Date.now(), err: "", tries: 0 });
    var land = function (r) {
      jrnDrop(e.pk);
      rec.status = "Received"; rec.receiptReceived = "Y";
      var arr = (S.data && S.data.challans) || [];
      for (var i = 0; i < arr.length; i++) {
        if (arr[i] && arr[i].id === rec.id) { arr[i].status = "Received"; arr[i].receiptReceived = "Y"; break; }
      }
      bust();
      return r;
    };
    return jrnSend(e).then(function (r) {
      if (r && r.ok) return land(r);
      jrnMark(e.pk, (r && r.error) || "the server refused it");
      /* NOT marked locally. The flag is what every money screen counts a delivery on, and
         missingReceipts() asks the flag and only the flag - so setting it here would drop
         the delivery off the one list that catches this, for a move that has not happened.
         It stays on the list until the server says otherwise. */
      return { ok: false, held: true, error: (r && r.error) || "the server refused it" };
    }).catch(function (err) {
      jrnMark(e.pk, (err && err.message) ? err.message : "no answer from the server");
      return { ok: false, held: true, error: (err && err.message) || "no answer from the server" };
    });
  }

  /* Deliveries with nothing signed against them. This is the list that stops an argument
     three months later, so it is a screen of its own rather than a footnote.
     v1.8.0 - it asks receiptReceived FIRST and the proof only as a secondary signal, so a
     delivery whose paper is filed but whose flag never moved cannot slip off this list. */
  function missingReceipts() {
    return challans().filter(function (c) {
      /* v1.8.0 - the AND was the whole trouble. A challan whose paper was filed but whose
         receiptReceived never moved satisfied !proofFor(c) === false and so dropped OFF this
         list - the one list that would have caught it - while every money screen still ignored
         it for want of the flag. The flag is now the only question asked. Filing a receipt sets
         it (markReceived), so this changes nothing for anything filed from v1.8.0 on; what it
         does is surface every delivery filed BEFORE it, which is exactly the backlog that needs
         looking at. */
      return String(c.receiptReceived || "").toUpperCase() !== "Y";
    }).sort(function (a, b) { return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  }

  /* v1.20.0: the delivery-book client list dies with the book too - a client the office
     added an hour ago must not be invisible because the first paint cached the old set. */
  function bust() { _mnCache = null; _proofCache = null; _dtCache = null; bustBookClients(); }

  /* v1.9.1 - remembered on the record itself. chRow() calls chLines three times per card and
     byExec()'s sort comparator calls chValue O(n log n) times, each re-running JSON.parse over
     the same string - on every letter typed into the search box. The cache hangs off the row, so
     it dies with the row when a pull replaces the book. */
  function chLines(c) {
    if (!c) return [];
    if (c.__lines) return c.__lines;
    var l;
    try { l = JSON.parse(c.itemsJson || "[]"); } catch (e) { l = []; }
    if (!Array.isArray(l)) l = [];
    try { Object.defineProperty(c, "__lines", { value: l, enumerable: false, configurable: true }); }
    catch (e) { return l; }
    return l;
  }
  function chValue(c) {
    if (!c) return 0;
    if (c.__value !== undefined) return c.__value;
    /* v1.41.0 - a further discount taken when this delivery was passed comes off here, which
       is this app's single expression for what a delivery is worth. The CRM takes it off in
       challanNet for the same reason. Floored at the goods so it can never go negative. */
    var _g = chLines(c).reduce(function (a, l) {
      var d = num(l.disc);
      return a + num(l.qty) * Math.round(num(l.rate) * (1 - d / 100));
    }, 0);
    var _x = Math.min(hisabExtra(c), _g);
    var v = _g - (_x > 0 ? _x : 0) + (String(c.freightTo) === "Client" ? num(c.freight) : 0);
    /* NOT enumerable: these rows are stringified into the offline snapshot and posted back to the
       server, and a cache must never travel with the data it describes. */
    try { Object.defineProperty(c, "__value", { value: v, enumerable: false, configurable: true }); }
    catch (e) {}
    return v;
  }
  /* ================= THE PRODUCT PICKER =================
     One level at a time, exactly as the CRM does it, because that is what the godown
     already knows: BRAND, then that brand's CATEGORY, then the products with their
     picture and a +/- stepper. The picture is there to stop the wrong 110 mm fitting
     going on the lorry; it never reaches the printed challan.
     Tap a crumb to go back up a level. */

  function brandsInStock() {
    var live = {};
    PRODUCTS.forEach(function (p) { var b = realBrand(p) || String(p.brand || "").trim(); if (b) live[b] = (live[b] || 0) + 1; });
    return Object.keys(live).sort().map(function (b) { return { name: b, n: live[b] }; });
  }
  function brandOf(p) { return realBrand(p) || String(p.brand || "").trim(); }
  function catsIn(brand) {
    var m = {};
    PRODUCTS.forEach(function (p) {
      if (brandOf(p) !== brand) return;
      var c = String(p.cat || "").trim() || "Other";
      m[c] = (m[c] || 0) + 1;
    });
    return Object.keys(m).sort(alpha).map(function (c) { return { name: c, n: m[c] }; });
  }
  function prodsIn(brand, cat) {
    return PRODUCTS.filter(function (p) {
      return brandOf(p) === brand && (String(p.cat || "").trim() || "Other") === cat;
    }).sort(function (a, b) { return String(a.desc).localeCompare(String(b.desc)); });
  }

  /* the basket the picker is filling - the challan builder or the return builder */
  /* ==========================================================================
     JOB WORK / LABOUR CHARGES  (v1.37.0, 20 August 2026)

     "add a item name Job work / Labor Charges. sometimes have to charge customer for job work
      under main hisab. selecting job work ask for job description and total amt, then continue
      with balance work"

     It is a line on the challan, not a screen of its own - "under main hisab" is the whole
     requirement. So it is carried in itemsJson exactly like every other line and needs no new
     column anywhere: qty 1 at a rate of the amount he types. Every total that already exists -
     the challan value, HISAB, the client's outstanding, the PDF - picks it up without knowing
     anything new, because nothing new was invented.

     disc IS FORCED TO ZERO, and that is not laziness. Line discounts are a brand's rate on a
     brand's goods; labour has no brand. Left blank, pricedLines() in the CRM would fall back
     to clientDiscount(client, "") and a man with a 12% preset would quietly have his labour
     bill cut by 12% - a discount nobody typed, on work nobody discounted.

     THE ONE THING THIS DOES NOT DECIDE: whether job work earns a partner an incentive. It
     flows into the challan value like any line, so today it would. That is a rule about his
     money and it is his to make - asked, not assumed. `job: true` and the JOBWORK code are
     both on the line so that whichever way he answers is one condition, not an archaeology. */
  var JOB_CODE = "JOBWORK";
  function isJobLine(l) { return !!(l && (l.job === true || String(l.code || "") === JOB_CODE)); }
  function jobLine(desc, amt) {
    return { code: JOB_CODE, desc: String(desc || "").trim(), unit: "job",
             qty: 1, rate: Math.round(num(amt)), brand: "", disc: 0, job: true };
  }
  /* ---- AN ITEM THAT IS NOT IN THE PRICE LIST  (v1.44.0, 23 August 2026) ----
     HIS WORDS: "or enter a item not in price list with description, made arrangemetn for that
     also". Two questions came with it and he answered both himself: it ASKS WHICH BRAND it
     belongs to, so its discount and everyone's incentive run through the machinery that already
     exists rather than a new rule; and it takes a DESCRIPTION, A QUANTITY AND A RATE rather than
     one lump, so that if some of it comes back months later retSourceLine() finds this very line
     by its code and credits what he was billed instead of guessing.

     Hence the OWN CODE on every one. Two off-list lines on a challan are two rows, not one row
     fought over by two quantity boxes, and each can be returned at its own price. */
  var OTHER_PFX = "X-";
  function isOtherLine(l) { return !!(l && String(l.code || "").indexOf(OTHER_PFX) === 0); }
  function otherLine(desc, qty, rate, brand) {
    return { code: OTHER_PFX + Date.now(), desc: String(desc || "").trim(), unit: "No's",
             qty: num(qty) || 1, rate: Math.round(num(rate)), brand: String(brand || ""), job: false };
  }

  function basket() { return S.pick && S.pick.into === "rt" ? (S.rt && S.rt.items) : (S.ch && S.ch.items); }
  function qtyOf(code) {
    var b = basket() || [];
    var hit = b.filter(function (l) { return l.code === code; })[0];
    return hit ? num(hit.qty) : 0;
  }

  /* ---- FIND A PRODUCT BY ITS NAME, ANYWHERE (20 Aug 2026) ----
     "on making challan also show option to search product by name, sometime a product is
     rarely dispatched and difficult to locate so can be typed name and searched."

     There WAS a search box, and that is exactly why this took so long to hear properly: it
     sat at the BOTTOM of the drill-down, after brand and after category, and it narrowed only
     the shelf you were already standing in front of. It is no help at all for the case he
     describes - a thing dispatched twice a year, whose brand nobody remembers. To find it you
     first had to know where it was, which is the whole problem.

     So the box moves to the top and searches the whole catalogue: name, code and brand. The
     drill-down stays exactly as it was for the ninety per cent of days when a man knows the
     brand and wants to see the shelf. */
  function prodsMatching(q) {
    var s = lower(q);
    if (s.length < 2) return [];
    return PRODUCTS.filter(function (p) {
      return lower(p.label).indexOf(s) >= 0 || lower(p.desc).indexOf(s) >= 0 ||
             lower(p.code).indexOf(s) >= 0 || lower(brandOf(p)).indexOf(s) >= 0;
    }).sort(function (a, b) { return String(a.desc).localeCompare(String(b.desc)); });
  }

  /* one product card, in one place, so the search results and the shelf cannot drift apart */
  function pcards(list, withBrand) {
    return '<div class="pgrid">' + list.map(function (x) {
      var have = qtyOf(x.code);
      return '<div class="pcard"' + (have ? ' style="border-color:#5eead4;background:#f0fdfa"' : '') + '>' +
        (x.pic ? '<img src="' + esc(x.pic) + '" alt="" loading="lazy"/>' : '') +
        '<div class="pn">' + esc(x.desc) + '</div>' +
        '<div class="pm">' + (withBrand ? '<b>' + esc(brandOf(x)) + '</b> \u00b7 ' : '') +
          esc(x.code) + (x.unit ? ' \u00b7 ' + esc(x.unit) : '') + ' \u00b7 ' + money(x.price) + '</div>' +
        '<div class="step">' +
          '<button data-act="pk-minus" data-code="' + esc(x.code) + '">&minus;</button>' +
          '<input class="pk-qty" data-code="' + esc(x.code) + '" inputmode="decimal" value="' + (have || "") + '" placeholder="0"/>' +
          '<button data-act="pk-plus" data-code="' + esc(x.code) + '">+</button>' +
        '</div></div>';
    }).join("") + '</div>';
  }

  function pickerHtml() {
    var p = S.pick || {};
    var q = lower(p.q || "");
    var box = '<div class="row" style="margin-bottom:8px"><input id="pk_q" class="grow" ' +
      'placeholder="Type a product name, code or brand\u2026" value="' + esc(p.q || "") + '"/></div>';

    /* A SEARCH BEATS THE DRILL-DOWN. Two letters is the floor: one letter matches half the
       catalogue and the wait to draw it is worse than no answer. */
    if (q.length >= 2) {
      var hits = prodsMatching(q);
      if (!hits.length) {
        return box + '<div class="empty">Nothing in the catalogue matches \u201c' + esc(p.q) +
          '\u201d \u2014 name, code or brand. If it is a new product it has to be added in the CRM first.</div>';
      }
      return box + '<div class="muted" style="margin:0 2px 6px">' + hits.length +
        ' product' + (hits.length === 1 ? '' : 's') + ' anywhere in the catalogue. ' +
        'Clear the box to go back to browsing by brand.</div>' + pcards(hits, true);
    }

    var h = box + '<div class="crumb">' +
      '<span class="c" data-act="pk-lvl" data-l="brand">Brand' + (p.brand ? ': ' + esc(p.brand) : '') + '</span>' +
      (p.brand ? '<span class="c" data-act="pk-lvl" data-l="cat">Category' + (p.cat ? ': ' + esc(p.cat) : '') + '</span>' : '') +
      '</div>';

    if (!p.brand) {
      var bl = brandsInStock();
      if (!bl.length) return h + '<div class="empty">The catalogue has not loaded yet. Pull the latest and try again.</div>';
      /* v1.19.0 - "small length box, like 2 to 3 brand again alphabatically in one line".
         brandsInStock() already sorts; this only changes how many fit across. */
      h += '<div class="grid">' + bl.map(function (b) {
        return '<button class="gtile" data-act="pk-brand" data-b="' + esc(b.name) + '">' +
          esc(b.name) + '<span class="sub">' + b.n + ' product' + (b.n === 1 ? '' : 's') + '</span></button>';
      }).join("") + '</div>';
      return h;
    }
    if (!p.cat) {
      h += '<div class="grid">' + catsIn(p.brand).map(function (c) {
        return '<button class="gtile" data-act="pk-cat" data-c="' + esc(c.name) + '">' +
          esc(c.name) + '<span class="sub">' + c.n + ' product' + (c.n === 1 ? '' : 's') + '</span></button>';
      }).join("") + '</div>';
      return h;
    }
    var list = prodsIn(p.brand, p.cat);
    if (!list.length) return h + '<div class="empty">Nothing on this shelf.</div>';
    /* v1.19.0 - "inside also 2 to 3 priducts in single line, all alphabatically".
       prodsIn() already sorts by description. One full-width card per product meant a man
       scrolled six times to see six items he knew the names of; now he sees the shelf.
       A line already in the challan keeps its green ring so it is findable at a glance. */
    return h + pcards(list, false);
  }

  function sheetPicker() {
    var n = (basket() || []).length;
    return '<h2>Add material</h2>' +
      '<div class="muted" style="margin-bottom:10px">' + n + ' line' + (n === 1 ? '' : 's') + ' so far. Set a quantity and it is in — no separate Add button.</div>' +
      /* not buried under a brand, because it belongs to no brand */
      (S.pick && S.pick.into === "rt" ? '' :
        '<button class="btn sm gry full" data-act="job-open" style="margin-bottom:8px">' +
        '&#128295; Job work / Labour charges</button>' +
        '<button class="btn sm gry full" data-act="oth-open" style="margin-bottom:10px">' +
        '&#43; Item not in the price list</button>') +
      '<div id="pk_body">' + pickerHtml() + '</div>' +
      '<div class="acts" style="margin-top:14px"><button class="btn full" data-act="close">Done</button></div>';
  }

  /* Two boxes, because he named two: "ask for job description and total amt". No rate, no
     quantity, no unit - a job is one job. Whatever is typed here is read back on save the
     same way every other form in this estate does it, so a repaint cannot take it away. */
  function sheetJobWork() {
    var j = S.job || { desc: "", amt: "" };
    return '<h2>Job work / Labour charges</h2>' +
      '<div class="muted" style="margin-bottom:10px">This goes on the challan as its own line ' +
      'and into the customer&rsquo;s hisab with everything else.</div>' +
      '<label for="jw_desc">What was done</label>' +
      '<input id="jw_desc" value="' + esc(j.desc || "") + '" placeholder="e.g. Concealed piping labour, 2nd floor"/>' +
      '<label for="jw_amt">Total amount</label>' +
      '<input id="jw_amt" inputmode="numeric" value="' + esc(j.amt || "") + '" placeholder="0"/>' +
      '<div class="acts" style="margin-top:14px">' +
        '<button class="btn gry" data-act="job-cancel">Cancel</button>' +
        '<button class="btn" data-act="job-add">Add to the challan</button></div>';
  }

  /* Four boxes and a brand, because the brand is the whole of the money answer. The discount
     it will actually bill at is shown BEFORE he saves, not discovered afterwards on a
     statement. */
  function sheetOther() {
    var x = S.oth || { desc: "", qty: "", rate: "", brand: "" };
    var cn = String((S.ch && S.ch.client) || "");
    /* v1.44.0 - NOT S.data.brands. This app deliberately does not download that tab (nothing
       read it, so it was dropped from the staged pull), and a dropdown built from it would have

    var brands = brandsInStock().map(function (br) { return br.name; });

  /* Setting a quantity IS adding the line - there is no second button to forget. A
     quantity of zero takes it out again. */
  function setQty(code, q) {
    var into = S.pick && S.pick.into === "rt" ? "rt" : "ch";
    var holder = into === "rt" ? S.rt : S.ch;
    if (!holder) return;
    holder.items = holder.items || [];
    var prod = PRODUCTS.filter(function (x) { return x.code === code; })[0];
    if (!prod) return;
    var qn = num(q);
    var i, hit = -1;
    for (i = 0; i < holder.items.length; i++) if (holder.items[i].code === code) { hit = i; break; }
    if (qn <= 0) { if (hit >= 0) holder.items.splice(hit, 1); return; }
    var line = { code: prod.code, desc: prod.desc, unit: prod.unit, qty: qn, rate: prod.price,
                 brand: brandOf(prod), disc: "" };
    if (hit >= 0) holder.items[hit] = Object.assign({}, holder.items[hit], { qty: qn }); else holder.items.push(line);
  }

  /* ---------------------------------------------------------------------------
     HOW OLD IS THIS BOOK, HONESTLY  (18 Aug 2026)

     HIS REPORT: "client added in crm not showing in challan app on mobile."

     The client WAS in the CRM. Checked against the two books side by side on one machine:
     the CRM held 147 clients, the Challan app held the same 147, and not one was missing.
     The backend was not withholding anything.

     What the header said was:

         updated 15:17

     built with toTimeString(). NO DATE. So a book pulled yesterday afternoon, or last week,
     reads exactly like one pulled five minutes ago. A man adds a client, opens this app,
     sees a fresh-looking time, and concludes the app is broken - when what he actually has
     is an old copy that never re-pulled, usually because the pull failed quietly on one bar
     of signal and the app kept showing the last good time.

     The app was hiding the one fact that explains the whole complaint. Same fault as the
     login that said "Network error" five ways, and the blank district list: the screen
     destroying the evidence needed to read it.

     Now it says the AGE, and it gets louder as the book gets older. */
  function bookAge(ts) {
    ts = Number(ts) || 0;
    if (!ts) return { txt: "never pulled onto this phone", tone: "bad" };
    var ms = Date.now() - ts, d = new Date(ts);
    var hhmm = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    if (ms < 120000) return { txt: "updated just now", tone: "ok" };
    /* same calendar day, not "within 24 hours" - a book from 11pm last night is yesterday's
       book at 8am, and calling it "9 hours old" invites him to trust it */
    var today = new Date();
    var sameDay = d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() &&
                  d.getDate() === today.getDate();
    if (sameDay) return { txt: "updated " + hhmm, tone: ms > 7200000 ? "warn" : "ok" };
    var days = Math.floor(ms / 86400000);
    if (days <= 1) return { txt: "from YESTERDAY " + hhmm, tone: "bad" };
    return { txt: days + " DAYS OLD (" + hhmm + ")", tone: "bad" };
  }
  /* ---- "NOT UPLOADED", SAID WHERE HE IS ALREADY LOOKING (20 Aug 2026) ----
     The other half of "show upload status on every app ... not uploaded or created".

     A record written while the signal was gone is held in the journal and shown on its own
     row - the Challan app has said "Held on this phone" for months. What was missing is the
     COUNT, somewhere a man sees without going to look for it. That matters because the
     dangerous case is the one nobody suspects: the godown writes a challan, it appears on his
     screen exactly like a saved one, and it exists for him and for nobody else. He has no
     reason to go hunting for a pill.

     So it sits in the freshness line at the top, next to how old the book is, which is the
     one place he already reads when he wonders whether what he is looking at is real. */
  function heldSay() {
    var n = 0;
    try { n = jrnCount(); } catch (e) { n = 0; }
    if (!n) return "";
    return '<span class="sync" style="font-weight:800;color:#fecaca"> · ' + n +
      ' not uploaded yet</span>';
  }

  function bookAgeHtml(ts, busy) {
    if (busy) return '<span class="sync">syncing&hellip;</span>';
    var a = bookAge(ts);
    /* v1.28.0 - and what the last pull cost, in the one place a man already looks to ask how
       fresh this is. It is measured, not estimated: the seconds are wall clock around the
       call and the KB is the length of the reply. */
    var w = wireSay();
    var tail = w ? '<span class="sync" style="opacity:.65"> \u00b7 ' + esc(w) + '</span>' : '';
    if (a.tone === "ok") return '<span class="sync">' + esc(a.txt) + '</span>' + tail + heldSay();
    return '<span class="sync" style="font-weight:800;color:' +
      (a.tone === "bad" ? "#fecaca" : "#fde68a") + '">' + esc(a.txt) + '</span>' + tail + heldSay();
  }
  function header() {
    /* 18 Aug: was toTimeString() with no date - see bookAge(). */
    return '<div class="top">' + newVerBar() + '<div class="t1">' +

  /* ---------- 1. THE DELIVERY BOOK ----------
     v1.2 - THIS SCREEN IS THE BOOK, NOT A GLANCE AT IT.
     It used to open with a strip headed "the last few you made": six challans, and only the
     ones the man signed in had created himself. It was meant as a "did my last one save?"
     check. But it is the first thing on the main screen, so of course it reads as THE LIST -
     and on a book of 81 challans, all made by one man, it showed six of them and looked as
     though the rest had gone. That is the whole complaint and it was a fair one.
     It now shows every challan, everyone's, newest first, with chips to narrow it. */
  var CH_FILTERS = [
    ["all",     "All"],
    ["draft",   "Approval pending"],
    ["noproof", "Receipt pending"],
    ["mine",    "Mine"]
  ];
  function chFiltered(kind) {
    var list = challans().filter(recent);
    if (kind === "draft")   return list.filter(isDraft);
    if (kind === "noproof") return list.filter(function (c) {
      return String(c.receiptReceived || "").toUpperCase() !== "Y";
    });
    if (kind === "mine")    return list.filter(function (c) { return lower(c.createdBy) === lower(S.user); });
    return list;
  }
  function chChips() {
    var f = S.chFilter || "all";
    return '<div class="row" style="flex-wrap:wrap;gap:6px;margin:2px 0 8px">' +
      CH_FILTERS.map(function (b) {
        var n = chFiltered(b[0]).length;
        if (!n && b[0] !== "all") return "";
        /* v1.32.0 - "pending receipts also to be highlighted in red". A count of nought is
           not a warning, so the red only appears when there is something to answer for. */
        var urgent = (b[0] === "draft" || b[0] === "noproof") && n > 0;
        var cls = (f === b[0]) ? (urgent ? 'red' : '') : 'gry';
        return '<button class="btn sm ' + cls + '" data-act="ch-filter" data-f="' + b[0] + '"' +
          (urgent && f !== b[0] ? ' style="border-color:#fecaca;color:#b91c1c"' : '') + '>' +
          esc(b[1]) + ' <b style="opacity:.75">' + n + '</b></button>';
      }).join("") + '</div>';
  }

  /* Challans laid out executive by executive, each band openable. One place builds it, so
     the delivery book, the approval queue and the receipts list all read the same way. */
  function execBands(list) {
    var groups = byExec(list);
    if (groups.length < 2) return list.map(chRow).join("");
    return groups.map(function (g) {
      var open = bandIsOpen(g.name);
      var val = g.list.reduce(function (a, c) { return a + chValue(c); }, 0);
      var noRc = g.list.filter(function (c) {
        return String(c.receiptReceived || "").toUpperCase() !== "Y";
      }).length;
      var draft = g.list.filter(isDraft).length;
      return '<div class="exec" data-act="band" data-n="' + esc(g.name) + '">' +
          '<span class="car">' + (open ? '&#9662;' : '&#9656;') + '</span>' +
          '<div class="grow">' + esc(g.name) +
            '<div style="font-size:11.5px;font-weight:600;opacity:.9">' +
              g.list.length + ' challan' + (g.list.length === 1 ? '' : 's') + ' · ' + money(val) +
              (draft ? ' · ' + draft + ' not passed' : '') +
              (noRc ? ' · ' + noRc + ' no receipt' : '') +
            '</div></div>' +
          '<span class="sub">' + (open ? 'hide' : 'show') + '</span>' +
        '</div>' +
        (open ? g.list.map(chRow).join("") : '');

  /* ---------- WHO IS IT FOR ----------
     v1.3 - district, then area, then the name. A free-text box over 118 clients meant
     spelling a man's name exactly as somebody else once typed it; this asks the two
     questions the godown already knows the answer to and leaves a handful of names. */
  /* ================= ASKED WHERE THE CUSTOMER IS STANDING (v1.12.0) =================
     HIS INSTRUCTION: "also ask to enter mobile no and other details in payments and challan
     app, because team mostly use that apps."

     This is the better moment than the CRM. A challan is written with the man in front of you,
     or his driver at the counter - which is when a mobile number costs one question to get.
     The card already SHOWED what was missing ("no mobile on his record", in red) and gave
     nobody anywhere to put it.

     ALL THREE ARE ASKED HERE, unlike the Payment app, because this app pulls the `associates`
     tab and so has a real partner register to pick from. A free-typed plumber that matches no
     partner is worse than a blank one - it looks answered and joins to nothing. */
  var CH_GAPS = [
    { k: "mobile",    label: "Mobile",    role: "" },
    { k: "plumber",   label: "Plumber",   role: "plumber" },
    { k: "architect", label: "Architect", role: "architect" }
  ];
  function chGaps(cl) {
    if (!cl) return [];
    return CH_GAPS.filter(function (f) { return !String(cl[f.k] || "").trim(); });
  }
  function partnersOfRole(role) {
    var out = [];
    ((S.data && S.data.associates) || []).forEach(function (a) {
      if (!a || !a.name) return;
      if (String(a.role || "").trim().toLowerCase() !== role) return;
      if (out.indexOf(a.name) < 0) out.push(a.name);
    });
    return out.sort();
  }
  function sheetDetails(name) {
    var cl = clientByName(name) || {};
    var gaps = chGaps(cl);
    if (!gaps.length) return '<h2>' + esc(name) + '</h2><div class="muted">Nothing missing.</div>' +
      '<div class="acts" style="margin-top:14px"><button class="btn gry grow" data-act="close">Close</button></div>';
    var h = '<h2>What is missing</h2>' +
      '<div class="muted" style="margin-bottom:10px">' + esc(cl.name || name) +
      ' — ask him now, while he is here. Only what is blank is shown.</div>';
    gaps.forEach(function (f) {
      h += '<label>' + esc(f.label) + '</label>';
      if (!f.role) { h += '<input id="dt_mobile" inputmode="numeric" placeholder="10 digits" value=""/>'; return; }
      var list = partnersOfRole(f.role);
      h += '<select id="dt_' + f.k + '"><option value="">— not known —</option>' +
        list.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join("") +
        '</select>' +
        (list.length ? '' : '<div class="muted" style="font-size:11.5px">Nobody on the partner register yet — the office adds them in the CRM.</div>');
    });
    h += '<div class="muted" style="margin:10px 0 0">Saved against him everywhere — the CRM, ' +
      'the payment app and this one all read the same record.</div>' +

  /* ---------- THE ADDRESS, ONCE ----------
     v1.19.0 - his words: "if like address not preset and entered by challan maker, that will
     be auto update in all records and freezed".

     So: a client WITH an address has it read out here and cannot be changed from this app.
     A client WITHOUT one gets a box, and what is typed is saved onto HIS OWN RECORD - not
     onto the challan - so the CRM, the payment app and every future challan read the same
     line. After that it is frozen here. The office can still correct it in the CRM, which is
     the one place that should be correcting an address; the counter can fill a blank and
     never overwrite a filled one.

     Why it matters more than it looks: a delivery address typed fresh on each challan is how
     one house becomes four addresses, and how a lorry goes to the wrong gate. */
  /* ---------- WHAT IS ALREADY OUT, BEFORE MORE GOES OUT (v1.21.0) ----------

     The man at the counter could load a lorry for someone carrying two lakh of unbilled
     material and had no way to know. The CRM knows; the Payment app knows; this app - the
     one actually standing at the gate - showed nothing.

     WHAT THIS APP CAN HONESTLY SEE, and what it cannot. It holds every challan but it does
     NOT hold the payments tab, so it cannot say what a man OWES. Claiming to would be worse
     than saying nothing: a wrong number at the counter gets trusted and argued with.

     So it reports exactly what is in its own book:
       - material out and not yet billed (billNo empty), in rupees and in challans
       - the oldest of those, in days
       - and it names the Payment app as the place the true balance lives.

     The credit LIMIT and credit DAYS come off the client record - the office sets them in the
     CRM and they arrive here whole, because slimBook keeps entire tabs rather than picking
     fields. Two lines are loud rather than grey: unbilled material past his limit, and an
     unbilled challan older than his terms. Those are the two a man should stop and ring about. */
  function clientMoney(cl) {
    var nm = lower((cl && cl.name) || "");
    var o = { n: 0, rs: 0, oldest: 0, noReceipt: 0,
              limit: num(cl && cl.creditLimit), days: num(cl && cl.creditDays) };
    if (!nm) return o;
    challans().forEach(function (c) {
      if (lower(c.customerName) !== nm) return;
      if (String(c.status || "") === "Cancelled") return;
      if (String(c.receiptReceived || "").toUpperCase() !== "Y") o.noReceipt++;
      if (String(c.billNo || "").trim()) return;          /* billed - not our business here */
      o.n++;
      o.rs += chValue(c);
      var a = ageDays(c);
      if (a > o.oldest) o.oldest = a;
    });
    return o;
  }
  function moneyBlock(cl) {
    var m = clientMoney(cl);
    if (!m.n && !m.limit) return "";
    var overLimit = m.limit > 0 && m.rs > m.limit;
    var overDays  = m.days > 0 && m.oldest > m.days;
    var loud = overLimit || overDays;
    var h = '<div style="margin-top:7px;border-radius:9px;padding:7px 9px;border:1px solid ' +
      (loud ? '#fecaca;background:#fef2f2' : '#e2e8f0;background:#f8fafc') + '">' +
      '<div class="muted" style="font-weight:700;font-size:11px' + (loud ? ';color:#b91c1c' : '') +
      '">Before you load</div>';
    if (m.n) {
      h += '<div style="font-size:13px;font-weight:700;margin-top:1px">' +
        money(m.rs) + ' not yet billed &middot; ' + m.n + ' challan' + (m.n === 1 ? '' : 's') +
        (m.oldest ? ' &middot; oldest ' + m.oldest + ' day' + (m.oldest === 1 ? '' : 's') : '') + '</div>';
    } else {
      h += '<div style="font-size:13px;font-weight:700;margin-top:1px">Nothing unbilled on his name.</div>';
    }
    if (m.limit || m.days) {
      h += '<div class="muted" style="font-size:11.5px;margin-top:2px">Credit ' +
        (m.limit ? money(m.limit) : 'not set') + (m.days ? ' &middot; ' + m.days + ' days' : '') + '</div>';
    }
    if (overLimit) {
      h += '<div style="font-size:12px;font-weight:800;color:#b91c1c;margin-top:3px">' +
        'Past his credit limit by ' + money(m.rs - m.limit) + '. Ring the office before loading.</div>';
    }
    if (overDays) {
      h += '<div style="font-size:12px;font-weight:800;color:#b91c1c;margin-top:3px">' +
        'A challan has been unbilled ' + m.oldest + ' days on ' + m.days + '-day terms.</div>';
    }
    /* v1.28.0 - THIS FIGURE IS COMPUTED FROM `challans`, WHICH NOW ARRIVES SECOND.
       For the seconds between the two halves of a pull the number below is the last full one
       pulled onto this phone, not this minute's. It was ALWAYS that during a pull - the app
       painted the snapshot and waited - the difference is that the split makes the window a
       thing worth naming, and this is a figure a man decides whether to load a lorry on. So
       it says so, rather than being quietly a little bit old. */
    if (!S.restAt) {
      h += '<div class="muted" style="font-size:11px;margin-top:3px">From the last full pull' +
        (S.syncAt ? ' \u2014 ' + esc(bookAge(S.syncAt).txt) : '') + '. The delivery history is still coming down.</div>';
    }
    if (m.noReceipt) {
      h += '<div class="muted" style="font-size:11.5px;margin-top:3px">' +
        m.noReceipt + ' delivery' + (m.noReceipt === 1 ? '' : ' deliveries') + ' still without a signed receipt.</div>';
    }
    h += '<div class="muted" style="font-size:10.5px;margin-top:4px">' +
      'This is what THIS app can see &mdash; material out and not billed. What he actually owes, ' +
      'after payments, is in the Payment app.</div></div>';
    return h;
  }
