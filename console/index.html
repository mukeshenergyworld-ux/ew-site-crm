<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E1C">
<title>EW Console</title>
<meta name="description" content="Energy World owner console - broadcast and people.">
<link rel="icon" href="../icons/ew-192.png">
<link rel="apple-touch-icon" href="../icons/ew-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EW Console">
<script src="../ew-config.js"></script>
<style>
:root{
  --ink:#0F1E1C; --paper:#EFF1EC; --card:#FFFFFF; --line:#CBD1C7; --brass:#C08A3E;
  --brass-dim:#8E6529; --green:#2F6E5F; --red:#9E4A32; --muted:#5C6B66; --r:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);overscroll-behavior-y:none;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;font-weight:600;margin:0}
header .s{font-size:11px;opacity:.7;margin-top:2px}
main{flex:1;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;
  border:1px solid var(--line);border-radius:6px;background:#fff;min-height:44px;
  -webkit-appearance:none;appearance:none;color:var(--ink)}
textarea{min-height:100px;resize:vertical;line-height:1.45}
.fld{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-size:14px;cursor:pointer;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--ink);padding:0 14px;min-height:44px}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
button.brass{background:var(--brass);color:#2A1C05;border-color:var(--brass-dim);font-weight:600}
button.warn{color:var(--red);border-color:#D8B3A6}
button.wide{width:100%}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.45}
h2{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted);margin:20px 0 9px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--ink);
  position:sticky;top:0;z-index:19}
.tabs button{background:none;border:0;color:#8FA29C;min-height:44px;border-radius:0;
  font-size:13px;font-weight:600;letter-spacing:.4px}
.tabs button.on{color:var(--brass);box-shadow:inset 0 -2px 0 var(--brass)}
.row{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.row:last-child{border-bottom:0}
.row .t{font-size:14px;font-weight:600;line-height:1.3}
.row .s{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.tag{display:inline-block;font-size:10px;letter-spacing:.7px;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.live{color:var(--green);border-color:#A9CBC1;background:#E4F0EB}
.tag.draft{color:var(--brass-dim);border-color:#DCC98C;background:#F8F1DE}
.tag.ended{color:var(--muted);background:#EDEFE9}
.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:13px;line-height:1.6}
.load{text-align:center;padding:70px 20px;color:var(--muted);font-size:13px}
.note{font-size:11.5px;color:var(--muted);line-height:1.55}
.prev{border:1px dashed var(--brass);border-radius:var(--r);padding:12px;background:#FCFBF6;
  margin-top:4px}
.prev h3{margin:6px 0 0;font-size:17px}
.prev p{margin:6px 0 0;font-size:13px;line-height:1.5;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
  background:var(--ink);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:99px;
  max-width:min(500px,92vw);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.link{font-size:11px;font-family:ui-monospace,monospace;word-break:break-all;color:var(--green)}
.warnbox{background:#F8F1DE;border:1px solid #DCC98C;border-radius:var(--r);padding:11px 13px;
  font-size:12.5px;line-height:1.5;margin-bottom:12px}
.okbox{background:#E4F0EB;border:1px solid #A9CBC1;border-radius:var(--r);padding:11px 13px;
  font-size:13px;line-height:1.55;margin:10px 0}
.pin{font-family:ui-monospace,monospace;font-size:19px;letter-spacing:3px;font-weight:700;
  color:var(--ink)}
.lnkb{background:none;border:none;color:var(--muted);font-size:12px;padding:8px 10px;
  min-height:34px;cursor:pointer;text-decoration:underline;font-family:inherit}
.tag.lock{color:var(--red);border-color:#D8B3A6;background:#F7E7E1}
.tag.new{color:var(--brass-dim);border-color:#DCC98C;background:#F8F1DE}

/* ---------------- the door ---------------- */
#gate{position:fixed;inset:0;z-index:60;background:var(--ink);color:#E9EBE5;
  display:none;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 20px 40px}
#gate.on{display:block}
.gwrap{max-width:340px;margin:0 auto}
.gmark{width:54px;height:54px;border:2px solid var(--brass);border-radius:50%;
  display:grid;place-items:center;font-size:20px;font-weight:700;
  color:var(--brass);letter-spacing:1px;margin:6vh auto 18px}
#gate h2{font-size:22px;font-weight:600;letter-spacing:.5px;margin:0 0 8px;text-align:center}
#gate .lede{font-size:13px;line-height:1.65;color:#9FB0AA;text-align:center;margin:0 0 22px}
#gate label{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
  color:#9FB0AA;margin:0 0 6px}
#gate input{width:100%;font-size:16px;font-family:ui-monospace,monospace;letter-spacing:2px;
  min-height:50px;padding:12px 14px;border:1px solid #35514B;border-radius:var(--r);
  background:#162926;color:#E9EBE5;margin:0 0 16px}
#gate input:focus{outline:none;border-color:var(--brass)}
#gate button.go{width:100%;min-height:50px;font-size:15px;letter-spacing:1px;
  text-transform:uppercase;font-weight:600;border:none;border-radius:var(--r);
  background:var(--brass);color:#231705;cursor:pointer}
#gate button.go[disabled]{opacity:.55}
#gate .lnk{display:block;width:100%;background:none;border:none;color:#9FB0AA;
  font-size:12.5px;margin-top:16px;min-height:38px;cursor:pointer;text-decoration:underline;
  font-family:inherit}
.gerr{background:#3A1F19;border:1px solid var(--red);color:#F0C7BB;font-size:12.5px;
  line-height:1.6;padding:11px 13px;border-radius:var(--r);margin:0 0 16px}
.gfoot{font-size:11px;color:#6F827C;text-align:center;margin-top:26px;line-height:1.7}
#vbar{position:fixed;left:0;right:0;top:0;z-index:70;background:#2F6E5F;color:#F2F6F3;
  display:none;gap:9px;align-items:center;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  box-shadow:0 2px 10px rgba(0,0,0,.28)}
#vbar.on{display:flex}
#vbar .t{flex:1;min-width:0;font-size:12.5px;line-height:1.5}
#vbar button{min-height:38px;padding:0 12px;font-size:13px;border-radius:4px;
  border:1px solid #F2F6F3;background:#F2F6F3;color:#123028;cursor:pointer;flex:none;
  font-family:inherit}
#vbar button.x{background:none;color:#CFE0DA;border-color:#4E8B7C;padding:0 10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div style="min-width:0"><h1>Energy World console</h1>
      <div class="s" id="hSub">Broadcast &middot; log</div></div>
    <div style="margin-left:auto;display:flex;gap:4px">
      <button class="lnkb" style="color:#9FB0AA" onclick="renderPinChange(false)">PIN</button>
      <button class="lnkb" style="color:#9FB0AA" onclick="signOut()">Sign out</button>
    </div>
  </header>
  <div class="tabs" id="tabs"></div>
  <main id="main"><div class="load">Khul raha hai...</div></main>
</div>

<div id="gate" role="dialog" aria-modal="true" aria-label="Sign in"></div>
<div id="vbar" role="status" aria-live="polite"></div>

<script>
/* ------------------------------------------------------------------
   Owner console.
   Draft and confirm: writing a broadcast saves it as a draft.
   Nothing reaches a single partner until you press Send.
   Nothing is deleted here either - broadcasts end, links revoke.
------------------------------------------------------------------ */
var GAS = String((window.EW_GAS || '')).trim();

/* ---- where the server lives -------------------------------------
   Normally ew-config.js next to the app carries the one address.
   If it is not there yet (a freshly downloaded file, a phone opening
   the app before the config was uploaded), the app asks for it once
   and remembers it on this phone. Nothing secret is stored: it is a
   public web-app URL. The PIN still guards everything behind it. */
var GKEY = 'ew_gas_url';
function gasSaved(){ try { return String(localStorage.getItem(GKEY) || '').trim(); } catch(e){ return ''; } }
function gasForget(){ try { localStorage.removeItem(GKEY); } catch(e){} location.replace(location.pathname); }
function gasSet(){
  var el = document.getElementById('gasUrl');
  var n  = document.getElementById('gasNote');
  var v  = String((el && el.value) || '').trim();
  if (!n) return;
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){
    n.textContent = 'Yeh Apps Script ka link nahi lag raha. Link https://script.google.com/... se shuru aur /exec par khatam hona chahiye.';
    return;
  }
  n.textContent = 'Server check kar rahe hain...';
  fetch(v, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
             body: JSON.stringify({ action:'ping' }) })
    .then(function(x){ return x.json(); })
    .then(function(r){
      if (!r || !r.ok) throw 0;
      try { localStorage.setItem(GKEY, v); } catch(e){}
      n.textContent = 'Server mil gaya. App khul raha hai...';
      setTimeout(function(){ location.replace(location.pathname); }, 400);
    })
    .catch(function(){
      n.textContent = 'Is link par server nahi mila. Apps Script deployment "Anyone" par set hai kya? Link dobara copy karke daalein.';
    });
}
function gasAsk(){
  var m = document.getElementById('main');
  if (!m) return;
  m.innerHTML =
    '<div style="max-width:460px;margin:22px auto;padding:16px;border:1px solid rgba(128,128,128,.35);' +
    'border-radius:14px;line-height:1.55">' +
    '<div style="font-weight:700;font-size:16px;margin-bottom:6px">Server ka pata daalein</div>' +
    '<div style="font-size:13px;opacity:.85;margin-bottom:12px">' +
    'App abhi server se juda nahi hai. Apps Script deployment ka <b>/exec</b> link yahan ek baar paste ' +
    'kar dein. Yeh sirf is phone par yaad rahega. Koi PIN ya data yahan nahi jaata.</div>' +
    '<input id="gasUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" ' +
    'placeholder="https://script.google.com/macros/s/.../exec" ' +
    'style="width:100%;box-sizing:border-box;font-size:16px;padding:11px 12px;border-radius:10px;' +
    'border:1px solid rgba(128,128,128,.5);background:transparent;color:inherit">' +
    '<button onclick="gasSet()" style="margin-top:10px;width:100%;min-height:44px;font-size:15px;' +
    'font-weight:700;border:0;border-radius:10px;background:#2F6E5F;color:#fff">Jodein</button>' +
    '<div id="gasNote" style="font-size:12.5px;opacity:.85;margin-top:10px;min-height:18px"></div>' +
    '<div style="font-size:12px;opacity:.7;margin-top:10px">' +
    'Link kahan se milta hai: Apps Script &rarr; Deploy &rarr; Manage deployments &rarr; Web app URL.</div>' +
    '</div>';
}
if (!GAS) GAS = gasSaved();
var D = { casts:[], links:[], waiting:[], people:[], never:[], kinds:[], types:[], url:'' };
var TAB = 'cast', EDIT = null;

/* ---- who is signed in, kept on this machine only ----
   Owner signs in the same way everyone else does: his mobile number and
   his PIN. There is no console link any more. If this laptop is lost, the
   PIN is still needed, and the PIN is not written down anywhere - not
   here, not on the server. Only its lock is stored, never its key. ---- */
var STORE = 'ew_console_auth_v1';
var A = { mobile:'', pin:'' };
try { var _a = JSON.parse(localStorage.getItem(STORE) || '{}');
      A.mobile = _a.mobile || ''; A.pin = _a.pin || ''; } catch(e){}
function authSave(){ try { localStorage.setItem(STORE, JSON.stringify(A)); } catch(e){} }
function authClear(keepMobile){
  var m = A.mobile; A.pin = ''; A.mobile = keepMobile ? m : '';
  try { localStorage.removeItem(STORE); } catch(e){}
}

/* text/plain keeps this a simple request, so no CORS preflight - the same
   trick the main CRM already uses to reach Apps Script from GitHub Pages. */
function call(action, payload){
  var body = { action: action, mobile: A.mobile, pin: A.pin,
               build: BUILD, app: APPKEY };
  if (payload) for (var k in payload) if (payload.hasOwnProperty(k)) body[k] = payload[k];
  return fetch(GAS, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function val(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .4s';},2400);
  setTimeout(function(){t.remove();},2900); }

/* ============================ BROADCAST ============================ */
function viewCast(){
  var e = EDIT || { id:'', kind:(D.kinds[0]||'Update'), title:'', body:'', img:'', brand:'',
                    link:'', till:'', audience:'ALL', cities:'ALL', pinned:false };
  var h = '<div class="card">' +
    '<div class="fld"><label>Kis tarah ki khabar</label><select id="kind">' +
      D.kinds.map(function(k){ return '<option' + (e.kind===k?' selected':'') + '>' + esc(k) + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="fld"><label>Heading</label>' +
      '<input id="title" maxlength="120" placeholder="TECE concealed cistern - naya model" value="' + esc(e.title) + '"></div>' +
    '<div class="fld"><label>Baat</label>' +
      '<textarea id="body" maxlength="1200" placeholder="Saathiyon ke liye kya hai, kab tak hai, kya karna hai.">' + esc(e.body) + '</textarea></div>' +
    '<div class="two">' +
      '<div class="fld"><label>Brand</label><input id="brand" value="' + esc(e.brand) + '" placeholder="TECE"></div>' +
      '<div class="fld"><label>Valid till</label><input id="till" type="date" value="' + esc(e.till) + '"></div>' +
    '</div>' +
    '<div class="fld"><label>Photo ka link</label>' +
      '<input id="img" placeholder="https://... (Drive link ho to Anyone-with-link)" value="' + esc(e.img) + '"></div>' +
    '<div class="two">' +
      '<div class="fld"><label>Kis ko dikhe</label><select id="audience">' +
        '<option value="ALL"' + (e.audience==='ALL'?' selected':'') + '>Sab partners</option>' +
        D.types.map(function(t){ return '<option value="' + esc(t) + '"' +
          (e.audience===t?' selected':'') + '>Sirf ' + esc(t) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="fld"><label>Shehar</label><input id="cities" value="' + esc(e.cities) + '" placeholder="ALL ya Panipat, Karnal"></div>' +
    '</div>' +
    '<div class="fld"><label><input type="checkbox" id="pinned" style="width:auto;min-height:0;margin-right:8px"' +
      (e.pinned?' checked':'') + '>Upar chipka kar rakhein</label></div>' +
    '<div class="two">' +
      '<button class="pri" onclick="saveCast(0)">Draft save karein</button>' +
      '<button onclick="clearEdit()">Naya</button>' +
    '</div>' +
    '<div class="note" style="margin-top:9px">Save karne se kisi ko kuch nahi jaata. ' +
      'Bhejne ke liye neeche list mein <b>Bhejein</b> dabana padega.</div>' +
  '</div>';

  h += '<h2>Pehle ki khabrein</h2>';
  h += D.casts.length ? D.casts.map(castRow).join('')
     : '<div class="empty">Abhi tak koi broadcast nahi.</div>';
  return h;
}

function castRow(c){
  var tag = c.status==='Live' ? 'live' : c.status==='Ended' ? 'ended' : 'draft';
  var lbl = c.status==='Live' ? 'Live' : c.status==='Ended' ? 'Band' : 'Draft';
  return '<div class="card" style="padding:12px 14px">' +
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">' +
      '<span class="tag ' + tag + '">' + lbl + '</span>' +
      '<span class="note">' + esc(c.kind) + ' &middot; ' + esc(c.on) + '</span>' +
      '<span class="note" style="margin-left:auto">' + c.seen + ' ne dekha &middot; ' +
        c.interested + ' ne haan ki</span>' +
    '</div>' +
    '<div class="t">' + esc(c.title) + '</div>' +
    (c.body ? '<div class="s">' + esc(c.body).slice(0,140) + (c.body.length>140?'...':'') + '</div>' : '') +
    '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">' +
      (c.status!=='Live'
        ? '<button class="brass" onclick="sendCast(\'' + esc(c.id) + '\')">Bhejein</button>' : '') +
      '<button onclick="editCast(\'' + esc(c.id) + '\')">Badlein</button>' +
      (c.status==='Live'
        ? '<button class="warn" onclick="endCast(\'' + esc(c.id) + '\')">Band karein</button>' : '') +
    '</div></div>';
}

function collect(){
  return { id: EDIT ? EDIT.id : '', kind: val('kind'), title: val('title'), body: val('body'),
    img: val('img'), brand: val('brand'), till: val('till'),
    audience: val('audience'), cities: val('cities') || 'ALL',
    pinned: document.getElementById('pinned').checked };
}
function saveCast(){
  var p = collect();
  if (!p.title){ toast('Heading likhni zaroori hai.'); return; }
  call('bcastSave', p).then(function(r){
    if (r && r.ok){ toast('Draft save ho gaya. Ab bhej sakte hain.'); EDIT=null; reload(); }
    else toast((r && r.err) || 'Save nahi hua.');
  }).catch(function(){ toast('Network slow hai.'); });
}
function editCast(id){
  EDIT = D.casts.filter(function(c){ return c.id===id; })[0] || null;
  render(); window.scrollTo(0,0);
}
function clearEdit(){ EDIT = null; render(); window.scrollTo(0,0); }

function sendCast(id){
  var c = D.casts.filter(function(x){ return x.id===id; })[0];
  if (!c) return;
  var box = document.createElement('div');
  box.className = 'card';
  box.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);' +
    'z-index:70;max-width:min(460px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.3)';
  box.innerHTML = '<div class="warnbox">Yeh sab partners ke app par turant dikhne lagega. ' +
    'Ek baar padh lein.</div>' +
    '<div class="prev"><span class="tag">' + esc(c.kind) + '</span>' +
    '<h3>' + esc(c.title) + '</h3>' +
    (c.body ? '<p>' + esc(c.body) + '</p>' : '') + '</div>' +
    '<div class="fld" style="margin-top:12px"><label>' +
      '<input type="checkbox" id="tgAlso" checked style="width:auto;min-height:0;margin-right:8px">' +
      'Telegram par bhi bhejein</label></div>' +
    '<div class="two"><button class="brass" id="goSend">Haan, bhej dein</button>' +
    '<button id="noSend">Abhi nahi</button></div>';
  document.body.appendChild(box);
  document.getElementById('noSend').onclick = function(){ box.remove(); };
  document.getElementById('goSend').onclick = function(){
    var tg = document.getElementById('tgAlso').checked;
    box.remove();
    call('bcastSend', { id:id, telegram:tg }).then(function(r){
      if (r && r.ok) { toast('Live ho gaya. ' + r.reach + ' partners ko dikhega.'); reload(); }
      else toast((r && r.err) || 'Nahi bheja ja saka.');
    }).catch(function(){ toast('Network slow hai.'); });
  };
}

function endCast(id){
  call('bcastEnd', { id:id }).then(function(r){
    if (r && r.ok){ toast('Band kar diya. Record wahin hai, mita nahi.'); reload(); }
    else toast((r && r.err) || 'Nahi hua.');
  }).catch(function(){ toast('Network slow hai.'); });
}

/* ============================== PEOPLE ==============================
   This tab replaced the old Links tab. There is no link to guard any
   more - a man signs in with his own number and his own PIN, so this
   screen is about people, not URLs.

   Nothing here deletes anybody. Blocking shuts the door and leaves the
   row, the history and the points exactly where they were.
------------------------------------------------------------------- */
function kindLabel(k){
  return k === 'PARTNER' ? 'Partner' : k === 'EXEC' ? 'Executive' :
         k === 'OWNER' ? 'Owner' : String(k || '');
}

/* The newest build any phone has reported. Anyone below it is behind -
   which usually just means he has not opened the app since the upload. */
function newestBuild(){
  var top = '';
  (D.people || []).forEach(function(x){
    if (x.build && x.build > top) top = x.build;
  });
  return top;
}

function personRow(p){
  var tags = '<span class="tag">' + esc(kindLabel(p.kind)) + '</span>';
  if (p.locked) tags += ' <span class="tag lock">Locked</span>';
  if (!p.pinSet) tags += ' <span class="tag new">Pehla PIN</span>';

/* ======================= UPDATE WATCH =================================
   The problem this solves: you upload a new version and every phone is
   still running the old one until somebody rings each man and tells him
   to reinstall. Nobody is rung any more.

   The server holds one version string. This phone remembers the last
   version it actually ran. When the two disagree the app throws away its
   own shell cache and comes back new - by itself if it is simply being
   opened, and with a button if you are in the middle of something.

   Nothing you have typed or queued is touched. The sign-in and the
   offline queue live in localStorage and this never goes near them.
--------------------------------------------------------------------- */
var BUILD  = '2026.08.05-1';        /* which build of this file is running */
var APPKEY = 'CONSOLE';
var VKEY   = 'ew_console_ver_v1';
var VNEW   = '', VBUSY = false;

function verSeen(){ try { return JSON.parse(localStorage.getItem(VKEY) || '{}'); }
                    catch(e){ return {}; } }
function verPut(o){ try { localStorage.setItem(VKEY, JSON.stringify(o)); } catch(e){} }

/* Wipe the shell and come back. The cache holds only the frame - the
   HTML, the manifest, the icons. No business data lives there. */
function verWipe(v){
  if (VBUSY) return;
  VBUSY = true;
  verPut({ have: (verSeen().have || ''), want: String(v || ''), at: (new Date()).getTime() });
  var b = document.getElementById('vbar');
  if (b){ b.innerHTML = '<div class="t">Naya version aa raha hai...</div>'; b.classList.add('on'); }

  var done = false;
  var go = function(){
    if (done) return; done = true;
    location.replace(location.pathname + '?u=' + (new Date()).getTime());
  };
  var jobs = [];
  try {
    if (window.caches && caches.keys)
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }));
  } catch(e){}
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }));
  } catch(e){}
  if (jobs.length) Promise.all(jobs).then(go, go); else go();
  setTimeout(go, 2500);                    /* never hang on a stuck cache */
}

function verBar(v, note, force){
  VNEW = String(v || '');
  var b = document.getElementById('vbar');
  if (!b) return;
  b.innerHTML = '<div class="t"><b>Naya version aa gaya hai.</b> ' +
      esc(note || 'App ko ek baar refresh kar lein.') + '</div>' +
      '<button onclick="verWipe(VNEW)">Update karein</button>' +
      (force ? '' : '<button class="x" onclick="verHide()">Baad mein</button>');
  b.classList.add('on');
  if (force) setTimeout(function(){ verWipe(VNEW); }, 6000);
}
function verHide(){ var b = document.getElementById('vbar'); if (b) b.classList.remove('on'); }

/* cold = the app has only just been opened, so a reload costs nobody
   anything and we do it silently. Otherwise we ask. */
function verCheck(r, cold){
  if (!r || !r.ver) return false;
  var v = String(r.ver), st = verSeen();
  if (st.want && st.want === v){                     /* the refresh worked */
    verPut({ have: v });
  if (typeof toast === 'function') toast('App update ho gaya.');
    return false;
  }
  if (!st.have){ verPut({ have: v }); return false; }   /* first run on this phone */
  if (st.have === v) return false;                       /* already current */
  /* a reload that did not take must never become a loop */
  if (st.at && ((new Date()).getTime() - st.at) < 60000){ verBar(v, r.verNote, r.verForce); return false; }
  if (cold){ verWipe(v); return true; }
  verBar(v, r.verNote, r.verForce);
  return false;
}

/* asked without a PIN, so a phone sitting on the sign-in screen with a
   stale app can still fix itself */
function verPoll(cold){
  return call('ver', { app: APPKEY })
    .then(function(r){ return verCheck(r, !!cold); })
    .catch(function(){ return false; });
}
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) verPoll(false);
});
/* ================================ BOOT ================================ */
function landed(r){
  if (verCheck(r, true)) return;     /* new version - come back new */
  D = r;
  D.people = r.people || []; D.never = r.never || [];
  subline(); render();
  if (!r.pinSet) renderPinChange(true);
}

(function boot(){
  if (!GAS){ gasAsk(); return; }
  if (!A.mobile || !A.pin){ renderGate(); verPoll(true); return; }
  call('login').then(function(r){
    if (!r || !r.ok || r.kind !== 'OWNER'){
      GERR = (r && r.err) || ''; authClear(true); renderGate(); return;
    }
    landed(r);
  }).catch(function(){
    document.getElementById('main').innerHTML =
      '<div class="empty">Network nahi mil raha.<br><br>' +
      '<button class="pri" onclick="location.reload()">Phir se</button></div>';
  });
})();
</script>
