<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1F3A5F"/>
<title>Energy World — Collection</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<meta name="apple-mobile-web-app-title" content="EW Payment"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#f1f5f9;color:#0f172a;padding-bottom:env(safe-area-inset-bottom)}
a{color:#0f766e}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 90px}
.top{background:#1F3A5F;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .t1{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.02em;flex:1}
.top .who{font-size:12px;color:#fecaca}
.btn{appearance:none;border:1px solid #1F3A5F;background:#1F3A5F;color:#fff;border-radius:9px;
  padding:9px 13px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:44px}   
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:#1F3A5F}

.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px;min-height:44px;min-width:44px}
.btn.grn{background:#0f766e;border-color:#0f766e;color:#fff}
.btn.gry{background:#fff;border-color:#cbd5e1;color:#334155}
.btn.full{width:100%;justify-content:center;padding:12px;font-size:15px}
.btn[disabled]{opacity:.55}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:12px 13px;margin:10px 0;
  box-shadow:0 1px 2px rgba(15,23,42,.05)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1 1 46%;min-width:150px;background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:11px 13px}
.stat .n{font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:#64748b;margin-top:2px}
.stat.bad .n{color:#b91c1c}
.stat.good .n{color:#0f766e}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;
  padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;flex:0 0 auto;min-height:44px}
.chip.on{background:#1F3A5F;border-color:#1F3A5F;color:#fff}
.chip .c{opacity:.7;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;min-height:44px;
  font-size:16px;font-family:inherit;background:#fff;color:#0f172a}

input[type="checkbox"],input[type="radio"]{width:auto;padding:0;min-height:0;flex:0 0 auto;
  -webkit-appearance:auto;appearance:auto}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin:10px 0 4px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;
  background:#f1f5f9;color:#475569;vertical-align:middle}
.pill.red{background:#fee2e2;color:#b91c1c}

.loginmsg{display:block;white-space:normal;word-break:break-word;text-align:left;
  line-height:1.45;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:12px;
  margin:0 0 12px;background:#fee2e2;color:#b91c1c}

.pill.amb{background:#fef3c7;color:#92400e}
.pill.grn{background:#ccfbf1;color:#0f766e}
.pill.blu{background:#dbeafe;color:#1d4ed8}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.muted{color:#64748b;font-size:12px}
.big{font-size:19px;font-weight:800;letter-spacing:-.02em}

.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:flex-end;cursor:pointer}
.sheet .inner{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);max-width:760px;margin:0 auto;
  cursor:auto;-webkit-overflow-scrolling:touch}

@supports (height:100dvh){.sheet .inner{max-height:88dvh}}
.sheet h2{margin:0 0 3px;font-size:17px}
.empty{text-align:center;color:#64748b;padding:26px 14px;font-size:13.5px}

#ew_sync_banner{position:fixed;left:0;right:0;bottom:var(--ew-nav,56px);z-index:29;
  background:#9a3412;color:#fff;padding:8px 12px;font-size:12.5px;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom) + var(--ew-bottom,0px));transition:bottom .16s ease;background:#0f172a;color:#fff;
  padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:100000;max-width:88%;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.login{max-width:340px;margin:9vh auto;background:#fff;border-radius:16px;padding:26px 22px;
  box-shadow:0 10px 30px rgba(15,23,42,.14)}
.login h1{margin:0 0 3px;font-size:19px;text-align:center}
.login p{margin:0 0 16px;text-align:center;color:#64748b;font-size:13px}
.bar{height:7px;border-radius:4px;background:#f1f5f9;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:#b91c1c}
.sync{font-size:12px;color:#fecaca}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:30;
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:9px 4px 10px;font-size:12px;font-weight:700;color:#94a3b8;cursor:pointer}
.nav button.on{color:#1F3A5F}
.nav button b{display:block;font-size:16px;line-height:1.25}

:root{--ew-navy:#1F3A5F;--ew-navy-d:#0D2340;--ew-gold:#C9A24A;--ew-gold-l:#F6EFD9;--ew-slate:#5E6875;--ew-line:#DCE3EA;--ew-page:#F4F6F9}
body{background:var(--ew-page);color:#1A2230}
a{color:var(--ew-navy)}
.top{background:var(--ew-navy);border-bottom:3px solid var(--ew-gold)}
.top .who{color:#E9D9AE}
.btn{background:var(--ew-navy);border-color:var(--ew-navy)}
.btn.ghost{background:#fff;color:var(--ew-navy);border-color:var(--ew-navy)}
.chip.on{background:var(--ew-navy);border-color:var(--ew-navy)}
.card,.stat{border-color:var(--ew-line)}
.muted{color:var(--ew-slate)}

.ctw{background:#fff;border:1px solid var(--ew-line);border-radius:12px;overflow:hidden;margin:8px 0}
table.ct{border-collapse:collapse;width:100%;font-size:13.5px}
table.ct th{background:var(--ew-navy);color:#fff;text-align:left;font-size:12px;font-weight:700;letter-spacing:.03em;padding:9px 10px;border-bottom:2px solid var(--ew-gold);white-space:nowrap}
table.ct td{padding:9px 10px;border-top:1px solid var(--ew-line);vertical-align:top}
table.ct tr.r{cursor:pointer}
table.ct tr.r:hover td{background:#F8FAFC}
table.ct tr.r.on td{background:var(--ew-gold-l)}
table.ct .n{text-align:right;white-space:nowrap}
table.ct .cd{font-size:12px;font-weight:800;color:var(--ew-navy);white-space:nowrap}
table.ct .nm{font-weight:800;color:#1A2230}
table.ct .amt{font-weight:800;font-size:15px}
table.ct td.body{padding:0;background:#fff}
table.ct .owe{color:#b91c1c}
.code{display:inline-block;font-size:12px;font-weight:800;color:var(--ew-navy);background:#E8EEF5;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
table.ct td.wd{white-space:nowrap}
@media (min-width:1000px){ .wrap{max-width:1080px} }
@media (max-width:640px){ table.ct .wd{display:none} table.ct td,table.ct th{padding:8px 7px} }
</style>
</head>
