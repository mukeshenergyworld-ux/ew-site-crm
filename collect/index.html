<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#7f1d1d"/>
<title>Energy World — Collection</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="../icons/ew-180.png"/>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#f1f5f9;color:#0f172a;padding-bottom:env(safe-area-inset-bottom)}
a{color:#0f766e}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 90px}
.top{background:#7f1d1d;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .t1{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.02em;flex:1}
.top .who{font-size:11.5px;color:#fecaca}
.btn{appearance:none;border:1px solid #7f1d1d;background:#7f1d1d;color:#fff;border-radius:9px;
  padding:9px 13px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:#7f1d1d}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.grn{background:#0f766e;border-color:#0f766e;color:#fff}
.btn.gry{background:#fff;border-color:#cbd5e1;color:#334155}
.btn.full{width:100%;justify-content:center;padding:12px;font-size:15px}
.btn[disabled]{opacity:.55}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:12px 13px;margin:10px 0;
  box-shadow:0 1px 2px rgba(15,23,42,.05)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1 1 46%;min-width:150px;background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:11px 13px}
.stat .n{font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:11.5px;color:#64748b;margin-top:2px}
.stat.bad .n{color:#b91c1c}
.stat.good .n{color:#0f766e}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;
  padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;flex:0 0 auto}
.chip.on{background:#7f1d1d;border-color:#7f1d1d;color:#fff}
.chip .c{opacity:.7;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;
  font-size:16px;font-family:inherit;background:#fff;color:#0f172a}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin:10px 0 4px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;
  background:#f1f5f9;color:#475569;vertical-align:middle}
.pill.red{background:#fee2e2;color:#b91c1c}
.pill.amb{background:#fef3c7;color:#92400e}
.pill.grn{background:#ccfbf1;color:#0f766e}
.pill.blu{background:#dbeafe;color:#1d4ed8}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.muted{color:#64748b;font-size:12px}
.big{font-size:19px;font-weight:800;letter-spacing:-.02em}
/* cursor:pointer is not decoration here - iOS Safari will not deliver a tap on a
   plain div to a listener bound on document without it, so without this the dark
   area behind a sheet cannot be tapped to close it on an iPhone */
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:flex-end;cursor:pointer}
.sheet .inner{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);max-width:760px;margin:0 auto;
  cursor:auto;-webkit-overflow-scrolling:touch}
/* 92vh on iOS measures the window WITHOUT Safari's toolbars, so a tall sheet puts its
   Save button underneath them. dvh measures what is actually visible. */
@supports (height:100dvh){.sheet .inner{max-height:88dvh}}
.sheet h2{margin:0 0 3px;font-size:17px}
.empty{text-align:center;color:#64748b;padding:26px 14px;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#0f172a;color:#fff;
  padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:99;max-width:88%;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.login{max-width:340px;margin:9vh auto;background:#fff;border-radius:16px;padding:26px 22px;
  box-shadow:0 10px 30px rgba(15,23,42,.14)}
.login h1{margin:0 0 3px;font-size:19px;text-align:center}
.login p{margin:0 0 16px;text-align:center;color:#64748b;font-size:13px}
.bar{height:7px;border-radius:4px;background:#f1f5f9;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:#b91c1c}
.sync{font-size:11px;color:#fecaca}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:30;
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:9px 4px 10px;font-size:11px;font-weight:700;color:#94a3b8;cursor:pointer}
.nav button.on{color:#7f1d1d}
.nav button b{display:block;font-size:16px;line-height:1.25}
</style>

<body>
<div id="root"></div>
<!-- v1.6 - jsPDF IS NO LONGER LOADED HERE.
     It was a 356 KB classic script sitting immediately above the app, and a classic
     script blocks every script after it. So on a phone the whole app waited for a
     third-party CDN before a single line of it ran - and if that CDN was slow or
     unreachable, which on mobile data it often is, the app never started at all and
     the screen simply stayed white. That was the "it will not open on the iPhone".
     It is now fetched the first time somebody actually builds a statement. See
     ensurePdf() below. -->
<script>
(function () {
  "use strict";
  /* ==========================================================================
     ENERGY WORLD - PAYMENT COLLECTION
     A separate app, on purpose. The CRM does everything; this does one thing, so
     the man who opens it in the morning is looking at exactly one question:
     WHO DO I RING TODAY, AND WHAT DO I SAY.

     It signs in with the same name and PIN as the Team CRM and talks to the same
     server, so there is no second list of users, no second password to forget,
     and no second copy of the money that can drift out of step. Nothing about the
     CRM is changed by this app existing.

     WHAT IT WRITES. Two things only:
       - a PAYMENT, onto the same Payments sheet the CRM writes to, in the same
         shape, so a receipt entered here is indistinguishable from one entered there;
       - a FOLLOW-UP (a call, and the date he promised), as an append-only row on
         the AUDIT sheet - the channel the delivery proofs already use. No column is
         added to any tab, so no backend change and no redeployment were needed, and
         a note can be corrected later without anything ever being overwritten.

     WHO CAN DO WHAT. Admin and accounts see every client and may write. A sales
     executive sees only the clients assigned to him and may not write - he can
     still ring and send a reminder, because that is his job; recording money is not.
     Anyone else is refused at the door.
     ========================================================================== */

  var APP_VERSION = "1.7.0";
  var GAS = "https://script.google.com/macros/s/AKfycbzVkPHWyPq-w8RFD_HdG0vCjmrfQvEUpcq_hhF9eDGa0ZbZ3rIx7N37an2DQRGmsxPK/exec";
  var STORE = "ew_collect_session";
  var SNAP = "ew_collect_snap";
  var CREDIT_DAYS = 30;                 /* the owner's terms: 30 days from delivery */
  var CRM_URL = "../team/";

  var S = { user: "", pin: "", role: "", data: null, tab: "list", filter: "all", exec: "",
            q: "", open: "", sheet: null, busy: false, syncAt: 0 };

  /* ---------- tiny helpers ---------- */
  function el(id) { return document.getElementById(id); }
  function val(id) { var e = el(id); return e ? String(e.value || "").trim() : ""; }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function money(n) {
    var v = Math.round(Number(n) || 0), neg = v < 0;
    return (neg ? "-" : "") + "₹" + Math.abs(v).toLocaleString("en-IN");
  }
  /* Lakhs, because that is how the amounts in this business are actually spoken. */
  function shortMoney(n) {
    var v = Math.round(Number(n) || 0), a = Math.abs(v), s = v < 0 ? "-" : "";
    if (a >= 10000000) return s + "₹" + (a / 10000000).toFixed(2) + " Cr";
    if (a >= 100000) return s + "₹" + (a / 100000).toFixed(2) + " L";
    return money(v);
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function addDays(ymd, n) {
    var d = new Date(ymd + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function dstr(ymd) {
    if (!ymd) return "";
    var p = String(ymd).slice(0, 10).split("-");
    if (p.length !== 3) return String(ymd);
    return Number(p[2]) + " " + (MON[Number(p[1]) - 1] || "") + " " + p[0];
  }
  /* "41 days" is a number. "6 weeks" is a feeling. The man on the phone needs the feeling. */
  function ageWords(d) {
    if (d == null || d < 0) return "";
    if (d === 0) return "today";
    if (d === 1) return "1 day";
    if (d < 31) return d + " days";
    if (d < 62) return "over a month";
    if (d < 365) return Math.floor(d / 30) + " months";
    return "over a year";
  }
  var _toastT = null;
  function toast(m) {
    var t = el("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
    t.textContent = m; t.style.display = "block";
    clearTimeout(_toastT); _toastT = setTimeout(function () { t.style.display = "none"; }, 3400);
  }

  /* ---------- the server ----------
     v1.6 - EVERY CALL NOW HAS A DEADLINE. Before this, a request that stalled - which
     is the normal failure on a phone with one bar, or on a wifi that has associated but
     is not actually passing traffic - simply never came back. It did not fail, so no
     catch ran, so no message was shown and no retry was offered: the app sat on
     "Opening…" for as long as the man was willing to look at it. That is not slowness,
     it is a hang, and it is what "it does not open on the iPhone" actually was.
     A stalled call is now abandoned and reported like any other failure. */
  var API_TIMEOUT = 20000;
  function api(action, extra, ms) {
    var body = Object.assign({ action: action, user: S.user, pin: S.pin }, extra || {});
    var ctrl = null, timer = null;
    try { ctrl = new AbortController(); } catch (e) { ctrl = null; }
    var opts = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    };
    if (ctrl) opts.signal = ctrl.signal;
    var p = fetch(GAS, opts).then(function (r) { return r.json(); });
    if (ctrl) {
      timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, Number(ms) || API_TIMEOUT);
      p = p.then(function (v) { clearTimeout(timer); return v; },
                 function (e) { clearTimeout(timer); throw e; });
    }
    return p;
  }

  /* ---------- the statement builder, fetched only when it is wanted ----------
     One download, cached in a promise, so the second statement of the day costs
     nothing. Everything that needs it awaits this instead of assuming it is there. */
  var _pdfP = null;
  function ensurePdf() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(true);
    if (_pdfP) return _pdfP;
    _pdfP = new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s.async = true;
      s.onload = function () {
        if (window.jspdf && window.jspdf.jsPDF) res(true);
        else { _pdfP = null; rej(new Error("jspdf loaded but empty")); }
      };
      s.onerror = function () { _pdfP = null; rej(new Error("jspdf failed")); };
      document.head.appendChild(s);
    });
    return _pdfP;
  }

  /* ---------- keep only what this app reads ----------
     teamGet hands back the whole book - thirty tabs, about 680 KB - because it is the
     CRM's endpoint and the CRM needs all of it. This app reads five of those tabs. The
     rest (quotes, associates, pitch, sites, discounts, tools…) is roughly 400 KB that
     is carried in memory, stringified into localStorage on every pull, and parsed back
     out on every open, for nothing. It is dropped the moment it arrives. */
  var KEEP = ["clients", "challans", "payments", "returns", "audit"];
  function slimBook(r) {
    if (!r || typeof r !== "object") return r;
    var out = { ok: r.ok };
    if (r.user) out.user = r.user;
    KEEP.forEach(function (k) { if (r[k]) out[k] = r[k]; });
    return out;
  }

  /* v1.6.1 - ASK FOR ONLY THOSE FIVE, TOO.
     Trimming on arrival stopped this app carrying 400 KB it never reads, but the 400 KB
     still came down the wire. This asks the server not to send it. Apps Script ignores a
     field it does not know, so until the backend is taught the word "only" this changes
     nothing at all and cannot break anything - and the day it is taught, every pull
     halves on its own with no new version of this app needing to go out. */
  function getBook() { return api("teamGet", { only: KEEP }); }

  /* A reply with no client list in it is not an empty book, it is a broken reply. Wiping
     a man's screen on the strength of one is how a morning gets lost. */
  function usableBook(r) { return !!(r && r.ok && r.clients && r.clients.length); }

  function num(v) {
    if (typeof v === "number") return isFinite(v) ? v : 0;
    var t = String(v == null ? "" : v).replace(/[^0-9.\-]/g, "");
    var n = Number(t);
    return isFinite(n) ? n : 0;
  }
  function d10(v) { return String(v == null ? "" : v).slice(0, 10); }
  function daysBetween(from, to) {
    if (!from || !to) return 0;
    var a = Date.parse(from + "T00:00:00Z"), b = Date.parse(to + "T00:00:00Z");
    if (!isFinite(a) || !isFinite(b)) return 0;
    return Math.round((b - a) / 86400000);
  }
  function lower(s) { return String(s == null ? "" : s).trim().toLowerCase(); }

  /* Net (post-discount) goods value of a challan, from the discount frozen on each
     line when it was created. Mirrors the CRM's pricedLines exactly. */
  function challanNet(c) {
    var items = [];
    try { items = JSON.parse(c.itemsJson || "[]"); } catch (e) { items = []; }
    var goods = items.reduce(function (s, i) {
      var rate = num(i.rate), qty = num(i.qty);
      var disc = (i.disc != null && i.disc !== "") ? num(i.disc) : 0;
      return s + qty * Math.round(rate * (1 - disc / 100));
    }, 0);
    var freight = String(c.freightTo) === "Client" ? num(c.freight) : 0;
    return goods + freight;
  }

  /* Value a booked-in return at the client's net price. The app is handed a
     priced list by the caller when it has one; otherwise the stored amount. */
  function returnNet(r, priceLine) {
    var items = [];
    try { items = JSON.parse(r.itemsJson || "[]"); } catch (e) { items = []; }
    return items.reduce(function (s, i) {
      return s + (priceLine ? priceLine(i, r) : 0);
    }, 0);
  }

  /* Two challans carrying the same number are one challan. Defence against the
     double-billing that has bitten this book before: the later row wins. */
  function dedupe(list) {
    var seen = {};
    (list || []).slice().sort(function (a, b) {
      return String(a.createdAt || "").localeCompare(String(b.createdAt || ""));
    }).forEach(function (c) { seen[String(c.challanNo || c.id)] = c; });
    return Object.keys(seen).map(function (k) { return seen[k]; });
  }

  /* ---- ONE CLIENT'S POSITION ----
     Returns everything the screen and the reminder need, and nothing it does not. */
  function clientDue(opts) {
    var client = opts.client || {};
    var challans = dedupe((opts.challans || []).filter(function (c) {
      return lower(c.customerName) === lower(client.name) &&
             String(c.receiptReceived || "").toUpperCase() === "Y";
    })).sort(function (a, b) { return d10(a.createdAt).localeCompare(d10(b.createdAt)); });

    var payments = (opts.payments || []).filter(function (p) {
      return lower(p.client) === lower(client.name);
    }).sort(function (a, b) { return d10(a.date || a.createdAt).localeCompare(d10(b.date || b.createdAt)); });

    var returns = (opts.returns || []).filter(function (r) {
      return lower(r.customerName) === lower(client.name) &&
             lower(r.status) === "received";
    });

    var today = opts.today;
    var terms = num(opts.creditDays) || 30;

    var opening = num(client.openingAmt);
    var billed = challans.reduce(function (s, c) { return s + challanNet(c); }, 0);
    var credited = returns.reduce(function (s, r) { return s + num(opts.returnValue ? opts.returnValue(r) : 0); }, 0);
    var paid = payments.reduce(function (s, p) { return s + num(p.amount); }, 0);
    var due = Math.round(opening + billed - credited - paid);

    /* ---- FIFO: what the money that came in has already settled ----
       The opening balance is the oldest thing he owes, so it is cleared first.
       Returns credit the newest unpaid deliveries (goods came back, so the most
       recent invoice is the one reduced) - that is deliberate: crediting the
       oldest would make an old debt look settled when it is not. */
    var pot = paid;
    var openLeft = opening;
    if (pot > 0) { var t0 = Math.min(pot, openLeft); openLeft -= t0; pot -= t0; }

    var credit = credited;
    var lines = challans.map(function (c) {
      return { no: c.challanNo || "", ymd: d10(c.createdAt), amount: challanNet(c), left: challanNet(c), site: c.site || "" };
    });
    for (var i = lines.length - 1; i >= 0 && credit > 0; i--) {
      var t1 = Math.min(credit, lines[i].left); lines[i].left -= t1; credit -= t1;
    }
    for (var j = 0; j < lines.length && pot > 0; j++) {
      var t2 = Math.min(pot, lines[j].left); lines[j].left -= t2; pot -= t2;
    }

    var unpaid = lines.filter(function (l) { return l.left > 0.5; });
    var oldest = unpaid.length ? unpaid[0].ymd : "";
    var ageDays = oldest ? daysBetween(oldest, today) : 0;
    /* how much of what he still owes is past the agreed term */
    var overdue = unpaid.reduce(function (s, l) {
      return s + (daysBetween(l.ymd, today) > terms ? l.left : 0);
    }, 0);
    /* An old-book balance is past due by definition - it predates the app - but it
       carries no date, so it is reported on its own rather than given a false age. */
    openLeft = Math.round(openLeft);

    var lastPay = payments.length ? d10(payments[payments.length - 1].date || payments[payments.length - 1].createdAt) : "";

    return {
      name: client.name || "",
      mobile: String(client.mobile || "").replace(/[^\d+]/g, ""),
      owner: String(client.ownedBy || client.createdBy || "").trim(),
      due: due,
      billed: Math.round(billed), paid: Math.round(paid),
      credited: Math.round(credited),
      opening: Math.round(opening), oldBook: openLeft,
      overdue: Math.round(overdue),
      oldestUnpaid: oldest,
      ageDays: ageDays,
      lastPay: lastPay,
      daysSincePay: lastPay ? daysBetween(lastPay, today) : -1,
      challans: challans.length,
      unpaid: unpaid
    };
  }

  /* ---- WHO TO RING FIRST ----
     Not simply the largest debt. A big sum a week old is a normal trade credit;
     a smaller one four months old, with a promise already broken, is the money
     that never comes back. The score is deliberately simple enough to explain to
     the man being asked to make the calls. */
  function chaseScore(row, today) {
    var s = 0;
    s += (row.overdue || 0) / 1000;                 /* every 1000 past term */
    s += (row.oldBook || 0) / 1000;                 /* old-book money is past term by definition */
    if (row.ageDays > 90) s *= 2.0;
    else if (row.ageDays > 60) s *= 1.6;
    else if (row.ageDays > 30) s *= 1.25;
    if (row.promise) {
      if (row.promise.date && row.promise.date < today) s *= 1.8;   /* he said a date and it passed */
      else if (row.promise.date === today) s *= 1.5;                /* he said today */
      else s *= 0.35;                                               /* a live promise - leave him be */
    }
    if (row.daysSincePay < 0 && row.due > 0) s *= 1.3;              /* never paid us anything */
    return Math.round(s * 100) / 100;
  }

  /* Which bucket a client falls in, for the filter chips. One bucket each - the
     first that fits, most urgent first, so no client is counted twice. */
  function bucketOf(row, today) {
    if (row.promise && row.promise.date) {
      if (row.promise.date < today) return "broken";
      if (row.promise.date === today) return "today";
      return "promised";
    }
    if (row.oldBook > 0.5) return "oldbook";
    if (row.overdue > 0.5) return "overdue";
    return "current";
  }

  /* ---------- follow-ups: the call, and the date he promised ----------
     Append-only audit rows, exactly like the delivery proofs. The newest row for a
     client is his current position; every earlier one stays on the sheet as the
     record of what was said before, which is the whole point when a man has
     promised three times already. */
  /* which answers are an actual undertaking to pay */
  var PROMISE_OUTCOMES = ["Promised a date", "Part payment agreed"];
  var _fuCache = null;
  function followMap() {
    if (_fuCache) return _fuCache;
    var m = {};
    ((S.data && S.data.audit) || []).forEach(function (r) {
      if (!r || String(r.action || "") !== "collect:followup") return;
      var d = {};
      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }
      var k = String(d.client || "").trim().toLowerCase();
      if (!k) return;
      var oc = String(d.outcome || "");
      var row = { at: String(r.createdAt || ""), by: r.actor || d.by || "",
                  date: String(d.promised || ""), note: String(d.note || ""),
                  outcome: oc,
                  /* v1.2 - a man who NAMED A DATE TO PAY has made a promise; a man who
                     asked to be rung next week has not. Counting the second as a broken
                     promise would libel him, and would make the number useless for the
                     one decision it exists for: whether to trust him with material. */
                  kind: PROMISE_OUTCOMES.indexOf(oc) >= 0 ? "promise" : "callback" };
      (m[k] = m[k] || []).push(row);
    });
    Object.keys(m).forEach(function (k) {
      m[k].sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
    });
    _fuCache = m;
    return _fuCache;
  }
  function followFor(name) { return followMap()[String(name || "").trim().toLowerCase()] || []; }
  function promiseFor(name) {
    var l = followFor(name);
    for (var i = 0; i < l.length; i++) if (l[i].date) return l[i];
    return null;
  }
  function saveFollow(client, promised, note, outcome) {
    _fuCache = null;
    return api("teamSave", { tab: "audit", row: {
      id: "F-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
      createdAt: new Date().toISOString(), actor: S.user || "",
      action: "collect:followup", target: String(client || ""),
      detail: JSON.stringify({ client: String(client || ""), promised: String(promised || ""),
                               note: String(note || ""), outcome: String(outcome || ""), by: S.user || "" })
    } });
  }

  /* ---------- the book, computed once per paint ---------- */
  var _rowsCache = null;
  function rows() {
    if (_rowsCache) return _rowsCache;
    var d = S.data || {};
    var t = today();
    /* a return is valued at the client's net price; the CRM prices it from the
       catalogue, which this app does not carry, so the stored amount is used and
       a return with no amount is worth nothing rather than a guess */
    var retVal = function (r) { return EWnum(r.amount); };
    var mine = (d.clients || []).filter(function (c) { return String(c.name || "").trim(); });
    if (!seesAll()) {
      var me = String(S.user || "").trim().toLowerCase();
      mine = mine.filter(function (c) {
        return String(c.ownedBy || c.createdBy || "").trim().toLowerCase() === me;
      });
    }
    var out = mine.map(function (c) {
      var r = clientDue({ client: c, challans: d.challans || [], payments: d.payments || [],
                          returns: d.returns || [], today: t, creditDays: CREDIT_DAYS,
                          returnValue: retVal });
      r.promise = promiseFor(c.name);
      r.follows = followFor(c.name).length;
      r.bucket = bucketOf(r, t);
      r.score = chaseScore(r, t);
      return r;
    }).filter(function (r) { return r.due > 500; });
    out.sort(function (a, b) { return b.score - a.score || b.due - a.due; });
    _rowsCache = out;
    return out;
  }
  function EWnum(v) {
    if (typeof v === "number") return isFinite(v) ? v : 0;
    var n = Number(String(v == null ? "" : v).replace(/[^0-9.\-]/g, ""));
    return isFinite(n) ? n : 0;
  }
  function seesAll() { return S.role === "admin" || S.role === "accounts"; }
  function canWrite() { return seesAll(); }
  function rowFor(name) {
    var k = String(name || "").trim().toLowerCase();
    return rows().filter(function (r) { return String(r.name).trim().toLowerCase() === k; })[0] || null;
  }

  var BUCKETS = [
    ["all", "Everyone"],
    ["today", "Promised today"],
    ["broken", "Promise broken"],
    ["overdue", "Past 30 days"],
    ["oldbook", "Old book"],
    ["promised", "Promised later"],
    ["current", "Within terms"],
    /* the ones nobody can ring or message at all - a collection problem that is really
       a missing-phone-number problem, and it is fixed in one minute in the CRM */
    ["nomobile", "No mobile"]
  ];
  /* ---- EXECUTIVE BY EXECUTIVE ----
     Money is owed to the firm but it is chased by a person, and the only way a man
     works his own list is if he can see it as his own. Admin and accounts get every
     executive; an executive sees the one row that is his. */
  function execRows() {
    var by = {};
    rows().forEach(function (r) {
      var k = r.owner || "Unassigned";
      var g = by[k] = by[k] || { name: k, due: 0, overdue: 0, oldBook: 0, n: 0, broken: 0, promisedToday: 0 };
      g.due += r.due; g.overdue += r.overdue; g.oldBook += r.oldBook; g.n++;
      var pr = promiseRecord(r.name);
      if (pr) g.broken += pr.broken;
      if (r.promise && r.promise.date === today()) g.promisedToday += r.due;
    });
    return Object.keys(by).map(function (k) { return by[k]; })
      .sort(function (a, b) { return b.due - a.due; });
  }

  function filtered() {
    var list = rows(), f = S.filter, q = String(S.q || "").trim().toLowerCase();
    if (S.exec) list = list.filter(function (r) { return (r.owner || "Unassigned") === S.exec; });
    if (f === "nomobile") list = list.filter(function (r) { return !r.mobile; });
    else if (f && f !== "all") list = list.filter(function (r) { return r.bucket === f; });
    if (q) list = list.filter(function (r) { return String(r.name).toLowerCase().indexOf(q) >= 0; });
    return list;
  }

  /* ---------- THE OLD BOOK ----------
     53 clients carry ₹78.6 lakh brought forward from the paper ledgers - 91% of
     everything outstanding. Not one of them has a statement attached, so when a man is
     told he owes four lakh he can fairly ask "from what?", and there is no answer in
     anybody's hand. Chasing a figure the customer has never agreed is theatre.
     This list exists to move each name once: from a number nobody has discussed to
     either an AGREED debt or a KNOWN dispute. It empties itself as that happens. */
  var OB_STATES = [
    ["none",     "Not taken up",   "#64748b", "#f1f5f9"],
    ["sent",     "Figure sent",    "#1d4ed8", "#dbeafe"],
    ["agreed",   "He agrees",      "#0f766e", "#ccfbf1"],
    ["disputed", "He disputes",    "#b91c1c", "#fee2e2"],
    ["noanswer", "No answer yet",  "#92400e", "#fef3c7"]
  ];
  function obLabel(k) { var r = OB_STATES.filter(function (x) { return x[0] === k; })[0]; return r ? r[1] : k; }
  function obPill(k) {
    var r = OB_STATES.filter(function (x) { return x[0] === k; })[0] || OB_STATES[0];
    return '<span class="pill" style="color:' + r[2] + ';background:' + r[3] + '">' + esc(r[1]) + '</span>';
  }
  var _obCache = null;
  function obMap() {
    if (_obCache) return _obCache;
    var m = {};
    ((S.data && S.data.audit) || []).forEach(function (r) {
      if (!r || String(r.action || "") !== "collect:oldbook") return;
      var d = {};
      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }
      var k = String(d.client || "").trim().toLowerCase();
      if (!k) return;
      var at = String(r.createdAt || "");
      var prev = m[k];
      if (!prev || at >= prev.at) {
        m[k] = { at: at, by: r.actor || "", state: String(d.state || "none"),
                 agreed: EWnum(d.agreed), note: String(d.note || "") };
      }
    });
    _obCache = m;
    return m;
  }
  function obFor(name) { return obMap()[String(name || "").trim().toLowerCase()] || { state: "none", agreed: 0, note: "", at: "", by: "" }; }
  function saveOldBook(client, state, agreed, note) {
    _obCache = null;
    return api("teamSave", { tab: "audit", row: {
      id: "OB-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
      createdAt: new Date().toISOString(), actor: S.user || "",
      action: "collect:oldbook", target: String(client || ""),
      detail: JSON.stringify({ client: String(client || ""), state: String(state || "none"),
                               agreed: EWnum(agreed), note: String(note || ""), by: S.user || "" })
    } });
  }
  function oldBookRows() {
    return rows().filter(function (r) { return r.oldBook > 0.5; })
      .map(function (r) { r.ob = obFor(r.name); return r; })
      .sort(function (a, b) {
        /* the ones nobody has touched first, then by size - so the list is worked, not admired */
        var w = { none: 0, noanswer: 1, sent: 2, disputed: 3, agreed: 4 };
        return (w[a.ob.state] || 0) - (w[b.ob.state] || 0) || b.oldBook - a.oldBook;
      });
  }

  /* ---------- DOES HE KEEP HIS WORD? ----------
     The most valuable number in a collection book, and the only one that cannot be
     guessed - it has to be earned by logging calls. A promise counts as KEPT if money
     actually arrived between the day it was made and three days after the day he named.
     Three days of grace on purpose: a cheque posted on the day he said is a promise kept.
     Nothing is shown until he has made at least two, because one is not a habit. */
  function promiseRecord(name) {
    var fl = followFor(name).filter(function (f) { return f.date && f.kind === "promise"; });
    if (!fl.length) return null;
    var pays = ((S.data && S.data.payments) || []).filter(function (p) {
      return String(p.client || "").trim().toLowerCase() === String(name).trim().toLowerCase();
    }).map(function (p) { return d10(p.date || p.createdAt); }).filter(Boolean);
    var t = today(), kept = 0, broken = 0, open = 0;
    fl.forEach(function (f) {
      var from = d10(f.at), to = addDays(f.date, 3);
      var paid = pays.some(function (p) { return p >= from && p <= to; });
      if (paid) kept++;
      else if (f.date < t) broken++;
      else open++;
    });
    var done = kept + broken;
    return { kept: kept, broken: broken, open: open, done: done,
             calls: followFor(name).length,
             rate: done ? Math.round(kept / done * 100) : null };
  }
  function promisePill(name) {
    var r = promiseRecord(name);
    if (!r || r.done < 2) return "";
    if (r.rate >= 75) return '<span class="pill grn">Keeps his word · ' + r.kept + ' of ' + r.done + '</span>';
    if (r.rate >= 40) return '<span class="pill amb">Half the time · ' + r.kept + ' of ' + r.done + '</span>';
    return '<span class="pill red">Broke ' + r.broken + ' of ' + r.done + ' promises</span>';
  }

  /* ================= SCREENS ================= */

        : '') +

      '<label>Your PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Your Team CRM PIN"/>' +
      '<div style="height:16px"></div>' +

  function header() {

    return '<div class="top"><div class="t1">' +

      '</div></div>';
  }

  function statTiles() {
    var l = rows(), t = today();
    var tot = l.reduce(function (a, r) { return a + r.due; }, 0);
    var over = l.reduce(function (a, r) { return a + r.overdue + r.oldBook; }, 0);
    var due2day = l.filter(function (r) { return r.promise && r.promise.date === t; });
    var broken = l.filter(function (r) { return r.promise && r.promise.date && r.promise.date < t; });
    var promised = due2day.reduce(function (a, r) { return a + r.due; }, 0);
    return '<div class="stats">' +
      '<div class="stat bad"><div class="n">' + shortMoney(tot) + '</div><div class="l">Outstanding · ' + l.length + ' client' + (l.length === 1 ? '' : 's') + '</div></div>' +
      '<div class="stat bad"><div class="n">' + shortMoney(over) + '</div><div class="l">Past ' + CREDIT_DAYS + ' days, or old book</div>' +
        '<div class="bar"><i style="width:' + (tot > 0 ? Math.min(100, Math.round(over / tot * 100)) : 0) + '%"></i></div></div>' +
      '<div class="stat good"><div class="n">' + shortMoney(promised) + '</div><div class="l">Promised for today · ' + due2day.length + '</div></div>' +
      '<div class="stat ' + (broken.length ? 'bad' : '') + '"><div class="n">' + broken.length + '</div><div class="l">Promise already broken</div></div>' +
      '</div>';
  }

  function chips() {
    var l = rows(), c = {};
    l.forEach(function (r) { c[r.bucket] = (c[r.bucket] || 0) + 1; });
    c.nomobile = l.filter(function (r) { return !r.mobile; }).length;
    return '<div class="chips">' + BUCKETS.map(function (b) {
      var n = b[0] === "all" ? l.length : (c[b[0]] || 0);
      if (!n && b[0] !== "all") return "";
      return '<button class="chip' + (S.filter === b[0] ? ' on' : '') + '" data-act="filter" data-f="' + b[0] + '">' +
        esc(b[1]) + ' <span class="c">' + n + '</span></button>';
    }).join("") + '</div>';
  }

  function promiseLine(r, t) {
    if (!r.promise || !r.promise.date) return "";
    var p = r.promise, isP = p.kind === "promise";
    if (p.date < t) return '<span class="pill red">' + (isP ? 'Said ' : 'Was to be rung ') + esc(dstr(p.date)) + ' — that day has passed</span>';
    if (p.date === t) return '<span class="pill amb">' + (isP ? 'PROMISED TODAY' : 'RING HIM TODAY') + '</span>';
    return '<span class="pill blu">' + (isP ? 'Promised ' : 'Ring again ') + esc(dstr(p.date)) + '</span>';
  }

  function clientCard(r, t) {
    var open = S.open === r.name;
    var tone = (r.overdue > 0 || r.oldBook > 0) ? '#b91c1c' : '#0f172a';
    return '<div class="card" style="padding:0;overflow:hidden">' +
      '<div data-act="open" data-n="' + esc(r.name) + '" style="padding:11px 13px;cursor:pointer">' +
      '<div class="row"><div class="grow">' +
        '<div style="font-weight:800;font-size:14.5px">' + esc(r.name) + '</div>' +
        '<div class="muted" style="margin-top:2px">' +
          (r.oldestUnpaid ? 'Oldest unpaid ' + esc(ageWords(r.ageDays)) : 'No dated delivery') +
          (r.oldBook > 0 ? ' · <b style="color:#b91c1c">' + money(r.oldBook) + ' old book</b>' : '') +
          (r.lastPay ? ' · paid ' + esc(dstr(r.lastPay)) : ' · <b style="color:#b91c1c">never paid</b>') +
        '</div>' +
        '<div style="margin-top:5px">' + promiseLine(r, t) +
          /* v1.1 - does he keep his word, and can he even be rung */
          (promisePill(r.name) ? ' ' + promisePill(r.name) : '') +
          /* v1.2 - how hard has he actually been chased, and how often has he let us down */
          (function () {
            var pr = promiseRecord(r.name), n = followFor(r.name).length;
            var out = "";
            if (n) out += ' <span class="pill">' + n + ' call' + (n === 1 ? '' : 's') + '</span>';
            if (pr && pr.broken) out += ' <span class="pill red">' + pr.broken + ' broken</span>';
            return out;
          })() +
          (r.mobile ? '' : ' <span class="pill red">no mobile</span>') +
          (r.owner ? ' <span class="pill">' + esc(r.owner) + '</span>' : '') + '</div>' +
      '</div>' +
      '<div style="text-align:right"><div class="big" style="color:' + tone + '">' + money(r.due) + '</div>' +
        (r.overdue > 0 ? '<div class="muted" style="color:#b91c1c">' + money(r.overdue) + ' past term</div>' : '') +
      '</div></div></div>' +
      (open ? clientBody(r, t) : '') +
      '</div>';
  }

  function clientBody(r, t) {
    var h = '<div style="border-top:1px solid #e2e8f0;padding:11px 13px;background:#fafafa">';
    h += '<div class="muted" style="margin-bottom:8px">' +
      'Billed ' + money(r.billed + r.opening) + ' · received ' + money(r.paid) +
      (r.credited > 0 ? ' · returns ' + money(r.credited) : '') +
      ' · <b>' + r.challans + ' delivery' + (r.challans === 1 ? '' : ' notes') + '</b></div>';

    if (r.unpaid && r.unpaid.length) {
      h += '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:9px">' +
        r.unpaid.slice(0, 6).map(function (u) {
          var d = EWdays(u.ymd, t), late = d > CREDIT_DAYS;
          return '<div class="row" style="padding:7px 10px;border-bottom:1px solid #f1f5f9">' +
            '<div class="grow"><b style="font-size:12.5px">' + esc(u.no) + '</b>' +
            '<div class="muted">' + esc(dstr(u.ymd)) + ' · ' + esc(ageWords(d)) + (late ? ' <b style="color:#b91c1c">past term</b>' : '') + '</div></div>' +
            '<div style="font-weight:700;color:' + (late ? '#b91c1c' : '#0f172a') + '">' + money(u.left) + '</div></div>';
        }).join("") +
        (r.unpaid.length > 6 ? '<div class="muted" style="padding:7px 10px">and ' + (r.unpaid.length - 6) + ' more</div>' : '') +
        '</div>';
    }
    if (r.oldBook > 0) {
      h += '<div class="muted" style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 10px;margin-bottom:9px;color:#9a3412">' +
        '<b>' + money(r.oldBook) + '</b> is brought forward from the old paper books. It carries no date, so it cannot be aged — but it is the oldest money he owes.</div>';
    }

    var fl = followFor(r.name);
    if (fl.length) {
      h += '<div style="margin-bottom:9px"><div class="muted" style="font-weight:700;margin-bottom:4px">What was said before</div>' +
        fl.slice(0, 4).map(function (f) {

            (f.outcome ? ' · ' + esc(f.outcome) : '') +
            (f.note ? '<br><i>' + esc(f.note) + '</i>' : '') + '</div>';
        }).join("") +
        (fl.length > 4 ? '<div class="muted" style="padding-top:5px">and ' + (fl.length - 4) + ' earlier</div>' : '') +
        '</div>';
    }

    /* v1.4 - the number itself, big enough to read out and tappable to dial. A man
       chasing money reads the number aloud as often as he taps it. */
    h += r.mobile
      ? '<div style="margin-bottom:9px"><a href="tel:' + esc(r.mobile) + '" ' +
        'style="display:inline-flex;align-items:center;gap:8px;background:#ecfdf5;border:1px solid #99f6e4;' +
        'border-radius:10px;padding:8px 12px;text-decoration:none;color:#0f766e;font-weight:800;font-size:16px;letter-spacing:.04em">' +
        '&#9742; ' + esc(r.mobile.length === 10 ? r.mobile.slice(0,5) + " " + r.mobile.slice(5) : r.mobile) + '</a></div>'
      : '<div style="margin-bottom:9px"><span class="pill red">No mobile number on his record \u2014 he cannot be rung or sent anything</span></div>';
    h += '<div class="acts">' +
      (r.mobile ? '<a class="btn sm grn" href="tel:' + esc(r.mobile) + '">Call</a>' : '') +
      (r.mobile ? '<button class="btn sm gry" data-act="wa" data-n="' + esc(r.name) + '">WhatsApp reminder</button>' : '') +
      /* v1.3 - "send me the account" is the commonest thing a customer says on that call,
         and the conversation dies if the answer is "I will send it later" */
      (r.mobile ? '<button class="btn sm gry" data-act="hisab-wa" data-n="' + esc(r.name) + '">Send his hisab</button>' : '') +
      '<button class="btn sm gry" data-act="hisab-dl" data-n="' + esc(r.name) + '">Download hisab</button>' +
      (canWrite() ? '<button class="btn sm" data-act="log" data-n="' + esc(r.name) + '">Log the call</button>' : '') +
      (canWrite() ? '<button class="btn sm grn" data-act="pay" data-n="' + esc(r.name) + '">Payment received</button>' : '') +
      '</div>';
    if (!canWrite()) {
      h += '<div class="muted" style="margin-top:7px">You can ring and remind. Recording money and promises is done by the office.</div>';
    }
    return h + '</div>';
  }

  function EWdays(a, b) { return daysBetween(a, b); }

  /* ---- executive by executive ---- */
  function execBlock() {

    var tot = l.reduce(function (a, x) { return a + x.due; }, 0);
    return '<div class="card" style="padding:11px 13px">' +

          'border:1px solid ' + (on ? '#7f1d1d' : '#e2e8f0') + ';background:' + (on ? '#fef2f2' : '#fff') + '">' +
          '<div class="grow" style="min-width:0">' +
            '<div style="font-weight:700;font-size:13px">' + esc(x.name) + '</div>' +

              (x.broken ? ' · <b style="color:#b91c1c">' + x.broken + ' promise' + (x.broken === 1 ? '' : 's') + ' broken</b>' : '') +
            '</div>' +
            '<div class="bar"><i style="width:' + (tot > 0 ? Math.max(2, Math.round(x.due / tot * 100)) : 0) + '%"></i></div>' +
          '</div>' +
          '<div style="text-align:right;font-weight:800;white-space:nowrap">' + shortMoney(x.due) + '</div>' +
          '</div>';
      }).join("") +
      '<div class="muted" style="margin-top:7px">Tap a name to work only his list.</div></div>';
  }

  /* ---------- THE SEARCH BOX, ON EVERY TAB ----------
     v1.7 - it used to live only on "Everyone". So a man on Today's calls who wanted one
     particular name had to work out which tab it lived on first, and a name that is not
     on today's list, or has no old-book balance, could not be found from those tabs at
     all. It is the same box everywhere now, and it searches the WHOLE book rather than
     the list underneath it - if you can remember his name you can reach him from
     wherever you are standing. Type a name or any part of a phone number. */
  function searchBox() {
    return '<div class="row" style="margin:2px 0 8px">' +
      '<input id="q" class="grow" placeholder="Find any client — name or phone…" value="' + esc(S.q) + '"/>' +
      (S.q ? '<button class="btn sm gry" data-act="qclear">Clear</button>' : '') +
      '</div>';
  }
  /* Searching looks past the filter chips and past which tab you are on, on purpose. */
  function searchHits() {
    var q = String(S.q || "").trim().toLowerCase();
    if (!q) return null;
    var digits = q.replace(/\D/g, "");
    return rows().filter(function (r) {
      if (String(r.name).toLowerCase().indexOf(q) >= 0) return true;
      return !!(digits && String(r.mobile || "").indexOf(digits) >= 0);
    });
  }
  function viewSearch() {
    var t = today(), list = searchHits();
    var h = searchBox();
    if (!list.length) {
      return h + '<div class="empty">Nobody by that name or number owes anything.<br>' +
        'This searches every client in the book, not just the list you were on.</div>';
    }
    var sum = list.reduce(function (a, r) { return a + r.due; }, 0);
    h += '<div class="muted" style="margin:0 2px 6px">' + list.length + ' match' + (list.length === 1 ? '' : 'es') +
      ' · ' + money(sum) + ' — searched every client, not just this tab</div>';
    return h + list.map(function (r) { return clientCard(r, t); }).join("");
  }

  function viewList() {
    var t = today(), list = filtered();
    var h = statTiles() + execBlock() + chips() + searchBox();
    if (!list.length) {
      h += '<div class="empty">' + (S.q ? 'Nobody by that name owes anything.' :
        (S.filter === "all" ? 'Nothing outstanding. Every client is settled.' : 'Nobody in this list right now.')) + '</div>';
      return h;
    }
    var sum = list.reduce(function (a, r) { return a + r.due; }, 0);
    h += '<div class="muted" style="margin:0 2px 4px">' + list.length + ' client' + (list.length === 1 ? '' : 's') +
      ' · ' + money(sum) + ' — hardest first</div>';
    h += list.map(function (r) { return clientCard(r, t); }).join("");
    return h;
  }

  /* Today's calling list: the ones who said today, the ones who broke a promise,
     and then the worst of the rest. Deliberately short - a list of sixty is a list
     nobody works through. */
  function viewToday() {
    var t = today(), l = rows();
    var said = l.filter(function (r) { return r.promise && r.promise.date === t; });
    var _h0 = searchBox();
    var broke = l.filter(function (r) { return r.promise && r.promise.date && r.promise.date < t; });
    var rest = l.filter(function (r) { return said.indexOf(r) < 0 && broke.indexOf(r) < 0; }).slice(0, 8);
    var h = _h0 + '<div class="card" style="background:#7f1d1d;color:#fff;border-color:#7f1d1d">' +
      '<div style="font-size:13px;opacity:.85">' + esc(dstr(t)) + '</div>' +
      '<div style="font-size:17px;font-weight:800;margin-top:2px">' +
      (said.length + broke.length ? (said.length + broke.length) + ' to ring on a promise' : 'No promises outstanding today') + '</div>' +
      '<div style="font-size:12.5px;opacity:.9;margin-top:3px">then the ' + rest.length + ' worst of the rest — ' +
      money(said.concat(broke).concat(rest).reduce(function (a, r) { return a + r.due; }, 0)) + ' in all</div></div>';
    var sec = function (title, arr, note) {
      if (!arr.length) return "";
      return '<div class="muted" style="font-weight:700;margin:14px 2px 2px">' + esc(title) +
        (note ? ' <span style="font-weight:400">— ' + esc(note) + '</span>' : '') + '</div>' +
        arr.map(function (r) { return clientCard(r, t); }).join("");
    };
    h += sec("Due today", said, "he named today, or asked to be rung today");
    h += sec("The day he named has passed", broke, "these are the ones that slip");
    h += sec("Worst of the rest", rest, "most money, longest overdue");
    if (!said.length && !broke.length && !rest.length) h += '<div class="empty">Nothing to chase. Everything is settled.</div>';
    return h;
  }

  /* ---- the old-book worklist ---- */
  function viewOldBook() {

    var agreedRows = list.filter(function (r) { return r.ob.state === "agreed"; });
    var agreedAmt = agreedRows.reduce(function (a, r) { return a + (r.ob.agreed || r.oldBook); }, 0);
    var untouched = list.filter(function (r) { return r.ob.state === "none"; }).length;

  /* ================= THE HISAB, BUILT HERE AND SENT ON THE SPOT =================
     A man rings a customer, the customer says "send me the account", and the whole
     conversation dies if the answer is "I will send it later". This builds his statement
     in a second and puts a link to it in a WhatsApp message.

     It is a RUNNING LEDGER, which is what a customer means by hisab: opening balance,
     then every delivery, every return and every payment in date order, each with the
     balance after it. Not a summary - a summary is what people argue with.

     WhatsApp cannot carry a file through a link (a platform limit), so the PDF is hosted
     by the same backend call the CRM uses for quotes and the link goes in the message. If
     hosting fails the PDF is downloaded instead and the message still goes, so the man is
     never left with nothing. */

  var LOGO_B64 = "";
  function loadLogo() {
    if (LOGO_B64) return Promise.resolve(LOGO_B64);
    return fetch("../assets/logo.jpg").then(function (r) { return r.ok ? r.blob() : null; })
      .then(function (b) {
        if (!b) return "";
        return new Promise(function (res) {
          var fr = new FileReader();
          fr.onload = function () { LOGO_B64 = String(fr.result).split(",")[1] || ""; res(LOGO_B64); };
          fr.onerror = function () { res(""); };
          fr.readAsDataURL(b);
        });
      }).catch(function () { return ""; });
  }

  /* every movement on his account, in the order it happened */
  function ledgerRows(name) {
    var d = S.data || {}, k = String(name || "").trim().toLowerCase();
    var out = [];
    dedupe((d.challans || []).filter(function (c) {
      return String(c.customerName || "").trim().toLowerCase() === k &&
             String(c.receiptReceived || "").toUpperCase() === "Y";
    })).forEach(function (c) {
      out.push({ ymd: d10(c.createdAt), what: "Delivery " + (c.challanNo || ""),
                 extra: c.site || "", debit: challanNet(c), credit: 0 });
    });
    (d.returns || []).filter(function (r) {
      return String(r.customerName || "").trim().toLowerCase() === k &&
             String(r.status || "").trim().toLowerCase() === "received";
    }).forEach(function (r) {
      out.push({ ymd: d10(r.createdAt), what: "Material returned " + (r.returnNo || ""),
                 extra: r.challanNo ? "against " + r.challanNo : "", debit: 0, credit: EWnum(r.amount) });
    });
    (d.payments || []).filter(function (p) {
      return String(p.client || "").trim().toLowerCase() === k;
    }).forEach(function (p) {
      out.push({ ymd: d10(p.date || p.createdAt), what: "Payment received",
                 extra: [p.mode, p.ref].filter(Boolean).join(" · "), debit: 0, credit: EWnum(p.amount) });
    });
    out.sort(function (a, b) { return String(a.ymd).localeCompare(String(b.ymd)); });
    return out;
  }

  function statementPdf(r) {
    /* v1.6 - the builder is fetched here, on the first statement of the day, instead of
       being made a condition of the app starting at all */
    return ensurePdf().then(loadLogo).then(function () {
      var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });

  /* ================= NOTHING LEAVES WITHOUT BEING LOOKED AT =================
     Owner's instruction, and he is right: a message to a customer cannot be recalled.
     A statement sent to the wrong man, or with a figure that has not been checked, costs
     more than the minute it takes to look at it.

     So every outgoing message now goes through one screen that shows three things and
     nothing else: WHO it is going to (the number in full, big enough to read), WHAT it
     says (the actual text, not a description of it), and - for the statement - the PDF
     itself, openable before a word is sent.
     The send button is the only way out of this screen except Cancel. */

  /* ================= FACE ID / FINGERPRINT =================
     The same thing the Team CRM does, and the same honesty about what it is: the phone's
     own biometric unlocks a PIN that is ALREADY stored on that phone. The fingerprint
     never leaves the device and is never sent anywhere - that is how WebAuthn works. The
     server still authenticates with the PIN exactly as before. It is a real lock on a
     convenience, not a new identity system.

     This app already stays signed in on a phone once you have signed in once. Turning
     this on puts the phone's own lock in front of that, which matters when the app is
     showing every rupee eighty-six lakh of it that the firm is owed. */
  var BIO_KEY = "ew_collect_bio";

  function bioAvailable() {
    return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
  }
  function bioSaved() {
    try { return JSON.parse(localStorage.getItem(BIO_KEY) || "null"); } catch (e) { return null; }
  }
  function randBytes(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
  function b64u(buf) {
    var b = new Uint8Array(buf), s2 = "";
    for (var i = 0; i < b.length; i++) s2 += String.fromCharCode(b[i]);
    return btoa(s2).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function fromB64u(str) {
    var s2 = String(str).replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(s2), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  function bioEnrol() {
    if (!bioAvailable()) { toast("This phone has no Face ID or fingerprint the browser can use."); return; }
    if (!S.user || !S.pin) { toast("Sign in first, then turn it on."); return; }
    navigator.credentials.create({
      publicKey: {
        challenge: randBytes(32),
        rp: { name: "Energy World Collection" },
        user: { id: randBytes(16), name: S.user, displayName: S.user },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000, attestation: "none"
      }
    }).then(function (cred) {
      localStorage.setItem(BIO_KEY, JSON.stringify({ id: b64u(cred.rawId), user: S.user, pin: S.pin }));
      toast("Face ID / fingerprint enabled on this phone.");
      S.sheet = sheetAccount(); render();
    }).catch(function () { toast("Could not enable it. Your PIN still works."); });
  }

  function bioUnlock() {
    var saved = bioSaved();
    if (!saved) return;
    navigator.credentials.get({
      publicKey: {
        challenge: randBytes(32),
        allowCredentials: [{ type: "public-key", id: fromB64u(saved.id) }],
        userVerification: "required", timeout: 60000
      }
    }).then(function () {
      S.user = saved.user; S.pin = saved.pin;
      return api("teamAuth", { ua: navigator.userAgent }).then(function (r) {
        if (!r || !r.ok) {
          try { localStorage.removeItem(BIO_KEY); } catch (e) {}
          S.pin = ""; renderLogin("That saved sign-in is no longer valid. Use your PIN.");
          return;
        }
        S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
        if (["admin", "accounts", "sales"].indexOf(S.role) < 0) { S.pin = ""; renderLogin("This app is not open to you."); return; }
        try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: saved.pin, role: S.role })); } catch (e) {}
        S.tab = "today"; pull(false);
      });
    }).catch(function () { toast("That did not match. Use your PIN."); });
  }

  function bioForget() {
    try { localStorage.removeItem(BIO_KEY); } catch (e) {}
    toast("Face ID / fingerprint removed from this phone.");
    S.sheet = sheetAccount(); render();
  }

  function signOut() {
    try { localStorage.removeItem(STORE); } catch (e) {}
    try { localStorage.removeItem(BIO_KEY); } catch (e) {}
    try { localStorage.removeItem(SNAP + "_" + S.user); } catch (e) {}
    S.user = ""; S.pin = ""; S.role = ""; S.data = null; S.sheet = null;
    renderLogin("Signed out on this phone.");
  }

  /* one small screen for the account, because a man needs somewhere to sign out */
  function sheetAccount() {
    var on = !!bioSaved();
    return '<h2>This phone</h2>' +
      '<div class="muted" style="margin-bottom:10px">Signed in as <b>' + esc(S.user) + '</b> · ' + esc(S.role) +
        (canWrite() ? '' : ' · view only') + '</div>' +
      '<div class="card" style="margin-top:0">' +
        '<div style="font-weight:700">Stays signed in</div>' +
        '<div class="muted">This phone remembers you, so the app opens straight onto today\'s calls. Sign out below if the phone is shared or you are handing it over.</div>' +
      '</div>' +
      '<div class="card" style="border-color:' + (on ? '#99f6e4' : '#e2e8f0') + ';background:' + (on ? '#f0fdfa' : '#fff') + '">' +
        '<div style="font-weight:700">Face ID / fingerprint ' + (on ? '<span class="pill grn">on</span>' : '<span class="pill">off</span>') + '</div>' +
        '<div class="muted">' +
          (bioAvailable()
            ? 'The phone\'s own lock in front of the app. Your fingerprint never leaves this phone and is never sent to us — it only unlocks the PIN already saved here. The screen shows every rupee the firm is owed, so it is worth having.'
            : 'This phone or browser cannot do it. Your PIN still works.') +
        '</div>' +
        (bioAvailable()
          ? '<div class="acts">' + (on
              ? '<button class="btn sm gry" data-act="bio-off">Turn it off</button>'
              : '<button class="btn sm grn" data-act="bio-on">Turn it on</button>') + '</div>'
          : '') +
      '</div>' +
      '<div class="acts" style="margin-top:12px">' +
      '<button class="btn gry" data-act="close">Close</button>' +
      '<div class="grow"></div>' +
      '<button class="btn" data-act="signout" style="background:#b91c1c;border-color:#b91c1c">Sign out</button></div>';
  }

  /* ================= PAINT AND PRESS ================= */

  /* One place decides what is under the header, so the full paint and the
     one-letter-at-a-time repaint can never disagree about which screen you are on. */
  function bodyHtml() {
    if (S.q) return viewSearch();
    return S.tab === "today" ? viewToday() : (S.tab === "oldbook" ? viewOldBook() : viewList());
  }

  function render() {
    el("root").innerHTML = header() +
      '<div class="wrap">' + bodyHtml() + '</div>' +
      '<div class="nav">' +
        '<button class="' + (S.tab === "today" ? "on" : "") + '" data-act="tab" data-t="today"><b>&#9742;</b>Today\'s calls</button>' +
        '<button class="' + (S.tab === "list" ? "on" : "") + '" data-act="tab" data-t="list"><b>&#8377;</b>Everyone</button>' +
        '<button class="' + (S.tab === "oldbook" ? "on" : "") + '" data-act="tab" data-t="oldbook"><b>&#128220;</b>Old book</button>' +
        '<button data-act="crm"><b>&#8599;</b>Open CRM</button>' +
      '</div>' +
      (S.sheet ? '<div class="sheet" data-act="close-bg"><div class="inner" data-stop="1">' + S.sheet + '</div></div>' : '');
    var q = el("q");
    if (q) {
      q.addEventListener("input", function (e) { S.q = e.target.value; repaintList(); });
      q.addEventListener("keyup", function (e) { if (e.key === "Enter") e.target.blur(); });
    }
  }
  /* the search box repaints only the list under it, so the caret and the phone
     keyboard stay put while a name is typed one letter at a time */
  function repaintList() {
    var w = document.querySelector(".wrap");
    if (!w) return render();
    var q = el("q"), pos = q ? q.selectionStart : null, v = q ? q.value : "";
    w.innerHTML = bodyHtml();
    var q2 = el("q");
    if (q2) {
      if (q2.value !== v) q2.value = v;
      try { q2.setSelectionRange(pos, pos); } catch (e) {}
      q2.focus();
      q2.addEventListener("input", function (e) { S.q = e.target.value; repaintList(); });
      q2.addEventListener("keyup", function (e) { if (e.key === "Enter") e.target.blur(); });
    }
  }

  function bust() { _rowsCache = null; _fuCache = null; _obCache = null; }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "close-bg" && ev.target.closest("[data-stop]")) return;

    if (act === "login") { doLogin(); return; }
    if (act === "refresh") { pull(true); return; }
    if (act === "reboot") { location.reload(); return; }
    if (act === "qclear") { S.q = ""; render(); return; }
    if (act === "account") { S.sheet = sheetAccount(); render(); return; }
    if (act === "bio-go") { bioUnlock(); return; }
    if (act === "bio-on") { bioEnrol(); return; }
    if (act === "bio-off") { bioForget(); return; }
    if (act === "signout") { signOut(); return; }
    if (act === "crm") { window.open(CRM_URL, "_blank"); return; }
    /* tapping a tab means "show me that list" - so a search left in the box is cleared,
       otherwise the tab appears not to respond at all */
    if (act === "tab") { S.tab = t.getAttribute("data-t"); S.open = ""; S.q = ""; render(); return; }
    if (act === "filter") { S.filter = t.getAttribute("data-f"); S.open = ""; render(); return; }
    if (act === "exec") { S.exec = t.getAttribute("data-n") || ""; S.open = ""; render(); return; }
    if (act === "open") {
      var n = t.getAttribute("data-n");
      S.open = (S.open === n) ? "" : n;
      repaintList(); return;
    }
    if (act === "close" || act === "close-bg") { S.sheet = null; render(); return; }
    if (act === "ob-open") {
      var on = "OB:" + t.getAttribute("data-n");
      S.open = (S.open === on) ? "" : on;
      repaintList(); return;
    }
    if (act === "ob-wa") { S.sheet = sheetSend("oldbook", t.getAttribute("data-n")); render(); return; }
    if (act === "ob-crm") {
      window.open(CRM_URL + "?client=" + encodeURIComponent(t.getAttribute("data-n") || ""), "_blank");
      return;
    }
    if (act === "ob-ans") {
      if (!canWrite()) { toast("Recording this is done by the office."); return; }
      S.sheet = sheetOldBook(t.getAttribute("data-n")); render(); return;
    }
    if (act === "ob-save") {
      if (!canWrite()) { toast("Recording this is done by the office."); return; }
      var obn = t.getAttribute("data-n");
      t.disabled = true; t.textContent = "Saving…";
      saveOldBook(obn, val("ob_state"), EWnum(val("ob_amt")), val("ob_note")).then(function (r) {
        if (!r || !r.ok) { t.disabled = false; t.textContent = "Save"; toast("The server refused it. Nothing was saved."); return; }
        (S.data.audit = S.data.audit || []).push(r.row);
        bust(); S.sheet = null; render();
        toast(obn + " — " + obLabel(val("ob_state")) + ".");
      }).catch(function () {
        t.disabled = false; t.textContent = "Save";
        toast("No signal — nothing was saved. Try again.");
      });
      return;
    }
    if (act === "send-go") {
      var sk = t.getAttribute("data-k"), sn = t.getAttribute("data-n");
      S.sheet = null; render();
      if (sk === "reminder") { waSend(sn); return; }
      if (sk === "hisab") { sendHisab(sn); return; }
      if (sk === "oldbook") { obWaGo(sn); return; }
      if (sk === "receipt") {
        rcWaGo(sn, EWnum(t.getAttribute("data-a")), t.getAttribute("data-m"),
               t.getAttribute("data-d"), EWnum(t.getAttribute("data-b")));
        return;
      }
      return;
    }
    if (act === "rc-wa") {
      S.sheet = sheetSend("receipt", t.getAttribute("data-n"), {
        amt: EWnum(t.getAttribute("data-a")), mode: t.getAttribute("data-m"),
        dt: t.getAttribute("data-d"), bal: EWnum(t.getAttribute("data-b")) });
      render(); return;
    }
    if (act === "wa") { S.sheet = sheetSend("reminder", t.getAttribute("data-n")); render(); return; }
    if (act === "hisab-wa") { S.sheet = sheetSend("hisab", t.getAttribute("data-n")); render(); return; }
    if (act === "hisab-dl") { downloadHisab(t.getAttribute("data-n")); return; }
    if (act === "pay") {
      if (!canWrite()) { toast("Recording money is done by the office."); return; }
      S.sheet = sheetPay(t.getAttribute("data-n")); render(); return;
    }
    if (act === "log") {
      if (!canWrite()) { toast("Recording a promise is done by the office."); return; }
      S.sheet = sheetLog(t.getAttribute("data-n")); render(); return;
    }
    if (act === "pi-full") { var a = el("pi_amt"); if (a) { a.value = t.getAttribute("data-v"); a.focus(); } return; }
    if (act === "fu-day") {
      var d = el("fu_date");
      if (d) d.value = addDays(today(), Number(t.getAttribute("data-d")) || 0);
      return;
    }

    if (act === "pi-save") {
      if (!canWrite()) { toast("Recording money is done by the office."); return; }
      var name = t.getAttribute("data-n");
      var amt = Math.round(EWnum(val("pi_amt")));
      if (!(amt > 0)) { toast("Enter the amount received."); return; }
      var dt = val("pi_date");
      if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(dt)) { toast("Pick the date this money came in."); return; }
      if (dt > today()) { toast("That date has not arrived yet — check it once."); return; }
      /* THE SAME MAN, THE SAME DAY, THE SAME AMOUNT. In this trade that is nearly always
         a double tap or something already in the book, so we stop and ask rather than
         quietly writing a second receipt for money that came in once. */
      var twin = ((S.data && S.data.payments) || []).filter(function (x) {
        return String(x.client || "").trim().toLowerCase() === String(name).trim().toLowerCase() &&
          String(x.date || "").slice(0, 10) === dt &&
          Math.round(EWnum(x.amount)) === amt;
      })[0];
      if (twin && !t.getAttribute("data-force")) {
        t.setAttribute("data-force", "1");
        t.textContent = "Yes — a second, separate payment";
        toast(money(amt) + " from " + name + " on " + dstr(dt) + " is already in the book. Press again only if this is a different payment.");
        return;
      }
      t.disabled = true; t.textContent = "Recording…";
      var row = {
        id: "P-" + Date.now() + "-" + Math.floor(Math.random() * 1000),
        createdBy: S.user, siteId: "", siteName: "",
        client: name, date: dt, amount: amt, mode: val("pi_mode"), ref: val("pi_ref"),
        notes: "Entered in the collection app"
      };
      api("teamSave", { tab: "payments", row: row }).then(function (r) {
        if (!r || !r.ok) { t.disabled = false; t.textContent = "Record it"; toast((r && r.error) || "The server refused it. Nothing was recorded."); return; }
        (S.data.payments = S.data.payments || []).push(r.row || row);
        bust();
        /* v1.1 - the receipt, straight away. The customer gets his confirmation without
           asking, and the man who entered it sees his work leave the building. */
        var after = rowFor(name);
        S.sheet = sheetReceipt(name, amt, val("pi_mode") || row.mode, dt, after ? after.due : 0);
        render();
        toast(money(amt) + " recorded against " + name + ".");
      }).catch(function () {
        t.disabled = false; t.textContent = "Record it";
        toast("No signal — nothing was recorded. Try again when you are back online.");
      });
      return;
    }

    if (act === "fu-save") {
      if (!canWrite()) { toast("Recording a promise is done by the office."); return; }
      var cn = t.getAttribute("data-n");
      var pd = val("fu_date");
      if (pd && pd < today()) { toast("A promised date cannot be in the past."); return; }
      t.disabled = true; t.textContent = "Saving…";
      saveFollow(cn, pd, val("fu_note"), val("fu_out")).then(function (r) {
        if (!r || !r.ok) { t.disabled = false; t.textContent = "Save the call"; toast("The server refused it. Nothing was saved."); return; }
        (S.data.audit = S.data.audit || []).push(r.row);
        bust(); S.sheet = null; render();
        toast(pd ? cn + " will come back up on " + dstr(pd) + "." : "Call noted against " + cn + ".");
      }).catch(function () {
        t.disabled = false; t.textContent = "Save the call";
        toast("No signal — the call was not saved. Try again.");
      });
      return;
    }
  });

  /* ================= COMING AND GOING ================= */

  function doLogin() {
    var name = val("ln"), pin = val("lp");
    if (!name) { renderLogin("Enter your name."); return; }
    if (!pin) { renderLogin("Enter your PIN."); return; }
    S.user = name; S.pin = pin;
    api("teamAuth", { ua: navigator.userAgent }).then(function (r) {
      if (!r || !r.ok) { S.pin = ""; renderLogin((r && r.error) || "Could not sign in."); return; }
      S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
      if (["admin", "accounts", "sales"].indexOf(S.role) < 0) {
        S.pin = ""; S.role = "";
        renderLogin("This app is for the office and the sales team. Ask the owner if you need it.");
        return;
      }
      try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: pin, role: S.role })); } catch (e) {}
      S.tab = "today";
      pull(false);
    }).catch(function () { S.pin = ""; renderLogin("Network error. Try again."); });
  }

  function snapSave() { try { localStorage.setItem(SNAP + "_" + S.user, JSON.stringify({ at: Date.now(), d: S.data })); } catch (e) {} }
  function snapLoad() {
    try {
      var o = JSON.parse(localStorage.getItem(SNAP + "_" + S.user) || "null");
      return o && o.d ? o.d : null;
    } catch (e) { return null; }
  }

  /* Paint the last known book straight away, then let the fresh one land underneath.
     A man standing in a godown on 4G should not watch a spinner to find out who owes him. */
  function pull(loud) {
    var snap = snapLoad();
    if (snap && !S.data) { S.data = snap; bust(); render(); }
    S.busy = true;
    if (S.data) render();
    if (loud) toast("Pulling the latest…");
    return getBook().then(function (r) {
      S.busy = false;
      if (usableBook(r)) { S.data = slimBook(r); S.syncAt = Date.now(); bust(); snapSave(); }
      else if (!S.data) { renderLogin("Could not read the book. Sign in again."); return; }
      else if (loud) { render(); toast("The server sent nothing usable — keeping what is on this phone."); return; }
      render();
      if (loud) toast("Up to date.");
    }).catch(function () {
      S.busy = false;
      if (!S.data) { renderLogin("No signal, and nothing saved on this phone yet."); return; }
      render(); toast("No signal — showing what was last pulled onto this phone.");
    });
  }

  /* v1.0.1 - COMING BACK TO THE APP PULLS THE BOOK.
     This is the app you leave constantly: you tap Call and talk for four minutes, or
     you tap WhatsApp and come back. Without this the screen you return to is the
     screen you left, which is exactly when a man records a payment twice or rings
     someone who has already paid. Throttled to a minute so switching between two apps
     does not hammer the server, and quiet - no toast - because he did not ask for it. */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    if (!S.user || !S.data) return;
    if (S.sheet) return;                       /* never pull the ground from under an open form */
    if (Date.now() - (S.syncAt || 0) < 60000) return;
    pull(false);
  });

  /* the only screen a phone that has never been signed in on will see, and it now
     offers a way out instead of sitting there */
  function openingScreen(msg) {
    el("root").innerHTML = '<div class="login"><h1>Energy World</h1><p>Payment collection</p>' +
      '<div class="empty" id="opmsg">' + esc(msg || "Opening…") + '</div>' +
      '<div id="opretry"></div></div>';
    setTimeout(function () {
      var d = el("opretry");
      if (!d || S.data) return;
      d.innerHTML = '<button class="btn full gry" data-act="reboot">Taking too long — try again</button>';
      var m = el("opmsg");
      if (m) m.textContent = "Still waiting on the server…";
    }, 6000);
  }

  /* ================= OPENING THE APP =================
     v1.6 - REWRITTEN, AND THIS IS THE WHOLE OF WHY IT FELT SLOW.

     What it used to do, in this order:
       1. show "Opening…"
       2. ask the server who you are          - one round trip, 2.4s of pure Apps Script
                                                overhead before a byte of data is asked for
       3. only then read the book             - a second round trip, plus ~680 KB
       4. only then paint anything

     So a man who had used the app yesterday, whose entire book was already sitting on
     his phone, watched "Opening…" for the length of two Apps Script calls - five to six
     seconds on a desk, twenty to forty on mobile data - to be shown figures the phone
     had had the whole time. And if either call stalled, it never painted at all.

     What it does now:
       1. paint the book already on the phone, at once, before any network at all
       2. ask who you are AND read the book together, not one after the other
       3. swap the fresh book in underneath when it lands
       4. if the server says this phone is no longer allowed, take the book off the
          screen and ask for the PIN - so nothing is lost by showing it first */
  (function boot() {
    var sess = null;
    try { sess = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
    if (!(sess && sess.user && sess.pin)) {
      renderLogin();
      regSW();
      return;
    }

    S.user = sess.user; S.pin = sess.pin; S.role = sess.role || "";
    S.tab = "today";

    var snap = snapLoad();
    if (snap) { S.data = snap; bust(); S.busy = true; render(); }
    else openingScreen();

    var authP = api("teamAuth", { ua: navigator.userAgent });
    var dataP = getBook();
    var refused = false;

    authP.then(function (r) {
      if (!r || !r.ok) {
        refused = true; S.pin = ""; S.data = null;
        try { localStorage.removeItem(STORE); } catch (e) {}
        renderLogin("Sign in again.");
        return;
      }
      S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
      if (["admin", "accounts", "sales"].indexOf(S.role) < 0) {
        refused = true; S.pin = ""; S.data = null;
        renderLogin("This app is not open to you.");
        return;
      }
      try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: sess.pin, role: S.role })); } catch (e) {}
      if (S.data) render();
    }).catch(function () { /* handled with the data below */ });

    dataP.then(function (r) {
      if (refused) return;
      S.busy = false;
      if (usableBook(r)) { S.data = slimBook(r); S.syncAt = Date.now(); bust(); snapSave(); render(); }
      else if (!S.data) openingScreen("Could not read the book. Try again.");
      else render();
    }).catch(function () {
      if (refused) return;
      S.busy = false;
      if (S.data) { render(); toast("No signal — showing what was last pulled onto this phone."); }
      else openingScreen("No signal, and nothing saved on this phone yet.");
    });

    regSW();
  })();

  function regSW() {
    if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
  }
})();
</script>
