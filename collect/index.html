/* ==== A TICK BOX IS NOT A TEXT FIELD (23 Aug 2026) ====
   The rule above is right for every field in this app and wrong for the two that are not
   fields: a bare checkbox inherited width:100% and took the whole line, so the label beside
   it dropped underneath. Found on the CRM's HISAB card, fixed everywhere at once. */

  -webkit-appearance:auto;appearance:auto}

   screen that ran the message straight off the right edge of the phone - so the release that

<body>
<div id="root"></div>
<!-- v1.6 - jsPDF IS NO LONGER LOADED HERE.
     It was a 356 KB classic script sitting immediately above the app, and a classic
     script blocks every script after it. So on a phone the whole app waited for a
     third-party CDN before a single line of it ran - and if that CDN was slow or
     unreachable, which on mobile data it often is, the app never started at all and
     the screen simply stayed white. That was the "it will not open on the iPhone".
     It is now fetched the first time somebody actually builds a statement. See
     ensurePdf() below. -->
<script>
(function () {
  "use strict";
  /* ==========================================================================
     ENERGY WORLD - PAYMENT COLLECTION
     A separate app, on purpose. The CRM does everything; this does one thing, so
     the man who opens it in the morning is looking at exactly one question:
     WHO DO I RING TODAY, AND WHAT DO I SAY.

     It signs in with the same name and PIN as the Team CRM and talks to the same
     server, so there is no second list of users, no second password to forget,
     and no second copy of the money that can drift out of step. Nothing about the
     CRM is changed by this app existing.

     WHAT IT WRITES. Two things only:
       - a PAYMENT, onto the same Payments sheet the CRM writes to, in the same
         shape, so a receipt entered here is indistinguishable from one entered there;
       - a FOLLOW-UP (a call, and the date he promised), as an append-only row on
         the AUDIT sheet - the channel the delivery proofs already use. No column is
         added to any tab, so no backend change and no redeployment were needed, and
         a note can be corrected later without anything ever being overwritten.

     WHO CAN DO WHAT. Admin and accounts see every client and may write. A sales
     executive sees only the clients assigned to him and may not write - he can
     still ring and send a reminder, because that is his job; recording money is not.
     Anyone else is refused at the door.
     ========================================================================== */

  var APP_VERSION = "1.27.0";
  var GAS = "https://script.google.com/macros/s/AKfycbzVkPHWyPq-w8RFD_HdG0vCjmrfQvEUpcq_hhF9eDGa0ZbZ3rIx7N37an2DQRGmsxPK/exec";
  var STORE = "ew_collect_session";

  /* ==EW-CORE:BEGIN== built by tools/build_core.py — do not edit here, edit core/ew-core.js == */
/* ==EWCORE:idb== The IndexedDB door. */
/* ==EWCORE:idb== The IndexedDB door. */
  function idbOpen() {
    if (_idbP) return _idbP;
    _idbP = new Promise(function (res) {
      var done = false, fin = function (v) { if (!done) { done = true; res(v); } };
      try {
        if (!window.indexedDB) return fin(null);
        var rq = indexedDB.open(IDB_NAME, 1);
        rq.onupgradeneeded = function () {
          try { rq.result.createObjectStore(IDB_STORE); } catch (e) {}
        };
        rq.onsuccess = function () { fin(rq.result); };
        rq.onerror = function () { fin(null); };
        rq.onblocked = function () { fin(null); };
        /* Safari in private mode can leave open() hanging forever. The app must never wait
           on storage to start - it falls back to localStorage and carries on. */
        setTimeout(function () { fin(null); }, 2500);
      } catch (e) { fin(null); }
    });
    return _idbP;
  }
  function idbSet(k, v) {
    return idbOpen().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(IDB_STORE, "readwrite");
          t.objectStore(IDB_STORE).put(v, k);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
          t.onabort = function () { res(false); };
        } catch (e) { res(false); }
      });
    }).catch(function () { return false; });
  }
  function idbGet(k) {
    return idbOpen().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          var r = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(k);
          r.onsuccess = function () { res(r.result === undefined ? null : r.result); };
          r.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    }).catch(function () { return null; });
  }
  function idbDel(k) {
    return idbOpen().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(IDB_STORE, "readwrite");
          t.objectStore(IDB_STORE).delete(k);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
        } catch (e) { res(false); }
      });
    }).catch(function () { return false; });
  }
/* ==EWCORE:idb:END== */
/* ==EWCORE:bigbox== The big box: what will not fit in the shared 5 MB of localStorage. */
/* ==EWCORE:bigbox== The big box: what will not fit in the shared 5 MB of localStorage. */
  function bigGet(k) {
    if (Object.prototype.hasOwnProperty.call(_big, k)) return _big[k];
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function bigDel(k) { delete _big[k]; idbDel(k); try { localStorage.removeItem(k); } catch (e) {} }
  /* v1.10.0 - THE SAME WRITE, BUT IT ANSWERS.
     bigSet returned true whatever happened: the IndexedDB write is behind a promise and the
     localStorage fallback swallows its own exception. That was tolerable while the big box
     only ever held a CACHE - a catalogue that fails to store is re-fetched tomorrow and
     nobody is worse off. The write journal below is not a cache. It is the only copy of a
     challan a man typed in a basement, and if it did not store, he has to be told NOW, while
     he is still standing there and can write it in the paper book - not in three days when
     somebody notices the delivery is on no screen. */
  function bigSetX(k, v) {
    _big[k] = v;
    return idbSet(k, v).then(function (ok) {
      if (ok) { try { localStorage.removeItem(k); } catch (e) {} return true; }
      try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
    }).catch(function () {
      try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
    });
  }
/* ==EWCORE:bigbox:END== */
/* ==EWCORE:webauthn== Face ID / fingerprint plumbing. No PIN passes through any of it. */
/* ==EWCORE:webauthn== Face ID / fingerprint plumbing. No PIN passes through any of it. */
  function b64u(buf) {
    var b = new Uint8Array(buf), s2 = "";
    for (var i = 0; i < b.length; i++) s2 += String.fromCharCode(b[i]);
    return btoa(s2).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function randBytes(n) {
    var a = new Uint8Array(n); crypto.getRandomValues(a); return a;
  }
  function bioSaved() {
    try { return JSON.parse(localStorage.getItem(BIO_KEY) || "null"); } catch (e) { return null; }
  }
  function bioAvailable() {
    return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
  }
/* ==EWCORE:webauthn:END== */
/* ==EWCORE:tiny== The three-line helpers every app rewrote. */
  /* ---------- tiny helpers ---------- */
  function el(id) { return document.getElementById(id); }
  function lower(s) { return String(s == null ? "" : s).trim().toLowerCase(); }
  /* Pressing a button is a fresh start - never make a man wait out a backoff he can see. */
  function flushNow() { _flushFails = 0; _flushSkip = 0; flushSoon(); }
/* ==EWCORE:tiny:END== */
/* ==EWCORE:crash== The app may not die silently. Found the hard way, 17 Aug. */
  /* THE ONE HONEST TEST OF "did the app draw itself". The header exists only after a real
     paint, so it cannot be fooled by data merely arriving. S.data could be, and was. */
  function painted() {
    try { return !!document.querySelector(".top"); } catch (e) { return false; }
  }
  function crashPut(where, e) {
    var o = { at: Date.now(), where: where || "", ver: APP_VERSION, user: S.user || "",
              msg: (e && e.message) ? String(e.message) : String(e),
              stack: String((e && e.stack) || "").split("\n").slice(0, 4).join(" | ") };
    try { localStorage.setItem(CRASH_KEY, JSON.stringify(o)); } catch (x) {}
    return o;
  }
  function crashLast() {
    try { return JSON.parse(localStorage.getItem(CRASH_KEY) || "null"); } catch (e) { return null; }
  }
  /* Anything that reaches the top, from anywhere, at any time. If the app never painted, the
     screen is dead anyway and is replaced. If it DID paint, he may be half way through a
     challan - so it says so in a toast and leaves his typing exactly where it is. */
  function crashHandle(where, e) {
    var o = crashPut(where, e);
    if (painted()) { try { toast("Something on that screen could not be drawn — tap ↻. (" + o.msg + ")"); } catch (x) {} }
    else crashScreen(o);
  }
/* ==EWCORE:crash:END== */
/* ==EWCORE:refresh== One tap: the latest book AND the latest build. */
  /* ============ WHAT THE REFRESH BUTTON IS ACTUALLY FOR (17 Aug 2026) ============
     Two different jobs hide behind one arrow, and this app only ever did the first:

       1. pull the book again  — it did this;
       2. come back on the NEW BUILD if one has been put up — it did not, and no screen in
          this app did. A release went up and every phone kept running the old one until
          somebody was rung and told to reinstall.

     WHERE THE VERSION COMES FROM. This app's own file on GitHub Pages, fetched past the
     browser cache, with APP_VERSION read straight out of it. Not the backend: that costs
     Apps Script quota on every tap, it is often the very thing that is down when a man
     reaches for this button, and it can disagree with what is actually served. The file
     cannot disagree with itself.

     AND IT NEVER RELOADS UNDER A MAN WHO IS TYPING. If a form is open it says so and does
     nothing at all — Collection learned that in v1.9.1, when the arrow above an open "Log
     the call" silently ate three lines of notes. */
  function liveVersion() {
    return fetch("index.html?v=" + Date.now(), { cache: "reload" })
      .then(function (r) { return r.text(); })
      .then(function (t) { return (t.match(/APP_VERSION\s*=\s*"([\d.]+)"/) || [])[1] || ""; })
      .catch(function () { return ""; });      /* no signal is not a new version */
  }
  function refreshNow(loud) {
    pull(true);
    liveVersion().then(function (v) {
      if (!v || v === APP_VERSION) { if (loud) toast("This is the latest version (v" + APP_VERSION + ")."); return; }
      S.newVer = v;
      try { render(); } catch (e) {}
      toast("Version " + v + " is ready — tap Update above.");
    });
  }
  /* Only this app's shell, and only this app's worker. All seven apps share one github.io
     origin, so a blanket wipe here takes the other six down with it. */
  function updateNow(prefix) {
    var jobs = [];
    try {
      if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.filter(function (k) { return k.indexOf(prefix) === 0; })
                             .map(function (k) { return caches.delete(k); }));
      }));
    } catch (e) {}
    var go = function () { location.replace(location.pathname + "?u=" + Date.now()); };
    if (jobs.length) Promise.all(jobs).then(go, go); else go();
    setTimeout(go, 2500);                      /* never hang on a stuck cache */
  }
  function newVerBar() {
    if (!S.newVer) return "";
    return '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#0f766e;' +
      'color:#fff;font-size:12.5px;font-weight:600">' +
      '<span style="flex:1">Version ' + esc(S.newVer) + ' is ready. You are on ' + esc(APP_VERSION) + '.</span>' +
      '<button class="btn sm" data-act="ver-go" style="background:#fff;color:#0f766e;border-color:#fff">Update</button>' +
            /* .btn.ghost sets a WHITE background, so on this teal band "Later" was white on white -
         invisible. Seen in a screenshot of the real thing, not in the markup. */
      '<button class="btn sm ghost" data-act="ver-later" style="background:transparent;color:#fff;' +
        'border-color:rgba(255,255,255,.55)">Later</button>' +
      '</div>';
  }
/* ==EWCORE:refresh:END== */
/* ==EWCORE:book== Pulling the book, and saying so when it comes back unusable. */
  /* ============ A BOOK WITH NO CLIENTS IS AN ANSWER, NOT A FAILURE ============
     This read `r.clients.length`, so a server that answered perfectly well - ok:true, every
     tab present - was judged UNUSABLE the moment the client list came back empty, and the app
     refused to open at all. From his screen on 17 Aug, in the app's own words:

       asked for the named tabs: server answered ok=true, clients=0,
         tabs=[brands,brandmap,clients,drivers,discounts,challans,returns,audit,associates,sites,pitch]
       then asked for everything: server answered ok=true, clients=0, tabs=[logos,areas,...]

     THE CLIENTS TAB WAS THERE BOTH TIMES. It simply had no rows for that sign-in - while the
     CRM, signed in as admin, was showing a hundred sites off the same sheet at the same
     moment. So the backend is scoping clients to the signed-in man, and this line was turning
     that into a dead end. It is very likely the whole of the original 17 Aug report too: a
     godown sign-in that could not get in, and looked like a network fault.

     Zero clients is something to SAY. It is not a reason to refuse the book. The receipts,
     the approve queue and every challan already on this phone stay usable, and a man who
     cannot start a NEW one is told why instead of being shown a wall. */
  function usableBook(r) {
    return !!(r && r.ok && (Array.isArray(r.clients) || Array.isArray(r.challans)));
  }
  function bookSay(r) {
    if (!r || typeof r !== "object") return "the server sent nothing at all";
    var tabs = Object.keys(r).filter(function (k) { return Array.isArray(r[k]); });
    return "server answered ok=" + String(r.ok) +
      ", clients=" + ((r.clients && r.clients.length) || 0) +
      ", tabs=[" + tabs.join(",") + "]" +
      (r.error ? ", error=" + String(r.error) : "");
  }
  /* ============ THE BOOK COMES DOWN IN PARTS (18 Aug 2026) ============
     "crm app updted in my macbook takes long time to update in godwon android phone."

     It was one call for the whole book before anything new could be shown. The Payment app's
     own comment has carried the size since v1.9.1 - about 680 KB - and a client added on a
     MacBook lives in ONE of those tabs. So `only` is now a parameter: each app asks for the
     half a man is waiting on first, and the history behind it.

     Omitted still means the whole book, which is what the fallback below asks for and what
     anything wanting everything at once should keep asking for. */
  /* ============ "USABLE" MEANS "CARRIES WHAT I ASKED FOR" (29 Aug 2026) ============
     usableBook asks whether an answer holds clients or challans, because that is what makes a
     WHOLE book usable. Applied to a NARROW ask it is simply the wrong question.

     FOUND BY OPENING THE APP AND READING THE TOAST, not by reasoning. The Payment app's second
     call asks for ["audit"] and nothing else, so its answer can never hold clients or challans -
     and this line therefore threw away a perfectly good reply and re-pulled the ENTIRE book,
     every time, on every open, for every collector, while toasting "the short list did not come
     back" as it did so.

     Measured against the live backend the same minute: the narrow ask is 466 KB; the fallback it
     was triggering is 838 KB. The staged pull was costing MORE than the single call it replaced.

     A NAMED ask is usable when it carries the tabs it named. An unnamed ask - the fallback below,
     and anything that wants everything - is judged exactly as before. */
  function askedFor(r, only) {
    if (!r || !r.ok) return false;
    if (!only || !only.length) return usableBook(r);
    for (var i = 0; i < only.length; i++) if (!Array.isArray(r[only[i]])) return false;
    return true;
  }
  function getBook(only) {
    var want = only || KEEP;
    return api("teamGet", { only: want }).then(function (r) {
      if (askedFor(r, only)) { BOOKSAY = ""; return r; }
      BOOKSAY = bookSay(r);
      /* the narrow ask came back unusable - try it the way the CRM does, which works */
      return api("teamGet").then(function (r2) {
        if (usableBook(r2)) {
          BOOKSAY = "";
          try { toast("The short list did not come back — pulled the whole book instead."); } catch (e) {}
          return r2;
        }
        BOOKSAY = "asked for the named tabs: " + BOOKSAY + " — then asked for everything: " + bookSay(r2);

       2. the line on the challan it is booked AGAINST - what this client was actually charged

  /* ---------- the book, computed once per paint ---------- */
  var _rowsCache = null;

    var _ch = d.challans || [];

    ["current", "Within terms"],
    /* the ones nobody can ring or message at all - a collection problem that is really
       a missing-phone-number problem, and it is fixed in one minute in the CRM */
    ["nomobile", "No mobile"]
  ];
  /* ---- EXECUTIVE BY EXECUTIVE ----
     Money is owed to the firm but it is chased by a person, and the only way a man
     works his own list is if he can see it as his own. Admin and accounts get every
     executive; an executive sees the one row that is his. */
  function execRows() {
    var by = {};
    rows().forEach(function (r) {
      var k = r.owner || "Unassigned";
      var g = by[k] = by[k] || { name: k, due: 0, overdue: 0, oldBook: 0, n: 0, broken: 0, promisedToday: 0 };
      g.due += r.due; g.overdue += r.overdue; g.oldBook += r.oldBook; g.n++;
      var pr = promiseRecord(r.name);
      if (pr) g.broken += pr.broken;
      if (r.promise && r.promise.date === today()) g.promisedToday += r.due;
    });
    return Object.keys(by).map(function (k) { return by[k]; })
      .sort(function (a, b) { return b.due - a.due; });
  }

  function filtered() {
    var list = rows(), f = S.filter, q = String(S.q || "").trim().toLowerCase();
    if (S.exec) list = list.filter(function (r) { return (r.owner || "Unassigned") === S.exec; });
    if (f === "nomobile") list = list.filter(function (r) { return !r.mobile; });
    else if (f && f !== "all") list = list.filter(function (r) { return r.bucket === f; });
    if (q) list = list.filter(function (r) {
      if (String(r.name).toLowerCase().indexOf(q) >= 0) return true;
      var rec = ((S.data && S.data.clients) || []).filter(function (c) {
        return String(c.name || "").trim().toLowerCase() === String(r.name || "").trim().toLowerCase();
      })[0];
      return !!(rec && clientHay(rec).indexOf(q) >= 0);   /* v1.16.0 - his firm too */
    });
    return list;
  }

  /* ---------- THE OLD BOOK ----------
     53 clients carry ₹78.6 lakh brought forward from the paper ledgers - 91% of
     everything outstanding. Not one of them has a statement attached, so when a man is
     told he owes four lakh he can fairly ask "from what?", and there is no answer in
     anybody's hand. Chasing a figure the customer has never agreed is theatre.
     This list exists to move each name once: from a number nobody has discussed to
     either an AGREED debt or a KNOWN dispute. It empties itself as that happens. */
  var OB_STATES = [
    ["none",     "Not taken up",   "#64748b", "#f1f5f9"],
    ["sent",     "Figure sent",    "#1d4ed8", "#dbeafe"],
    ["agreed",   "He agrees",      "#0f766e", "#ccfbf1"],
    ["disputed", "He disputes",    "#b91c1c", "#fee2e2"],
    ["noanswer", "No answer yet",  "#92400e", "#fef3c7"]
  ];
  function obLabel(k) { var r = OB_STATES.filter(function (x) { return x[0] === k; })[0]; return r ? r[1] : k; }
  function obPill(k) {
    var r = OB_STATES.filter(function (x) { return x[0] === k; })[0] || OB_STATES[0];
    return '<span class="pill" style="color:' + r[2] + ';background:' + r[3] + '">' + esc(r[1]) + '</span>';
  }
  var _obCache = null;
  function obMap() {
    if (_obCache) return _obCache;
    var m = {};
    ((S.data && S.data.audit) || []).forEach(function (r) {
      if (!r || String(r.action || "") !== "collect:oldbook") return;
      var d = {};
      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }
      var k = String(d.client || "").trim().toLowerCase();
      if (!k) return;
      var at = String(r.createdAt || "");
      var prev = m[k];
      if (!prev || at >= prev.at) {
        m[k] = { at: at, by: r.actor || "", state: String(d.state || "none"),
                 agreed: EWnum(d.agreed), note: String(d.note || "") };
      }
    });
    _obCache = m;
    return m;
  }
  function obFor(name) { return obMap()[String(name || "").trim().toLowerCase()] || { state: "none", agreed: 0, note: "", at: "", by: "" }; }
  function saveOldBook(client, state, agreed, note) {
    _obCache = null;
    return saveRow("audit", {
      id: "OB-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
      createdAt: new Date().toISOString(), actor: S.user || "",
      action: "collect:oldbook", target: String(client || ""),
      detail: JSON.stringify({ client: String(client || ""), state: String(state || "none"),
                               agreed: EWnum(agreed), note: String(note || ""), by: S.user || "" })
    });
  }
  function oldBookRows() {
    return rows().filter(function (r) { return r.oldBook > 0.5; })
      .map(function (r) { r.ob = obFor(r.name); return r; })
      .sort(function (a, b) {
        /* the ones nobody has touched first, then by size - so the list is worked, not admired */
        var w = { none: 0, noanswer: 1, sent: 2, disputed: 3, agreed: 4 };
        return (w[a.ob.state] || 0) - (w[b.ob.state] || 0) || b.oldBook - a.oldBook;
      });
  }

  /* ---------- DOES HE KEEP HIS WORD? ----------
     The most valuable number in a collection book, and the only one that cannot be
     guessed - it has to be earned by logging calls. A promise counts as KEPT if money
     actually arrived between the day it was made and three days after the day he named.
     Three days of grace on purpose: a cheque posted on the day he said is a promise kept.
     Nothing is shown until he has made at least two, because one is not a habit. */
  function promiseRecord(name) {
    var k = String(name || "").trim().toLowerCase();
    if (_pmCache[k] === undefined) _pmCache[k] = promiseRecordRaw(name);
    return _pmCache[k];
  }
  function promiseRecordRaw(name) {
    var fl = followFor(name).filter(function (f) { return f.date && f.kind === "promise"; });
    if (!fl.length) return null;
    var pays = ((S.data && S.data.payments) || []).filter(function (p) {
      return String(p.client || "").trim().toLowerCase() === String(name).trim().toLowerCase();
    }).map(function (p) { return d10(p.date || p.createdAt); }).filter(Boolean);
    var t = today(), kept = 0, broken = 0, open = 0;
    fl.forEach(function (f) {
      var from = d10(f.at), to = addDays(f.date, 3);
      var paid = pays.some(function (p) { return p >= from && p <= to; });
      if (paid) kept++;
      else if (f.date < t) broken++;
      else open++;
    });
    var done = kept + broken;
    return { kept: kept, broken: broken, open: open, done: done,
             calls: followFor(name).length,
             rate: done ? Math.round(kept / done * 100) : null };
  }
  function promisePill(name) {
    var r = promiseRecord(name);
    if (!r || r.done < 2) return "";
    if (r.rate >= 75) return '<span class="pill grn">Keeps his word · ' + r.kept + ' of ' + r.done + '</span>';
    if (r.rate >= 40) return '<span class="pill amb">Half the time · ' + r.kept + ' of ' + r.done + '</span>';
    return '<span class="pill red">Broke ' + r.broken + ' of ' + r.done + ' promises</span>';
  }

  /* ---------------------------------------------------------------------------
     HOW OLD IS THIS BOOK, HONESTLY  (18 Aug 2026)

     HIS REPORT: "client added in crm not showing in challan app on mobile."

     The client WAS in the CRM. Checked against the two books side by side on one machine:
     the CRM held 147 clients, the Challan app held the same 147, and not one was missing.
     The backend was not withholding anything.

     What the header said was:

         updated 15:17

     built with toTimeString(). NO DATE. So a book pulled yesterday afternoon, or last week,
     reads exactly like one pulled five minutes ago. A man adds a client, opens this app,
     sees a fresh-looking time, and concludes the app is broken - when what he actually has
     is an old copy that never re-pulled, usually because the pull failed quietly on one bar
     of signal and the app kept showing the last good time.

     The app was hiding the one fact that explains the whole complaint. Same fault as the
     login that said "Network error" five ways, and the blank district list: the screen
     destroying the evidence needed to read it.

     Now it says the AGE, and it gets louder as the book gets older. */
  function bookAge(ts) {
    ts = Number(ts) || 0;
    if (!ts) return { txt: "never pulled onto this phone", tone: "bad" };
    var ms = Date.now() - ts, d = new Date(ts);
    var hhmm = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    if (ms < 120000) return { txt: "updated just now", tone: "ok" };
    /* same calendar day, not "within 24 hours" - a book from 11pm last night is yesterday's
       book at 8am, and calling it "9 hours old" invites him to trust it */
    var today = new Date();
    var sameDay = d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() &&
                  d.getDate() === today.getDate();
    if (sameDay) return { txt: "updated " + hhmm, tone: ms > 7200000 ? "warn" : "ok" };
    var days = Math.floor(ms / 86400000);
    if (days <= 1) return { txt: "from YESTERDAY " + hhmm, tone: "bad" };
    return { txt: days + " DAYS OLD (" + hhmm + ")", tone: "bad" };
  }
  /* ---- "NOT UPLOADED", SAID WHERE HE IS ALREADY LOOKING (20 Aug 2026) ----
     The other half of "show upload status on every app ... not uploaded or created".

     A record written while the signal was gone is held in the journal and shown on its own
     row - the Challan app has said "Held on this phone" for months. What was missing is the
     COUNT, somewhere a man sees without going to look for it. That matters because the
     dangerous case is the one nobody suspects: the godown writes a challan, it appears on his
     screen exactly like a saved one, and it exists for him and for nobody else. He has no
     reason to go hunting for a pill.

     So it sits in the freshness line at the top, next to how old the book is, which is the
     one place he already reads when he wonders whether what he is looking at is real. */
  function heldSay() {
    var n = 0;
    try { n = jrnCount(); } catch (e) { n = 0; }
    if (!n) return "";
    return '<span class="sync" style="font-weight:800;color:#fecaca"> · ' + n +
      ' not uploaded yet</span>';
  }

    if (a.tone === "ok") return '<span class="sync">' + esc(a.txt) + '</span>' + tail + heldSay();

  }

            '<div class="muted">' + x.n + ' client' + (x.n === 1 ? '' : 's') +
              (x.overdue + x.oldBook > 0.5 ? ' · <b style="color:#b91c1c">' + shortMoney(x.overdue + x.oldBook) + ' past term</b>' : ' · all within terms') +
              (x.broken ? ' · <b style="color:#b91c1c">' + x.broken + ' promise' + (x.broken === 1 ? '' : 's') + ' broken</b>' : '') +
            '</div>' +
            '<div class="bar"><i style="width:' + (tot > 0 ? Math.max(2, Math.round(x.due / tot * 100)) : 0) + '%"></i></div>' +
          '</div>' +
          '<div style="text-align:right;font-weight:800;white-space:nowrap">' + shortMoney(x.due) + '</div>' +
          '</div>';
      }).join("") +
      '<div class="muted" style="margin-top:7px">Tap a name to work only his list.</div></div>';
  }

  /* ---------- THE SEARCH BOX, ON EVERY TAB ----------
     v1.7 - it used to live only on "Everyone". So a man on Today's calls who wanted one
     particular name had to work out which tab it lived on first, and a name that is not
     on today's list, or has no old-book balance, could not be found from those tabs at
     all. It is the same box everywhere now, and it searches the WHOLE book rather than
     the list underneath it - if you can remember his name you can reach him from
     wherever you are standing. Type a name or any part of a phone number. */
  function searchBox() {
    return '<div class="row" style="margin:2px 0 8px">' +
      '<input id="q" class="grow" placeholder="Find any client — name or phone…" value="' + esc(S.q) + '"/>' +
      (S.q ? '<button class="btn sm gry" data-act="qclear">Clear</button>' : '') +
      '</div>';
  }
  /* Searching looks past the filter chips and past which tab you are on, on purpose. */
  function searchHits() {
    var q = String(S.q || "").trim().toLowerCase();
    if (!q) return null;
    var digits = q.replace(/\D/g, "");
    return rows().filter(function (r) {
      /* v1.16.0 - his firm counts too. The ledger row is derived, so the client's own
         record is looked up for the names he is billed under. See clientHay(). */
      if (String(r.name).toLowerCase().indexOf(q) >= 0) return true;
      var rec = ((S.data && S.data.clients) || []).filter(function (c) {
        return String(c.name || "").trim().toLowerCase() === String(r.name || "").trim().toLowerCase();
      })[0];
      if (rec && clientHay(rec).indexOf(q) >= 0) return true;
      return !!(digits && String(r.mobile || "").indexOf(digits) >= 0);
    });
  }
  function viewSearch() {
    var t = today(), list = searchHits();
    var h = searchBox();
    if (!list.length) {
      return h + '<div class="empty">Nobody by that name or number owes anything.<br>' +
        'This searches every client in the book, not just the list you were on &mdash; ' +
        'by his name, his number, or <b>the firm his money comes from</b>.</div>';
    }
    var sum = list.reduce(function (a, r) { return a + r.due; }, 0);
    h += '<div class="muted" style="margin:0 2px 6px">' + list.length + ' match' + (list.length === 1 ? '' : 'es') +
      ' · ' + money(sum) + ' — searched every client, not just this tab</div>';
    return h + list.map(function (r) { return clientCard(r, t); }).join("");
  }

  function viewList() {
    var t = today(), list = filtered();
    var h = statTiles() + execBlock() + chips() + searchBox();
    if (!list.length) {
      h += '<div class="empty">' + (S.q ? 'Nobody by that name owes anything.' :
        (S.filter === "all" ? 'Nothing outstanding. Every client is settled.' : 'Nobody in this list right now.')) + '</div>';
      return h;
    }
    var sum = list.reduce(function (a, r) { return a + r.due; }, 0);
    h += '<div class="muted" style="margin:0 2px 4px">' + list.length + ' client' + (list.length === 1 ? '' : 's') +
      ' · ' + money(sum) + ' — hardest first</div>';
    h += list.map(function (r) { return clientCard(r, t); }).join("");
    return h;
  }

  /* Today's calling list: the ones who said today, the ones who broke a promise,
     and then the worst of the rest. Deliberately short - a list of sixty is a list
     nobody works through. */
  function viewToday() {
    var t = today(), l = rows();
    var said = l.filter(function (r) { return r.promise && r.promise.date === t; });
    var _h0 = searchBox();
    var broke = l.filter(function (r) { return r.promise && r.promise.date && r.promise.date < t; });
    var rest = l.filter(function (r) { return said.indexOf(r) < 0 && broke.indexOf(r) < 0; }).slice(0, 8);
    var h = _h0 + '<div class="card" style="background:#7f1d1d;color:#fff;border-color:#7f1d1d">' +
      '<div style="font-size:13px;opacity:.85">' + esc(dstr(t)) + '</div>' +
      '<div style="font-size:17px;font-weight:800;margin-top:2px">' +
      (said.length + broke.length ? (said.length + broke.length) + ' to ring on a promise' : 'No promises outstanding today') + '</div>' +
      '<div style="font-size:12.5px;opacity:.9;margin-top:3px">then the ' + rest.length + ' worst of the rest — ' +
      money(said.concat(broke).concat(rest).reduce(function (a, r) { return a + r.due; }, 0)) + ' in all</div></div>';
    var sec = function (title, arr, note) {
      if (!arr.length) return "";
      return '<div class="muted" style="font-weight:700;margin:14px 2px 2px">' + esc(title) +
        (note ? ' <span style="font-weight:400">— ' + esc(note) + '</span>' : '') + '</div>' +
        arr.map(function (r) { return clientCard(r, t); }).join("");
    };
    h += sec("Due today", said, "he named today, or asked to be rung today");
    h += sec("The day he named has passed", broke, "these are the ones that slip");
    h += sec("Worst of the rest", rest, "most money, longest overdue");
    if (!said.length && !broke.length && !rest.length) h += '<div class="empty">Nothing to chase. Everything is settled.</div>';
    return h;
  }

  /* ---- the old-book worklist ---- */
  function viewOldBook() {
    var list = oldBookRows();
    var tot = list.reduce(function (a, r) { return a + r.oldBook; }, 0);
    var agreedRows = list.filter(function (r) { return r.ob.state === "agreed"; });
    var agreedAmt = agreedRows.reduce(function (a, r) { return a + (r.ob.agreed || r.oldBook); }, 0);
    var untouched = list.filter(function (r) { return r.ob.state === "none"; }).length;
    var pct = list.length ? Math.round(agreedRows.length / list.length * 100) : 0;

    var h = searchBox() + '<div class="card" style="background:#7f1d1d;color:#fff;border-color:#7f1d1d">' +
      '<div style="font-size:17px;font-weight:800">' + shortMoney(tot) + ' from the old books</div>' +
      '<div style="font-size:12.5px;opacity:.9;margin-top:3px">' + list.length + ' client' + (list.length === 1 ? '' : 's') +
      ' carrying a balance brought forward from the paper ledgers. It has no date, so it can never be aged — ' +
      'and until a man has seen his figure and agreed it, chasing him is talk.</div>' +
      '<div class="bar" style="background:rgba(255,255,255,.25);margin-top:9px"><i style="background:#5eead4;width:' + pct + '%"></i></div>' +
      '<div style="font-size:12px;opacity:.9;margin-top:5px">' +
        agreedRows.length + ' of ' + list.length + ' agreed · ' + shortMoney(agreedAmt) + ' settled on paper' +
        (untouched ? ' · <b>' + untouched + ' not taken up yet</b>' : ' · every one has been taken up') +
      '</div></div>';

    if (!list.length) return h + '<div class="empty">No old-book balances. Everything outstanding is on a dated delivery.</div>';

    h += list.map(function (r) {
      var ob = r.ob, open = S.open === "OB:" + r.name;
      return '<div class="card" style="padding:0;overflow:hidden">' +
        '<div data-act="ob-open" data-n="' + esc(r.name) + '" style="padding:11px 13px;cursor:pointer">' +
        '<div class="row"><div class="grow">' +
          '<div style="font-weight:800;font-size:14.5px">' + esc(r.name) + '</div>' +
          '<div style="margin-top:4px">' + obPill(ob.state) +
            (r.mobile ? '' : ' <span class="pill red">no mobile</span>') +
            (r.owner ? ' <span class="pill">' + esc(r.owner) + '</span>' : '') + '</div>' +
          (ob.at ? '<div class="muted" style="margin-top:3px">' + esc(dstr(String(ob.at).slice(0,10))) + ' · ' + esc(ob.by || "") +
             (ob.state === "agreed" && ob.agreed ? ' · agreed <b>' + money(ob.agreed) + '</b>' : '') + '</div>' : '') +
        '</div>' +
        '<div style="text-align:right"><div class="big" style="color:#b91c1c">' + money(r.oldBook) + '</div>' +
          (r.due !== r.oldBook ? '<div class="muted">' + money(r.due) + ' in all</div>' : '') +
        '</div></div></div>' +
        (open ? obBody(r) : '') + '</div>';
    }).join("");
    return h;
  }

  function obBody(r) {
    var ob = r.ob;
    var h = '<div style="border-top:1px solid #e2e8f0;padding:11px 13px;background:#fafafa">';
    if (ob.note) h += '<div class="muted" style="margin-bottom:8px"><i>' + esc(ob.note) + '</i></div>';
    h += '<div class="muted" style="margin-bottom:9px">Brought forward <b>' + money(r.oldBook) + '</b>' +
      (r.billed > 0 ? ' · since then billed ' + money(r.billed) : '') +
      (r.paid > 0 ? ' · received ' + money(r.paid) : ' · <b style="color:#b91c1c">nothing received</b>') + '</div>';
    h += '<div class="acts">' +
      (r.mobile ? '<a class="btn sm grn" href="tel:' + esc(r.mobile) + '">Call</a>' : '<span class="pill red">No number to ring</span>') +
      (r.mobile ? '<button class="btn sm gry" data-act="ob-wa" data-n="' + esc(r.name) + '">Send him the figure</button>' : '') +
      (r.mobile ? '<button class="btn sm gry" data-act="hisab-wa" data-n="' + esc(r.name) + '">Send his hisab</button>' : '') +
      (canWrite() ? '<button class="btn sm" data-act="ob-ans" data-n="' + esc(r.name) + '">Record his answer</button>' : '') +
      '<button class="btn sm gry" data-act="ob-crm" data-n="' + esc(r.name) + '">Open his hisab in the CRM</button>' +
      '</div>';
    h += '<div class="muted" style="margin-top:7px">The old statement itself is attached on his client record in the CRM — that is the paper that settles the argument.</div>';
    return h + '</div>';
  }

  /* The message that starts the conversation. It states the figure, says plainly where
     it comes from, and asks him to confirm or tell us his own number - which is the only
     question that actually moves an old balance. */
  function obText(r) {
    var l = [];
    l.push("Namaste " + r.name + ",");
    l.push("");
    l.push("Energy World — account confirmation.");
    l.push("As per our books, the balance brought forward against your account is Rs " +
      Math.round(r.oldBook).toLocaleString("en-IN") + ".");
    if (r.billed > 0) l.push("Supplies since then: Rs " + Math.round(r.billed).toLocaleString("en-IN"));
    if (r.paid > 0) l.push("Received from you: Rs " + Math.round(r.paid).toLocaleString("en-IN"));
    l.push("");
    l.push("Kindly confirm this figure, or tell us the amount as per your books so we can reconcile it. We will send the detailed statement on your word.");
    l.push("");
    l.push("Thank you.");
    l.push("Energy World  |  Panipat · Sonipat · Karnal");
    return l.join("\n");
  }

  /* ================= THE TWO THINGS THIS APP WRITES ================= */

      '<label>When will he pay — or when should we ring again?</label>' +
      '<input id="fu_date" type="date" value="" min="' + today() + '"/>' +
      '<div class="acts" style="margin-top:6px">' +
        '<button class="btn sm gry" data-act="fu-day" data-d="0">Today</button>' +

  /* The reminder. Written to be read by a customer, not by us: what he owes, since
     when, and one clear ask. No threat, no lecture - this is a man we want to sell
     to again next month. */
  function waText(r) {
    var lines = [];
    lines.push("Namaste " + r.name + ",");
    lines.push("");
    lines.push("Energy World account update:");
    lines.push("Outstanding: " + money(r.due).replace("₹", "Rs "));
    if (r.oldestUnpaid) lines.push("Oldest pending delivery: " + dstr(r.oldestUnpaid) + " (" + ageWords(r.ageDays) + ")");
    if (r.lastPay) lines.push("Last payment received: " + dstr(r.lastPay));
    lines.push("");
    if (r.promise && r.promise.date && r.promise.date < today()) {
      lines.push("You had kindly indicated " + dstr(r.promise.date) + ". Could you please let us know the revised date?");
    } else {
      lines.push("Kindly arrange the payment at your convenience, or let us know a date that suits you.");
    }
    lines.push("");
    lines.push("Thank you for your business.");
    lines.push("Energy World  |  Panipat · Sonipat · Karnal");
    return lines.join("\n");
  }
  function waSend(name) {
    var r = rowFor(name); if (!r) return;
    var n = String(r.mobile || "").replace(/\D/g, "");
    if (!n) { mbAsk(name); return; }
    if (n.length === 10) n = "91" + n;
    /* opened inside the click, or the phone blocks it */
    window.open("https://wa.me/" + n + "?text=" + encodeURIComponent(waText(r)), "_blank");
  }

  /* ---- recording what he said about the old balance ---- */
  /* ================= A DEAD END BECOMES A DOOR (v1.11.0) =================
     HIS INSTRUCTION: "also ask to enter mobile no and other details in payments and challan
     app, because team mostly use that apps."

     He is right about where the work happens. This app said "No mobile number on his record"
     in FIVE places - once as a red pill on his card and four times as a toast when somebody
     tried to ring, WhatsApp or send a hisab - and every one of them was a dead end. The man
     holding the phone is looking straight at the customer's name, very often WITH the customer
     on the line, which is the one moment the number is easiest to get. And then the app gave
     him nowhere to put it.

     ONLY THE MOBILE IS ASKED FOR HERE, deliberately. The CRM also chases plumber and architect,
     but this app does not pull the `associates` tab, so it has no partner register to pick
     from and would be inviting a free-typed name that matches nobody. The Challan app does
     pull it, and asks for all three. Asking for what you cannot record properly is worse than
     not asking.

     It is written through saveRow(), so it is journalled like everything else here: entered in
     a basement, held on the phone, on the sheet by itself when there is signal. */
  function sheetMobile(name) {
    var c = anyClient(name) || {};
    return '<h2>His mobile</h2>' +
      '<div class="muted" style="margin-bottom:10px">' + esc(name) +

  function sheetOldBook(name) {

  /* ---- the receipt, the moment the money is recorded ----

     at the end of it. This is the thing at the end of it: the customer gets his

  function sheetReceipt(name, amt, mode, dt, bal) {

      '<div class="card" style="border-color:#99f6e4;background:#f0fdfa;margin-top:4px">' +

        ? '<div class="muted" style="margin:10px 0 0">Send him the receipt — he gets confirmation without having to ask for it.</div>' +
          '<div class="acts" style="margin-top:12px">' +
          '<button class="btn grn" data-act="rc-wa" data-n="' + esc(name) + '" data-a="' + amt + '" data-m="' + esc(mode) + '" data-d="' + esc(dt) + '" data-b="' + Math.round(bal) + '">Send the receipt on WhatsApp</button>' +

  function receiptText(name, amt, mode, dt, bal) {
    var l = [];
    l.push("Namaste " + name + ",");
    l.push("");
    l.push("RECEIPT — Energy World");

                   : (bal < 0 ? "Your account is in credit: Rs " + Math.round(-bal).toLocaleString("en-IN")
                              : "Your account is now clear. Thank you."));
    l.push("");
    l.push("With thanks,");
    l.push("Energy World  |  Panipat · Sonipat · Karnal");
    return l.join("\n");
  }

  /* the actual sends, called only from the check screen */
  function obWaGo(name) {
    var r = rowFor(name); if (!r) return;
    var n = String(r.mobile || "").replace(/\D/g, "");
    if (!n) { mbAsk(name); return; }
    if (n.length === 10) n = "91" + n;
    window.open("https://wa.me/" + n + "?text=" + encodeURIComponent(obText(r)), "_blank");
    /* sending the figure IS taking it up - but never downgrading an answer already given */
    if (canWrite() && ["agreed", "disputed"].indexOf(obFor(r.name).state) < 0) {
      saveOldBook(r.name, "sent", 0, "").then(function (x) {
        if (x && x.row) { (S.data.audit = S.data.audit || []).push(x.row); bust(); render(); }
      }).catch(function () {});
    }
  }
  function rcWaGo(name, amt, mode, dt, bal) {
    var r = anyClient(name) || {};
    var n = String(r.mobile || "").replace(/\D/g, "");
    if (!n) { mbAsk(name); return; }
    if (n.length === 10) n = "91" + n;
    window.open("https://wa.me/" + n + "?text=" + encodeURIComponent(receiptText(name, amt, mode, dt, bal)), "_blank");
  }

  /* ================= THE HISAB, BUILT HERE AND SENT ON THE SPOT =================
     A man rings a customer, the customer says "send me the account", and the whole
     conversation dies if the answer is "I will send it later". This builds his statement
     in a second and puts a link to it in a WhatsApp message.

     It is a RUNNING LEDGER, which is what a customer means by hisab: opening balance,
     then every delivery, every return and every payment in date order, each with the
     balance after it. Not a summary - a summary is what people argue with.

     WhatsApp cannot carry a file through a link (a platform limit), so the PDF is hosted
     by the same backend call the CRM uses for quotes and the link goes in the message. If
     hosting fails the PDF is downloaded instead and the message still goes, so the man is
     never left with nothing. */

  var LOGO_B64 = "";
  function loadLogo() {
    if (LOGO_B64) return Promise.resolve(LOGO_B64);
    return fetch("../assets/logo.jpg").then(function (r) { return r.ok ? r.blob() : null; })
      .then(function (b) {
        if (!b) return "";
        return new Promise(function (res) {
          var fr = new FileReader();
          fr.onload = function () { LOGO_B64 = String(fr.result).split(",")[1] || ""; res(LOGO_B64); };
          fr.onerror = function () { res(""); };
          fr.readAsDataURL(b);
        });
      }).catch(function () { return ""; });
  }

  /* every movement on his account, in the order it happened */
  function ledgerRows(name) {
    var d = S.data || {}, k = String(name || "").trim().toLowerCase();
    var out = [];
    /* v1.26.0 - the statement is the evidence FOR the balance, so it obeys the same three
       exclusions. A statement that lists a payment the balance does not count is a statement
       the client will win an argument with. */
    dedupe((d.challans || []).filter(function (c) {
      return String(c.customerName || "").trim().toLowerCase() === k &&
             String(c.receiptReceived || "").toUpperCase() === "Y" &&
             !isCancelled("challans", c.id);
    })).forEach(function (c) {
      out.push({ ymd: d10(c.createdAt), what: "Delivery " + (c.challanNo || ""),
                 extra: c.site || "", debit: challanNet(c), credit: 0 });
    });
    (d.returns || []).filter(function (r) {
      return String(r.customerName || "").trim().toLowerCase() === k &&
             String(r.status || "").trim().toLowerCase() === "received" &&
             !isCancelled("returns", r.id);
    }).forEach(function (r) {
      /* v1.9.0 - the same pricing the balance uses, so the statement and the figure above it
         can never disagree. An unpriceable line is named on the row, not buried. */
      var _rv = returnNet(r, d.challans || []);
      /* v1.25.0 - AND A PRICE WE GUESSED IS SAID OUT LOUD, exactly as the CRM's card says it.
         These lines used to be worth nothing at all here. They are now worth the catalogue
         price at this client's discount, which is very likely the best figure available and
         is certainly not the figure he was billed. He is told which, and both cures are his:
         put the challan number on the return, or type the rate on the line. */
      out.push({ ymd: d10(r.createdAt), what: "Material returned " + (r.returnNo || ""),
                 extra: [r.challanNo ? "against " + r.challanNo : "",
                         _rv.est ? _rv.est + " of " + rnLines(r).length + " priced from our catalogue" : "",
                         _rv.unpriced ? _rv.unpriced + " item(s) not priced - ask the office" : ""]
                        .filter(Boolean).join(" \u00b7 "),
                 debit: 0, credit: _rv.amt });
    });
    (d.payments || []).filter(function (p) {
      return String(p.client || "").trim().toLowerCase() === k && !isCancelled("payments", p.id);
    }).forEach(function (p) {
      out.push({ ymd: d10(p.date || p.createdAt), what: "Payment received",
                 extra: [p.mode, p.ref].filter(Boolean).join(" · "), debit: 0, credit: EWnum(p.amount) });
    });
    out.sort(function (a, b) { return String(a.ymd).localeCompare(String(b.ymd)); });
    return out;
  }

  function statementPdf(r) {
    /* v1.6 - the builder is fetched here, on the first statement of the day, instead of
       being made a condition of the app starting at all */
    return ensurePdf().then(loadLogo).then(function () {
      var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
      var F = function (w) { doc.setFont("helvetica", w === "bold" ? "bold" : "normal"); };
      var W = 210, L = 14, R = W - 14, HB = 26;
      var RS = function (n) { return "Rs." + Math.round(Number(n) || 0).toLocaleString("en-IN"); };

      doc.setFillColor(11, 59, 54); doc.rect(0, 0, W, HB, "F");
      doc.setFillColor(94, 234, 212); doc.rect(0, HB, W, 1, "F");
      if (LOGO_B64) { try { doc.addImage("data:image/jpeg;base64," + LOGO_B64, "JPEG", L, 6, 26, 13); } catch (e) {} }
      F("bold"); doc.setFontSize(7.4); doc.setTextColor(148, 210, 200);
      doc.text("STATEMENT OF ACCOUNT", R, 8, { align: "right" });
      F("bold"); doc.setFontSize(12); doc.setTextColor(255, 255, 255);
      doc.text(String(r.name), R, 14.5, { align: "right" });
      F("normal"); doc.setFontSize(7.6); doc.setTextColor(172, 212, 205);
      if (r.mobile) doc.text("Mobile: " + r.mobile, R, 19.5, { align: "right" });
      doc.text("As on " + dstr(today()), R, 23.5, { align: "right" });

      var y = HB + 11;
      var cD = L + 2, cW = L + 22, cDb = R - 74, cCr = R - 40, cB = R - 2;
      var head = function () {
        doc.setFillColor(11, 59, 54); doc.rect(L, y - 4, R - L, 6, "F");
        doc.setTextColor(255, 255, 255); F("bold"); doc.setFontSize(6.6);
        doc.text("DATE", cD, y); doc.text("PARTICULARS", cW, y);
        doc.text("DELIVERED", cDb, y, { align: "right" });
        doc.text("RECEIVED", cCr, y, { align: "right" });
        doc.text("BALANCE", cB, y, { align: "right" });
        y += 6;
      };
      head();
      var bal = 0;
      var line = function (dt, what, extra, db, cr, bold) {
        if (y > 268) { doc.addPage(); y = 20; head(); }
        F(bold ? "bold" : "normal"); doc.setFontSize(7.4); doc.setTextColor(17, 34, 45);
        doc.text(dt || "-", cD, y);
        doc.text(doc.splitTextToSize(String(what || ""), cDb - cW - 6)[0] || "", cW, y);
        if (db) doc.text(RS(db), cDb, y, { align: "right" });
        if (cr) { doc.setTextColor(13, 118, 108); doc.text(RS(cr), cCr, y, { align: "right" }); doc.setTextColor(17, 34, 45); }
        F("bold"); doc.text(RS(bal), cB, y, { align: "right" });
        if (extra) {
          /* v1.25.0 - THIS TOOK [0] AND THREW THE REST AWAY. The note column is 80 mm wide and
             a return can carry a challan number 21 characters long plus a reason; anything past
             the first wrapped line vanished mid-sentence with nothing to show it had. Measured,
             not guessed: "against NAVEEN3471/230826/R01 - 12 of 13 priced from our catalogue"
             is 67 characters and does not fit. Print every line it wraps to, and move the
             cursor down by however many there were. */
          F("normal"); doc.setFontSize(6.2); doc.setTextColor(120, 130, 145);
          var _xl = doc.splitTextToSize(String(extra), cDb - cW - 6);
          for (var _i = 0; _i < _xl.length; _i++) { y += 3.4; doc.text(_xl[_i], cW, y); }
        }
        y += 5.6;
      };

      /* ============ AN ADVANCE IS MONEY HE HAS ALREADY GIVEN US (v1.26.1) ============
         `r.opening > 0` meant a NEGATIVE opening - an advance he has paid and not yet drawn
         against - was neither printed on the statement nor added to its running balance, while
         clientDue() counted it in the figure on his card all along. The statement and the app
         therefore disagreed by the whole advance, and the statement is the half that gets sent
         to the customer on WhatsApp.

         MEASURED ON HIS BOOK, 30 Aug 2026: two clients hold one.
           Asian Handicraft   65,217
           Piyush Gupta       13,231
                              ------
                              78,448  asked for, on paper, from men who had already paid it

         This is the same fault the CRM carried until v6.9.368 - hidden behind `opening > 0` on
         the ledger card while being counted in the balance beside it - and it is fixed the same
         way. A credit is shown in the RECEIVED column, because that is what it is. */
      if (r.opening > 0) {
        bal += r.opening;
        line("", "Balance brought forward from earlier books", "", r.opening, 0, true);
      } else if (r.opening < 0) {
        bal += r.opening;
        line("", "Advance held from earlier books", "", 0, -r.opening, true);
      }
      var rows2 = ledgerRows(r.name);
      rows2.forEach(function (x) {
        bal += x.debit - x.credit;
        line(dstr(x.ymd), x.what, x.extra, x.debit, x.credit, false);
      });
      if (!rows2.length && !r.opening) line("", "No entries on this account.", "", 0, 0, false);

      y += 3;
      if (y > 258) { doc.addPage(); y = 24; }
      doc.setDrawColor(13, 118, 108); doc.setLineWidth(0.5); doc.line(L, y, R, y); y += 7;
      F("bold"); doc.setFontSize(12); doc.setTextColor(bal > 0 ? 185 : 15, bal > 0 ? 28 : 118, bal > 0 ? 28 : 110);
      doc.text(bal > 0 ? "Balance payable" : (bal < 0 ? "In your credit" : "Account clear"), cDb, y, { align: "right" });
      doc.text(RS(Math.abs(bal)), cB, y, { align: "right" });
      y += 9;

      F("normal"); doc.setFontSize(7); doc.setTextColor(100, 116, 139);
      if (r.oldestUnpaid) {
        doc.text("Oldest pending delivery: " + dstr(r.oldestUnpaid) + "  (" + ageWords(r.ageDays) + ")", L, y); y += 4.6;
      }
      if (r.opening !== 0) {
        doc.splitTextToSize("The brought-forward figure is from our earlier books. If it does not agree with yours, tell us and we will reconcile it line by line.", R - L)
          .forEach(function (ln) { doc.text(ln, L, y); y += 4; });
      }
      y += 2;
      doc.text("Terms: payment within " + CREDIT_DAYS + " days of delivery.", L, y);

      doc.setFontSize(6.4); doc.setTextColor(150, 163, 175);
      doc.text("Energy World  |  Panipat . Sonipat . Karnal    |    Statement of account, not a tax invoice.", L, 288);
      return doc;
    });
  }

  /* ================= NOTHING LEAVES WITHOUT BEING LOOKED AT =================
     Owner's instruction, and he is right: a message to a customer cannot be recalled.
     A statement sent to the wrong man, or with a figure that has not been checked, costs
     more than the minute it takes to look at it.

  /* ================= FACE ID / FINGERPRINT =================
     The same thing the Team CRM does, and the same honesty about what it is: the phone's
     own biometric unlocks a PIN that is ALREADY stored on that phone. The fingerprint
     never leaves the device and is never sent anywhere - that is how WebAuthn works. The
     server still authenticates with the PIN exactly as before. It is a real lock on a
     convenience, not a new identity system.

     This app already stays signed in on a phone once you have signed in once. Turning
     this on puts the phone's own lock in front of that, which matters when the app is
     showing every rupee eighty-six lakh of it that the firm is owed. */
  var BIO_KEY = "ew_collect_bio";


  function fromB64u(str) {
    var s2 = String(str).replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(s2), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  function bioEnrol() {
    if (!bioAvailable()) { toast("This phone has no Face ID or fingerprint the browser can use."); return; }
    if (!S.user || !S.pin) { toast("Sign in first, then turn it on."); return; }
    navigator.credentials.create({
      publicKey: {
        challenge: randBytes(32),
        rp: { name: "Energy World Collection" },
        user: { id: randBytes(16), name: S.user, displayName: S.user },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000, attestation: "none"
      }
    }).then(function (cred) {
      localStorage.setItem(BIO_KEY, JSON.stringify({ id: b64u(cred.rawId), user: S.user, pin: S.pin }));
      toast("Face ID / fingerprint enabled on this phone.");
      S.sheet = sheetAccount(); render();
    }).catch(function () { toast("Could not enable it. Your PIN still works."); });
  }

  function bioUnlock() {
    var saved = bioSaved();
    if (!saved) return;
    navigator.credentials.get({
      publicKey: {
        challenge: randBytes(32),
        allowCredentials: [{ type: "public-key", id: fromB64u(saved.id) }],
        userVerification: "required", timeout: 60000
      }
    }).then(function () {
      S.user = saved.user; S.pin = saved.pin;
      /* v1.12.0 - this fell through to the outer catch, so a dropped packet told the man his
         fingerprint did not match. It matched. Give it its own catch. */
      return authOnce(1).catch(function (e) {
        S.pin = ""; renderLogin(loginWhy(e)); return null;
      }).then(function (r) {
        if (r === null) return;
        if (!r || !r.ok) {
          try { localStorage.removeItem(BIO_KEY); } catch (e) {}
          S.pin = ""; renderLogin("That saved sign-in is no longer valid. Use your PIN.");
          return;
        }
        S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
        try { beatStart(); } catch (e) {}   /* v1.20.0 - from here it asks on its own */
        if (!roleAny(["admin","accounts","sales"])) { S.pin = ""; renderLogin(notForYou(S.user, S.role)); S.role = ""; return; }
        try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: saved.pin, role: S.role })); } catch (e) {}
        startFlushTicker();          /* the PIN path started it; Face ID never did, so a held
                                        payment on a Face ID phone had nothing running to send it */
        S.tab = "today"; pull(false);
      });
    }).catch(function () { toast("That did not match. Use your PIN."); });
  }

  function bioForget() {
    try { localStorage.removeItem(BIO_KEY); } catch (e) {}
    toast("Face ID / fingerprint removed from this phone.");
    S.sheet = sheetAccount(); render();
  }

  /* ============ FORGETTING THE BOOK MEANS FORGETTING WHEN IT CAME ============
     `S.data = null` was clearing the book and leaving the stamps that describe it standing.
     The header then read "updated 13:15" over a screen with no book behind it at all, and
     from v1.28.0 it was worse than cosmetic: the lead check asks S.restAt whether the
     delivery history has been pulled THIS session before it is willing to refuse a man at the
     counter. Sign out as one man and in as another on the same phone without reloading, and
     that answer belonged to somebody else's book.

     Three stamps, one place, so a fourth cannot be added and missed. */
  function forgetBook() {
    S.data = null; S.syncAt = 0; S.fastAt = 0; S.restAt = 0;
  }

  function signOut() {
    try { localStorage.removeItem(STORE); } catch (e) {}
    try { localStorage.removeItem(BIO_KEY); } catch (e) {}
    try { bigDel(SNAP + "_" + S.user); } catch (e) {}
    S.user = ""; S.pin = ""; S.role = ""; forgetBook(); S.sheet = null;
    renderLogin("Signed out on this phone.");
  }

      '</div>' +
      '<div class="card" style="border-color:' + (on ? '#99f6e4' : '#e2e8f0') + ';background:' + (on ? '#f0fdfa' : '#fff') + '">' +
        '<div style="font-weight:700">Face ID / fingerprint ' + (on ? '<span class="pill grn">on</span>' : '<span class="pill">off</span>') + '</div>' +
        '<div class="muted">' +
          (bioAvailable()
            ? 'The phone\'s own lock in front of the app. Your fingerprint never leaves this phone and is never sent to us — it only unlocks the PIN already saved here. The screen shows every rupee the firm is owed, so it is worth having.'
            : 'This phone or browser cannot do it. Your PIN still works.') +
        '</div>' +
        (bioAvailable()
          ? '<div class="acts">' + (on
              ? '<button class="btn sm gry" data-act="bio-off">Turn it off</button>'
              : '<button class="btn sm grn" data-act="bio-on">Turn it on</button>') + '</div>'
          : '') +
      '</div>' +
      '<div class="acts" style="margin-top:12px">' +
      '<button class="btn gry" data-act="close">Close</button>' +
      '<div class="grow"></div>' +
      '<button class="btn" data-act="signout" style="background:#b91c1c;border-color:#b91c1c">Sign out</button></div>';
  }

  /* ================= WHEN THE PAINT ITSELF DIES (v1.13.0) =================
     Ported from Challan v1.14.0, where it was found. Reported there as the app stuck on one
     word with no button at all, and reproduced exactly. The mechanism is worth repeating
     because this app has the same shape and could freeze the same way:

       * S.data is set on the line BEFORE the paint, so by the time render() runs the app
         believes it has everything.
       * If render() throws, the throw goes into nothing - no screen, no store, nothing
         anybody could read out over the phone.
       * And the boot catch then calls render() AGAIN, which throws again, unhandled.

     A man is left staring at a dead screen with no way forward and nothing to tell anybody.
     Same fault as "Network error. Try again." earlier the same day: the app destroying the
     evidence needed to fix it. Same shape of fix - CATCH it, SHOW it, KEEP it.

     Nothing is deleted. The journal, the snapshot and the session are never touched, and the
     crash screen says out loud how much money is still held safe on the phone. */
  var CRASH_KEY = "ew_collect_crash_v1";


  function crashScreen(o) {
    o = o || {};
    var held = 0; try { held = jrnCount(); } catch (e) {}
    try {
      el("root").innerHTML =
        '<div class="login"><h1>Energy World</h1><p>Payments &amp; collection</p>' +
        '<div class="loginmsg">This app could not draw its screen. Nothing has been lost — ' +
        (held ? 'the ' + held + ' payment(s) held on this phone are still here, and still go up.'
              : 'nothing was waiting to go up.') +
        '</div>' +
        '<div class="muted" style="font-size:12px;line-height:1.5;margin:0 0 14px;word-break:break-word;' +
             'background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px">' +
          '<b>Read this out and it can be fixed:</b><br>' + esc(o.msg || "no message") + '<br>' +
          '<span style="color:#94a3b8">v' + esc(o.ver || APP_VERSION) + ' · ' + esc(o.where || "") +
          (o.user ? ' · ' + esc(o.user) : '') + '</span></div>' +
        '<button class="btn full" data-act="crash-retry">Try again</button>' +
        '<div style="height:8px"></div>' +
        '<button class="btn full ghost" data-act="crash-fresh">Get the latest version</button>' +
        '<div class="muted" style="text-align:center;margin-top:14px">If it keeps happening, ' +
        'show this screen to the office. v' + APP_VERSION + '</div></div>';
    } catch (e) {
      try { document.body.innerHTML = '<div style="font:15px system-ui;padding:24px">' +
        'Energy World could not open. Close the app and open it again.</div>'; } catch (x) {}
    }
  }


  window.addEventListener("error", function (ev) {
    crashHandle("error", (ev && ev.error) || new Error((ev && ev.message) || "unknown"));
  });
  window.addEventListener("unhandledrejection", function (ev) {
    crashHandle("promise", (ev && ev.reason) || new Error("unknown"));
  });

  /* One wrapper, so every call site is covered without any of them remembering to be. */
  function render() {
    try { renderBody(); }
    catch (e) { crashHandle("render", e); }
  }

  function renderBody() {
    el("root").innerHTML = header() +
      '<div class="wrap">' + bodyHtml() + '</div>' +
      '<div class="nav">' +
        '<button class="' + (S.tab === "today" ? "on" : "") + '" data-act="tab" data-t="today"><b>&#9742;</b>Today\'s calls</button>' +
        '<button class="' + (S.tab === "list" ? "on" : "") + '" data-act="tab" data-t="list"><b>&#8377;</b>Everyone</button>' +
        '<button class="' + (S.tab === "oldbook" ? "on" : "") + '" data-act="tab" data-t="oldbook"><b>&#128220;</b>Old book</button>' +
        '<button data-act="crm"><b>&#8599;</b>Open CRM</button>' +
      '</div>' +
      '<div id="ew_sync_banner" style="display:none"></div>' +
      (S.sheet ? '<div class="sheet" data-act="close-bg"><div class="inner" data-stop="1">' + S.sheet + '</div></div>' : '');
    var q = el("q");
    if (q) {
      q.addEventListener("input", function (e) { S.q = e.target.value; repaintList(true); });
      q.addEventListener("keyup", function (e) { if (e.key === "Enter") e.target.blur(); });
    }
    jrnPaint(); syncBottomVar();
  }
  /* the search box repaints only the list under it, so the caret and the phone
     keyboard stay put while a name is typed one letter at a time */
  /* v1.9.1 - refocus ONLY when the repaint came from the search box.
     repaintList() is called from three places: the search input, where the focus must be kept,
     and opening or closing a client card, where it must not. It refocused unconditionally, so
     every single tap on a card threw the keyboard up over the Payment received and Call buttons
     the tap was aiming at, and jumped the page. */
  function repaintList(keepFocus) {
    var w = document.querySelector(".wrap");
    if (!w) return render();
    var q = el("q"), pos = q ? q.selectionStart : null, v = q ? q.value : "";
    w.innerHTML = bodyHtml();
    var q2 = el("q");
    if (q2) {
      if (q2.value !== v) q2.value = v;
      if (keepFocus) {
        try { q2.setSelectionRange(pos, pos); } catch (e) {}
        q2.focus();
      }
      q2.addEventListener("input", function (e) { S.q = e.target.value; repaintList(true); });
      q2.addEventListener("keyup", function (e) { if (e.key === "Enter") e.target.blur(); });
    }
  }

  /* v1.9.1 - promiseRecord() and followFor() each filter the whole payments/followups
     array, and clientCard() calls them three times per visible client - on every letter typed
     into the search box. Memoised into the same cache bust() already clears. */
  var _pmCache = {}, _flCache = {};
  /* v1.26.0 - AND the cancellation map, which is built from `audit`. audit arrives in the
     SECOND half of the pull, so a map built during the first paint knows nothing about it.
     bust() runs on the fast merge in both pull paths, before anything reads it again, so one
     line here covers every route the book takes in. A cancellation cache that is not dropped
     shows a cancelled payment as live, which is the exact fault this release exists to fix. */
  function bust() { _rowsCache = null; _fuCache = null; _obCache = null; _pmCache = {}; _flCache = {}; _cxCache = null; _hxCache = null; _dupCache = null; }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "close-bg" && ev.target.closest("[data-stop]")) return;

    if (act === "login") { doLogin(); return; }
    if (act === "refresh") {
      /* v1.9.1 - S.sheet is a static string captured when the form opened, and pull() calls
         render(), which rewrites it. Tapping the arrow above an open 'Log the call' silently
         wiped three lines of notes. visibilitychange has always guarded this; the button did not. */
      if (S.sheet) { toast("Finish or close this first \u2014 refreshing would clear what you have typed."); return; }
      refreshNow(true); return;
    }
    if (act === "ver-go")    { updateNow("ew-collect-"); return; }
    if (act === "ver-later") { S.newVer = ""; render(); return; }
    if (act === "reboot") { location.reload(); return; }
    if (act === "crash-retry") { location.replace(location.pathname + "?u=" + Date.now()); return; }

    if (act === "qclear") { S.q = ""; render(); return; }
    if (act === "account") { S.sheet = sheetAccount(); render(); return; }
    if (act === "bio-go") { bioUnlock(); return; }
    if (act === "bio-on") { bioEnrol(); return; }
    if (act === "bio-off") { bioForget(); return; }
    if (act === "signout") { signOut(); return; }
    if (act === "crm") { window.open(CRM_URL, "_blank"); return; }
    /* tapping a tab means "show me that list" - so a search left in the box is cleared,

    if (act === "tab") { S.tab = t.getAttribute("data-t"); S.open = ""; S.q = ""; render(); return; }
    if (act === "filter") { S.filter = t.getAttribute("data-f"); S.open = ""; render(); return; }
    if (act === "exec") { S.exec = t.getAttribute("data-n") || ""; S.open = ""; render(); return; }
    if (act === "open") {

    if (act === "ob-open") {

    }
    if (act === "ob-wa") { S.sheet = sheetSend("oldbook", t.getAttribute("data-n")); render(); return; }
    if (act === "ob-crm") {
      window.open(CRM_URL + "?client=" + encodeURIComponent(t.getAttribute("data-n") || ""), "_blank");
      return;
    }
    if (act === "ob-ans") {

    }
    if (act === "ob-save") {

      saveOldBook(obn, val("ob_state"), EWnum(val("ob_amt")), val("ob_note")).then(function (r) {

      }).catch(function () {

    }
    if (act === "send-go") {
      var sk = t.getAttribute("data-k"), sn = t.getAttribute("data-n");
      S.sheet = null; render();
      if (sk === "reminder") { waSend(sn); return; }
      if (sk === "hisab") { sendHisab(sn); return; }
      if (sk === "oldbook") { obWaGo(sn); return; }
      if (sk === "receipt") {

               t.getAttribute("data-d"), EWnum(t.getAttribute("data-b")));
        return;
      }
      return;
    }
    if (act === "rc-wa") {
      S.sheet = sheetSend("receipt", t.getAttribute("data-n"), {
        amt: EWnum(t.getAttribute("data-a")), mode: t.getAttribute("data-m"),
        dt: t.getAttribute("data-d"), bal: EWnum(t.getAttribute("data-b")) });
      render(); return;
    }
    if (act === "wa") { S.sheet = sheetSend("reminder", t.getAttribute("data-n")); render(); return; }
    if (act === "hisab-wa") { S.sheet = sheetSend("hisab", t.getAttribute("data-n")); render(); return; }
    if (act === "hisab-dl") { downloadHisab(t.getAttribute("data-n")); return; }
    if (act === "pay") {
      if (!canWrite()) { toast("Recording money is done by the office."); return; }
      S.sheet = sheetPay(t.getAttribute("data-n")); render(); return;
    }
    if (act === "log") {
      if (!canWrite()) { toast("Recording a promise is done by the office."); return; }
      S.sheet = sheetLog(t.getAttribute("data-n")); render(); return;
    }
    if (act === "mb-ask") { mbAsk(t.getAttribute("data-n")); return; }
    if (act === "mb-save") {
      var mbn = t.getAttribute("data-n");
      var mbc = anyClient(mbn);
      if (!mbc || !mbc.id) { toast("Could not find him on the book."); return; }
      var mb = String(val("mb_no") || "").replace(/\D/g, "");
      if (mb.length !== 10) { toast("A mobile is 10 digits."); return; }
      /* ================= SEND THE WHOLE ROW, NOT A PATCH =================
         This app's saveRow() sends exactly what it is given - unlike the CRM's save(), which
         merges into the copy already in memory first. And the backend WRITES THE WHOLE SHEET
         ROW FROM WHAT IT RECEIVES: any column not sent is written BLANK. The CRM carries that
         warning next to its own save, with the note that a partial write once blanked a team
         member's name during a PIN reset.

         So a three-field patch here would have saved his mobile and wiped his address, credit
         limit, opening balance and billing profiles. The full in-memory row goes up with the
         one field changed, which is safe whether the backend merges or overwrites. */
      var mbRow = Object.assign({}, mbc, { mobile: mb });
      saveRow("clients", mbRow).then(function (r) {
        mbc.mobile = mb;                                   /* on his screen at once */
        bust(); S.sheet = null; render();
        toast(mbc.name + " — " + mb + " saved" + (r.held ? ", held on this phone until there is signal" : "") + ".");
      });
      return;
    }
    if (act === "jrn-retry") { flushNow(); toast("Trying now…"); return; }
    if (act === "pi-full") { var a = el("pi_amt"); if (a) { a.value = t.getAttribute("data-v"); a.focus(); } return; }
    if (act === "fu-day") {
      var d = el("fu_date");
      if (d) d.value = addDays(today(), Number(t.getAttribute("data-d")) || 0);
      return;
    }

    if (act === "pi-save") {
      if (!canWrite()) { toast("Recording money is done by the office."); return; }
      var name = t.getAttribute("data-n");
      var amt = Math.round(EWnum(val("pi_amt")));
      if (!(amt > 0)) { toast("Enter the amount received."); return; }
      var dt = val("pi_date");
      if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(dt)) { toast("Pick the date this money came in."); return; }
      if (dt > today()) { toast("That date has not arrived yet — check it once."); return; }
      /* THE SAME MAN, THE SAME DAY, THE SAME AMOUNT. In this trade that is nearly always
         a double tap or something already in the book, so we stop and ask rather than
         quietly writing a second receipt for money that came in once. */
      var twin = ((S.data && S.data.payments) || []).filter(function (x) {
        return String(x.client || "").trim().toLowerCase() === String(name).trim().toLowerCase() &&
          String(x.date || "").slice(0, 10) === dt &&
          Math.round(EWnum(x.amount)) === amt;
      })[0];
      if (twin && !t.getAttribute("data-force")) {
        t.setAttribute("data-force", "1");
        t.textContent = "Yes — a second, separate payment";
        toast(money(amt) + " from " + name + " on " + dstr(dt) + " is already in the book. Press again only if this is a different payment.");
        return;
      }
      t.disabled = true; t.textContent = "Recording…";
      var row = {
        id: mintId("P"),
        createdBy: S.user, siteId: "", siteName: "",
        client: name, date: dt, amount: amt, mode: val("pi_mode"), ref: val("pi_ref"),
        notes: "Entered in the collection app"
      };
      /* ===== v1.10.0 - THE MONEY IS RECORDED THE MOMENT HE TAPS =====
         What this replaces is worth writing down, because it was good code solving the wrong
         problem. v1.9.0 stopped the app claiming "nothing was recorded" after a timeout, and
         instead re-pulled the whole book to find out whether the payment had landed. That was
         the honest thing to do with the tools it had. But it only worked if the app stayed
         open and the pull succeeded, and it could not help at all with the case that actually
         loses money: no signal, so the pull cannot happen either. It also still asserted
         "nothing was recorded" on any failure that was not a timeout - and a connection
         dropped AFTER the POST was delivered rejects with "Failed to fetch", not a timeout.
         So the one sentence a man must be able to trust was sometimes false.

         The journal makes the whole question go away. The payment is on the device before the
         request is made, a replay is an upsert by the id it already carries, so a double-write
         is not possible, and there is nothing left to anxiously check. The twin-check keeps
         working and now works better: applyJournal lays held payments back into
         S.data.payments, so it can finally see the payment v1.9.0 said it could not.

         And the receipt is shown either way. Whether the sheet has caught up is Energy World's
         problem; the customer handed over money and is owed his confirmation now. */
      saveRow("payments", row).then(function (r) {
        (S.data.payments = S.data.payments || []).push(r.row || row);
        bust();
        /* v1.1 - the receipt, straight away. The customer gets his confirmation without
           asking, and the man who entered it sees his work leave the building. */
        var after = rowFor(name);
        S.sheet = sheetReceipt(name, amt, val("pi_mode") || row.mode, dt, after ? after.due : 0);
        render();
        toast(r.held
          ? money(amt) + " recorded against " + name + ", and held on this phone until there is " +
            "signal. His receipt is ready now."
          : money(amt) + " recorded against " + name + ".");
      });
      return;
    }

    if (act === "fu-save") {
      if (!canWrite()) { toast("Recording a promise is done by the office."); return; }

      var pd = val("fu_date");
      if (pd && pd < today()) { toast("A promised date cannot be in the past."); return; }
      t.disabled = true; t.textContent = "Saving…";
