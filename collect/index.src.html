<script>
/* ===== ONE TAP, ONE ENTRY  (31 Oct 2026, every Energy World app) =====
   HIS REPORT: "clicking twice added two machine, make it standard rule to avoid duplicate entry ... apply it everywhere".
   A second tap on the SAME button that comes before the first one has had time to answer is swallowed here, before
   the app ever sees it. It runs in the capture phase on the whole page, so it covers every button in every screen,
   including ones written later, without each screen having to remember. Only buttons that WRITE something are
   guarded (save, add, record, confirm, send, approve ...): moving around the app is never slowed down.
   A button that really is meant to be tapped twice in a row carries data-taps="multi". */
(function () {
  if (window.__ewTapGuard) return; window.__ewTapGuard = 1;
  var WINDOW_MS = 2500, last = {};
  var WRITE = /(save|add|submit|record|confirm|approve|create|send|assign|pay|paid|receiv|recv|dispatch|deliver|issue|book|regist|mark|done|complete|attach|upload|merge|finish|place|generate|new|ok\b|go\b|force|won|lost|remove|del|cancel|return|apply|post|log|set|enter|transfer|accept|reject|close|start|stop|check.?in|check.?out|punch)/i;
  function sig(el) {
    var a = el.attributes, s = el.tagName;
    for (var i = 0; i < a.length; i++) { var n = a[i].name; if (n.indexOf("data-") === 0 && n !== "data-busy" && n.indexOf("data-lock") !== 0) s += "|" + n + "=" + a[i].value; }
    var oc = el.getAttribute("onclick"); if (oc) s += "|oc=" + oc;
    return s + "|" + String(el.textContent || "").replace(/\s+/g, " ").trim().slice(0, 60);
  }
  document.addEventListener("click", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("button,[data-act],[role=button],input[type=submit],input[type=button],a.btn") : null;
    if (!el || el.getAttribute("data-taps") === "multi") return;
    if (el.getAttribute("data-act") === "bf-tap") return;          /* CRM: once = Won, twice = Not required */
    var words = (el.getAttribute("data-act") || "") + " " + (el.id || "") + " " + (el.getAttribute("onclick") || "") + " " + String(el.textContent || el.value || "");
    if (!WRITE.test(words)) return;
    var k = sig(el), now = Date.now();
    if (last[k] && now - last[k] < WINDOW_MS) { e.stopImmediatePropagation(); e.preventDefault(); return; }
    last[k] = now;
  }, true);
})();
</script>

<!-- v1.6 - jsPDF IS NO LONGER LOADED HERE.
     It was a 356 KB classic script sitting immediately above the app, and a classic
     script blocks every script after it. So on a phone the whole app waited for a
     third-party CDN before a single line of it ran - and if that CDN was slow or
     unreachable, which on mobile data it often is, the app never started at all and
     the screen simply stayed white. That was the "it will not open on the iPhone".
     It is now fetched the first time somebody actually builds a statement. See
     ensurePdf() below. -->
<script>
(function () {
  "use strict";
  /* ==========================================================================
     ENERGY WORLD - PAYMENT COLLECTION
     A separate app, on purpose. The CRM does everything; this does one thing, so
     the man who opens it in the morning is looking at exactly one question:
     WHO DO I RING TODAY, AND WHAT DO I SAY.

     It signs in with the same name and PIN as the Team CRM and talks to the same
     server, so there is no second list of users, no second password to forget,
     and no second copy of the money that can drift out of step. Nothing about the
     CRM is changed by this app existing.

     WHAT IT WRITES. Two things only:
       - a PAYMENT, onto the same Payments sheet the CRM writes to, in the same
         shape, so a receipt entered here is indistinguishable from one entered there;
       - a FOLLOW-UP (a call, and the date he promised), as an append-only row on
         the AUDIT sheet - the channel the delivery proofs already use. No column is
         added to any tab, so no backend change and no redeployment were needed, and
         a note can be corrected later without anything ever being overwritten.

     WHO CAN DO WHAT. Admin and accounts see every client and may write. A sales
     executive sees only the clients assigned to him and may not write - he can
     still ring and send a reminder, because that is his job; recording money is not.
     Anyone else is refused at the door.
     ========================================================================== */

  var APP_VERSION = "1.75.0";   /* 1.75.0 (14 Nov 2026) - FIX: a return line frozen at 0%% was credited at full list price; the CRM's rule (6.9.728) is now this app's rule too - Rs 2,12,214 across 5 clients */   /* 1.74.1 (1.74.1 (11 Nov 2026) - GHP+ logo in the registered Green Heat+ colours (#00539F / #ED1D24) on PDFs, quotes, challans and QR centres */   /* 1.74.0 (9 Nov 2026) - FIMA in every finish: a return or a hisab line in a finish code (F1301WLX9CS) finds its product, brand and price */     /* 1.73.1 (4 Nov 2026) - Set 2 logos: Energy World (World raised), GHP+ with TM; PDFs, quotes, challans and every QR centre */   /* 1.73.0 (3 Nov 2026) - the old hisab paper opens from here, for everyone */   /* 1.72.0 (3 Nov 2026) - a return is priced the same on every phone: old product codes found, a stale shelf catalogue refreshed */   /* 1.71.0 (31 Oct 2026) - one tap, one entry */   /* 1.70.1 (27 Oct 2026) - GHp mark in the middle of every QR, level H */   /* 1.67.0 - flush busy flag + B9 owner guard, narrower sign-out, Old book under ☰ */
  /* ==EW-THEME== 11 Oct 2026 - DARK OR LIGHT, ON EVERY APP.
     HIS WORDS: "dark mode light mode for every app". Three settings, kept on this phone: Auto (follow the
     phone's own setting), Light, Dark. Dark is drawn by turning the finished page over (invert + hue turn) and
     turning pictures, logos and PDFs back, so every screen - including the thousands of colours written inline
     over the years - changes at once and nothing can be left white-on-white. Red stays red, green stays green.
     Changing it touches no data. */
  (function () {
    var K = "ewTheme";
    function ewtGet() { try { var v = localStorage.getItem(K); return v === "light" || v === "dark" ? v : "auto"; } catch (e) { return "auto"; } }
    function ewtOs() { try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); } catch (e) { return false; } }
    function ewtDark() { return false; } /* p746 12 Oct 2026: light only - his call, the inverted dark looked muddy */
    function ewtApply() {
      var r = document.documentElement; if (!r) return;
      r.setAttribute("data-ewdark", ewtDark() ? "1" : "0");
      try { var mt = document.querySelector('meta[name="theme-color"]'); if (mt) { if (!mt.getAttribute("data-light")) mt.setAttribute("data-light", mt.getAttribute("content") || ""); mt.setAttribute("content", ewtDark() ? "#11161D" : mt.getAttribute("data-light")); } } catch (e) { }
    }
    try {
      var st = document.createElement("style");
      st.textContent = 'html{background:#fff}.ewthm{display:none!important}' +
        'html[data-ewdark="1"]{filter:invert(.92) hue-rotate(180deg)}' +
        'html[data-ewdark="1"] .top{filter:invert(1) hue-rotate(180deg)}' +   /* the navy bar stays navy, as on the card */
        'html[data-ewdark="1"] img,html[data-ewdark="1"] video,html[data-ewdark="1"] canvas,html[data-ewdark="1"] iframe,html[data-ewdark="1"] embed,html[data-ewdark="1"] object,html[data-ewdark="1"] [data-noinvert]{filter:invert(1) hue-rotate(180deg)}' +
        '.ewthm{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border:1px solid #DCE3EA;border-radius:10px;background:#fff;color:#1F3A5F;font:inherit;font-size:14px;font-weight:700;cursor:pointer}';
      (document.head || document.documentElement).appendChild(st);
    } catch (e) { }
    ewtApply();
    try { var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)"); if (mq) { if (mq.addEventListener) mq.addEventListener("change", ewtApply); else if (mq.addListener) mq.addListener(ewtApply); } } catch (e) { }
    function ewtLabel() { var m = ewtGet(); return "&#9681; Theme: " + (m === "auto" ? "Auto (as the phone)" : m === "dark" ? "Dark" : "Light"); }
    window.ewTheme = {
      get: ewtGet, isDark: ewtDark, label: ewtLabel,
      set: function (m) { try { localStorage.setItem(K, m); } catch (e) { } ewtApply(); },
      next: function (btn) {
        var m = ewtGet(), n = m === "auto" ? "light" : m === "light" ? "dark" : "auto";
        window.ewTheme.set(n);
        if (btn) btn.innerHTML = ewtLabel();
      },
      button: function () { return '<button type="button" class="ewthm" onclick="ewTheme.next(this)">' + ewtLabel() + '</button>'; }
    };
  })();

  var GAS = "https://script.google.com/macros/s/AKfycbzVkPHWyPq-w8RFD_HdG0vCjmrfQvEUpcq_hhF9eDGa0ZbZ3rIx7N37an2DQRGmsxPK/exec";
  var STORE = "ew_collect_session";

  /* ==EW-CORE:BEGIN== built by tools/build_core.py — do not edit here, edit core/ew-core.js == */
/* ==EWCORE:idb== The IndexedDB door. */
/* ==EWCORE:idb== The IndexedDB door. */
  /* ================= ONE DOOR FOR EVERY PDF  (20 Sep 2026) =================
     Every PDF this app makes leaves through here. On a phone that can share a file it goes to
     the share sheet - Print, WhatsApp, the printer's app - as ONE file, once; anywhere else it
     downloads as it always did. A second press inside two seconds is ignored, so nothing can
     ever produce two copies of one document. The WhatsApp-with-link paths keep their own
     fallback download: a wa.me tab is already open there. */
  var _pdfOutAt = 0;
  function canShareFile() {
    try {
      if (!navigator.share || !navigator.canShare) return false;
      return navigator.canShare({ files: [new File(["x"], "x.pdf", { type: "application/pdf" })] });
    } catch (e) { return false; }
  }
  /* ================= WHO TOOK THIS FILE, AND WHEN  (6.9.578 / 1.86.0 / 1.46.0) =================
     His words: "mention file download date and time and by whom for every file download, in very
     small font in any corner of the page, not highlighted". One line, 5 pt, pale grey, bottom
     right of every page. Once per document. */
  function pdfDlStamp(doc) {
    try {
      if (!doc || doc._dlStamped) return;
      doc._dlStamped = true;
      var d = new Date(), p2 = function (n) { return (n < 10 ? "0" : "") + n; };
      var line = "Downloaded " + p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + d.getFullYear() + " " +
        p2(d.getHours()) + ":" + p2(d.getMinutes()) + (S && S.user ? " by " + String(S.user) : "");
      var n = doc.getNumberOfPages(), cur = doc.internal.getCurrentPageInfo ? doc.internal.getCurrentPageInfo().pageNumber : n;
      var fs = doc.getFontSize(), tc = doc.getTextColor ? doc.getTextColor() : null;
      for (var i = 1; i <= n; i++) {
        doc.setPage(i);
        var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
        doc.setFontSize(5); doc.setTextColor(170, 178, 190);
        doc.text(line, W - 4, H - 2.5, { align: "right" });
      }
      doc.setPage(cur); doc.setFontSize(fs);
      if (tc) { try { doc.setTextColor(tc); } catch (e) { doc.setTextColor(0, 0, 0); } }
    } catch (e) { }
  }
  /* ================= WHERE THE FILE WENT, ON A PHONE  (CRM 6.9.701 / Challan 1.127.0 / Collect 1.63.0, 6 Oct 2026) =================
     HIS WORDS: "in mobile its not showing where pdf is downloading, can we put a download folder or what
     alternate we can do?". A web page cannot choose the folder a file lands in - the phone decides
     (iPhone: Files > Downloads; Android: Downloads). So the file still downloads exactly as before
     (6.9.664), and on a phone a panel then says where it went and offers the two things a phone CAN
     do with it: Open it now, or Save / send it - the share sheet, where "Save to Files" lets him
     pick any folder (iCloud Drive, On My iPhone, Google Drive) and WhatsApp takes the file itself.
     A laptop is left alone: its browser already shows the download. */
  function dlIsPhone() {
    var ua = String((navigator && navigator.userAgent) || "");
    return /Android|iPhone|iPod/i.test(ua) || (/iPad|Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
  }
  function dlWhereSay() {
    var ua = String((navigator && navigator.userAgent) || "");
    if (/Android/i.test(ua)) return "It is in your phone’s <b>Downloads</b> folder (also in the notification at the top).";
    return "It is in the <b>Files</b> app → <b>Downloads</b> (or tap ⬇ in Safari’s address bar).";
  }
  /* ===== 6.9.703 / 1.128.0 / 1.64.0 - A PHONE ONLY SAVES A FILE INSIDE A TAP =====
     HIS WORDS, 7 Oct 2026: "in mobile in crm its not downloading full hisab, saying empty file". The full
     hisab fetches every signed receipt before it is drawn - many seconds after his tap. A phone lets a
     page save a file only while a tap is fresh, and jsPDF's own save on a phone goes through a data:

     full he leaves it, and the receipt screen - which read his mobile off that row - then told
     the man who had just cleared his account that he had no number on record and no receipt
     could be sent to him. His number was in the clients book the whole time. */
  /* ================= THE ROW ON THE SHEET, NOT THE ROW ON THE SCREEN  (v1.29.0) ==========
     HE REPORTED IT, saving a mobile for Vikas Ahlawat: "updating a phone no showing this
     error?" - "Could not find him on the book."

     He was on the book. anyClient() never returns a row that came off the clients tab: the
     chase row it prefers is built by rowFor() out of challans and payments, and the fallback
     underneath BUILDS A NEW OBJECT - { name, mobile, due, oldBook, lines, settled }. Neither
     carries an id. mb-save asks `if (!mbc || !mbc.id)`, so the answer was always no and
     ADDING A NUMBER FROM THIS APP HAS NEVER WORKED FOR ANYBODY.

     AND THE GUARD IS THE ONLY REASON THAT IS ALL THAT WENT WRONG. Behind it, the save built
     the client row as Object.assign({}, mbc, {mobile}) - the CHASE row, not the sheet row -
     and this backend "rebuilds the whole row out of the payload, so every column the payload
     does not carry is set to ''" (its own words, teamSaveLocked_). Vikas Ahlawat carries an
     OPENING BALANCE OF Rs 1,05,213. One tap on Save the number would have written it to blank,
     with his address, his owner, his terms and his billing profiles.

     So this is not a guard to loosen. It is a lookup to fix: the row that goes up must be the
     row that is on the sheet. */
  function clientRow(name) {
    var k = String(name || "").trim().toLowerCase();
    return ((S.data && S.data.clients) || []).filter(function (c) {
      return String(c.name || "").trim().toLowerCase() === k && String(c.id || "").trim();
    })[0] || null;
  }
  function anyClient(name) {
    var k = String(name || "").trim().toLowerCase();
    return rowFor(name) ||
      ((S.data && S.data.clients) || []).filter(function (c) {
        return String(c.name || "").trim().toLowerCase() === k;
      }).map(function (c) {
        return { name: c.name, mobile: c.mobile || "", due: 0, oldBook: 0, lines: [], settled: true };
      })[0] || null;
  }

  var BUCKETS = [
    ["all", "Everyone"],
    ["today", "Promised today"],
    ["broken", "Promise broken"],
    ["overdue", "Past 30 days"],
    ["oldbook", "Old book"],
    ["promised", "Promised later"],
    ["current", "Within terms"],
    /* the ones nobody can ring or message at all - a collection problem that is really
       a missing-phone-number problem, and it is fixed in one minute in the CRM */
    ["nomobile", "No mobile"]
  ];
  /* ---- EXECUTIVE BY EXECUTIVE ----
     Money is owed to the firm but it is chased by a person, and the only way a man
     works his own list is if he can see it as his own. Admin and accounts get every
     executive; an executive sees the one row that is his. */
  function execRows() {
    var by = {};
    rows().forEach(function (r) {
      var k = r.owner || "Unassigned";
      var g = by[k] = by[k] || { name: k, due: 0, overdue: 0, oldBook: 0, n: 0, broken: 0, promisedToday: 0 };
      g.due += r.due; g.overdue += r.overdue; g.oldBook += r.oldBook; g.n++;
      var pr = promiseRecord(r.name);
      if (pr) g.broken += pr.broken;
      if (r.promise && r.promise.date === today()) g.promisedToday += r.due;
    });
    return Object.keys(by).map(function (k) { return by[k]; })
      .sort(function (a, b) { return b.due - a.due; });
  }

  function filtered() {
    var list = rows(), f = S.filter, q = String(S.q || "").trim().toLowerCase();
    if (S.exec) list = list.filter(function (r) { return (r.owner || "Unassigned") === S.exec; });
    if (f === "nomobile") list = list.filter(function (r) { return !r.mobile; });
    else if (f && f !== "all") list = list.filter(function (r) { return r.bucket === f; });
    if (q) list = list.filter(function (r) {
      if (String(r.name).toLowerCase().indexOf(q) >= 0) return true;
      if (r.sites && r.sites.some(function (x) { return String(x.name).toLowerCase().indexOf(q) >= 0; })) return true;   /* 1.62.0 */
      var rec = ((S.data && S.data.clients) || []).filter(function (c) {
        return String(c.name || "").trim().toLowerCase() === String(r.name || "").trim().toLowerCase();
      })[0];
      return !!(rec && clientHay(rec).indexOf(q) >= 0);   /* v1.16.0 - his firm too */
    });
    return list;
  }

  /* ---------- THE OLD BOOK ----------
     53 clients carry ₹78.6 lakh brought forward from the paper ledgers - 91% of
     everything outstanding. Not one of them has a statement attached, so when a man is
     told he owes four lakh he can fairly ask "from what?", and there is no answer in
     anybody's hand. Chasing a figure the customer has never agreed is theatre.
     This list exists to move each name once: from a number nobody has discussed to
     either an AGREED debt or a KNOWN dispute. It empties itself as that happens. */
  var OB_STATES = [
    ["none",     "Not taken up",   "#64748b", "#f1f5f9"],
    ["sent",     "Figure sent",    "#1d4ed8", "#dbeafe"],
    ["agreed",   "He agrees",      "#0f766e", "#ccfbf1"],
    ["disputed", "He disputes",    "#b91c1c", "#fee2e2"],
    ["noanswer", "No answer yet",  "#92400e", "#fef3c7"]
  ];
  function obLabel(k) { var r = OB_STATES.filter(function (x) { return x[0] === k; })[0]; return r ? r[1] : k; }
  function obPill(k) {
    var r = OB_STATES.filter(function (x) { return x[0] === k; })[0] || OB_STATES[0];
    return '<span class="pill" style="color:' + r[2] + ';background:' + r[3] + '">' + esc(r[1]) + '</span>';
  }
  var _obCache = null;
  function obMap() {
    if (_obCache) return _obCache;
    var m = {};
    ((S.data && S.data.audit) || []).forEach(function (r) {
      if (!r || String(r.action || "") !== "collect:oldbook") return;
      var d = {};
      try { d = JSON.parse(r.detail || "{}") || {}; } catch (e) { return; }
      var k = String(d.client || "").trim().toLowerCase();
      if (!k) return;
      var at = String(r.createdAt || "");
      var prev = m[k];
      if (!prev || at >= prev.at) {
        m[k] = { at: at, by: r.actor || "", state: String(d.state || "none"),
                 agreed: EWnum(d.agreed), note: String(d.note || "") };
      }
    });
    _obCache = m;
    return m;
  }
  function obFor(name) { return obMap()[String(name || "").trim().toLowerCase()] || { state: "none", agreed: 0, note: "", at: "", by: "" }; }
  function saveOldBook(client, state, agreed, note) {
    _obCache = null;
    return saveRow("audit", {
      id: "OB-" + Date.now() + "-" + Math.floor(Math.random() * 1000000),
      createdAt: new Date().toISOString(), actor: S.user || "",
      action: "collect:oldbook", target: String(client || ""),
      detail: JSON.stringify({ client: String(client || ""), state: String(state || "none"),
                               agreed: EWnum(agreed), note: String(note || ""), by: S.user || "" })
    });
  }
  function oldBookRows() {
    return rows().filter(function (r) { return r.oldBook > 0.5; })
      .map(function (r) { r.ob = obFor(r.name); return r; })
      .sort(function (a, b) {
        /* the ones nobody has touched first, then by size - so the list is worked, not admired */
        var w = { none: 0, noanswer: 1, sent: 2, disputed: 3, agreed: 4 };
        return (w[a.ob.state] || 0) - (w[b.ob.state] || 0) || b.oldBook - a.oldBook;
      });
  }

  /* ---------- DOES HE KEEP HIS WORD? ----------
     The most valuable number in a collection book, and the only one that cannot be
     guessed - it has to be earned by logging calls. A promise counts as KEPT if money
     actually arrived between the day it was made and three days after the day he named.
     Three days of grace on purpose: a cheque posted on the day he said is a promise kept.
     Nothing is shown until he has made at least two, because one is not a habit. */
  function promiseRecord(name) {
    var k = String(name || "").trim().toLowerCase();
    if (_pmCache[k] === undefined) _pmCache[k] = promiseRecordRaw(name);
    return _pmCache[k];
  }
  function promiseRecordRaw(name) {
    var fl = followFor(name).filter(function (f) { return f.date && f.kind === "promise"; });
    if (!fl.length) return null;
    var pays = ((S.data && S.data.payments) || []).filter(function (p) {
      return String(p.client || "").trim().toLowerCase() === String(name).trim().toLowerCase();
    }).map(function (p) { return d10(p.date || p.createdAt); }).filter(Boolean);
    var t = today(), kept = 0, broken = 0, open = 0;
    fl.forEach(function (f) {
      var from = d10(f.at), to = addDays(f.date, 3);
      var paid = pays.some(function (p) { return p >= from && p <= to; });
      if (paid) kept++;
      else if (f.date < t) broken++;
      else open++;
    });
    var done = kept + broken;
    return { kept: kept, broken: broken, open: open, done: done,
             calls: followFor(name).length,
             rate: done ? Math.round(kept / done * 100) : null };
  }
  function promisePill(name) {
    var r = promiseRecord(name);
    if (!r || r.done < 2) return "";
    if (r.rate >= 75) return '<span class="pill grn">Keeps his word · ' + r.kept + ' of ' + r.done + '</span>';
    if (r.rate >= 40) return '<span class="pill amb">Half the time · ' + r.kept + ' of ' + r.done + '</span>';
    return '<span class="pill red">Broke ' + r.broken + ' of ' + r.done + ' promises</span>';
  }

  /* ---------------------------------------------------------------------------
     HOW OLD IS THIS BOOK, HONESTLY  (18 Aug 2026)

     HIS REPORT: "client added in crm not showing in challan app on mobile."

     The client WAS in the CRM. Checked against the two books side by side on one machine:
     the CRM held 147 clients, the Challan app held the same 147, and not one was missing.
     The backend was not withholding anything.

     What the header said was:

         updated 15:17

     built with toTimeString(). NO DATE. So a book pulled yesterday afternoon, or last week,
     reads exactly like one pulled five minutes ago. A man adds a client, opens this app,
     sees a fresh-looking time, and concludes the app is broken - when what he actually has
     is an old copy that never re-pulled, usually because the pull failed quietly on one bar
     of signal and the app kept showing the last good time.

     The app was hiding the one fact that explains the whole complaint. Same fault as the
     login that said "Network error" five ways, and the blank district list: the screen
     destroying the evidence needed to read it.

     Now it says the AGE, and it gets louder as the book gets older. */
  function bookAge(ts) {
    ts = Number(ts) || 0;
    if (!ts) return { txt: "never pulled onto this phone", tone: "bad" };
    var ms = Date.now() - ts, d = new Date(ts);
    var hhmm = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    if (ms < 120000) return { txt: "updated just now", tone: "ok" };
    /* same calendar day, not "within 24 hours" - a book from 11pm last night is yesterday's
       book at 8am, and calling it "9 hours old" invites him to trust it */
    var today = new Date();
    var sameDay = d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() &&
                  d.getDate() === today.getDate();
    if (sameDay) return { txt: "updated " + hhmm, tone: ms > 7200000 ? "warn" : "ok" };
    var days = Math.floor(ms / 86400000);
    if (days <= 1) return { txt: "from YESTERDAY " + hhmm, tone: "bad" };
    return { txt: days + " DAYS OLD (" + hhmm + ")", tone: "bad" };
  }
  /* ---- "NOT UPLOADED", SAID WHERE HE IS ALREADY LOOKING (20 Aug 2026) ----
     The other half of "show upload status on every app ... not uploaded or created".

     A record written while the signal was gone is held in the journal and shown on its own
     row - the Challan app has said "Held on this phone" for months. What was missing is the
     COUNT, somewhere a man sees without going to look for it. That matters because the
     dangerous case is the one nobody suspects: the godown writes a challan, it appears on his
     screen exactly like a saved one, and it exists for him and for nobody else. He has no
     reason to go hunting for a pill.

     So it sits in the freshness line at the top, next to how old the book is, which is the
     one place he already reads when he wonders whether what he is looking at is real. */
  /* 1.120.0 - HELD RECORDS COUNTED AS HE COUNTS THEM. One challan written with no signal read
     "2 not uploaded yet" / "2 records are held on this phone": the challan and the note that files
     its book number. He wrote one thing. The notes that ride with a record are named after it, and
     named alone only when nothing else is held. */
  var JRN_ONE = { challans: ["challan", "challans"], returns: ["return", "returns"], payments: ["payment", "payments"],
    followups: ["follow-up", "follow-ups"], clients: ["client", "clients"], receipts: ["receipt", "receipts"],
    sites: ["site", "sites"], drivers: ["driver", "drivers"], visits: ["service visit", "service visits"],
    move: ["pass or dispatch", "passes or dispatches"] };
  function jrnSay(l) {
    l = l || []; var c = {}, order = [], notes = 0;
    l.forEach(function (e) {
      var k = e.kind === "move" ? "move" : String(e.tab || "");
      if (k === "audit") { notes++; return; }
      if (!c[k]) { c[k] = 0; order.push(k); }
      c[k]++;
    });
    var bits = order.map(function (k) { var w = JRN_ONE[k] || ["record", "records"]; return c[k] + " " + (c[k] === 1 ? w[0] : w[1]); });
    var noteW = notes + (notes === 1 ? " note" : " notes");
    if (!bits.length) return notes ? noteW : "";
    var say = bits.length === 1 ? bits[0] : bits.slice(0, -1).join(", ") + " and " + bits[bits.length - 1];
    return say + (notes ? " (+ " + noteW + ")" : "");
  }
  function heldSay() {
    var say = "";
    try { say = jrnSay(jrnLoad()); } catch (e) { say = ""; }
    if (!say) return "";
    return '<span class="sync" style="font-weight:800;color:#fecaca"> · ' + esc(say) +
      ' not uploaded yet</span>';
  }

    var tone = (r.overdue > 0 || r.oldBook > 0) ? '#b91c1c' : '#0f172a';
    return '<div class="card" style="padding:0;overflow:hidden">' +
      '<div data-act="open" data-n="' + esc(r.name) + '" style="padding:11px 13px;cursor:pointer">' +
      '<div class="row"><div class="grow">' +
        '<div style="font-weight:800;font-size:14.5px">' + esc(r.name) + (r.sites ? ' <span class="pill" style="background:#e0e7ff;color:#312e81">builder &middot; ' + r.sites.length + ' site' + (r.sites.length === 1 ? '' : 's') + '</span>' : '') + '</div>' +
        (r.sites ? bldLines(r) : '') +   /* 1.62.0 */
        '<div class="muted" style="margin-top:2px">' +
          (r.oldestUnpaid ? 'Oldest unpaid ' + esc(ageWords(r.ageDays)) : 'No dated delivery') +
          (r.oldBook > 0 ? ' · <b style="color:#b91c1c">' + money(r.oldBook) + ' old book</b>' : '') +
          (r.lastPay ? ' · paid ' + esc(dstr(r.lastPay)) : ' · <b style="color:#b91c1c">never paid</b>') +
        '</div>' +
        '<div style="margin-top:5px">' + promiseLine(r, t) +
          /* v1.1 - does he keep his word, and can he even be rung */
          (promisePill(r.name) ? ' ' + promisePill(r.name) : '') +
          /* v1.2 - how hard has he actually been chased, and how often has he let us down */
          (function () {
            var pr = promiseRecord(r.name), n = followFor(r.name).length;
            var out = "";
            if (n) out += ' <span class="pill">' + n + ' call' + (n === 1 ? '' : 's') + '</span>';
            if (pr && pr.broken) out += ' <span class="pill red">' + pr.broken + ' broken</span>';
            return out;
          })() +
          (r.mobile ? '' : ' <span class="pill red">no mobile</span>') +
          (r.owner ? ' <span class="pill">' + esc(r.owner) + '</span>' : '') + '</div>' +
      '</div>' +
      '<div style="text-align:right"><div class="big" style="color:' + tone + '">' + money(r.toCollect) + '</div>' +
        (r.overdue > 0 ? '<div class="muted" style="color:#b91c1c">' + money(r.overdue) + ' past term</div>' : '') +
        /* v1.32.0 - when both books carry money, say which is which under the one total */
        (r.svcDue > 0.5 ? '<div class="muted">' + (r.due > 0.5 ? 'goods ' + money(r.due) + ' · ' : '') + '<b style="color:#b45309">service ' + money(r.svcDue) + '</b></div>' : '') +
      '</div></div></div>' +
      (open ? (r.sites ? bldBody(r, t) : clientBody(r, t)) : '') +
      '</div>';
  }

  /* ---- ONE EXPANDER, TWO LISTS  (v1.30.0) ----
     Open state is keyed by client AND section, so opening Ravinder's payments does not open
     everybody's, and it survives the repaint that follows every save. */
  function expOn(name, k) { return !!(S.exp && S.exp[name + "|" + k]); }
  function expRow(name, k, label, sub) {
    var on = expOn(name, k);
    return '<div class="row" data-act="exp" data-n="' + esc(name) + '" data-k="' + esc(k) + '" ' +
      'style="cursor:pointer;user-select:none;padding:7px 10px;min-height:44px;background:#fff;' +   /* 1.59.0 - 44px */
      'border:1px solid #e2e8f0;border-radius:10px;align-items:center;gap:8px">' +
      '<span style="color:#94a3b8;width:12px;flex:0 0 auto">' + (on ? '&#9662;' : '&#9656;') + '</span>' +
      '<div class="grow" style="font-weight:700;font-size:13px">' + esc(label) + '</div>' +
      '<div class="muted" style="font-size:12px">' + sub + '</div></div>';
  }

  function clientBody(r, t) {
    var h = '<div style="border-top:1px solid #e2e8f0;padding:11px 13px;background:#fafafa">';
    h += '<div class="muted" style="margin-bottom:8px">' +
      'Billed ' + money(r.billed + r.opening) + ' · received ' + money(r.paid) +
      (r.credited > 0 ? ' · returns ' + money(r.credited) : '') +
      (r.unpricedLines > 0 ? ' <span class="pill red">' + r.unpricedLines +
        ' returned items not priced — this credit is short</span>' : '') +
      ' · <b>' + r.challans + ' delivery' + (r.challans === 1 ? '' : ' notes') + '</b></div>';

    /* ---- DELIVERIES, CHALLAN BY CHALLAN  (v1.30.0) ----
       Closed it is what it has always been: the deliveries still owed for, oldest first, capped
       at six because that is a chase list. Open it is EVERY delivery he has ever taken, with
       what each was worth and what the money already received has settled against it - which is
       the question a customer actually asks on the phone.

       The FIFO is not re-run here. lines[] arrives already settled by the same pass that
       produced the total on the card, so a delivery can never read one figure here and another
       one there. */
    var allLines = (r.lines || []), unpaidL = (r.unpaid || []);
    if (allLines.length) {
      var chOpen = expOn(r.name, "ch");
      var show = chOpen ? allLines : unpaidL.slice(0, 6);
      h += '<div style="margin-bottom:9px">' +
        expRow(r.name, "ch", chOpen ? "All deliveries" : "Deliveries still owed for",
          (function () {
            /* v1.30.1 - "5 unpaid of 6" counted a credit note as a delivery. It is not one. */
            var nCr = allLines.filter(function (l) { return l.credit; }).length;
            var nDel = allLines.length - nCr;
            return (unpaidL.length ? unpaidL.length + " unpaid of " + nDel
                                   : "all " + nDel + " settled") +
                   (nCr ? " \u00b7 " + nCr + " credit note" + (nCr === 1 ? "" : "s") : "");
          })()) +
        (show.length
          ? '<div style="background:#fff;border:1px solid #e2e8f0;border-top:0;border-radius:0 0 10px 10px;overflow:hidden;margin-top:-6px;padding-top:6px">' +
            show.map(function (u) {
              var d = EWdays(u.ymd, t), late = u.left > 0.5 && d > CREDIT_DAYS;
              var settled = Math.round((u.amount || 0) - (u.left || 0));
              /* v1.30.1 - three kinds of line, not two. A credit note is never "settled": it is
                 money coming OFF his account, and saying otherwise hides the most unusual row
                 on his book behind the most ordinary word on the screen. */
              var isCr = !!u.credit, done = !isCr && u.left <= 0.5;
              return '<div class="row" style="padding:7px 10px;border-top:1px solid #f1f5f9;' +
                (done && !isCr ? 'opacity:.62' : '') + '">' +
                '<div class="grow"><b style="font-size:12.5px">' + esc(u.no || "(no number)") + '</b>' +
                (u.site ? ' <span class="muted">' + esc(u.site) + '</span>' : '') +
                '<div class="muted">' + esc(u.ymd ? dstr(u.ymd) : "no date") +
                  (u.ymd ? ' · ' + esc(ageWords(d)) : '') +
                  (late ? ' <b style="color:#b91c1c">past term</b>' : '') +
                  /* v1.30.0 - what the money already received has taken off THIS delivery */
                  (isCr ? ' · <b style="color:#5b21b6">credit note</b> \u2014 comes off what he owes'
                        : (chOpen && settled > 0 && !done ? ' · ' + esc(money(settled)) + ' paid' : '')) +
                  '</div></div>' +
                '<div style="text-align:right">' +
                  (chOpen && !isCr ? '<div class="muted" style="font-size:12px">' + money(u.amount || 0) + '</div>' : '') +
                  '<div style="font-weight:700;color:' + (isCr ? '#5b21b6' : (done ? '#0f766e' : (late ? '#b91c1c' : '#0f172a'))) + '">' +
                  (isCr ? money(u.amount) : (done ? 'settled' : money(u.left))) + '</div></div></div>';
            }).join("") +
            (!chOpen && unpaidL.length > 6
              ? '<div class="muted" style="padding:7px 10px;border-top:1px solid #f1f5f9">and ' +
                (unpaidL.length - 6) + ' more \u2014 tap the line above to see every delivery</div>' : '') +
            '</div>'
          : '') +
        '</div>';
    }
    if (r.oldBook > 0) {
      h += '<div class="muted" style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 10px;margin-bottom:9px;color:#9a3412">' +
        '<b>' + money(r.oldBook) + '</b> is brought forward from the old paper books. It carries no date, so it cannot be aged — but it is the oldest money he owes.' +
        '<div style="margin-top:6px">' + oldHisabBtn(r.name) + '</div></div>';   /* 1.73.0 - and the paper itself */
    }

    /* ---- PAYMENTS RECEIVED  (v1.30.0) ----
       "received 1,00,000" was the whole of it. Which day, by what mode, against which reference -
       all of it was on the sheet and none of it on the screen he chases from. Newest first here,
       deliberately: on a call the question is always "the last one", never "the first one". */
    var pays = (r.payments || []).slice().reverse();
    if (pays.length) {
      var pOpen = expOn(r.name, "pay");
      h += '<div style="margin-bottom:9px">' +
        expRow(r.name, "pay", "Payments received",
          pays.length + " receipt" + (pays.length === 1 ? "" : "s") + " \u00b7 " + money(r.paid)) +
        (pOpen
          ? '<div style="background:#fff;border:1px solid #e2e8f0;border-top:0;border-radius:0 0 10px 10px;overflow:hidden;margin-top:-6px;padding-top:6px">' +
            pays.map(function (p) {
              var bits = [];
              if (p.mode) bits.push(esc(p.mode));
              if (p.ref) bits.push(esc(p.ref));
              if (p.by) bits.push('entered by ' + esc(p.by));
              if (p.pic) bits.push('<a href="' + esc(p.pic) + '" target="_blank" rel="noopener" style="font-weight:700">photo</a>');   /* 1.55.0 */
              return '<div class="row" style="padding:7px 10px;border-top:1px solid #f1f5f9">' +
                '<div class="grow"><b style="font-size:12.5px">' + esc(p.ymd ? dstr(p.ymd) : "no date") + '</b>' +
                (bits.length ? '<div class="muted">' + bits.join(' \u00b7 ') + '</div>'
                             : '<div class="muted">no mode or reference recorded</div>') + '</div>' +
                '<div style="font-weight:700;color:#0f766e">' + money(p.amount) + '</div></div>';
            }).join("") + '</div>'
          : '') +
        '</div>';
    }

    /* ---- v1.32.0 - SERVICE, VISIT BY VISIT. Collected on the visit by the engineer; this list
       is what is still owed, so the man chasing goods money knows the whole of what to ask for. */
    if (r.svcVisits && r.svcVisits.length) {
      var sOpen = expOn(r.name, "svc");
      var _insOf = function (v) { return (S.data.installs || []).filter(function (x) { return x.id === v.installId; })[0] || null; };
      h += '<div style="margin-bottom:9px">' +
        expRow(r.name, "svc", "Service visits",
          r.svcVisits.length + " visit" + (r.svcVisits.length === 1 ? "" : "s") + (r.svcDue > 0.5 ? " \u00b7 <b style=\"color:#b45309\">" + money(r.svcDue) + " owed</b>" : " \u00b7 nothing owed")) +
        (sOpen
          ? '<div style="background:#fff;border:1px solid #e2e8f0;border-top:0;border-radius:0 0 10px 10px;overflow:hidden;margin-top:-6px;padding-top:6px">' +
            r.svcVisits.slice().reverse().map(function (v) {
              var pend = visitPending(v, _insOf(v)), bits = [];
              if (v.engineer) bits.push(esc(v.engineer));
              if (num(v.saltBags)) bits.push(num(v.saltBags) + ' bag' + (num(v.saltBags) === 1 ? '' : 's') + ' salt');
              var _bc = String(v.notes || "").match(/^Billed on challan (\S+)/);
              if (_bc) bits.push('billed on challan ' + esc(_bc[1]));
              else if (num(v.collected)) bits.push('took ' + money(v.collected));
              return '<div class="row" style="padding:7px 10px;border-top:1px solid #f1f5f9">' +
                '<div class="grow"><b style="font-size:12.5px">' + esc(dstr(String(v.date || "").slice(0, 10))) + ' \u00b7 ' + esc(v.type || "visit") + '</b>' +
                (bits.length ? '<div class="muted">' + bits.join(' \u00b7 ') + '</div>' : '') + '</div>' +
                '<div style="font-weight:700;color:' + (pend > 0.5 ? '#b91c1c' : '#0f766e') + '">' + (pend > 0.5 ? money(pend) + ' owed' : (num(v.total) ? 'settled' : '\u2014')) + '</div></div>';
            }).join("") +
            '<div class="muted" style="padding:7px 10px;border-top:1px solid #f1f5f9">Service money is taken by the engineer on the visit and written there. A payment recorded here settles goods, not a visit.</div>' +
            '</div>'
          : '') +
        '</div>';
    }

    var fl = followFor(r.name);
    if (fl.length) {
      h += '<div style="margin-bottom:9px"><div class="muted" style="font-weight:700;margin-bottom:4px">What was said before</div>' +
        fl.slice(0, 4).map(function (f) {
          return '<div class="muted" style="padding:5px 0;border-top:1px solid #e2e8f0">' +
            esc(dstr(String(f.at).slice(0, 10))) + ' · ' + esc(f.by || "") +
            (f.date ? ' — said <b>' + esc(dstr(f.date)) + '</b>' : '') +
            (f.outcome ? ' · ' + esc(f.outcome) : '') +
            (f.note ? '<br><i>' + esc(f.note) + '</i>' : '') + '</div>';
        }).join("") +
        (fl.length > 4 ? '<div class="muted" style="padding-top:5px">and ' + (fl.length - 4) + ' earlier</div>' : '') +
        '</div>';
    }

    /* v1.4 - the number itself, big enough to read out and tappable to dial. A man
       chasing money reads the number aloud as often as he taps it. */
    h += r.mobile
      ? '<div style="margin-bottom:9px"><a href="tel:' + esc(r.mobile) + '" ' +
        'style="display:inline-flex;align-items:center;gap:8px;background:#ecfdf5;border:1px solid #99f6e4;' +
        'border-radius:10px;padding:8px 12px;min-height:44px;text-decoration:none;color:#0f766e;font-weight:800;font-size:16px;letter-spacing:.04em">' +
        '&#9742; ' + esc(r.mobile.length === 10 ? r.mobile.slice(0,5) + " " + r.mobile.slice(5) : r.mobile) + '</a></div>'
      : '<div style="margin-bottom:9px"><span class="pill red">No mobile number on his record \u2014 he cannot be rung or sent anything</span>' +
        (canWrite() ? ' <button class="btn sm" data-act="mb-ask" data-n="' + esc(r.name) + '" style="margin-left:6px">Add his mobile</button>' : '') +
        '</div>';
    h += '<div class="acts">' +
      (r.mobile ? '<a class="btn sm grn" href="tel:' + esc(r.mobile) + '">Call</a>' : '') +
      (r.mobile ? '<button class="btn sm gry" data-act="wa" data-n="' + esc(r.name) + '">WhatsApp reminder</button>' : '') +
      /* v1.3 - "send me the account" is the commonest thing a customer says on that call,
         and the conversation dies if the answer is "I will send it later" */
      (r.mobile ? '<button class="btn sm gry" data-act="hisab-wa" data-n="' + esc(r.name) + '">Send his hisab</button>' : '') +
      '<button class="btn sm gry" data-act="hisab-dl" data-n="' + esc(r.name) + '">Download hisab</button>' +
      (canWrite() ? '<button class="btn sm" data-act="log" data-n="' + esc(r.name) + '">Log the call</button>' : '') +
      (canPay() ? '<button class="btn sm grn" data-act="pay" data-n="' + esc(r.name) + '">Payment received</button>' : '') +
      '</div>';
    if (!canWrite()) {
      h += '<div class="muted" style="margin-top:7px">' + (canPay()
        ? 'You can ring, remind and record a payment you collect. Promises are recorded by the office.'
        : 'You can ring and remind. Recording money and promises is done by the office.') + '</div>';
    }
    return h + '</div>';
  }

  function EWdays(a, b) { return daysBetween(a, b); }

  /* ---- executive by executive ---- */
  function execBlock() {
    var l = execRows();
    if (l.length < 2 && !S.exec) return "";
    var tot = l.reduce(function (a, x) { return a + x.due; }, 0);
    return '<div class="card" style="padding:11px 13px">' +
      '<div class="row" style="margin-bottom:7px"><div class="grow" style="font-weight:800;font-size:13.5px">Outstanding by executive</div>' +
      (S.exec ? '<button class="btn sm gry" data-act="exec" data-n="">Show all</button>' : '') + '</div>' +
      l.map(function (x) {
        var on = S.exec === x.name;
        return '<div data-act="exec" data-n="' + esc(on ? "" : x.name) + '" ' +
          'style="display:flex;align-items:center;gap:9px;padding:8px 9px;margin-top:5px;border-radius:10px;cursor:pointer;' +
          'border:1px solid ' + (on ? '#1F3A5F' : '#e2e8f0') + ';background:' + (on ? '#fef2f2' : '#fff') + '">' +
          '<div class="grow" style="min-width:0">' +
            '<div style="font-weight:700;font-size:13px">' + esc(x.name) + '</div>' +
            '<div class="muted">' + x.n + ' client' + (x.n === 1 ? '' : 's') +
              (x.overdue + x.oldBook > 0.5 ? ' · <b style="color:#b91c1c">' + shortMoney(x.overdue + x.oldBook) + ' past term</b>' : ' · all within terms') +
              (x.broken ? ' · <b style="color:#b91c1c">' + x.broken + ' promise' + (x.broken === 1 ? '' : 's') + ' broken</b>' : '') +
            '</div>' +
            '<div class="bar"><i style="width:' + (tot > 0 ? Math.max(2, Math.round(x.due / tot * 100)) : 0) + '%"></i></div>' +
          '</div>' +
          '<div style="text-align:right;font-weight:800;white-space:nowrap">' + shortMoney(x.due) + '</div>' +
          '</div>';
      }).join("") +
      '<div class="muted" style="margin-top:7px">Tap a name to work only his list.</div></div>';
  }

  /* ---------- THE SEARCH BOX, ON EVERY TAB ----------
     v1.7 - it used to live only on "Everyone". So a man on Today's calls who wanted one
     particular name had to work out which tab it lived on first, and a name that is not
     on today's list, or has no old-book balance, could not be found from those tabs at
     all. It is the same box everywhere now, and it searches the WHOLE book rather than
     the list underneath it - if you can remember his name you can reach him from
     wherever you are standing. Type a name or any part of a phone number. */
  function searchBox() {
    return '<div class="row" style="margin:2px 0 8px">' +
      '<input id="q" class="grow" placeholder="Find any client — name or phone…" value="' + esc(S.q) + '"/>' +
      (S.q ? '<button class="btn sm gry" data-act="qclear">Clear</button>' : '') +
      '</div>';
  }
  /* Searching looks past the filter chips and past which tab you are on, on purpose. */
  function searchHits() {
    var q = String(S.q || "").trim().toLowerCase();
    if (!q) return null;
    var digits = q.replace(/\D/g, "");
    return rowsAll().filter(function (r) {
      /* v1.16.0 - his firm counts too. The ledger row is derived, so the client's own
         record is looked up for the names he is billed under. See clientHay(). */
      if (String(r.name).toLowerCase().indexOf(q) >= 0) return true;
      var rec = ((S.data && S.data.clients) || []).filter(function (c) {
        return String(c.name || "").trim().toLowerCase() === String(r.name || "").trim().toLowerCase();
      })[0];
      if (rec && clientHay(rec).indexOf(q) >= 0) return true;
      return !!(digits && String(r.mobile || "").indexOf(digits) >= 0);
    });
  }
  function viewSearch() {
    var t = today(), list = searchHits();
    var h = searchBox();
    if (!list.length) {
      return h + '<div class="empty">Nobody by that name or number owes anything.<br>' +
        'This searches every client in the book, not just the list you were on &mdash; ' +
        'by his name, his number, or <b>the firm his money comes from</b>.</div>';
    }
    var sum = list.reduce(function (a, r) { return a + r.due; }, 0);
    h += '<div class="muted" style="margin:0 2px 6px">' + list.length + ' match' + (list.length === 1 ? '' : 'es') +
      ' · ' + money(sum) + ' — searched every client, not just this tab</div>';
    return h + clientTable(list, t);   /* 1.65.0 */
  }

  function viewList() {
    var t = today(), list = filtered();
    var h = statTiles() + execBlock() + chips() + searchBox();
    if (!list.length) {
      h += '<div class="empty">' + (S.q ? 'Nobody by that name owes anything.' :
        (S.filter === "all" ? 'Nothing outstanding. Every client is settled.' : 'Nobody in this list right now.')) + '</div>';
      return h;
    }
    var sum = list.reduce(function (a, r) { return a + r.due; }, 0);
    h += '<div class="muted" style="margin:0 2px 4px">' + list.length + ' client' + (list.length === 1 ? '' : 's') +
      ' · ' + money(sum) + ' — hardest first</div>';
    h += clientTable(list, t);   /* 1.65.0 */
    return h;
  }

  /* Today's calling list: the ones who said today, the ones who broke a promise,
     and then the worst of the rest. Deliberately short - a list of sixty is a list
     nobody works through. */
  function viewToday() {
    var t = today(), l = rows();
    var said = l.filter(function (r) { return r.promise && r.promise.date === t; });
    var _h0 = searchBox();
    var broke = l.filter(function (r) { return r.promise && r.promise.date && r.promise.date < t; });
    var rest = l.filter(function (r) { return said.indexOf(r) < 0 && broke.indexOf(r) < 0; }).slice(0, 8);
    var h = _h0 + '<div class="card" style="background:#1F3A5F;color:#fff;border-color:#1F3A5F">' +
      '<div style="font-size:13px;opacity:.85">' + esc(dstr(t)) + '</div>' +
      '<div style="font-size:17px;font-weight:800;margin-top:2px">' +
      (said.length + broke.length ? (said.length + broke.length) + ' to ring on a promise' : 'No promises outstanding today') + '</div>' +
      '<div style="font-size:12.5px;opacity:.9;margin-top:3px">then the ' + rest.length + ' worst of the rest — ' +
      money(said.concat(broke).concat(rest).reduce(function (a, r) { return a + r.toCollect; }, 0)) + ' in all</div></div>';   /* v1.32.0 - goods and service, one figure */
    h = _h0 + colToday() + h.slice(_h0.length);   /* 1.55.0 - what came in today, first */
    var sec = function (title, arr, note) {
      if (!arr.length) return "";
      return '<div class="muted" style="font-weight:700;margin:14px 2px 2px">' + esc(title) +
        (note ? ' <span style="font-weight:400">— ' + esc(note) + '</span>' : '') + '</div>' +
        clientTable(arr, t);   /* 1.65.0 */
    };
    h += sec("Due today", said, "he named today, or asked to be rung today");
    h += sec("The day he named has passed", broke, "these are the ones that slip");
    h += sec("Worst of the rest", rest, "most money, longest overdue");
    if (!said.length && !broke.length && !rest.length) h += '<div class="empty">Nothing to chase. Everything is settled.</div>';
    return h;
  }

  /* ===== COLLECTED TODAY  (1.55.0, 26 Sep 2026) =====
     Offered on 25 Sep and taken on his "plz do what on your side". At the top of Today's calls:
     what has come in today, by how it came, and who brought it. The admin and accounts desk see
     everyone's; a sales executive sees his own. The date is the payment's own date (the day the
     money was received, as typed), a cancelled payment is not counted, and a payment still held
     on this phone is counted and marked, because the money is in his hand either way. An
     Adjustment is not money received, so it is shown apart and left out of the total. */

  function shrink(dataUrl, maxPx, quality) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, m = Math.max(w, h);
        if (m > maxPx) { w = Math.round(w * maxPx / m); h = Math.round(h * maxPx / m); }
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        res({ url: cv.toDataURL("image/jpeg", quality || 0.72), w: w, h: h });
      };
      img.onerror = function () { rej(new Error("bad image")); };
      img.src = dataUrl;
    });
  }
  /* ===== THE PHOTO OF THE CHEQUE OR THE UPI SCREEN  (1.55.0, 26 Sep 2026) =====
     Offered on 25 Sep, taken on "plz do what on your side". Optional, on the Record-a-payment
     sheet. It is shrunk on the phone (1400 px, about 150 KB), sent up FIRST, and its link written
     into the payment's notes, so the payment row is written once and never edited afterwards -
     a money row is not something the app goes back and changes. If the photo cannot go up
     inside 40 seconds the payment is recorded anyway, without it, and he is told: the money is
     never held hostage to a picture. */
  function payPicUp(file, name, dt) {
    return new Promise(function (res) {
      var done = false, fin = function (v) { if (!done) { done = true; res(v); } };
      setTimeout(function () { fin({ err: "no answer in 40 seconds" }); }, 40000);
      try {
        var fr = new FileReader();
        fr.onload = function () {
          shrink(String(fr.result || ""), 1400, 0.7).then(function (ph) {
            var fn = ("payment_" + String(name || "") + "_" + String(dt || "")).replace(/[^\w.-]+/g, "_") + ".jpg";
            return api("pdfHost", { pdfBase64: String(ph.url).split(",")[1], filename: fn, mime: "image/jpeg" }, 40000);
          }).then(function (h) {
            fin(h && h.ok && h.url ? { url: String(h.url) } : { err: (h && h.error) || "the server sent no link back" });
          }, function (e) { fin({ err: (e && e.message) || "it could not be read" }); });
        };
        fr.onerror = function () { fin({ err: "the photo could not be read" }); };
        fr.readAsDataURL(file);
      } catch (e) { fin({ err: "the photo could not be read" }); }
    });
  }

     tried to ring, WhatsApp or send a hisab - and every one of them was a dead end. The man
     holding the phone is looking straight at the customer's name, very often WITH the customer
     on the line, which is the one moment the number is easiest to get. And then the app gave
     him nowhere to put it.

     ONLY THE MOBILE IS ASKED FOR HERE, deliberately. The CRM also chases plumber and architect,
     but this app does not pull the `associates` tab, so it has no partner register to pick
     from and would be inviting a free-typed name that matches nobody. The Challan app does
     pull it, and asks for all three. Asking for what you cannot record properly is worse than
     not asking.

     It is written through saveRow(), so it is journalled like everything else here: entered in
     a basement, held on the phone, on the sheet by itself when there is signal. */
  function sheetMobile(name) {
    var c = anyClient(name) || {};
    return '<h2>His mobile</h2>' +
      '<div class="muted" style="margin-bottom:10px">' + esc(name) +
      ' has no number on his record, so he cannot be rung, chased or sent his hisab.</div>' +
      '<label>Mobile</label>' +
      '<input id="mb_no" inputmode="numeric" placeholder="10 digits" value="' + esc(c.mobile || "") + '"/>' +
      '<div class="muted" style="margin:10px 0 0">Saved against him everywhere — the CRM, the ' +
      'challan app and this one all read the same record.</div>' +
      '<div class="acts" style="margin-top:14px">' +
        '<button class="btn gry grow" data-act="close">Cancel</button>' +
        '<button class="btn grow" data-act="mb-save" data-n="' + esc(name) + '">Save the number</button>' +
      '</div>';
  }

  function sheetOldBook(name) {
    var r = rowFor(name); if (!r) return "";
    var ob = obFor(name);
    return '<h2>What did he say?</h2>' +
      '<div class="muted" style="margin-bottom:10px">' + esc(name) + ' · our books say <b>' + money(r.oldBook) + '</b> brought forward</div>' +
      '<label>His answer</label><select id="ob_state">' +
        OB_STATES.filter(function (x) { return x[0] !== "none"; }).map(function (x) {
          return '<option value="' + x[0] + '"' + (x[0] === ob.state ? ' selected' : '') + '>' + esc(x[1]) + '</option>';
        }).join("") + '</select>' +
      '<label>The figure he accepts (leave blank if he accepts ours)</label>' +
      '<input id="ob_amt" inputmode="numeric" placeholder="' + Math.round(r.oldBook) + '" value="' + (ob.agreed ? Math.round(ob.agreed) : "") + '"/>' +
      '<label>What he actually said (optional)</label>' +
      '<textarea id="ob_note" rows="3" placeholder="e.g. says two payments of 50,000 each in March are not shown">' + esc(ob.note || "") + '</textarea>' +
      '<div class="muted" style="margin:12px 0 0">A man who has seen his figure and agreed it can be chased. One who has not, cannot — whatever we do. Nothing here changes his balance; it records where the conversation has got to.</div>' +
      '<div class="acts" style="margin-top:14px">' +
      '<button class="btn" data-act="ob-save" data-n="' + esc(name) + '">Save</button>' +
      '<button class="btn gry" data-act="close">Cancel</button></div>';
  }

  /* ---- the receipt, the moment the money is recorded ----
     Fifteen payments in the whole book says recording feels like paperwork with nothing
     at the end of it. This is the thing at the end of it: the customer gets his
     confirmation without asking, and the man entering it sees his work leave the building. */
  function sheetReceipt(name, amt, mode, dt, bal) {
    var r = anyClient(name) || {};
    return '<h2>Recorded</h2>' +
      '<div class="card" style="border-color:#99f6e4;background:#f0fdfa;margin-top:4px">' +
      '<div style="font-size:20px;font-weight:800;color:#0f766e">' + money(amt) + '</div>' +
      '<div class="muted">' + esc(name) + ' · ' + esc(mode) + ' · ' + esc(dstr(dt)) + '</div>' +
      '<div class="muted" style="margin-top:5px">Balance now <b>' + money(bal) + '</b></div></div>' +
      (r.mobile
        ? '<div class="muted" style="margin:10px 0 0">Send him the receipt — he gets confirmation without having to ask for it.</div>' +
          '<div class="acts" style="margin-top:12px">' +
          '<button class="btn grn" data-act="rc-wa" data-n="' + esc(name) + '" data-a="' + amt + '" data-m="' + esc(mode) + '" data-d="' + esc(dt) + '" data-b="' + Math.round(bal) + '">Send the receipt on WhatsApp</button>' +
          '<button class="btn gry" data-act="close">Not now</button></div>'
        : '<div class="muted" style="margin:10px 0 0">He has no mobile number on his record, so no receipt can be sent. Worth adding it in the CRM.</div>' +
          '<div class="acts" style="margin-top:12px"><button class="btn gry" data-act="close">Close</button></div>');
  }
  function receiptText(name, amt, mode, dt, bal) {
    var l = [];
    l.push("Namaste " + name + ",");
    l.push("");
    l.push("RECEIPT — Energy World");
    l.push("Received: Rs " + Math.round(amt).toLocaleString("en-IN"));
    l.push("By: " + mode);
    l.push("Date: " + dstr(dt));
    l.push("");
    l.push(bal > 0 ? "Balance now: Rs " + Math.round(bal).toLocaleString("en-IN")
                   : (bal < 0 ? "Your account is in credit: Rs " + Math.round(-bal).toLocaleString("en-IN")
                              : "Your account is now clear. Thank you."));
    l.push("");
    l.push("With thanks,");
    l.push("Energy World  |  Sonipat · Panipat · Karnal · Rohtak");
    return l.join("\n");
  }

  /* the actual sends, called only from the check screen */
  function obWaGo(name) {
    var r = rowFor(name); if (!r) return;
    var n = String(r.mobile || "").replace(/\D/g, "");
    if (!n) { mbAsk(name); return; }
    if (n.length === 10) n = "91" + n;
    window.open("https://wa.me/" + n + "?text=" + encodeURIComponent(obText(r)), "_blank");
    /* sending the figure IS taking it up - but never downgrading an answer already given */
    if (canWrite() && ["agreed", "disputed"].indexOf(obFor(r.name).state) < 0) {
      saveOldBook(r.name, "sent", 0, "").then(function (x) {
        if (x && x.row) { (S.data.audit = S.data.audit || []).push(x.row); bust(); render(); }
      }).catch(function () {});
    }
  }
  function rcWaGo(name, amt, mode, dt, bal) {
    var r = anyClient(name) || {};
    var n = String(r.mobile || "").replace(/\D/g, "");
    if (!n) { mbAsk(name); return; }
    if (n.length === 10) n = "91" + n;
    window.open("https://wa.me/" + n + "?text=" + encodeURIComponent(receiptText(name, amt, mode, dt, bal)), "_blank");
  }

  /* ================= THE HISAB, BUILT HERE AND SENT ON THE SPOT =================
     A man rings a customer, the customer says "send me the account", and the whole
     conversation dies if the answer is "I will send it later". This builds his statement
     in a second and puts a link to it in a WhatsApp message.

     It is a RUNNING LEDGER, which is what a customer means by hisab: opening balance,
     then every delivery, every return and every payment in date order, each with the
     balance after it. Not a summary - a summary is what people argue with.

     WhatsApp cannot carry a file through a link (a platform limit), so the PDF is hosted
     by the same backend call the CRM uses for quotes and the link goes in the message. If
     hosting fails the PDF is downloaded instead and the message still goes, so the man is
     never left with nothing. */

  var LOGO_B64 = "";
  function loadLogo() {
    if (LOGO_B64) return Promise.resolve(LOGO_B64);
    return fetch("../assets/logo_set2.jpg").then(function (r) { return r.ok ? r.blob() : null; })
      .then(function (b) {
        if (!b) return "";
        return new Promise(function (res) {
          var fr = new FileReader();
          fr.onload = function () { LOGO_B64 = String(fr.result).split(",")[1] || ""; res(LOGO_B64); };
          fr.onerror = function () { res(""); };
          fr.readAsDataURL(b);
        });
      }).catch(function () { return ""; });
  }

  /* every movement on his account, in the order it happened */
  function ledgerRows(name) {
    var d = S.data || {};
    /* v1.51.0 - THE FAMILY, as clientDue counts it. The PDF listed the main name's rows only, so
       for a merged client its closing figure and the "Balance" in the message sent with it were
       two different numbers in one message. */
    var _fk = {}; dupFamily(name).forEach(function (n) { _fk[String(n || "").trim().toLowerCase()] = 1; });
    var _isF = function (n) { return !!_fk[String(n || "").trim().toLowerCase()]; };
    var out = [];
    /* v1.26.0 - the statement is the evidence FOR the balance, so it obeys the same three
       exclusions. A statement that lists a payment the balance does not count is a statement
       the client will win an argument with. */
    /* v1.37.0 - the statement lists exactly what the balance counts, or the client wins the
       argument. Same question as clientDue above. */
    dedupe((d.challans || []).filter(function (c) {
      return _isF(c.customerName) &&
             hisabOwed(c) &&
             !isCancelled("challans", c.id);
    })).forEach(function (c) {
      out.push({ ymd: d10(c.createdAt), what: "Delivery " + (c.challanNo || ""),
                 extra: c.site || "", debit: challanNet(c), credit: 0, ch: c, ts: String(c.createdAt || "") });
    });
    (d.returns || []).filter(function (r) {
      return _isF(r.customerName) &&
             String(r.status || "").trim().toLowerCase() === "received" &&
             !isCancelled("returns", r.id);
    }).forEach(function (r) {
      /* v1.9.0 - the same pricing the balance uses, so the statement and the figure above it
         can never disagree. An unpriceable line is named on the row, not buried. */
      var _rv = returnNet(r, d.challans || []);
      /* v1.25.0 - AND A PRICE WE GUESSED IS SAID OUT LOUD, exactly as the CRM's card says it.
         These lines used to be worth nothing at all here. They are now worth the catalogue
         price at this client's discount, which is very likely the best figure available and
         is certainly not the figure he was billed. He is told which, and both cures are his:
         put the challan number on the return, or type the rate on the line. */
      out.push({ ymd: d10(r.createdAt), what: "Material returned " + (r.returnNo || ""),
                 extra: [r.challanNo ? "against " + r.challanNo : "",
                         _rv.est ? _rv.est + " of " + rnLines(r).length + " priced from our catalogue" : "",
                         _rv.unpriced ? _rv.unpriced + (_rv.unpriced === 1 ? " item" : " items") + " not priced - ask the office" : ""]
                        .filter(Boolean).join(" \u00b7 "),
                 debit: 0, credit: _rv.amt, rt: r, ts: String(r.createdAt || "") });
    });
    (d.payments || []).filter(function (p) {
      return _isF(p.client) && !isCancelled("payments", p.id);
    }).forEach(function (p) {
      out.push({ ymd: d10(p.date || p.createdAt), what: "Payment received",
                 extra: [p.mode, p.ref].filter(Boolean).join(" · "), debit: 0, credit: payAmt(p), pay: p, ts: String(p.createdAt || "") });
    });
    out.sort(function (a, b) { return String(a.ymd).localeCompare(String(b.ymd)); });
    return out;
  }

  /* ===== 1.64.0 - THREE PAPERS, AS IN THE CRM =====
     HIS WORDS, 7 Oct 2026: "in collection app also provide both options to download only statement, to
     download complete hisab, to download hisab after last payment, as it's not showing now".
       stmt  - the statement, as it always was.
       full  - the statement, then every delivery item by item (rate, discount, amount) and every return,
               each with its signed receipt as a link that opens the photograph.
       since - from his latest payment: everything before it is one brought-forward line, then what
               came after, item by item - what he is being asked to pay for now.
     The figures are the statement's own rows (ledgerRows), so the three papers close on one balance. */
  function hisabProofUrl(chId) {
    var best = null;
    ((S.data && S.data.audit) || []).forEach(function (a) {
      if (!a || String(a.action || "") !== "challan:proof") return;
      var d = {}; try { d = JSON.parse(a.detail || "{}") || {}; } catch (e) { return; }
      if (String(d.chId || "") !== String(chId) || !d.url) return;
      if (!best || String(a.createdAt || "") > best.at) best = { at: String(a.createdAt || ""), url: String(d.url) };
    });
    return best ? best.url : "";
  }
  function hisabLastPayRow(rows) {
    var best = null;
    rows.forEach(function (x) { if (x.pay && x.credit > 0 && (!best || x.ymd > best.ymd || (x.ymd === best.ymd && x.ts > best.ts))) best = x; });
    return best;
  }
  function sheetHisabDl(name) {
    var r = rowFor(name); if (!r) return "";
    var lp = hisabLastPayRow(ledgerRows(name));
    var opt = function (mode, title, sub) {
      return '<button class="btn gry" data-act="hisab-dl-go" data-n="' + esc(name) + '" data-m="' + mode + '" style="width:100%;display:block;text-align:left;margin:0 0 8px;padding:10px 12px;min-height:56px">' +
        '<b style="display:block;font-size:14px">' + title + '</b><span style="display:block;font-size:12.5px;font-weight:500;color:#64748b;margin-top:2px">' + sub + '</span></button>';
    };
    return '<h2>Download his hisab</h2><div class="muted" style="margin-bottom:10px">' + esc(name) + ' &middot; balance ' + money(r.due) + '</div>' +
      opt("stmt", "Statement only", "One page per account: every delivery, return and payment with the running balance.") +
      opt("full", "Complete hisab", "The statement, then every delivery item by item, with its signed receipt to open.") +
      (lp ? opt("since", "Hisab after last payment", "From his payment of " + money(lp.credit) + " on " + esc(dstr(lp.ymd)) + ": what came after, item by item.")
          : '<div class="muted" style="margin:4px 2px 10px">No payment from him yet, so there is no &ldquo;after last payment&rdquo; paper &mdash; the complete hisab is the same thing.</div>') +
      '<div class="acts"><button class="btn gry grow" data-act="close">Close</button></div>';
  }
