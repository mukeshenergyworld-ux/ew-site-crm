     own biometric unlocks a PIN that is ALREADY stored on that phone. The fingerprint
     never leaves the device and is never sent anywhere - that is how WebAuthn works. The
     server still authenticates with the PIN exactly as before. It is a real lock on a
     convenience, not a new identity system.

     This app already stays signed in on a phone once you have signed in once. Turning
     this on puts the phone's own lock in front of that, which matters when the app is
     showing every rupee eighty-six lakh of it that the firm is owed. */
  var BIO_KEY = "ew_collect_bio";


  function fromB64u(str) {
    var s2 = String(str).replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(s2), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  function bioEnrol() {
    if (!bioAvailable()) { toast("This phone has no Face ID or fingerprint the browser can use."); return; }
    if (!S.user || (!S.pin && !S.tok)) { toast("Sign in first, then turn it on."); return; }
    navigator.credentials.create({
      publicKey: {
        challenge: randBytes(32),
        rp: { name: "Energy World Collection" },
        user: { id: randBytes(16), name: S.user, displayName: S.user },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000, attestation: "none"
      }
    }).then(function (cred) {
      credPut(BIO_KEY, { id: b64u(cred.rawId), user: S.user, pin: S.pin });
      toast("Face ID / fingerprint enabled on this phone.");
      S.sheet = sheetAccount(); render();
    }).catch(function () { toast("Could not enable it. Your PIN still works."); });
  }

  function bioUnlock() {
    var saved = bioSaved();
    if (!saved) return;
    navigator.credentials.get({
      publicKey: {
        challenge: randBytes(32),
        allowCredentials: [{ type: "public-key", id: fromB64u(saved.id) }],
        userVerification: "required", timeout: 60000
      }
    }).then(function () {
      S.user = saved.user; S.pin = saved.pin || ""; S.tok = saved.tok || "";   /* B9 */
      /* v1.12.0 - this fell through to the outer catch, so a dropped packet told the man his
         fingerprint did not match. It matched. Give it its own catch. */
      return authOnce(1).catch(function (e) {
        S.pin = ""; renderLogin(loginWhy(e)); return null;
      }).then(function (r) {
        if (r === null) return;
        if (!r || !r.ok) {
          try { localStorage.removeItem(BIO_KEY); } catch (e) {}
          S.pin = ""; renderLogin("That saved sign-in is no longer valid. Use your PIN.");
          return;
        }
        S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
        try { beatStart(); } catch (e) {}   /* v1.20.0 - from here it asks on its own */
        if (!roleAny(["admin","accounts","sales"])) { S.pin = ""; renderLogin(notForYou(S.user, S.role)); S.role = ""; return; }
        try { credPut(STORE, { user: S.user, pin: saved.pin, role: S.role }); } catch (e) {}
        startFlushTicker();          /* the PIN path started it; Face ID never did, so a held
                                        payment on a Face ID phone had nothing running to send it */
        S.tab = "today"; pull(false);
      });
    }).catch(function () { toast("That did not match. Use your PIN."); });
  }

  function bioForget() {
    try { localStorage.removeItem(BIO_KEY); } catch (e) {}
    toast("Face ID / fingerprint removed from this phone.");
    S.sheet = sheetAccount(); render();
  }

  /* ============ FORGETTING THE BOOK MEANS FORGETTING WHEN IT CAME ============
     `S.data = null` was clearing the book and leaving the stamps that describe it standing.
     The header then read "updated 13:15" over a screen with no book behind it at all, and
     from v1.28.0 it was worse than cosmetic: the lead check asks S.restAt whether the
     delivery history has been pulled THIS session before it is willing to refuse a man at the
     counter. Sign out as one man and in as another on the same phone without reloading, and
     that answer belonged to somebody else's book.

     Three stamps, one place, so a fourth cannot be added and missed. */
  function forgetBook() {
    S.data = null; S.syncAt = 0; S.fastAt = 0; S.restAt = 0;
  }

  function signOut() {
    credDrop();   /* B9 */
    try { localStorage.removeItem(STORE); } catch (e) {}
    try { localStorage.removeItem(BIO_KEY); } catch (e) {}
    try { bigDel(SNAP + "_" + S.user); } catch (e) {}
    S.user = ""; S.pin = ""; S.role = ""; forgetBook(); S.sheet = null;
    renderLogin("Signed out on this phone.");
  }

  /* one small screen for the account, because a man needs somewhere to sign out */
  function sheetAccount() {
    var on = !!bioSaved();
    return '<h2>This phone</h2>' +
      '<div class="muted" style="margin-bottom:10px">Signed in as <b>' + esc(S.user) + '</b> · ' + esc(S.role) +
        (canWrite() ? '' : (canPay() ? ' · records payments' : ' · view only')) + '</div>' +   /* 1.59.0 */
      '<div class="card" style="margin-top:0">' +
        '<div style="font-weight:700">Stays signed in</div>' +
        '<div class="muted">This phone remembers you, so the app opens straight onto today\'s calls. Sign out below if the phone is shared or you are handing it over.</div>' +
      '</div>' +
      /* 1.67.0 - the Old book screen, moved here off the bottom bar (see renderBody). Same view,
         one tap further in; the ☰ is where a man goes for the things he needs now and then. */
      '<div class="card">' +
        '<div style="font-weight:700">Old book</div>' +
        '<div class="muted">The brought-forward balances from the books before the app. Rarely needed now, so it lives here instead of on the bar.</div>' +
        '<div class="acts"><button class="btn sm gry" data-act="menu-oldbook" style="min-height:44px">&#128220; Open the old book</button></div>' +
      '</div>' +
      '<div class="card" style="border-color:' + (on ? '#99f6e4' : '#e2e8f0') + ';background:' + (on ? '#f0fdfa' : '#fff') + '">' +
        '<div style="font-weight:700">Face ID / fingerprint ' + (on ? '<span class="pill grn">on</span>' : '<span class="pill">off</span>') + '</div>' +
        '<div class="muted">' +
          (bioAvailable()
            ? 'The phone\'s own lock in front of the app. Your fingerprint never leaves this phone and is never sent to us — it only unlocks the PIN already saved here. The screen shows every rupee the firm is owed, so it is worth having.'
            : 'This phone or browser cannot do it. Your PIN still works.') +
        '</div>' +
        (bioAvailable()
          ? '<div class="acts">' + (on
              ? '<button class="btn sm gry" data-act="bio-off">Turn it off</button>'
              : '<button class="btn sm grn" data-act="bio-on">Turn it on</button>') + '</div>'
          : '') +
      '</div>' +
      '<div class="acts" style="margin-top:12px">' +
      '<button class="btn gry" data-act="close">Close</button>' +
      '<div class="grow"></div>' +
      window.ewTheme.button() + ' ' +
      '<button class="btn" data-act="signout" style="background:#b91c1c;border-color:#b91c1c">Sign out</button></div>';
  }

  /* ================= PAINT AND PRESS ================= */

  /* One place decides what is under the header, so the full paint and the
     one-letter-at-a-time repaint can never disagree about which screen you are on. */
  /* ===== THE CLIENT SCORECARD  (Collect 1.54.0 / Challan 1.103.0, 25 Sep 2026) =====
     His words: "can we have client scorecard in collection and challan app, for executives and
     admin only". Asked what it should show, he ticked all four: business and trend, payment
     behaviour, brands and discount (with what he does not buy yet), and one overall grade.

     ONE CARD, TWO APPS, BYTE FOR BYTE (t_apps_agree holds it). The money on it is not worked out
     here: it is clientDue - the Payment app's own account, family and all - so the due and the
     overdue on a scorecard are the figures the man chasing already sees, never a second opinion.

     THE GRADE, out of 100, and simple enough to say out loud to the man it is about:
       buying  40 - his last 90 days of goods (after every discount), +5 when growing, and
                    at most 5 when he has gone quiet (no order in 90 days);
       paying  45 - the share of what he owes that is NOT overdue, less 8 when he takes over 45
                    days on average to pay and 15 over 60, less 10 when nothing has come in for
                    60 days while he owes;
       returns 15 - 15 up to 2% of his business coming back, 10 up to 5%, 5 up to 10%.
     A 75 and over, B 55, C 35, D below. A man who has never taken a delivery is not graded. */
  var _sccCache = null;
  var SCC_ORDER = ["A", "B", "C", "D", "–"];
  var SCC_BUY = [300000, 100000, 25000];     /* 90-day goods for 40 / 30 / 20 points; tuned on his book */
  function sccCanSee() { return roleIs("admin") || roleIs("sales"); }
  function sccGoods(ch) {
    var ls = pricedLines(ch, ch.customerName), gross = ls.reduce(function (a, x) { return a + x.amt; }, 0);
    var off = gross > 0 ? Math.min(Math.max(0, hisabExtraOf(ch)), gross) : 0;
    var f = gross > 0 ? (gross - off) / gross : 1, br = {};
    ls.forEach(function (x) { if (x.job) return; var b = String(x.brand || "Other"); br[b] = (br[b] || 0) + x.amt * f; });
    return { net: gross - off, brands: br };
  }
  function sccTopBrands() {
    var m = {};
    ((S.data && S.data.challans) || []).forEach(function (ch) {
      if (!hisabCounts(ch) || isCancelled("challans", ch.id)) return;
      var g = sccGoods(ch); Object.keys(g.brands).forEach(function (b) { m[b] = (m[b] || 0) + g.brands[b]; });
    });
    return Object.keys(m).filter(function (b) { return b !== "Other"; }).sort(function (a, b) { return m[b] - m[a]; });
  }
  function sccFor(c, top) {
    var d = S.data || {}, t = today(), chs = d.challans || [];
    var fam = dupFamily(c.name), famL = {}, seenO = {}, openF = 0;
    fam.forEach(function (n) { famL[lower(n)] = 1; });
    fam.forEach(function (nm) {
      (d.clients || []).forEach(function (x) {
        if (lower(x.name) !== lower(nm)) return;
        var kk = String(x.id || x.name || ""); if (seenO[kk]) return; seenO[kk] = 1; openF += num(x.openingAmt);
      });
    });
    var due = clientDue({ client: c, challans: chs, payments: d.payments || [], returns: d.returns || [], today: t,
      names: fam, opening: openF, creditDays: num(c.creditDays) || CREDIT_DAYS,
      returnValue: function (r) { return returnNet(r, chs).amt; }, returnUnpriced: function (r) { return returnNet(r, chs).unpriced; } });
    var mine = dedupe(chs.filter(function (ch) { return famL[lower(ch.customerName)] && hisabCounts(ch) && !isCancelled("challans", ch.id); }));
    var total = 0, recent = 0, prior = 0, last = "", brands = {};
    mine.forEach(function (ch) {
      var y = d10(ch.createdAt), age = daysBetween(y, t), g = sccGoods(ch);
      total += g.net; if (age <= 90) recent += g.net; else if (age <= 180) prior += g.net;
      if (y > last) last = y;
      Object.keys(g.brands).forEach(function (b) { brands[b] = (brands[b] || 0) + g.brands[b]; });
    });
    var lastDays = last ? daysBetween(last, t) : -1;
    /* measured on his book the day it shipped: the app holds about three months, so the 90 days
       before are empty for almost everyone and "Growing" was the answer 71 times out of 71. Growth
       needs something to grow from: with nothing in the 90 days before, a client is New or Steady. */
    var first = ""; mine.forEach(function (ch) { var y = d10(ch.createdAt); if (!first || y < first) first = y; });
    var trend = !mine.length ? "No deliveries yet" : lastDays > 90 ? "Gone quiet" :
      prior <= 0 ? (daysBetween(first, t) <= 90 ? "New this quarter" : "Steady") :
      recent < prior * 0.6 ? "Shrinking" : recent > prior * 1.2 ? "Growing" : "Steady";
    /* how long his money takes: every rupee paid, set against the oldest thing he owed (the old
       book first, then deliveries in date order), and the days between weighed by the rupees */
    var q = (due.lines || []).filter(function (l) { return !l.credit && l.amount > 0; })
      .map(function (l) { return { ymd: l.ymd, left: l.amount }; }).sort(function (a, b) { return a.ymd.localeCompare(b.ymd); });
    var open = Math.max(0, due.opening || 0), wsum = 0, w = 0, qi = 0;
    (due.payments || []).slice().sort(function (a, b) { return String(a.ymd).localeCompare(String(b.ymd)); }).forEach(function (p) {
      var amt = p.amount, o = Math.min(amt, open); open -= o; amt -= o;
      while (amt > 0.5 && qi < q.length) {
        var tk = Math.min(amt, q[qi].left);
        wsum += tk * Math.max(0, daysBetween(q[qi].ymd, p.ymd)); w += tk;
        q[qi].left -= tk; amt -= tk; if (q[qi].left <= 0.5) qi++;
      }
    });
    var avgPay = w > 0 ? Math.round(wsum / w) : null;
    var retRate = due.billed > 0 ? due.credited / due.billed : 0;
    var bl = Object.keys(brands).filter(function (b) { return b !== "Other"; }).sort(function (a, b) { return brands[b] - brands[a]; });
    var m = { name: c.name, owner: String(c.ownedBy || c.createdBy || "").trim(), total: total, recent: recent, prior: prior,
      last: last, lastDays: lastDays, deliveries: mine.length, trend: trend, due: due.due, overdue: Math.max(0, Math.min(due.overdue, due.due)),
      ageDays: due.ageDays, lastPay: due.lastPay, daysSincePay: due.daysSincePay, avgPay: avgPay, paid: due.paid,
      billed: due.billed, credited: due.credited, retRate: retRate, terms: num(c.creditDays) || CREDIT_DAYS,
      brands: bl.map(function (b) { return { brand: b, amt: Math.round(brands[b]), disc: clientDiscountOn(c.name, b, t) }; }),
      cross: (top || []).filter(function (b) { return !brands[b]; }).slice(0, 5) };
    var g = sccGrade(m); m.grade = g.grade; m.score = g.score; m.why = g.why; m.parts = g.parts; m.tip = g.tip;
    return m;
  }
  function sccGrade(m) {
    if (!m.deliveries) return { grade: "–", score: 0, parts: [0, 0, 0], why: ["No delivery yet, so nothing to grade."],
      tip: m.cross.length ? "First order: start with " + m.cross[0] + "." : "" };
    var why = [];
    var buy = m.recent >= SCC_BUY[0] ? 40 : m.recent >= SCC_BUY[1] ? 30 : m.recent >= SCC_BUY[2] ? 20 : m.recent > 0 ? 10 : 5;
    if (m.trend === "Growing") { buy = Math.min(40, buy + 5); why.push("Buying more than the 90 days before."); }
    if (m.trend === "Gone quiet") { buy = Math.min(buy, 5); why.push("No order in " + m.lastDays + " days."); }
    if (m.trend === "Shrinking") why.push("Buying less than the 90 days before.");
    var pay = 45;
    if (m.due > 500) {
      pay = 45 * (1 - Math.min(1, Math.max(0, m.overdue) / m.due));
      if (m.overdue > 500) why.push(money(m.overdue) + " overdue past " + m.terms + " days.");
      if (m.daysSincePay > 60 || m.daysSincePay < 0) { pay -= 10; why.push(m.daysSincePay < 0 ? "Owes, and has never paid." : "Nothing paid for " + m.daysSincePay + " days."); }
    }
    if (m.avgPay != null && m.avgPay > 60) { pay -= 15; why.push("Takes " + m.avgPay + " days to pay on average."); }
    else if (m.avgPay != null && m.avgPay > 45) { pay -= 8; why.push("Takes " + m.avgPay + " days to pay on average."); }
    pay = Math.max(0, pay);
    var ret = m.retRate <= 0.02 ? 15 : m.retRate <= 0.05 ? 10 : m.retRate <= 0.1 ? 5 : 0;
    if (m.retRate > 0.05) why.push(Math.round(m.retRate * 100) + "% of his goods came back.");
    var score = Math.round(buy + pay + ret);
    var grade = score >= 75 ? "A" : score >= 55 ? "B" : score >= 35 ? "C" : "D";
    /* money late is money late, however much he buys: half of what he owes overdue caps him at
       C, and overdue with nothing paid for 90 days is D */
    if (m.due > 500 && m.overdue >= m.due * 0.5 && (grade === "A" || grade === "B")) { grade = "C"; why.push("Half or more of what he owes is overdue."); }
    /* no second override: the first version also made "overdue and nothing paid for 90 days" a D,
       and on his book that caught clients whose payments simply pre-date the app - 24 Ds, one of
       them scoring 78. The score already takes 10 off for it. */
    if (!why.length) why.push("Buying and paying well.");
    var tip = m.overdue > 500 ? "Collect " + money(m.overdue) + " overdue before the next big delivery."
      : m.trend === "Gone quiet" ? "Call him: no order in " + m.lastDays + " days."
      : m.cross.length ? "Pitch " + m.cross.slice(0, 2).join(" and ") + " — he does not buy " + (m.cross.length > 1 ? "them" : "it") + " from us yet." : "";
    return { grade: grade, score: score, parts: [Math.round(buy), Math.round(pay), ret], why: why, tip: tip };
  }
  function sccAll() {
    if (_sccCache) return _sccCache;
    var me = lower(S.user || ""), top = sccTopBrands(), seen = {};
    var list = ((S.data && S.data.clients) || []).filter(function (c) {
      if (!String(c.name || "").trim() || dupIsAlias(c.name)) return false;
      var k = lower(c.name); if (seen[k]) return false; seen[k] = 1;
      return roleIs("admin") || lower(c.ownedBy || c.createdBy || "") === me;
    }).map(function (c) { return sccFor(c, top); });
    _sccCache = list;
    return list;
  }
  function sccColor(g) { return g === "A" ? "#15803d" : g === "B" ? "#0f766e" : g === "C" ? "#b45309" : g === "D" ? "#b91c1c" : "#64748b"; }
  function sccBadge(g, big) {
    var s = big ? 56 : 40;
    return '<div style="flex:0 0 ' + s + 'px;width:' + s + 'px;height:' + s + 'px;border-radius:50%;background:' + sccColor(g) +
      ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:' + (big ? 26 : 18) + 'px">' + esc(g) + '</div>';
  }
  function sccTrend(t) {
    var col = t === "Growing" ? "#15803d" : (t === "Gone quiet" || t === "Shrinking") ? "#b91c1c" : "#475569";
    var ar = t === "Growing" ? "&#9650; " : (t === "Shrinking" || t === "Gone quiet") ? "&#9660; " : "";
    return '<span style="color:' + col + ';font-weight:700">' + ar + esc(t) + '</span>';
  }
  function viewScc() {
    if (!sccCanSee()) return '<div class="card"><b>The client scorecard is for sales executives and the owner.</b></div>';
    if (!sccReady()) return '<div class="card">Loading payments for the scorecard…</div>';
    S.scc = S.scc || {};
    var all = sccAll();
    if (S.scc.open) {
      var one = all.filter(function (m) { return lower(m.name) === lower(S.scc.open); })[0];
      if (one) return sccCardHtml(one);
      S.scc.open = "";
    }
    var f = S.scc.f || "all", q = lower(S.scc.q || "");
    var n = { A: 0, B: 0, C: 0, D: 0 };
    all.forEach(function (m) { if (n[m.grade] != null) n[m.grade]++; });
    var shown = all.filter(function (m) {
      if (q && lower(m.name).indexOf(q) < 0) return false;
      if (f === "all") return m.deliveries > 0;
      if (f === "watch") return m.grade === "C" || m.grade === "D";
      if (f === "new") return !m.deliveries;
      return m.grade === f;
    }).sort(function (a, b) { return (SCC_ORDER.indexOf(a.grade) - SCC_ORDER.indexOf(b.grade)) || (b.recent - a.recent) || (b.total - a.total); });
    var tile = function (g, lbl) {
      return '<button data-act="scc-f" data-v="' + g + '" style="flex:1 1 70px;min-height:56px;border-radius:12px;border:2px solid ' + (f === g ? sccColor(g) : '#e2e8f0') +
        ';background:#fff;cursor:pointer;padding:6px"><div style="font-size:20px;font-weight:800;color:' + sccColor(g) + '">' + n[g] + '</div>' +
        '<div style="font-size:12px;color:#475569;font-weight:700">' + lbl + '</div></button>';
    };
    var h = '<div class="card" style="padding:12px"><div style="font-size:17px;font-weight:800">Client scorecard</div>' +
      '<div style="font-size:12.5px;color:#475569;margin-top:2px">' + (roleIs("admin") ? "Every client" : "Your clients") +
      ', graded A to D on buying, paying and returns. Tap a client for his full card.</div>' +
      '<div style="display:flex;gap:6px;margin-top:10px">' + tile("A", "Grade A") + tile("B", "Grade B") + tile("C", "Grade C") + tile("D", "Grade D") + '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">' +
      [["all", "All buying"], ["watch", "Needs attention (C, D)"], ["new", "Not bought yet"]].map(function (o) {
        return '<button class="btn sm' + (f === o[0] ? '' : ' gry') + '" data-act="scc-f" data-v="' + o[0] + '">' + o[1] + '</button>';
      }).join("") + '</div>' +
      '<input id="scc_q" placeholder="Find a client" value="' + esc(S.scc.q || "") + '" style="margin-top:8px;width:100%;min-height:44px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px"/></div>';
    if (!shown.length) return h + '<div class="card" style="color:#64748b">Nobody here.</div>';
    h += shown.slice(0, 200).map(function (m) {
      return '<div class="card" data-act="scc-open" data-n="' + esc(m.name) + '" style="display:flex;gap:10px;align-items:center;cursor:pointer;padding:10px 12px;margin-bottom:6px">' +
        sccBadge(m.grade) +
        '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14.5px;word-break:break-word">' + esc(m.name) + '</div>' +
        '<div style="font-size:12.5px;color:#475569;margin-top:2px">' + (m.deliveries ? '90 days ' + money(Math.round(m.recent)) + ' &middot; ' + sccTrend(m.trend) : 'No delivery yet') +
        (roleIs("admin") && m.owner ? ' &middot; ' + esc(m.owner) : '') + '</div>' +
        (m.due > 500 ? '<div style="font-size:12.5px;margin-top:2px">Owes <b>' + money(m.due) + '</b>' +
          (m.overdue > 500 ? ' &middot; <b style="color:#b91c1c">' + money(m.overdue) + ' overdue</b>' : '') + '</div>' : '') + '</div>' +
        (m.deliveries ? '<div style="flex:0 0 auto;text-align:right;font-size:12px;color:#64748b"><b style="font-size:16px;color:#0f172a">' + m.score + '</b><br>of 100</div>' : '') + '</div>';
    }).join("");
    if (shown.length > 200) h += '<div class="card" style="font-size:12.5px;color:#64748b">Showing 200 of ' + shown.length + '. Use Find to reach the rest.</div>';
    return h;
  }
  function sccCardHtml(m) {
    var row = function (k, v, col) {
      return '<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #f1f5f9;font-size:13.5px">' +
        '<span style="color:#475569">' + k + '</span><b style="text-align:right' + (col ? ';color:' + col : '') + '">' + v + '</b></div>';
    };

  /* ================= WHY THE LOGIN FAILED (v1.12.0) ======================
     This said "Network error. Try again." for five different faults - no signal, a server too
     slow, a deployment wanting a Google sign-in, a spent quota, and a server answering with
     something that is not JSON. Only one of the five is fixed by trying again, and the man
     holding the phone could not tell us which he had. api() already knows. Say it.
     Ported from Challan v1.13.0, 17 Aug. */
  /* v1.12.0 - a refusal must name the role it refused; access follows the CRM role and
     nothing else, so the role is the whole answer. See Challan v1.13.0. */
  function notForYou(name, role) {

      "\u201c" + (role || "no role set") + "\u201d. " +
      "The Payment app is for admin, accounts and sales only. Ask the owner to change your " +
      "role in the team sheet \u2014 nothing else controls it.";
  }

  function loginWhy(e) {
    var m = (e && e.message) ? String(e.message) : "";
    if (/no signal/i.test(m))
      return "No signal \u2014 this phone could not reach the server. Check the data connection, then try again.";
    if (/no answer in/i.test(m))
      return "The server did not answer within " + (m.replace(/[^0-9]/g, "") || "45") +
             " seconds. It is usually busy, not down \u2014 try once more.";
    if (/sign in to Google/i.test(m))
      return "The server asked this phone to sign in to Google. The app\u2019s address needs " +
             "republishing \u2014 tell the owner, nobody can sign in until then.";
    if (/quota/i.test(m))
      return "Google has stopped the server for today (quota reached). Tell the owner.";
    if (/not JSON/i.test(m))
      return "The server answered with something the app cannot read. Tell the owner and read " +
             "out this line: " + m;

     a 45s deadline made the man stare at "Signing in..." for 91 seconds before being told
     anything at all. That is worse than the fault. He is told at 45s, the message says trying
     again is worth it, and HE decides whether to wait again - which is the difference between
     waiting and being made to wait. A refusal is never retried: the server answered. */
  function authOnce(left) {
    return api("teamAuth", { ua: navigator.userAgent }).catch(function (e) {
      var m = (e && e.message) ? String(e.message) : "";

          .then(function () { return authOnce(left - 1); });

  /* ================= THE HEARTBEAT (v1.20.0) =================
     "sync between crm and related apps like challan, collection is not fast, we have to work
     seriously on it"                                              - 19 August 2026

     Every previous answer measured the PULL and reported that it was fast. It is. The pull was
     never the problem: NOTHING TOLD THIS APP. It pulled on exactly two events - opening it,
     and coming back to it - and so did the other two. There was no polling anywhere. A phone
     sitting in front of a man with the app OPEN never asked again, so a payment recorded in
     the CRM, or a challan received in the godown, reached this screen whenever somebody
     happened to switch away and switch back. That is not slow. That is unbounded.

     teamStamp returns one number - one property read on the server, no sheet, no book, about
     sixty bytes. Against a ~680 KB pull, asking a hundred times costs less than pulling once.
     It asks every 30 seconds while somebody is actually looking, and pulls only when the
     number has moved.

     with a form open. Nothing may take a half-typed receipt off the screen. */
  var BEAT_EVERY = 30000, _beatSeen = "", _beatOn = null, _beatBusy = false;

     "Serious issue - Challan made at godown, taking very long to sync all device, hence
     approval delaying."

     The heartbeat shipped on 19 August and it worked: the godown writes a challan, the
     server's write stamp moves, and every other phone notices inside thirty seconds. Then it
     pulled the FAST half of the book and returned - and in the Challan app `challans` is not
     in the fast half. It is in KEEP_REST, behind REST_EVERY, which is five minutes.

     So an accounts phone could sit open, awake, and correctly informed that something had
     changed, and still not show the new challan for five and a half minutes. No amount of
     waiting shortened it and the refresh arrow was the only way through, because the app had
     decided not to ask. That is the approval delay. It was never slowness - measured, the
     pull is 3.7 s for 383 KB.

     action anybody has ever taken - and re-fetching that on every glance is what a phone on
     4G in a basement godown pays for. The throttle earns its place when nothing has changed.

     WHAT CHANGES. It now yields to the stamp. The stamp only moves when somebody WROTE
     something, so if the stamp this phone is holding is not the stamp it last took the
     history at, the history is stale by definition and the clock has no opinion worth
     hearing. When nothing has been written the two are equal and not one extra byte moves.

     AND IT FIXES THE COME-BACK-TO-THE-APP PATH FOR FREE. The fast half calls beatMark() with
     the server's stamp as it lands, and that happens BEFORE restStale() is consulted. So
     returning to the app after two minutes now brings the challan written one minute ago -
     which is what he asked for in v1.28.0 when he had the 60-second guard taken out, and
     which he never got, because challans live in the half that guard never governed. */
  var _restStamp = "";
  /* ============ 297 KB THIS APP DOWNLOADS AND NEVER DRAWS (v1.25.1, 29 Aug 2026) ============
     Nobody asked for this. Measured on his own book while looking at something else:

       the whole book on a phone            1,415 KB
       of which the audit tab                 466 KB
       of which challan:proof rows            348 KB
       of which base64 thumbnails             297 KB   - 21% of EVERY pull, by everyone

     94 audit rows carry a JPEG thumbnail inline. 87 of the 100 proof rows carry BOTH that
     thumbnail AND a Drive url; not one carries a thumbnail without a url. So the picture is
     always reachable by link, and the inline copy is a convenience for the screens that draw a
     proof thumbnail instantly.

     THIS APP DRAWS NONE OF THEM. It reads `audit` for exactly two things, both of which are
     words: the follow-up calls and the old-book notes. The CRM, the Challan app and the Service
     app do draw proof thumbnails and keep theirs untouched.

     NOTHING IS DELETED. The thumbnail stays on the sheet, and every app that shows it still
     gets it. This drops it from THIS app's copy in memory, which is also what gets stringified
     into storage on every pull and parsed back on every open.

     away. The app pulls roughly 260 KB LESS than it did before today. */
  function dropProofThumbs() {
    var a = S.data && S.data.audit;
    if (!Array.isArray(a)) return 0;
    var freed = 0;
    for (var i = 0; i < a.length; i++) {
      var r = a[i];
      if (!r || String(r.action || "").indexOf("proof") < 0) continue;
      var d = String(r.detail || "");
      if (d.indexOf('"thumb"') < 0) continue;
      var o = null;
      try { o = JSON.parse(d); } catch (e) { continue; }
      if (!o || typeof o !== "object" || !o.thumb) continue;
      freed += String(o.thumb).length;

      try { r.detail = JSON.stringify(o); } catch (e) {}

      var st = (r && r.stamp) ? String(r.stamp) : "";

      if (st === _beatSeen) return;

  function beatStart() { if (!_beatOn) _beatOn = setInterval(beat, BEAT_EVERY); }

  function beatSkip() {
    if (document.hidden) return true;
    if (!S.user || !S.data) return true;
    if (S.sheet) return true;                   /* never with a half-typed receipt on screen */

  var _pulling = null;

     The backend was finally opened today. `teamGet_` never looks at `body.only`, and
     `teamFilter_(u)` builds all 29 tabs on every single call. The `only:` list every app in
     this estate has been sending for weeks has always been thrown away.

    _pulling = getBook((loud || restStale()) ? KEEP_FAST.concat(KEEP_REST) : KEEP_FAST).then(function (r) {   /* 1.66.2 - one call (p749) */

     this app works every figure with its own code - the code the man at the counter is looking at -
     and hands them back. It signs nobody in, sends nothing, writes nothing, keeps no journal and
     registers no worker. Opened any other way (a man typing the link, no CRM behind it) the parent
     has no __ewProbeBook and the app starts as normal. */
  function ewProbe() {
    var P = null;
    try {
      if (String(location.search || "").indexOf("probe=ledger") < 0) return false;
      P = (window.parent && window.parent !== window) ? window.parent : null;
      if (!P || typeof P.__ewProbeBook !== "function" || typeof P.__ewProbeAnswer !== "function") return false;
    } catch (e) { return false; }
    var book = null; try { book = P.__ewProbeBook(); } catch (e) { book = null; }
    if (!book) return false;
    var answer = function (out, err) { try { P.__ewProbeAnswer("collect", APP_VERSION, out, err || ""); } catch (e) {} };
    S.user = String((book.user && book.user.name) || "Money check"); S.role = "admin";
    try { document.title = "Money check"; } catch (e) {}
    bigPreload([CAT_KEY]).then(function () {
      try {
        S.data = null;
        mergeBook(book, KEEP_FAST); mergeBook(book, KEEP_REST);
        mergeBook(book, ["payments", "challans", "returns", "clients", "installs", "visits", "discounts", "brandmap", "audit"]);
        catFromShelf(); bust();
        answer((function () { var o = {}; rows(); (_rowsAll || []).forEach(function (r) { o[dkey(r.name)] = [r.name, Math.round(r.due), Math.round(r.svcDue || 0)]; }); return o; })());
      } catch (e) { answer(null, String((e && e.message) || e)); }
    }).catch(function (e) { answer(null, "could not start: " + String((e && e.message) || e)); });
    return true;
  }
  /* ===== BACK WHERE YOU WERE (13 Oct 2026) - his words: "if at this stage a mid of quote i refresh app
     to newer version, its go to some other page, it must stay on this page only ... do it for all apps".
     pagehide keeps the screen (state in S, typed boxes, scroll) in this tab's sessionStorage; the first
     paint with the same user and a book on screen puts it back. A paint that throws undoes it. ===== */
  (function () {
    var KEY = "ew_resume_" + String(location.pathname || "").replace(/[^a-z0-9]/gi, "");
    var SKIP = { data: 1, pin: 1, tok: 1, user: 1, role: 1, pinSet: 1, busy: 1, pending: 1, syncAt: 1, fastAt: 1, restAt: 1, pullAt: 1, catAt: 1 };
    function save() {
      try {
        if (!S || !S.user) return;
        var r = { at: Date.now(), user: S.user, y: 0, st: {}, f: {} }, room = 400000;
        try { r.y = window.scrollY || 0; } catch (e) { }
        Object.keys(S).forEach(function (k) {
          if (SKIP[k]) return;
          var v = S[k]; if (v === undefined || typeof v === "function") return;
          try { var j = JSON.stringify(v); if (j && j.length < room) { r.st[k] = v; room -= j.length; } } catch (e) { }
        });
        if (typeof r.st.sheet === "string" && /type="password"/.test(r.st.sheet)) delete r.st.sheet;
        [].forEach.call(document.querySelectorAll("input[id],select[id],textarea[id]"), function (e) {
          var ty = String(e.type || "").toLowerCase();
          if (ty === "password" || ty === "file" || ty === "checkbox" || ty === "radio" || e.value === "" || e.value == null) return;
          r.f[e.id] = e.value;
        });
        sessionStorage.setItem(KEY, JSON.stringify(r));
      } catch (e) { }
    }
    window.addEventListener("pagehide", save);
    var tried = false;
    function ready() {
      if (!S || !S.user || !S.data) return false;
      for (var k in S.data) if (Array.isArray(S.data[k]) && S.data[k].length) return true;
      return false;
    }
    var base = render;
    render = function () {
      if (!tried && ready()) {
        tried = true;
        var r = null;
        try { r = JSON.parse(sessionStorage.getItem(KEY) || "null"); sessionStorage.removeItem(KEY); } catch (e) { r = null; }
        if (r && r.st && r.user === S.user && Date.now() - (Number(r.at) || 0) < 2 * 3600 * 1000) {
          var undo = {};
          Object.keys(r.st).forEach(function (k) { if (!SKIP[k]) { undo[k] = S[k]; S[k] = r.st[k]; } });
          try { base.apply(this, arguments); }
          catch (e) { Object.keys(undo).forEach(function (k) { S[k] = undo[k]; }); return base.apply(this, arguments); }
          var put = function () {
            Object.keys(r.f || {}).forEach(function (id) { var e = document.getElementById(id); if (e && (e.value === "" || e.value == null)) e.value = r.f[id]; });
            if (r.y) { try { window.scrollTo(0, r.y); } catch (e) { } }
          };
          setTimeout(put, 30); setTimeout(put, 800);
          return;
        }
      }
      return base.apply(this, arguments);
    };
  })();

  (function boot() {
    var sess = null;
    try { sess = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
    if (ewProbe()) return;   /* the CRM's money check, see above */
    if (!(sess && sess.user && (sess.pin || sess.tok))) {
      renderLogin();
      regSW();
      return;
    }

    S.user = sess.user; S.pin = sess.pin || ""; S.tok = sess.tok || ""; S.role = sess.role || "";   /* B9 */
    S.tab = "today";
    /* v1.8 - the offline copy lives in the big store now, so it has to be in memory before
       the warm paint or the app would open on a holding screen instead of the book. A local
       read of tens of milliseconds against a boot that already waits on two network calls,
       and it gives up after 2.5s rather than ever blocking. */
    /* v1.10.0 - JRN_KEY IS IN THIS LIST OR THE JOURNAL DOES NOT EXIST. bigSet removes the
       localStorage copy the moment IndexedDB has it, and bigGet only reads IndexedDB through
       the _big mirror - so a journal key left out of the preload reads back EMPTY on exactly
       the boot it was written for. */
    /* v1.25.0 - AND THE CATALOGUE, WHICH THIS APP DOES NOT PAY FOR.
       All eight apps share one origin and one IndexedDB, and the CRM has been writing the
       master catalogue into ew_team_catalog for weeks. Reading it here costs one index lookup
       and no network at all. Where it is genuinely absent - a phone that has only ever opened
       this app - retPriceReady() fetches it ONCE, in the background, and only if a return
       actually has a line that needs it. Nothing waits on it and no screen is blocked. */
    bigPreload([SNAP + "_" + S.user, JRN_KEY, CAT_KEY]).then(function () { catFromShelf(); _pcbCache = null; verWatch(); boot2(sess); });
  })();

  function boot2(sess) {
    var snap = snapLoad();
    if (snap) { S.data = snap; applyJournal(); S.busy = true; render(); }
    else openingScreen();

    var authP = api("teamAuth", { ua: navigator.userAgent });
    /* v1.19.0 - the first open of the morning is the slowest moment of this app's day,
       because Apps Script wakes cold. Asking for the money half first means the dues screen
       is right while the call notes are still arriving. */
    var dataP = getBook(KEEP_FAST);
    var refused = false;

    authP.then(function (r) {
      if (!r || !r.ok) {
        /* v1.49.0 - a reply that is not the server's own "no" is a failed call, not a refusal */
        /* 1.67.0 - only the server's SIGN-IN refusals sign a man out. "not allowed" and "blocked"
           were wide enough to match a business rule ("...not allowed from Received") or a
           blocked number, and a man lost his saved book over a message that was not about him.
           Wrong name or PIN, locked, a dead token, "sign in again", or taken off the team. */
        if (!(r && r.ok === false && /wrong name or pin|not signed in|locked for|sign in again|token|removed from the team|not on the team/i.test(String(r.error || "")))) {
          try { toast("The office did not answer the sign-in check - working from what this phone holds. Try again in a minute."); } catch (e) {}
          return;
        }
        refused = true; S.pin = ""; forgetBook();
        try { localStorage.removeItem(STORE); } catch (e) {}
        renderLogin("Sign in again.");
        return;
      }
      S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
      try { beatStart(); } catch (e) {}   /* v1.20.0 - from here it asks on its own */
      if (!roleAny(["admin","accounts","sales"])) {
        refused = true; S.pin = ""; forgetBook();
        renderLogin("This app is not open to you.");
        return;
      }
      try { credPut(STORE, { user: S.user, pin: sess.pin, role: S.role }); } catch (e) {}
      if (S.data) render();
    }).catch(function () { /* handled with the data below */ });

    dataP.then(function (r) {
      if (refused) return;
      if (usableBook(r)) {
        beatMark(r && r.stamp);            /* v1.20.0 - the stamp AS AT this book */
      mergeBook(r, KEEP_FAST); S.fastAt = Date.now(); bust();
        applyJournal(); snapSave(); render();
        if (bookHas(r, KEEP_REST)) {             /* the server sent everything - see bookHas */
          mergeBook(r, KEEP_REST); dropProofThumbs(); restTook(); bust();
          jrnReconcile(); applyJournal();
          S.syncAt = Date.now(); S.busy = false; snapSave(); render(); flushSoon();
          return;
        }
      }
      else if (!S.data) { S.busy = false;
        openingScreen("Could not read the book. " +
          (BOOKSAY ? BOOKSAY + " \u2014 read this out to the office." : "Try again.")); return; }
      else render();
      /* part two, behind the screen he is already reading */
      return getBook(KEEP_REST).then(function (r2) {
        if (refused) return;
        S.busy = false;
        if (!(r2 && Array.isArray(r2.audit))) { render(); return; }
        mergeBook(r2, KEEP_REST); dropProofThumbs(); restTook(); bust();
        jrnReconcile(); applyJournal();      /* reconcile after both halves - see pull() */
        S.syncAt = Date.now(); snapSave(); render(); flushSoon();
      });
    }).catch(function () {
      if (refused) return;
      S.busy = false;
      if (S.data) { render(); toast("No signal — showing what was last pulled onto this phone."); }
      else openingScreen(jrnCount()
        ? jrnCount() + (jrnCount() === 1 ? " record is" : " records are") + " held safe on this phone and go onto the sheet when there is signal. The book itself has never been pulled onto this phone."
        : "No signal, and nothing saved on this phone yet.");
    });

    /* v1.10.0 - the journal starts working the moment the app opens, whether or not the book
       came down. A payment taken yesterday in a basement goes up on today's first open. */
    startFlushTicker();
    regSW();
  }


})();
</script>
<script>
/* ---------------------------------------------------------------------------
   THE ICON NAG — one time, on the phone that needs it.
   The three apps used to share one Energy World leaf, so a man tapped the wrong
   one. They have their own pictures and names now — but a phone copies the icon
   into the home-screen shortcut on the day it is added and never looks again.
   Apple gives no way to change that from here; it has to be removed and re-added
   once. So the app tells the person holding it, rather than the owner having to
   tell five people. Shown only to someone who OPENED IT FROM THE HOME SCREEN —
   that is exactly the person with the old icon — once, and never again.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";
  var KEY = "ew_icon_nag_v1";
  try { if (localStorage.getItem(KEY)) return; } catch (e) { return; }

  var standalone = false;
  try {
    standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
                 window.navigator.standalone === true;
  } catch (e) {}
  if (!standalone) return;              /* in a browser tab there is no icon to fix */

  function show() {
    if (document.getElementById("ew_nag")) return;
    var d = document.createElement("div");
    d.id = "ew_nag";
    d.setAttribute("style",
      "position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 68px);z-index:9999;" +
      "background:#fff7ed;border:1px solid #fdba74;border-radius:13px;padding:13px 15px;" +
      "box-shadow:0 8px 24px rgba(15,23,42,.18);font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" +
      "color:#7c2d12;max-width:700px;margin:0 auto");
    d.innerHTML =
      '<div style="font-weight:800;margin-bottom:4px">This app has its own icon now</div>' +
      '<div>The picture on your home screen is still the old one — a phone keeps the icon from the day ' +
      'you added it. To fix it once: <b>press and hold the icon &rarr; Remove from Home Screen</b>, then open ' +
      '<b>energyworld apps</b> in the browser and <b>Add to Home Screen</b> again. You stay signed in.</div>' +
      '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">' +
        '<button id="ew_nag_open" style="appearance:none;border:1px solid #b45309;background:#b45309;color:#fff;' +
          'border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer">Open the apps page</button>' +
        '<button id="ew_nag_ok" style="appearance:none;border:1px solid #fdba74;background:#fff;color:#7c2d12;' +
          'border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer">Got it</button>' +
      '</div>';
    document.body.appendChild(d);
    var done = function () {
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      if (d.parentNode) d.parentNode.removeChild(d);
    };
    document.getElementById("ew_nag_ok").addEventListener("click", done);
    document.getElementById("ew_nag_open").addEventListener("click", function () {
      try { window.open("../apps/", "_blank"); } catch (e) {}
      done();
    });
  }
  /* after the app has painted, so it is never the first thing on a cold start */
  setTimeout(show, 2500);
})();
</script>
