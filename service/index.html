<!-- Nothing third-party is loaded here. An engineer opens this in a kitchen with one
     bar of signal; it has to start from the copy on the phone and ask for nothing. -->
<script>
(function () {
  "use strict";
/* ==========================================================================
   ENERGY WORLD - SERVICE
   The app the engineer carries. The CRM has the whole service desk in it -
   installations, AMC contracts, the spares price list, the daily due list -
   and none of that is any use to a man standing in somebody's kitchen with a
   spanner. This is that half, and nothing else.

   IT IS THE SAME BOOK. Same name and PIN as the Team CRM, same server, the same
   ServiceInstalls and ServiceVisits sheets in exactly the same row shape. A visit
   recorded here is indistinguishable from one recorded in the CRM, and the CRM is
   not changed in any way by this app existing. No new table was added: the tabs
   this app writes to have been in the backend all along, waiting for a screen.

   WHAT AN ENGINEER SEES. His own installations and his own visits, and nothing
   else - that scoping is done on the SERVER, in teamFilterAll_, so another
   engineer's work never reaches this phone at all.

   TWO KINDS OF WORK, because the owner named two:
     A SERVICE VISIT is against an installation - a purifier, an RO, a softener.
       It has a cycle, it may be under AMC, and finishing it moves the next due
       date forward. This is the work the daily 8am reminder is about.
     A LABOUR JOB has no machine behind it. Plumbing work at a client's site,
       billed for the labour and whatever material went in. Same visit row, no
       installId, and never under AMC.

   MONEY, AND WHEN NOT TO ASK FOR IT. The owner's rule: "AMC is prepaid, spot jobs
   are paid on site." So this app works out whether there is anything to collect
   BEFORE it offers a money screen. A routine service on a live AMC says so and
   asks for nothing. Everything else asks once, plainly, and what he takes is
   written into the same write-journal the Payment app uses - a receipt taken in a
   basement with no signal is kept on the phone and goes up by itself.

   Nothing here deletes anything, ever. A visit is a row added.
   ========================================================================== */

  var APP_VERSION = "1.4.1";
  var GAS = "https://script.google.com/macros/s/AKfycbzVkPHWyPq-w8RFD_HdG0vCjmrfQvEUpcq_hhF9eDGa0ZbZ3rIx7N37an2DQRGmsxPK/exec";
  var STORE = "ew_service_session";

  var SNAP  = "ew_service_snap";
  var BIO_KEY = "ew_service_bio";
  var CRM_URL = "../team/";
  var S = { user:"", pin:"", role:"", data:null, tab:"today", q:"", sheet:null, busy:false,
            syncAt:0, fastAt:0, restAt:0, job:null, vis:null, pick:null, open:"", accOpen:"" };

  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var _toastT = null;
  var _bfIds = ["ew_nag", "ew_sync_banner"];
  var _bfWatch = false;
  var IDB_NAME = "ew_store", IDB_STORE = "kv", _idbP = null;
  var _big = {};
  var API_TIMEOUT = 25000;
  var _wire = [];
  /* The per-action deadlines, the same table and the same reasoning as the other apps: these
     calls are not alike, and a save that is abandoned turns into a man re-typing work the
     server has already written. */
  var API_MS_BY_ACTION = {
    teamSave: 60000,
    teamAuth: 45000,
    teamGet: 60000, catalog: 60000, pdfHost: 240000, tgSend: 60000,
    search: 45000, historicChallan: 45000,
    challanMove: 60000
  };
  var BEAT_EVERY = 30000, _beatSeen = "", _beatOn = null, _beatBusy = false;
  /* ---- THE STAMP BEATS THE CLOCK (20 Aug 2026) ----
     "Serious issue - Challan made at godown, taking very long to sync all device, hence
     approval delaying."

     The heartbeat shipped on 19 August and it worked: the godown writes a challan, the
     server's write stamp moves, and every other phone notices inside thirty seconds. Then it
     pulled the FAST half of the book and returned - and in the Challan app `challans` is not
     in the fast half. It is in KEEP_REST, behind REST_EVERY, which is five minutes.

     So an accounts phone could sit open, awake, and correctly informed that something had
     changed, and still not show the new challan for five and a half minutes. No amount of
     waiting shortened it and the refresh arrow was the only way through, because the app had
     decided not to ask. That is the approval delay. It was never slowness - measured, the
     pull is 3.7 s for 383 KB.

     WHY THE FIVE MINUTES STAYS. It is not a mistake. The rest half carries `audit` - every
     action anybody has ever taken - and re-fetching that on every glance is what a phone on
     4G in a basement godown pays for. The throttle earns its place when nothing has changed.

     WHAT CHANGES. It now yields to the stamp. The stamp only moves when somebody WROTE
     something, so if the stamp this phone is holding is not the stamp it last took the
     history at, the history is stale by definition and the clock has no opinion worth
     hearing. When nothing has been written the two are equal and not one extra byte moves.

     AND IT FIXES THE COME-BACK-TO-THE-APP PATH FOR FREE. The fast half calls beatMark() with
     the server's stamp as it lands, and that happens BEFORE restStale() is consulted. So
     returning to the app after two minutes now brings the challan written one minute ago -
     which is what he asked for in v1.28.0 when he had the 60-second guard taken out, and
     which he never got, because challans live in the half that guard never governed. */
  var _restStamp = "";
  function restTook() { S.restAt = Date.now(); _restStamp = _beatSeen; }
  var JRN_KEY = "ew_service_journal_v1";
  var _jrnSeq = 0, _jrnTold = false, _flushing = false, _flushDog = null;
  var _flushFails = 0, _flushSkip = 0, _flushTick = null;
  var BOOKSAY = "";
  var CRASH_KEY = "ew_service_crash_v1";
  var _pulling = null;
  var REST_EVERY = 300000;

  /* ============ DUE, OVERDUE, AND NOT KNOWN ============
     Three states, not two. A machine with no nextService date is not "due today" and it
     is not "fine" either - it is a machine nobody has set a cycle for, and saying so is
     the only honest answer. The app must not assert what it cannot know. */
  function dueDays(ins) {
    var d = String((ins && ins.nextService) || "").slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;         /* not known */
    var t = new Date(today() + "T00:00:00").getTime();
    var n = new Date(d + "T00:00:00").getTime();
    if (!isFinite(n)) return null;
    return Math.round((n - t) / 86400000);                   /* negative = overdue */
  }
  function dueBand(ins) {
    var n = dueDays(ins);
    if (n === null) return "unset";
    if (n < 0) return "over";
    if (n <= 7) return "soon";
    return "later";
  }
  function dueSay(ins) {
    var n = dueDays(ins);
    if (n === null) return "no service date set";
    if (n < -1) return Math.abs(n) + " days overdue";

    if (n === 0) return "due today";
    if (n === 1) return "due tomorrow";
    return "due in " + n + " days";

  /* ============ IS THIS MACHINE UNDER AMC, TODAY? ============
     An amcType with no end date is treated as live: the office set a contract and did not
     record when it finishes, and refusing to honour it at a customer's door is the wrong
     way round. An end date in the past is expired, and says so. */
  function amcState(ins) {
    if (!ins) return { live: false, say: "" };
    var t = String(ins.amcType || "").trim();
    if (!t || /^none$/i.test(t)) return { live: false, say: "No AMC" };
    var end = String(ins.amcEnd || "").slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(end)) return { live: true, say: t + " (no end date recorded)" };
    if (end < today()) return { live: false, say: t + " expired " + dstr(end) };
    var days = Math.round((new Date(end + "T00:00:00").getTime() - new Date(today() + "T00:00:00").getTime()) / 86400000);
    return { live: true, say: t + " to " + dstr(end), endsIn: days };
  }

  /* v1.4.0 - KEPT, AND MADE TO DELEGATE. This was the whole money rule until today: a
     Service or a Salt refill on a live contract was free and everything else was charged. It
     is left standing rather than deleted so that anything still calling it gets the NEW
     answer rather than the old one - a stale second opinion about money is exactly the kind
     of thing that is found six weeks later in a customer's ledger. It now means what it has
     always been read to mean: "is the visit itself free". */
  function amcCovers(ins, type) {

  /* ============================================================================
     THE SERVICE ACCOUNT.  (v1.4.0, 20 August 2026)

     Until today this app could tell a man what to do and let him record what he did, and then
     the money simply stopped being anybody's business. Every rupee was on a visit row and no
     screen ever added them up, so "how much is outstanding on service" could only be answered

     the old rule, under which an AMC-covered visit was stored with its gross total and

  function sheetJob(ins) {
    if (!ins) return "";
    var a = amcState(ins), band = dueBand(ins), hist = visitsFor(ins.id);
    var h = '<h2>' + esc(ins.client || "(no name)") + '</h2>' +
      '<div class="muted">' + esc([ins.product, ins.model].filter(Boolean).join(" · ") || "machine not named") +

      h += '<div class="row gap">' +

        '<a class="btn gry grow" target="_blank" rel="noopener" href="https://wa.me/' + esc(n) + '">WhatsApp</a>' +

        'That is not the same as never serviced — work done before this app existed is not here.</div>';

    h += '<div class="acts" style="margin-top:14px"><button class="btn gry grow" data-act="close">Close</button></div>';
    return h;

  function kv(k, v) { return '<div class="kvr"><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'; }

  /* ================= RECORDING WHAT WAS DONE =================
     The one form this app exists for. It is deliberately in this order: what kind of work,
     what went into it, what it comes to, and only then - if there is anything to take -
     what was taken. */
  function sheetVisit(v) {
    var ins = v.installId ? installById(v.installId) : null;
    var pTot = partsTotal(v.parts);
    var gross = num(v.visitCharge) + num(v.saltAmt) + pTot;
    var cover = amcCover(ins, v.type, v.date);
    var due = (cover.visit ? 0 : num(v.visitCharge)) +
              (cover.salt  ? 0 : num(v.saltAmt)) +
              (cover.parts ? 0 : pTot);
    var covered = due <= 0 && gross > 0;
    var total = due;

    var h = '<h2>' + (ins ? esc(ins.client || "") : 'Labour job') + '</h2>' +
      '<div class="muted">' + (ins
        ? esc([ins.product, ins.model].filter(Boolean).join(" · ") || "machine not named")
        : 'Plumbing work with no machine behind it') + '</div>';

    /* --- what kind of work --- */
    h += '<label>What was done</label><div class="chips">' +
      JOB_TYPES.filter(function (t) { return ins ? t !== "Labour job" : t === "Labour job"; })
        .map(function (t) {
          return '<button class="chip' + (v.type === t ? ' on' : '') + '" data-act="v-type" data-t="' + esc(t) + '">' +
            esc(t) + '</button>';
        }).join("") + '</div>';

    /* --- who it is for, when there is no machine --- */
    if (!ins) {
      h += '<label>Customer</label>' + clientPicker(v.client) +
        '<label>Area</label><input id="v_area" value="' + esc(v.area || "") + '" placeholder="Which area"/>';
    }

    h += '<label>Date</label><input id="v_date" type="date" value="' + esc(v.date || today()) + '"/>';

    /* --- salt, only where salt is a thing --- */
    if (v.type === "Salt refill") {
      h += '<div class="grid2">' +
        '<div><label>Salt bags</label><input id="v_bags" inputmode="numeric" value="' + esc(v.saltBags || "") + '"/></div>' +
        '<div><label>Salt amount</label><input id="v_saltamt" inputmode="numeric" value="' + esc(v.saltAmt || "") + '"/></div>' +
        '</div>';
    }

    /* --- parts --- */
    h += '<label>Parts used</label>';
    h += (v.parts && v.parts.length)
      ? '<div class="parts">' + v.parts.map(function (p, i) {
          return '<div class="prow"><div class="grow"><b>' + esc(p.name) + '</b>' +
            '<div class="meta">' + esc(p.code || "") + ' &middot; ' + esc(money9(p.price)) + ' each</div></div>' +
            '<input class="qty" data-act="v-qty" data-i="' + i + '" inputmode="decimal" value="' + esc(p.qty) + '"/>' +
            '<div class="amt">' + esc(money9(num(p.qty) * num(p.price))) + '</div>' +
            '<button class="x" data-act="v-drop" data-i="' + i + '">&times;</button></div>';
        }).join("") + '</div>'
      : '<div class="empty sm">Nothing yet.</div>';
    h += '<div class="row" style="margin-top:6px">' +
      '<button class="btn sm gry" data-act="v-parts">' + (spares().length ? '+ Add a part' : 'No spares list on this phone') + '</button>' +
      '<div class="grow"></div>' +
      (pTot ? '<div class="amt">' + esc(money9(pTot)) + '</div>' : '') + '</div>';

    /* --- the charge --- */
    h += '<label>Visit / labour charge</label>' +
      '<input id="v_charge" inputmode="numeric" value="' + esc(v.visitCharge || "") + '" placeholder="0"/>';

    /* ============ THE BILL, LINE BY LINE (v1.4.0) ============
       "salt, service charge, collected or pending". Three amounts go into a visit and the
       contract may forgive any of them, so the screen shows each one and says which. An
       engineer standing in front of a customer should be able to read this out. */
    {
      var line = function (label, amt, free) {
        if (!amt) return "";
        return '<div class="bill' + (free ? ' free' : '') + '"><span>' + esc(label) + '</span>' +
          '<b>' + esc(money9(amt)) + '</b>' +
          '<i>' + (free ? 'covered by ' + esc(cover.kind) : 'to collect') + '</i></div>';
      };
      h += '<div class="billbox">' +
        line("Visit / labour charge", num(v.visitCharge), cover.visit) +
        line("Salt" + (num(v.saltBags) ? " · " + num(v.saltBags) + " bag" + (num(v.saltBags) === 1 ? "" : "s") : ""),
             num(v.saltAmt), cover.salt) +
        line("Spares fitted", pTot, cover.parts) +
        '<div class="bill tot"><span>To collect</span><b>' + esc(money9(due)) + '</b>' +
        '<i>' + (gross > due ? esc(money9(gross - due)) + ' covered' : '&nbsp;') + '</i></div>' +
        '</div>';
    }

    /* ============ THE MONEY QUESTION, ASKED ONLY WHEN THERE IS ONE ============
       The owner's rule is that AMC is prepaid. So on a live contract this screen says so
       and asks for nothing - an engineer must never be put in the position of asking a
       customer for money he has already paid. */
    if (covered) {
      h += '<div class="amcbox"><b>Under AMC — nothing to collect.</b><br>' +
        esc(cover.kind) + ', ' + esc(amcState(ins).say) + '. ' +
        esc(money9(gross)) + ' of work, already paid for.</div>';
    } else if (total > 0) {
      h += '<label>Taken now</label>' +
        '<input id="v_got" inputmode="numeric" value="' + esc(v.collected == null ? "" : v.collected) + '" placeholder="0"/>' +
        '<div class="meta">Leave it blank if the customer is paying the office later. ' +
        'Whatever you type here is money you are carrying.</div>';
      var bal = total - num(v.collected);
      if (v.collected !== "" && v.collected != null && bal > 0.5)
        h += '<div class="note warn-t">' + esc(money9(bal)) + ' still owing after this.</div>';
    }

    h += '<label>Note</label><textarea id="v_note" rows="2" placeholder="What you found, what you did">' +
      esc(v.notes || "") + '</textarea>';

    h += '<div class="acts"><button class="btn gry" data-act="close">Cancel</button>' +
      '<button class="btn grow" data-act="v-save">Save the visit</button></div>';
    return h;
  }

  /* A customer for a labour job. The engineer types, the list narrows - the same shape the
     other apps use, because a man should not learn two ways to pick a name. */
  function clientPicker(cur) {
    var list = clients().slice().sort(function (a, b) { return alpha(a.name, b.name); });
    return '<select id="v_client"><option value="">&mdash; pick the customer &mdash;</option>' +
      list.map(function (c) {
        return '<option value="' + esc(c.name) + '"' + (lower(c.name) === lower(cur) ? ' selected' : '') + '>' +
          esc(c.name) + (c.location ? ' — ' + esc(c.location) : '') + '</option>';
      }).join("") + '</select>' +
      '<div class="meta">Not on the list? Type the name in the note and the office will add him.</div>';
  }

  /* ---- the spares picker ---- */
  function sheetParts() {
    var q = lower(S.q);
    var list = spares().filter(function (s) {
      if (!q) return true;
      return lower([s.code, s.name, s.category].join(" ")).indexOf(q) >= 0;
    });
    var h = '<h2>Add a part</h2>' + searchBox("Search the spares list") +
      '<div class="meta pad">' + list.length + ' of ' + spares().length + '</div>';
    h += list.length ? list.slice(0, 200).map(function (s) {
      return '<div class="card sm" data-act="v-pick" data-code="' + esc(s.code) + '">' +
        '<div class="row"><div class="grow"><div class="ttl">' + esc(s.name) + '</div>' +
        '<div class="meta">' + esc(s.code || "") + (s.category ? ' &middot; ' + esc(s.category) : '') + '</div></div>' +
        '<div class="right"><div class="amt">' + esc(money9(s.price)) + '</div></div></div></div>';
    }).join("") : '<div class="empty">Nothing matches that.</div>';
    h += '<div class="acts"><button class="btn gry grow" data-act="v-back">Back</button></div>';
    return h;

  /* ================= SAVING A VISIT =================
     Two rows, in a deliberate order.

       1. THE VISIT. What was done, what it cost, what was taken. This is the record and
          it goes through the write-journal - so a visit finished in a basement with no
          signal is kept on the phone, shown on the screen as held, and goes up by itself
          when the signal returns. The Payment app learned this the hard way and this app
          starts with it.

       2. THE MACHINE. lastService moves to today and nextService moves forward by the
          cycle. This is a SECOND row and it is written second on purpose: if the visit
          lands and the machine update does not, the work is recorded and the due date is
          merely stale, which the office can see and fix. The other way round would be a
          machine that says it was serviced with no evidence that it was. */
  function visitRowFrom(v, ins) {
    var pTot = partsTotal(v.parts);
    /* v1.4.0 - `total` is now WHAT WAS CHARGEABLE, after the contract has had its say. The
       gross value of the work is not lost: visitCharge, saltAmt and partsAmt are each stored
       beside it, and visitTotal() adds them back whenever the office wants to know what an
       AMC actually delivered. Storing the chargeable figure is what makes `balance` mean what
       it says, and what lets the account screen add a column without re-deciding the rule. */
    var cover = amcCover(ins, v.type, v.date);
    var due = (cover.visit ? 0 : num(v.visitCharge)) +
              (cover.salt  ? 0 : num(v.saltAmt)) +
              (cover.parts ? 0 : pTot);
    /* nothing chargeable means nothing taken - the form does not even ask, so a stale value
       left in the object must not become a rupee the customer never handed over */
    var got = due > 0 ? num(v.collected) : 0;
    var total = due;
    return {
      id: v.id || mintId("SV"),
      createdAt: v.createdAt || new Date().toISOString(),
      createdBy: S.user,
      installId: ins ? String(ins.id) : "",
      client: ins ? String(ins.client || "") : String(v.client || ""),
      area: ins ? String(ins.area || "") : String(v.area || ""),
      date: String(v.date || today()).slice(0, 10),
      engineer: S.user,
      type: String(v.type || ""),
      visitCharge: num(v.visitCharge),
      saltBags: num(v.saltBags),
      saltAmt: num(v.saltAmt),
      /* the parts as words, because the sheet column is a word column and the office reads
         it. The arithmetic is kept beside it as a number so nobody has to re-add it. */
      partsUsed: (v.parts || []).map(function (p) {
        return p.name + (num(p.qty) === 1 ? "" : " x" + num(p.qty));
      }).join(", "),
      partsAmt: pTot,
      total: total,
      collected: got,
      balance: Math.max(0, total - got),
      notes: String(v.notes || ""),
      updatedAt: new Date().toISOString()
    };
  }

  /* Move the machine on. Only ever forward, and only when a cycle is actually known -
     inventing a next date from a cycle nobody set would be the app asserting something
     it cannot know. */
  function installAfter(ins, row) {
    if (!ins) return null;
    /* v1.4.0 - AN EXPLICIT LIST, AND A BUG THIS LINE CARRIED FOR HALF AN HOUR.
       It used to read `!AMC_COVERS[row.type]`, borrowing the MONEY list to answer a question
       that has nothing to do with money: does this kind of work move the machine's service
       clock forward. When AMC_COVERS was replaced by the new coverage rule, this reference was
       left behind pointing at a name that no longer existed - a ReferenceError on every visit
       save that touched a machine.

       t_undefined_names.js did NOT catch it. The checker reports other undeclared names in
       this very function, so the hole is real and is not understood. What caught it was
       reading the file for something else entirely, and what proves it fixed is t_service_run.js
       CALLING this function - which is that test file's own thesis: reading proves what code
       says, only running proves what it does.

       Everything except a labour job touches the machine. A labour job has no machine at all. */
    if (!TOUCHES_MACHINE[String(row.type || "")]) return null;
    var cyc = num(ins.cycleDays);
    var out = { };
    Object.keys(ins).forEach(function (k) { out[k] = ins[k]; });
    out.lastService = row.date;
    if (cyc > 0) {
      var d = new Date(row.date + "T00:00:00");
      d.setDate(d.getDate() + cyc);
      out.nextService = d.toISOString().slice(0, 10);
    }
    out.updatedAt = new Date().toISOString();
    return out;
  }

  function saveVisit() {
    var v = S.vis; if (!v) return;
    var ins = v.installId ? installById(v.installId) : null;

    /* read the form back before anything else - a repaint must never be able to take a
       half-typed note away, and everything below depends on these being current */
    v.date = val("v_date") || today();
    v.visitCharge = val("v_charge");
    v.saltBags = val("v_bags");
    v.saltAmt = val("v_saltamt");
    v.notes = (el("v_note") ? String(el("v_note").value || "") : "").trim();
    v.collected = val("v_got");
    if (!ins) { v.client = val("v_client"); v.area = val("v_area"); }

    if (!v.type) { toast("Say what was done first."); return; }
    if (!ins && !v.client) { toast("Pick the customer this job was for."); return; }

    var row = visitRowFrom(v, ins);
    if (!row.total && !row.notes && !row.partsUsed) {
      toast("Nothing to record — add a charge, a part, or a note about what you did.");
      return;
    }

    S.sheet = null; S.vis = null;
    toast("Visit saved" + (row.collected ? " — " + money9(row.collected) + " on you." : "."));
    render();

    saveRow("visits", row).then(function () {
      var upd = installAfter(ins, row);
      if (!upd) return null;
      /* keep the copy on this phone in step at once, so the due list stops nagging about a
         machine he has just serviced even before the server answers */
      var live = installById(ins.id);
      if (live) { live.lastService = upd.lastService; if (upd.nextService) live.nextService = upd.nextService; }
      bust(); renderBg();
      return saveRow("installs", upd);
    }).catch(function () { /* the journal has it; jrnPaint says so on screen */ });
  }

  function bust() { _bookCl = null; }


  /* ================= THE SHELL ================= */
  var NAV = [
    { k: "today",   t: "Today" },
    { k: "jobs",    t: "Machines" },
    { k: "labour",  t: "Labour job" },
    { k: "history", t: "My work" },
    { k: "account", t: "Account" }
  ];
  function navBtn(n) {
    return '<button class="nav' + (S.tab === n.k ? ' on' : '') + '" data-act="tab" data-k="' + esc(n.k) + '">' +
      esc(n.t) + '</button>';
  }
  function bodyHtml() {
    if (S.sheet) return '<div class="sheet">' + S.sheet + '</div>';
    var v = { today: viewToday, jobs: viewJobs, history: viewHistory, account: viewAccount }[S.tab];
    return v ? v() : viewToday();
  }
  function render() {
    var r = el("root"); if (!r) return;
    r.innerHTML = header() + jrnPaint() + newVerBar() +
      '<div class="body">' + bodyHtml() + '</div>' +
      (S.sheet ? '' : '<div class="tabs">' + NAV.map(navBtn).join("") + '</div>');
    wireInputs(); painted();
  }
  /* A background repaint. If a form is open it defers - the same rule the CRM learned in
     v6.9.144, because typed values live in the DOM until they are read back. */
  function renderBg() { if (S.sheet) return; render(); }

  function wireInputs() {
    var q = el("q");
    if (q) {
      q.addEventListener("input", function () {
        S.q = q.value;
        var body = el("root").querySelector(".body");
        if (body) { body.innerHTML = bodyHtml(); wireInputs(); }
      });
      if (S.q) { q.focus(); try { q.setSelectionRange(q.value.length, q.value.length); } catch (e) {} }
    }
  }

  /* ================= WHAT A TAP MEANS ================= */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id") || "";

    if (act === "tab") {
      var k = t.getAttribute("data-k");
      /* "Labour job" is a verb, not a place. Tapping it opens the form straight away rather
         than showing a screen whose only content is a button to open the form. */
      if (k === "labour") {
        S.vis = { installId: "", type: "Labour job", date: today(), parts: [], collected: "", client: "", area: "" };
        S.sheet = sheetVisit(S.vis); render(); return;
      }
      S.tab = k; S.q = ""; render(); return;
    }
    if (act === "acc-open") {
      var ak = t.getAttribute("data-k") || "";
      S.accOpen = (S.accOpen === ak) ? "" : ak;
      render(); return;
    }
    if (act === "close")   { S.sheet = null; S.vis = null; S.q = ""; render(); return; }
    if (act === "refresh") { pull(true); return; }
    if (act === "menu")    { S.sheet = sheetMenu(); render(); return; }
    if (act === "signout") { signOut(); return; }

    if (act === "job") {
      var ins = installById(id); if (!ins) return;
      S.job = ins.id; S.sheet = sheetJob(ins); render(); return;
    }
    if (act === "do-visit") {
      var i2 = installById(id); if (!i2) return;
      S.vis = { installId: i2.id, type: "Service", date: today(), parts: [], collected: "" };
      S.sheet = sheetVisit(S.vis); render(); return;
    }
    if (act === "v-type") {
      if (!S.vis) return;
      S.vis.type = t.getAttribute("data-t");
      readVisitForm();
      S.sheet = sheetVisit(S.vis); render(); return;
    }
    if (act === "v-parts") {
      if (!S.vis || !spares().length) { toast("The spares list has not reached this phone yet — pull the book."); return; }
      readVisitForm(); S.q = ""; S.sheet = sheetParts(); render(); return;
    }
    if (act === "v-back")  { if (S.vis) { S.q = ""; S.sheet = sheetVisit(S.vis); render(); } return; }
    if (act === "v-pick") {
      var sp = spareByCode(t.getAttribute("data-code")); if (!sp || !S.vis) return;
      var rows = S.vis.parts || (S.vis.parts = []);
      var hit = rows.filter(function (r) { return lower(r.code) === lower(sp.code); })[0];
      if (hit) hit.qty = num(hit.qty) + 1;
      else rows.push({ code: sp.code, name: sp.name, price: num(sp.price), qty: 1 });
      S.q = ""; S.sheet = sheetVisit(S.vis); render(); return;
    }
    if (act === "v-drop") {
      if (!S.vis) return; readVisitForm();
      S.vis.parts.splice(num(t.getAttribute("data-i")), 1);
      S.sheet = sheetVisit(S.vis); render(); return;
    }
    if (act === "v-save")  { saveVisit(); return; }

    if (act === "labour-new") {
      S.vis = { installId: "", type: "Labour job", date: today(), parts: [], collected: "", client: "", area: "" };
      S.sheet = sheetVisit(S.vis); render(); return;
    }
  });

  /* a quantity typed into a part row, kept without tearing the form down */
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute("data-act") === "v-qty" && S.vis) {
      var i = num(t.getAttribute("data-i"));
      if (S.vis.parts[i]) { S.vis.parts[i].qty = num(t.value); readVisitForm(); S.sheet = sheetVisit(S.vis); render(); }
    }
  });

  /* Read every field back off the form. Called before any repaint of the visit sheet,
     because a repaint rebuilds the DOM and whatever was typed lives only there. */
  function readVisitForm() {
    var v = S.vis; if (!v) return;
    if (el("v_date"))    v.date = val("v_date");
    if (el("v_charge"))  v.visitCharge = val("v_charge");
    if (el("v_bags"))    v.saltBags = val("v_bags");
    if (el("v_saltamt")) v.saltAmt = val("v_saltamt");
    if (el("v_got"))     v.collected = val("v_got");
    if (el("v_note"))    v.notes = String(el("v_note").value || "");
    if (el("v_client"))  v.client = val("v_client");
    if (el("v_area"))    v.area = val("v_area");
  }

  function sheetMenu() {
    return '<h2>Menu</h2>' +
      '<div class="kv">' + kv("Signed in", S.user) + kv("Role", S.role) +
        kv("App", "v" + APP_VERSION) + kv("Book", bookAge(S.syncAt).txt) + '</div>' +
      '<div class="acts col">' +
      '<button class="btn gry grow" data-act="refresh">Fetch the book again</button>' +
      '<a class="btn gry grow" href="' + CRM_URL + '">Open the CRM</a>' +
      '<button class="btn red grow" data-act="signout">Sign out</button>' +
      '<button class="btn gry grow" data-act="close">Close</button></div>';
  }


  /* ================= LOGIN ================= */
  function renderLogin(msg) {
    var r = el("root"); if (!r) return;
    r.innerHTML = '<div class="login">' +
      '<div class="lbrand">Energy World</div><div class="lsub">Service</div>' +
      (msg ? '<div class="lmsg">' + esc(msg) + '</div>' : '') +
      '<label>Your name</label><input id="ln" value="' + esc(S.user || "") + '" autocomplete="username"/>' +
      '<label>PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password"/>' +
      '<button class="btn grow" data-act="login">Sign in</button>' +
      '<div class="lfoot">Same name and PIN as the CRM. v' + APP_VERSION + '</div></div>';
    var n = el("ln"); if (n && !n.value) n.focus(); else { var p = el("lp"); if (p) p.focus(); }
  }
  function doLogin() {
    var name = val("ln"), pin = val("lp");
    if (!name) { renderLogin("Enter your name."); return; }
    if (!pin)  { renderLogin("Enter your PIN."); return; }
    S.user = name; S.pin = pin;
    renderLogin("");
    var b = el("root") && el("root").querySelector('[data-act="login"]');
    if (b) { b.disabled = true; b.textContent = "Signing in…"; }
    authOnce(1).then(function (r) {
      if (!r || !r.ok) { renderLogin(loginWhy(r)); return; }
      S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
      try { beatStart(); } catch (e) {}
      if (!roleAny(ALLOWED)) { renderLogin(notForYou(S.user, S.role)); S.role = ""; return; }
      try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: S.pin })); } catch (e) {}
      S.busy = true; render(); pull(false);
    }).catch(function (e) { renderLogin((e && e.message) ? String(e.message) : "Could not reach the server."); });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (t && t.getAttribute("data-act") === "login") doLogin();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && el("lp") && document.activeElement && /^(ln|lp)$/.test(document.activeElement.id)) doLogin();
  });

  /* ================= THE BOOK ================= */
  function pull(loud) {
    if (_pulling) { if (loud) toast("Already fetching…"); return _pulling; }
    S.busy = true; if (loud) render();
    _pulling = getBook(KEEP_FAST).then(function (r) {
      if (!usableBook(r)) {
        S.busy = false; _pulling = null;
        toast(bookSay(r)); render(); return false;
      }
      beatMark(r && r.stamp);
      mergeBook(r, KEEP_FAST); S.fastAt = Date.now(); bust();
      if (bookHas(r, KEEP_REST)) {
        mergeBook(r, KEEP_REST); restTook();
        jrnReconcile(); applyJournal();
        S.syncAt = Date.now(); S.busy = false; _pulling = null;
        snapSave(); flushSoon(); render();
        if (loud) toast("Up to date" + (wireSay() ? " (" + wireSay() + ")" : "") + ".");
        return false;
      }
      applyJournal(); snapSave(); render();
      return true;
    }).then(function (go) {
      if (!go) return;
      if (!loud && !restStale()) { S.busy = false; _pulling = null; render(); return; }
      return getBook(KEEP_REST).then(function (r2) {
        if (usableBook(r2)) { mergeBook(r2, KEEP_REST); restTook(); }
        jrnReconcile(); applyJournal();
        S.syncAt = Date.now(); S.busy = false; _pulling = null;
        snapSave(); flushSoon(); render();
      });
    }).catch(function (e) {
      S.busy = false; _pulling = null;
      toast((e && e.message) ? String(e.message) : "Could not fetch the book.");
      render();
    });
    return _pulling;
  }

  /* MAY_DIFFER: each app's idea of "busy" — the same guard its own pull already used. */
  function beatSkip() {
    if (document.hidden) return true;
    if (!S.user || !S.data) return true;
    if (S.sheet) return true;                   /* never with a half-filled visit on screen */
    if (_pulling) return true;
    return false;
  }
  /* MAY_DIFFER: the CRM goes through quietSync and must clear its throttle; these call pull(). */
  function beatGo() { pull(false); }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    try { beatStart(); } catch (e) {}
    if (!S.user || !S.data) return;
    if (S.sheet) return;
    pull(false);
  });

  function openingScreen(msg) {
    var r = el("root"); if (!r) return;
    r.innerHTML = header() + '<div class="body"><div class="empty">' +
      esc(msg || "Fetching your work…") + '</div></div>';
  }

  /* ================= START ================= */
  (function () {
    var sess = null;
    try { sess = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { sess = null; }
    crashHandle();
    regSW();
    if (!sess || !sess.user || !sess.pin) { renderLogin(""); return; }
    S.user = sess.user; S.pin = sess.pin;
    bigPreload([SNAP + "_" + S.user, JRN_KEY]).then(function () { boot2(sess); });
  })();

  function boot2(sess) {
    var snap = snapLoad();
    if (snap) { S.data = snap; applyJournal(); S.busy = true; render(); } else openingScreen();
    var authP = authOnce(1);
    var dataP = getBook(KEEP_FAST);
    var refused = false;
    authP.then(function (r) {
      if (!r || !r.ok) {
        refused = true; S.pin = ""; forgetBook();
        try { localStorage.removeItem(STORE); } catch (e) {}
        renderLogin("Sign in again."); return;
      }
      S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
      try { beatStart(); } catch (e) {}
      if (!roleAny(ALLOWED)) {
        refused = true; S.pin = ""; forgetBook();
        renderLogin(notForYou(S.user, S.role)); S.role = ""; return;
      }
      return dataP.then(function (r2) {
        if (refused) return;
        if (!usableBook(r2)) { S.busy = false; toast(bookSay(r2)); render(); return; }
        beatMark(r2 && r2.stamp);
        mergeBook(r2, KEEP_FAST); S.fastAt = Date.now(); bust();
        if (bookHas(r2, KEEP_REST)) { mergeBook(r2, KEEP_REST); restTook(); }
        jrnReconcile(); applyJournal();
        S.syncAt = Date.now(); S.busy = false;
        snapSave(); render(); flushSoon(); startFlushTicker();
        if (!S.restAt) pull(false);
      });
    }).catch(function (e) {
      if (refused) return;
      S.busy = false;
      if (S.data) { toast("Working from the copy on this phone."); render(); }
      else renderLogin((e && e.message) ? String(e.message) : "Could not reach the server.");
    });
  }

})();
</script>
<script>
/* ---------------------------------------------------------------------------
   THE ICON NAG — one time, on the phone that needs it.
   The three apps used to share one Energy World leaf, so a man tapped the wrong
   one. They have their own pictures and names now — but a phone copies the icon
   into the home-screen shortcut on the day it is added and never looks again.
   Apple gives no way to change that from here; it has to be removed and re-added
   once. So the app tells the person holding it, rather than the owner having to
   tell five people. Shown only to someone who OPENED IT FROM THE HOME SCREEN —
   that is exactly the person with the old icon — once, and never again.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";
  var KEY = "ew_icon_nag_v1";
  try { if (localStorage.getItem(KEY)) return; } catch (e) { return; }

  var standalone = false;
  try {
    standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
                 window.navigator.standalone === true;
  } catch (e) {}
  if (!standalone) return;              /* in a browser tab there is no icon to fix */

  function show() {
    if (document.getElementById("ew_nag")) return;
    var d = document.createElement("div");
    d.id = "ew_nag";
    d.setAttribute("style",
      "position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 68px);z-index:9999;" +
      "background:#fff7ed;border:1px solid #fdba74;border-radius:13px;padding:13px 15px;" +
      "box-shadow:0 8px 24px rgba(15,23,42,.18);font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" +
      "color:#7c2d12;max-width:700px;margin:0 auto");
    d.innerHTML =
      '<div style="font-weight:800;margin-bottom:4px">This app has its own icon now</div>' +
      '<div>The picture on your home screen is still the old one — a phone keeps the icon from the day ' +
      'you added it. To fix it once: <b>press and hold the icon &rarr; Remove from Home Screen</b>, then open ' +
      '<b>energyworld apps</b> in the browser and <b>Add to Home Screen</b> again. You stay signed in.</div>' +
      '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">' +
        '<button id="ew_nag_open" style="appearance:none;border:1px solid #b45309;background:#b45309;color:#fff;' +
          'border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer">Open the apps page</button>' +
        '<button id="ew_nag_ok" style="appearance:none;border:1px solid #fdba74;background:#fff;color:#7c2d12;' +
          'border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer">Got it</button>' +
      '</div>';
    document.body.appendChild(d);
    var done = function () {
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      if (d.parentNode) d.parentNode.removeChild(d);
    };
    document.getElementById("ew_nag_ok").addEventListener("click", done);
    document.getElementById("ew_nag_open").addEventListener("click", function () {
      try { window.open("../apps/", "_blank"); } catch (e) {}
      done();
    });
  }
  /* after the app has painted, so it is never the first thing on a cold start */
  setTimeout(show, 2500);
})();
</script>
