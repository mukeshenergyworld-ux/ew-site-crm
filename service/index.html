  /* ================= SAVING A VISIT =================
     Two rows, in a deliberate order.

       1. THE VISIT. What was done, what it cost, what was taken. This is the record and
          it goes through the write-journal - so a visit finished in a basement with no
          signal is kept on the phone, shown on the screen as held, and goes up by itself
          when the signal returns. The Payment app learned this the hard way and this app
          starts with it.

       2. THE MACHINE. lastService moves to today and nextService moves forward by the
          cycle. This is a SECOND row and it is written second on purpose: if the visit
          lands and the machine update does not, the work is recorded and the due date is
          merely stale, which the office can see and fix. The other way round would be a
          machine that says it was serviced with no evidence that it was. */
  function visitRowFrom(v, ins) {
    var pTot = partsTotal(v.parts);
    /* v1.4.0 - `total` is now WHAT WAS CHARGEABLE, after the contract has had its say. The
       gross value of the work is not lost: visitCharge, saltAmt and partsAmt are each stored
       beside it, and visitTotal() adds them back whenever the office wants to know what an
       AMC actually delivered. Storing the chargeable figure is what makes `balance` mean what
       it says, and what lets the account screen add a column without re-deciding the rule. */
    var cover = amcCover(ins, v.type, v.date);
    var due = (cover.visit ? 0 : num(v.visitCharge)) +
              (cover.salt  ? 0 : num(v.saltAmt)) +
              (cover.parts ? 0 : pTot);
    /* nothing chargeable means nothing taken - the form does not even ask, so a stale value
       left in the object must not become a rupee the customer never handed over */
    var got = due > 0 ? num(v.collected) : 0;
    var total = due;
    return {
      id: v.id || mintId("SV"),
      createdAt: v.createdAt || new Date().toISOString(),
      createdBy: S.user,
      installId: ins ? String(ins.id) : "",
      client: ins ? String(ins.client || "") : String(v.client || ""),
      area: ins ? String(ins.area || "") : String(v.area || ""),
      date: String(v.date || today()).slice(0, 10),
      engineer: S.user,
      type: String(v.type || ""),
      visitCharge: num(v.visitCharge),
      saltBags: num(v.saltBags),
      saltAmt: num(v.saltAmt),
      /* the parts as words, because the sheet column is a word column and the office reads
         it. The arithmetic is kept beside it as a number so nobody has to re-add it. */
      partsUsed: (v.parts || []).map(function (p) {
        return p.name + (num(p.qty) === 1 ? "" : " x" + num(p.qty));
      }).join(", "),
      partsAmt: pTot,
      total: total,
      collected: got,
      balance: Math.max(0, total - got),
      notes: String(v.notes || ""),
      updatedAt: new Date().toISOString()
    };
  }

  /* Move the machine on. Only ever forward, and only when a cycle is actually known -
     inventing a next date from a cycle nobody set would be the app asserting something
     it cannot know. */
  function installAfter(ins, row) {
    if (!ins) return null;
    /* v1.4.0 - AN EXPLICIT LIST, AND A BUG THIS LINE CARRIED FOR HALF AN HOUR.
       It used to read `!AMC_COVERS[row.type]`, borrowing the MONEY list to answer a question
       that has nothing to do with money: does this kind of work move the machine's service
       clock forward. When AMC_COVERS was replaced by the new coverage rule, this reference was
       left behind pointing at a name that no longer existed - a ReferenceError on every visit
       save that touched a machine.

       t_undefined_names.js did NOT catch it. The checker reports other undeclared names in
       this very function, so the hole is real and is not understood. What caught it was
       reading the file for something else entirely, and what proves it fixed is t_service_run.js
       CALLING this function - which is that test file's own thesis: reading proves what code
       says, only running proves what it does.

       Everything except a labour job touches the machine. A labour job has no machine at all. */
    if (!TOUCHES_MACHINE[String(row.type || "")]) return null;
    var cyc = num(ins.cycleDays);
    var out = { };
    Object.keys(ins).forEach(function (k) { out[k] = ins[k]; });
    out.lastService = row.date;
    if (cyc > 0) {
      var d = new Date(row.date + "T00:00:00");
      d.setDate(d.getDate() + cyc);
      out.nextService = d.toISOString().slice(0, 10);
    }
    out.updatedAt = new Date().toISOString();
    return out;
  }

  /* ==========================================================================
     A PHOTOGRAPH ON A SERVICE VISIT  (v1.7.0, 21 August 2026)

     Asked what the photo is actually of, he picked all three, and they are not one feature:

       THE FAULT          what was wrong. Filed against the VISIT, so the next man sees what
                          the last man found instead of diagnosing it again.
       THE COMPLETED WORK proof the job was done and the machine runs. Filed against the
                          VISIT - the service equivalent of a signed delivery receipt.
       THE MACHINE & PLATE the unit and its serial. Filed against the INSTALLATION, not the
                          visit, so it is there for every future visit and settles a warranty
                          argument about which machine it was.

     WHERE IT IS KEPT. As an append-only audit row, the same channel the delivery proofs and
     the hisab stamps use, and for the same reason their comments give: no column is added to
     any tab, so no sheet migration - and teamSaveLocked_ writes a row from the SHEET's own
     headers, which means a field with no column is silently dropped. A photo that vanishes
     into a header that does not exist is the one failure this feature cannot have.

     A PHOTO NEVER BLOCKS THE VISIT. The visit is money; the photo is evidence. Everything
     below runs AFTER saveRow and outside its promise - the same rule the complaint close
     follows three functions up, and for the same reason: a slow upload must never make a man
     think his visit was lost. If a photo fails he is told that the photo failed, in those
     words, and the visit stays saved. */
  /* ============ THE SIGNED SERVICE RECEIPT (v1.10.0, 30 Aug 2026) ============
     "also made provision to attached signed service receipt in service section also"

     A delivery has carried one since 6.9.281 - the paper that came back from the site, filed
     against the challan and reproduced on the customer's statement. A service visit had three
     photographs and none of them was that. "Work done" is proof the machine runs; it is not
     the customer's signature against an amount.

     It rides the same channel as the other three - a service:photo audit row, no new column,
     no sheet migration - and it is filed against the VISIT, because that is what was signed
     for. */
  var PIC_KINDS = [
    { k: "receipt", t: "Signed service receipt", hint: "The paper the customer signed, with the amount on it. This is the one that settles an argument about a bill." },
    { k: "fault",   t: "The fault",        hint: "What was wrong — the leak, the burnt card, the cracked housing." },
    { k: "done",    t: "Work done",        hint: "The machine running after the job. Your proof it was finished." },
    { k: "machine", t: "Machine & serial", hint: "The unit and its serial plate. Kept on the machine, not this visit — every future visit sees it." }
  ];
  function picKind(k) {
    return PIC_KINDS.filter(function (x) { return x.k === k; })[0] || null;
  }
  function picsOf(kind, id) {
    if (!id) return [];
    var want = String(id);
    return ((S.data && S.data.audit) || []).filter(function (a) {
      if (!a || String(a.action || "") !== "service:photo") return false;
      var d; try { d = JSON.parse(a.detail || "{}"); } catch (e) { return false; }
      if (!d || !d.url) return false;
      /* v1.10.0 - the receipt is asked for BY NAME. Before there were only two buckets, the
         machine's and "everything else on this visit", and a new kind would have fallen
         silently into the second one. */
      if (kind === "machine") return String(d.installId) === want && d.kind === "machine";
      if (kind === "receipt") return String(d.visitId) === want && d.kind === "receipt";
      return String(d.visitId) === want && d.kind !== "machine" && d.kind !== "receipt";
    }).map(function (a) {
      var d = {}; try { d = JSON.parse(a.detail || "{}"); } catch (e) { }
      return { kind: d.kind || "", url: d.url || "", thumb: d.thumb || "", by: d.by || a.actor || "", at: d.at || a.createdAt || "" };
    }).sort(function (x, y) { return String(y.at).localeCompare(String(x.at)); });
  }
  /* The strip of thumbnails. Tapping one opens the full picture in a new tab - it is a Drive
     link, so it opens the way every other document in this estate opens. */
  function picStrip(list, title) {
    if (!list.length) return "";
    return '<div style="margin-top:6px"><div class="muted" style="font-size:11px;letter-spacing:.06em;' +
      'text-transform:uppercase">' + esc(title) + '</div>' +
      '<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:4px">' +
      list.map(function (p) {
        var lbl = (picKind(p.kind) || {}).t || p.kind;
        var img = p.thumb
          ? '<img src="data:image/jpeg;base64,' + esc(p.thumb) + '" alt="" loading="lazy" ' +
            'style="width:44px;height:44px;box-sizing:border-box;object-fit:cover;border-radius:7px;' +
            'border:1px solid #cbd5e1;background:#fff;display:block"/>'
          : '<div style="width:44px;height:44px;border-radius:7px;border:1px dashed #cbd5e1;' +
            'display:flex;align-items:center;justify-content:center;font-size:15px;color:#94a3b8">open</div>';
        return '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" ' +
          'title="' + esc(lbl + (p.by ? " · " + p.by : "") + (p.at ? " · " + String(p.at).slice(0, 10) : "")) + '" ' +
          'style="text-decoration:none">' + img + '</a>';
      }).join("") + '</div></div>';
  }
  /* What is waiting on this phone, not yet up. Kept separate from picStrip because a picture
     that is still on the phone is a different fact from one that is filed, and showing them
     the same way is how a man stops checking. */
  function picPending(v) {
    var l = (v && v.pics) || [];
    if (!l.length) return "";
    return '<div class="note warn-t" style="margin-top:6px">' + l.length + ' photo' +
      (l.length > 1 ? 's' : '') + ' ready — ' +
      esc(l.map(function (p) { return (picKind(p.kind) || {}).t || p.kind; }).join(", ")) +
      '. ' + (l.length > 1 ? 'They go up' : 'It goes up') + ' when you save the visit.</div>';
  }
  function picPickers(v) {
    var got = {};
    ((v && v.pics) || []).forEach(function (p) { got[p.kind] = 1; });
    return '<label>Photos</label>' +
      '<div class="muted" style="font-size:12px;margin-bottom:6px">Nothing here is required. ' +
      'A picture of the fault saves the next man a diagnosis, and a picture of the finished job ' +
      'is the only proof this visit leaves behind.</div>' +
      PIC_KINDS.map(function (K) {
        return '<div class="card" style="padding:8px 10px;margin-bottom:6px">' +
          '<div style="font-weight:700;font-size:12.5px">' + esc(K.t) +
            (got[K.k] ? ' <span class="pill grn">✓ taken</span>' : '') + '</div>' +
          '<div class="muted" style="font-size:11.5px;margin:2px 0 5px">' + esc(K.hint) + '</div>' +
          '<input type="file" accept="image/*" capture="environment" class="v-pic" ' +
            'data-kind="' + esc(K.k) + '"/></div>';
      }).join("");
  }
  /* Shrunk on the phone, not on the way out. A 4 MB camera JPEG over one bar of signal is the
     upload that never finishes, and 1400px is comfortably enough to read a serial plate. The
     thumbnail is built at the same time and travels on the audit row, so the strip draws with
     no second fetch. */
  function picRead(file, kind) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () {
        shrink(fr.result, 1400, 0.7).then(function (big) {
          return shrink(fr.result, 96, 0.5).then(function (sm) {
            res({ kind: kind, b64: String(big.url).split(",")[1] || "",
                  thumb: String(sm.url).split(",")[1] || "" });
          });
        }).catch(rej);
      };
      fr.onerror = function () { rej(new Error("could not read that photo")); };
      fr.readAsDataURL(file);
    });
  }
  /* Sent one at a time on purpose - the receipt queue in the CRM learned this the hard way and
     wrote it down: firing three uploads together on a bad line gets three timeouts instead of
     one success. Each one that lands is filed immediately, so a failure half way through never
     costs the ones already up. */
  function picSend(pics, visitId, installId, client) {
    var done = 0, failed = 0;
    var step = function (i) {
      if (i >= pics.length) {
        if (done) { bust(); renderBg(); }
        if (failed) toast(failed + " photo" + (failed > 1 ? "s" : "") + " did not go up. The visit is saved — the photo is not.");
        else if (done) toast(done + " photo" + (done > 1 ? "s" : "") + " filed.");
        return;
      }
      var p = pics[i];
      var nm = (p.kind + "-" + (p.kind === "machine" ? (installId || "x") : (visitId || "x")) + "-" + Date.now() + ".jpg")
        .replace(/[^\w.-]+/g, "_");
      api("pdfHost", { pdfBase64: p.b64, filename: nm, mime: "image/jpeg" }, 240000)
        .then(function (r) {
          if (!r || !r.ok || !r.url) { failed++; return step(i + 1); }
          var at = new Date().toISOString();
          return saveRow("audit", {
            id: mintId("SP"), createdAt: at, actor: S.user || "",
            action: "service:photo",
            target: String(client || "") + " · " + ((picKind(p.kind) || {}).t || p.kind),
            detail: JSON.stringify({ visitId: visitId || "", installId: installId || "",
              kind: p.kind, url: r.url, thumb: p.thumb || "", client: client || "",
              by: S.user || "", at: at }),
            ip: ""
          }).then(function () { done++; step(i + 1); })
            .catch(function () { failed++; step(i + 1); });
        })
        .catch(function () { failed++; step(i + 1); });
    };
    step(0);
  }

  function saveVisit() {
    /* The three buttons above are the door. This is the lock: a screen already open when a
       role changed, or a stale sheet, must not be able to write a visit either. */
    if (!canRecord()) { toast("Recording a visit is the engineer's job."); return; }
    var v = S.vis; if (!v) return;
    var ins = v.installId ? installById(v.installId) : null;

    /* read the form back before anything else - a repaint must never be able to take a
       half-typed note away, and everything below depends on these being current */
    v.date = val("v_date") || today();
    v.visitCharge = val("v_charge");
    v.saltBags = val("v_bags");
    v.saltAmt = val("v_saltamt");
    v.notes = (el("v_note") ? String(el("v_note").value || "") : "").trim();
    v.collected = val("v_got");
    if (!ins) { v.client = val("v_client"); v.area = val("v_area"); }

    if (!v.type) { toast("Say what was done first."); return; }
    if (!ins && !v.client) { toast("Pick the customer this job was for."); return; }

    var row = visitRowFrom(v, ins);
    if (!row.total && !row.notes && !row.partsUsed) {
      toast("Nothing to record — add a charge, a part, or a note about what you did.");
      return;
    }

    S.sheet = null; S.vis = null;
    toast("Visit saved" + (row.collected ? " — " + money9(row.collected) + " on you." : "."));
    render();

    /* ---- AND THE VISIT CLOSES THE COMPLAINT (v1.6.0) ----
       Deliberately AFTER the visit is written and outside its promise. The work is recorded
       the moment saveRow takes it; a complaints sheet that is slow or down must never make a
       man think his visit was lost. If the close fails the complaint simply stays open and
       somebody goes again - which is the safe direction. */
    if (v.complaintRef) {
      var _ref = v.complaintRef, _vid = row.id || "";
      api("complaintClose", { ref: _ref, visitId: _vid, note: row.notes || "" }, 20000)
        .then(function (r) {
          if (r && r.ok) {
            (S.cx && S.cx.rows || []).forEach(function (x) {
              if (String(x.Ref) === String(_ref)) { x.Status = "Closed"; x.ClosedBy = S.user; }
            });
            cxSave();
            /* ---- TELL THE CUSTOMER, WITH A CHECK SCREEN FIRST (v1.6.0) ----
               His answer, in his words: "Yes - WhatsApp, with a check screen first". So this
               does not send. It shows exactly what would go and to whom, and WhatsApp itself
               is where the send button lives. A message to a customer cannot be called back,
               which is the same reason the Payment app has never sent one either. */
            S.cxTell = { ref: _ref, name: cxWho(cRowOf(_ref)), mobile: cxMob((cRowOf(_ref) || {}).Mobile) };
            S.sheet = sheetCxTell(); render();
          } else {
            toast("Visit saved. The complaint could not be closed — it stays on the list.");
          }
        }).catch(function () {
          toast("Visit saved. No signal to close the complaint — it stays on the list.");
        });
    }

    /* v1.7.0 - AFTER the row, OUTSIDE its promise. Same rule as the complaint close above:
       the visit is money and the photo is evidence, and a slow upload must never make a man
       think his visit was lost. */
    if (v.pics && v.pics.length) {
      try { picSend(v.pics.slice(), row.id || "", (ins && ins.id) || "", row.client || ""); }
      catch (ePx) { toast("The visit is saved. The photos could not be sent."); }
    }

    saveRow("visits", row).then(function () {
      var upd = installAfter(ins, row);
      if (!upd) return null;
      /* keep the copy on this phone in step at once, so the due list stops nagging about a
         machine he has just serviced even before the server answers */
      var live = installById(ins.id);
      if (live) { live.lastService = upd.lastService; if (upd.nextService) live.nextService = upd.nextService; }
      bust(); renderBg();
      return saveRow("installs", upd);
    }).catch(function () { /* the journal has it; jrnPaint says so on screen */ });
  }

  function bust() {
    _cxCache = null; _bookCl = null; }


  /* ================= THE SHELL ================= */
  var NAV = [
    { k: "today",   t: "Today" },
    { k: "jobs",    t: "Machines" },
    { k: "labour",  t: "Labour job" },
    { k: "history", t: "My work" },
    { k: "account", t: "Account" }
  ];
  function navBtn(n) {
    return '<button class="nav' + (S.tab === n.k ? ' on' : '') + '" data-act="tab" data-k="' + esc(n.k) + '">' +
      esc(n.t) + '</button>';
  }
  function bodyHtml() {
    /* v1.4.4 - `.sheet .inner` HAS BEEN STYLED SINCE THE FIRST RELEASE AND NEVER EMITTED.
       Without it the overlay's own children became the flex items of a bottom-aligned row, so
       every sheet in this app laid its cards out ALONG THE BOTTOM EDGE instead of stacking in
       a white card. On a narrow phone that mostly stacked anyway and looked passable, which is
       why it survived; on a Mac it is the scattered mess in his screenshot. */
    if (S.sheet) return '<div class="sheet"><div class="inner">' + S.sheet + '</div></div>';
    var v = { today: viewToday, jobs: viewJobs, history: viewHistory, account: viewAccount }[S.tab];
    return v ? v() : viewToday();
  }
  function render() {
    var r = el("root"); if (!r) return;
    /* v1.4.4 - THE WORD "undefined" ON EVERY SCREEN, seen in his own screenshot.
       jrnPaint() paints the sync banner into a node OUTSIDE #root and returns nothing. It was
       being concatenated into this string, so every render printed the literal word
       `undefined` under the header. It is a painter; it is called, not added. */
    r.innerHTML = header() + newVerBar() +
      /* .wrap, not just .body: the 760px column lived only in a class nothing wore, so on any
         screen wider than a phone the whole app ran edge to edge. jrnPaint() also looks for
         `.wrap` to keep the sync banner off the bottom of the list, and had been finding
         nothing at all. One missing class, two faults. */
      '<div class="body wrap">' + bodyHtml() + '</div>' +
      (S.sheet ? '' : '<div class="tabs">' + NAV.map(navBtn).join("") + '</div>');
    jrnPaint();
    wireInputs(); painted();
  }
  /* A background repaint. If a form is open it defers - the same rule the CRM learned in
     v6.9.144, because typed values live in the DOM until they are read back. */
  function renderBg() { if (S.sheet) return; render(); }

  function wireInputs() {
    var q = el("q");
    if (q) {
      q.addEventListener("input", function () {
        S.q = q.value;
        var body = el("root").querySelector(".body");
        if (body) { body.innerHTML = bodyHtml(); wireInputs(); }
      });
      if (S.q) { q.focus(); try { q.setSelectionRange(q.value.length, q.value.length); } catch (e) {} }
    }
  }

  /* ================= WHAT A TAP MEANS ================= */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id") || "";

    if (act === "tab") {
      var k = t.getAttribute("data-k");
      /* "Labour job" is a verb, not a place. Tapping it opens the form straight away rather
         than showing a screen whose only content is a button to open the form. */
      if (k === "labour") {
        if (!canRecord()) { toast("Recording a visit is the engineer's job. You are here to read the money."); return; }
        S.vis = { installId: "", type: "Labour job", date: today(), parts: [], collected: "", client: "", area: "" };
        S.sheet = sheetVisit(S.vis); render(); return;
      }
      S.tab = k; S.q = ""; render(); return;
    }
    if (act === "acc-open") {
      var ak = t.getAttribute("data-k") || "";
      S.accOpen = (S.accOpen === ak) ? "" : ak;
      render(); return;
    }
    if (act === "close")   { S.sheet = null; S.vis = null; S.q = ""; render(); return; }
    if (act === "refresh") { pull(true); return; }
    if (act === "menu")    { S.sheet = sheetMenu(); render(); return; }
    if (act === "signout") { signOut(); return; }

    if (act === "job") {
      var ins = installById(id); if (!ins) return;
      S.job = ins.id; S.sheet = sheetJob(ins); render(); return;
    }
    if (act === "cx-tell-no") { S.cxTell = null; S.sheet = null; render(); return; }
    if (act === "cx-tell-go") {
      var tt = S.cxTell || {};
      var url = "https://wa.me/91" + String(tt.mobile || "") + "?text=" + encodeURIComponent(cxTellText(tt.ref));
      S.cxTell = null; S.sheet = null; render();
      window.open(url, "_blank");
      return;
    }

    if (act === "cx-do") {
      if (!canRecord()) { toast("Going out on a complaint is the engineer's job."); return; }
      var cref = t.getAttribute("data-ref") || "";
      var cRow = complaints().filter(function (x) { return String(x.Ref) === String(cref); })[0];
      if (!cRow) { toast("That complaint is not on this phone — refresh."); return; }
      var cIns = cxInstall(cRow);
      /* A COMPLAINT FROM A MAN WHO IS NOT ON THE BOOK STILL OPENS. He complained; whether the
         office ever registered him is not his problem and must not be a dead end. With no
         machine it opens as a labour job, which is exactly what it is. */
      S.vis = cIns
        ? { installId: cIns.id, type: "Repair", date: today(), parts: [], collected: "",
            complaintRef: cRow.Ref, visitCharge: defaultCharge(cIns, "Repair", today()) }
        : { installId: "", type: "Labour job", date: today(), parts: [], collected: "",
            complaintRef: cRow.Ref,
            client: String(cRow.Name || ""), area: String(cRow.City || "") };
      S.vis.notes = "Complaint " + String(cRow.Ref || "") + ": " + String(cRow.Description || "").slice(0, 160);
      S.sheet = sheetVisit(S.vis); render(); return;
    }

    if (act === "do-visit") {
      /* v1.4.3 - an accounts man may read every rupee in this app and may record nothing. The
         engineer stamp on a visit is a claim about who stood in the customer's house; letting
         the office write it would put a name on work that name did not do. */
      if (!canRecord()) { toast("Recording a visit is the engineer's job. You are here to read the money."); return; }
      var i2 = installById(id); if (!i2) return;
      S.vis = { installId: i2.id, type: "Service", date: today(), parts: [], collected: "",
                visitCharge: defaultCharge(i2, "Service", today()) };
      S.sheet = sheetVisit(S.vis); render(); return;
    }
    if (act === "v-type") {
      if (!S.vis) return;
      S.vis.type = t.getAttribute("data-t");
      readVisitForm();
      S.sheet = sheetVisit(S.vis); render(); return;
    }
    if (act === "v-parts") {
      if (!S.vis) return;
      /* v1.8.0 - it used to refuse when the 27-row spares tab was empty. The picker now reads
         the 1,044-product master list, so an empty spares tab is no reason to refuse anything. */
      catReady();
      readVisitForm(); S.q = ""; S.sheet = sheetParts(); render(); return;
    }
    if (act === "v-back")  { if (S.vis) { S.q = ""; S.sheet = sheetVisit(S.vis); render(); } return; }
    if (act === "v-pick") {
      if (!S.vis) return;
      var _c = t.getAttribute("data-code");
      /* v1.8.0 - the master list first, the service spares second. The price is the CATALOGUE
         LIST PRICE and no discount is taken off it: his answer, and the right one - a service
         call is not a bulk order. It is frozen onto the line here, so a later change to the
         catalogue can never rewrite a visit already recorded. */
      var pr = PRODUCTS.filter(function (p) { return lower(p.code) === lower(_c); })[0];
      var sp = pr ? { code: pr.code, name: pr.desc, price: num(pr.price), unit: pr.unit || "" } : null;
      if (!sp) return;
      var rows = S.vis.parts || (S.vis.parts = []);
      /* the same item picked twice is a bigger quantity, never a second row - two identical
         lines on one visit is how a customer gets billed for one thing twice */
      var hit = rows.filter(function (r) { return lower(r.code) === lower(sp.code); })[0];
      if (hit) { hit.qty = num(hit.qty) + 1; toast(sp.name + " \u2014 now " + hit.qty); }
      else rows.push({ code: sp.code, name: sp.name, price: num(sp.price), qty: 1, unit: sp.unit || "" });
      S.q = ""; S.sheet = sheetVisit(S.vis); render(); return;
    }
    if (act === "v-drop") {
      if (!S.vis) return; readVisitForm();
      S.vis.parts.splice(num(t.getAttribute("data-i")), 1);
      S.sheet = sheetVisit(S.vis); render(); return;
    }
    if (act === "v-save")  { saveVisit(); return; }

    if (act === "labour-new") {
      if (!canRecord()) { toast("Recording a visit is the engineer's job. You are here to read the money."); return; }
      S.vis = { installId: "", type: "Labour job", date: today(), parts: [], collected: "", client: "", area: "" };
      S.sheet = sheetVisit(S.vis); render(); return;
    }
  });

  /* a quantity typed into a part row, kept without tearing the form down */
  document.addEventListener("change", function (e) {
    var t = e.target;
    /* v1.7.0 - a photograph, straight off the camera. Read into state, never into the DOM:
       the visit sheet repaints on every part added and every quantity changed, and a file
       input cannot be repopulated by a repaint - whatever was taken would simply be gone. */
    if (t && t.classList && t.classList.contains("v-pic") && S.vis) {
      var f = t.files && t.files[0];
      var kind = t.getAttribute("data-kind") || "";
      if (!f || !kind) return;
      readVisitForm();
      toast("Shrinking the photo…");
      picRead(f, kind).then(function (p) {
        S.vis.pics = (S.vis.pics || []).filter(function (x) { return x.kind !== kind; });
        S.vis.pics.push(p);
        S.sheet = sheetVisit(S.vis); render();
        toast(((picKind(kind) || {}).t || "Photo") + " ready. It goes up when you save.");
      }).catch(function () {
        toast("That photo could not be read. Try taking it again.");
      });
      return;
    }
    if (t && t.getAttribute && t.getAttribute("data-act") === "v-qty" && S.vis) {
      var i = num(t.getAttribute("data-i"));
      if (S.vis.parts[i]) { S.vis.parts[i].qty = num(t.value); readVisitForm(); S.sheet = sheetVisit(S.vis); render(); }
    }
    /* v1.9.0 - and the rate, the same way */
    if (t && t.getAttribute && t.getAttribute("data-act") === "v-rate" && S.vis) {
      var ri = num(t.getAttribute("data-i"));
      if (S.vis.parts[ri]) { S.vis.parts[ri].price = num(t.value); readVisitForm(); S.sheet = sheetVisit(S.vis); render(); }
    }
  });

  /* Read every field back off the form. Called before any repaint of the visit sheet,
     because a repaint rebuilds the DOM and whatever was typed lives only there. */
  function readVisitForm() {
    var v = S.vis; if (!v) return;
    if (el("v_date"))    v.date = val("v_date");
    if (el("v_charge"))  v.visitCharge = val("v_charge");
    if (el("v_bags"))    v.saltBags = val("v_bags");
    if (el("v_saltamt")) v.saltAmt = val("v_saltamt");
    if (el("v_got"))     v.collected = val("v_got");
    if (el("v_note"))    v.notes = String(el("v_note").value || "");
    if (el("v_client"))  v.client = val("v_client");
    if (el("v_area"))    v.area = val("v_area");
  }

  function sheetMenu() {
    return '<h2>Menu</h2>' +
      '<div class="kv">' + kv("Signed in", S.user) + kv("Role", S.role) +
        kv("App", "v" + APP_VERSION) + kv("Book", bookAge(S.syncAt).txt) + '</div>' +
      '<div class="acts col">' +
      '<button class="btn gry grow" data-act="refresh">Fetch the book again</button>' +
      '<a class="btn gry grow" href="' + CRM_URL + '">Open the CRM</a>' +
      '<button class="btn red grow" data-act="signout">Sign out</button>' +
      '<button class="btn gry grow" data-act="close">Close</button></div>';
  }


  /* ================= LOGIN ================= */
  function renderLogin(msg) {
    var r = el("root"); if (!r) return;
    r.innerHTML = '<div class="login">' +
      '<div class="lbrand">Energy World</div><div class="lsub">Service</div>' +
      (msg ? '<div class="lmsg">' + esc(msg) + '</div>' : '') +
      '<label>Your name</label><input id="ln" value="' + esc(S.user || "") + '" autocomplete="username"/>' +
      /* v1.7.1 - said PIN where Challan and Collection both say "Your PIN" with the same
         placeholder. One man signs into three of these apps with one PIN; three different words
         for it is three chances to think it is three different PINs. Carried on the pending list
         since 20 August and found again by a spot check. */
      '<label>Your PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Your Team CRM PIN"/>' +
      '<button class="btn grow" data-act="login">Sign in</button>' +
      '<div class="lfoot">Same name and PIN as the CRM. v' + APP_VERSION + '</div></div>';
    var n = el("ln"); if (n && !n.value) n.focus(); else { var p = el("lp"); if (p) p.focus(); }
  }
  function doLogin() {
    var name = val("ln"), pin = val("lp");
    if (!name) { renderLogin("Enter your name."); return; }
    if (!pin)  { renderLogin("Enter your PIN."); return; }
    S.user = name; S.pin = pin;
    renderLogin("");
    var b = el("root") && el("root").querySelector('[data-act="login"]');
    if (b) { b.disabled = true; b.textContent = "Signing in…"; }
    authOnce(1).then(function (r) {
      if (!r || !r.ok) { renderLogin(loginWhy(r)); return; }
      S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
      try { beatStart(); } catch (e) {}
      if (!roleAny(ALLOWED)) { renderLogin(notForYou(S.user, S.role)); S.role = ""; return; }
      try { localStorage.setItem(STORE, JSON.stringify({ user: S.user, pin: S.pin })); } catch (e) {}
      S.busy = true; render(); pull(false);
    }).catch(function (e) { renderLogin((e && e.message) ? String(e.message) : "Could not reach the server."); });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (t && t.getAttribute("data-act") === "login") doLogin();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && el("lp") && document.activeElement && /^(ln|lp)$/.test(document.activeElement.id)) doLogin();
  });

  /* ================= THE BOOK ================= */
  function pull(loud) {
    if (_pulling) { if (loud) toast("Already fetching…"); return _pulling; }
    S.busy = true; if (loud) render();
    _pulling = getBook(KEEP_FAST).then(function (r) {
      if (!usableBook(r)) {
        S.busy = false; _pulling = null;
        toast(bookSay(r)); render(); return false;
      }
      beatMark(r && r.stamp);
      mergeBook(r, KEEP_FAST); S.fastAt = Date.now(); bust();
      /* fire and forget: the complaints are their own call and a slow complaints sheet must
         never hold up the book the engineer is standing there waiting for */
      cxPull().then(function (got) { if (got) render(); });
      if (bookHas(r, KEEP_REST)) {
        mergeBook(r, KEEP_REST); restTook();
        jrnReconcile(); applyJournal();
        S.syncAt = Date.now(); S.busy = false; _pulling = null;
        snapSave(); flushSoon(); render();
        if (loud) toast("Up to date" + (wireSay() ? " (" + wireSay() + ")" : "") + ".");
        return false;
      }
      applyJournal(); snapSave(); render();
      return true;
    }).then(function (go) {
      if (!go) return;
      /* nothing in the slow half means no second call, no throttle to consult, and one round
         trip instead of two */
      if (!KEEP_REST.length) {
        jrnReconcile(); applyJournal(); restTook();
        S.syncAt = Date.now(); S.busy = false; _pulling = null;
        snapSave(); flushSoon(); render();
        if (loud) toast("Up to date" + (wireSay() ? " (" + wireSay() + ")" : "") + ".");
        return;
      }
      if (!loud && !restStale()) { S.busy = false; _pulling = null; render(); return; }
      return getBook(KEEP_REST).then(function (r2) {
        if (usableBook(r2)) { mergeBook(r2, KEEP_REST); restTook(); }
        jrnReconcile(); applyJournal();
        S.syncAt = Date.now(); S.busy = false; _pulling = null;
        snapSave(); flushSoon(); render();
      });
    }).catch(function (e) {
      S.busy = false; _pulling = null;
      toast((e && e.message) ? String(e.message) : "Could not fetch the book.");
      render();
    });
    return _pulling;
  }

  /* MAY_DIFFER: each app's idea of "busy" — the same guard its own pull already used. */
  function beatSkip() {
    if (document.hidden) return true;
    if (!S.user || !S.data) return true;
    if (S.sheet) return true;                   /* never with a half-filled visit on screen */
    if (_pulling) return true;
    return false;
  }
  /* MAY_DIFFER: the CRM goes through quietSync and must clear its throttle; these call pull(). */
  function beatGo() { pull(false); }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    try { beatStart(); } catch (e) {}
    if (!S.user || !S.data) return;
    if (S.sheet) return;
    pull(false);
  });

  function openingScreen(msg) {
    var r = el("root"); if (!r) return;
    r.innerHTML = header() + '<div class="body"><div class="empty">' +
      esc(msg || "Fetching your work…") + '</div></div>';
  }

  /* ================= START ================= */
  (function () {
    var sess = null;
    try { sess = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { sess = null; }
    crashHandle();
    regSW();
    if (!sess || !sess.user || !sess.pin) { renderLogin(""); return; }
    S.user = sess.user; S.pin = sess.pin;
    bigPreload([SNAP + "_" + S.user, JRN_KEY, CAT_KEY]).then(function () { catFromShelf(); verWatch(); boot2(sess); });
  })();

  function boot2(sess) {
    /* the complaints this phone already had, before any network at all - a complaint raised
       at eight is still on the screen in a basement at eleven */
    cxLoad();
    var snap = snapLoad();
    if (snap) { S.data = snap; applyJournal(); S.busy = true; render(); } else openingScreen();
    var authP = authOnce(1);
    var dataP = getBook(KEEP_FAST);
    var refused = false;
    authP.then(function (r) {
      if (!r || !r.ok) {
        refused = true; S.pin = ""; forgetBook();
        try { localStorage.removeItem(STORE); } catch (e) {}
        renderLogin("Sign in again."); return;
      }
      S.user = r.user.name; S.role = String(r.user.role || "").toLowerCase();
      try { beatStart(); } catch (e) {}
      if (!roleAny(ALLOWED)) {
        refused = true; S.pin = ""; forgetBook();
        renderLogin(notForYou(S.user, S.role)); S.role = ""; return;
      }
      return dataP.then(function (r2) {
        if (refused) return;
        if (!usableBook(r2)) { S.busy = false; toast(bookSay(r2)); render(); return; }
        beatMark(r2 && r2.stamp);
        mergeBook(r2, KEEP_FAST); S.fastAt = Date.now(); bust();
        if (bookHas(r2, KEEP_REST)) { mergeBook(r2, KEEP_REST); restTook(); }
        jrnReconcile(); applyJournal();
        S.syncAt = Date.now(); S.busy = false;
        snapSave(); render(); flushSoon(); startFlushTicker();
        cxPull().then(function (got) { if (got) render(); });
        if (!S.restAt) pull(false);
      });
    }).catch(function (e) {
      if (refused) return;
      S.busy = false;
      if (S.data) { toast("Working from the copy on this phone."); render(); }
      else renderLogin((e && e.message) ? String(e.message) : "Could not reach the server.");
    });
  }

})();
</script>
<script>
/* ---------------------------------------------------------------------------
   THE ICON NAG — one time, on the phone that needs it.
   The three apps used to share one Energy World leaf, so a man tapped the wrong
   one. They have their own pictures and names now — but a phone copies the icon
   into the home-screen shortcut on the day it is added and never looks again.
   Apple gives no way to change that from here; it has to be removed and re-added
   once. So the app tells the person holding it, rather than the owner having to
   tell five people. Shown only to someone who OPENED IT FROM THE HOME SCREEN —
   that is exactly the person with the old icon — once, and never again.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";
  var KEY = "ew_icon_nag_v1";
  try { if (localStorage.getItem(KEY)) return; } catch (e) { return; }

  var standalone = false;
  try {
    standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
                 window.navigator.standalone === true;
  } catch (e) {}
  if (!standalone) return;              /* in a browser tab there is no icon to fix */

  function show() {
    if (document.getElementById("ew_nag")) return;
    var d = document.createElement("div");
    d.id = "ew_nag";
    d.setAttribute("style",
      "position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 68px);z-index:9999;" +
      "background:#fff7ed;border:1px solid #fdba74;border-radius:13px;padding:13px 15px;" +
      "box-shadow:0 8px 24px rgba(15,23,42,.18);font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" +
      "color:#7c2d12;max-width:700px;margin:0 auto");
    d.innerHTML =
      '<div style="font-weight:800;margin-bottom:4px">This app has its own icon now</div>' +
      '<div>The picture on your home screen is still the old one — a phone keeps the icon from the day ' +
      'you added it. To fix it once: <b>press and hold the icon &rarr; Remove from Home Screen</b>, then open ' +
      '<b>energyworld apps</b> in the browser and <b>Add to Home Screen</b> again. You stay signed in.</div>' +
      '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">' +
        '<button id="ew_nag_open" style="appearance:none;border:1px solid #b45309;background:#b45309;color:#fff;' +
          'border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer">Open the apps page</button>' +
        '<button id="ew_nag_ok" style="appearance:none;border:1px solid #fdba74;background:#fff;color:#7c2d12;' +
          'border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer">Got it</button>' +
      '</div>';
    document.body.appendChild(d);
    var done = function () {
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      if (d.parentNode) d.parentNode.removeChild(d);
    };
    document.getElementById("ew_nag_ok").addEventListener("click", done);
    document.getElementById("ew_nag_open").addEventListener("click", function () {
      try { window.open("../apps/", "_blank"); } catch (e) {}
      done();
    });
  }
  /* after the app has painted, so it is never the first thing on a cold start */
  setTimeout(show, 2500);
})();
</script>
