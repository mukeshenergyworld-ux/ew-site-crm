/* Teal, not the collection app's maroon, so a man never mistakes one for the other.
   Everything here is sized for a hand in a godown: bigger type, bigger targets. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

.top h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.02em;flex:1}

.btn.amb{background:#b45309;border-color:#b45309;color:#fff}
.btn.full{width:100%;padding:14px;font-size:16px}
.btn[disabled]{opacity:.55}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:12px 13px;margin:10px 0;
  box-shadow:0 1px 2px rgba(15,23,42,.05)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1 1 46%;min-width:150px;background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:11px 13px}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.02em}

/* ==== A TICK BOX IS NOT A TEXT FIELD (23 Aug 2026) ====
   The rule above is right for every field in this app and wrong for the two that are not
   fields: a bare checkbox inherited width:100% and took the whole line, so the label beside
   it dropped underneath. Found on the CRM's HISAB card, fixed everywhere at once. */
input[type="checkbox"],input[type="radio"]{width:auto;padding:0;min-height:0;flex:0 0 auto;
  -webkit-appearance:auto;appearance:auto}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin:11px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  background:#f1f5f9;color:#475569;vertical-align:middle;white-space:nowrap}
.pill.red{background:#fee2e2;color:#b91c1c}

   white-space:nowrap because a status chip inside a list row must never wrap. On the login
   screen that ran the message straight off the right edge of the phone - so the release that
   made the app explain itself shipped an explanation nobody could read. Measured in a real
   browser at 390px before this rule existed. Its own class, so status chips keep theirs. */
.loginmsg{display:block;white-space:normal;word-break:break-word;text-align:left;
  line-height:1.45;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:12px;

   bottom:0` landed on each of the FIVE BUTTONS and stacked all five on top of one another.
   That is the unreadable smear along the bottom of his screenshot. The live rules are `.tabs`
   and `.nav` further down; a second, older answer to the same question is how this happens. */
.nav button.on{color:#0f766e}

   on a Mac, and there everything the phone gets right goes wrong: the tab bar stretched from
   edge to edge while the column it belongs to sat centred at 760px, and the bottom sheet

<!-- Nothing third-party is loaded here. An engineer opens this in a kitchen with one
     bar of signal; it has to start from the copy on the phone and ask for nothing. -->
<script>
(function () {
  "use strict";
/* ==========================================================================
   ENERGY WORLD - SERVICE
   The app the engineer carries. The CRM has the whole service desk in it -
   installations, AMC contracts, the spares price list, the daily due list -
   and none of that is any use to a man standing in somebody's kitchen with a
   spanner. This is that half, and nothing else.

   IT IS THE SAME BOOK. Same name and PIN as the Team CRM, same server, the same
   ServiceInstalls and ServiceVisits sheets in exactly the same row shape. A visit
   recorded here is indistinguishable from one recorded in the CRM, and the CRM is
   not changed in any way by this app existing. No new table was added: the tabs
   this app writes to have been in the backend all along, waiting for a screen.

   WHAT AN ENGINEER SEES. His own installations and his own visits, and nothing
   else - that scoping is done on the SERVER, in teamFilterAll_, so another
   engineer's work never reaches this phone at all.

   TWO KINDS OF WORK, because the owner named two:
     A SERVICE VISIT is against an installation - a purifier, an RO, a softener.
       It has a cycle, it may be under AMC, and finishing it moves the next due
       date forward. This is the work the daily 8am reminder is about.
     A LABOUR JOB has no machine behind it. Plumbing work at a client's site,
       billed for the labour and whatever material went in. Same visit row, no
       installId, and never under AMC.

   MONEY, AND WHEN NOT TO ASK FOR IT. The owner's rule: "AMC is prepaid, spot jobs
   are paid on site." So this app works out whether there is anything to collect
   BEFORE it offers a money screen. A routine service on a live AMC says so and
   asks for nothing. Everything else asks once, plainly, and what he takes is
   written into the same write-journal the Payment app uses - a receipt taken in a
   basement with no signal is kept on the phone and goes up by itself.

   Nothing here deletes anything, ever. A visit is a row added.
   ========================================================================== */

  var APP_VERSION = "1.11.2";
  var GAS = "https://script.google.com/macros/s/AKfycbzVkPHWyPq-w8RFD_HdG0vCjmrfQvEUpcq_hhF9eDGa0ZbZ3rIx7N37an2DQRGmsxPK/exec";
  var STORE = "ew_service_session";

  var SNAP  = "ew_service_snap";
  var BIO_KEY = "ew_service_bio";
  var CRM_URL = "../team/";
  var S = { user:"", pin:"", role:"", data:null, tab:"today", q:"", sheet:null, busy:false,
            syncAt:0, fastAt:0, restAt:0, job:null, vis:null, pick:null, open:"", accOpen:"" };

  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var _toastT = null;
  var _bfIds = ["ew_nag", "ew_sync_banner"];
  var _bfWatch = false;
  var IDB_NAME = "ew_store", IDB_STORE = "kv", _idbP = null;
  var _big = {};
  var API_TIMEOUT = 25000;
  var _wire = [];
  /* The per-action deadlines, the same table and the same reasoning as the other apps: these
     calls are not alike, and a save that is abandoned turns into a man re-typing work the
     server has already written. */
  var API_MS_BY_ACTION = {
    teamSave: 60000,
    teamAuth: 45000,
    teamGet: 60000, catalog: 60000, pdfHost: 240000, tgSend: 60000,
    search: 45000, historicChallan: 45000,
    challanMove: 60000

     Three states, not two. A machine with no nextService date is not "due today" and it
     is not "fine" either - it is a machine nobody has set a cycle for, and saying so is
     the only honest answer. The app must not assert what it cannot know. */
  function dueDays(ins) {
    var d = String((ins && ins.nextService) || "").slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;         /* not known */
    var t = new Date(today() + "T00:00:00").getTime();
    var n = new Date(d + "T00:00:00").getTime();
    if (!isFinite(n)) return null;
    return Math.round((n - t) / 86400000);                   /* negative = overdue */
  }
  function dueBand(ins) {
    var n = dueDays(ins);
    if (n === null) return "unset";
    if (n < 0) return "over";
    if (n <= 7) return "soon";
    return "later";
  }
  function dueSay(ins) {
    var n = dueDays(ins);
    if (n === null) return "no service date set";
    if (n < -1) return Math.abs(n) + " days overdue";
    if (n === -1) return "1 day overdue";
    if (n === 0) return "due today";
    if (n === 1) return "due tomorrow";
    return "due in " + n + " days";
  }

  /* ============ IS THIS MACHINE UNDER AMC, TODAY? ============
     An amcType with no end date is treated as live: the office set a contract and did not
     record when it finishes, and refusing to honour it at a customer's door is the wrong
     way round. An end date in the past is expired, and says so. */
  /* ---- ONE ANSWER TO "IS THIS MACHINE UNDER CONTRACT" (v1.4.4, 20 Aug 2026) ----
     This function read `amcType` with its own eyes while amcCover() read amcKind(). The two
     disagreed the moment "Visit-based" stopped being a contract, and it showed on his screen:
     the card carried an AMC pill and the count said "Under AMC 2", while the sheet opened
     underneath it said "No live AMC ... Everything is charged". Same machine, same screen,
     two answers, and only one of them decides what a customer is charged.

     The money rule wins. amcState now DESCRIBES what amcKind() and amcLiveOn() have decided,
     and cannot drift from them again because it no longer holds an opinion of its own. */
  function amcState(ins) {
    if (!ins) return { live: false, say: "" };
    var t = String(ins.amcType || "").trim();
    if (amcKind(ins) === "None") {
      return { live: false, say: t ? t + " — charged per visit, not a contract" : "No AMC" };
    }
    var end = String(ins.amcEnd || "").slice(0, 10);
    var live = amcLiveOn(ins, today());
    if (live) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(end)) return { live: true, say: t + " (no end date recorded)" };
      var days = Math.round((new Date(end + "T00:00:00").getTime() - new Date(today() + "T00:00:00").getTime()) / 86400000);
      return { live: true, say: t + " to " + dstr(end), endsIn: days };
    }
    /* not live, and the reason matters - "expired" and "has not started" are different
       conversations to have at a customer's door */
    var st = String(ins.installDate || "").slice(0, 10);
    if (/^\d{4}-\d{2}-\d{2}$/.test(st) && today() <= st) {
      return { live: false, say: t + " starts after the machine goes in (" + dstr(st) + ")" };
    }
    return { live: false, say: t + " expired " + dstr(end) };
  }
  /* THE MONEY QUESTION, ASKED ONCE AND IN ONE PLACE.
     "AMC is prepaid, spot jobs are paid on site." So a routine service or a salt refill on
     a live contract is already paid for and this app must not ask the customer for money.
     A repair, an installation or a labour job is not covered, whatever the contract says. */
  /* v1.4.0 - KEPT, AND MADE TO DELEGATE. This was the whole money rule until today: a
     Service or a Salt refill on a live contract was free and everything else was charged. It
     is left standing rather than deleted so that anything still calling it gets the NEW
     answer rather than the old one - a stale second opinion about money is exactly the kind
     of thing that is found six weeks later in a customer's ledger. It now means what it has
     always been read to mean: "is the visit itself free". */
  function amcCovers(ins, type) {
    return amcCover(ins, type, today()).visit;
  }

  /* The engineer's own day. Overdue first, then due soon - the order he would walk it. */
  function dueList() {
    return installs().filter(function (x) {
      if (String(x.status || "").toLowerCase() === "closed") return false;
      var b = dueBand(x);
      return b === "over" || b === "soon";
    }).sort(function (a, b) {
      var da = dueDays(a), db = dueDays(b);
      return (da === null ? 9999 : da) - (db === null ? 9999 : db);
    });
  }
  /* Contracts running out. Not a job - a conversation the office wants to have, and the
     engineer is the one standing in front of the customer. */
  function amcEnding(withinDays) {
    var w = withinDays || 45;
    return installs().filter(function (x) {
      var a = amcState(x);
      return a.live && typeof a.endsIn === "number" && a.endsIn >= 0 && a.endsIn <= w;
    }).sort(function (a, b) { return amcState(a).endsIn - amcState(b).endsIn; });
  }
  /* ---- MINE, AND IT NOW ACTUALLY MEANS MINE (v1.4.3, 20 Aug 2026) ----
     This function has been called myVisits() since the first release and returned EVERY visit
     in the book. The name asserted a filter that was not there, which is exactly how it went
     unnoticed: nobody re-reads a function whose name already answers the question. The result
     was that any of the three engineers could open Account and read the whole firm's money -
     all-time collected, every customer's pending, what the contracts gave away.
     A man's own work is his own work. The book is a separate question, asked by accVisits(). */
  function allVisits() {
    return visits().slice().sort(function (a, b) {
      var x = String(a.date || a.createdAt || ""), y = String(b.date || b.createdAt || "");
      return y < x ? -1 : 1;
    });
  }
  function myVisits() {
    var me = lower(S.user);
    if (!me) return [];
    return allVisits().filter(function (v) { return lower(v.engineer || v.createdBy) === me; });
  }
  /* What the Account tab is allowed to add up for the man looking at it. */
  function accVisits() { return seesAllMoney() ? allVisits() : myVisits(); }

  /* ============ WHAT A VISIT COSTS ============
     One arithmetic, used by the form, the card and the history line. Every figure is a
     number the engineer typed or a price from the spares list - nothing is inferred. */
  function partsTotal(rows) {
    return (rows || []).reduce(function (s, r) { return s + num(r.qty) * num(r.price); }, 0);
  }
  /* Byte-identical to the CRM's. Two screens must never price one visit differently, and
     t_apps_agree.js holds them to it.
     NOTE, deliberately not fixed inside a Service release: both would be better using this
     estate's own num(), which reads "500/-" out of a spreadsheet cell where Number() reads
     zero. Changing the CRM's money arithmetic is its own decision, not a rider on a new app. */
  function visitTotal(v) { return (Number(v.visitCharge) || 0) + (Number(v.saltAmt) || 0) + (Number(v.partsAmt) || 0); }
  /* ---- THE RATES LIVE IN THE PRICE LIST, NOT IN THIS FILE (v1.4.2, 20 Aug 2026) ----
     "Rs 600 per visit, salt cost as spares as per actual, currently its Rs 45 per kg."

     The word in that sentence which decided this design is CURRENTLY. A rate he can say out
     loud today is a rate that will change, and a number typed into this file is a number that
     needs me to change it. Both live as rows in the spares price list instead - which already
     exists, already has an editor in the CRM under Spares, and is today empty.

     A MISSING PRICE LIST MAY NOT INVENT MONEY. With no row the app prefills nothing and
     suggests nothing, exactly as it behaved before this existed. It never guesses a rate. */
  var RATE_VISIT = "VISIT", RATE_SALT = "SALT";
  function rateOf(code) { var s = spareByCode(code); return s ? num(s.price) : 0; }
  /* ============ ONE ANSWER TO "WHAT DOES A BAG COST" (v1.8.2, 30 Aug 2026) ============
     The CRM's Log-a-visit form and this one are two screens that look the same, and on 30 Aug
     they disagreed: this app was fixed to read the master catalogue and the CRM's was not, so
     he was still shown Rs 450 on the other screen and had to tell me twice.

     saltBagPrice, nAmt and SALT_BAG_KG are byte-identical to the CRM's. Both forms and the
     service check now read the same function, so a price cannot differ by which screen you
     happen to have open. */
  function nAmt(v) {
    if (typeof v === "number") return isFinite(v) ? v : 0;
    var t = String(v === undefined || v === null ? "" : v).replace(/[^0-9.\-]/g, "");
    var n = Number(t);
    return isFinite(n) ? n : 0;
  }
  var SALT_BAG_KG = 25;
  function saltCatPrice() {
    var kg = nAmt((PRODUCTS.filter(function (p) { return String(p.code || "").toUpperCase() === "TABSALT"; })[0] || {}).price);
    return kg > 0 ? Math.round(kg * SALT_BAG_KG) : 0;
  }
  function saltBagPrice() { return saltCatPrice(); }
  /* the client's own highest previous visit charge - byte-identical to the CRM's */
  function dgKey(s) {
    return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
  }
  function clientVisitCharge(client) {
    var k = dgKey(client), best = 0;
    ((S.data && S.data.visits) || []).forEach(function (v) {
      if (dgKey(v.client) !== k) return;
      if (isCancelled("visits", v.id)) return;
      var c = nAmt(v.visitCharge);
      if (c > best) best = c;
    });
    return best;
  }
  var MIN_VISIT = 500;

  /* The standard visit charge, and the three cases where there ISN'T one:
     a labour job is quoted per job and has no standard rate; a visit the contract covers must
     not be given a figure at all, because the screen is about to say "collect nothing"; and a
     price list with no VISIT row has nothing to offer. */
  function defaultCharge(ins, type, date) {
    if (!ins) return "";
    if (amcCover(ins, type, date).visit) return "";
    /* v1.9.0 - HIS rate, and ONLY his rate. t_service_money has held this line since the
       start and it caught the first cut of this change: "a missing price list may not invent
       money, which is the whole reason the number is not typed into the app". A client never
       visited gets an EMPTY box and a line saying so - not a number somebody made up. */
    var r = clientVisitCharge(ins.client);
    return r > 0 ? String(r) : "";
  }

  function spareByCode(code) {
    var k = lower(code);
    var a = spares();
    for (var i = 0; i < a.length; i++) if (lower(a[i].code) === k) return a[i];
    return null;
  }
  function spareCats() {
    var seen = {}, out = [];
    spares().forEach(function (s) {
      var c = String(s.category || "Other").trim() || "Other";
      if (!seen[c]) { seen[c] = 1; out.push(c); }
    });
    return out.sort(alpha);
  }



  /* ==========================================================================
     THE COMPLAINT LOOP  (v1.6.0, 21 August 2026)

     Until the backend went to V102 a customer complaint landed on a sheet marked "Open",
     fired one Telegram message, and was never read again by anything. No screen showed it, the
     tab was not even in the list the apps were allowed to pull, and nothing ever set that
     "Open" to anything else. The loop was open at both ends.

     A COMPLAINT IS A SERVICE CALL THE CUSTOMER RAISED INSTEAD OF THE OFFICE. So it does not
     get an app of its own - it arrives where service calls already live, at the top of Today,
     and the visit that fixes it is what closes it.

     HIS THREE ANSWERS, asked before any of this was built:
       money       - "free if under warranty or AMC, else normal"
       who takes it- "any engineer can take it"
       closing     - "tell the customer on WhatsApp, with a check screen first"
     ========================================================================== */
  var CX_KEY = "ew_service_cx_v1";

  function complaints() { return (S.cx && S.cx.rows) || []; }

  /* Its own call, not part of the book: Complaints is keyed on Ref rather than id, and the
     generic reader drops any row without an id. Kept on the phone so a complaint raised at
     eight is still on the screen in a basement at eleven with no signal. */
  function cxSave() { try { localStorage.setItem(CX_KEY, JSON.stringify(S.cx || {})); } catch (e) {} }
  function cxLoad() {
    try { var r = JSON.parse(localStorage.getItem(CX_KEY) || "null"); if (r && r.rows) S.cx = r; }
    catch (e) {}
  }
  function cxPull() {
    return api("complaintList", {}, 20000).then(function (r) {
      if (!r || !r.ok || !Array.isArray(r.complaints)) return false;
      S.cx = { rows: r.complaints, at: Date.now() };
      cxSave();
      return true;
    }).catch(function () { return false; });
  }
  function cxOpen(c) { return !/^closed$/i.test(String((c && c.Status) || "")); }
  function openComplaints() {
    return complaints().filter(cxOpen).sort(function (a, b) {
      /* oldest first: a complaint is a customer already let down, and the longest wait is the
         worst one */
      return String(a.Timestamp || "").localeCompare(String(b.Timestamp || ""));
    });
  }
  function cxDays(c) {
    var t = Date.parse(String((c && c.Timestamp) || ""));
    if (!isFinite(t)) return null;
    return Math.max(0, Math.round((Date.now() - t) / 86400000));
  }
  /* the same join the CRM's dossier uses: the last ten digits of a mobile, because the book
     holds "+91 98120 83516", "098120-83516" and "9812083516" for the same man */
  function cxMob(v) { return String(v == null ? "" : v).replace(/\D+/g, "").slice(-10); }
  function cxInstall(c) {
    var m = cxMob(c && c.Mobile);
    if (!m) return null;
    return installs().filter(function (i) { return cxMob(i.mobile) === m; })[0] || null;
  }
  function cxWho(c) {
    var ins = cxInstall(c);

  /* ---- WARRANTY, lifted from the CRM so the two cannot disagree ---- */
  function ymdLocal(d) {
    if (!d || isNaN(d.getTime())) return "";

      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function warrantyEnd(p) {
    var m = Number(p.warrantyMonths) || 0; if (!m) return "";
    var base = dstr(p.commDate) || dstr(p.installDate); if (!base) return "";
    var d = new Date(base + "T00:00:00"); d.setMonth(d.getMonth() + m);
    return ymdLocal(d);
  }
  /* ANY product still in warranty makes the visit free. A machine is one machine to the man
     who owns it; asking an engineer at the door which of three products failed, to decide
     whether the CALL is chargeable, is a question the customer would rightly not accept. */
  function inWarranty(ins, date) {
    if (!ins) return false;
    var d = String(date || today()).slice(0, 10);
    var prods = [];
    try { prods = JSON.parse(ins.productsJson || "[]") || []; } catch (e) { prods = []; }
    if (!prods.length) prods = [{ installDate: ins.installDate, warrantyMonths: ins.warrantyMonths }];
    return prods.some(function (p) {
      var end = warrantyEnd(p || {});
      return /^\d{4}-\d{2}-\d{2}$/.test(end) && end >= d;
    });
  }

     customer would have bought anyway, and giving away a bag because a machine had a fault is
     not what he said and not what anyone means. Where the AMC is the thing that covers it,
     amcCover() decides exactly as it does for any other visit - one rule, not two. */
  function complaintCover(ins, type, date) {
    var amc = amcCover(ins, type, date);
    if (String(type || "") === "Installation") return amc;

  /* ============================================================================
     THE SERVICE ACCOUNT.  (v1.4.0, 20 August 2026)

     "proper service account manage system" - and "collected or pending".

     Until today this app could tell a man what to do and let him record what he did, and then
     the money simply stopped being anybody's business. Every rupee was on a visit row and no
     screen ever added them up, so "how much is outstanding on service" could only be answered
     by opening the sheet.

     THREE NUMBERS, AND THEY ARE NOT THE SAME NUMBER.

       WORK DONE  - the gross: charge + salt + spares, contract or no contract. This is what
                    tells him whether an AMC is priced right, and it is the number that
                    disappears entirely if you only ever look at revenue.
       CHARGED    - what the customer was actually asked for, after the contract had its say.
       COLLECTED  - what the engineer actually took. The gap is PENDING, and it is the whole
                    reason this screen exists.

     PENDING IS RECOMPUTED, NOT READ. Visit rows written before today carry a `balance` from
     the old rule, under which an AMC-covered visit was stored with its gross total and
     nothing collected - so every one of them looks like a debt. Reading that column would
     have shown a dozen loyal AMC customers as defaulters on their first sight of this screen.
     Every figure here is worked out again from the visit and the contract as it stood ON THE
     DAY, so the history is right without one stored row being touched. */
  function accMonth(d) { var t = dstr(d10(d)); return t && t.length >= 7 ? t.slice(0, 7) : ""; }

  function accRows() {
    return accVisits().map(function (v) {
      var ins = v.installId ? installById(v.installId) : null;
      return {
        v: v, ins: ins,
        m: accMonth(v.date || v.createdAt),
        work: visitTotal(v),
        due: visitDue(v, ins),
        got: num(v.collected),
        pend: visitPending(v, ins)
      };
    });
  }

  function viewAccount() {
    var rows = accRows();
    if (!rows.length) {
      return '<div class="empty">' + (seesAllMoney()
        ? 'No visits recorded yet, so there is no money to account for.'
        : 'You have not recorded a visit yet, so there is no money to account for. ' +
          'Everything you record shows up here the moment you save it.') + '</div>';
    }
    var thisM = accMonth(today());
    var sum = function (list, k) { return list.reduce(function (a, r) { return a + r[k]; }, 0); };
    var mine = rows.filter(function (r) { return r.m === thisM; });
    var owed = rows.filter(function (r) { return r.pend > 0.5; });

    /* ---- WHOSE MONEY IS ON THIS SCREEN (v1.4.3) ----
       "accounts and admin able to see all financial , like total earning / service staff only
        able to see which service charge pending and which got"

       Same screen, two readings of it. accRows() has already narrowed the rows; what changes
       here is which TOTALS are drawn. An engineer gets the two he was promised - what is
       pending and what he got - and is not shown the firm's all-time takings or what the
       contracts gave away, because neither is a question he is being asked to answer. */
    var full = seesAllMoney();

    var h = '<div class="stats">' +
      '<div class="stat"><div class="n">' + esc(money9(sum(mine, "got"))) + '</div><div class="l">' +
        (full ? 'Collected this month' : 'You collected this month') + '</div></div>' +
      '<div class="stat' + (sum(rows, "pend") > 0.5 ? ' bad' : '') + '"><div class="n">' +
        esc(money9(sum(rows, "pend"))) + '</div><div class="l">' +
        (full ? 'Pending, all of it' : 'Pending on your visits') + '</div></div>' +
      (full
        ? '<div class="stat"><div class="n">' + esc(money9(sum(rows, "got"))) + '</div><div class="l">Collected, all time</div></div>'
        : '') +
      '<div class="stat"><div class="n">' + rows.length + '</div><div class="l">' +
        (full ? 'Visits' : 'Your visits') + '</div></div>' +
      '</div>';

    if (!full) {
      h += '<div class="note">This is <b>your own work</b> - the visits you recorded. The firm\'s ' +
        'total is the office\'s to read.</div>';
    }

    /* WHAT THE CONTRACTS GAVE AWAY. Not a loss - it is what he sold - but it is the only
       number that answers "is the AMC priced right", and nothing has ever shown it.
       v1.4.3 - a pricing question, so it is the office's. */
    var freeM = sum(mine, "work") - sum(mine, "due");
    if (full && freeM > 0.5) {
      h += '<div class="note">Under AMC this month: <b>' + esc(money9(freeM)) + '</b> of work done ' +
        'and not charged. That is what the contracts bought.</div>';
    }

    /* ---- WHO OWES ---- */
    if (owed.length) {
      var by = {}, order = [];
      owed.forEach(function (r) {
        var k = lower(r.v.client || "(no name)");
        if (!by[k]) { by[k] = { name: r.v.client || "(no name)", pend: 0, n: 0, rows: [] }; order.push(k); }
        by[k].pend += r.pend; by[k].n++; by[k].rows.push(r);
      });
      order.sort(function (a, b) { return by[b].pend - by[a].pend; });
      h += '<h3 class="sec bad">' + (full ? 'Pending' : 'Pending on your visits') + ' — ' +
        esc(money9(sum(owed, "pend"))) + ' from ' +
        order.length + ' customer' + (order.length === 1 ? '' : 's') + '</h3>';
      order.forEach(function (k) {
        var c = by[k], open = S.accOpen === k;
        h += '<div class="card" data-act="acc-open" data-k="' + esc(k) + '">' +
          '<div class="row"><div class="grow"><div class="ttl">' + esc(c.name) + '</div>' +
          '<div class="meta">' + c.n + ' visit' + (c.n === 1 ? '' : 's') + ' not settled' +
            /* v1.11.0 - the office's ledger beside ours, never added into it */
            (function () { var a = dueOnAcct(c.name);
              return (a !== null && a > 0.5)
                ? ' &middot; <b style="color:#b45309">' + esc(money9(a)) + '</b> on account' : ''; })() +
          '</div></div>' +
          '<div class="right"><div class="amt bad">' + esc(money9(c.pend)) + '</div></div></div></div>';
        if (open) h += c.rows.map(function (r) { return histRow(r.v, r.ins); }).join("");
      });
    } else {
      h += '<div class="empty ok"><b>Nothing pending.</b><br>' +
        'Every visit you have recorded is either settled or covered by a contract.</div>';
    }

    /* ---- THIS MONTH, LINE BY LINE ---- */
    h += '<h3 class="sec">This month — ' + mine.length + ' visit' + (mine.length === 1 ? '' : 's') + '</h3>';
    h += mine.length
      ? '<div class="billbox">' +
          '<div class="bill"><span>Work done</span><b>' + esc(money9(sum(mine, "work"))) + '</b><i>&nbsp;</i></div>' +
          (full ? '<div class="bill"><span>Covered by AMC</span><b>' + esc(money9(freeM)) + '</b><i>&nbsp;</i></div>' : '') +
          '<div class="bill"><span>Charged</span><b>' + esc(money9(sum(mine, "due"))) + '</b><i>&nbsp;</i></div>' +
          '<div class="bill"><span>Collected</span><b>' + esc(money9(sum(mine, "got"))) + '</b><i>&nbsp;</i></div>' +
          '<div class="bill tot"><span>Still to come</span><b>' + esc(money9(sum(mine, "pend"))) + '</b><i>&nbsp;</i></div>' +
        '</div>' + mine.map(function (r) { return histRow(r.v, r.ins); }).join("")
      : '<div class="empty">Nothing recorded this month yet.</div>';
    return h;
  }

  /* ---- MY HISTORY ---- */
  function viewHistory() {
    var list = myVisits();

    var h = '<div class="stats">' +

      '<div class="stat"><div class="n">' + esc(money9(money)) + '</div><div class="l">Collected</div></div>' +

  function money9(n) { return money(num(n)); }

  function searchBox(ph) {
    return '<div class="srch"><input id="q" placeholder="' + esc(ph) + '" value="' + esc(S.q) + '"/></div>';
  }


  /* ================= THE MACHINE, AND ITS HISTORY ================= */
  /* ---- ONE VISIT, WRITTEN OUT (v1.4.0) ----
     "serviced on ---", "spares delivered if any", "salt, service charge, collected or
     pending". All four are on this row, and the pending figure is recomputed from the
     contract AS IT STOOD ON THE DAY - not as it stands today. A customer whose AMC lapsed in
     June must not suddenly appear to owe for a service he had in March. */
  function histRow(v, ins) {
    var g = visitTotal(v), dueAmt = visitDue(v, ins), pend = visitPending(v, ins);
    var cov = amcCover(ins, v.type, v.date);
    var bits = [];
    if (num(v.visitCharge)) bits.push("charge " + money9(num(v.visitCharge)) + (cov.visit ? " (AMC)" : ""));
    if (num(v.saltAmt) || num(v.saltBags)) bits.push("salt " + (num(v.saltBags) ? num(v.saltBags) + " bag" + (num(v.saltBags) === 1 ? "" : "s") + " " : "") +
      money9(num(v.saltAmt)) + (cov.salt ? " (AMC)" : ""));
    if (num(v.partsAmt)) bits.push("spares " + money9(num(v.partsAmt)) + (cov.parts ? " (AMC)" : ""));
    return '<div class="card sm"><div class="row"><div class="grow">' +
      '<div class="ttl">' + esc(v.type || "visit") + ' &middot; ' + esc(dstr(v.date)) +
        (v.engineer ? ' &middot; ' + esc(v.engineer) : '') + '</div>' +
      (v.partsUsed ? '<div class="meta"><b>Spares:</b> ' + esc(v.partsUsed) + '</div>' : '') +
      (bits.length ? '<div class="meta">' + esc(bits.join(" · ")) + '</div>' : '') +
      (v.notes ? '<div class="meta">' + esc(v.notes) + '</div>' : '') +
      /* v1.10.0 - AND THE PHOTOGRAPHS, which until today were write-only. picsOf() has taken a
         visit id since v1.7.0 and nothing ever called it with one: the only call in the file
         asked for the machine. Every fault and completed-work photo any engineer has taken was
         uploaded, stored, and never shown to anybody again. */
      picStrip(picsOf("receipt", v.id), "Signed receipt") +
      picStrip(picsOf("visit", v.id), "On this visit") +
      '</div><div class="right">' +
      '<div class="amt">' + esc(money9(dueAmt)) + '</div>' +
      (g > dueAmt ? '<div class="meta">' + esc(money9(g)) + ' of work</div>' : '') +
      (num(v.collected) ? '<div class="pill got">took ' + esc(money9(v.collected)) + '</div>' : '') +
      (pend > 0.5 ? '<div class="pill due">' + esc(money9(pend)) + ' pending</div>'
                  : (dueAmt <= 0 ? '<div class="pill amc">AMC</div>' : '<div class="pill got">settled</div>')) +
      '</div></div></div>';
  }

  function sheetJob(ins) {
    if (!ins) return "";
    var a = amcState(ins), band = dueBand(ins), hist = visitsFor(ins.id);
    var h = '<h2>' + esc(ins.client || "(no name)") + '</h2>' +
      '<div class="muted">' + esc([ins.product, ins.model].filter(Boolean).join(" · ") || "machine not named") +
        (ins.serial ? ' &middot; serial ' + esc(ins.serial) : '') + '</div>';

    h += '<div class="kv">' +
      kv("Area", ins.area || NO_AREA) +
      kv("Address", ins.address || "—") +
      kv("Mobile", ins.mobile || "—") +
      kv("Installed", ins.installDate ? dstr(ins.installDate) : "—") +
      kv("Water", ins.waterQuality || "—") +
      kv("Cycle", ins.cycleDays ? num(ins.cycleDays) + " days" : "not set") +
      kv("Last service", ins.lastService ? dstr(ins.lastService) : "none recorded") +
      kv("Next due", ins.nextService ? dstr(ins.nextService) + " — " + dueSay(ins) : "not set") +
      '</div>';

    /* ---- THE CONTRACT (v1.4.0) ----
       "client under AMC, AMC with spare or without spare, AMC amt". A card rather than a line
       in the table, because the engineer standing at the machine is about to decide what to
       charge and this is the thing that decides it. */
    {
      var kind = amcKind(ins), liveNow = amcLiveOn(ins, today());
      h += '<div class="amccard ' + (liveNow ? 'on' : 'off') + '">' +
        '<div class="row"><div class="grow"><b>' + esc(liveNow ? kind : "No live AMC") + '</b>' +
        (liveNow && ins.amcAmount ? ' <span class="pill">' + esc(money9(num(ins.amcAmount))) + '</span>' : '') +
        '</div><div class="right">' +
        (liveNow ? '<span class="pill amc">live</span>' : '') + '</div></div>' +
        '<div class="meta">' + esc(a.say || "No AMC") +
        (liveNow && a.endsIn !== undefined ? ' · ' + a.endsIn + ' days left' : '') + '</div>' +
        (liveNow
          ? '<div class="meta">' + (kind === "AMC with spares"
              ? 'Visit, salt and spares are all covered. Collect nothing.'
              : 'Visit and salt are covered. Spares are charged.') + '</div>'
          : '<div class="meta">Everything is charged. The office renews an AMC in the CRM.</div>') +
        '</div>';
    }

    /* v1.11.0 - before the phone numbers, because what he is owed decides what is said on
       the call as much as it decides what is collected at the door. */
    h += moneyStrip(ins.client);

    if (ins.mobile) {
      var n = String(ins.mobile).replace(/\D/g, ""); if (n.length === 10) n = "91" + n;
      h += '<div class="row gap">' +
        '<a class="btn gry grow" href="tel:' + esc(ins.mobile) + '">Call</a>' +
        '<a class="btn gry grow" target="_blank" rel="noopener" href="https://wa.me/' + esc(n) + '">WhatsApp</a>' +
        '</div>';
    }

    h += '<div class="acts"><button class="btn grow" data-act="do-visit" data-id="' + esc(ins.id) + '">' +
      'Record a visit</button></div>';

    h += '<h3 class="sec">Service history</h3>';
    h += hist.length
      ? hist.map(function (v) { return histRow(v, ins); }).join("")
      : '<div class="empty sm">No visit has been recorded against this machine yet. ' +
        'That is not the same as never serviced — work done before this app existed is not here.</div>';

    h += '<div class="acts" style="margin-top:14px"><button class="btn gry grow" data-act="close">Close</button></div>';
    return h;
  }
  function kv(k, v) { return '<div class="kvr"><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'; }

  /* ================= RECORDING WHAT WAS DONE =================
     The one form this app exists for. It is deliberately in this order: what kind of work,
     what went into it, what it comes to, and only then - if there is anything to take -
     what was taken. */
  function sheetVisit(v) {
    var ins = v.installId ? installById(v.installId) : null;
    var pTot = partsTotal(v.parts);
    var gross = num(v.visitCharge) + num(v.saltAmt) + pTot;
    var cover = amcCover(ins, v.type, v.date);
    var due = (cover.visit ? 0 : num(v.visitCharge)) +
              (cover.salt  ? 0 : num(v.saltAmt)) +
              (cover.parts ? 0 : pTot);
    var covered = due <= 0 && gross > 0;
    var total = due;

    var h = '<h2>' + (ins ? esc(ins.client || "") : 'Labour job') + '</h2>' +
      '<div class="muted">' + (ins
        ? esc([ins.product, ins.model].filter(Boolean).join(" · ") || "machine not named")
        : 'Plumbing work with no machine behind it') + '</div>';

    /* --- what kind of work --- */
    h += '<label>What was done</label><div class="chips">' +
      JOB_TYPES.filter(function (t) { return ins ? t !== "Labour job" : t === "Labour job"; })
        .map(function (t) {
          return '<button class="chip' + (v.type === t ? ' on' : '') + '" data-act="v-type" data-t="' + esc(t) + '">' +
            esc(t) + '</button>';
        }).join("") + '</div>';

    /* --- who it is for, when there is no machine --- */
    if (!ins) {
      h += '<label>Customer</label>' + clientPicker(v.client) +
        '<label>Area</label><input id="v_area" value="' + esc(v.area || "") + '" placeholder="Which area"/>';
    }

    h += '<label>Date</label><input id="v_date" type="date" value="' + esc(v.date || today()) + '"/>';

    /* --- salt, only where salt is a thing --- */
    if (v.type === "Salt refill") {
      h += '<div class="grid2">' +
        '<div><label>Salt bags</label><input id="v_bags" inputmode="numeric" value="' + esc(v.saltBags || "") + '"/></div>' +
        '<div><label>Salt amount</label><input id="v_saltamt" inputmode="numeric" value="' + esc(v.saltAmt || "") + '"/></div>' +
        '</div>' +
        /* "as per actual" is his rule, so the amount stays typed. The rate is shown so the
           man on the doorstep is doing the sum against today's price and not last year's. */
        (function () {
          /* v1.8.2 - the bag, because bags are what he counts on this screen, and the per-kg
             rate underneath so the arithmetic is visible rather than magic. */
          var bag = saltBagPrice(), kg = bag ? Math.round(bag / SALT_BAG_KG) : 0;
          if (bag > 0) return '<div class="meta">A bag is ' + esc(money9(bag)) + ' on the price list' +
            (kg > 0 ? ' (' + esc(money9(kg)) + ' per kg \u00d7 ' + SALT_BAG_KG + ' kg)' : '') +
            ' &mdash; charge the actual.</div>';
          if (kg > 0) return '<div class="meta">Salt is ' + esc(money9(kg)) + ' per kg in the price list &mdash; charge the actual.</div>';
          return '<div class="meta bad">No salt price in the catalogue yet &mdash; the office prices TABSALT on the Products sheet.</div>';
        })();
    }

    /* --- parts --- */
    h += '<label>Parts used</label>';
    if (v.parts && v.parts.length) {
      h += '<div class="prow" style="padding-bottom:2px"><div class="grow"><span class="muted" ' +
        'style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase">Item</span></div>' +
        '<span class="muted" style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;width:64px;text-align:center">Qty</span>' +
        '<span class="muted" style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;width:64px;text-align:center">Rate</span>' +
        '<span class="muted" style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;width:74px;text-align:right">Amount</span>' +
        '<span style="width:28px"></span></div>';
    }
    h += (v.parts && v.parts.length)
      ? '<div class="parts">' + v.parts.map(function (p, i) {
          return '<div class="prow"><div class="grow"><b>' + esc(p.name) + '</b>' +
            '<div class="meta">' + esc(p.code || "") + ' &middot; ' + esc(money9(p.price)) + ' each</div></div>' +
            /* v1.9.0 - "in service spare part list also same item name , qty , rate amount
               provision". The rate is now typed here, exactly as it is on the CRM's form: the
               catalogue fills it, and the man on the doorstep can change it for the one job
               where it was different, without the office having to reprice a product. */
            '<input class="qty" data-act="v-qty" data-i="' + i + '" inputmode="decimal" value="' + esc(p.qty) + '"/>' +
            '<input class="qty" data-act="v-rate" data-i="' + i + '" inputmode="decimal" value="' + esc(p.price) + '"/>' +
            '<div class="amt">' + esc(money9(num(p.qty) * num(p.price))) + '</div>' +
            '<button class="x" data-act="v-drop" data-i="' + i + '">&times;</button></div>';
        }).join("") + '</div>'
      : '<div class="empty sm">Nothing yet.</div>';
    h += '<div class="row" style="margin-top:6px">' +
      '<button class="btn sm gry" data-act="v-parts">+ Add a part</button>' +
      '<div class="grow"></div>' +
      (pTot ? '<div class="amt">' + esc(money9(pTot)) + '</div>' : '') + '</div>';

    /* --- the charge --- */
    h += '<label>Visit / labour charge</label>' +
      '<input id="v_charge" inputmode="numeric" value="' + esc(v.visitCharge || "") + '" placeholder="0"/>' +
      (function () {
        /* 30 Aug 2026 - HIS rate, not a spares row. "once a service charge enteerd for a
           client first time , remember that for all future , pick highest if changed". */
        if (cover.visit) return '';
        var mine = clientVisitCharge(v && v.client);
        if (mine > 0) return '<div class="meta">' + esc(money9(mine)) + ' is the most this client has been charged before &mdash; change it if this one was different.</div>';
        return '<div class="meta bad">This client has never been charged for a visit &mdash; type what was agreed. Nothing is suggested, because nothing is known.</div>';
      })();

    /* ============ THE BILL, LINE BY LINE (v1.4.0) ============
       "salt, service charge, collected or pending". Three amounts go into a visit and the
       contract may forgive any of them, so the screen shows each one and says which. An
       engineer standing in front of a customer should be able to read this out. */
    {
      var line = function (label, amt, free) {
        if (!amt) return "";
        return '<div class="bill' + (free ? ' free' : '') + '"><span>' + esc(label) + '</span>' +
          '<b>' + esc(money9(amt)) + '</b>' +
          '<i>' + (free ? 'covered by ' + esc(cover.kind) : 'to collect') + '</i></div>';
      };
      h += '<div class="billbox">' +
        line("Visit / labour charge", num(v.visitCharge), cover.visit) +
        line("Salt" + (num(v.saltBags) ? " · " + num(v.saltBags) + " bag" + (num(v.saltBags) === 1 ? "" : "s") : ""),
             num(v.saltAmt), cover.salt) +
        line("Spares fitted", pTot, cover.parts) +
        '<div class="bill tot"><span>To collect</span><b>' + esc(money9(due)) + '</b>' +
        '<i>' + (gross > due ? esc(money9(gross - due)) + ' covered' : '&nbsp;') + '</i></div>' +
        '</div>';
    }

    /* ============ THE MONEY QUESTION, ASKED ONLY WHEN THERE IS ONE ============
       The owner's rule is that AMC is prepaid. So on a live contract this screen says so
       and asks for nothing - an engineer must never be put in the position of asking a
       customer for money he has already paid. */
    if (covered) {
      h += '<div class="amcbox"><b>Under AMC — nothing to collect.</b><br>' +
        esc(cover.kind) + ', ' + esc(amcState(ins).say) + '. ' +
        esc(money9(gross)) + ' of work, already paid for.</div>';
    } else if (total > 0) {
      h += '<label>Taken now</label>' +
        '<input id="v_got" inputmode="numeric" value="' + esc(v.collected == null ? "" : v.collected) + '" placeholder="0"/>' +
        '<div class="meta">Leave it blank if the customer is paying the office later. ' +
        'Whatever you type here is money you are carrying.</div>';
      var bal = total - num(v.collected);
      if (v.collected !== "" && v.collected != null && bal > 0.5)
        h += '<div class="note warn-t">' + esc(money9(bal)) + ' still owing after this.</div>';
    }

    h += '<label>Note</label><textarea id="v_note" rows="2" placeholder="What you found, what you did">' +
      esc(v.notes || "") + '</textarea>';

    /* v1.7.0 - the three photographs, and anything already taken on this machine */
    h += picPickers(v) + picPending(v);
    if (ins) h += picStrip(picsOf("machine", ins.id), "On this machine");

    h += '<div class="acts"><button class="btn gry" data-act="close">Cancel</button>' +
      '<button class="btn grow" data-act="v-save">Save the visit</button></div>';
    return h;
  }

  /* A customer for a labour job. The engineer types, the list narrows - the same shape the
     other apps use, because a man should not learn two ways to pick a name. */
  function clientPicker(cur) {

  /* ---- the spares picker ---- */
  /* ---- A SPARE WITH NO PRICE (v1.5.0) ----
     Read off the live list on 20 Aug: 27 spares, and TWENTY-SIX of them carry no price at
     all. Only SL-001, the salt bag, has one. So `+ Add a part` was quietly putting zero-rupee
     lines on customers' bills - the part recorded, the money not - and the only place it
     showed was a total that came out lower than it should have, which is the one place nobody
     checks against anything.

     The rule of this estate is that an app says what is true. It cannot invent a price and it
     will not pretend one exists: the card says NO PRICE SET, the part still goes on the visit
     because the customer did receive it, and the engineer is told to write the amount in. */
  function sparePriced(s) { return num(s && s.price) > 0; }
  /* ---- ONE SEARCH BOX OVER THE WHOLE PRICE LIST (v1.8.0) ----
     "only with search box type and select item or item with item code" - so it matches on the
     description AND the code, and shows both on every row. The master catalogue first because
     that is the priced one; the service-only spares underneath, still available, still saying
     out loud when they carry no price. */
  function partRows(q) {
    var out = [];
    PRODUCTS.forEach(function (p) {
      if (q && lower([p.code, p.desc, p.family, p.brand].join(" ")).indexOf(q) < 0) return;
      out.push({ code: p.code, name: p.desc, unit: p.unit || "", note: p.brand || "",
                 price: num(p.price), src: "list" });
    });
    /* 30 Aug 2026 - the service spares tab used to be appended here. It is not read for a
       price any longer: one list, and it is the master catalogue. See the note in the CRM. */
    return out;
  }
  function sheetParts() {
    catReady();                      /* costs nothing once the shelf is warm */
    var q = lower(S.q);
    var all = partRows(""), list = partRows(q);
    var h = '<h2>Add a part</h2>' + searchBox("Type a name or an item code") +

    if (!PRODUCTS.length && !_catP) {
      h += '<div class="note warn-t"><b>The master price list has not reached this phone.</b> ' +
        'You can still pick from the service spares below and write the amount in by hand.</div>';
    }
    /* v1.4.x kept, v1.8.0 recounted. It used to read "26 of 27 spares have no price" off the
       service spares tab; the picker now reads the master list too, so it counts what is
       actually in front of him. The rule it protects is unchanged and is the reason the count
       is here at all: `+ Add a part` was quietly putting zero-rupee lines on customers' bills. */
    var noPrice = all.filter(function (x) { return !(x.price > 0); }).length;
    if (noPrice) {
      h += '<div class="note warn-t"><b>' + noPrice + ' of ' + all.length + ' items have no ' +
        'price on the list.</b> They can still go on the visit &mdash; the customer had the part ' +

        '<div class="row"><div class="grow"><div class="ttl">' + esc(s2.name) + '</div>' +
        '<div class="meta">' + esc(s2.code || "") + (s2.note ? ' &middot; ' + esc(s2.note) : '') + '</div></div>' +
        '<div class="right"><div class="amt' + (s2.price > 0 ? '' : ' bad') + '">' +
          (s2.price > 0 ? esc(money9(s2.price)) : 'no price set') + '</div>' +
          (s2.unit ? '<div class="meta">per ' + esc(String(s2.unit).replace(/^per\s+/i, "")) + '</div>' : '') +
